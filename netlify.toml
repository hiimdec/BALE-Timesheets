# =====================================================================
# X-Robots-Tag: noindex, nofollow - second layer on the blocked paths, in
# case one is ever served despite the above. Applied per exact path / dir,
# NOT via blanket *.ext (unreliable) and NOT to robots.txt / manifest.json /
# sitemap.xml (which must stay indexable).
# =====================================================================
[[headers]]
  for = "/ios/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/scripts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/brand/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/package.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/package-lock.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/capacitor.config.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/postcode-distances.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/tailwind.config.js"
