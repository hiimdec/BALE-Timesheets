# netlify.toml - TimeMachine web build + edge hardening (web chunk 2)
#
# PRIMARY control is now an ALLOW-LIST PUBLISH DIRECTORY. The build step
# (scripts/build-web.js) copies ONLY explicitly-named web files into dist-web/,
# and Netlify publishes that folder. Anything not on the allow-list - internal
# docs, the native iOS project, build tooling, /src, and any newly added repo
# file - is simply not present in the publish directory, so it 404s by default.
# The deploy fails CLOSED: nothing is publishable unless it is explicitly named.
#
# The exact-path and directory 404 rules further down are kept as a SECOND LAYER
# (defence in depth) so that, if the publish directory were ever reverted to the
# repo root, the previously-leaking paths would still be blocked.
#
# Removed from chunk 1.5: the blanket *.ext redirect/header rules (Netlify does
# not reliably match a splat placed before a suffix, so they did nothing useful
# and implied a protection that was not there), and the allow-list 200 self-
# redirects (their only purpose was shielding must-serve files from those blanket
# rules; with an allow-list publish dir they are redundant).
#
# _headers is copied into dist-web/ and still sets the AASA content type there.


# =====================================================================
# BUILD - assemble the web-only publish directory and serve it.
# Both live here (not in the Netlify UI) so the config is reviewable.
# =====================================================================
[build]
  command = "node scripts/build-web.js"
  publish = "dist-web"

[build.environment]
  NODE_VERSION = "20"
  # The web build uses no npm packages. Skip install lifecycle scripts so the
  # native modules in package.json (canvas, sharp) cannot fail the deploy while
  # building binaries the web publish step never uses.
  NPM_FLAGS = "--ignore-scripts"


# =====================================================================
# SECOND-LAYER 404s (defence in depth; the publish allow-list is primary).
# force = true so the rule wins even if a real file exists at the path.
# to = /404.html has no such file, so Netlify returns its default 404 page.
# =====================================================================

# --- Non-web directories ---
#   /ios     - native Xcode project: Swift source, entitlements, Info.plist
#   /scripts - build + audit tooling
#   /brand   - brand assets + the Instagram generator (make_social.py)
#   /docs    - internal design mockups
#   /src     - web-source stylesheet (compiled into the native bundle)
[[redirects]]
  from = "/ios/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/brand/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

