# netlify.toml - TimeMachine edge hardening (web chunk 1.5)
#
# The Netlify publish directory is the repo root, so every tracked file is
# otherwise served at its path. Verified live before this file existed: the
# internal .md docs, package.json, capacitor.config.json, postcode-distances.json,
# tailwind.config.js, /brand/make_social.py, /APA RULES.pdf, and the entire iOS
# native project under /ios (Swift source, App.entitlements, Info.plist), plus
# /scripts, /src and /docs, all returned HTTP 200.
#
# This file 404s those at the edge while keeping the app, the marketing pages,
# the articles, the icons and the PWA / deep-link machinery reachable. It does
# NOT delete anything from the repo - blocking at the edge is the whole job for
# now. The durable fix is a dedicated publish directory (see notes at the end).
#
# HOW NETLIFY EVALUATES THIS:
#   - [[redirects]] are processed top to bottom, FIRST MATCH WINS.
#   - A real file at a path is served IN PREFERENCE to a redirect rule unless
#     that rule sets force = true. Every block rule below therefore uses force,
#     because a real file exists at each blocked path.
#   - So the order is: allow-list the must-stay-reachable files FIRST (nothing
#     after can shadow them), then force-404 everything sensitive.
#   - [[headers]] are additive (there is no first-match for headers). They add
#     the X-Robots-Tag second layer and are deliberately kept OFF /robots.txt,
#     /manifest.json and /sitemap.xml so those are never tagged noindex.
#
# The existing _headers file (which sets the Content-Type for the AASA file) is
# left untouched and still applies.


# =====================================================================
# 1. ALLOW-LIST - these MUST keep returning 200. First, so that no later
#    blanket/extension rule can shadow them.
# =====================================================================
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/.well-known/apple-app-site-association"
  status = 200


# =====================================================================
# 2. BLOCK non-web directories in full. None are referenced by any served
#    page (the only runtime fetch is /assets/tailwind.css, which is NOT in
#    this list). Trailing-splat matching is fully supported by Netlify.
#      /ios     - native Xcode project: Swift source, entitlements, Info.plist
#      /scripts - build + audit tooling
#      /brand   - brand assets + the Instagram generator (make_social.py)
#      /docs    - internal design mockups
#      /src     - web-source stylesheet (compiled into the native bundle)
# =====================================================================
[[redirects]]
  from = "/ios/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/brand/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true


# =====================================================================
# 3. BLOCK sensitive root files by EXACT PATH. This is the guaranteed
#    layer: exact-path + force is fully supported by Netlify, so it holds
#    even if the blanket extension rules in section 4 are not honoured.
#    Covers everything on main today, plus the pact-bectu source files
#    that are in progress on develop (harmless no-ops until they merge).
# =====================================================================

