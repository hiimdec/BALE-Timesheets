# =====================================================================
# 4. BLANKET extension rules - the "block by extension" layer, and defence
#    for any FUTURE root file of these types. Placed AFTER the allow-list
#    so /manifest.json, /robots.txt and /sitemap.xml are never caught.
#    Netlify's support for a splat placed before a suffix is not guaranteed,
#    so these BACK UP the exact-path rules above; they do not replace them.
# =====================================================================
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.pdf"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.txt"
  to = "/404.html"
  status = 404
  force = true


# =====================================================================
# 5. X-Robots-Tag: noindex, nofollow - second layer on the blocked paths,
#    in case a file is ever served despite the rules above. Deliberately
#    NOT applied to /robots.txt, /manifest.json or /sitemap.xml.
# =====================================================================
[[headers]]
  for = "/ios/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/scripts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/brand/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/*.md"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/*.py"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/package.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
