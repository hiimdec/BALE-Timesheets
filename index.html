        ? (sbPillIsRed ? pillRedOpen : pillAmberOpen)
        : (sbPillIsRed ? pillRedClose : pillAmberClose);

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {!fixedCrewId && !allCrewMode && (
            <Field label="Crew Member">
              <Select value={v.crewId} onChange={(e) => set({ crewId: e.target.value })}>
                <option value="">— Select —</option>
                {crew.map((c) => <option key={c.id} value={c.id}>{c.name} ({c.role})</option>)}
              </Select>
            </Field>
          )}
          {!fixedCrewId && allCrewMode && (
            <div className="bg-sky-950/30 border border-sky-800 p-2 rounded-[10px]">
              <div className="text-[10px] uppercase tracking-[0.15em] text-sky-400 font-bold">All Crew Mode</div>
              <div className="text-xs text-neutral-300">Creates a day for each of {crew.length} crew members. Travel & mileage apply to all.</div>
            </div>
          )}
          {!fixedDate && (
            <Field label="Date" hint={v.date ? `${dayLabel}${isWeekend ? " — weekend rate applies" : ""}` : ""}>
              <Input type="date" value={v.date} onChange={(e) => set({ date: e.target.value })} />
            </Field>
          )}
          <Field label="Day Type">
            <Select value={v.dayType} onChange={(e) => onDayTypeChange(e.target.value)}>{DAY_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}</Select>
          </Field>
          {!fixedCrewId && !fixedDate && <div className="hidden md:block" />}

          {isDriverDay && (
            <Field label="Truck Call Time" hint="Pre-unit start — billed at BHR · break deadlines &amp; OT still from call time">
              <TimeInput value={v.truckCallTime || ""} onChange={(e) => set({ truckCallTime: e.target.value })} />
            </Field>
          )}
          <Field label="Call Time" hint={callH !== null && callH < 5 ? "→ Night shoot (pre-5am)" : callH !== null && callH >= 17 ? "→ Night shoot (post-5pm)" : callH !== null && callH >= 5 && callH < 7 && !isTravelDay ? "→ Early call" : callH !== null && callH >= 11 && callH < 17 && !isTravelDay ? "→ Late call (calc from 11:00)" : ""}>
            <TimeInput value={v.callTime} onChange={(e) => onCallChange(e.target.value)} />
          </Field>
          <Field label="Wrap Time" hint={autoNextDay ? "Wrap is next day (auto-detected)" : ""}>
            <TimeInput value={v.wrapTime} onChange={(e) => set({ wrapTime: e.target.value })} />
          </Field>

          {!isTravelDay && (
            <>
              <div className="md:col-span-2 border-t border-neutral-800 pt-3 mt-2">
                <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-2">Lunch (1st Break)</div>
              </div>

              <Field label="Lunch Start Time" hint={bs ? `Deadline: ${toHHMM(bs.lateThreshold)} · CWD threshold: ${toHHMM(bs.cwdThreshold)}` : ""}>
                <TimeInput value={v.lunchStartTime || ""} onChange={(e) => set({ lunchStartTime: e.target.value })} disabled={Number(v.lunchDurationMins) === 0} />
              </Field>
              <Field label="Lunch Duration">
                <Select value={Number(v.lunchDurationMins ?? 60)} onChange={(e) => set({ lunchDurationMins: Number(e.target.value) })}>
                  {LUNCH_DURATIONS.map((s) => <option key={s.v} value={s.v}>{s.label}</option>)}
                </Select>
              </Field>

              {bs && (
                <div className="md:col-span-2">
                  {bs.lunchMissed && bs.cwdApplies && <StatusMsg kind="bad">Lunch missed — Continuous Working Day. OT now starts at {toHHMM(bs.callH + 9)} (9h after call) instead of 11h.</StatusMsg>}
                  {bs.lunchMissed && !bs.cwdApplies && <StatusMsg kind="warn">Lunch missed. Note: CWD doesn't apply to {v.dayType} days.</StatusMsg>}
                  {bs.lunchVeryLate && bs.cwdApplies && <StatusMsg kind="bad">Lunch started after {toHHMM(bs.cwdThreshold)} (6.5h from call) — CWD triggered. OT now starts at {toHHMM(bs.callH + 9)}.</StatusMsg>}
                  {bs.lunchLate && <StatusMsg kind="warn">Late — should have started by {toHHMM(bs.lateThreshold)} (5.5h from call). £10 penalty applied.</StatusMsg>}
                  {!bs.lunchMissed && !bs.lunchLate && !bs.lunchVeryLate && bs.lunchDuration < 60 && <StatusMsg kind="warn">Curtailed by {60 - bs.lunchDuration}m. Ends {toHHMM(bs.lunchEndAbs)}. OT starts {60 - bs.lunchDuration}m earlier.</StatusMsg>}
                  {!bs.lunchMissed && !bs.lunchLate && !bs.lunchVeryLate && bs.lunchDuration === 60 && bs.lunchEndAbs && <StatusMsg kind="ok">On time. Lunch ends {toHHMM(bs.lunchEndAbs)}.</StatusMsg>}
                </div>
              )}

              {bs && (bs.lunchMissed || bs.lunchVeryLate) && (
                <Field label="Meal Provided?" hint="£7.50 allowance if no meal given">
                  <Select value={v.noMealProvided ? "no" : "yes"} onChange={(e) => set({ noMealProvided: e.target.value === "no" })}>
                    <option value="yes">Yes — meal given</option>
                    <option value="no">No — £7.50 allowance</option>
                  </Select>
                </Field>
              )}

              {bs && bs.continuousDay && (
                <>
                  <div className="md:col-span-2 border-t border-red-900/60 pt-3 mt-2">
                    <div className="text-[10px] uppercase tracking-[0.2em] text-red-400 font-bold mb-2">CWD Breaks</div>
                    <div className="text-[11px] text-neutral-400 leading-tight mb-3">APA §6.4: CWD requires a 30m break by {toHHMM(bs.cwd1Deadline)} (9h after call){bs.cwd2Required ? `, and another by ${toHHMM(bs.cwd2Deadline)} (12.5h after call)` : ""}. Missed breaks = 30m × BHR penalty.</div>
                  </div>
                  <Field label={`Break 1 — by ${toHHMM(bs.cwd1Deadline)}`}>
                    <Select value={v.cwdBreak1Given === false ? "no" : "yes"} onChange={(e) => set({ cwdBreak1Given: e.target.value === "yes" })}>
                      <option value="yes">Given</option>
                      <option value="no">Missed (+ 30m × BHR)</option>
                    </Select>
                  </Field>
                  {bs.cwd2Required && (
                    <Field label={`Break 2 — by ${toHHMM(bs.cwd2Deadline)}`}>
                      <Select value={v.cwdBreak2Given === false ? "no" : "yes"} onChange={(e) => set({ cwdBreak2Given: e.target.value === "yes" })}>
                        <option value="yes">Given</option>
                        <option value="no">Missed (+ 30m × BHR)</option>
                      </Select>
                    </Field>
                  )}
                </>
              )}
            </>
          )}

          {/* ── Section pills ── */}
          <div className="md:col-span-2 flex flex-wrap gap-2 pt-3 mt-1 border-t border-neutral-800">
            <button type="button" onClick={() => togglePill("travel")} className={openPill === "travel" ? pillSkyOpen : pillSkyClose}>
              Travel &amp; Mileage
            </button>
            <button type="button" onClick={() => togglePill("perdiem")} className={openPill === "perdiem" ? pillSkyOpen : pillSkyClose}>
              Per Diem
            </button>
            <button type="button" onClick={() => togglePill("stepup")} className={openPill === "stepup" ? (v.stepUpEnabled ? pillAmberOpen : pillSkyOpen) : (v.stepUpEnabled ? pillAmberClose : pillSkyClose)}>
              Step-Up
            </button>
            {show2ndBreakPill && (
              <button type="button" onClick={() => togglePill("2ndbreak")} className={sb2Class}>
                2nd Break
              </button>
            )}
          </div>

          {/* ── Travel & Mileage panel ── */}
          {openPill === "travel" && (
            <>
              {!isTravelDay && (
                <>
                  <Field label="Travel Out (mins)" hint="First hour deducted"><Input type="number" min="0" value={v.travelOutMins || 0} onChange={(e) => set({ travelOutMins: Number(e.target.value) })} /></Field>
                  <Field label="Travel Back (mins)" hint="First hour deducted"><Input type="number" min="0" value={v.travelBackMins || 0} onChange={(e) => set({ travelBackMins: Number(e.target.value) })} /></Field>
                </>
              )}
              <Field label="Mileage (outside M25)" hint="£0.50/mi return from W1F 9SE"><Input type="number" min="0" step="0.1" value={v.miles || 0} onChange={(e) => set({ miles: Number(e.target.value) })} /></Field>
            </>
          )}

          {/* ── Per Diem panel ── */}
          {openPill === "perdiem" && (
            <>
              <Field label="Per Diem">
                <Select value={v.perDiemEnabled ? "yes" : "no"} onChange={(e) => set({ perDiemEnabled: e.target.value === "yes" })}>
                  <option value="no">No per diem</option>
                  <option value="yes">Yes — per diem applies</option>
                </Select>
              </Field>
              {v.perDiemEnabled && (
                <Field label="Per Diem Amount (£)" hint="Added to day total">
                  <Input type="number" min="0" step="0.01" value={v.perDiemAmount ?? 0} onChange={(e) => set({ perDiemAmount: Number(e.target.value) })} />
                </Field>
              )}
            </>
          )}

          {/* ── Step-Up panel ── */}
          {openPill === "stepup" && (
            <>
              <Field label="Step-Up for this day">
                <Select value={v.stepUpEnabled ? "yes" : "no"} onChange={(e) => set({ stepUpEnabled: e.target.value === "yes" })}>
                  <option value="no">No step-up</option>
                  <option value="yes">Stepped-up rate applies</option>
                </Select>
              </Field>
              {v.stepUpEnabled && (
                <>
                  <Field label="Step-Up Role">
                    <Select value={v.stepUpRole || ""} onChange={(e) => {
                      const role = e.target.value;
                      const d = ROLE_DEFAULTS[role] || {};
                      set({ stepUpRole: role, stepUpBDR: d.bdr ?? v.stepUpBDR, stepUpOTCoef: d.otCoef ?? v.stepUpOTCoef, stepUpOTRate: d.otRate ?? null });
                    }}>
                      <option value="">— Select Role —</option>
                      {Object.entries(DEPARTMENTS).map(([dept, roles]) => <optgroup key={dept} label={dept}>{Object.keys(roles).map((r) => <option key={r} value={r}>{r}</option>)}</optgroup>)}
                    </Select>
                  </Field>
                  <Field label="Step-Up BDR (£)" hint="Override for this day only">
                    <Input type="number" min="0" step="0.01" value={v.stepUpBDR ?? 0} onChange={(e) => set({ stepUpBDR: Number(e.target.value) })} />
                  </Field>
                  <Field label="Step-Up OT Coef">
                    <Select value={String(v.stepUpOTCoef ?? 1)} onChange={(e) => set({ stepUpOTCoef: Number(e.target.value) })}>
                      <option value="1">1×</option>
                      <option value="1.25">1.25×</option>
                      <option value="1.5">1.5×</option>
                    </Select>
                  </Field>
                </>
              )}
            </>
          )}

          {/* ── 2nd Break panel ── */}
          {show2ndBreakPill && openPill === "2ndbreak" && (
            <>
              <Field label="2nd Break Start" hint={`Deadline: ${toHHMM(bs.sbDeadline)} (5.5h after lunch end)`}>
                <TimeInput value={v.secondBreakStartTime || ""} onChange={(e) => set({ secondBreakStartTime: e.target.value })} disabled={Number(v.secondBreakDurationMins) === 0} />
              </Field>
              <Field label="2nd Break Duration">
                <Select value={Number(v.secondBreakDurationMins ?? 30)} onChange={(e) => set({ secondBreakDurationMins: Number(e.target.value) })}>
                  {SECOND_BREAK_DURATIONS.map((s) => <option key={s.v} value={s.v}>{s.label}</option>)}
                </Select>
              </Field>
              <div className="md:col-span-2">
                {bs.sbState === "missed" && <StatusMsg kind="bad">Missed — 30m × BHR penalty applied.</StatusMsg>}
                {bs.sbState === "late" && <StatusMsg kind="bad">Late (started after {toHHMM(bs.sbDeadline)}). APA: 2nd break can't be delayed — treated as missed. 30m × BHR penalty.</StatusMsg>}
                {bs.sbState === "curtailed" && <StatusMsg kind="warn">Curtailed by {30 - bs.sbDuration}m. {30 - bs.sbDuration}m × BHR penalty.</StatusMsg>}
                {bs.sbState === "given" && <StatusMsg kind="ok">Given on time.</StatusMsg>}
              </div>
            </>
          )}
        </div>
      );
    }

    /* ═══════════════════════════ DAY EDIT MODAL ═══════════════════════════ */

    function DayEditModal({ editing, form, setForm, crew, production, days, onSave, onCancel, onRemove, fixedCrewId = null, fixedDate = null }) {
      const isNewAll = editing === "new-all";
      const isNew    = editing === "new";
      const isKnown  = !isNew && !isNewAll;

      const activeCrew = !isNewAll ? crew.find(c => c.id === (fixedCrewId || form.crewId)) : null;
      const activeCalc = activeCrew
        ? calcForDisplay(production, form, activeCrew, findPrevDay(days, form))
        : null;
      const penaltyLines = activeCalc ? activeCalc.lines.filter(l => l.rate === null || l.isTOC) : [];

      const lineColor = (l) => {
        if (l.isTOC) return l.isBreach ? 'red' : 'amber';
        if (l.rate === null) return 'red';
        const lbl = l.label || '';
        if (/^OT|triple time/i.test(lbl)) return 'amber';
        if (/^Early Call/i.test(lbl)) return 'amber';
        if (/^(Saturday|Sunday|Night Shoot)/i.test(lbl)) return 'amber';
        return 'neutral';
      };
      const lineCls = (c) => ({
        label: c === 'red' ? 'text-red-300' : c === 'amber' ? 'text-amber-300' : 'text-neutral-300',
        amt:   c === 'red' ? 'text-red-200 font-semibold' : c === 'amber' ? 'text-amber-200 font-semibold' : 'text-neutral-100 font-semibold',
      });

      const resolvedDate = fixedDate || form.date;
      const dateStr = resolvedDate
        ? new Date(resolvedDate + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })
        : "";

      useEffect(() => {
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = ""; };
      }, []);

      const modalTitle = isNew ? "New Day Entry" : isNewAll ? "New Day — All Crew" : "Edit Day Entry";

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.78)" }}
          onClick={onCancel}
        >
          <div
            className="bg-neutral-900 w-full rounded-[10px] shadow-2xl border border-neutral-700 flex flex-col"
            style={{ maxWidth: 640, maxHeight: "calc(100dvh - 1rem)", height: "auto" }}
            onClick={e => e.stopPropagation()}
          >
            {/* ── Fixed header ── */}
            <div className="flex-shrink-0 px-5 pt-4 pb-3 border-b border-neutral-700">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-1.5">{modalTitle}</div>
                  {fixedCrewId && activeCrew && (
                    <div className="flex items-baseline gap-2 flex-wrap">
                      <span className="text-sm font-semibold text-neutral-100 truncate">{activeCrew.name}</span>
                      <span className="text-[10px] uppercase tracking-wider bg-neutral-800 text-neutral-400 px-1.5 py-px rounded-sm flex-shrink-0">{activeCrew.role}</span>
                      <span className="text-[10px] text-neutral-500 font-mono flex-shrink-0">BDR {fmtGBP(Number(activeCrew.bdr) || 0)}</span>
                      {dateStr && <span className="text-[11px] text-neutral-200 font-semibold flex-shrink-0">{dateStr}</span>}
                    </div>
                  )}
                  {!fixedCrewId && (isNew || isNewAll) && (
                    <div className="text-xs text-neutral-500">
                      {isNewAll ? `${crew.length} crew member${crew.length !== 1 ? "s" : ""} — select date below` : "Select crew member and date below"}
                    </div>
                  )}
                </div>
                <button onClick={onCancel} className="text-neutral-500 hover:text-neutral-200 transition-colors flex-shrink-0 mt-0.5 p-0.5"><IX size={16}/></button>
              </div>
            </div>

            {/* ── Scrollable body ── */}
            <div className="flex-1 overflow-y-auto px-5 py-4 min-h-0">
              <DayEntryForm
                value={form}
                onChange={setForm}
                crew={crew}
                allCrewMode={isNewAll}
                fixedCrewId={fixedCrewId}
                fixedDate={fixedDate}
              />
              {isNewAll && (
                <div className="mt-3 bg-black border border-sky-400 p-3 text-xs text-neutral-300 rounded-[10px]">
                  <span className="text-sky-400 font-bold uppercase tracking-wider">Will create: </span>{crew.length} day entries — one per crew member
                </div>
              )}
              {activeCalc && activeCalc.lines.length > 0 && (
                <div className="mt-4 border border-neutral-800 rounded-[8px] p-3">
                  <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-2">Cost Breakdown</div>
                  <table className="w-full border-collapse text-[11px]">
                    <tbody>
                      {activeCalc.lines.map((l, i) => {
                        const c = lineColor(l);
                        const cls = lineCls(c);
                        const qtyFmt = typeof l.qty === 'number' ? (Number.isInteger(l.qty) ? l.qty : l.qty.toFixed(2).replace(/\.?0+$/, '')) : l.qty;
                        return (
                          <tr key={i} className="border-b border-neutral-800/50">
                            <td className={`py-1 pr-2 font-semibold leading-tight ${cls.label}`}>{l.label}</td>
                            <td className="py-1 pr-2 text-neutral-500 leading-tight text-[10px] hidden sm:table-cell">{l.detail}</td>
                            <td className={`py-1 pr-2 font-mono text-right whitespace-nowrap ${cls.label}`}>{l.rate != null ? fmtGBP(l.rate) : ''}</td>
                            <td className={`py-1 pr-2 font-mono text-right whitespace-nowrap ${cls.label}`}>{l.rate != null && l.qty != null ? `×${qtyFmt}` : ''}</td>
                            <td className={`py-1 font-mono text-right whitespace-nowrap ${cls.amt}`}>{fmtGBP(l.amount)}</td>
                          </tr>
                        );
                      })}
                      <tr className="border-t-2 border-neutral-600">
                        <td colSpan={3} className="pt-2 pb-1 text-[10px] uppercase tracking-wider text-neutral-500 font-bold">Day Total</td>
                        <td colSpan={2} className="pt-2 pb-1 text-right font-mono font-bold text-white text-sm">{fmtGBP(activeCalc.total)}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            {/* ── Fixed footer ── */}
            <div className="flex-shrink-0 border-t border-neutral-700 px-5 py-3 space-y-2.5">
              {activeCalc && (
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-[9px] text-neutral-600 uppercase tracking-wider mr-0.5">Calc</span>
                  <span className="text-[10px] bg-neutral-800 text-neutral-300 px-2 py-0.5 rounded-full font-mono whitespace-nowrap">
                    BDR {fmtGBP(Number(activeCrew.bdr) || 0)}
                  </span>
                  {activeCalc.meta.otHrs > 0 && (
                    <span className="text-[10px] bg-amber-900 text-amber-200 px-2 py-0.5 rounded-full font-mono whitespace-nowrap">
                      OT {Number.isInteger(activeCalc.meta.otHrs) ? activeCalc.meta.otHrs : activeCalc.meta.otHrs.toFixed(1)}h
                    </span>
                  )}
                  {penaltyLines.length > 0 && (
                    <span className="text-[10px] bg-red-900 text-red-200 px-2 py-0.5 rounded-full font-mono whitespace-nowrap">
                      {penaltyLines.length} {penaltyLines.length === 1 ? "penalty" : "penalties"}
                    </span>
                  )}
                  <span className="ml-auto text-sm font-bold text-white font-mono">{fmtGBP(activeCalc.total)}</span>
                </div>
              )}
              <div className="flex gap-2 flex-wrap">
                <Btn onClick={onSave} variant="success"><ICheck/>Save</Btn>
                <Btn onClick={onCancel} variant="ghost"><IX/>Cancel</Btn>
                {isKnown && (
                  <Btn onClick={() => onRemove(editing)} variant="danger"><ITrash/>Remove day</Btn>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ TIMESHEET GRID ═══════════════════════════ */

    function gridDisplayHours(resolvedDay) {
      const bs = deriveBreakState(resolvedDay);
      if (!bs) return 0;
      return bs.workedHrs - (bs.lunchMissed ? 0 : bs.lunchDuration / 60);
    }

    function GridCell({ day, date, production, member, onEditDay, onAddDay, isWeekEnd, isWeekend, hasTOC = false, isTOCBreach = false }) {
      const borderR = isWeekEnd ? "border-r border-neutral-500" : "border-r border-neutral-800";
      const bgBase  = isWeekend ? "bg-neutral-900/30" : "";

      if (!day) {
        return (
          <td onClick={() => onAddDay(member.id, date)}
            className={`px-2 py-2 text-center cursor-pointer hover:bg-sky-950/40 transition-colors ${borderR} ${bgBase}`}
            style={{ minWidth: 80 }}>
            <span className="text-[9px] text-neutral-700 uppercase tracking-wider leading-none">Rest</span>
          </td>
        );
      }

      const resolved = resolveDay(production, day, member);
      const { meta, lines } = calculateDay(resolved, member, production);

      const hasOT    = meta.otHrs > 0;
      const hasCWD   = meta.continuousDay;
      const hasLate1 = lines.some(l => l.label === "Late 1st Break");
      const hasMSB   = lines.some(l => /missed.*2nd|late.*2nd/i.test(l.label));
      const anyPenalty = hasOT || hasCWD || hasLate1 || hasMSB || hasTOC;

      const ct = resolved.callTime || "—";
      const wt = resolved.wrapTime || "—";
      const hrs = gridDisplayHours(resolved);
      const hrsLabel = Number.isInteger(hrs) ? `${hrs}h` : `${hrs.toFixed(1)}h`;

      return (
        <td onClick={() => onEditDay(day.id)}
          className={`px-2 py-1.5 cursor-pointer hover:bg-neutral-800 transition-colors ${borderR} ${bgBase}`}
          style={{ minWidth: 80 }}>
          <div className="text-[9px] text-neutral-500 font-mono whitespace-nowrap leading-tight">{ct}–{wt}</div>
          <div className="text-[11px] font-bold text-neutral-100 leading-tight">{hrsLabel}</div>
          {anyPenalty && (
            <div className="flex flex-wrap gap-0.5 mt-0.5">
              {hasOT    && <span className="text-[8px] bg-amber-900 text-amber-200 px-1 font-bold uppercase leading-tight py-px rounded-sm">OT</span>}
              {hasCWD   && <span className="text-[8px] bg-red-900 text-red-200 px-1 font-bold uppercase leading-tight py-px rounded-sm">CWD</span>}
              {hasLate1 && <span className="text-[8px] bg-red-900 text-red-200 px-1 font-bold uppercase leading-tight py-px rounded-sm">L1</span>}
              {hasMSB   && <span className="text-[8px] bg-red-900 text-red-200 px-1 font-bold uppercase leading-tight py-px rounded-sm">MSB</span>}
              {hasTOC   && <span className={`text-[8px] px-1 font-bold uppercase leading-tight py-px rounded-sm ${isTOCBreach ? 'bg-red-900 text-red-200' : 'bg-amber-900 text-amber-200'}`}>{isTOCBreach ? 'TOC!' : 'TOC'}</span>}
            </div>
          )}
        </td>
      );
    }

    function TimesheetGrid({ production, crew, days, onEditDay, onAddDay, onAddWeek, onAddCrew, onAssignAll, onDuplicateDate, onBulkEditDate, onRemoveWeek }) {
      const [addDayType, setAddDayType] = useState("Shoot");
      const [editingDate, setEditingDate] = useState(null);
      const [dateEdit, setDateEdit] = useState({});

      const DOW_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      const openDateEdit = (date) => {
        const firstEntry = days.find(d => d.date === date);
        const firstMember = firstEntry ? crew.find(c => c.id === firstEntry.crewId) : null;
        const resolved = firstEntry && firstMember
          ? resolveDay(production, firstEntry, firstMember)
          : { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay || {}) };
        setDateEdit({
          dayType: resolved.dayType || "Shoot",
          callTime: resolved.callTime || "08:00",
          wrapTime: resolved.wrapTime || "19:00",
          lunchStartTime: resolved.lunchStartTime || "13:30",
          lunchDurationMins: resolved.lunchDurationMins ?? 60,
        });
        setEditingDate(date);
      };

      const weeks = useMemo(() => deriveWeeks(production, days),
        [days, production.gridDates, production.weekStarts, production.startDate]);

      const tocMap = useMemo(() => {
        const map = {};
        for (const member of crew) {
          const memberDays = days.filter(d => d.crewId === member.id)
            .sort((a, b) => a.date.localeCompare(b.date));
          for (let i = 1; i < memberDays.length; i++) {
            const prevR = resolveDay(production, memberDays[i - 1], member);
            const currR = resolveDay(production, memberDays[i], member);
            const toc = calcTOC(prevR, currR, member);
            if (toc) map[memberDays[i].id] = { hasTOC: true, isTOCBreach: toc.isBreach };
          }
        }
        return map;
      }, [days, crew, production]);

      const handleAddWeek = () => {
        let nextMon;
        if (weeks.length > 0) {
          const d = new Date(weeks[weeks.length - 1][6] + "T12:00:00");
          d.setDate(d.getDate() + 1);
          nextMon = d.toISOString().slice(0, 10);
        } else {
          nextMon = getMonday(todayISO());
        }
        onAddWeek(nextMon);
      };

      const index = useMemo(() => {
        const idx = {};
        for (const d of days) {
          if (!idx[d.date]) idx[d.date] = {};
          idx[d.date][d.crewId] = d;
        }
        return idx;
      }, [days]);

      if (crew.length === 0) {
        return <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-[10px]">Add crew members first.</div>;
      }

      return (
        <div className="space-y-3">
          <div className="flex items-center gap-3 flex-wrap">
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-neutral-500 uppercase tracking-wider whitespace-nowrap">Add as:</span>
              <Select value={addDayType} onChange={e => setAddDayType(e.target.value)}>{DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}</Select>
            </div>
            <div className="text-[10px] text-neutral-500 uppercase tracking-wider">Tap empty cell to add · Tap date to bulk edit</div>
          </div>

          {editingDate && (
            <div className="bg-neutral-900 border-l-4 border-sky-400 p-4 space-y-3 rounded-r-[10px]">
              <div className="flex items-center justify-between">
                <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold">
                  Edit {weekday(editingDate)} {new Date(editingDate + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })} — updates all crew on this date
                </div>
                <Btn size="sm" variant="ghost" onClick={() => setEditingDate(null)}><IX/></Btn>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                <Field label="Day Type">
                  <Select value={dateEdit.dayType || "Shoot"} onChange={e => setDateEdit(p => ({...p, dayType: e.target.value}))}>
                    {DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                  </Select>
                </Field>
                <Field label="Call Time"><TimeInput value={dateEdit.callTime || ""} onChange={e => setDateEdit(p => ({...p, callTime: e.target.value}))} /></Field>
                <Field label="Wrap Time"><TimeInput value={dateEdit.wrapTime || ""} onChange={e => setDateEdit(p => ({...p, wrapTime: e.target.value}))} /></Field>
                <Field label="Lunch Start"><TimeInput value={dateEdit.lunchStartTime || ""} onChange={e => setDateEdit(p => ({...p, lunchStartTime: e.target.value}))} /></Field>
                <Field label="Lunch Duration">
                  <Select value={dateEdit.lunchDurationMins ?? 60} onChange={e => setDateEdit(p => ({...p, lunchDurationMins: Number(e.target.value)}))}>
                    {LUNCH_DURATIONS.map(d => <option key={d.v} value={d.v}>{d.label}</option>)}
                  </Select>
                </Field>
              </div>
              <div className="flex gap-2">
                <Btn variant="success" onClick={() => { onBulkEditDate(editingDate, dateEdit); setEditingDate(null); }}>
                  <ICheck/>Apply to {weekday(editingDate)}
                </Btn>
                <Btn variant="ghost" onClick={() => setEditingDate(null)}><IX/>Cancel</Btn>
              </div>
            </div>
          )}

          <div className="overflow-x-auto border border-neutral-800 rounded-[10px] overflow-hidden">
            <table className="border-collapse text-xs w-full" style={{ minWidth: 560 }}>
              <thead>
                <tr className="border-b border-neutral-700">
                  <th className="text-left px-3 py-2 text-[10px] uppercase tracking-wider text-neutral-500 font-bold whitespace-nowrap border-r border-neutral-700 bg-neutral-950"
                    style={{ position: "sticky", left: 0, zIndex: 20, minWidth: 120 }}>Crew</th>
                  {DOW_LABELS.map((label, i) => {
                    const isSat = i === 5;
                    const isSun = i === 6;
                    const headerBg  = isSun ? "bg-red-950/60"   : isSat ? "bg-amber-950/60" : "bg-neutral-950";
                    const textColor = isSun ? "text-red-400"    : isSat ? "text-amber-400"  : "text-neutral-500";
                    return (
                      <th key={label} className={`px-2 py-2 text-center font-bold text-[10px] uppercase tracking-wider border-r border-neutral-700 ${headerBg} ${textColor}`}
                        style={{ minWidth: 80 }}>{label}</th>
                    );
                  })}
                </tr>
              </thead>

              {weeks.length === 0 ? (
                <tbody>
                  <tr><td colSpan={8} className="px-3 py-8 text-center text-sm text-neutral-500">No weeks yet — click <strong className="text-neutral-300">+ Add Week</strong> below or add a day entry.</td></tr>
                </tbody>
              ) : weeks.map((weekDates, weekIdx) => (
                <tbody key={weekDates[0]}>
                  <tr className={`border-b border-neutral-800 ${weekIdx > 0 ? "border-t-2 border-t-neutral-700" : "border-t border-t-neutral-700"}`}>
                    <td className="px-3 py-1.5 bg-neutral-900 border-r border-neutral-700 whitespace-nowrap"
                      style={{ position: "sticky", left: 0, zIndex: 10 }}>
                      <div className="flex items-center justify-between gap-2">
                        <div>
                          <div className="text-[8px] text-neutral-600 uppercase tracking-wider leading-none">Week of</div>
                          <div className="text-[10px] text-neutral-400 font-semibold leading-tight mt-0.5">
                            {new Date(weekDates[0] + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
                          </div>
                        </div>
                        <button
                          onClick={() => onRemoveWeek(weekDates[0])}
                          className="text-[9px] text-neutral-700 hover:text-red-400 transition-colors font-bold uppercase tracking-wider leading-none"
                          title="Remove this week">✕</button>
                      </div>
                    </td>
                    {weekDates.map(date => {
                      const dow = dayOfWeek(date);
                      const isSat = dow === 6;
                      const isSun = dow === 0;
                      const isEditingThis = editingDate === date;
                      const cellBg    = isSun ? "bg-red-950/40"   : isSat ? "bg-amber-950/40" : "bg-neutral-900";
                      const numColor  = isSun ? "text-red-300"    : isSat ? "text-amber-300"  : "text-neutral-300";
                      return (
                        <td key={date}
                          onClick={() => isEditingThis ? setEditingDate(null) : openDateEdit(date)}
                          className={`px-2 py-1.5 text-center cursor-pointer border-r border-neutral-700 transition-colors hover:bg-neutral-800/60 ${cellBg}${isEditingThis ? " ring-2 ring-inset ring-sky-400" : ""}`}>
                          <div className={`text-[11px] font-bold leading-none ${numColor}`}>
                            {new Date(date + "T12:00:00").getDate()}
                          </div>
                          <div className="text-[8px] text-neutral-600 leading-none mt-0.5">
                            {new Date(date + "T12:00:00").toLocaleDateString("en-GB", { month: "short" })}
                          </div>
                          <div className="flex items-center justify-center gap-1.5 mt-0.5">
                            <button onClick={e => { e.stopPropagation(); onAssignAll(date, addDayType); }}
                              className="text-[8px] text-neutral-600 hover:text-sky-400 transition-colors font-bold uppercase tracking-wider"
                              title="Add all crew for this date">+all</button>
                            {days.some(d => d.date === date) && (
                              <button onClick={e => { e.stopPropagation(); onDuplicateDate(date); }}
                                className="text-neutral-600 hover:text-sky-400 transition-colors"
                                title="Duplicate this date"><ICopy size={10}/></button>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                  {crew.map(member => (
                    <tr key={member.id} className="border-b border-neutral-800">
                      <td className="px-3 py-2 whitespace-nowrap border-r border-neutral-700 bg-neutral-950"
                        style={{ position: "sticky", left: 0, zIndex: 10 }}>
                        <div className="text-[11px] font-semibold text-neutral-200">{member.name}</div>
                        <div className="text-[9px] text-neutral-500 uppercase tracking-wider">{member.role}</div>
                      </td>
                      {weekDates.map(date => {
                        const dow = dayOfWeek(date);
                        const isSat = dow === 6;
                        const isSun = dow === 0;
                        return (
                          <GridCell
                            key={date}
                            day={index[date]?.[member.id]}
                            date={date}
                            production={production}
                            member={member}
                            onEditDay={onEditDay}
                            onAddDay={(crewId, d) => onAddDay(crewId, d, addDayType)}
                            isWeekEnd={false}
                            isWeekend={isSat || isSun}
                            hasTOC={!!(index[date]?.[member.id] && tocMap[index[date][member.id].id]?.hasTOC)}
                            isTOCBreach={!!(index[date]?.[member.id] && tocMap[index[date][member.id].id]?.isTOCBreach)}
                          />
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              ))}

              <tbody>
                <tr className="border-t border-neutral-700">
                  <td className="px-3 py-2 bg-neutral-950 border-r border-neutral-700" style={{ position: "sticky", left: 0, zIndex: 10 }}>
                    <button onClick={onAddCrew} className="text-[10px] uppercase tracking-wider font-bold text-neutral-500 hover:text-sky-400 transition-colors flex items-center gap-1">
                      <span className="text-base leading-none">+</span> Crew
                    </button>
                  </td>
                  <td colSpan={7} className="bg-neutral-950" />
                </tr>
              </tbody>
            </table>
          </div>

          <div className="flex justify-center pt-1">
            <button onClick={handleAddWeek}
              className="text-[10px] uppercase tracking-wider font-bold text-neutral-500 hover:text-sky-400 border border-neutral-700 hover:border-sky-400 transition-colors px-4 py-1.5 rounded-sm flex items-center gap-1.5">
              <span className="text-sm leading-none font-bold">+</span> Add Week
            </button>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ DAYS MANAGER ═══════════════════════════ */

    function dayTypeDefaults(dayType) {
      return {
        callTime: "08:00",
        wrapTime: toHHMM(8 + (DEFAULT_HOURS[dayType] || 11)),
        ...(dayType === "Travel Day" ? { lunchDurationMins: 0 } : {}),
      };
    }

    function makeBlankDay(crewId = "") {
      return {
        id: uid(), crewId, date: todayISO(),
        wrapNextDay: false,
        truckCallTime: "",
        noMealProvided: false, secondBreakDurationMins: 30,
        cwdBreak1Given: true, cwdBreak2Given: true,
        travelOutMins: 0, travelBackMins: 0, miles: 0,
        perDiemEnabled: false, perDiemAmount: 0,
        stepUpEnabled: false, stepUpRole: "", stepUpBDR: 0, stepUpOTCoef: 1,
      };
    }

    function WrapNowBtn({ days, setDays, showToast }) {
      const HOLD_MS = 3000;
      const [progress, setProgress] = useState(0);
      const intervalRef = useRef(null);
      const startRef = useRef(null);
      const firedRef = useRef(false);

      const fire = () => {
        firedRef.current = true;
        const todayStr = new Date().toISOString().slice(0, 10);
        const todayEntries = days.filter(d => d.date === todayStr);
        if (todayEntries.length === 0) {
          showToast("No work days found for today");
          setTimeout(() => { setProgress(0); firedRef.current = false; }, 400);
          return;
        }
        const now = new Date();
        const totalMins = now.getHours() * 60 + now.getMinutes();
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const m = rounded % 60;
        const wrapStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        setDays(prev => prev.map(d => d.date === todayStr ? { ...d, wrapTime: wrapStr } : d));
        showToast(`Wrapped ${todayEntries.length} entr${todayEntries.length === 1 ? 'y' : 'ies'} at ${wrapStr}`);
        setTimeout(() => { setProgress(0); firedRef.current = false; }, 600);
      };

      const startHold = (e) => {
        e.preventDefault();
        if (firedRef.current) return;
        startRef.current = Date.now();
        intervalRef.current = setInterval(() => {
          if (firedRef.current) { clearInterval(intervalRef.current); return; }
          const p = Math.min((Date.now() - startRef.current) / HOLD_MS, 1);
          setProgress(p);
          if (p >= 1) { clearInterval(intervalRef.current); fire(); }
        }, 50);
      };

      const endHold = () => {
        clearInterval(intervalRef.current);
        if (!firedRef.current) {
          if (progress > 0.05) showToast("Hold to set today's wrap time");
          setProgress(0);
        }
      };

      const pct = Math.round(progress * 100);
      return (
        <button
          onPointerDown={startHold}
          onPointerUp={endHold}
          onPointerLeave={endHold}
          onPointerCancel={endHold}
          className="relative overflow-hidden inline-flex items-center justify-center text-[10px] uppercase tracking-wider font-bold border border-orange-500/50 text-orange-300 hover:border-orange-400 rounded-lg"
          style={{ touchAction: 'none', userSelect: 'none', minWidth: 96, height: 30 }}
          title="Hold 3 seconds to set today's wrap time"
        >
          <div className="absolute inset-y-0 left-0 bg-orange-400/25 pointer-events-none z-0" style={{ width: `${pct}%` }} />
          <span className="relative z-10">{progress > 0 ? `${pct}%` : 'WrapNow'}</span>
        </button>
      );
    }

    function DaysManager({ days, setDays, crew, production, showToast, onAddDate, onAddWeek, onAddCrew, onPushUndo, onRemoveWeek }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState(() => makeBlankDay());
      const [confirmRemove, setConfirmRemove] = useState(null);
      const [gridView, setGridView] = useState(true);
      const [fixedCrewId, setFixedCrewId] = useState(null);
      const [fixedDate, setFixedDate] = useState(null);

      const startNew = () => {
        if (crew.length === 0) return;
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(crew[0].id), secondBreakStartTime: toHHMM(callH + 11) });
        setEditing("new");
        setFixedCrewId(null);
        setFixedDate(null);
      };
      const startNewAll = () => {
        if (crew.length === 0) return;
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(""), secondBreakStartTime: toHHMM(callH + 11) });
        setEditing("new-all");
        setFixedCrewId(null);
        setFixedDate(null);
      };
      const startEdit = (d) => {
        setForm(migrateDay(d));
        setEditing(d.id);
        setFixedCrewId(d.crewId);
        setFixedDate(d.date);
      };
      const cancel = () => {
        setEditing(null);
        setFixedCrewId(null);
        setFixedDate(null);
      };
      const handleEditDayFromGrid = (id) => { const d = days.find(day => day.id === id); if (d) startEdit(d); };
      const handleAddDayFromGrid = (crewId, date, dayType = "Shoot") => {
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(crewId), date, dayType, ...dayTypeDefaults(dayType), secondBreakStartTime: toHHMM(callH + 11) });
        setEditing("new");
        setFixedCrewId(crewId);
        setFixedDate(date);
      };
      const handleBulkEditDate = (date, overrides) => {
        const { dayType, callTime, wrapTime, lunchStartTime, lunchDurationMins } = overrides;
        setDays(prev => prev.map(d =>
          d.date !== date ? d : { ...d, dayType, callTime, wrapTime, lunchStartTime, lunchDurationMins }
        ));
      };
      const handleAssignAllOnDate = (date, dayType = "Shoot") => {
        const toAdd = crew.filter(m => !days.find(d => d.date === date && d.crewId === m.id));
        if (toAdd.length > 0) setDays(prev => [...prev, ...toAdd.map(m => ({ ...makeBlankDay(m.id), date, dayType, ...dayTypeDefaults(dayType) }))]);
      };
      const handleRemoveAllOnDate = (date) => {
        const count = days.filter(d => d.date === date).length;
        if (count === 0) return;
        if (!window.confirm(`Remove all ${count} entr${count === 1 ? 'y' : 'ies'} on ${fmtDate(date)}? This cannot be undone.`)) return;
        setDays(prev => prev.filter(d => d.date !== date));
      };

      const handleDuplicateDate = (sourceDate) => {
        const source = days.filter(d => d.date === sourceDate);
        if (source.length === 0) return;
        const next = new Date(sourceDate + "T12:00:00");
        next.setDate(next.getDate() + 1);
        const defaultTarget = next.toISOString().slice(0, 10);
        const input = window.prompt(`Copy ${source.length} entr${source.length === 1 ? 'y' : 'ies'} from ${fmtDateShort(sourceDate)} to:`, defaultTarget);
        if (!input) return;
        const targetDate = input.trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)) { showToast("Invalid date — use YYYY-MM-DD"); return; }
        if (targetDate === sourceDate) { showToast("Target date is the same as source"); return; }
        const existing = days.filter(d => d.date === targetDate);
        const copies = source.map(d => ({ ...d, id: uid(), date: targetDate }));
        if (existing.length > 0) {
          if (!window.confirm(`${fmtDateShort(targetDate)} already has ${existing.length} entr${existing.length === 1 ? 'y' : 'ies'}. Replace them?`)) return;
          setDays(prev => [...prev.filter(d => d.date !== targetDate), ...copies]);
        } else {
          setDays(prev => [...prev, ...copies]);
        }
      };

      const save = () => {
        if (!form.date || !form.callTime || !form.wrapTime) return;
        if (editing === "new-all") {
          const newDays = crew.map((c) => ({ ...form, id: uid(), crewId: c.id }));
          setDays((prev) => [...prev, ...newDays]);
        } else {
          if (!form.crewId) return;
          if (editing !== "new") onPushUndo('Day entry saved');
          setDays((prev) => {
            const exists = prev.find((d) => d.id === form.id);
            return exists ? prev.map((d) => (d.id === form.id ? form : d)) : [...prev, form];
          });
        }
        cancel();
      };

      const remove = (id) => { onPushUndo('Day entry deleted'); setDays((prev) => prev.filter((d) => d.id !== id)); setConfirmRemove(null); };
      const duplicate = (d) => setDays((prev) => [...prev, { ...d, id: uid() }]);

      const handleDayText = async (d, c) => {
        const text = generateDayText(d, c, production, days);
        const r = await shareTextOrCopy(text, `${c.name} ${fmtDateShort(d.date)}`);
        if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
      };
      const grouped = useMemo(() => {
        const by = {};
        days.forEach((d) => { (by[d.date] = by[d.date] || []).push(d); });
        Object.values(by).forEach((arr) => arr.sort((a, b) => {
          const ia = crew.findIndex((c) => c.id === a.crewId);
          const ib = crew.findIndex((c) => c.id === b.crewId);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        }));
        return Object.entries(by).sort(([a], [b]) => a.localeCompare(b));
      }, [days, crew]);

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><ICal size={16}/>Timesheet Entries</h2>
            <div className="flex items-center gap-2 flex-wrap">
              <div className="flex border border-neutral-700 overflow-hidden">
                <button onClick={() => setGridView(false)} className={`px-3 py-1.5 text-[10px] uppercase tracking-wider font-bold transition-colors ${!gridView ? "bg-sky-400 text-black" : "bg-transparent text-neutral-400 hover:text-neutral-200"}`}>List</button>
                <button onClick={() => setGridView(true)} className={`px-3 py-1.5 text-[10px] uppercase tracking-wider font-bold border-l border-neutral-700 transition-colors ${gridView ? "bg-sky-400 text-black" : "bg-transparent text-neutral-400 hover:text-neutral-200"}`}>Grid</button>
              </div>
              {crew.length > 0 && <WrapNowBtn days={days} setDays={setDays} showToast={showToast} />}
              {!editing && crew.length > 0 && (
                <>
                  <Btn variant="subtle" onClick={startNewAll}><IUsers2/>Add Day (All Crew)</Btn>
                  <Btn variant="primary" onClick={startNew}><IPlus/>Add Day</Btn>
                </>
              )}
            </div>
          </div>

          {crew.length === 0 && <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-[10px]">Add crew members first.</div>}

          {editing && (
            <DayEditModal
              editing={editing}
              form={form}
              setForm={setForm}
              crew={crew}
              production={production}
              days={days}
              onSave={save}
              onCancel={cancel}
              onRemove={(id) => { remove(id); cancel(); }}
              fixedCrewId={fixedCrewId}
              fixedDate={fixedDate}
            />
          )}

          {!gridView && days.length === 0 && !editing && crew.length > 0 && (
            <div className="bg-neutral-900 border border-dashed border-neutral-700 p-8 text-center rounded-[10px]">
              <div className="flex justify-center mb-2 text-neutral-700"><ICal size={32}/></div>
              <div className="text-neutral-500 text-sm">No day entries yet.</div>
            </div>
          )}

          {gridView ? (
            <TimesheetGrid production={production} crew={crew} days={days} onEditDay={handleEditDayFromGrid} onAddDay={handleAddDayFromGrid} onAddWeek={onAddWeek} onAddCrew={onAddCrew} onAssignAll={handleAssignAllOnDate} onDuplicateDate={handleDuplicateDate} onBulkEditDate={handleBulkEditDate} onRemoveWeek={onRemoveWeek} />
          ) : (
          <div className="space-y-4">
            {grouped.map(([date, entries]) => {
              const dayTotal = entries.reduce((s, e) => { const c = crew.find((cc) => cc.id === e.crewId); return c ? s + calcForDisplay(production, e, c, findPrevDay(days, e)).total : s; }, 0);
              return (
                <div key={date}>
                  <div className="flex items-baseline justify-between mb-2 border-b border-neutral-800 pb-1">
                    <div className="text-[11px] font-bold uppercase tracking-[0.15em] text-sky-400">{fmtDate(date)}</div>
                    <div className="text-sm font-mono text-neutral-300">{fmtGBP(dayTotal)}</div>
                  </div>
                  <div className="space-y-1">
                    {entries.map((d) => {
                      const c = crew.find((cc) => cc.id === d.crewId);
                      if (!c) return (
                        <div key={d.id} className="bg-red-950 border border-red-900 p-3 text-sm text-red-200 flex items-center justify-between rounded-[10px]">
                          <span>Unassigned crew (deleted)</span>
                          <Btn size="sm" variant="ghost" onClick={() => remove(d.id)}><ITrash/></Btn>
                        </div>
                      );
                      const calc = calcForDisplay(production, d, c, findPrevDay(days, d));
                      const hasPenalty = calc.lines.some(l => l.rate === null);
                      const hasTocBreach = calc.lines.some(l => l.isTOC && l.isBreach);
                      const stripeColor = (hasPenalty || hasTocBreach) ? '#ef4444'
                        : (calc.meta.otHrs > 0 || calc.meta.continuousDay || calc.lines.some(l => l.isTOC)) ? '#f59e0b'
                        : '#22c55e';
                      return (
                        <div key={d.id} className="bg-neutral-900 border border-neutral-800 hover:border-neutral-700 transition-colors border-l-4 rounded-[10px] overflow-hidden" style={{ borderLeftColor: stripeColor }}>
                          <div className="flex items-center justify-between p-3 gap-3 flex-wrap">
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2 flex-wrap">
                                <div className="font-semibold text-neutral-100">{c.name}</div>
                                <span className="text-[10px] uppercase tracking-wider bg-neutral-800 text-neutral-400 px-1.5 py-0.5">{c.role}</span>
                                <span className="text-[10px] uppercase tracking-wider bg-sky-400 text-black px-1.5 py-0.5 font-bold">{d.dayType}</span>
                                {calc.meta.continuousDay && <span className="text-[10px] uppercase tracking-wider bg-red-900 text-red-200 px-1.5 py-0.5 font-bold">CWD</span>}
                              </div>
                              <div className="text-[11px] text-neutral-400 font-mono mt-1">
                                {d.callTime}–{d.wrapTime}{(parseHHMM(d.wrapTime) !== null && parseHHMM(d.callTime) !== null && parseHHMM(d.wrapTime) <= parseHHMM(d.callTime)) ? " (+1)" : ""} · {calc.meta.workedHrs.toFixed(1)}h · {calc.meta.dayLabel}
                              </div>
                            </div>
                            <div className="flex items-center gap-2 flex-shrink-0">
                              <div className="font-mono font-bold text-neutral-100 text-sm">{fmtGBP(calc.total)}</div>
                              <div className="flex gap-1">
                                <Btn size="sm" variant="ghost" onClick={() => handleDayText(d, c)} title="Send as text"><IMessage/></Btn>
                                <Btn size="sm" variant="ghost" onClick={() => startEdit(d)}><IPencil/></Btn>
                                <Btn size="sm" variant="ghost" onClick={() => duplicate(d)} title="Duplicate"><IPlus/></Btn>
                                {confirmRemove === d.id ? (
                                  <>
                                    <Btn size="sm" variant="danger" onClick={() => remove(d.id)}>Del</Btn>
                                    <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(null)}><IX/></Btn>
                                  </>
                                ) : (
                                  <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(d.id)}><ITrash/></Btn>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════ EXPORT TAB ═══════════════════════════ */

    function ExportTab({ production, crew, days, showToast }) {
      const [busy, setBusy] = useState(null);

      const byCrew = useMemo(() => {
        const m = new Map();
        days.forEach((d) => {
          const c = crew.find((cc) => cc.id === d.crewId); if (!c) return;
          if (!m.has(c.id)) m.set(c.id, { crew: c, entries: [] });
          m.get(c.id).entries.push(d);
        });
        return crew.map((c) => m.get(c.id)).filter(Boolean);
      }, [crew, days]);

      const grandTotal = byCrew.reduce((s, { crew: c, entries }) => {
        const sortedG = [...entries].sort((a, b) => a.date.localeCompare(b.date));
        return s + sortedG.reduce((t, e, i) => t + calcForDisplay(production, e, c, sortedG[i - 1] || null).total, 0);
      }, 0);

      const handleAllPdf = async () => {
        setBusy('all-pdf');
        try { await exportAllPdf(production, crew, days); showToast('PDF ready'); } catch (e) { console.error(e); showToast('Export failed'); }
        setBusy(null);
      };

      const handleAllPdfDownload = async () => {
        setBusy('all-pdf-dl');
        try { await exportAllPdf(production, crew, days, { download: true }); showToast('PDF downloaded'); } catch (e) { console.error(e); showToast('Export failed'); }
        setBusy(null);
      };

      const detectedWeeks = useMemo(() => {
        if (days.length === 0) return [];
        const weekMap = new Map();
        days.forEach((d) => {
          const mon = getMonday(d.date);
          if (!weekMap.has(mon)) weekMap.set(mon, []);
          weekMap.get(mon).push(d);
        });
        const sortedKeys = [...weekMap.keys()].sort();
        return sortedKeys.map((mon, i) => {
          const m = new Date(mon + "T12:00:00");
          const sun = new Date(m); sun.setDate(m.getDate() + 6);
          const sameMonth = m.getMonth() === sun.getMonth();
          const startStr = sameMonth ? `${m.getDate()}` : `${m.getDate()} ${m.toLocaleString('en-GB', { month: 'short' })}`;
          const endStr = `${sun.getDate()} ${sun.toLocaleString('en-GB', { month: 'short' })}`;
          return {
            weekNum: i + 1,
            monday: mon,
            label: `${startStr}–${endStr}`,
            days: weekMap.get(mon),
          };
        });
      }, [days]);

      const handleWeekPdf = async (wk) => {
        setBusy(`week-${wk.weekNum}`);
        try { await exportWeekPdf(production, wk.days, crew); showToast('PDF ready'); } catch (e) { console.error(e); showToast('Export failed'); }
        setBusy(null);
      };

      const handleCrewPdf = async (c, entries) => {
        setBusy(`pdf-${c.id}`);
        try { await exportCrewPDF(c, entries, production); showToast('PDF ready'); } catch (e) { console.error(e); showToast('Export failed'); }
        setBusy(null);
      };

      const handleCrewPdfDownload = async (c, entries) => {
        setBusy(`pdf-dl-${c.id}`);
        try { await exportCrewPDF(c, entries, production); showToast('PDF downloaded'); } catch (e) { console.error(e); showToast('Export failed'); }
        setBusy(null);
      };

      const handleCrewText = async (c, entries) => {
        setBusy(`txt-${c.id}`);
        try {
          const text = generateCrewText(c, entries, production);
          const r = await shareTextOrCopy(text, `${c.name} Timesheet`);
          if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
        } catch (e) { console.error(e); }
        setBusy(null);
      };

      if (byCrew.length === 0) {
        return (
          <div className="bg-neutral-900 border border-dashed border-neutral-700 p-8 text-center rounded-[10px]">
            <div className="flex justify-center mb-2 text-neutral-700"><IFile size={32}/></div>
            <div className="text-neutral-500 text-sm">Nothing to export yet. Add crew and day entries first.</div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><IShare size={16}/>Export</h2>

          {/* Combined export */}
          <div className="bg-neutral-900 border-l-4 border-sky-400 p-4 space-y-3 rounded-r-[10px]">
            <div className="flex items-baseline justify-between">
              <div>
                <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold">Everyone</div>
                <div className="text-sm text-neutral-300 mt-0.5">{byCrew.length} crew · {days.length} day entries</div>
              </div>
              <div className="font-mono font-bold text-neutral-100 text-lg">{fmtGBP(grandTotal)}</div>
            </div>
            <div className="flex gap-2 flex-wrap">
              <Btn variant="primary" onClick={handleAllPdf} disabled={busy !== null}>
                <IDownload/>{busy === 'all-pdf' ? 'Building…' : 'Share PDF'}
              </Btn>
              <Btn variant="subtle" onClick={handleAllPdfDownload} disabled={busy !== null}>
                <IDownload/>{busy === 'all-pdf-dl' ? 'Building…' : 'Download PDF'}
              </Btn>

            </div>
            <div className="text-[11px] text-neutral-500 leading-relaxed">
              One PDF with a crew summary on page 1, then each crew member's full timesheet on their own page{byCrew.some(({ entries }) => entries.length > 1) ? '(s)' : ''}.
            </div>
          </div>

          {/* Per week */}
          {detectedWeeks.length > 0 && (
            <div className="space-y-2">
              <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Export by Week</div>
              <div className="flex flex-col gap-2">
                {detectedWeeks.map((wk) => (
                  <Btn key={wk.monday} variant="subtle" onClick={() => handleWeekPdf(wk)} disabled={busy !== null}>
                    <IDownload/>{busy === `week-${wk.weekNum}` ? 'Building…' : `Week ${wk.weekNum} — ${wk.label}`}
                  </Btn>
                ))}
              </div>
            </div>
          )}

          {/* Per crew */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Per Crew Member</div>
            {byCrew.map(({ crew: c, entries }) => {
              const sortedBC = [...entries].sort((a, b) => a.date.localeCompare(b.date));
              const total = sortedBC.reduce((s, e, i) => s + calcForDisplay(production, e, c, sortedBC[i - 1] || null).total, 0);
              const totalHrs = entries.reduce((s, e) => s + calculateDay(resolveDay(production, e, c), c, production).meta.workedHrs, 0);
              return (
                <div key={c.id} className="bg-neutral-900 border border-neutral-800 p-3 rounded-[10px]">
                  <div className="flex items-center justify-between gap-3 flex-wrap">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2">
                        <span className="font-semibold text-neutral-100">{c.name}</span>
                        <span className="text-[10px] uppercase tracking-wider bg-neutral-800 text-neutral-400 px-1.5 py-0.5">{c.role}</span>
                      </div>
                      <div className="text-[11px] text-neutral-400 font-mono mt-1">{entries.length} day{entries.length !== 1 ? 's' : ''} · {totalHrs.toFixed(1)}h · <span className="text-neutral-100 font-bold">{fmtGBP(total)}</span></div>
                    </div>
                    <div className="flex gap-2 flex-wrap">
                      <Btn size="md" variant="subtle" onClick={() => handleCrewText(c, entries)} disabled={busy !== null}>
                        <IMessage/>{busy === `txt-${c.id}` ? '…' : 'Text'}
                      </Btn>
                      <Btn size="md" variant="subtle" onClick={() => handleCrewPdf(c, entries)} disabled={busy !== null}>
                        <IDownload/>{busy === `pdf-${c.id}` ? '…' : 'Share PDF'}
                      </Btn>
                      <Btn size="md" variant="ghost" onClick={() => handleCrewPdfDownload(c, entries)} disabled={busy !== null}>
                        <IDownload/>{busy === `pdf-dl-${c.id}` ? '…' : 'Download PDF'}
                      </Btn>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="bg-neutral-900 border border-neutral-800 p-3 text-[11px] text-neutral-400 leading-relaxed rounded-[10px]">
            <IInfo/> <span className="align-middle">On iPad: the Share Sheet opens — pick Messages, Mail, or AirDrop. If you hit Save to Files, the PDF goes to Files → On My iPad.</span>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ PRODUCTION APP ═══════════════════════════ */

    function ProductionApp({ production, setProduction, onBack }) {

// Convenience aliases — child components keep receiving crew/days as before
const crew = production.crew ?? [];
const days = production.days ?? [];

// Derived setters — wrap setProduction so child components work unchanged
const setCrew = (updater) =>
  setProduction((prev) => ({
    ...prev,
    crew: typeof updater === "function" ? updater(prev.crew ?? []) : updater,
  }));

const setDays = (updater) =>
  setProduction((prev) => {
    const next = typeof updater === "function" ? updater(prev.days ?? []) : updater;
    return { ...prev, days: next.map(migrateDay) };
  });
      const [tab, setTab] = useState(production.isNew ? "setup" : "days");
      const [saveToast, setSaveToast] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [resetMode, setResetMode] = useState(false);
      const [openCrewForm, setOpenCrewForm] = useState(false);
      const undoRef = useRef(null);
      const undoTimerRef = useRef(null);
      const [undoVisible, setUndoVisible] = useState(false);
      const [undoLabel, setUndoLabel] = useState('');

      const pushUndo = (label, extra = {}) => {
        undoRef.current = { crew: production.crew ?? [], days: production.days ?? [], ...extra };
        setUndoLabel(label);
        setUndoVisible(true);
        if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
        undoTimerRef.current = setTimeout(() => setUndoVisible(false), 5000);
      };
      const handleUndo = () => {
        if (!undoRef.current) return;
        const { crew: c, days: d, weekStarts, gridDates } = undoRef.current;
        setProduction(prev => ({
          ...prev,
          crew: c,
          days: d,
          ...(weekStarts !== undefined ? { weekStarts } : {}),
          ...(gridDates !== undefined ? { gridDates } : {}),
        }));
        undoRef.current = null;
        setUndoVisible(false);
        if (undoTimerRef.current) { clearTimeout(undoTimerRef.current); undoTimerRef.current = null; }
      };

      const handleRemoveWeek = (monday) => {
        pushUndo('Week removed', { weekStarts: production.weekStarts ?? [], gridDates: production.gridDates ?? [] });
        const weekDates = new Set(Array.from({ length: 7 }, (_, i) => {
          const d = new Date(monday + "T12:00:00"); d.setDate(d.getDate() + i);
          return d.toISOString().slice(0, 10);
        }));
        setProduction(p => ({
          ...p,
          weekStarts: (p.weekStarts || []).filter(w => w !== monday),
          gridDates: (p.gridDates || []).filter(d => !weekDates.has(d)),
          days: (p.days || []).filter(d => !weekDates.has(d.date)),
        }));
      };

      useEffect(() => {
        if (production.isNew) setProduction(p => ({ ...p, isNew: false }));
      }, []);

      const handleGridAddDate = (date) => setProduction(p => ({ ...p, gridDates: [...(p.gridDates || []), date] }));
      const handleGridAddWeek = (monday) => setProduction(p => ({ ...p, weekStarts: [...(p.weekStarts || []), monday] }));
      const handleGridAddCrew = () => { setOpenCrewForm(true); setTab("setup"); };

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };

      useEffect(() => {
        if (crew.length === 0 && days.length === 0 && !production.title && !production.prodCo) return;
        setSaveToast(true);
        const t = setTimeout(() => setSaveToast(false), 1200);
        return () => clearTimeout(t);
      }, [crew, days, production]);

      const clearAll = () => {
        setProduction((prev) => ({ id: prev.id, title: "", prodCo: "", crew: [], days: [], defaultDay: DEFAULT_PRODUCTION_DAY, gridDates: [], weekStarts: [] }));
        setResetMode(false);
      };

      const totalShoot = days.reduce((s, d) => { const c = crew.find((cc) => cc.id === d.crewId); return c ? s + calcForDisplay(production, d, c, findPrevDay(days, d)).total : s; }, 0);

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <Toast show={!!toastMsg}>{toastMsg}</Toast>
          {undoVisible && (
            <div className="fixed bottom-[4.5rem] left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-neutral-800 border border-neutral-600 shadow-lg px-4 py-2.5 rounded-full whitespace-nowrap">
              <span className="text-[11px] text-neutral-300 uppercase tracking-wide font-bold">{undoLabel}</span>
              <button onClick={handleUndo} className="text-[11px] text-sky-400 hover:text-sky-300 uppercase tracking-wide font-bold transition-colors">Undo</button>
            </div>
          )}

          <div className="border-b border-sky-400 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
              <div>
                <button onClick={onBack} className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 hover:text-sky-400 transition-colors font-bold mb-1 flex items-center gap-1">← Derrick's TimeMachine</button>
                <div className="font-bold uppercase tracking-tight leading-none text-sm">{production.title || <span className="text-neutral-500">Untitled Production</span>}</div>
              </div>
              <div className="flex items-center gap-3">
                {saveToast && <div className="flex items-center gap-1 text-[10px] uppercase tracking-wider text-green-400"><ISave/>Saved</div>}
                <div className="text-[11px] font-mono text-neutral-400 hidden md:block">Total: <span className="text-neutral-100 font-bold">{fmtGBP(totalShoot)}</span></div>
                {resetMode ? (
                  <div className="flex gap-1">
                    <Btn size="sm" variant="danger" onClick={clearAll}>Confirm Reset</Btn>
                    <Btn size="sm" variant="ghost" onClick={() => setResetMode(false)}>Cancel</Btn>
                  </div>
                ) : (
                  <Btn size="sm" variant="ghost" onClick={() => setResetMode(true)}><IReset/>Reset</Btn>
                )}
              </div>
            </div>
          </div>

          <div className="border-b border-neutral-800 bg-neutral-900 sticky z-30" style={{ top: 'calc(65px + env(safe-area-inset-top))' }}>
            <div className="max-w-6xl mx-auto px-4 flex overflow-x-auto">
              {[
                { k: "setup",  label: "Setup",      I: IBriefcase },
                { k: "days",   label: "Timesheets", I: ICal },
                { k: "export", label: "Export",     I: IShare },
              ].map(({ k, label, I }) => (
                <button key={k} onClick={() => setTab(k)}
                  className={`px-4 py-3 text-[11px] uppercase tracking-[0.15em] font-bold border-b-2 transition-colors flex items-center gap-2 whitespace-nowrap ${tab === k ? "border-sky-400 text-sky-400" : "border-transparent text-neutral-500 hover:text-neutral-200"}`}>
                  <I/>{label}
                </button>
              ))}
            </div>
          </div>

          <div className="max-w-6xl mx-auto px-4 py-6">
            {tab === "setup" && (
              <div className="space-y-8">
                <ProductionForm production={production} setProduction={setProduction} />
                <CrewManager crew={crew} setCrew={setCrew} autoStart={openCrewForm} onAutoStartConsumed={() => setOpenCrewForm(false)} onPushUndo={pushUndo} />
              </div>
            )}
            {tab === "days"   && <DaysManager days={days} setDays={setDays} crew={crew} production={production} showToast={showToast} onAddDate={handleGridAddDate} onAddWeek={handleGridAddWeek} onAddCrew={handleGridAddCrew} onPushUndo={pushUndo} onRemoveWeek={handleRemoveWeek} />}
            {tab === "export" && <ExportTab production={production} crew={crew} days={days} showToast={showToast} />}
          </div>

          <div className="text-center text-[10px] text-neutral-600 py-6 uppercase tracking-widest">
            Rates per APA Sept 2025
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ PRODUCTIONS SCREEN ═══════════════════════════ */

    function ProductionsScreen({ productions, onOpen, onCreate, onDelete, onExport, onImport, onUpdateDays }) {
      const importRef = useRef(null);
      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };
      const todayStr = new Date().toISOString().slice(0, 10);
      const showWrapNow = (p) => {
        return (p.days ?? []).some(d => d.date === todayStr);
      };

      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const raw = JSON.parse(ev.target.result);
            const arr = Array.isArray(raw) ? raw : (Array.isArray(raw?.productions) ? raw.productions : null);
            if (!arr || !arr.every(p => p && typeof p.id === 'string')) {
              window.alert('Invalid backup file — not a valid productions export.');
              return;
            }
            onImport(arr);
          } catch {
            window.alert('Could not read file — is it a valid JSON backup?');
          }
        };
        reader.readAsText(file);
      };

      // Derive a sort key (YYYY-MM-DD or null) for each production — display only, no mutation
      const sortKey = (p) => {
        if (p.startDate) return p.startDate;
        const dates = (p.days ?? []).map(d => d.date).filter(Boolean).sort();
        return dates.length > 0 ? dates[0] : null;
      };
      const monthLabel = (key) => {
        if (!key) return "No Date";
        const d = new Date(key + "T12:00:00");
        return d.toLocaleString("default", { month: "long", year: "numeric" });
      };

      // Sort descending (most recent first), nulls last
      const sorted = [...productions].sort((a, b) => {
        const ka = sortKey(a), kb = sortKey(b);
        if (ka === kb) return 0;
        if (!ka) return 1;
        if (!kb) return -1;
        return ka < kb ? 1 : -1;
      });

      // Group into [{ label, items }] preserving sorted order
      const groups = [];
      for (const p of sorted) {
        const label = monthLabel(sortKey(p));
        const last = groups[groups.length - 1];
        if (last && last.label === label) last.items.push(p);
        else groups.push({ label, items: [p] });
      }

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <div className="border-b border-sky-400 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <div>
                <div className="font-bold uppercase tracking-tight leading-none text-sm">Derrick's TimeMachine</div>
                <div className="text-[10px] uppercase tracking-[0.25em] text-sky-400 font-bold mt-0.5">Productions</div>
              </div>
              <div className="flex items-center gap-2 flex-wrap justify-end">
                <Btn variant="ghost" size="sm" onClick={onExport}><IDownload/>Export Backup</Btn>
                <Btn variant="ghost" size="sm" onClick={() => importRef.current?.click()}><IUpload/>Import Backup</Btn>
                <input ref={importRef} type="file" accept=".json,application/json" className="hidden" onChange={handleFileSelect} />
                <Btn variant="primary" onClick={onCreate}><IPlus/>New Production</Btn>
              </div>
            </div>
          </div>

          <div className="max-w-6xl mx-auto px-4 py-6 space-y-4">
            <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><IBriefcase size={16}/>Your Productions</h2>

            {productions.length === 0 && (
              <div className="bg-neutral-900 border border-dashed border-neutral-700 p-8 text-center text-sm text-neutral-500 rounded-[10px]">
                No productions yet. Create one to get started.
              </div>
            )}

            {groups.map(({ label, items }) => (
              <div key={label} className="space-y-2">
                <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-500 font-semibold pt-2">{label}</div>
                {items.map((p) => (
                  <div key={p.id} className="bg-neutral-900 border border-neutral-800 hover:border-sky-400/40 transition-colors p-4 flex items-center justify-between gap-4 flex-wrap rounded-[10px]">
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-neutral-100 truncate">{p.title || <span className="text-neutral-500 italic">Untitled Production</span>}</div>
                      {p.prodCo && <div className="text-sm text-neutral-400 truncate">{p.prodCo}</div>}
                      <div className="text-[11px] text-neutral-500 mt-1 font-mono">
                        {(p.crew ?? []).length} crew &nbsp;·&nbsp; {(p.days ?? []).length} days
                      </div>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      {showWrapNow(p) && (
                        <WrapNowBtn
                          days={p.days ?? []}
                          setDays={(updater) => onUpdateDays(p.id, updater)}
                          showToast={showToast}
                        />
                      )}
                      <Btn variant="ghost" size="sm" onClick={() => onDelete(p.id)} title="Delete production"><ITrash/></Btn>
                      <Btn variant="primary" onClick={() => onOpen(p.id)}>Open →</Btn>
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>
          <Toast show={!!toastMsg}>{toastMsg}</Toast>
        </div>
      );
    }

    /* ═══════════════════════════ ROOT ═══════════════════════════ */

    function Root() {
      const [productions, setProductions] = useStoredState("bigals_productions", [], migrateProduction);
      const [openId, setOpenId] = useState(null);

      // One-time migration: absorb all old localStorage keys into the productions array
      useEffect(() => {
        try {
          if (productions.length > 0) return;
          const oldProd = localStorage.getItem("bigals_production");
          const oldCrew = localStorage.getItem("bigals_crew");
          const oldDays = localStorage.getItem("bigals_days");
          if (oldProd || oldCrew || oldDays) {
            let p = oldProd ? JSON.parse(oldProd) : { title: "", prodCo: "", crew: [], days: [] };
            if (!p.crew?.length && oldCrew) p.crew = JSON.parse(oldCrew).map(migrateCrew);
            if (!p.days?.length && oldDays) p.days = JSON.parse(oldDays).map(migrateDay);
            if (!p.defaultDay) p.defaultDay = DEFAULT_PRODUCTION_DAY;
            setProductions([{ id: uid(), ...p }]);
            localStorage.removeItem("bigals_production");
            localStorage.removeItem("bigals_crew");
            localStorage.removeItem("bigals_days");
          }
        } catch {}
      }, []); // runs once on mount only

      const openProduction = (id) => setOpenId(id);
      const closeProduction = () => setOpenId(null);
      const deleteProduction = (id) => {
        if (!window.confirm("Delete this production? This cannot be undone.")) return;
        setProductions((prev) => prev.filter((p) => p.id !== id));
        if (openId === id) setOpenId(null);
      };
      const createProduction = () => {
        const p = { id: uid(), title: "Untitled Production", prodCo: "", crew: [], days: [], defaultDay: DEFAULT_PRODUCTION_DAY, isNew: true };
        setProductions((prev) => [...prev, p]);
        setOpenId(p.id);
      };
      const setProduction = (updater) =>
        setProductions((prev) => prev.map((p) =>
          p.id === openId ? (typeof updater === "function" ? updater(p) : updater) : p
        ));

      const handleExport = () => {
        const date = new Date().toISOString().slice(0, 10);
        const payload = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), productions }, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `derricks-timemachine-backup-${date}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const handleImport = (parsed) => {
        const n = parsed.length;
        const msg = productions.length > 0
          ? `Import ${n} production${n === 1 ? '' : 's'}? This will replace your ${productions.length} existing production${productions.length === 1 ? '' : 's'}. This cannot be undone.`
          : `Import ${n} production${n === 1 ? '' : 's'}?`;
        if (!window.confirm(msg)) return;
        setProductions(parsed);
      };

      const handleUpdateDays = (id, updater) => {
        setProductions(prev => prev.map(p =>
          p.id === id
            ? { ...p, days: typeof updater === 'function' ? updater(p.days ?? []) : updater }
            : p
        ));
      };

      const currentProduction = productions.find((p) => p.id === openId);

      if (!openId || !currentProduction) {
        return <ProductionsScreen productions={productions} onOpen={openProduction} onCreate={createProduction} onDelete={deleteProduction} onExport={handleExport} onImport={handleImport} onUpdateDays={handleUpdateDays} />;
      }
      return <ProductionApp production={currentProduction} setProduction={setProduction} onBack={closeProduction} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>
</html>
