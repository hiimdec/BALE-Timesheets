    /* ═══════════════════════════ DAY EDIT MODAL ═══════════════════════════ */

    function DayEditModal({ editing, form, setForm, crew, production, days, onSave, onCancel, onRemove, fixedCrewId = null, fixedDate = null }) {
      const isNewAll = editing === "new-all";
      const isNew    = editing === "new";
      const isKnown  = !isNew && !isNewAll;

      const activeCrew = !isNewAll ? crew.find(c => c.id === (fixedCrewId || form.crewId)) : null;
      const activeCalc = activeCrew
        ? calcForDisplay(production, form, activeCrew, findPrevDay(days, form))
        : null;
      const penaltyLines = activeCalc ? activeCalc.lines.filter(l => l.rate === null || l.isTOC) : [];

      const lineColor = (l) => {
        if (l.isTOC) return l.isBreach ? 'red' : 'amber';
        if (l.rate === null) return 'red';
        const lbl = l.label || '';
        if (/^OT|triple time/i.test(lbl)) return 'amber';
        if (/^Early Call/i.test(lbl)) return 'amber';
        if (/^(Saturday|Sunday|Bank Holiday|Night Shoot)/i.test(lbl)) return 'amber';
        return 'neutral';
      };
      const lineCls = (c) => ({
        label: c === 'red' ? 'text-red-300' : c === 'amber' ? 'text-amber-300' : 'text-neutral-300',
        amt:   c === 'red' ? 'text-red-200 font-semibold' : c === 'amber' ? 'text-amber-200 font-semibold' : 'text-neutral-100 font-semibold',
      });

      const resolvedDate = fixedDate || form.date;
      const dateStr = resolvedDate
        ? new Date(resolvedDate + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })
        : "";

      useEffect(() => {
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, []);
      useEscape(onCancel);

      const modalTitle = isNew ? "New Day Entry" : isNewAll ? "New Day — All Crew" : "Edit Day Entry";

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.78)" }}
          onClick={onCancel}
        >
          <div
            className="bg-neutral-900 w-full rounded-xl shadow-2xl border border-neutral-700 flex flex-col"
            style={{ maxWidth: 640, maxHeight: "calc(100dvh - env(safe-area-inset-top) - 1rem)", height: "auto" }}
            onClick={e => e.stopPropagation()}
          >
            {/* ── Fixed header ── */}
            <div className="flex-shrink-0 px-5 pb-3 border-b border-neutral-700" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 1rem)' }}>
              <button onClick={onCancel} className="text-[11px] uppercase tracking-[0.2em] text-neutral-400 hover:text-sky-400 transition-colors flex items-center gap-1 mb-2">
                <IArrowLeft size={12}/> All Days
              </button>
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-1.5">{modalTitle}</div>
                  {fixedCrewId && activeCrew && (
                    <div className="flex items-baseline gap-2 flex-wrap">
                      <span className="text-sm font-semibold text-neutral-100 truncate">{activeCrew.name}</span>
                      <span className="text-[10px] uppercase tracking-wider bg-neutral-800 text-neutral-400 px-1.5 py-px rounded-sm flex-shrink-0">{activeCrew.role}</span>
                      <span className="text-[10px] text-neutral-500 font-mono flex-shrink-0">BDR {fmtGBP(Number(activeCrew.bdr) || 0)}</span>
                      {dateStr && <span className="text-[11px] text-neutral-200 font-semibold flex-shrink-0">{dateStr}</span>}
                    </div>
                  )}
                  {!fixedCrewId && (isNew || isNewAll) && (
                    <div className="text-xs text-neutral-500">
                      {isNewAll
                        ? `${crew.length} crew member${crew.length !== 1 ? "s" : ""}${dateStr ? ` — ${dateStr}` : " — select date below"}`
                        : "Select crew member and date below"}
                    </div>
                  )}
                </div>
                <button onClick={onCancel} className="text-neutral-500 hover:text-neutral-200 transition-colors flex-shrink-0 flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} aria-label="Close"><IX size={16}/></button>
              </div>
            </div>

            {/* ── Scrollable body ── */}
            <div className="flex-1 overflow-y-auto px-5 py-4 min-h-0">
              <DayEntryForm
                value={form}
                onChange={setForm}
                crew={crew}
                allCrewMode={isNewAll}
                fixedCrewId={fixedCrewId}
                fixedDate={fixedDate}
                days={days}
              />
              {isNewAll && (
                <div className="mt-3 bg-black border border-sky-400 p-3 text-xs text-neutral-300 rounded-xl">
                  <span className="text-sky-400 font-bold uppercase tracking-wider">Will create: </span>{crew.length} day entries — one per crew member
                </div>
              )}
              {activeCalc && activeCalc.lines.length > 0 && (
                <div className="mt-4 border border-neutral-800 rounded-lg p-3">
                  <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-2">Cost Breakdown</div>
                  <table className="w-full border-collapse text-[11px]">
                    <tbody>
                      {activeCalc.lines.map((l, i) => {
                        const c = lineColor(l);
                        const cls = lineCls(c);
                        const qtyFmt = typeof l.qty === 'number' ? (Number.isInteger(l.qty) ? l.qty : l.qty.toFixed(2).replace(/\.?0+$/, '')) : l.qty;
                        return (
                          <tr key={i} className="border-b border-neutral-800/50">
                            <td className={`py-1 pr-2 font-semibold leading-tight ${cls.label}`}>{l.label}</td>
                            <td className="py-1 pr-2 text-neutral-500 leading-tight text-[10px] hidden sm:table-cell">{l.detail}</td>
                            <td className={`py-1 pr-2 font-mono text-right whitespace-nowrap ${cls.label}`}>{l.rate != null ? fmtGBP(l.rate) : ''}</td>
                            <td className={`py-1 pr-2 font-mono text-right whitespace-nowrap ${cls.label}`}>{l.rate != null && l.qty != null ? `×${qtyFmt}` : ''}</td>
                            <td className={`py-1 font-mono text-right whitespace-nowrap ${cls.amt}`}>{fmtGBP(l.amount)}</td>
                          </tr>
                        );
                      })}
                      <tr className="border-t-2 border-neutral-600">
                        <td colSpan={3} className="pt-2 pb-1 text-[10px] uppercase tracking-wider text-neutral-500 font-bold">Day Total</td>
                        <td colSpan={2} className="pt-2 pb-1 text-right font-mono font-bold text-white text-sm">{fmtGBP(activeCalc.total)}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            {/* ── Fixed footer ── */}
            <div className="flex-shrink-0 border-t border-neutral-700 px-5 pt-3 space-y-2.5" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>
              {activeCalc && (
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-[9px] text-neutral-600 uppercase tracking-wider mr-0.5">Calc</span>
                  <span className="text-[10px] bg-neutral-800 text-neutral-300 px-2 py-0.5 rounded-full font-mono whitespace-nowrap">
                    BDR {fmtGBP(Number(activeCrew.bdr) || 0)}
                  </span>
                  {activeCalc.meta.otHrs > 0 && (
                    <span className="text-[10px] bg-amber-900 text-amber-200 px-2 py-0.5 rounded-full font-mono whitespace-nowrap">
                      OT {Number.isInteger(activeCalc.meta.otHrs) ? activeCalc.meta.otHrs : activeCalc.meta.otHrs.toFixed(1)}h
                    </span>
                  )}
                  {penaltyLines.length > 0 && (
                    <span className="text-[10px] bg-red-900 text-red-200 px-2 py-0.5 rounded-full font-mono whitespace-nowrap">
                      {penaltyLines.length} {penaltyLines.length === 1 ? "penalty" : "penalties"}
                    </span>
                  )}
                  <span className="ml-auto text-sm font-bold text-white font-mono">{fmtGBP(activeCalc.total)}</span>
                </div>
              )}
              <div className="flex gap-2 flex-wrap">
                <Btn onClick={onSave} variant="success"><ICheck/>Save</Btn>
                <Btn onClick={onCancel} variant="ghost"><IX/>Cancel</Btn>
                {isKnown && (
                  <Btn onClick={() => onRemove(editing)} variant="danger"><ITrash/>Remove day</Btn>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ TIMESHEET GRID ═══════════════════════════ */

    function gridDisplayHours(resolvedDay) {
      const bs = deriveBreakState(resolvedDay);
      if (!bs) return 0;
      return bs.workedHrs - (bs.lunchMissed ? 0 : bs.lunchDuration / 60);
    }

    function GridCell({ day, date, production, member, onEditDay, onAddDay, isWeekend, prevDay = null, hasTOC = false, isTOCBreach = false }) {
      const borderR = "border-r border-neutral-800";
      const bgBase  = isWeekend ? "bg-neutral-900/30" : "";

      if (!day) {
        return (
          <td onClick={() => onAddDay(member.id, date)}
            className={`px-2 py-2 text-center cursor-pointer hover:bg-sky-950/40 transition-colors ${borderR} ${bgBase}`}
            style={{ minWidth: 80 }}>
            <span className="text-[9px] text-neutral-700 uppercase tracking-wider leading-none">Rest</span>
          </td>
        );
      }

      const resolved = resolveDay(production, day, member);
      const { meta, lines } = calcForDisplay(production, day, member, prevDay);

      const hasOT    = meta.otHrs > 0;
      const hasCWD   = meta.continuousDay;
      const hasLate1 = lines.some(l => l.label === "Late 1st Break");
      const hasMSB   = lines.some(l => /missed.*2nd|late.*2nd/i.test(l.label));
      const anyPenalty = hasOT || hasCWD || hasLate1 || hasMSB || hasTOC;

      const ct = resolved.callTime || "—";
      const wt = resolved.wrapTime || "—";
      const hrs = gridDisplayHours(resolved);
      const hrsLabel = Number.isInteger(hrs) ? `${hrs}h` : `${hrs.toFixed(1)}h`;

      return (
        <td onClick={() => onEditDay(day.id)}
          className={`px-2 py-1.5 cursor-pointer hover:bg-neutral-800 transition-colors ${borderR} ${bgBase}`}
          style={{ minWidth: 80 }}>
          <div className="text-[9px] text-neutral-500 font-mono whitespace-nowrap leading-tight">{ct}–{wt}</div>
          <div className="text-[11px] font-bold text-neutral-100 leading-tight">{hrsLabel}</div>
          {anyPenalty && (
            <div className="flex flex-wrap gap-0.5 mt-0.5">
              {hasOT    && <span className="text-[8px] bg-amber-900 text-amber-200 px-1 font-bold uppercase leading-tight py-px rounded-sm">OT</span>}
              {hasCWD   && <span className="text-[8px] bg-red-900 text-red-200 px-1 font-bold uppercase leading-tight py-px rounded-sm">CWD</span>}
              {hasLate1 && <span className="text-[8px] bg-red-900 text-red-200 px-1 font-bold uppercase leading-tight py-px rounded-sm">L1</span>}
              {hasMSB   && <span className="text-[8px] bg-red-900 text-red-200 px-1 font-bold uppercase leading-tight py-px rounded-sm">MSB</span>}
              {hasTOC   && <span className={`text-[8px] px-1 font-bold uppercase leading-tight py-px rounded-sm ${isTOCBreach ? 'bg-red-900 text-red-200' : 'bg-amber-900 text-amber-200'}`}>{isTOCBreach ? 'TOC!' : 'TOC'}</span>}
            </div>
          )}
        </td>
      );
    }

    function TimesheetGrid({ production, crew, days, onEditDay, onAddDay, onAddAllOnDate, onAddWeek, onAddCrew, onAssignAll, onDuplicateDate, onBulkEditDate, onRemoveWeek, onRemoveDate }) {
      const [addDayType, setAddDayType] = useState("Shoot");
      const [editingDate, setEditingDate] = useState(null);
      const [dateEdit, setDateEdit] = useState({});
      const [showTravelInfo, setShowTravelInfo] = useState(false);

      useEffect(() => {
        if (!editingDate) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [editingDate]);
      useEscape(editingDate ? () => setEditingDate(null) : null);

      const DOW_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      const openDateEdit = (date) => {
        const firstEntry = days.find(d => d.date === date);
        const firstMember = firstEntry ? crew.find(c => c.id === firstEntry.crewId) : null;
        const resolved = firstEntry && firstMember
          ? resolveDay(production, firstEntry, firstMember)
          : { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay || {}) };
        const callH = parseHHMM(resolved.callTime || "08:00") ?? 8;
        setDateEdit({
          dayType: resolved.dayType || "Shoot",
          callTime: resolved.callTime || "08:00",
          wrapTime: resolved.wrapTime || "19:00",
          lunchStartTime: resolved.lunchStartTime || "13:30",
          lunchDurationMins: resolved.lunchDurationMins ?? 60,
          secondBreakStartTime: firstEntry?.secondBreakStartTime || toHHMM(callH + 11),
          secondBreakDurationMins: firstEntry?.secondBreakDurationMins ?? 0,
          preCallTime: firstEntry?.preCallTime || firstEntry?.truckCallTime || "",
          miles: firstEntry?.miles ?? 0,
          travelOutMins: firstEntry?.travelOutMins ?? 0,
          travelBackMins: firstEntry?.travelBackMins ?? 0,
          perDiemEnabled: firstEntry?.perDiemEnabled ?? false,
          perDiemAmount: firstEntry?.perDiemAmount ?? 0,
          kitMoneyEnabled: firstEntry?.kitMoneyEnabled ?? false,
          kitMoneyAmount: firstEntry?.kitMoneyAmount ?? 0,
          expenses: firstEntry?.expenses ?? [],
          stepUpEnabled: firstEntry?.stepUpEnabled ?? false,
          stepUpRole: firstEntry?.stepUpRole ?? "",
          stepUpBDR: firstEntry?.stepUpBDR ?? 0,
          stepUpOTCoef: firstEntry?.stepUpOTCoef ?? 1,
          stepUpOTRate: firstEntry?.stepUpOTRate ?? null,
          mileageMethod: firstEntry?.mileageMethod ?? 'manual',
          mileagePostcode: firstEntry?.mileagePostcode ?? '',
          mileageRoundTrip: firstEntry?.mileageRoundTrip !== false,
        });
        setEditingDate(date);
      };

      const weeks = useMemo(() => deriveWeeks(production, days),
        [days, production.gridDates, production.weekStarts, production.startDate]);

      const tocMap = useMemo(() => {
        const map = {};
        for (const member of crew) {
          const memberDays = days.filter(d => d.crewId === member.id)
            .sort((a, b) => a.date.localeCompare(b.date));
          for (let i = 0; i < memberDays.length; i++) {
            const entry = map[memberDays[i].id] || {};
            entry.prevDay = i > 0 ? memberDays[i - 1] : null;
            if (i > 0) {
              const prevR = resolveDay(production, memberDays[i - 1], member);
              const currR = resolveDay(production, memberDays[i], member);
              const toc = calcTOC(prevR, currR, member, production?.apaRounding ?? false);
              if (toc) { entry.hasTOC = true; entry.isTOCBreach = toc.isBreach; }
            }
            map[memberDays[i].id] = entry;
          }
        }
        return map;
      }, [days, crew, production]);

      const handleAddWeek = () => {
        let nextMon;
        if (weeks.length > 0) {
          const d = new Date(weeks[weeks.length - 1][6] + "T12:00:00");
          d.setDate(d.getDate() + 1);
          nextMon = d.toISOString().slice(0, 10);
        } else {
          nextMon = getMonday(todayISO());
        }
        onAddWeek(nextMon);
      };

      const index = useMemo(() => {
        const idx = {};
        for (const d of days) {
          if (!idx[d.date]) idx[d.date] = {};
          idx[d.date][d.crewId] = d;
        }
        return idx;
      }, [days]);

      if (crew.length === 0) {
        return <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-xl">Add crew members first.</div>;
      }

      return (
        <div className="space-y-3">
          <div className="flex items-center gap-3 flex-wrap">
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-neutral-500 uppercase tracking-wider whitespace-nowrap">Add as:</span>
              <Select value={addDayType} onChange={e => setAddDayType(e.target.value)}>{DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}</Select>
            </div>
            <div className="text-[10px] text-neutral-500 uppercase tracking-wider">Tap empty cell to add · Tap date to add all or bulk edit</div>
          </div>

          <div className="overflow-x-auto border border-neutral-800 rounded-xl overflow-hidden">
            <table className="border-collapse text-xs w-full" style={{ minWidth: 560 }}>
              <thead>
                <tr className="border-b border-neutral-700">
                  <th className="text-left px-3 py-2 text-[10px] uppercase tracking-wider text-neutral-500 font-bold whitespace-nowrap border-r border-neutral-700 bg-neutral-950"
                    style={{ position: "sticky", left: 0, zIndex: 20, minWidth: 120 }}>Crew</th>
                  {DOW_LABELS.map((label, i) => {
                    const isSat = i === 5;
                    const isSun = i === 6;
                    const headerBg  = isSun ? "bg-red-950/60"   : isSat ? "bg-amber-950/60" : "bg-neutral-950";
                    const textColor = isSun ? "text-red-400"    : isSat ? "text-amber-400"  : "text-neutral-500";
                    return (
                      <th key={label} className={`px-2 py-2 text-center font-bold text-[10px] uppercase tracking-wider border-r border-neutral-700 ${headerBg} ${textColor}`}
                        style={{ minWidth: 80 }}>{label}</th>
                    );
                  })}
                </tr>
              </thead>

              {weeks.length === 0 ? (
                <tbody>
                  <tr>
                    <td colSpan={8} className="py-12 text-center">
                      <button
                        onClick={handleAddWeek}
                        className="inline-flex items-center gap-2 px-6 py-3 rounded-lg border border-sky-400/40 text-sky-400 hover:bg-sky-400/10 hover:border-sky-400 transition-colors text-sm font-bold uppercase tracking-wider"
                      >
                        <span className="text-lg leading-none">+</span> Add Week
                      </button>
                    </td>
                  </tr>
                </tbody>
              ) : weeks.map((weekDates, weekIdx) => (
                <tbody key={weekDates[0]}>
                  <tr className={`border-b border-neutral-800 ${weekIdx > 0 ? "border-t-2 border-t-neutral-700" : "border-t border-t-neutral-700"}`}>
                    <td className="px-3 py-1.5 bg-neutral-900 border-r border-neutral-700 whitespace-nowrap"
                      style={{ position: "sticky", left: 0, zIndex: 10 }}>
                      <div className="flex items-center justify-between gap-2">
                        <div>
                          <div className="text-[8px] text-neutral-600 uppercase tracking-wider leading-none">Week of</div>
                          <div className="text-[10px] text-neutral-400 font-semibold leading-tight mt-0.5">
                            {new Date(weekDates[0] + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
                          </div>
                        </div>
                        <button
                          onClick={() => onRemoveWeek(weekDates[0])}
                          className="text-[9px] text-red-700 hover:text-red-400 transition-colors font-bold leading-none px-0.5"
                          title="Remove this week"
                          aria-label="Remove this week">✕</button>
                      </div>
                    </td>
                    {weekDates.map(date => {
                      const dow = dayOfWeek(date);
                      const isSat = dow === 6;
                      const isSun = dow === 0;
                      const isBH = isBankHoliday(date);
                      const treatAsSunCol = isSun || isBH;
                      const isEditingThis = editingDate === date;
                      // Bank holidays reuse the Sunday red tint per APA §2.4.
                      const cellBg    = treatAsSunCol ? "bg-red-950/40"   : isSat ? "bg-amber-950/40" : "bg-neutral-900";
                      const numColor  = treatAsSunCol ? "text-red-300"    : isSat ? "text-amber-300"  : "text-neutral-300";
                      const hasEntries = days.some(d => d.date === date);
                      return (
                        <td key={date}
                          onClick={() => {
                            if (isEditingThis) { setEditingDate(null); return; }
                            if (hasEntries) { openDateEdit(date); } else { onAddAllOnDate(date, addDayType); }
                          }}
                          className={`px-2 py-1.5 text-center cursor-pointer border-r border-neutral-700 transition-colors hover:bg-neutral-800/60 ${cellBg}${isEditingThis ? " ring-2 ring-inset ring-sky-400" : ""}`}
                          title={isBH ? `Bank Holiday — ${getBankHolidayName(date)}` : undefined}>
                          <div className={`text-[11px] font-bold leading-none ${numColor}`}>
                            {new Date(date + "T12:00:00").getDate()}
                          </div>
                          <div className="text-[8px] text-neutral-600 leading-none mt-0.5">
                            {new Date(date + "T12:00:00").toLocaleDateString("en-GB", { month: "short" })}
                          </div>
                          {isBH && (
                            <div className="text-[7px] font-bold text-red-400 leading-none mt-0.5 uppercase tracking-wider">BH</div>
                          )}
                          <div className="flex items-center justify-center gap-1.5 mt-0.5">
                            <button onClick={e => { e.stopPropagation(); onAssignAll(date, addDayType); }}
                              className="text-[8px] text-neutral-600 hover:text-sky-400 transition-colors font-bold uppercase tracking-wider"
                              title="Add all crew for this date"
                              aria-label="Assign all crew for this date">+all</button>
                            {days.some(d => d.date === date) && (
                              <button onClick={e => { e.stopPropagation(); onDuplicateDate(date); }}
                                className="text-neutral-600 hover:text-sky-400 transition-colors"
                                title="Duplicate this date"
                                aria-label="Duplicate this date"><ICopy size={10}/></button>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                  {crew.map(member => (
                    <tr key={member.id} className="border-b border-neutral-800">
                      <td className="px-3 py-2 whitespace-nowrap border-r border-neutral-700 bg-neutral-950"
                        style={{ position: "sticky", left: 0, zIndex: 10 }}>
                        <div className="text-[11px] font-semibold text-neutral-200">{member.name}</div>
                        <div className="text-[9px] text-neutral-500 uppercase tracking-wider">{member.role}</div>
                      </td>
                      {weekDates.map(date => {
                        const dow = dayOfWeek(date);
                        const isSat = dow === 6;
                        const isSun = dow === 0;
                        return (
                          <GridCell
                            key={date}
                            day={index[date]?.[member.id]}
                            date={date}
                            production={production}
                            member={member}
                            onEditDay={onEditDay}
                            onAddDay={(crewId, d) => onAddDay(crewId, d, addDayType)}
                            isWeekend={isSat || isSun}
                            prevDay={index[date]?.[member.id] ? (tocMap[index[date][member.id].id]?.prevDay ?? null) : null}
                            hasTOC={!!(index[date]?.[member.id] && tocMap[index[date][member.id].id]?.hasTOC)}
                            isTOCBreach={!!(index[date]?.[member.id] && tocMap[index[date][member.id].id]?.isTOCBreach)}
                          />
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              ))}

              <tbody>
                <tr className="border-t border-neutral-700">
                  <td className="px-3 py-2 bg-neutral-950 border-r border-neutral-700" style={{ position: "sticky", left: 0, zIndex: 10 }}>
                    <button onClick={onAddCrew} className="text-[10px] uppercase tracking-wider font-bold text-neutral-500 hover:text-sky-400 transition-colors flex items-center gap-1">
                      <span className="text-base leading-none">+</span> Crew
                    </button>
                  </td>
                  <td colSpan={7} className="bg-neutral-950" />
                </tr>
              </tbody>
            </table>
          </div>

          <div className="flex justify-center pt-1">
            <button onClick={handleAddWeek}
              className="text-[10px] uppercase tracking-wider font-bold text-neutral-500 hover:text-sky-400 border border-neutral-700 hover:border-sky-400 transition-colors px-4 py-1.5 rounded-sm flex items-center gap-1.5">
              <span className="text-sm leading-none font-bold">+</span> Add Week
            </button>
          </div>

          {editingDate && (
            <div
              role="dialog" aria-modal="true" aria-labelledby="date-edit-title"
              className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
              style={{ backgroundColor: "rgba(0,0,0,0.78)" }}
              onClick={() => setEditingDate(null)}
            >
              <div
                className="bg-neutral-900 w-full rounded-xl shadow-2xl border border-neutral-700 flex flex-col"
                style={{ maxWidth: 640, maxHeight: "calc(100dvh - env(safe-area-inset-top) - 1rem)" }}
                onClick={e => e.stopPropagation()}
              >
                {/* ── Fixed header ── */}
                <div className="flex-shrink-0 px-5 pb-3 border-b border-neutral-700" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 1rem)' }}>
                  <div className="flex items-start justify-between gap-3">
                    <div className="min-w-0">
                      <div id="date-edit-title" className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-1.5">All Crew</div>
                      <div className="flex items-baseline gap-2 flex-wrap">
                        <span className="text-sm font-semibold text-neutral-100">
                          {weekday(editingDate)} {new Date(editingDate + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
                        </span>
                        <span className="text-[11px] text-neutral-500">Updates all existing entries on this date</span>
                      </div>
                    </div>
                    <button onClick={() => setEditingDate(null)} className="text-neutral-500 hover:text-neutral-200 transition-colors flex-shrink-0 flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} aria-label="Close"><IX size={16}/></button>
                  </div>
                </div>

                {/* ── Scrollable body ── */}
                <div className="flex-1 overflow-y-auto px-5 py-4 min-h-0 space-y-4">
                  {(production.invoices || []).some(inv => inv.status === "sent" || inv.status === "paid") && (() => {
                    const count = (production.invoices || []).filter(inv => inv.status === "sent" || inv.status === "paid").length;
                    return (
                      <div className="bg-sky-900/20 border border-sky-700/40 rounded-xl px-3 py-2 text-[11px] text-sky-300">
                        This production has {count} sent invoice{count !== 1 ? "s" : ""}. Changes here won't update them.
                      </div>
                    );
                  })()}
                  {/* Core: day type, times, lunch */}
                  <div className="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden">
                    <div className="px-4 py-3 border-b border-neutral-800">
                      <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold">Day</div>
                    </div>
                    <div className="px-4 py-4 space-y-3">
                      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <Field label="Day Type">
                          <Select value={dateEdit.dayType || "Shoot"} onChange={e => setDateEdit(p => ({...p, dayType: e.target.value}))}>
                            {DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                          </Select>
                        </Field>
                        <Field label="Call Time"><TimeInput value={dateEdit.callTime || ""} onChange={e => setDateEdit(p => ({...p, callTime: e.target.value}))} /></Field>
                        <Field label="Wrap Time"><TimeInput value={dateEdit.wrapTime || ""} onChange={e => setDateEdit(p => ({...p, wrapTime: e.target.value}))} /></Field>
                        {dateEdit.dayType !== "Travel Day" && dateEdit.dayType !== "Rest Day" && (
                          <Field label="Pre-call Time" hint="Early arrival — paid at BHR. Lunch and CWD from main call.">
                            <TimeInput value={dateEdit.preCallTime || ""} onChange={e => setDateEdit(p => ({...p, preCallTime: e.target.value}))} />
                          </Field>
                        )}
                        {dateEdit.dayType !== "Travel Day" && dateEdit.dayType !== "Rest Day" && <>
                          <Field label="Lunch Start"><TimeInput value={dateEdit.lunchStartTime || ""} onChange={e => setDateEdit(p => ({...p, lunchStartTime: e.target.value}))} /></Field>
                          <Field label="Lunch Duration">
                            <Select value={dateEdit.lunchDurationMins ?? 60} onChange={e => setDateEdit(p => ({...p, lunchDurationMins: Number(e.target.value)}))}>
                              {LUNCH_DURATIONS.map(d => <option key={d.v} value={d.v}>{d.label}</option>)}
                            </Select>
                          </Field>
                        </>}
                      </div>
                    </div>
                  </div>

                  {/* Core: 2nd break */}
                  {dateEdit.dayType !== "Travel Day" && dateEdit.dayType !== "Rest Day" && (
                    <div className="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden">
                      <div className="px-4 py-3 border-b border-neutral-800">
                        <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold">2nd Break</div>
                      </div>
                      <div className="px-4 py-4">
                        <div className="grid grid-cols-2 gap-3">
                          <Field label="2nd Break Start">
                            <TimeInput value={dateEdit.secondBreakStartTime || ""} onChange={e => setDateEdit(p => ({...p, secondBreakStartTime: e.target.value}))} disabled={Number(dateEdit.secondBreakDurationMins) === 0} />
                          </Field>
                          <Field label="2nd Break Duration">
                            <Select value={Number(dateEdit.secondBreakDurationMins ?? 0)} onChange={e => setDateEdit(p => ({...p, secondBreakDurationMins: Number(e.target.value)}))}>
                              {SECOND_BREAK_DURATIONS.map(s => <option key={s.v} value={s.v}>{s.label}</option>)}
                            </Select>
                          </Field>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Core: mileage */}
                  <Disclosure
                    label="Mileage"
                    summary={dateEdit.miles > 0 ? `${dateEdit.miles} mi` : 'Not set'}
                    defaultOpen={dateEdit.miles > 0 || !!dateEdit.mileagePostcode}
                  >
                    <MileageInput
                      day={dateEdit}
                      updateDay={patch => setDateEdit(p => ({...p, ...patch}))}
                      days={[]}
                    />
                  </Disclosure>

                  {/* Extras: travel time, per diem, step-up */}
                  <Disclosure label="Extras">
                    {dateEdit.dayType !== "Travel Day" && (
                      <div className="space-y-3">
                        <div className="flex items-center gap-1.5">
                          <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Travel Time</span>
                          <button type="button" onClick={() => setShowTravelInfo(s => !s)}
                            className="text-neutral-600 hover:text-sky-400 transition-colors"
                            aria-label="Travel time calculation info">
                            <IInfo size={12}/>
                          </button>
                        </div>
                        <div className="text-[10px] text-neutral-500 leading-snug">{TRAVEL_TIME_CAPTION}</div>
                        {showTravelInfo && <StatusMsg kind="info"><span className="whitespace-pre-line">{TRAVEL_TIME_EXPLAINER}</span></StatusMsg>}
                        <div className="grid grid-cols-2 gap-3">
                          <Field label="Travel Out (mins)"><Input type="number" min="0" inputMode="numeric" value={dateEdit.travelOutMins ?? 0} onChange={e => setDateEdit(p => ({...p, travelOutMins: Number(e.target.value)}))} /></Field>
                          <Field label="Travel Back (mins)"><Input type="number" min="0" inputMode="numeric" value={dateEdit.travelBackMins ?? 0} onChange={e => setDateEdit(p => ({...p, travelBackMins: Number(e.target.value)}))} /></Field>
                        </div>
                      </div>
                    )}
                    <div className="space-y-3">
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Per Diem</span>
                        <Toggle value={!!dateEdit.perDiemEnabled} onChange={val => setDateEdit(p => ({...p, perDiemEnabled: val}))} ariaLabel="Per diem" />
                      </div>
                      {dateEdit.perDiemEnabled && (
                        <Field label="Per Diem Amount (£)" hint="Added to day total">
                          <Input type="number" min="0" step="0.01" value={dateEdit.perDiemAmount ?? 0} onChange={e => setDateEdit(p => ({...p, perDiemAmount: Number(e.target.value)}))} />
                        </Field>
                      )}
                    </div>
                    <div className="space-y-3">
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Kit Money</span>
                        <Toggle value={!!dateEdit.kitMoneyEnabled} onChange={val => setDateEdit(p => ({...p, kitMoneyEnabled: val}))} ariaLabel="Kit money" />
                      </div>
                      {dateEdit.kitMoneyEnabled && (
                        <Field label="Kit Money Amount (£)" hint="Added to day total">
                          <Input type="number" min="0" step="0.01" value={dateEdit.kitMoneyAmount ?? 0} onChange={e => setDateEdit(p => ({...p, kitMoneyAmount: Number(e.target.value)}))} />
                        </Field>
                      )}
                    </div>
                    <div className="space-y-3">
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Expenses</span>
                        <button
                          type="button"
                          onClick={() => setDateEdit(p => ({ ...p, expenses: [...(p.expenses || []), { id: uid(), amount: 0, category: "Other", description: "" }] }))}
                          className="text-[10px] uppercase tracking-wide text-sky-400 hover:text-sky-300 font-bold flex items-center gap-1"
                        ><IPlus size={11}/>Add expense</button>
                      </div>
                      {(dateEdit.expenses || []).length > 0 && (
                        <div className="space-y-2">
                          {(dateEdit.expenses || []).map((exp) => (
                            <div key={exp.id} className="flex flex-wrap items-center gap-2">
                              <Select
                                value={exp.category}
                                onChange={(e) => setDateEdit(p => ({ ...p, expenses: p.expenses.map(x => x.id === exp.id ? { ...x, category: e.target.value } : x) }))}
                                className="flex-shrink-0" style={{ width: 116 }}
                              >
                                {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                              </Select>
                              <Input
                                type="number" min="0" step="0.01"
                                value={exp.amount}
                                onChange={(e) => setDateEdit(p => ({ ...p, expenses: p.expenses.map(x => x.id === exp.id ? { ...x, amount: Number(e.target.value) || 0 } : x) }))}
                                placeholder="0.00" className="flex-shrink-0" style={{ width: 84 }}
                              />
                              <Input
                                type="text"
                                value={exp.description}
                                onChange={(e) => setDateEdit(p => ({ ...p, expenses: p.expenses.map(x => x.id === exp.id ? { ...x, description: e.target.value } : x) }))}
                                placeholder="Description" className="flex-1 min-w-[80px]"
                              />
                              <button
                                type="button"
                                onClick={() => setDateEdit(p => ({ ...p, expenses: p.expenses.filter(x => x.id !== exp.id) }))}
                                className="text-neutral-600 hover:text-red-400 transition-colors flex-shrink-0 p-1"
                                aria-label="Remove expense"
                              ><IX size={14}/></button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    <div className="space-y-3">
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Step-Up for all crew</span>
                        <Toggle value={!!dateEdit.stepUpEnabled} onChange={val => setDateEdit(p => ({...p, stepUpEnabled: val}))} ariaLabel="Step-up" />
                      </div>
                      {dateEdit.stepUpEnabled && (
                        <>
                          <Field label="Step-Up Role">
                            <Select value={dateEdit.stepUpRole || ""} onChange={e => {
                              const role = e.target.value;
                              const d = ROLE_DEFAULTS[role] || {};
                              setDateEdit(p => ({...p, stepUpRole: role, stepUpBDR: d.bdr ?? p.stepUpBDR, stepUpOTCoef: d.otCoef ?? 1, stepUpOTRate: d.otRate ?? null}));
                            }}>
                              <option value="">— Select Role —</option>
                              {Object.entries(DEPARTMENTS).map(([dept, roles]) => <optgroup key={dept} label={dept}>{Object.keys(roles).map(r => <option key={r} value={r}>{r}</option>)}</optgroup>)}
                            </Select>
                          </Field>
                          <div className="grid grid-cols-2 gap-3">
                            <Field label="Step-Up BDR (£)" hint="Override for this day only">
                              <Input type="number" min="0" step="0.01" value={dateEdit.stepUpBDR ?? 0} onChange={e => setDateEdit(p => ({...p, stepUpBDR: Number(e.target.value)}))} />
                            </Field>
                            <Field label="Step-Up OT Coef">
                              <Select value={String(dateEdit.stepUpOTCoef ?? 1)} onChange={e => setDateEdit(p => ({...p, stepUpOTCoef: Number(e.target.value)}))}>
                                <option value="1">1×</option>
                                <option value="1.25">1.25×</option>
                                <option value="1.5">1.5×</option>
                              </Select>
                            </Field>
                          </div>
                        </>
                      )}
                    </div>
                  </Disclosure>
                </div>

                {/* ── Fixed footer ── */}
                <div className="flex-shrink-0 border-t border-neutral-700 px-5 pt-3 flex gap-2" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>
                  <Btn variant="success" onClick={() => { onBulkEditDate(editingDate, dateEdit); setEditingDate(null); }}>
                    <ICheck/>Save all
                  </Btn>
                  <Btn variant="ghost" onClick={() => setEditingDate(null)}><IX/>Cancel</Btn>
                  <div className="flex-1" />
                  <Btn variant="danger" onClick={() => { setEditingDate(null); onRemoveDate(editingDate); }}>
                    <ITrash size={14}/>Delete
                  </Btn>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════ DAYS MANAGER ═══════════════════════════ */

    function dayTypeDefaults(dayType) {
      return {
        callTime: "08:00",
        wrapTime: toHHMM(8 + (DEFAULT_HOURS[dayType] ?? 11)),
        ...(dayType === "Travel Day" || dayType === "Rest Day" ? { lunchDurationMins: 0 } : {}),
      };
    }

    function makeBlankDay(crewId = "") {
      return {
        id: uid(), crewId, date: todayISO(),
        wrapNextDay: false,
        preCallTime: "",
        noMealProvided: false, secondBreakDurationMins: 0,
        cwdBreak1Given: true, cwdBreak2Given: true,
        travelOutMins: 0, travelBackMins: 0, miles: 0,
        perDiemEnabled: false, perDiemAmount: 0,
        kitMoneyEnabled: false, kitMoneyAmount: 0,
        expenses: [],
        stepUpEnabled: false, stepUpRole: "", stepUpBDR: 0, stepUpOTCoef: 1,
        note: "",
      };
    }

    function WrapNowBtn({ days, setDays, showToast }) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayEntries = days.filter(d => d.date === todayStr);
      const alreadyWrapped = todayEntries.some(d => d.wrapTime && d.wrapTime.length > 0);
      const [confirming, setConfirming] = useState(false);

      const doWrap = () => {
        const now = new Date();
        const totalMins = now.getHours() * 60 + now.getMinutes();
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const m = rounded % 60;
        const wrapStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        setDays(prev => prev.map(d => d.date === todayStr ? { ...d, wrapTime: wrapStr } : d));
        showToast(`Wrapped ${todayEntries.length} entr${todayEntries.length === 1 ? 'y' : 'ies'} at ${wrapStr}`);
        setConfirming(false);
      };

      const handleClick = () => {
        if (todayEntries.length === 0) { showToast("No work days found for today"); return; }
        if (alreadyWrapped && !confirming) {
          setConfirming(true);
          setTimeout(() => setConfirming(false), 4000);
          return;
        }
        doWrap();
      };

      const cls = `inline-flex items-center justify-center text-[10px] uppercase tracking-wider font-bold rounded-lg px-3 transition-colors ${confirming ? "border border-amber-500 text-amber-300 bg-amber-500/10" : "border border-amber-500/50 text-amber-300 hover:border-amber-400"}`;

      return (
        <button onClick={handleClick} className={cls}
          style={{ minWidth: 96, height: 36, flexShrink: 0 }}
          title={confirming ? "Tap again to overwrite" : "Set today's wrap time to now"}>
          {confirming ? "Confirm?" : "WrapNow"}
        </button>
      );
    }

    function LunchNowBtn({ days, setDays, showToast }) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayEntries = days.filter(d => d.date === todayStr);
      const alreadyLunched = todayEntries.some(d => d.lunchStartTime && d.lunchStartTime.length > 0);
      const [confirming, setConfirming] = useState(false);

      const doLunch = () => {
        const now = new Date();
        const totalMins = now.getHours() * 60 + now.getMinutes();
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const m = rounded % 60;
        const lunchStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        setDays(prev => prev.map(d => d.date === todayStr ? { ...d, lunchStartTime: lunchStr } : d));
        showToast(`Lunch logged at ${lunchStr}`);
        setConfirming(false);
      };

      const handleClick = () => {
        if (todayEntries.length === 0) { showToast("No work days found for today"); return; }
        if (alreadyLunched && !confirming) {
          setConfirming(true);
          setTimeout(() => setConfirming(false), 4000);
          return;
        }
        doLunch();
      };

      const cls = `inline-flex items-center justify-center text-[10px] uppercase tracking-wider font-bold rounded-lg px-3 transition-colors ${confirming ? "border border-amber-500 text-amber-300 bg-amber-500/10" : "border border-sky-500/50 text-sky-300 hover:border-sky-400"}`;

      return (
        <button onClick={handleClick} className={cls}
          style={{ minWidth: 96, height: 36, flexShrink: 0 }}
          title={confirming ? "Tap again to overwrite" : "Log today's lunch start time"}>
          {confirming ? "Confirm?" : "LunchNow"}
        </button>
      );
    }

    function DaysManager({ days, setDays, crew, production, showToast, onAddDate, onAddWeek, onAddCrew, onPushUndo, onRemoveWeek }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState(() => makeBlankDay());
      const [confirmRemove, setConfirmRemove] = useState(null);
      const [confirmOpts, setConfirmOpts] = useState(null);
      const [dupDateDialog, setDupDateDialog] = useState(null);
      const [gridView, setGridView] = useState(production.bestBoyMode);
      const [fixedCrewId, setFixedCrewId] = useState(null);
      const [fixedDate, setFixedDate] = useState(null);

      const startNew = () => {
        if (crew.length === 0) return;
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(crew[0].id), secondBreakStartTime: toHHMM(callH + 11) });
        setEditing("new");
        setFixedCrewId(!production.bestBoyMode ? crew[0].id : null);
        setFixedDate(null);
      };
      const startNewAll = () => {
        if (crew.length === 0) return;
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(""), secondBreakStartTime: toHHMM(callH + 11) });
        setEditing("new-all");
        setFixedCrewId(null);
        setFixedDate(null);
      };
      const startEdit = (d) => {
        setForm(migrateDay(d));
        setEditing(d.id);
        setFixedCrewId(d.crewId);
        setFixedDate(d.date);
      };
      const cancel = () => {
        setEditing(null);
        setFixedCrewId(null);
        setFixedDate(null);
      };
      const handleEditDayFromGrid = (id) => { const d = days.find(day => day.id === id); if (d) startEdit(d); };
      const handleAddDayFromGrid = (crewId, date, dayType = "Shoot") => {
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(crewId), date, dayType, ...dayTypeDefaults(dayType), secondBreakStartTime: toHHMM(callH + 11) });
        setEditing("new");
        setFixedCrewId(crewId);
        setFixedDate(date);
      };
      const handleAddAllFromGrid = (date, dayType = "Shoot") => {
        if (crew.length === 0) return;
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(""), date, dayType, ...dayTypeDefaults(dayType), secondBreakStartTime: toHHMM(callH + 11) });
        setEditing("new-all");
        setFixedCrewId(null);
        setFixedDate(date);
      };
      const handleBulkEditDate = (date, overrides) => {
        const {
          dayType, callTime, wrapTime, lunchStartTime, lunchDurationMins,
          secondBreakStartTime, secondBreakDurationMins,
          preCallTime,
          miles, travelOutMins, travelBackMins,
          perDiemEnabled, perDiemAmount,
          kitMoneyEnabled, kitMoneyAmount,
          stepUpEnabled, stepUpRole, stepUpBDR, stepUpOTCoef, stepUpOTRate,
          mileageMethod, mileagePostcode, mileageRoundTrip,
        } = overrides;
        setDays(prev => prev.map(d =>
          d.date !== date ? d : {
            ...d,
            dayType, callTime, wrapTime, lunchStartTime, lunchDurationMins,
            secondBreakStartTime, secondBreakDurationMins,
            preCallTime,
            miles, travelOutMins, travelBackMins,
            perDiemEnabled, perDiemAmount,
            kitMoneyEnabled, kitMoneyAmount,
            stepUpEnabled, stepUpRole, stepUpBDR, stepUpOTCoef, stepUpOTRate,
            mileageMethod, mileagePostcode, mileageRoundTrip,
          }
        ));
      };
      const handleAssignAllOnDate = (date, dayType = "Shoot") => {
        const toAdd = crew.filter(m => !days.find(d => d.date === date && d.crewId === m.id));
        if (toAdd.length > 0) setDays(prev => [...prev, ...toAdd.map(m => ({ ...makeBlankDay(m.id), date, dayType, ...dayTypeDefaults(dayType) }))]);
      };
      const handleRemoveAllOnDate = (date) => {
        const count = days.filter(d => d.date === date).length;
        if (count === 0) return;
        setConfirmOpts({
          title: "Remove all entries?",
          message: `Remove all ${count} entr${count === 1 ? 'y' : 'ies'} on ${fmtDate(date)}? This cannot be undone.`,
          confirmLabel: "Remove",
          confirmTone: "danger",
          onConfirm: () => setDays(prev => prev.filter(d => d.date !== date)),
        });
      };

      const handleDuplicateDate = (sourceDate) => {
        const source = days.filter(d => d.date === sourceDate);
        if (source.length === 0) return;
        const next = new Date(sourceDate + "T12:00:00");
        next.setDate(next.getDate() + 1);
        setDupDateDialog({ sourceDate, targetDate: next.toISOString().slice(0, 10), count: source.length });
      };

      const confirmDuplicateDate = (targetDate) => {
        const { sourceDate } = dupDateDialog;
        setDupDateDialog(null);
        const source = days.filter(d => d.date === sourceDate);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)) { showToast("Invalid date"); return; }
        if (targetDate === sourceDate) { showToast("Target date is the same as source"); return; }
        const existing = days.filter(d => d.date === targetDate);
        const copies = source.map(d => ({ ...d, id: uid(), date: targetDate }));
        if (existing.length > 0) {
          setConfirmOpts({
            title: "Replace existing entries?",
            message: `${fmtDateShort(targetDate)} already has ${existing.length} entr${existing.length === 1 ? 'y' : 'ies'}. Replace them?`,
            confirmLabel: "Replace",
            confirmTone: "danger",
            onConfirm: () => setDays(prev => [...prev.filter(d => d.date !== targetDate), ...copies]),
          });
        } else {
          setDays(prev => [...prev, ...copies]);
        }
      };

      const save = () => {
        if (!form.date || !form.callTime || !form.wrapTime) return;
        if (editing === "new-all") {
          const newDays = crew.map((c) => ({ ...form, id: uid(), crewId: c.id }));
          setDays((prev) => [...prev, ...newDays]);
          cancel();
        } else {
          if (!form.crewId) return;
          if (editing === "new") {
            const existing = days.filter(d => d.crewId === form.crewId && d.date === form.date);
            if (existing.length > 0) {
              const crewMember = crew.find(c => c.id === form.crewId);
              setConfirmOpts({
                title: "Duplicate date",
                message: `${crewMember?.name || "This crew member"} already has ${existing.length === 1 ? "a day" : `${existing.length} days`} on ${fmtDateShort(form.date)}. Create another anyway?`,
                confirmLabel: "Create both",
                confirmTone: "primary",
                onConfirm: () => { setDays(prev => [...prev, form]); cancel(); },
              });
              return;
            }
          }
          if (editing !== "new") onPushUndo('Day entry saved');
          setDays((prev) => {
            const exists = prev.find((d) => d.id === form.id);
            return exists ? prev.map((d) => (d.id === form.id ? form : d)) : [...prev, form];
          });
          cancel();
        }
      };

      const remove = (id) => { onPushUndo('Day entry deleted'); setDays((prev) => prev.filter((d) => d.id !== id)); setConfirmRemove(null); };
      const duplicate = (d) => setDays((prev) => [...prev, { ...d, id: uid() }]);

      const handleDayText = async (d, c) => {
        const text = generateDayText(d, c, production, days);
        const r = await shareTextOrCopy(text, `${c.name} ${fmtDateShort(d.date)}`);
        if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
      };
      const grouped = useMemo(() => {
        const by = {};
        days.forEach((d) => { (by[d.date] = by[d.date] || []).push(d); });
        Object.values(by).forEach((arr) => arr.sort((a, b) => {
          const ia = crew.findIndex((c) => c.id === a.crewId);
          const ib = crew.findIndex((c) => c.id === b.crewId);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        }));
        return Object.entries(by).sort(([a], [b]) => a.localeCompare(b));
      }, [days, crew]);

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><ICal size={16}/>Timesheet Entries</h2>
            <div className="flex items-center gap-2 flex-wrap">
              {production.bestBoyMode && (
                <div className="inline-flex rounded-lg bg-neutral-800 p-0.5">
                  <button onClick={() => setGridView(false)} className={`px-3 py-1 rounded-md text-[10px] uppercase tracking-wider font-bold transition-colors duration-150 ${!gridView ? "bg-sky-400 text-black" : "text-neutral-400"}`}>List</button>
                  <button onClick={() => setGridView(true)} className={`px-3 py-1 rounded-md text-[10px] uppercase tracking-wider font-bold transition-colors duration-150 ${gridView ? "bg-sky-400 text-black" : "text-neutral-400"}`}>Grid</button>
                </div>
              )}
              {!editing && crew.length > 0 && (
                <>
                  {production.bestBoyMode && <Btn variant="subtle" onClick={startNewAll}><IUsers2/>Add Day (All Crew)</Btn>}
                  <Btn variant="primary" onClick={startNew}><IPlus/>Add Day</Btn>
                </>
              )}
            </div>
          </div>

          {crew.length === 0 && <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-xl">Add crew members first.</div>}

          {editing && (
            <DayEditModal
              editing={editing}
              form={form}
              setForm={setForm}
              crew={crew}
              production={production}
              days={days}
              onSave={save}
              onCancel={cancel}
              onRemove={(id) => { remove(id); cancel(); }}
              fixedCrewId={fixedCrewId}
              fixedDate={fixedDate}
            />
          )}

          {!gridView && days.length === 0 && !editing && crew.length > 0 && (
            <div className="border-2 border-dashed border-neutral-700 rounded-xl p-8 text-center">
              <div className="flex justify-center mb-3 text-neutral-700"><ICal size={36}/></div>
              <p className="text-sm text-neutral-400 mb-4">No days yet — log today to get started.</p>
              <Btn variant="primary" onClick={startNew}><IPlus/>Add Day</Btn>
            </div>
          )}

          {gridView ? (
            <TimesheetGrid production={production} crew={crew} days={days} onEditDay={handleEditDayFromGrid} onAddDay={handleAddDayFromGrid} onAddAllOnDate={handleAddAllFromGrid} onAddWeek={onAddWeek} onAddCrew={onAddCrew} onAssignAll={handleAssignAllOnDate} onDuplicateDate={handleDuplicateDate} onBulkEditDate={handleBulkEditDate} onRemoveWeek={onRemoveWeek} onRemoveDate={handleRemoveAllOnDate} />
          ) : (
          <div className="space-y-4">
            {grouped.map(([date, entries]) => {
              const dayTotal = entries.reduce((s, e) => { const c = crew.find((cc) => cc.id === e.crewId); return c ? s + calcForDisplay(production, e, c, findPrevDay(days, e)).total : s; }, 0);
              return (
                <div key={date}>
                  <div className="flex items-baseline justify-between mb-2 border-b border-neutral-800 pb-1">
                    <div className="text-[11px] font-bold uppercase tracking-[0.15em] text-sky-400">{fmtDate(date)}</div>
                    <div className="text-sm font-mono text-neutral-300">{fmtGBP(dayTotal)}</div>
                  </div>
                  <div className="space-y-1">
                    {entries.map((d) => {
                      const c = crew.find((cc) => cc.id === d.crewId);
                      if (!c) return (
                        <div key={d.id} className="bg-red-950 border border-red-900 p-3 text-sm text-red-200 flex items-center justify-between rounded-xl">
                          <span>Unassigned crew (deleted)</span>
                          <Btn size="sm" variant="ghost" onClick={() => remove(d.id)}><ITrash/></Btn>
                        </div>
                      );
                      const calc = calcForDisplay(production, d, c, findPrevDay(days, d));
                      const hasPenalty = calc.lines.some(l => l.rate === null);
                      const hasTocBreach = calc.lines.some(l => l.isTOC && l.isBreach);
                      // In-app priority stripe: red = penalty/TOC breach, amber = OT/CWD/TOC, green = clean
                      const stripeClass = (hasPenalty || hasTocBreach) ? 'border-red-500'
                        : (calc.meta.otHrs > 0 || calc.meta.continuousDay || calc.lines.some(l => l.isTOC)) ? 'border-amber-500'
                        : 'border-green-500';
                      return (
                        <div key={d.id}
                          className={`bg-neutral-900 border border-neutral-800 active:bg-neutral-800 transition-colors border-l-4 rounded-xl overflow-hidden cursor-pointer select-none touch-manipulation ${stripeClass}`}
                          style={{ WebkitTapHighlightColor: 'transparent' }}
                          onClick={() => startEdit(d)}
                        >
                          <div className="flex items-center justify-between p-3 gap-3 flex-wrap">
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2 flex-wrap">
                                <div className="font-semibold text-neutral-100">{c.name}</div>
                                <span className="text-[10px] uppercase tracking-wider bg-neutral-800 text-neutral-400 px-1.5 py-0.5">{c.role}</span>
                                <span className="text-[10px] uppercase tracking-wider bg-sky-400 text-black px-1.5 py-0.5 font-bold">{d.dayType}</span>
                                {calc.meta.continuousDay && <span className="text-[10px] uppercase tracking-wider bg-red-900 text-red-200 px-1.5 py-0.5 font-bold">CWD</span>}
                              </div>
                              <div className="text-[11px] text-neutral-400 font-mono mt-1">
                                {d.callTime}–{d.wrapTime}{(parseHHMM(d.wrapTime) !== null && parseHHMM(d.callTime) !== null && parseHHMM(d.wrapTime) <= parseHHMM(d.callTime)) ? " (+1)" : ""} · {calc.meta.workedHrs.toFixed(1)}h · {calc.meta.dayLabel}
                              </div>
                              {d.note?.trim() && <div className="flex items-center gap-1 mt-1"><INote size={11} className="text-neutral-600 flex-shrink-0"/><span className="text-[10px] text-neutral-600">Note</span></div>}
                            </div>
                            <div className="flex items-center gap-2 flex-shrink-0" onClick={e => e.stopPropagation()}>
                              <div className="font-mono font-bold text-neutral-100 text-sm">{fmtGBP(calc.total)}</div>
                              <div className="flex gap-1">
                                <Btn size="sm" variant="ghost" onClick={() => handleDayText(d, c)} title="Send as text" aria-label="Send as text"><IMessage/></Btn>
                                <Btn size="sm" variant="ghost" onClick={() => startEdit(d)} aria-label="Edit day"><IPencil/></Btn>
                                <Btn size="sm" variant="ghost" onClick={() => duplicate(d)} title="Duplicate" aria-label="Duplicate day"><IPlus/></Btn>
                                {confirmRemove === d.id ? (
                                  <>
                                    <Btn size="sm" variant="danger" onClick={() => remove(d.id)}>Del</Btn>
                                    <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(null)} aria-label="Cancel delete"><IX/></Btn>
                                  </>
                                ) : (
                                  <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(d.id)} aria-label="Delete day"><ITrash/></Btn>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
          )}
          <ConfirmDialog
            open={!!confirmOpts}
            title={confirmOpts?.title}
            message={confirmOpts?.message}
            confirmLabel={confirmOpts?.confirmLabel || "Confirm"}
            confirmTone={confirmOpts?.confirmTone || "danger"}
            cancelLabel="Cancel"
            onConfirm={() => { const f = confirmOpts?.onConfirm; setConfirmOpts(null); if (f) f(); }}
            onCancel={() => setConfirmOpts(null)}
          />
          <DuplicateDateDialog
            opts={dupDateDialog}
            onConfirm={confirmDuplicateDate}
            onCancel={() => setDupDateDialog(null)}
          />
        </div>
      );
    }

    /* ═══════════════════════════ EXPORT TAB (BB mode) ═══════════════════════════ */

    // Week picker bottom sheet — lists weeks and lets user pick one
    function WeekPickerSheet({ open, weeks, onPick, onClose, title }) {
      useEffect(() => {
        if (!open) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [open]);
      useEscape(open ? onClose : null);
      if (!open) return null;
      const fmtWeekRange = (wk) => {
        const s = new Date(wk.start + "T12:00:00");
        const e = new Date(wk.end   + "T12:00:00");
        const opt = { day: 'numeric', month: 'short' };
        return `${s.toLocaleDateString('en-GB', opt)} – ${e.toLocaleDateString('en-GB', { ...opt, year: 'numeric' })}`;
      };
      return (
        <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
             style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
             onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
               style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-2">
              <div className="text-sm font-bold text-neutral-100">{title || "Select week"}</div>
            </div>
            <div className="px-4 pb-4 flex flex-col gap-1 max-h-80 overflow-y-auto">
              {weeks.map(wk => (
                <button key={wk.start} type="button"
                  onClick={() => { onPick(wk.index); onClose(); }}
                  className="w-full text-left px-3 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm text-neutral-100 flex items-center justify-between"
                  style={{ WebkitTapHighlightColor: 'transparent' }}>
                  <span className="font-semibold">{wk.label}</span>
                  <span className="text-neutral-400 text-[11px]">{fmtWeekRange(wk)}</span>
                </button>
              ))}
            </div>
            <div className="px-4 pb-4 pt-1 border-t border-neutral-800">
              <button type="button" onClick={onClose}
                className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    // Crew picker bottom sheet — lists crew and lets user pick one
    function CrewPickerSheet({ open, crew, days, production, onPick, onClose, title }) {
      useEffect(() => {
        if (!open) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [open]);
      useEscape(open ? onClose : null);
      if (!open) return null;
      return (
        <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
             style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
             onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
               style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-2">
              <div className="text-sm font-bold text-neutral-100">{title || "Select crew member"}</div>
            </div>
            <div className="px-4 pb-4 flex flex-col gap-1 max-h-80 overflow-y-auto">
              {crew.map(c => {
                const cDays = (days || []).filter(d => d.crewId === c.id);
                const sorted = [...cDays].sort((a, b) => a.date.localeCompare(b.date));
                const total = sorted.reduce((s, d, i) => s + calcForDisplay(production, d, c, sorted[i-1]||null).total, 0);
                return (
                  <button key={c.id} type="button"
                    onClick={() => { onPick(c.id); onClose(); }}
                    className="w-full text-left px-3 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors flex items-center justify-between gap-3"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <div>
                      <div className="text-sm font-semibold text-neutral-100">{c.name}</div>
                      <div className="text-[10px] text-neutral-400 uppercase tracking-wide mt-0.5">{c.role} · {cDays.length} day{cDays.length !== 1 ? 's' : ''}</div>
                    </div>
                    <div className="text-sm font-bold text-neutral-200 font-mono flex-shrink-0">{fmtGBP(total)}</div>
                  </button>
                );
              })}
            </div>
            <div className="px-4 pb-4 pt-1 border-t border-neutral-800">
              <button type="button" onClick={onClose}
                className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    function ExportTab({ production, crew, days, showToast, userPrefs }) {
      // exportState: null | { mode: "timesheet"|"grid", crewId: string|null, weekIdx: number|null }
      const [exportState, setExportState]   = useState(null);
      const [showWeekPicker, setShowWeekPicker] = useState(false);
      const [showCrewPicker, setShowCrewPicker] = useState(false);
      // pendingExport: partially-built export awaiting week or crew selection
      const [pendingExport, setPendingExport] = useState(null);

      const weeks = useMemo(() => computeWeeks(production, days), [production, days]);

      const byCrew = useMemo(() => {
        const m = new Map();
        days.forEach((d) => {
          const c = crew.find((cc) => cc.id === d.crewId); if (!c) return;
          if (!m.has(c.id)) m.set(c.id, { crew: c, entries: [] });
          m.get(c.id).entries.push(d);
        });
        return crew.map((c) => m.get(c.id)).filter(Boolean);
      }, [crew, days]);

      const grandTotal = byCrew.reduce((s, { crew: c, entries }) => {
        const sortedG = [...entries].sort((a, b) => a.date.localeCompare(b.date));
        return s + sortedG.reduce((t, e, i) => t + calcForDisplay(production, e, c, sortedG[i - 1] || null).total, 0);
      }, 0);

      // Trigger print after PrintView mounts
      useEffect(() => {
        if (!exportState) return;
        const timer = setTimeout(() => {
          const cleanup = () => setExportState(null);
          window.addEventListener('afterprint', cleanup, { once: true });
          window.print();
          // Fallback clear after 30s if afterprint doesn't fire
          const fallback = setTimeout(cleanup, 30000);
          return () => clearTimeout(fallback);
        }, 300);
        return () => clearTimeout(timer);
      }, [exportState]);

      const triggerExport = (mode, crewId, weekIdx) => {
        setExportState({ mode, crewId: crewId || null, weekIdx: weekIdx !== undefined ? weekIdx : null });
      };

      // Handlers for the two-step flows (need crew OR week first)
      const handleGridAll = () => {
        if (days.length === 0) return;
        triggerExport("grid", null, null);
      };
      const handleGridWeek = () => {
        if (weeks.length === 1) { triggerExport("grid", null, 0); return; }
        setPendingExport({ mode: "grid", crewId: null });
        setShowWeekPicker(true);
      };
      const handleCrewTS = () => {
        if (byCrew.length === 1) { triggerExport("timesheet", byCrew[0].crew.id, null); return; }
        setPendingExport({ mode: "timesheet", weekIdx: null });
        setShowCrewPicker(true);
      };
      const handleCrewTSWeek = () => {
        if (byCrew.length === 1) {
          if (weeks.length === 1) { triggerExport("timesheet", byCrew[0].crew.id, 0); return; }
          setPendingExport({ mode: "timesheet", crewId: byCrew[0].crew.id });
          setShowWeekPicker(true);
          return;
        }
        setPendingExport({ mode: "timesheet", needsWeek: true });
        setShowCrewPicker(true);
      };

      const onWeekPicked = (weekIdx) => {
        if (pendingExport) {
          triggerExport(pendingExport.mode, pendingExport.crewId || null, weekIdx);
          setPendingExport(null);
        }
      };
      const onCrewPicked = (crewId) => {
        if (!pendingExport) return;
        if (pendingExport.needsWeek) {
          if (weeks.length === 1) { triggerExport("timesheet", crewId, 0); setPendingExport(null); return; }
          setPendingExport({ ...pendingExport, crewId, needsWeek: false });
          setShowWeekPicker(true);
        } else {
          triggerExport(pendingExport.mode, crewId, pendingExport.weekIdx !== undefined ? pendingExport.weekIdx : null);
          setPendingExport(null);
        }
      };

      const handleCrewText = async (c, entries) => {
        try {
          const text = generateCrewText(c, entries, production);
          const r = await shareTextOrCopy(text, `${c.name} Timesheet`);
          if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
        } catch {}
      };

      // Build PrintView props from exportState
      const exportCrewMember = exportState?.crewId
        ? crew.find(c => c.id === exportState.crewId)
        : null;

      if (byCrew.length === 0) {
        return (
          <div className="bg-neutral-900 border border-dashed border-neutral-700 p-8 text-center rounded-xl">
            <div className="flex justify-center mb-2 text-neutral-700"><IFile size={32}/></div>
            <div className="text-neutral-500 text-sm">Add crew and day entries first.</div>
          </div>
        );
      }

      const noDays = days.length === 0;

      return (
        <div className="space-y-6">
          <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><IShare size={16}/>Export</h2>

          {/* Grand total summary */}
          <div className="bg-neutral-900 border-l-4 border-sky-400 p-4 rounded-r-[10px] flex items-baseline justify-between">
            <div>
              <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold">{byCrew.length} crew · {days.length} day entries</div>
              <div className="text-[11px] text-neutral-500 mt-0.5">{weeks.length} week{weeks.length !== 1 ? 's' : ''}</div>
            </div>
            <div className="font-mono font-bold text-neutral-100 text-lg">{fmtGBP(grandTotal)}</div>
          </div>

          {/* Group 1 — Production Grid */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Production Grid</div>
            <Btn variant="primary" onClick={handleGridAll} disabled={noDays}>
              <IDownload/>Export Full Production Grid (PDF)
            </Btn>
            {weeks.length > 1 && (
              <Btn variant="subtle" onClick={handleGridWeek} disabled={noDays}>
                <IDownload/>Export Single Week (PDF)
              </Btn>
            )}
          </div>

          {/* Group 2 — Individual Timesheets */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Individual Timesheets</div>
            <Btn variant="subtle" onClick={handleCrewTS} disabled={noDays}>
              <IDownload/>Export Crew Timesheet (PDF)
            </Btn>
            {weeks.length > 1 && (
              <Btn variant="subtle" onClick={handleCrewTSWeek} disabled={noDays}>
                <IDownload/>Export Crew Timesheet, Single Week (PDF)
              </Btn>
            )}
          </div>

          {/* Text export per crew member */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Text / Clipboard</div>
            {byCrew.map(({ crew: c, entries }) => (
              <Btn key={c.id} variant="ghost" onClick={() => handleCrewText(c, entries)}>
                <IMessage/>{c.name} — Text
              </Btn>
            ))}
          </div>

          {/* PrintView portal — renders when exportState is set */}
          {exportState && (
            <PrintView
              mode={exportState.mode}
              production={production}
              crewMember={exportCrewMember}
              crewList={crew}
              days={days}
              weeks={weeks}
              exportWeekIndex={exportState.weekIdx}
              userPrefs={userPrefs}
            />
          )}

          {/* Pickers */}
          <WeekPickerSheet
            open={showWeekPicker}
            weeks={weeks}
            title="Select week"
            onPick={onWeekPicked}
            onClose={() => { setShowWeekPicker(false); setPendingExport(null); }}
          />
          <CrewPickerSheet
            open={showCrewPicker}
            crew={crew}
            days={days}
            production={production}
            title="Select crew member"
            onPick={onCrewPicked}
            onClose={() => { setShowCrewPicker(false); setPendingExport(null); }}
          />
        </div>
      );
    }
