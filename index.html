                          <div className="flex items-center justify-between p-3 gap-3 flex-wrap">
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2 flex-wrap">
                                <div className="font-semibold text-neutral-100">{c.name}</div>
                                <span className="text-[10px] uppercase tracking-wider bg-neutral-800 text-neutral-400 px-1.5 py-0.5">{c.role}</span>
                                <span className="text-[10px] uppercase tracking-wider bg-sky-400 text-black px-1.5 py-0.5 font-bold">{d.dayType}</span>
                                {calc.meta.continuousDay && <span className="text-[10px] uppercase tracking-wider bg-red-900 text-red-200 px-1.5 py-0.5 font-bold">CWD</span>}
                              </div>
                              <div className="text-[11px] text-neutral-400 font-mono mt-1">
                                {d.callTime}–{d.wrapTime}{(parseHHMM(d.wrapTime) !== null && parseHHMM(d.callTime) !== null && parseHHMM(d.wrapTime) <= parseHHMM(d.callTime)) ? " (+1)" : ""} · {calc.meta.workedHrs.toFixed(1)}h · {calc.meta.dayLabel}
                              </div>
                              {d.note?.trim() && <div className="flex items-center gap-1 mt-1"><INote size={11} className="text-neutral-600 flex-shrink-0"/><span className="text-[10px] text-neutral-600">Note</span></div>}
                            </div>
                            <div className="flex items-center gap-2 flex-shrink-0" onClick={e => e.stopPropagation()}>
                              <div className="font-mono font-bold text-neutral-100 text-sm">{fmtGBP(calc.total)}</div>
                              <div className="flex gap-1">
                                <Btn size="sm" variant="ghost" onClick={() => handleDayText(d, c)} title="Send as text" aria-label="Send as text"><IMessage/></Btn>
                                <Btn size="sm" variant="ghost" onClick={() => startEdit(d)} aria-label="Edit day"><IPencil/></Btn>
                                <Btn size="sm" variant="ghost" onClick={() => duplicate(d)} title="Duplicate" aria-label="Duplicate day"><IPlus/></Btn>
                                {confirmRemove === d.id ? (
                                  <>
                                    <Btn size="sm" variant="danger" onClick={() => remove(d.id)}>Del</Btn>
                                    <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(null)} aria-label="Cancel delete"><IX/></Btn>
                                  </>
                                ) : (
                                  <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(d.id)} aria-label="Delete day"><ITrash/></Btn>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
          )}
          <ConfirmDialog
            open={!!confirmOpts}
            title={confirmOpts?.title}
            message={confirmOpts?.message}
            confirmLabel={confirmOpts?.confirmLabel || "Confirm"}
            confirmTone={confirmOpts?.confirmTone || "danger"}
            cancelLabel="Cancel"
            onConfirm={() => { const f = confirmOpts?.onConfirm; setConfirmOpts(null); if (f) f(); }}
            onCancel={() => setConfirmOpts(null)}
          />
          <DuplicateDateDialog
            opts={dupDateDialog}
            onConfirm={confirmDuplicateDate}
            onCancel={() => setDupDateDialog(null)}
          />
        </div>
      );
    }

    /* ═══════════════════════════ EXPORT TAB (BB mode) ═══════════════════════════ */

    // Week picker bottom sheet — lists weeks and lets user pick one
    function WeekPickerSheet({ open, weeks, onPick, onClose, title }) {
      useEffect(() => {
        if (!open) return;
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = ""; };
      }, [open]);
      if (!open) return null;
      const fmtWeekRange = (wk) => {
        const s = new Date(wk.start + "T12:00:00");
        const e = new Date(wk.end   + "T12:00:00");
        const opt = { day: 'numeric', month: 'short' };
        return `${s.toLocaleDateString('en-GB', opt)} – ${e.toLocaleDateString('en-GB', { ...opt, year: 'numeric' })}`;
      };
      return (
        <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
             style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
             onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-t-[16px] sm:rounded-[16px] shadow-2xl border border-neutral-700 overflow-hidden"
               style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-2">
              <div className="text-sm font-bold text-neutral-100">{title || "Select week"}</div>
            </div>
            <div className="px-4 pb-4 flex flex-col gap-1 max-h-80 overflow-y-auto">
              {weeks.map(wk => (
                <button key={wk.start} type="button"
                  onClick={() => { onPick(wk.index); onClose(); }}
                  className="w-full text-left px-3 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm text-neutral-100 flex items-center justify-between"
                  style={{ WebkitTapHighlightColor: 'transparent' }}>
                  <span className="font-semibold">{wk.label}</span>
                  <span className="text-neutral-400 text-[11px]">{fmtWeekRange(wk)}</span>
                </button>
              ))}
            </div>
            <div className="px-4 pb-4 pt-1 border-t border-neutral-800">
              <button type="button" onClick={onClose}
                className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    // Crew picker bottom sheet — lists crew and lets user pick one
    function CrewPickerSheet({ open, crew, days, production, onPick, onClose, title }) {
      useEffect(() => {
        if (!open) return;
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = ""; };
      }, [open]);
      if (!open) return null;
      return (
        <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
             style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
             onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-t-[16px] sm:rounded-[16px] shadow-2xl border border-neutral-700 overflow-hidden"
               style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-2">
              <div className="text-sm font-bold text-neutral-100">{title || "Select crew member"}</div>
            </div>
            <div className="px-4 pb-4 flex flex-col gap-1 max-h-80 overflow-y-auto">
              {crew.map(c => {
                const cDays = (days || []).filter(d => d.crewId === c.id);
                const sorted = [...cDays].sort((a, b) => a.date.localeCompare(b.date));
                const total = sorted.reduce((s, d, i) => s + calcForDisplay(production, d, c, sorted[i-1]||null).total, 0);
                return (
                  <button key={c.id} type="button"
                    onClick={() => { onPick(c.id); onClose(); }}
                    className="w-full text-left px-3 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors flex items-center justify-between gap-3"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <div>
                      <div className="text-sm font-semibold text-neutral-100">{c.name}</div>
                      <div className="text-[10px] text-neutral-400 uppercase tracking-wide mt-0.5">{c.role} · {cDays.length} day{cDays.length !== 1 ? 's' : ''}</div>
                    </div>
                    <div className="text-sm font-bold text-neutral-200 font-mono flex-shrink-0">{fmtGBP(total)}</div>
                  </button>
                );
              })}
            </div>
            <div className="px-4 pb-4 pt-1 border-t border-neutral-800">
              <button type="button" onClick={onClose}
                className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    function ExportTab({ production, crew, days, showToast, userPrefs }) {
      // exportState: null | { mode: "timesheet"|"grid", crewId: string|null, weekIdx: number|null }
      const [exportState, setExportState]   = useState(null);
      const [showWeekPicker, setShowWeekPicker] = useState(false);
      const [showCrewPicker, setShowCrewPicker] = useState(false);
      // pendingExport: partially-built export awaiting week or crew selection
      const [pendingExport, setPendingExport] = useState(null);

      const weeks = useMemo(() => computeWeeks(production, days), [production, days]);

      const byCrew = useMemo(() => {
        const m = new Map();
        days.forEach((d) => {
          const c = crew.find((cc) => cc.id === d.crewId); if (!c) return;
          if (!m.has(c.id)) m.set(c.id, { crew: c, entries: [] });
          m.get(c.id).entries.push(d);
        });
        return crew.map((c) => m.get(c.id)).filter(Boolean);
      }, [crew, days]);

      const grandTotal = byCrew.reduce((s, { crew: c, entries }) => {
        const sortedG = [...entries].sort((a, b) => a.date.localeCompare(b.date));
        return s + sortedG.reduce((t, e, i) => t + calcForDisplay(production, e, c, sortedG[i - 1] || null).total, 0);
      }, 0);

      // Trigger print after PrintView mounts
      useEffect(() => {
        if (!exportState) return;
        const timer = setTimeout(() => {
          const cleanup = () => setExportState(null);
          window.addEventListener('afterprint', cleanup, { once: true });
          window.print();
          // Fallback clear after 30s if afterprint doesn't fire
          const fallback = setTimeout(cleanup, 30000);
          return () => clearTimeout(fallback);
        }, 300);
        return () => clearTimeout(timer);
      }, [exportState]);

      const triggerExport = (mode, crewId, weekIdx) => {
        setExportState({ mode, crewId: crewId || null, weekIdx: weekIdx !== undefined ? weekIdx : null });
      };

      // Handlers for the two-step flows (need crew OR week first)
      const handleGridAll = () => {
        if (days.length === 0) return;
        triggerExport("grid", null, null);
      };
      const handleGridWeek = () => {
        if (weeks.length === 1) { triggerExport("grid", null, 0); return; }
        setPendingExport({ mode: "grid", crewId: null });
        setShowWeekPicker(true);
      };
      const handleCrewTS = () => {
        if (byCrew.length === 1) { triggerExport("timesheet", byCrew[0].crew.id, null); return; }
        setPendingExport({ mode: "timesheet", weekIdx: null });
        setShowCrewPicker(true);
      };
      const handleCrewTSWeek = () => {
        if (byCrew.length === 1) {
          if (weeks.length === 1) { triggerExport("timesheet", byCrew[0].crew.id, 0); return; }
          setPendingExport({ mode: "timesheet", crewId: byCrew[0].crew.id });
          setShowWeekPicker(true);
          return;
        }
        setPendingExport({ mode: "timesheet", needsWeek: true });
        setShowCrewPicker(true);
      };

      const onWeekPicked = (weekIdx) => {
        if (pendingExport) {
          triggerExport(pendingExport.mode, pendingExport.crewId || null, weekIdx);
          setPendingExport(null);
        }
      };
      const onCrewPicked = (crewId) => {
        if (!pendingExport) return;
        if (pendingExport.needsWeek) {
          if (weeks.length === 1) { triggerExport("timesheet", crewId, 0); setPendingExport(null); return; }
          setPendingExport({ ...pendingExport, crewId, needsWeek: false });
          setShowWeekPicker(true);
        } else {
          triggerExport(pendingExport.mode, crewId, pendingExport.weekIdx !== undefined ? pendingExport.weekIdx : null);
          setPendingExport(null);
        }
      };

      const handleCrewText = async (c, entries) => {
        try {
          const text = generateCrewText(c, entries, production);
          const r = await shareTextOrCopy(text, `${c.name} Timesheet`);
          if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
        } catch {}
      };

      // Build PrintView props from exportState
      const exportCrewMember = exportState?.crewId
        ? crew.find(c => c.id === exportState.crewId)
        : null;

      if (byCrew.length === 0) {
        return (
          <div className="bg-neutral-900 border border-dashed border-neutral-700 p-8 text-center rounded-[10px]">
            <div className="flex justify-center mb-2 text-neutral-700"><IFile size={32}/></div>
            <div className="text-neutral-500 text-sm">Add crew and day entries first.</div>
          </div>
        );
      }

      const noDays = days.length === 0;

      return (
        <div className="space-y-6">
          <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><IShare size={16}/>Export</h2>

          {/* Grand total summary */}
          <div className="bg-neutral-900 border-l-4 border-sky-400 p-4 rounded-r-[10px] flex items-baseline justify-between">
            <div>
              <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold">{byCrew.length} crew · {days.length} day entries</div>
              <div className="text-[11px] text-neutral-500 mt-0.5">{weeks.length} week{weeks.length !== 1 ? 's' : ''}</div>
            </div>
            <div className="font-mono font-bold text-neutral-100 text-lg">{fmtGBP(grandTotal)}</div>
          </div>

          {/* Group 1 — Production Grid */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Production Grid</div>
            <Btn variant="primary" onClick={handleGridAll} disabled={noDays}>
              <IDownload/>Export Full Production Grid (PDF)
            </Btn>
            {weeks.length > 1 && (
              <Btn variant="subtle" onClick={handleGridWeek} disabled={noDays}>
                <IDownload/>Export Single Week (PDF)
              </Btn>
            )}
          </div>

          {/* Group 2 — Individual Timesheets */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Individual Timesheets</div>
            <Btn variant="subtle" onClick={handleCrewTS} disabled={noDays}>
              <IDownload/>Export Crew Timesheet (PDF)
            </Btn>
            {weeks.length > 1 && (
              <Btn variant="subtle" onClick={handleCrewTSWeek} disabled={noDays}>
                <IDownload/>Export Crew Timesheet, Single Week (PDF)
              </Btn>
            )}
          </div>

          {/* Text export per crew member */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Text / Clipboard</div>
            {byCrew.map(({ crew: c, entries }) => (
              <Btn key={c.id} variant="ghost" onClick={() => handleCrewText(c, entries)}>
                <IMessage/>{c.name} — Text
              </Btn>
            ))}
          </div>

          {/* PrintView portal — renders when exportState is set */}
          {exportState && (
            <PrintView
              mode={exportState.mode}
              production={production}
              crewMember={exportCrewMember}
              crewList={crew}
              days={days}
              weeks={weeks}
              exportWeekIndex={exportState.weekIdx}
              userPrefs={userPrefs}
            />
          )}

          {/* Pickers */}
          <WeekPickerSheet
            open={showWeekPicker}
            weeks={weeks}
            title="Select week"
            onPick={onWeekPicked}
            onClose={() => { setShowWeekPicker(false); setPendingExport(null); }}
          />
          <CrewPickerSheet
            open={showCrewPicker}
            crew={crew}
            days={days}
            production={production}
            title="Select crew member"
            onPick={onCrewPicked}
            onClose={() => { setShowCrewPicker(false); setPendingExport(null); }}
          />
        </div>
      );
    }

    /* ═══════════════════════════ PRODUCTION SETTINGS SHEET ═══════════════════════════ */

    function ProductionSettingsSheet({ production, setProduction, crew, onClose }) {
      const set = (k) => (e) => setProduction(p => ({ ...p, [k]: e.target.value }));
      const setNum = (k) => (e) => setProduction(p => ({ ...p, [k]: Number(e.target.value) }));

      const handleStartDateChange = (e) => {
        const newDate = e.target.value;
        if (/^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
          const monday = getMonday(newDate);
          setProduction(prev => ({
            ...prev,
            startDate: newDate,
            weekStarts: [...new Set([...(prev.weekStarts || []), monday])],
          }));
        } else {
          setProduction(prev => ({ ...prev, startDate: newDate }));
        }
      };

      const displayTitle = production.title || "Production";
      const headerLabel = displayTitle.length > 28 ? displayTitle.slice(0, 28) + "…" : displayTitle;

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <div className="border-b border-sky-400 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
              <button onClick={onClose} className="text-neutral-400 hover:text-sky-400 transition-colors p-1 -ml-1" aria-label="Back">
                <IArrowLeft size={16}/>
              </button>
              <div className="flex-1 text-center font-bold uppercase tracking-tight text-sm">{headerLabel} settings</div>
              <div style={{ width: 24 }} />
            </div>
          </div>

          <div className="max-w-2xl mx-auto px-4 py-6">

            <SectionCard title="Production">
              <Field label="Production title">
                <Input value={production.title || ""} onChange={set("title")} placeholder="e.g. Walkers / Lays — Minds Eye" />
              </Field>
              <Field label="Production company">
                <Input value={production.prodCo || ""} onChange={set("prodCo")} placeholder="e.g. Minds Eye" />
              </Field>
              <Field label="Company address" hint="Where the invoice is addressed to">
                <textarea
                  value={production.toAddress || ""}
                  onChange={(e) => setProduction(p => ({ ...p, toAddress: e.target.value }))}
                  placeholder={"e.g.\n5 Margaret Street\nLondon W1W 8RG"}
                  rows={3}
                  className="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-3 py-2.5 text-sm text-neutral-100 placeholder-neutral-600 focus:outline-none focus:border-sky-500 resize-none"
                  style={{ fontFamily: 'inherit' }}
                />
              </Field>
              <Field label="Start date">
                <Input type="date" value={production.startDate || ""} onChange={handleStartDateChange} />
              </Field>
              <Field label="Job reference">
                <Input value={production.jobReference || ""} onChange={set("jobReference")} placeholder="e.g. Vodafone Q3, PO#1234" />
              </Field>
              <Field label="Invoicing email" hint="Multiple addresses? Separate with commas.">
                <Input value={production.invoicingEmail || ""} onChange={set("invoicingEmail")} placeholder="e.g. accounts@minds-eye.tv" />
              </Field>
            </SectionCard>

            <SectionCard title="Mode">
              <div>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Best Boy mode</span>
                  <Toggle value={production.bestBoyMode} onChange={(v) => setProduction(p => ({ ...p, bestBoyMode: v }))} ariaLabel="Best Boy mode" />
                </div>
                <p className="text-[11px] text-neutral-500 mt-1">Manage a crew with the grid view. Turn off for solo use.</p>
                {production.bestBoyMode && crew.length <= 1 && (
                  <StatusMsg kind="info">You'll need to add additional crew members in Crew Manager.</StatusMsg>
                )}
                {!production.bestBoyMode && crew.length > 1 && (
                  <StatusMsg kind="warn">You have {crew.length} crew members. Disabling Best Boy mode hides the grid but keeps your crew data — you can re-enable any time.</StatusMsg>
                )}
              </div>
              <div>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">11-Hour Day</span>
                  <Toggle value={production.isElevenHourDay} onChange={(v) => setProduction(p => ({ ...p, isElevenHourDay: v }))} ariaLabel="11-Hour Day" />
                </div>
                <p className="text-[11px] text-neutral-500 mt-1">1h of overtime included in the day rate. OT applies after 11h worked instead of 10h.</p>
              </div>
            </SectionCard>

            <SectionCard title="Weekend rate overrides">
              <p className="text-[11px] text-neutral-500 -mt-1">App applies APA standard rates by default. Toggle on to override.</p>
              <div>
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Saturday rate</span>
                    <div className="text-[11px] text-neutral-500 mt-0.5">{(production.satRateMode || "apa") === "custom" ? `Custom ${production.satRateCustom ?? 1.5}×` : "Using APA standard (1.5×)"}</div>
                  </div>
                  <Toggle
                    value={(production.satRateMode || "apa") === "custom"}
                    onChange={(v) => setProduction(p => ({ ...p, satRateMode: v ? "custom" : "apa", satRateCustom: p.satRateCustom ?? 1.5 }))}
                    ariaLabel="Custom Saturday rate"
                  />
                </div>
                {(production.satRateMode || "apa") === "custom" && (
                  <div className="mt-3">
                    <Field label="Saturday multiplier" hint="e.g. 1.25 or 2">

    /* ═══════════════════════════ SOLO DAY PAGE (full-page editor for solo mode) ═══════════════════════════ */

    function SoloDayPage({ production, setProduction, onBack, onDeleteProduction, userPrefs, setUserPrefs, initialInvoiceId }) {
      const crew = production.crew ?? [];
      const days = production.days ?? [];

      const setDays = (updater) =>
        setProduction(prev => {
          const next = typeof updater === "function" ? updater(prev.days ?? []) : updater;
          return { ...prev, days: next.map(migrateDay) };
        });

      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };

      const sortedDays = useMemo(() => {
        return [...days].sort((a, b) => {
          const dateA = a.date || "";
          const dateB = b.date || "";
          if (dateA !== dateB) return dateA.localeCompare(dateB);
          return (a.id || "").localeCompare(b.id || "");
        });
      }, [days]);

      // Ensure at least one day exists when entering solo page
      useEffect(() => {
        if (days.length === 0 && crew.length > 0) {
          const blank = makeBlankDay(crew[0].id);
          const defaults = production.defaultDay ?? DEFAULT_PRODUCTION_DAY;
          const initialDay = {
            ...defaults, ...blank, id: uid(), date: todayISO(),
            kitMoneyEnabled: userPrefs.defaultKitMoneyEnabled ?? false,
            kitMoneyAmount: userPrefs.defaultKitMoneyAmount ?? 0,
          };
          const callH = parseHHMM(initialDay.callTime) ?? 8;
          initialDay.secondBreakStartTime = toHHMM(callH + 11);
          setDays([initialDay]);
        }
      }, []); // mount-only; intentional — auto-create runs once per page entry

      const [currentDayId, setCurrentDayId] = useState(null);

      // Anchor to today's day (or last day) on first load and re-anchor if current id becomes invalid
      useEffect(() => {
        if (sortedDays.length === 0) return;
        const stillValid = currentDayId && sortedDays.some(d => d.id === currentDayId);
        if (stillValid) return;
        const todayStr = todayISO();
        const todayDay = sortedDays.find(d => d.date === todayStr);
        setCurrentDayId(todayDay?.id ?? sortedDays[sortedDays.length - 1].id);
      }, [sortedDays, currentDayId]);

      const currentDay = sortedDays.find(d => d.id === currentDayId) || sortedDays[0];
      const currentIdx = currentDay ? sortedDays.findIndex(d => d.id === currentDay.id) : -1;
      const isFirst = currentIdx <= 0;
      const isLast = currentIdx === sortedDays.length - 1;

      const goPrev = () => { if (!isFirst) setCurrentDayId(sortedDays[currentIdx - 1].id); };
      const goNext = () => { if (!isLast) setCurrentDayId(sortedDays[currentIdx + 1].id); };

      // addDay computes from currentDay's date + 1 calendar day, not today's date
      const addDay = () => {
        const baseDate = currentDay?.date || todayISO();
        const d = new Date(baseDate + "T12:00:00");
        d.setDate(d.getDate() + 1);
        const newDate = d.toISOString().slice(0, 10);
        const blank = makeBlankDay(crew[0]?.id);

          ...defaults, ...blank, id: uid(), date: newDate,

        setCurrentDayId(newDay.id);

      const performDelete = () => {

        if (sortedDays.length === 1) {
          onDeleteProduction();
          return;
        }
        const remainingDays = days.filter(d => d.id !== currentDay.id);
        setDays(remainingDays);
        const remainingSorted = [...remainingDays].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
        const nextAnchor = remainingSorted[currentIdx]?.id
                        ?? remainingSorted[currentIdx - 1]?.id
                        ?? remainingSorted[0]?.id
                        ?? null;
        setCurrentDayId(nextAnchor);
        showToast("Day deleted");
      };

      const [showCalc, setShowCalc] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [showJumpSheet, setShowJumpSheet] = useState(false);
      const [showExportSheet, setShowExportSheet] = useState(false);
      const [pendingDeepLink] = useState(() => initialInvoiceId || null);
      const [invoiceNav, setInvoiceNav] = useState(null); // null | "list" | invoiceId
      const [soloExportState, setSoloExportState] = useState(null);

        } else {

      };

      const soloWeeks = useMemo(() => computeWeeks(production, days), [production, days]);
      const soloCrew = crew[0] || null;

      useEffect(() => {

        return () => clearTimeout(timer);
      }, [soloExportState]);

      const handleExportPDF = () => {
        if (soloCrew) setSoloExportState({ mode: "timesheet" });
      };
      const handleExportText = async () => {
        if (!soloCrew) return;
        const sortedE = [...days].sort((a, b) => a.date.localeCompare(b.date));
        const text = generateCrewText(soloCrew, sortedE, production);

      const openInvoiceFromButton = () => {

        return days.reduce((sum, d) => {

            setUserPrefs={setUserPrefs}

            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            userCrewId={soloCrew?.id}
            onOpenInvoice={(id) => setInvoiceNav(id)}
            onClose={() => setInvoiceNav(null)}

        ? new Date(currentDay.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })

      const deleteConfirmMessage = isLastDay

      return (

          {/* Page header */}
          <div className="border-b border-sky-400 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>

              <button onClick={onBack} aria-label="Back to productions"

              </button>

              onChange={handleDayChange}
              crew={crew}

          </div>

          {/* Bottom pill — prev / total / next-or-add */}
          <div className="fixed left-3 right-3 z-30 flex items-center select-none touch-manipulation"
            style={{

              <IArrowLeft size={20}/>

              <span style={{ fontSize: 10, color: '#737373', marginTop: 2, textTransform: 'uppercase', letterSpacing: '0.1em' }}>View Calculation</span>
            </button>
            {isLast ? (

                <IPlus size={22}/>

              <button onClick={goNext} aria-label="Next day"
                style={{ width: 56, height: 56, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',

                <IArrowRight size={20}/>
              </button>

          </div>

          {showCalc && (
            <CalcBreakdownView
              production={production}
              days={days}
              crew={crew}
              total={totalShoot}
              onClose={() => setShowCalc(false)}
              onGenerateInvoice={() => { setShowCalc(false); openInvoiceFromButton(); }}
              onExportPDF={() => { setShowCalc(false); handleExportPDF(); }}
              onExportText={async () => { setShowCalc(false); await handleExportText(); }}
              onPickDay={(dayId) => setCurrentDayId(dayId)}
            />
          )}

          <DayJumpSheet
            open={showJumpSheet}
            days={days}
            currentDayId={currentDayId}
            production={production}
            crew={crew}
            onPick={(id) => setCurrentDayId(id)}
            onClose={() => setShowJumpSheet(false)}
          />

          <ConfirmDialog
            open={confirmDelete}
            title={isLastDay ? "Delete last day?" : "Delete this day?"}
            message={deleteConfirmMessage}
            confirmLabel={isLastDay ? "Delete Production" : "Delete Day"}
            confirmTone="danger"
            cancelLabel="Cancel"
            onConfirm={performDelete}
            onCancel={() => setConfirmDelete(false)}
          />

          {/* Solo export bottom sheet */}
          {showExportSheet && (
            <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
                 style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
                 onClick={() => setShowExportSheet(false)}>
              <div className="bg-neutral-900 w-full rounded-t-[16px] sm:rounded-[16px] shadow-2xl border border-neutral-700 overflow-hidden"
                   style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
                <div className="px-5 pt-5 pb-2">
                  <div className="text-sm font-bold text-neutral-100 flex items-center gap-2"><IShare size={14}/>Export</div>
                </div>
                <div className="px-4 pb-4 flex flex-col gap-2">
                  <button type="button"
                    onClick={() => { setShowExportSheet(false); handleExportPDF(); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-sky-900/40 hover:bg-sky-900/60 border border-sky-700/40 transition-colors text-sm font-semibold text-sky-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IDownload size={15}/>Export Timesheet (PDF)
                  </button>
                  <button type="button"
                    onClick={async () => { setShowExportSheet(false); await handleExportText(); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IMessage size={15}/>Export Timesheet (Text)
                  </button>
                  <button type="button"
                    onClick={() => { setShowExportSheet(false); openInvoiceFromButton(); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IReceipt size={15}/>Generate Invoice
                  </button>
                </div>
                <div className="px-4 pb-4 pt-1 border-t border-neutral-800">
                  <button type="button" onClick={() => setShowExportSheet(false)}
                    className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          {/* Solo PrintView portal */}
          {soloExportState && soloCrew && (
            <PrintView
              mode="timesheet"
              production={production}
              crewMember={soloCrew}
              crewList={crew}
              days={days}
              weeks={soloWeeks}
              exportWeekIndex={null}
              userPrefs={userPrefs}
            />
          )}
        </div>
      );
    }

    /* ═══════════════════════════ PRODUCTION APP ═══════════════════════════ */

    function ProductionApp({ production, setProduction, onBack, userPrefs, setUserPrefs, initialInvoiceId }) {

    function SettingsScreen({ userPrefs, setUserPrefs, onClose, onExport, onImport, onResetAll, productionCount = 0 }) {
      const set = (patch) => setUserPrefs(p => ({ ...p, ...patch }));
      const importRef = useRef(null);
      const [confirmOpts, setConfirmOpts] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };

      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const raw = JSON.parse(ev.target.result);
            const arr = Array.isArray(raw) ? raw : (Array.isArray(raw?.productions) ? raw.productions : null);
            if (!arr || !arr.every(p => p && typeof p.id === 'string')) {
              showToast('Invalid backup file — not a valid productions export.');
              return;
            }
            const n = arr.length;
            const msg = productionCount > 0
              ? `Import ${n} production${n === 1 ? '' : 's'}? This will replace your ${productionCount} existing production${productionCount === 1 ? '' : 's'}. This cannot be undone.`
              : `Import ${n} production${n === 1 ? '' : 's'}?`;
            setConfirmOpts({
              title: "Import productions?",
              message: msg,
              confirmLabel: "Import",
              confirmTone: "primary",
              onConfirm: () => onImport(arr),
            });
          } catch {
            showToast('Could not read file — is it a valid JSON backup?');
          }
        };
        reader.readAsText(file);
      };

      const deptRoles = userPrefs.defaultDepartment && DEPARTMENTS[userPrefs.defaultDepartment]
        ? Object.keys(DEPARTMENTS[userPrefs.defaultDepartment])
        : [];
