                  const member = crew.find(c => c.id === d.crewId);
                  if (!member) return null;
                  const calc = calcForDisplay(production, d, member, findPrevDay(days, d));
                  const dateLabel = new Date(d.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: 'short', day: 'numeric' }).toUpperCase();
                  // Resolved times (cascade from dayDefaults) so inherited days
                  // show their call/wrap instead of "—".
                  const resolvedD = resolveDay(production, d, member);
                  const callT = resolvedD.callTime || "—";
                  const wrapT = resolvedD.wrapTime || "—";

                  const dayBuckets = { ot: 0, pen: 0 };
                  for (const line of calc.lines || []) {
                    const b = categorizeBreakdownLine(line.label);
                    if (b === 'ot') dayBuckets.ot += line.amount || 0;
                    if (b === 'pen') dayBuckets.pen += line.amount || 0;
                  }
                  const hasOT = dayBuckets.ot > 0;
                  const hasPen = dayBuckets.pen > 0;
                  const isBH = !!getBankHolidayName(d.date);
                  const dow = dayOfWeek(d.date);
                  const isWeekendChip = !isBH && (dow === 6 || dow === 0);
                  const weekendChipLabel = dow === 6 ? 'SAT' : 'SUN';
                  const weekendChipClasses = dow === 6
                    ? 'bg-tm-warn/10 text-tm-warn border-tm-warn/25'
                    : 'bg-tm-pen/10 text-tm-pen border-tm-pen/25';

                  const isExpanded = expandedDays.has(d.id);
                  return (
                    <div key={d.id} className="mx-4 mb-1 bg-neutral-900 border border-neutral-800 rounded-lg overflow-hidden">
                      <button
                        type="button"
                        onClick={() => toggleDay(d.id)}
                        className="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-neutral-800/40 transition-colors text-left"
                        style={{ WebkitTapHighlightColor: 'transparent' }}
                        aria-expanded={isExpanded}
                      >
                        <span className="text-[10px] font-mono text-neutral-500 tracking-wider w-14 flex-shrink-0">{dateLabel}</span>
                        <span className="text-[11px] font-mono text-neutral-300 flex-1 min-w-0 truncate">
                          {callT} <span className="text-neutral-600">→</span> {wrapT}
                        </span>
                        <div className="flex gap-1 flex-shrink-0">
                          {hasOT && <span className="text-[8px] tracking-wider font-bold uppercase bg-tm-warn/10 text-tm-warn border border-tm-warn/25 rounded px-1 py-0.5">OT</span>}
                          {hasPen && <span className="text-[8px] tracking-wider font-bold uppercase bg-tm-pen/10 text-tm-pen border border-tm-pen/25 rounded px-1 py-0.5">PEN</span>}
                          {isBH && <span className="text-[8px] tracking-wider font-bold uppercase bg-tm-pen/10 text-tm-pen border border-tm-pen/25 rounded px-1 py-0.5">BH</span>}
                          {isWeekendChip && <span className={`text-[8px] tracking-wider font-bold uppercase border rounded px-1 py-0.5 ${weekendChipClasses}`}>{weekendChipLabel}</span>}
                        </div>
                        <span className="text-[13px] font-mono font-bold text-neutral-100 flex-shrink-0">{fmtGBP(calc.total)}</span>
                        <IChevronDown size={12} strokeWidth={2.5} className={`text-neutral-500 flex-shrink-0 transition-transform ${isExpanded ? 'rotate-180' : ''}`} />
                      </button>
                      {isExpanded && (
                        <div className="px-3 py-2.5 border-t border-neutral-800 bg-neutral-950/50">
                          {(calc.lines || []).length === 0 ? (
                            <div className="text-[11px] text-neutral-600">No line items</div>
                          ) : (
                            <div className="space-y-1">
                              {calc.lines.map((line, i) => {
                                const bucket = categorizeBreakdownLine(line.label);
                                const colorClass =
                                  bucket === 'ot'     ? 'text-tm-warn' :
                                  bucket === 'pen'    ? 'text-tm-pen'  :
                                  bucket === 'kit'    ? 'text-tm-kit'  :
                                  bucket === 'extras' ? 'text-tm-good' :
                                                        'text-neutral-200';
                                return (
                                  <div key={i} className="flex items-baseline justify-between gap-3 text-[11px] font-mono">
                                    <span className="text-neutral-400 flex-1 min-w-0 truncate">{line.label}</span>
                                    <span className={`font-bold ${colorClass} flex-shrink-0`}>{fmtGBP(line.amount)}</span>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                          {onPickDay && (
                            <button
                              type="button"
                              onClick={(e) => { e.stopPropagation(); onPickDay(d.id); onClose?.(); }}
                              className="text-[10px] uppercase tracking-[0.14em] font-bold text-sky-500 hover:text-sky-400 mt-3 px-2 py-1 -ml-2 transition-colors"
                              style={{ WebkitTapHighlightColor: 'transparent' }}
                            >
                              Edit day →
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </>
            )}
          </div>

          {/* Footer pill — back left, GENERATE INVOICE compare, file icon right */}
          <div style={{ flexShrink: 0, paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>
            <div className="px-3 pt-2">
              <Pill
                leftBtn={{
                  icon: <IChevronLeft size={16} strokeWidth={2.5} />,
                  onClick: onClose,
                  ariaLabel: 'Back',
                }}
                rightBtn={onGenerateInvoice ? {
                  icon: <IFile size={16} strokeWidth={2.5} />,
                  onClick: onGenerateInvoice,
                  variant: 'add',
                  ariaLabel: 'Generate invoice',
                } : null}
                onCenterClick={onGenerateInvoice}
              >
                <div className="tm-pill-topline">GENERATE</div>
                <div className="tm-pill-amount">INVOICE</div>
                <div className="tm-pill-compare">→ {fmtGBP(total)} · {uniqueDayCount} {uniqueDayCount === 1 ? 'day' : 'days'}</div>
              </Pill>
            </div>
          </div>

          {/* SHARE menu — Export PDF / Export Text */}
          {showShareMenu && (
            <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
                 style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 70 }}
                 onClick={() => setShowShareMenu(false)}>
              <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
                   style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
                <div className="px-5 pt-5 pb-3">
                  <div className="text-sm font-bold text-neutral-100 flex items-center gap-2">
                    <IShare size={14}/>Share / export
                  </div>
                </div>
                <div className="px-4 pb-4 flex flex-col gap-2">
                  {onExportPDF && (
                    <button type="button"
                      onClick={() => { setShowShareMenu(false); onExportPDF(); }}
                      className="w-full text-left px-4 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 transition-colors text-sm font-bold text-black flex items-center gap-2"
                      style={{ WebkitTapHighlightColor: 'transparent', boxShadow: '0 4px 16px rgba(14,165,233,0.25)' }}>
                      <IDownload size={15}/>Export PDF
                    </button>
                  )}
                  {onExportText && (
                    <button type="button"
                      onClick={() => { setShowShareMenu(false); onExportText(); }}
                      className="w-full text-left px-4 py-3 rounded-xl bg-tm-card-2 hover:bg-neutral-800 border border-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                      style={{ WebkitTapHighlightColor: 'transparent' }}>
                      <IMessage size={15}/>Export text
                    </button>
                  )}
                </div>
                <div className="px-4 pb-5 pt-1 border-t border-neutral-800">
                  <button type="button" onClick={() => setShowShareMenu(false)}
                    className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-500 hover:text-neutral-300 hover:bg-neutral-800 rounded-xl transition-colors"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ConfirmDialog({ open, title, message, confirmLabel = "Confirm", confirmTone = "primary", cancelLabel = "Cancel", onConfirm, onCancel }) {
      useEffect(() => {
        if (!open) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [open]);
      useEscape(open ? onCancel : null);

      if (!open) return null;

      const confirmColors = {
        danger: "bg-red-600 hover:bg-red-500 text-white",
        primary: "bg-sky-600 hover:bg-sky-500 text-white",
      };

      return (
        <div
          role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title"
          className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
          onClick={onCancel}
        >
          <div
            className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
            style={{ maxWidth: 400 }}
            onClick={e => e.stopPropagation()}
          >
            <div className="px-5 pt-5 pb-4">
              {title && <div id="confirm-dialog-title" className="text-sm font-bold text-neutral-100 mb-2">{title}</div>}
              {message && <div className="text-sm text-neutral-400 leading-snug">{message}</div>}
            </div>
            <div className="flex flex-col-reverse gap-2 px-4 pb-5 sm:flex-row sm:justify-end">
              <button
                type="button"
                onClick={onCancel}
                className="w-full sm:w-auto px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}
              >
                {cancelLabel}
              </button>
              <button
                type="button"
                onClick={onConfirm}
                className={`w-full sm:w-auto px-4 py-2.5 text-sm font-semibold rounded-xl transition-colors ${confirmColors[confirmTone] || confirmColors.primary}`}
                style={{ WebkitTapHighlightColor: 'transparent' }}
              >
                {confirmLabel}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function DuplicateDateDialog({ opts, onConfirm, onCancel }) {
      const [targetDate, setTargetDate] = useState(opts?.targetDate || "");
      useEffect(() => { if (opts) setTargetDate(opts.targetDate); }, [opts?.targetDate]);
      useEffect(() => {
        if (!opts) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [!!opts]);
      useEscape(opts ? onCancel : null);

      if (!opts) return null;
      const { sourceDate, count } = opts;
      const label = `${count} entr${count === 1 ? 'y' : 'ies'}`;

      return (
        <div
          role="dialog" aria-modal="true" aria-labelledby="dup-date-title"
          className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
          onClick={onCancel}
        >
          <div
            className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
            style={{ maxWidth: 400 }}
            onClick={e => e.stopPropagation()}
          >
            <div className="px-5 pt-5 pb-4">
              <div id="dup-date-title" className="text-sm font-bold text-neutral-100 mb-3">
                Copy {label} from {fmtDateShort(sourceDate)} to…
              </div>
              <Input type="date" value={targetDate} onChange={(e) => setTargetDate(e.target.value)} />
            </div>
            <div className="flex flex-col-reverse gap-2 px-4 pb-5 sm:flex-row sm:justify-end">
              <button
                type="button"
                onClick={onCancel}
                className="w-full sm:w-auto px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={() => onConfirm(targetDate)}
                disabled={!targetDate}
                className="w-full sm:w-auto px-4 py-2.5 text-sm font-semibold rounded-xl transition-colors bg-sky-600 hover:bg-sky-500 text-white disabled:opacity-40 disabled:cursor-not-allowed"
                style={{ WebkitTapHighlightColor: 'transparent' }}
              >
                Copy
              </button>
            </div>
          </div>
        </div>
      );
    }

    function DayJumpSheet({ open, days, currentDayId, production, crew, onPick, onClose }) {
      useEffect(() => {
        if (!open) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [open]);
      useEscape(open ? onClose : null);

      if (!open) return null;

      const sorted = [...days].sort((a, b) => (a.date || "").localeCompare(b.date || ""));

      return (
        <div
          role="dialog" aria-modal="true" aria-labelledby="jump-sheet-title"
          className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.78)", zIndex: 50 }}
          onClick={onClose}
        >
          <div
            className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 flex flex-col"
            style={{ maxWidth: 480, maxHeight: "calc(80dvh - env(safe-area-inset-bottom))" }}
            onClick={e => e.stopPropagation()}
          >
            <div className="flex-shrink-0 px-5 py-4 border-b border-neutral-700 flex items-center justify-between">
              <div id="jump-sheet-title" className="text-[10px] uppercase tracking-[0.2em] text-sky-500 font-bold">Jump to Day</div>
              <button onClick={onClose} className="text-neutral-500 hover:text-neutral-200 transition-colors flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} aria-label="Close"><IX size={16}/></button>
            </div>
            <div className="flex-1 overflow-y-auto min-h-0" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
              {sorted.map((day, idx) => {
                const c = crew.find(cc => cc.id === day.crewId);
                const calc = c ? calcForDisplay(production, day, c, findPrevDay(days, day)) : null;
                const resolved = c ? resolveDay(production, day, c) : day;
                const isCurrent = day.id === currentDayId;
                const dateStr = day.date ? new Date(day.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "—";
                const times = (resolved.callTime && resolved.wrapTime) ? `${resolved.callTime} – ${resolved.wrapTime}` : "";
                return (
                  <button
                    key={day.id}
                    type="button"
                    onClick={() => { onPick(day.id); onClose(); }}
                    className={`w-full flex items-center gap-3 px-5 py-3.5 border-b border-neutral-800 text-left transition-colors ${isCurrent ? "bg-neutral-800" : "hover:bg-neutral-800/50"}`}
                    style={isCurrent ? { borderLeft: '3px solid #0ea5e9' } : { borderLeft: '3px solid transparent' }}
                  >
                    <div className="text-xs font-bold text-neutral-400 w-8 flex-shrink-0">D{idx + 1}</div>
                    <div className="flex-1 min-w-0">
                      <div className={`text-sm font-semibold truncate ${isCurrent ? "text-sky-500" : "text-neutral-200"}`}>{dateStr}</div>
                      {(times || resolved.dayType) && <div className="text-[11px] text-neutral-500">{[times, resolved.dayType].filter(Boolean).join(" · ")}</div>}
                    </div>
                    {day.note?.trim() && <INote size={13} className="text-neutral-600 flex-shrink-0"/>}
                    {calc && <div className="text-sm font-mono font-bold text-neutral-300 flex-shrink-0">{fmtGBP(calc.total)}</div>}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ SOLO DAY PAGE (full-page editor for solo mode) ═══════════════════════════ */

    function SoloDayPage({ production, setProduction, onBack, onDeleteProduction, userPrefs, setUserPrefs, initialInvoiceId }) {
      const crew = production.crew ?? [];
      const days = production.days ?? [];

      const setDays = (updater) =>
        setProduction(prev => {
          const next = typeof updater === "function" ? updater(prev.days ?? []) : updater;
          return { ...prev, days: next.map(migrateDay) };
        });

      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };

      const sortedDays = useMemo(() => {
        return [...days].sort((a, b) => {
          const dateA = a.date || "";
          const dateB = b.date || "";
          if (dateA !== dateB) return dateA.localeCompare(dateB);
          return (a.id || "").localeCompare(b.id || "");
        });
      }, [days]);

      // Ensure at least one day exists when entering solo page
      useEffect(() => {
        if (days.length === 0 && crew.length > 0) {
          const blank = makeBlankDay(crew[0].id);
          const defaults = production.defaultDay ?? DEFAULT_PRODUCTION_DAY;
          const initialDay = {
            ...defaults, ...blank, id: uid(), date: todayISO(),
            kitMoneyEnabled: userPrefs.defaultKitMoneyEnabled ?? false,
            kitMoneyAmount: userPrefs.defaultKitMoneyAmount ?? 0,
          };
          const callH = parseHHMM(initialDay.callTime) ?? 8;
          initialDay.secondBreakStartTime = toHHMM(callH + 11);
          setDays([initialDay]);
        }
      }, []); // mount-only; intentional — auto-create runs once per page entry

      const [currentDayId, setCurrentDayId] = useState(null);

      // Anchor to today's day (or last day) on first load and re-anchor if current id becomes invalid
      useEffect(() => {
        if (sortedDays.length === 0) return;
        const stillValid = currentDayId && sortedDays.some(d => d.id === currentDayId);
        if (stillValid) return;
        const todayStr = todayISO();
        const todayDay = sortedDays.find(d => d.date === todayStr);
        setCurrentDayId(todayDay?.id ?? sortedDays[sortedDays.length - 1].id);
      }, [sortedDays, currentDayId]);

      const currentDay = sortedDays.find(d => d.id === currentDayId) || sortedDays[0];
      const currentIdx = currentDay ? sortedDays.findIndex(d => d.id === currentDay.id) : -1;
      const isFirst = currentIdx <= 0;
      const isLast = currentIdx === sortedDays.length - 1;

      // Day-switch animation state machine. animDirection 'left' = exit toward the
      // left (user tapped next, new content enters from the right); 'right' = opposite.
      const [animPhase, setAnimPhase] = useState('idle');
      const [animDirection, setAnimDirection] = useState(null);
      const [pendingDayId, setPendingDayId] = useState(null);

      const triggerDaySwitch = (direction, newDayId) => {
        if (animPhase !== 'idle') return;
        setPendingDayId(newDayId);
        setAnimDirection(direction === 'next' ? 'left' : 'right');
        setAnimPhase('exit');
      };

      useEffect(() => {
        if (animPhase === 'exit') {
          const t = setTimeout(() => {
            setCurrentDayId(pendingDayId);
            setAnimPhase('enter');
          }, 180);
          return () => clearTimeout(t);
        }
        if (animPhase === 'enter') {
          let raf2;
          const raf1 = requestAnimationFrame(() => {
            raf2 = requestAnimationFrame(() => {
              setAnimPhase('idle');
              setAnimDirection(null);
              setPendingDayId(null);
            });
          });
          return () => { cancelAnimationFrame(raf1); if (raf2) cancelAnimationFrame(raf2); };
        }
      }, [animPhase, pendingDayId]);

      const goPrev = () => { if (!isFirst) triggerDaySwitch('prev', sortedDays[currentIdx - 1].id); };
      const goNext = () => { if (!isLast) triggerDaySwitch('next', sortedDays[currentIdx + 1].id); };
      const handleDayJump = (newDayId) => {
        const newIdx = sortedDays.findIndex(d => d.id === newDayId);
        if (newIdx === -1 || newIdx === currentIdx) return;
        triggerDaySwitch(newIdx > currentIdx ? 'next' : 'prev', newDayId);
      };

      const stageClass = `tm-day-stage${
        animPhase === 'exit' ? ` exiting-${animDirection}` :
        animPhase === 'enter' ? ` entering-${animDirection === 'left' ? 'right' : 'left'}` :
        ''
      }`;

      // addDay computes from currentDay's date + 1 calendar day, not today's date
      const addDay = () => {
        const baseDate = currentDay?.date || todayISO();
        const d = new Date(baseDate + "T12:00:00");
        d.setDate(d.getDate() + 1);
        const newDate = d.toISOString().slice(0, 10);
        const blank = makeBlankDay(crew[0]?.id);
        const defaults = production.defaultDay ?? DEFAULT_PRODUCTION_DAY;
        const newDay = {
          ...defaults, ...blank, id: uid(), date: newDate,
          kitMoneyEnabled: userPrefs.defaultKitMoneyEnabled ?? false,
          kitMoneyAmount: userPrefs.defaultKitMoneyAmount ?? 0,
          wrapped: newDate < todayISO(),
        };
        const callH = parseHHMM(newDay.callTime) ?? 8;
        newDay.secondBreakStartTime = toHHMM(callH + 11);
        setDays(prev => [...prev, newDay]);
        setCurrentDayId(newDay.id);
      };

      const handleDayChange = (updatedDay) => {
        if (!currentDay) return;
        setDays(prev => prev.map(d => d.id === currentDay.id ? updatedDay : d));
      };

      const [confirmDelete, setConfirmDelete] = useState(false);

      const requestDeleteCurrentDay = () => { if (currentDay) setConfirmDelete(true); };

      const performDelete = () => {
        setConfirmDelete(false);
        if (!currentDay) return;
        if (sortedDays.length === 1) {
          onDeleteProduction();
          return;
        }
        const remainingDays = days.filter(d => d.id !== currentDay.id);
        setDays(remainingDays);
        const remainingSorted = [...remainingDays].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
        const nextAnchor = remainingSorted[currentIdx]?.id
                        ?? remainingSorted[currentIdx - 1]?.id
                        ?? remainingSorted[0]?.id
                        ?? null;
        setCurrentDayId(nextAnchor);
        showToast("Day deleted");
      };

      const [showCalc, setShowCalc] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [showJumpSheet, setShowJumpSheet] = useState(false);
      const [showDayActions, setShowDayActions] = useState(false);
      // Per-day kebab actions. Extensible: append { label, action, variant } entries
      // and they'll render in the same bottom sheet without UI rework.
      const dayActions = [
        { label: "Delete day", variant: "danger", action: () => { setShowDayActions(false); requestDeleteCurrentDay(); } },
      ];
      const [showExportSheet, setShowExportSheet] = useState(false);
      const [pendingDeepLink] = useState(() => initialInvoiceId || null);
      const [invoiceNav, setInvoiceNav] = useState(null); // null | "list" | invoiceId
      const [soloExportState, setSoloExportState] = useState(null);

      // Deep-link: open specific invoice on mount when launched from AllInvoicesView
      useEffect(() => {
        if (pendingDeepLink) setInvoiceNav(pendingDeepLink);
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      const handleEditorClose = () => {
        if (pendingDeepLink && invoiceNav === pendingDeepLink) {
          onBack(); // arrived via deep-link — close all the way home
        } else {
          setInvoiceNav("list");
        }
      };

      const soloWeeks = useMemo(() => computeWeeks(production, days), [production, days]);
      const soloCrew = crew[0] || null;

      useEffect(() => {
        if (!soloExportState) return;
        const timer = setTimeout(() => {
          const cleanup = () => setSoloExportState(null);
          if (IS_NATIVE) {
            nativeExportPrintViewPdf('print-view', '.page', `${(soloCrew && soloCrew.name) || 'Crew'} timesheet.pdf`)
              .catch((e) => { try { console.error('PDF export failed', e); } catch (_) {} })
              .finally(cleanup);
          } else {
            window.addEventListener('afterprint', cleanup, { once: true });
            window.print();
            const fallback = setTimeout(cleanup, 30000);
            return () => clearTimeout(fallback);
          }
        }, 300);
        return () => clearTimeout(timer);
      }, [soloExportState]);

      const handleExportPDF = () => {
        if (soloCrew) setSoloExportState({ mode: "timesheet" });
      };
      const handleExportText = async () => {
        if (!soloCrew) return;
        const sortedE = [...days].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const text = generateCrewText(soloCrew, sortedE, production);
        const r = await shareTextOrCopy(text, `${soloCrew.name} Timesheet`);
        if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
      };

      const openInvoiceFromButton = () => {
        const invoices = production.invoices || [];
        const latestDraft = [...invoices].reverse().find(inv => inv.status === "draft");
        const target = latestDraft || invoices[invoices.length - 1];
        if (target) {
          setInvoiceNav(target.id);
        } else {
          const newId = createNewInvoice(production, setProduction, userPrefs, setUserPrefs, soloCrew?.id);
          setInvoiceNav(newId);
        }
      };

      const totalShoot = useMemo(() => {
        return days.reduce((sum, d) => {
          const c = crew.find(cc => cc.id === d.crewId);
          if (!c) return sum;
          return sum + calcForDisplay(production, d, c, findPrevDay(days, d)).total;
        }, 0);
      }, [days, crew, production]);

      if (showSettings) {
        return (
          <ProductionSettingsSheet
            production={production}
            setProduction={setProduction}
            crew={crew}
            onClose={() => setShowSettings(false)}
          />
        );
      }

      if (invoiceNav && invoiceNav !== "list") {
        return (
          <InvoiceEditorView
            invoiceId={invoiceNav}
            production={production}
            setProduction={setProduction}
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            userCrewId={soloCrew?.id}
            onBack={handleEditorClose}
          />
        );
      }
      if (invoiceNav === "list") {
        return (
          <InvoiceListView
            production={production}
            setProduction={setProduction}
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            userCrewId={soloCrew?.id}
            onOpenInvoice={(id) => setInvoiceNav(id)}
            onClose={() => setInvoiceNav(null)}
          />
        );
      }

      if (!currentDay) {
        return (
          <div className="min-h-screen bg-neutral-950 flex items-center justify-center text-neutral-500 text-sm">
            Loading…
          </div>
        );
      }

      const isLastDay = sortedDays.length === 1;
      const deleteDateLabel = currentDay.date
        ? new Date(currentDay.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })
        : "this day";
      const deleteConfirmMessage = isLastDay
        ? `"${production.title || 'This production'}" has only this day. Deleting it will also delete the entire production.`
        : `Delete ${deleteDateLabel} (Day ${currentIdx + 1} of ${sortedDays.length})?`;

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 80px)' }}>
          <Toast show={!!toastMsg}>{toastMsg}</Toast>

          {/* Page header — stacked breadcrumb on left, share/settings icons on right */}
          <div className="bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-3xl mx-auto flex items-start justify-between px-4 pt-4 pb-3">
              <button
                type="button"
                onClick={onBack}
                className="flex flex-col items-start text-left flex-shrink min-w-0 active:opacity-60 transition-opacity"
                style={{ WebkitTapHighlightColor: 'transparent' }}
                aria-label="Back to productions"
              >
                <span className="text-[10px] uppercase tracking-[0.22em] text-neutral-500 font-bold mb-0.5 flex items-center">
                  <IChevronLeft size={10} strokeWidth={3} className="-ml-0.5 mr-0.5" />
                  SHOOTS
                </span>
                <span className="text-[16px] font-extrabold text-neutral-100 uppercase tracking-tight leading-tight truncate max-w-[60vw]">
                  {production.title || 'Untitled'}
                </span>
              </button>
              <div className="flex gap-1 ml-2 flex-shrink-0">
                <button type="button" onClick={() => setShowExportSheet(true)}
                  className="w-[34px] h-[34px] rounded-full text-neutral-500 hover:bg-neutral-900 hover:text-neutral-100 flex items-center justify-center transition-colors"
                  style={{ WebkitTapHighlightColor: 'transparent' }}
                  aria-label="Share">
                  <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <path d="M8.6 13.5l6.8 4M15.4 6.5L8.6 10.5"/>
                  </svg>
                </button>
                <button type="button" onClick={() => setShowSettings(true)}
                  className="w-[34px] h-[34px] rounded-full text-neutral-500 hover:bg-neutral-900 hover:text-neutral-100 flex items-center justify-center transition-colors"
                  style={{ WebkitTapHighlightColor: 'transparent' }}
                  aria-label="Production settings">
                  <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          {/* Day-specific content — animates on prev/next/jump */}
          <div className={stageClass}>
            {/* Form-top — DAY counter + day-type chip on left, date + kebab on right */}
            <div className="max-w-3xl mx-auto flex items-center justify-between gap-2 px-4 py-3 border-b border-neutral-800 mb-3.5">
              <div className="flex items-center gap-2 min-w-0">
                <button
                  type="button"
                  onClick={() => setShowJumpSheet(true)}
                  className="font-mono text-[12px] font-bold flex items-baseline gap-1 flex-shrink-0 hover:opacity-70 transition-opacity"
                  style={{ WebkitTapHighlightColor: 'transparent' }}
                >
                  <span className="text-neutral-400">DAY {currentIdx + 1}</span>
                  <span className="text-neutral-600">/ {sortedDays.length}</span>
                </button>
                <span className="text-neutral-700 text-[10px]">·</span>
                {/* Day type chip — native select overlaid invisibly so the chip is the tap target */}
                <label className="relative inline-flex items-center cursor-pointer">
                  <select
                    value={currentDay?.dayType || "Shoot"}
                    onChange={(e) => {
                      const newType = e.target.value;
                      const callH = parseHHMM(currentDay?.callTime);
                      const patch = { dayType: newType };
                      if (callH !== null) patch.wrapTime = toHHMM(callH + (DEFAULT_HOURS[newType] ?? 11));
                      handleDayChange({ ...currentDay, ...patch });
                    }}
                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                    aria-label="Day type"
                    style={{ WebkitTapHighlightColor: 'transparent' }}
                  >
                    {DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                  <span className={`text-[10px] uppercase tracking-[0.14em] font-bold px-2 py-[3px] rounded inline-flex items-center gap-1 transition-colors ${
                    (currentDay?.dayType || 'Shoot') === 'Shoot'
                      ? 'bg-neutral-800 border border-neutral-700 text-neutral-300'
                      : 'bg-tm-warn/10 border border-tm-warn/25 text-tm-warn'
                  }`}>
                    {currentDay?.dayType || 'Shoot'}
                    <IChevronDown size={10} strokeWidth={2.5} className="opacity-60" />
                  </span>
                </label>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                <label className="relative inline-flex cursor-pointer">
                  <input
                    type="date"
                    value={currentDay?.date || ""}
                    onChange={(e) => handleDayChange({ ...currentDay, date: e.target.value })}
                    className="tm-picker-overlay absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                    aria-label="Day date"
                    style={{ WebkitTapHighlightColor: 'transparent' }}
                  />
                  <span className="font-mono text-[10px] uppercase tracking-[0.1em] text-neutral-500">
                    {formatDayHeaderDate(currentDay?.date)}
                  </span>
                </label>
                <button
                  type="button"
                  onClick={() => setShowDayActions(true)}
                  className="w-7 h-7 rounded flex items-center justify-center text-neutral-500 hover:text-neutral-300 hover:bg-neutral-800/40 transition-colors flex-shrink-0"
                  style={{ WebkitTapHighlightColor: 'transparent' }}
                  aria-label="Day actions"
                >
                  <IDots size={14} />
                </button>
              </div>
            </div>

            {/* Day editor body */}
            <div className="max-w-3xl mx-auto px-4 pb-6">
              {(production.invoices || []).some(inv => inv.status === "sent" || inv.status === "paid") && (() => {
                const count = (production.invoices || []).filter(inv => inv.status === "sent" || inv.status === "paid").length;
                return (
                  <div className="bg-sky-900/20 border border-sky-700/40 rounded-xl px-3 py-2 text-[11px] text-sky-300 mb-3">
                    This production has {count} sent invoice{count !== 1 ? "s" : ""}. Changes here won't update them.
                  </div>
                );
              })()}
              <DayEntryForm
                value={currentDay}
                onChange={handleDayChange}
                crew={crew}
                allCrewMode={false}
                fixedCrewId={crew[0]?.id ?? null}
                fixedDate={null}
                isToday={currentDay?.date === todayISO()}
                showToast={showToast}
                days={days}
                hideDayCard={true}
                isElevenHourDay={!!production?.isElevenHourDay}
                production={production}
              />
            </div>
          </div>

          <SoloDayPill
            total={totalShoot}
            dayIndex={currentIdx}
            dayCount={sortedDays.length}
            hasPrev={!isFirst}
            hasNext={!isLast}
            onPrev={goPrev}
            onNext={goNext}
            onAdd={addDay}
            onViewCalc={() => setShowCalc(true)}
            isToday={currentDay?.date === todayISO()}
            comparisonUnit={userPrefs?.comparisonUnit}
          />

          {showCalc && (
            <CalcBreakdownView
              production={production}
              days={days}
              crew={crew}
              total={totalShoot}
              onClose={() => setShowCalc(false)}
              onGenerateInvoice={() => { setShowCalc(false); openInvoiceFromButton(); }}
              onExportPDF={() => { setShowCalc(false); handleExportPDF(); }}
              onExportText={async () => { setShowCalc(false); await handleExportText(); }}
              onPickDay={(dayId) => setCurrentDayId(dayId)}
            />
          )}

          <DayJumpSheet
            open={showJumpSheet}
            days={days}
            currentDayId={currentDayId}
            production={production}
            crew={crew}
            onPick={handleDayJump}
            onClose={() => setShowJumpSheet(false)}
          />

          {/* Per-day kebab action sheet */}
          {showDayActions && (
            <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
                 style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
                 onClick={() => setShowDayActions(false)}>
              <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
                   style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
                <div className="px-5 pt-5 pb-3">
                  <div className="text-sm font-bold text-neutral-100">Day actions</div>
                </div>
                <div className="px-4 pb-4 flex flex-col gap-2">
                  {dayActions.map((a, i) => (
                    <button key={i} type="button" onClick={a.action}
                      className={`w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold flex items-center gap-2 ${
                        a.variant === 'danger' ? 'text-tm-pen' : 'text-neutral-300'
                      }`}
                      style={{ WebkitTapHighlightColor: 'transparent' }}>
                      {a.variant === 'danger' && <ITrash size={15}/>}
                      {a.label}
                    </button>
                  ))}
                </div>
                <div className="px-4 pb-5 pt-1 border-t border-neutral-800">
                  <button type="button" onClick={() => setShowDayActions(false)}
                    className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          <ConfirmDialog
            open={confirmDelete}
            title={isLastDay ? "Delete last day?" : "Delete this day?"}
            message={deleteConfirmMessage}
            confirmLabel={isLastDay ? "Delete Production" : "Delete Day"}
            confirmTone="danger"
            cancelLabel="Cancel"
            onConfirm={performDelete}
            onCancel={() => setConfirmDelete(false)}
          />

          {/* Solo export bottom sheet */}
          {showExportSheet && (
            <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
                 style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
                 onClick={() => setShowExportSheet(false)}>
              <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
                   style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
                <div className="px-5 pt-5 pb-2">
                  <div className="text-sm font-bold text-neutral-100 flex items-center gap-2"><IShare size={14}/>Export</div>
                </div>
                <div className="px-4 pb-4 flex flex-col gap-2">
                  <button type="button"
                    onClick={() => { setShowExportSheet(false); handleExportPDF(); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 transition-colors text-sm font-bold text-black flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent', boxShadow: '0 4px 16px rgba(14,165,233,0.25)' }}>
                    <IDownload size={15}/>Timesheet (PDF)
                  </button>
                  <button type="button"
                    onClick={async () => { setShowExportSheet(false); await handleExportText(); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-tm-card-2 hover:bg-neutral-800 border border-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IMessage size={15}/>Timesheet (Text)
                  </button>
                  <button type="button"
                    onClick={() => { setShowExportSheet(false); openInvoiceFromButton(); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-tm-card-2 hover:bg-neutral-800 border border-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IReceipt size={15}/>Generate invoice
                  </button>
                </div>
                <div className="px-4 pb-4 pt-1 border-t border-neutral-800">
                  <button type="button" onClick={() => setShowExportSheet(false)}
                    className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-500 hover:text-neutral-300 hover:bg-neutral-800 rounded-xl transition-colors"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          {/* Solo PrintView portal */}
          {soloExportState && soloCrew && (
            <PrintView
              mode="timesheet"
              production={production}
              crewMember={soloCrew}
              crewList={crew}
              days={days}
              weeks={soloWeeks}
              exportWeekIndex={null}
              userPrefs={userPrefs}
            />
          )}
        </div>
      );
    }

    /* ═══════════════════════════ PRODUCTION APP ═══════════════════════════ */

    function ProductionApp({ production, setProduction, onBack, userPrefs, setUserPrefs, initialInvoiceId }) {

// Convenience aliases — child components keep receiving crew/days as before
const crew = production.crew ?? [];
const days = production.days ?? [];

// Derived setters — wrap setProduction so child components work unchanged
const setCrew = (updater) =>
  setProduction((prev) => ({
    ...prev,
    crew: typeof updater === "function" ? updater(prev.crew ?? []) : updater,
  }));

const setDays = (updater) =>
  setProduction((prev) => {
    const next = typeof updater === "function" ? updater(prev.days ?? []) : updater;
    return { ...prev, days: next.map(migrateDay) };
  });
      const [tab, setTab] = useState(production.bestBoyMode ? (production.isNew ? "setup" : "days") : "days");
      const [prevTab, setPrevTab] = useState('days');
      const prevTabRef = useRef(tab);
      useEffect(() => {
        if (prevTabRef.current !== tab) {
          setPrevTab(prevTabRef.current);
          prevTabRef.current = tab;
        }
      }, [tab]);
      const [pendingDeepLink] = useState(() => initialInvoiceId || null);
      const [invoiceNav, setInvoiceNav] = useState(null); // null | "list" | invoiceId

      // Deep-link: open specific invoice on mount when launched from AllInvoicesView
      useEffect(() => {
        if (pendingDeepLink) setInvoiceNav(pendingDeepLink);
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      const handleEditorClose = () => {
        if (pendingDeepLink && invoiceNav === pendingDeepLink) {
          onBack(); // arrived via deep-link — close all the way home
        } else {
          setInvoiceNav("list");
        }
      };
      const userCrewId = userCrewIdsInProduction(production, userPrefs)[0] ?? null;
      const [showProdSettings, setShowProdSettings] = useState(false);
      const [showCalcView, setShowCalcView] = useState(false);
      const [showMobileNav, setShowMobileNav] = useState(false);
      const [currentDate, setCurrentDate] = useState(() => computeInitialDate(production));
      const [drilldownCrewMember, setDrilldownCrewMember] = useState(null);
      const [breakdownCrewMember, setBreakdownCrewMember] = useState(null);
      const [breakdownDate, setBreakdownDate] = useState(null);
      const [showSaveSheet, setShowSaveSheet] = useState(false);
      // Parallel print pipeline for the Save Timesheets flow (sibling of ExportTab's pipeline).
      // Holds { crewIdsFilter: Set<string> } when a save-via-print is in flight; null otherwise.
      const [savePrintState, setSavePrintState] = useState(null);

      const weeksForSavePrint = useMemo(() => computeWeeks(production, production.days || []), [production]);

      useEffect(() => {
        if (!savePrintState) return;
        const timer = setTimeout(() => {
          const cleanup = () => setSavePrintState(null);
          if (IS_NATIVE) {
            nativeExportPrintViewPdf('print-view', '.page', 'TimeMachine timesheets.pdf')
              .catch((e) => { try { console.error('PDF export failed', e); } catch (_) {} })
              .finally(cleanup);
          } else {
            window.addEventListener('afterprint', cleanup, { once: true });
            window.print();
            const fallback = setTimeout(cleanup, 30000);
            return () => clearTimeout(fallback);
          }
        }, 300);
        return () => clearTimeout(timer);
      }, [savePrintState]);

      const triggerSavePrint = (crewIdsFilter) => {
        if (!crewIdsFilter || crewIdsFilter.size === 0) return;
        setSavePrintState({ kind: 'grid', crewIdsFilter });
      };

      const triggerCrewTimesheetPrint = (crewMember) => {
        if (!crewMember) return;
        setSavePrintState({ kind: 'timesheet', crewMember });
      };

      const addDenseDay = (date, dayType) => {
        const type = dayType || production.defaultDay?.dayType || 'Shoot';
        const existing = new Set((production.days || []).filter(d => d.date === date).map(d => d.crewId));
        const toAdd = (production.crew || []).filter(m => !existing.has(m.id));
        if (toAdd.length === 0) return;
        setProduction(p => ({
          ...p,
          days: [
            ...(p.days || []),
            ...toAdd.map(m => ({
              ...makeBlankDay(m.id),
              date,
              dayType: type,
              wrapped: !!(date && date < todayISO()),
            })),
          ],
        }));
      };

      const setCrewEmail = (crewId, email) => {
        setProduction(p => ({
          ...p,
          crew: (p.crew || []).map(c => c.id === crewId ? { ...c, email } : c)
        }));
      };
      const [toastMsg, setToastMsg] = useState(null);
      const [confirmOpts, setConfirmOpts] = useState(null);
      const [openCrewForm, setOpenCrewForm] = useState(false);
      const [showCancelModal, setShowCancelModal] = useState(false);
      const undoRef = useRef(null);
      const undoTimerRef = useRef(null);
      const [undoVisible, setUndoVisible] = useState(false);
      const [undoLabel, setUndoLabel] = useState('');

      const pushUndo = (label, extra = {}) => {
        undoRef.current = { crew: production.crew ?? [], days: production.days ?? [], ...extra };
        setUndoLabel(label);
        setUndoVisible(true);
        if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
        undoTimerRef.current = setTimeout(() => setUndoVisible(false), 5000);
      };
      const handleUndo = () => {
        if (!undoRef.current) return;
        const { crew: c, days: d, weekStarts, gridDates } = undoRef.current;
        setProduction(prev => ({
          ...prev,
          crew: c,
          days: d,
          ...(weekStarts !== undefined ? { weekStarts } : {}),
          ...(gridDates !== undefined ? { gridDates } : {}),
        }));
        undoRef.current = null;
        setUndoVisible(false);
        if (undoTimerRef.current) { clearTimeout(undoTimerRef.current); undoTimerRef.current = null; }
      };

      const handleRemoveWeek = (monday) => {
        pushUndo('Week removed', { weekStarts: production.weekStarts ?? [], gridDates: production.gridDates ?? [] });
        const weekDates = new Set(Array.from({ length: 7 }, (_, i) => {
          const d = new Date(monday + "T12:00:00"); d.setDate(d.getDate() + i);
          return d.toISOString().slice(0, 10);
        }));
        setProduction(p => ({
          ...p,
          weekStarts: (p.weekStarts || []).filter(w => w !== monday),
          gridDates: (p.gridDates || []).filter(d => !weekDates.has(d)),
          days: (p.days || []).filter(d => !weekDates.has(d.date)),
        }));
      };

      useEffect(() => {
        if (production.isNew) setProduction(p => ({ ...p, isNew: false }));
      }, []);

      const handleGridAddDate = (date) => setProduction(p => ({ ...p, gridDates: [...(p.gridDates || []), date] }));
      const handleGridAddWeek = (monday) => setProduction(p => ({ ...p, weekStarts: [...(p.weekStarts || []), monday] }));
      const handleGridAddCrew = () => { setOpenCrewForm(true); setTab("setup"); };

      useEffect(() => {
        if (!production.bestBoyMode && tab === "setup") setTab("days");
      }, [production.bestBoyMode]);

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };

      const clearAll = () => {
        setProduction((prev) => ({ id: prev.id, title: "", prodCo: "", crew: [], days: [], defaultDay: DEFAULT_PRODUCTION_DAY, gridDates: [], weekStarts: [], cancellationData: null }));
      };

      const totalShoot = days.reduce((s, d) => { const c = crew.find((cc) => cc.id === d.crewId); return c ? s + calcForDisplay(production, d, c, findPrevDay(days, d)).total : s; }, 0);

      if (showProdSettings) {
        return (
          <ProductionSettingsSheet
            production={production}
            setProduction={setProduction}
            crew={crew}
            onClose={() => setShowProdSettings(false)}
            userPrefs={userPrefs}
          />
        );
      }

      if (invoiceNav && invoiceNav !== "list") {
        return (
          <InvoiceEditorView
            invoiceId={invoiceNav}
            production={production}
            setProduction={setProduction}
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            userCrewId={userCrewId}
            onBack={handleEditorClose}
          />
        );
      }
      if (invoiceNav === "list") {
        return (
          <InvoiceListView
            production={production}
            setProduction={setProduction}
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            userCrewId={userCrewId}
            onOpenInvoice={(id) => setInvoiceNav(id)}
            onClose={() => setInvoiceNav(null)}
          />
        );
      }

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <Toast show={!!toastMsg}>{toastMsg}</Toast>
          {undoVisible && (
            <div className="fixed bottom-[8rem] left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-neutral-800 border border-neutral-600 shadow-lg px-4 py-2.5 rounded-full whitespace-nowrap">
              <span className="text-[11px] text-neutral-300 uppercase tracking-wide font-bold">{undoLabel}</span>
              <button onClick={handleUndo} className="text-[11px] text-sky-500 hover:text-sky-300 uppercase tracking-wide font-bold transition-colors">Undo</button>
            </div>
          )}

          {showCalcView && (
            production.viewMode === 'mobile' && production.bestBoyMode ? (
              breakdownCrewMember ? (
                <CrewProductionBreakdownView
                  crewMember={breakdownCrewMember}
                  production={production}
                  onBack={() => setBreakdownCrewMember(null)}
                />
              ) : breakdownDate ? (
                <DayBreakdownView
                  date={breakdownDate}
                  production={production}
                  onBack={() => setBreakdownDate(null)}
                />
              ) : (
                <MultiCrewOverviewView
                  production={production}
                  days={days}
                  crew={crew}
                  total={totalShoot}
                  onClose={() => { setShowCalcView(false); setBreakdownCrewMember(null); setBreakdownDate(null); }}
                  onOpenSave={() => setShowSaveSheet(true)}
                  setProduction={setProduction}
                  onTriggerCrewTimesheet={triggerCrewTimesheetPrint}
                  showToast={showToast}
                  userPrefs={userPrefs}
                  onOpenCrewBreakdown={setBreakdownCrewMember}
                  onOpenDayBreakdown={setBreakdownDate}
                />
              )
            ) : (
              <CalcBreakdownView
                production={production}
                days={days}
                crew={crew}
                total={totalShoot}
                onClose={() => setShowCalcView(false)}
              />
            )
          )}

          {drilldownCrewMember ? null : (production.viewMode === 'mobile' && production.bestBoyMode) ? (
            <div className="sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
              <div className="border-b border-sky-500 bg-black">
                <div className="max-w-6xl mx-auto px-4 pt-3 pb-3.5">
                  <button onClick={onBack} className="text-[10px] uppercase tracking-[0.18em] text-neutral-500 hover:text-sky-500 transition-colors font-bold mb-1 flex items-center gap-1" aria-label="Back to productions list">
                    <span className="text-neutral-600">‹</span>SHOOTS
                  </button>
                  <div className="flex items-center justify-between gap-3">
                    <div className="text-[22px] font-extrabold tracking-tight text-neutral-100 truncate min-w-0">
                      {production.title || <span className="text-neutral-500">Untitled production</span>}
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <button
                        onClick={() => setShowCalcView(true)}
                        className="w-8 h-8 rounded-full bg-tm-card-2 hover:bg-neutral-800 flex items-center justify-center text-neutral-300 transition-colors"
                        aria-label="Share / export production"
                        style={{ WebkitTapHighlightColor: 'transparent' }}>
                        <IShare size={14}/>
                      </button>
                      <button
                        onClick={() => setShowMobileNav(true)}
                        className="w-8 h-8 rounded-full bg-tm-card-2 hover:bg-neutral-800 flex items-center justify-center text-neutral-300 transition-colors"
                        aria-label="More actions"
                        style={{ WebkitTapHighlightColor: 'transparent' }}>
                        <IKebab size={14}/>
                      </button>
                      <button
                        onClick={() => setShowProdSettings(true)}
                        className="w-8 h-8 rounded-full bg-tm-card-2 hover:bg-neutral-800 flex items-center justify-center text-neutral-300 transition-colors"
                        aria-label="Production settings"
                        style={{ WebkitTapHighlightColor: 'transparent' }}>
                        <IGear size={14}/>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
          <div className="sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="border-b border-sky-500 bg-black">
              <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
                <div>
                  <button onClick={onBack} className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 hover:text-sky-500 transition-colors font-bold mb-1 flex items-center gap-1" aria-label="Back to productions list">← {(() => { const n = userPrefs?.displayName?.trim() || ""; return n ? `${n}'s TIMEMACHINE` : "TIMEMACHINE"; })()}</button>
                  <div className="font-bold uppercase tracking-tight leading-none text-sm">{production.title || <span className="text-neutral-500">Untitled Production</span>}</div>
                </div>
                <div className="flex items-center gap-3">
                  <Btn size="sm" variant="ghost" onClick={() => setConfirmOpts({
                    title: "Reset production data?",
                    message: `Remove all crew, days, and settings from "${production.title || 'this production'}". The production itself stays. This cannot be undone.`,
                    confirmLabel: "Reset",
                    confirmTone: "danger",
                    onConfirm: clearAll,
                  })}><IReset/>Reset</Btn>
                  <button onClick={() => setShowProdSettings(true)} className="text-neutral-400 hover:text-neutral-200 transition-colors p-2 rounded-lg hover:bg-neutral-800" aria-label="Production settings" title="Production settings"><IGear size={16}/></button>
                </div>
              </div>
            </div>
            <div className="bg-neutral-950 border-b border-neutral-800">
              <div className="max-w-6xl mx-auto px-4 py-2 flex justify-start overflow-x-auto">
                <div className="inline-flex rounded-lg bg-neutral-800 p-0.5">
                  {(production.bestBoyMode
                    ? [{ k: "setup", label: "Setup", I: IBriefcase }, { k: "days", label: "Timesheets", I: ICal }, { k: "export", label: "Export", I: IShare }, { k: "invoices", label: "Invoices", I: IReceipt }]
                    : [{ k: "days", label: "Timesheets", I: ICal }, { k: "export", label: "Export", I: IShare }]
                  ).map(({ k, label, I }) => (
                    <button key={k} onClick={() => { if (k === "invoices") { setInvoiceNav("list"); } else { setTab(k); } }}
                      className={`inline-flex items-center gap-1.5 px-4 py-1.5 rounded-md text-[11px] uppercase tracking-[0.15em] font-bold whitespace-nowrap transition-colors duration-150 ${tab === k ? "bg-sky-500 text-black" : "text-neutral-400"}`}>
                      <I/>{label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
          )}

          <div className="max-w-6xl mx-auto px-4 py-6 pb-32">
            {tab === "setup" && production.bestBoyMode && (
              <div className="space-y-8">
                <ProductionForm production={production} setProduction={setProduction} onOpenSettings={() => setShowProdSettings(true)} />
                <CrewManager crew={crew} setCrew={setCrew} autoStart={openCrewForm} onAutoStartConsumed={() => setOpenCrewForm(false)} onPushUndo={pushUndo} />
                <div>
                  <Btn variant="ghost" size="sm" onClick={() => setShowCancelModal(true)}>Cancellation fees</Btn>
                </div>
              </div>
            )}
            {showCancelModal && (
              <CancellationCalcModal
                production={production}
                setProduction={setProduction}
                crew={crew}
                onClose={() => setShowCancelModal(false)}
              />
            )}
            {tab === "days" && (
              production.viewMode === 'mobile' && production.bestBoyMode
                ? (drilldownCrewMember
                    ? <CrewMemberDayView
                        crewMember={drilldownCrewMember}
                        currentDate={currentDate}
                        production={production}
                        setProduction={setProduction}
                        onBack={() => setDrilldownCrewMember(null)}
                        onTriggerCrewTimesheet={triggerCrewTimesheetPrint}
                        showToast={showToast}
                        userPrefs={userPrefs}
                      />
                    : <BestBoyMobileDayView
                        production={production}
                        setProduction={setProduction}
                        userPrefs={userPrefs}
                        onPushUndo={pushUndo}
                        currentDate={currentDate}
                        setCurrentDate={setCurrentDate}
                        onCrewTap={setDrilldownCrewMember}
                        showToast={showToast}
                      />)
                : <DaysManager days={days} setDays={setDays} crew={crew} production={production} showToast={showToast} onAddDate={handleGridAddDate} onAddWeek={handleGridAddWeek} onAddCrew={handleGridAddCrew} onPushUndo={pushUndo} onRemoveWeek={handleRemoveWeek} />
            )}
            {tab === "export" && <ExportTab production={production} crew={crew} days={days} showToast={showToast} userPrefs={userPrefs} />}
          </div>

          <div className="text-center text-[10px] text-neutral-600 py-6 pb-32 uppercase tracking-widest">
            Rates per APA Sept 2025
          </div>

          {(() => {
            const sortedDates = [...new Set((days || []).map(d => d.date))].sort();
            const currentIdx = sortedDates.indexOf(currentDate);
            const onDays = tab === 'days';
            // When on Days tab, the pill navigates days (left = prev, right = next/add).
            // On any other tab, left = previous tab, right is hidden (home falls back to default
            // exit on legacy mounts, but we want this mount to be tab-aware: send home → Days tab).
            const hasPrev = onDays ? currentIdx > 0 : true;
            const onPrev = onDays
              ? () => { if (currentIdx > 0) setCurrentDate(sortedDates[currentIdx - 1]); }
              : () => setTab(prevTab || 'days');
            const isAtLastDate = sortedDates.length === 0 || currentIdx >= sortedDates.length - 1;
            const hasNext = onDays ? true : null;
            const onNext = onDays ? (() => {
              if (!isAtLastDate) {
                setCurrentDate(sortedDates[currentIdx + 1]);
                return;
              }
              if ((production.crew || []).length === 0) {
                showToast?.('Add crew members first');
                return;
              }
              const baseDate = sortedDates.length > 0
                ? sortedDates[sortedDates.length - 1]
                : (production.startDate || todayISO());
              const nextDate = sortedDates.length > 0 ? addDays(baseDate, 1) : baseDate;
              if (sortedDates.includes(nextDate)) return;
              addDenseDay(nextDate);
              setCurrentDate(nextDate);
            }) : null;
            const onBackBtn = onDays ? onBack : () => setTab('days');
            return (
              <BottomMoneyPill
                total={totalShoot}
                onBack={onBackBtn}
                onViewCalc={() => setShowCalcView(true)}
                hasPrev={hasPrev}
                onPrev={onPrev}
                hasNext={hasNext}
                onNext={onNext}
                isAtLastDate={isAtLastDate}
                hidden={!!drilldownCrewMember}
              />
            );
          })()}
          <ConfirmDialog
            open={!!confirmOpts}
            title={confirmOpts?.title}
            message={confirmOpts?.message}
            confirmLabel={confirmOpts?.confirmLabel || "Confirm"}
            confirmTone={confirmOpts?.confirmTone || "danger"}
            cancelLabel="Cancel"
            onConfirm={() => { const f = confirmOpts?.onConfirm; setConfirmOpts(null); if (f) f(); }}
            onCancel={() => setConfirmOpts(null)}
          />

          {showSaveSheet && (
            <SaveTimesheetsSheet
              production={production}
              days={days}
              crew={crew}
              onClose={() => setShowSaveSheet(false)}
              onSetCrewEmail={setCrewEmail}
              onTriggerExport={triggerSavePrint}
              showToast={showToast}
            />
          )}

          {savePrintState && (() => {
            if (savePrintState.kind === 'timesheet' && savePrintState.crewMember) {
              const member = savePrintState.crewMember;
              const memberDays = (days || []).filter(d => d.crewId === member.id);
              return (
                <PrintView
                  mode="timesheet"
                  production={production}
                  crewMember={member}
                  crewList={crew}
                  days={memberDays}
                  weeks={weeksForSavePrint}
                  exportWeekIndex={null}
                  userPrefs={userPrefs}
                />
              );
            }
            const filter = savePrintState.crewIdsFilter;
            if (!filter) return null;
            const filteredCrew = (crew || []).filter(c => filter.has(c.id));
            const filteredDays = (days || []).filter(d => filter.has(d.crewId));
            return (
              <PrintView
                mode="grid"
                production={production}
                crewMember={null}
                crewList={filteredCrew}
                days={filteredDays}
                weeks={weeksForSavePrint}
                exportWeekIndex={null}
                userPrefs={userPrefs}
              />
            );
          })()}

          {showMobileNav && (
            <div
              className="fixed inset-0 z-50 flex items-end"
              onClick={() => setShowMobileNav(false)}
              style={{ background: 'rgba(0,0,0,0.5)' }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full bg-neutral-900 border-t border-neutral-800 rounded-t-2xl"
                style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 8px)' }}
              >
                <div className="px-5 pt-5 pb-3">
                  <div className="text-sm font-bold text-neutral-100 truncate">{production.title || 'Production'}</div>
                </div>
                <div className="px-4 pb-4 flex flex-col gap-2">
                  {tab !== 'days' && (
                    <button
                      type="button"
                      onClick={() => { setShowMobileNav(false); setTab('days'); }}
                      className="w-full text-left px-4 py-3 rounded-xl bg-sky-500/10 hover:bg-sky-500/15 border border-sky-500/30 transition-colors text-sm font-semibold text-sky-400 flex items-center gap-2.5"
                      style={{ WebkitTapHighlightColor: 'transparent' }}>
                      <ICal size={15}/>Back to timesheets
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => { setShowMobileNav(false); setTab('setup'); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-tm-card-2 hover:bg-neutral-800 border border-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2.5"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IBriefcase size={15}/>Setup
                  </button>
                  <button
                    type="button"
                    onClick={() => { setShowMobileNav(false); setTab('export'); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-tm-card-2 hover:bg-neutral-800 border border-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2.5"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IShare size={15}/>Export
                  </button>
                  <button
                    type="button"
                    onClick={() => { setShowMobileNav(false); setShowSaveSheet(true); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-tm-card-2 hover:bg-neutral-800 border border-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2.5"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IMail size={15}/>Save timesheets
                  </button>
                  <button
                    type="button"
                    onClick={() => { setShowMobileNav(false); setInvoiceNav('list'); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-tm-card-2 hover:bg-neutral-800 border border-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2.5"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IReceipt size={15}/>Invoices
                  </button>
                </div>
                <div className="px-4 pb-3 pt-1 border-t border-neutral-800">
                  <button
                    type="button"
                    onClick={() => {
                      setShowMobileNav(false);
                      setConfirmOpts({
                        title: 'Reset production data?',
                        message: `Remove all crew, days, and settings from "${production.title || 'this production'}". The production itself stays. This cannot be undone.`,
                        confirmLabel: 'Reset',
                        confirmTone: 'danger',
                        onConfirm: clearAll,
                      });
                    }}
                    className="w-full text-left px-4 py-2.5 text-sm font-semibold text-tm-pen hover:bg-tm-pen/[0.05] rounded-xl transition-colors flex items-center gap-2.5"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IReset size={14}/>Reset production data
                  </button>
                </div>
                <div className="px-4 pb-3">
                  <button type="button" onClick={() => setShowMobileNav(false)}
                    className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-500 hover:text-neutral-300 hover:bg-neutral-800 rounded-xl transition-colors"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════ NEW PRODUCTION SCREEN ═══════════════════════════ */

    function NewProductionScreen({ userPrefs, onCreate, onCancel }) {
      const [title, setTitle] = useState("");
      const [bestBoyMode, setBestBoyMode] = useState(false);
      const inputRef = useRef(null);

      useEffect(() => { inputRef.current?.focus(); }, []);

      const canCreate = title.trim().length > 0;

    function SettingsScreen({ userPrefs, setUserPrefs, onClose, onExport, onResetAll, productionCount = 0 }) {
      const set = (patch) => setUserPrefs(p => ({ ...p, ...patch }));
      const importRef = useRef(null);
      const [confirmOpts, setConfirmOpts] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };
      const [showCalc, setShowCalc] = useState(false);
      const [calcProd, setCalcProd] = useState(() => ({ title: "", startDate: new Date().toISOString().slice(0, 10), cancellationData: null }));
      const [calcCrew, setCalcCrew] = useState(() => {
        const name = userPrefs?.displayName?.trim() || "";
        if (!name) return [];
        return [{ id: uid(), name, role: userPrefs?.defaultRole || "Crew", bdr: Number(userPrefs?.defaultBDR) || 0, isDefaultUser: true }];
      });

      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const rawText = ev.target.result;
          let parsed;
          try { parsed = JSON.parse(rawText); } catch {
            showToast('Could not read file — is it a valid JSON backup?');
            return;
          }
          const arr = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.productions) ? parsed.productions : null);
          if (!arr || !arr.every(p => p && typeof p.id === 'string')) {
            showToast('Invalid backup file — not a valid productions export.');
            return;
          }
          const fileSchemaVersion = parsed?.schemaVersion ?? 0;
          if (fileSchemaVersion > SCHEMA_VERSION) {
            showToast(`This backup needs a newer version of TimeMachine (schema v${fileSchemaVersion}). Please update the app.`);
            return;
          }
          const n = arr.length;
          const msg = productionCount > 0
            ? `Restore ${n} production${n === 1 ? '' : 's'}? This will replace your ${productionCount} existing production${productionCount === 1 ? '' : 's'}. This cannot be undone.`
            : `Restore ${n} production${n === 1 ? '' : 's'} from backup?`;
          setConfirmOpts({
            title: "Restore from backup?",
            message: msg,
            confirmLabel: "Restore",
            confirmTone: "danger",
            onConfirm: async () => {
              const result = importBackup(rawText);
              if (result.ok) {
                // Native: flush the imported data to durable storage before the
                // WebView reloads. Web: no await runs, reload is synchronous.
                if (storage.isNative) await storage.flush();
                window.location.reload();
              }
              else { showToast(result.error); }
            },
          });
        };
        reader.readAsText(file);
      };

      const deptRoles = userPrefs.defaultDepartment && DEPARTMENTS[userPrefs.defaultDepartment]
        ? Object.keys(DEPARTMENTS[userPrefs.defaultDepartment])
        : [];

      const { onDeptChange, onRoleChange } = makeDeptRoleHandlers(set, userPrefs);

      const vatSummary = userPrefs.vatRegistered
        ? `VAT ${userPrefs.vatRate || 20}%`
        : 'Not registered';

      const yourDetailsSummary =
        (userPrefs.legalName || '').trim() ||
        (userPrefs.fromCompanyName || '').trim() ||
        (userPrefs.fromEmail || '').trim() ||
        '—';

      const bankSummary = (userPrefs.bankAccountNumber || '').length >= 4
        ? `${((userPrefs.bankName || '').trim() || 'Account')} · ***${userPrefs.bankAccountNumber.slice(-4)}`
        : '—';

      const numberingSummary = userPrefs.invoicePrefix || userPrefs.invoiceNextNumber
        ? `${userPrefs.invoicePrefix || ''}${userPrefs.invoiceNextNumber || 1} · Net ${userPrefs.paymentTermsDays ?? 30}`
        : '—';

      const logoSummary = userPrefs.logoBase64 ? 'Uploaded' : '—';

      const defaultsSummary = (() => {
        const bits = [];
        if (Number(userPrefs.defaultMileageRate) > 0) bits.push(`£${userPrefs.defaultMileageRate}/mi`);
        if (userPrefs.defaultKitMoneyEnabled) bits.push('Kit');
        if (userPrefs.defaultPerDiemEnabled) bits.push('Per diem');
        return bits.length ? bits.join(' · ') : '—';
      })();

      const calcSummary = (() => {
        const m = roundingModeOf(userPrefs);
        return m === 'favourable' ? 'Favourable rounding' : m === 'apa' ? 'APA rounding' : 'Exact';
      })();

      const displaySummary = userPrefs.comparisonUnit === 'off'
        ? 'Off'
        : (userPrefs.comparisonUnit || 'Greggs sausage rolls');

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">

              <div style={{ width: 24 }} />
            </div>
          </div>

          <div className="max-w-2xl mx-auto px-4 py-6">

            <SectionCard title="Tools">
              <Btn variant="ghost" onClick={() => setShowCalc(true)}><ICalc/>Cancellation Calculator</Btn>
