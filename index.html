                  const renderDept = (key) => {
                    let title = '', body = null, isSet = false, onClear = null;
                    if (key === 'preCall') {
                      title = 'Pre-call · Dept default';
                      isSet = !!dd.preCallTime;
                      onClear = () => updateDeptDefault('preCallTime', '');
                      body = (
                        <>
                          <div>
                            <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Pre-call time</div>
                            <input type="time" value={dd.preCallTime || ''} onChange={(e) => updateDeptDefault('preCallTime', e.target.value)} className="w-full min-h-[44px] bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500" style={{ WebkitAppearance: 'none' }}/>
                          </div>
                        </>
                      );
                    } else if (key === 'mileage') {
                      const updateDeptMulti = (patch) => setProduction(p => {
                        const ddNew = { ...(p.dayDefaults?.[currentDate] || {}), ...patch };
                        return { ...p, dayDefaults: { ...(p.dayDefaults || {}), [currentDate]: ddNew } };
                      });
                      title = 'Mileage · Dept default';
                      isSet = (Number(dd.miles) || 0) > 0 || !!(dd.mileagePostcode || '').trim();
                      onClear = () => updateDeptMulti({ miles: 0, mileagePostcode: '', mileageMethod: 'manual' });
                      body = (
                        <MileageInput day={{ ...dd, date: currentDate, crewId: 'dept-default' }} updateDay={updateDeptMulti} days={[]}/>
                      );
                    } else if (key === 'travel') {
                      title = 'Travel time · Dept default';
                      isSet = (Number(dd.travelOutMins) || 0) > 0 || (Number(dd.travelBackMins) || 0) > 0;
                      onClear = () => setProduction(p => {
                        const ddNew = { ...(p.dayDefaults?.[currentDate] || {}), travelOutMins: 0, travelBackMins: 0 };
                        return { ...p, dayDefaults: { ...(p.dayDefaults || {}), [currentDate]: ddNew } };
                      });
                      body = (
                        <>
                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Out (mins)</div>
                              <input type="number" min="0" step="1" inputMode="numeric" value={Number(dd.travelOutMins) || 0} onChange={(e) => updateDeptDefault('travelOutMins', Number(e.target.value) || 0)} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500"/>
                            </div>
                            <div>
                              <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Back (mins)</div>
                              <input type="number" min="0" step="1" inputMode="numeric" value={Number(dd.travelBackMins) || 0} onChange={(e) => updateDeptDefault('travelBackMins', Number(e.target.value) || 0)} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500"/>
                            </div>
                          </div>
                        </>
                      );
                    } else if (key === 'perDiem') {
                      title = 'Per diem · Dept default';
                      isSet = (Number(dd.perDiemAmount) || 0) > 0;
                      onClear = () => updateDeptDefault('perDiemAmount', 0);
                      body = (
                        <>
                          <div>
                            <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Amount (£)</div>
                            <input type="number" min="0" step="0.01" inputMode="decimal" value={Number(dd.perDiemAmount) || 0} onChange={(e) => updateDeptDefault('perDiemAmount', Number(e.target.value) || 0)} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500"/>
                          </div>
                          )}
                        </>
                      );
                    } else if (key === 'expenses') {
                      const expenses = dd.expenses || [];
                      const addExp = () => updateDeptDefault('expenses', [...expenses, { id: uid(), amount: 0, category: 'Other', description: '' }]);
                      const upExp = (id, patch) => updateDeptDefault('expenses', expenses.map(x => x.id === id ? { ...x, ...patch } : x));
                      const rmExp = (id) => updateDeptDefault('expenses', expenses.filter(x => x.id !== id));
                      title = 'Expenses · Dept default';
                      isSet = expenses.length > 0;
                      onClear = () => updateDeptDefault('expenses', []);
                      body = (
                        <>
                          <button type="button" onClick={addExp} className="text-[10px] uppercase tracking-wide text-sky-500 hover:text-sky-300 font-bold flex items-center gap-1 mb-3" style={{ WebkitTapHighlightColor: 'transparent' }}>
                            <IPlus size={11}/>Add expense
                          </button>
                          {expenses.length === 0 ? (
                            <div className="text-[11px] text-neutral-500 italic">No expenses yet — tap Add expense.</div>
                          ) : (
                            <div className="space-y-2">
                              {expenses.map(exp => (
                                <div key={exp.id} className="flex flex-wrap items-center gap-2">
                                  <select value={exp.category} onChange={(e) => upExp(exp.id, { category: e.target.value })} className="bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-2 text-sm text-neutral-100 focus:outline-none focus:border-sky-500" style={{ width: 116 }}>
                                    {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                  </select>
                                  <input type="number" min="0" step="0.01" inputMode="decimal" value={exp.amount} onChange={(e) => upExp(exp.id, { amount: Number(e.target.value) || 0 })} placeholder="0.00" className="bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-2 text-sm font-mono text-neutral-100 focus:outline-none focus:border-sky-500" style={{ width: 84 }}/>
                                  <input type="text" value={exp.description} onChange={(e) => upExp(exp.id, { description: e.target.value })} placeholder="Description" className="flex-1 min-w-[80px] bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-2 text-sm text-neutral-100 focus:outline-none focus:border-sky-500"/>
                                  <button type="button" onClick={() => rmExp(exp.id)} className="text-neutral-600 hover:text-tm-pen transition-colors p-1" aria-label="Remove expense" style={{ WebkitTapHighlightColor: 'transparent' }}><IX size={14}/></button>
                                </div>
                              ))}
                            </div>
                          )}
                        </>
                      );
                    }
                    return (
                      <div ref={setRef(key)} className="px-4">
                        <SectionCard title={title} variant="condition" onClose={() => close(key)}>
                          {body}
                          {isSet && onClear && (
                            <button
                              type="button"
                              onClick={onClear}
                              className="w-full mt-3 px-4 py-2.5 rounded-xl bg-tm-warn/10 hover:bg-tm-warn/15 border border-tm-warn/30 text-tm-warn text-sm font-bold transition-colors"
                              style={{ WebkitTapHighlightColor: 'transparent' }}
                            >
                              Clear default
                            </button>
                          )}
                        </SectionCard>
                      </div>
                    );
                  };
                  return Array.from(expandedDeptExtras).map(key => <React.Fragment key={key}>{renderDept(key)}</React.Fragment>);
                })()}
              </>
            );
          })()}

          <div className="px-4 -mt-0.5 mb-4 flex items-center gap-1.5 text-[10px] uppercase tracking-[0.14em] text-neutral-500 font-semibold">
            <span className="w-1.5 h-1.5 rounded-full bg-sky-500" style={{ boxShadow: '0 0 6px rgba(14,165,233,0.6)' }}/>
            APPLIES TO ALL UNLESS OVERRIDDEN BELOW
          </div>

          {dayConditions.length > 0 && (
            <>
              <div className="px-4 mb-2 mt-2 flex items-center gap-2">
                <span className="text-[10px] uppercase tracking-[0.22em] text-neutral-400 font-bold">PENALTIES</span>
                <span className="flex-1 h-px bg-neutral-800/60"/>
              </div>
              <div className="px-4 mb-4">
                <div className="bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-3 flex flex-wrap gap-1.5">
                {dayConditions.map(c => (
                  <span
                    key={c.label}
                    className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${
                      c.penalty
                        ? 'bg-tm-pen/10 text-tm-pen border border-tm-pen/25'
                        : c.warn
                          ? 'bg-tm-warn/10 text-tm-warn border border-tm-warn/25'
                          : 'bg-tm-card-2 text-neutral-400 border border-neutral-700'
                    }`}
                  >
                    {c.label}{c.count > 1 ? ` · ${c.count}` : ''}
                  </span>
                ))}
                </div>
              </div>
            </>
          )}

          {(() => {
            const withVar = crewWithVariances.filter(c => !c.isOff && c.variances.length > 0);
            if (withVar.length === 0) return null;
            return (
              <>
                <div className="px-4 mb-3 mt-2 flex items-center gap-2">
                  <span className="text-[10px] uppercase tracking-[0.22em] text-fuchsia-400 font-bold">VARIANCES</span>
                  <span className="flex-1 h-px bg-neutral-800/60"/>
                  <span className="text-[10px] font-mono text-neutral-500 font-bold">{withVar.length}</span>
                </div>
                <div className="px-4 mb-4 flex flex-col gap-1">
                  {withVar.map(entry => {
                    const isExpanded = expandedVarianceCrewIds.has(entry.member.id);
                    return (
                      <div key={entry.member.id}>
                        <button
                          type="button"
                          onClick={() => toggleVarianceExpanded(entry.member.id)}
                          className={`w-full px-3.5 py-2.5 flex items-center gap-3 transition-colors border border-fuchsia-400/25 ${
                            isExpanded
                              ? 'bg-fuchsia-400/[0.06] rounded-t-xl border-b-fuchsia-400/15'
                              : 'bg-fuchsia-400/[0.04] hover:bg-fuchsia-400/[0.06] rounded-xl'
                          }`}
                          style={{ WebkitTapHighlightColor: 'transparent' }}
                          aria-expanded={isExpanded}
                        >
                          <span className="text-sm font-semibold text-fuchsia-400 truncate">{entry.member.name || 'Unnamed'}</span>
                          <span className="ml-auto text-[10px] text-neutral-500 uppercase tracking-wider font-bold">
                            {entry.variances.length} {entry.variances.length === 1 ? 'change' : 'changes'}
                          </span>
                          <span className={`text-fuchsia-400 text-xs transition-transform ${isExpanded ? 'rotate-90' : ''}`}>›</span>
                        </button>

                        {isExpanded && (
                          <div className="px-3.5 py-2.5 bg-fuchsia-400/[0.02] border border-t-0 border-fuchsia-400/25 rounded-b-xl flex flex-col gap-1">
                            {entry.variances.map((v, i) => (
                              <div key={i} className="flex items-baseline gap-2 text-[11px]">
                                <span className="text-fuchsia-400 font-bold uppercase tracking-wider text-[9px] w-12 flex-shrink-0">{v.label}</span>
                                <span className="text-neutral-300 font-mono">{v.detail}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </>
            );
          })()}

          <div className="px-4 mb-2.5 flex items-center gap-2">
            <span className="text-[10px] uppercase tracking-[0.22em] text-sky-500 font-bold">CREW</span>
            <span className="flex-1 h-px bg-neutral-800/60"/>
            <span className="text-[10px] font-mono text-neutral-500 font-bold">{activeCrewCount} OF {crew.length}</span>
          </div>

          <div className="px-4">
            {sortedCrew.map(({ member, isMe, isOff, dayTotal, chips, offReason, variances }) => {
              const hasVariance = !isOff && (variances?.length || 0) > 0;
              return (
              <button
                key={member.id}
                type="button"
                onClick={() => onCrewTap?.(member)}
                className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-xl border mb-1.5 transition-colors text-left ${
                  isMe
                    ? 'bg-sky-500/[0.03] border-sky-500/25'
                    : isOff
                    ? 'bg-transparent border-neutral-800 border-dashed opacity-60'
                    : 'bg-neutral-900 border-neutral-800 hover:border-neutral-700'
                }`}
                style={{ WebkitTapHighlightColor: 'transparent' }}
              >
                <div className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-[13px] flex-shrink-0 ${
                  isMe ? 'bg-sky-500/15 text-sky-400' : 'bg-tm-card-2 text-neutral-400'
                }`}>
                  {((member.name || '?').trim()[0] || '?').toUpperCase()}
                </div>

                <div className="flex-1 min-w-0">
                  <div className={`text-sm font-semibold leading-tight ${isOff ? 'text-neutral-400' : hasVariance ? 'text-fuchsia-400' : 'text-neutral-100'}`}>
                    {member.name || 'Unnamed'}
                    {isMe && <span className="ml-1.5 text-[9px] font-semibold text-neutral-500 lowercase">(you)</span>}
                  </div>
                  <div className="text-[11px] text-neutral-400 mt-0.5">
                    {isOff
                      ? <span className="text-[10px] uppercase tracking-[0.14em] text-neutral-500 font-bold">{offReason || 'Not on this day'}</span>
                      : `${member.role || '—'} · £${member.bdr ?? 0} BDR`}
                  </div>
                  {!isOff && chips.length > 0 && (
                    <div className="flex gap-1 mt-1.5">
                      {chips.map(c => <span key={c.label} className={c.className}>{c.label}</span>)}
                    </div>
                  )}
                </div>

                {isOff ? (
                  <div className="text-neutral-600 font-mono">—</div>
                ) : (
                  <div className="text-right flex-shrink-0">
                    <div className="font-mono text-sm font-bold text-neutral-100 tabular-nums">{fmtGBP(dayTotal)}</div>
                  </div>
                )}
              </button>
              );
            })}

            <button
              type="button"
              onClick={() => setShowAddCrew(true)}
              className="w-full px-4 py-3.5 rounded-xl border border-dashed border-neutral-700 hover:border-sky-500 hover:bg-sky-500/[0.03] hover:text-sky-400 text-neutral-500 text-[11px] font-bold uppercase tracking-[0.18em] transition-colors flex items-center justify-center gap-2 mt-2 mb-2"
              style={{ WebkitTapHighlightColor: 'transparent' }}
            >
              <IPlus size={13}/>Add to today's crew
            </button>
          </div>

          {showLunchSheet && (() => {
            const defs = getDayDefaults(production, currentDate);
            const startVal = defs?.lunchStartTime ?? production.defaultDay?.lunchStartTime ?? DEFAULT_PRODUCTION_DAY.lunchStartTime;
            const durVal = defs?.lunchDurationMins ?? production.defaultDay?.lunchDurationMins ?? DEFAULT_PRODUCTION_DAY.lunchDurationMins;
            return (
              <div
                className="fixed inset-0 z-50 flex items-end"
                onClick={() => setShowLunchSheet(false)}
                style={{ background: 'rgba(0,0,0,0.5)' }}
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  className="w-full bg-neutral-900 border-t border-neutral-800 rounded-t-2xl px-5 pt-5"
                  style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 16px)' }}
                >
                  <div className="text-sm font-bold text-neutral-100 mb-3">Lunch</div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Start</div>
                      <input
                        type="time"
                        value={startVal}
                        onChange={(e) => setProduction(p => setDayDefault(p, currentDate, 'lunchStartTime', e.target.value))}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500"
                        style={{ WebkitAppearance: 'none' }}
                      />
                    </div>
                    <div>
                      <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Duration (mins)</div>
                      <input
                        type="number"
                        min="0"
                        step="15"
                        value={durVal}
                        onChange={(e) => setProduction(p => setDayDefault(p, currentDate, 'lunchDurationMins', Number(e.target.value) || 0))}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowLunchSheet(false)}
                    className="w-full mt-4 px-4 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-black text-sm font-bold transition-colors"
                    style={{ WebkitTapHighlightColor: 'transparent', boxShadow: '0 4px 16px rgba(14,165,233,0.25)' }}
                  >
                    Done
                  </button>
                </div>
              </div>
            );
          })()}

          {showAddCrew && (
            <QuickAddCrewSheet
              onClose={() => setShowAddCrew(false)}
              onSubmit={handleAddNewCrew}
            />
          )}
        </div>
      );
    }

    function ExtraChip({ label, summary, isSet, isOverridden, onTap }) {
      return (
        <button
          type="button"
          onClick={onTap}
          className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] font-semibold transition-colors ${
            isOverridden
              ? 'bg-fuchsia-400/[0.06] border-fuchsia-400/30 text-fuchsia-400 hover:bg-fuchsia-400/[0.1]'
              : isSet
              ? 'bg-sky-500/[0.06] border-sky-500/30 text-sky-400 hover:bg-sky-500/[0.1]'
              : 'bg-tm-card-2 border-neutral-800 text-neutral-500 hover:border-neutral-700 hover:text-neutral-400'
          }`}
          style={{ WebkitTapHighlightColor: 'transparent' }}
        >
          <span className="uppercase tracking-wider">{label}</span>
          {summary && (
            <span className="font-mono text-[10px] text-neutral-300 tabular-nums">{summary}</span>
          )}
        </button>
      );
    }

    function TimeCardWithOverride({ label, value, defaultValue, isOverridden: isOverriddenProp, isOverInOT, onChange, onResetToDefault }) {
      // Backward-compat: when isOverridden prop not passed, derive from value vs default.
      const isOverridden = isOverriddenProp !== undefined
        ? isOverriddenProp
        : (defaultValue !== undefined && defaultValue !== null && value !== defaultValue);
      const cardCls = isOverInOT
        ? 'bg-tm-warn/[0.08] border-tm-warn/45'
        : 'bg-neutral-900 border-neutral-800';
      return (
        <div className={`relative border rounded-xl px-3 py-3 ${cardCls}`}>
          <div className="flex items-center justify-between mb-1 gap-2">
            <div className="text-[10px] uppercase tracking-[0.15em] text-sky-500 font-bold">{label}</div>
            {isOverridden && (
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onResetToDefault(); }}
                className="relative z-10 text-[8px] tracking-wider font-bold uppercase border rounded px-1 py-0.5 bg-fuchsia-400/10 text-fuchsia-400 border-fuchsia-400/30 hover:bg-fuchsia-400/15 transition-colors"
                aria-label={`Reset ${label} to department default`}
                title={`Reset to default (${defaultValue})`}
                style={{ WebkitTapHighlightColor: 'transparent' }}>
                VAR
              </button>
            )}
          </div>
          <div className={`text-[26px] font-mono font-bold leading-none tabular-nums ${isOverridden ? 'text-fuchsia-400' : 'text-neutral-100'}`}>
            {value || <span className="text-neutral-500 text-base font-sans font-medium">—</span>}
          </div>
          <input
            type="time"
            value={value || ''}
            onChange={(e) => onChange(e.target.value)}
            onClick={(e) => { try { e.currentTarget.showPicker?.(); } catch {} }}
            className="tm-picker-overlay absolute inset-0 w-full h-full opacity-0 cursor-pointer"
            aria-label={`Edit ${label.toLowerCase()}`}
            style={{ WebkitAppearance: 'none' }}
          />
        </div>
      );
    }

    function LunchCardWithOverride({ startValue, durValue, defaultStart, defaultDur, startOverridden: startOverProp, durOverridden: durOverProp, onResetStart, onResetDur, onTapEdit, isLunchLate, lateMinutes, isCurtailed, curtailedMinutes }) {
      const startOverridden = startOverProp !== undefined ? startOverProp : (defaultStart != null && startValue !== defaultStart);
      const durOverridden = durOverProp !== undefined ? durOverProp : (defaultDur != null && durValue !== defaultDur);
      const anyOverridden = startOverridden || durOverridden;
      const lunchEnd = startValue ? addMinutesToTime(startValue, durValue || 60) : '';
      const tappable = typeof onTapEdit === 'function';
      const Wrapper = tappable ? 'button' : 'div';

    function ConditionsDisplay({ dayRecord, calc }) {
      const pills = [];
      if (calc?.meta?.continuousDay) pills.push({ label: 'CWD', warn: true });
      if (calc?.meta?.isElevenHourDay) pills.push({ label: '11h day', warn: false });
      const otHrs = (calc?.lines || [])
        .filter(l => categorizeBreakdownLine(l.label) === 'ot')
        .reduce((s, l) => s + (Number(l.qty) || 0), 0);
      if (otHrs > 0) pills.push({ label: `OT ${otHrs % 1 ? otHrs.toFixed(1) : otHrs}h`, warn: true });
      if ((calc?.lines || []).some(l => /late 1st|l1/i.test(l.label))) pills.push({ label: 'Late 1st break', warn: true });
      if ((calc?.lines || []).some(l => /missed 2nd|late 2nd/i.test(l.label))) pills.push({ label: '2nd break issue', warn: true });
      if ((calc?.lines || []).some(l => /curtailed/i.test(l.label))) pills.push({ label: 'Curtailed break', warn: true });
      if ((calc?.lines || []).some(l => /missed cwd|missed meal/i.test(l.label))) pills.push({ label: 'Missed break', warn: true });
      if (dayRecord?.stepUpRole) pills.push({ label: `Step-up: ${dayRecord.stepUpRole}`, warn: false });
      if ((Number(dayRecord?.perDiemAmount) || 0) > 0) pills.push({ label: `Per diem £${dayRecord.perDiemAmount}`, warn: false });
      if ((Number(dayRecord?.kitMoneyAmount) || 0) > 0) pills.push({ label: `Kit £${dayRecord.kitMoneyAmount}`, warn: false });
      if (Number(dayRecord?.miles) > 0) pills.push({ label: `${dayRecord.miles} mi`, warn: false });
      if (Number(dayRecord?.travelOutMins) > 0 || Number(dayRecord?.travelBackMins) > 0) pills.push({ label: 'Travel time', warn: false });

      return (
        <div className="bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-3">
          <div className="flex flex-wrap gap-1.5">
            {pills.length === 0 ? (
              <span className="text-[11px] text-neutral-500">No conditions logged</span>

              pills.map(c => (
                <span key={c.label} className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${c.warn ? 'bg-tm-warn/10 text-tm-warn border border-tm-warn/25' : 'bg-tm-card-2 text-neutral-400 border border-neutral-700'}`}>

    function CrewMemberDayView({ crewMember, currentDate, production, setProduction, onBack, onTriggerCrewTimesheet, showToast, userPrefs }) {
      const [showLunchEdit, setShowLunchEdit] = useState(false);
      const [expandedExtras, setExpandedExtras] = useState(() => new Set());
      const extraRefs = useRef({});
      const toggleExtra = (key) => {
        setExpandedExtras(prev => {
          const wasOpen = prev.has(key);
          // Single-open: tapping a chip closes any other open chip.
          // Collect every chip that's about to be closed so confirm-on-close
          // side-effects fire whether the user tapped it directly or it was
          // auto-closed to make way for a different chip.
          const closing = wasOpen ? [key] : Array.from(prev);
          // 2nd-break close marks the field as "logged" so the chip reflects
          // the actual duration (incl. 0/Missed) instead of the dim "not yet
          // logged" state.
          if (closing.includes('secondBreak')) {
            setProduction(p => ({
              ...p,
              days: (p.days || []).map(d =>
                d.date === currentDate && d.crewId === crewMember.id
                  ? { ...d, secondBreakLogged: true }
                  : d
              ),
            }));
          }
          if (!wasOpen) {
            // smooth scroll into view after the panel mounts
            requestAnimationFrame(() => {
              extraRefs.current[key]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
          }
          return wasOpen ? new Set() : new Set([key]);
        });
      };
      const [editingNote, setEditingNote] = useState(false);
      const [showCrewActions, setShowCrewActions] = useState(false);
      const [showEditCrew, setShowEditCrew] = useState(false);
      const dayRecord = (production.days || []).find(d => d.date === currentDate && d.crewId === crewMember.id);
      const defaults = getDayDefaults(production, currentDate);
      // Fully resolved day (the canonical cascade the calc engine uses). Display
      // the resolved call/wrap/lunch/dayType so cascade-inherited values show
      // instead of blanks — the raw dayRecord fields are undefined when a day
      // inherits from dayDefaults / production defaults. `defaults`/`dayRecord`
      // are still used below for override badges and edit writes.
      const resolvedDay = dayRecord ? resolveDay(production, dayRecord, crewMember) : null;

      const handleAddToThisDay = () => {
        setProduction(p => {
          // V4-5h-14 (F4.3): omit time fields so resolveDay cascades from dayDefaults.
          const newDay = {
            ...makeBlankDay(crewMember.id),
            date: currentDate,
          };
          return { ...p, days: [...(p.days || []), newDay] };
        });
      };

      const sortedDates = useMemo(
        () => [...new Set((production.days || []).map(d => d.date))].sort(),
        [production.days]
      );
      const prevDate = (() => {
        const idx = sortedDates.indexOf(currentDate);
        return idx > 0 ? sortedDates[idx - 1] : null;
      })();
      const prevDayRecord = prevDate
        ? (production.days || []).find(d => d.date === prevDate && d.crewId === crewMember.id)
        : null;
      const calc = dayRecord ? calcForDisplay(production, dayRecord, crewMember, prevDayRecord) : null;

      const isOverridden = (field) => {
        if (!dayRecord || !defaults) return false;
        // V4-5h-14 (F9.3): require explicit value before flagging as override.
        // Undefined means cascade-from-default, not override.
        return dayRecord[field] !== undefined && dayRecord[field] !== defaults[field];
      };
      const anyTimeOverridden = ['callTime', 'wrapTime', 'lunchStartTime', 'lunchDurationMins', 'dayType'].some(isOverridden);

      const resetField = (field) => {
        if (!dayRecord) return;
        // V4-5h-11: reset to undefined → cascade from dayDefaults resumes via resolveDay.
        setProduction(p => ({
          ...p,
          days: p.days.map(d => {
            if (d.id !== dayRecord.id) return d;
            const next = { ...d };
            delete next[field];
            return next;
          })
        }));
      };

      // V4-5h-11: time-field writes auto-collapse to undefined when matching dept default.
      const updateTimeField = (field, value) => {
        if (!dayRecord) return;
        const matchesDefault = defaults && value === defaults[field];
        setProduction(p => ({
          ...p,
          days: p.days.map(d => {
            if (d.id !== dayRecord.id) return d;
            if (matchesDefault) {
              const next = { ...d };
              delete next[field];
              return next;
            }
            return { ...d, [field]: value };
          })
        }));
      };

      const updateField = (field, value) => {
        if (!dayRecord) return;
        setProduction(p => ({
          ...p,
          days: p.days.map(d =>
            d.id === dayRecord.id ? { ...d, [field]: value } : d
          )
        }));
      };

      const dayNumber = sortedDates.indexOf(currentDate) + 1;
      const isMe = crewMember.id === resolveUserCrewId(production, userPrefs);

      const formattedDate = currentDate
        ? new Date(currentDate + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase()
        : '';

      return (
        <div style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
          <div className="sticky top-0 z-40 bg-black border-b border-sky-500 -mx-4 -mt-6 px-4" style={{ paddingTop: 'env(safe-area-inset-top)' }}>

                aria-label="Back to multi-crew day view">
                <span className="text-neutral-600">‹</span>{(production.title || 'Production').toUpperCase()}{dayNumber > 0 ? ` · DAY ${dayNumber}` : ''}
              </button>
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-[22px] font-extrabold tracking-tight text-neutral-100 truncate flex items-baseline gap-2">
                    {crewMember.name || 'Unnamed'}
                    {isMe && <span className="text-[10px] font-semibold text-neutral-500 lowercase">(you)</span>}
                  </div>
                  <div className="text-[11px] uppercase tracking-[0.14em] text-sky-500 font-bold mt-0.5">
                    {crewMember.role || '—'} · £{crewMember.bdr ?? 0} BDR
                  </div>
                </div>
                <button
                  onClick={() => setShowCrewActions(true)}
                  className="w-8 h-8 rounded-full bg-tm-card-2 hover:bg-neutral-800 flex items-center justify-center text-neutral-300 flex-shrink-0"
                  aria-label="More actions"
                  style={{ WebkitTapHighlightColor: 'transparent' }}>
                  <IKebab size={14}/>
                </button>
              </div>
            </div>
          </div>

          <div className="pt-4">
            <div className="text-[11px] uppercase tracking-[0.14em] text-neutral-500 font-mono mb-3">
              {formattedDate}
            </div>

            {dayRecord ? (
              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl px-4 pt-4 pb-3.5 mb-4">
                <div className="text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-bold mb-1.5">
                  {isMe ? 'TODAY' : `${(crewMember.name || '').toUpperCase()} TODAY`}
                </div>
                <div className="font-mono text-[36px] font-bold leading-none text-neutral-100 tabular-nums tracking-tight">
                  {fmtGBP(calc.total)}
                </div>
                {(() => {
                  const b = bucketCalcTotals(calc);
                  return <HeroBreakdownRow basic={b.basic} ot={b.ot} pen={b.pen}/>;
                })()}
              </div>
            ) : (
              <div className="bg-neutral-900 border border-dashed border-neutral-700 rounded-2xl px-4 py-6 mb-4 text-center">
                <div className="text-neutral-500 text-sm mb-3">{crewMember.name || 'This crew member'} is not on this day</div>
                <button
                  type="button"
                  onClick={handleAddToThisDay}
                  className="px-4 py-2.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-black text-[12px] font-bold uppercase tracking-wider transition-colors inline-flex items-center gap-2"
                  style={{ WebkitTapHighlightColor: 'transparent', boxShadow: '0 4px 16px rgba(14,165,233,0.25)' }}
                >
                  <IPlus size={13}/>Add to this day
                </button>
              </div>
            )}

            {dayRecord && (
              <>
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-[10px] uppercase tracking-[0.22em] text-sky-500 font-bold">TIMES</span>
                  <span className="flex-1 h-px bg-neutral-800/60"/>
                  {anyTimeOverridden && (
                    <span className="text-[10px] uppercase tracking-[0.18em] text-fuchsia-400 font-bold">OVERRIDDEN</span>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <TimeCardWithOverride
                    label="CALL"
                    value={resolvedDay?.callTime ?? ''}
                    defaultValue={defaults?.callTime}
                    isOverridden={dayRecord.callTime !== undefined && dayRecord.callTime !== defaults?.callTime}
                    onChange={(v) => updateTimeField('callTime', v)}
                    onResetToDefault={() => resetField('callTime')}
                  />
                  <TimeCardWithOverride
                    label="WRAP"
                    value={resolvedDay?.wrapTime ?? ''}
                    defaultValue={defaults?.wrapTime}
                    isOverridden={dayRecord.wrapTime !== undefined && dayRecord.wrapTime !== defaults?.wrapTime}
                    isOverInOT={(calc?.meta?.otHrs || 0) > 0}
                    onChange={(v) => updateTimeField('wrapTime', v)}
                    onResetToDefault={() => resetField('wrapTime')}
                  />
                </div>

                {(() => {
                  const lateLine = (calc?.lines || []).find(l => /late 1st|l1\b/i.test(l.label));
                  const isLunchLate = !!lateLine;
                  const callMins = parseHHMM(resolvedDay?.callTime);
                  const lunchMins = parseHHMM(resolvedDay?.lunchStartTime);
                  const lateMinutes = (isLunchLate && callMins !== null && lunchMins !== null)
                    ? Math.max(0, Math.round((lunchMins - callMins - 6) * 60))
                    : 0;
                  const dur = Number(dayRecord.lunchDurationMins) || 0;
                  const isCurtailed = dur > 0 && dur < 60;
                  const curtailedMinutes = isCurtailed ? (60 - dur) : 0;
                  return (
                    <LunchCardWithOverride
                      startValue={resolvedDay?.lunchStartTime ?? ''}
                      durValue={resolvedDay?.lunchDurationMins ?? 0}
                      defaultStart={defaults?.lunchStartTime}
                      defaultDur={defaults?.lunchDurationMins}
                      startOverridden={dayRecord.lunchStartTime !== undefined && dayRecord.lunchStartTime !== defaults?.lunchStartTime}
                      durOverridden={dayRecord.lunchDurationMins !== undefined && dayRecord.lunchDurationMins !== defaults?.lunchDurationMins}
                      onResetStart={() => resetField('lunchStartTime')}
                      onResetDur={() => resetField('lunchDurationMins')}
                      onTapEdit={() => setShowLunchEdit(true)}
                      isLunchLate={isLunchLate}
                      lateMinutes={lateMinutes}
                      isCurtailed={isCurtailed}
                      curtailedMinutes={curtailedMinutes}
                    />
                  );
                })()}

                <DayTypeRow
                  value={resolvedDay?.dayType ?? ''}
                  defaultValue={defaults?.dayType}
                  isOverridden={dayRecord.dayType !== undefined && dayRecord.dayType !== defaults?.dayType}
                  onChange={(v) => updateTimeField('dayType', v)}
                  onResetToDefault={() => resetField('dayType')}
                />

                {(() => {
                  const isTravelDay = dayRecord.dayType === 'Travel Day';
                  // V4-5h-10: value-presence drives activation (no *Enabled flags).
                  const stepUpActive = !!dayRecord.stepUpRole;
                  const kitMoneyActive = (Number(dayRecord.kitMoneyAmount) || 0) > 0;
                  const perDiemActive = (Number(dayRecord.perDiemAmount) || 0) > 0;
                  const preCallActive = !!(dayRecord.preCallTime || dayRecord.truckCallTime);
                  const mileageActive = Number(dayRecord.miles) > 0 || !!dayRecord.mileagePostcode;
                  const travelTimeActive = Number(dayRecord.travelOutMins) > 0 || Number(dayRecord.travelBackMins) > 0;
                  const expensesActive = (dayRecord.expenses || []).length > 0;
                  const show2ndBreakChip = !!calc?.meta?.secondBreakRequired
                    && !calc?.meta?.continuousDay
                    && !calc?.meta?.isPmpa
                    && !isTravelDay;

                  const expensesTotal = (dayRecord.expenses || []).reduce((s, e) => s + (Number(e.amount) || 0), 0);
                  const travelOut = Number(dayRecord.travelOutMins) || 0;
                  const travelBack = Number(dayRecord.travelBackMins) || 0;

                  // Override detection vs dept defaults — empty-ish cascade (mirror resolveDay).
                  const dd = defaults;
                  const preCallOverridden = !!dd && !!dayRecord.preCallTime && dayRecord.preCallTime !== (dd.preCallTime || '');
                  const mileageOverridden = !!dd && (
                    ((Number(dayRecord.miles) || 0) > 0 && (Number(dayRecord.miles) || 0) !== (Number(dd.miles) || 0)) ||
                    (!!(dayRecord.mileagePostcode || '').trim() && (dayRecord.mileagePostcode || '').trim() !== (dd.mileagePostcode || '').trim())
                  );
                  const travelOverridden = !!dd && (travelOut > 0 || travelBack > 0) && (
                    travelOut !== (Number(dd.travelOutMins) || 0) ||
                    travelBack !== (Number(dd.travelBackMins) || 0)
                  );
                  const perDiemOverridden = !!dd && (Number(dayRecord.perDiemAmount) || 0) > 0 &&
                    (Number(dayRecord.perDiemAmount) || 0) !== (Number(dd.perDiemAmount) || 0);
                  const expensesOverridden = !!dd && (dayRecord.expenses?.length ?? 0) > 0 && (
                    (dayRecord.expenses?.length ?? 0) !== (dd.expenses?.length ?? 0) ||
                    expensesTotal !== (dd.expenses || []).reduce((s, e) => s + (Number(e.amount) || 0), 0)
                  );

                  return (
                    <>
                      <div className="flex items-center gap-2 mt-6 mb-3">
                        <span className="text-[10px] uppercase tracking-[0.22em] text-sky-500 font-bold">EXTRAS</span>
                        <span className="flex-1 h-px bg-neutral-800/60"/>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        <ExtraChip label="Step-up" isSet={stepUpActive} summary={stepUpActive ? (dayRecord.stepUpRole || '—') : null} onTap={() => toggleExtra('stepUp')}/>
                        {!isTravelDay && <ExtraChip label="Pre-call" isSet={preCallActive} isOverridden={preCallOverridden} summary={preCallActive ? (dayRecord.preCallTime || dayRecord.truckCallTime || '—') : null} onTap={() => toggleExtra('preCall')}/>}
                        <ExtraChip label="Mileage" isSet={mileageActive} isOverridden={mileageOverridden} summary={mileageActive ? `${Number(dayRecord.miles) || 0} mi` : null} onTap={() => toggleExtra('mileage')}/>
                        <ExtraChip label="Kit" isSet={kitMoneyActive} summary={kitMoneyActive ? fmtGBP(Number(dayRecord.kitMoneyAmount) || 0) : null} onTap={() => toggleExtra('kit')}/>
                        {!isTravelDay && <ExtraChip label="Travel" isSet={travelTimeActive} isOverridden={travelOverridden} summary={travelTimeActive ? `${travelOut}+${travelBack}m` : null} onTap={() => toggleExtra('travel')}/>}
                        <ExtraChip label="Per diem" isSet={perDiemActive} isOverridden={perDiemOverridden} summary={perDiemActive ? fmtGBP(Number(dayRecord.perDiemAmount) || 0) : null} onTap={() => toggleExtra('perDiem')}/>
                        <ExtraChip label="Expenses" isSet={expensesActive} isOverridden={expensesOverridden} summary={expensesActive ? fmtGBP(expensesTotal) : null} onTap={() => toggleExtra('expenses')}/>
                        {show2ndBreakChip && (() => {
                          const logged = !!dayRecord.secondBreakLogged;
                          const sbMins = Number(dayRecord.secondBreakDurationMins) || 0;
                          const summary = !logged
                            ? null
                            : sbMins > 0
                              ? (sbMins >= 60 ? `${Math.floor(sbMins / 60)}h${sbMins % 60 ? ` ${sbMins % 60}m` : ''}` : `${sbMins}m`)
                              : 'Missed';
                          return <ExtraChip label="2nd break" isSet={logged} summary={summary} onTap={() => toggleExtra('secondBreak')}/>;
                        })()}
                        {calc?.meta?.continuousDay && !calc?.meta?.isPmpa && !isTravelDay && (() => {
                          const b1Missed = dayRecord.cwdBreak1Given === false;
                          const cwd2Req = !!calc?.meta?.cwd2Required;
                          const b2Missed = cwd2Req && dayRecord.cwdBreak2Given === false;
                          const missedCount = (b1Missed ? 1 : 0) + (b2Missed ? 1 : 0);
                          const anyMissed = missedCount > 0;
                          const summary = anyMissed
                            ? (cwd2Req ? `${missedCount}/2 missed` : 'Missed')
                            : (cwd2Req ? 'Both given' : 'Given');
                          return (
                            <button
                              type="button"
                              onClick={() => toggleExtra('cwdBreaks')}
                              className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] font-semibold transition-colors ${
                                anyMissed
                                  ? 'bg-tm-pen/[0.08] border-tm-pen/40 text-tm-pen hover:bg-tm-pen/[0.12]'
                                  : 'bg-sky-500/[0.06] border-sky-500/30 text-sky-400 hover:bg-sky-500/[0.1]'
                              }`}
                              style={{ WebkitTapHighlightColor: 'transparent' }}
                            >
                              <span>CWD breaks</span>
                              <span className="font-mono text-[10px] text-neutral-300 tabular-nums">{summary}</span>
                            </button>
                          );
                        })()}
                      </div>

                      {/* Inline expandable panels — one per expanded chip key. */}
                      {(() => {
                        const close = (key) => setExpandedExtras(prev => { const n = new Set(prev); n.delete(key); return n; });
                        const setRef = (key) => (el) => { extraRefs.current[key] = el; };
                        const resetFields = (key, ...fields) => {
                          setProduction(p => ({
                            ...p,
                            days: p.days.map(d => {
                              if (d.id !== dayRecord.id) return d;
                              const cleared = { ...d };
                              for (const f of fields) {
                                if (typeof cleared[f] === 'boolean') cleared[f] = false;
                                else if (typeof cleared[f] === 'number') cleared[f] = 0;
                                else if (Array.isArray(cleared[f])) cleared[f] = [];
                                else cleared[f] = '';
                              }
                              return cleared;
                            }),
                          }));
                        };
                        const ToggleRow = ({ label, value, onChange, ariaLabel }) => (
                          <div className="flex items-center justify-between mb-3 px-1">
                            <span className="text-sm text-neutral-300">{label}</span>
                            <Toggle value={value} onChange={onChange} ariaLabel={ariaLabel}/>
                          </div>
                        );
                        const numInput = (val, onChange, opts = {}) => (
                          <input
                            type="number"
                            min={opts.min ?? "0"}
                            step={opts.step ?? "0.01"}
                            inputMode={opts.inputMode || 'decimal'}
                            value={val ?? 0}
                            onChange={onChange}
                            className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500"
                          />
                        );
                        const resetButton = (label, onClick) => (
                          <button type="button" onClick={onClick} className="w-full mt-3 px-4 py-2.5 rounded-xl bg-fuchsia-400/10 hover:bg-fuchsia-400/15 border border-fuchsia-400/30 text-fuchsia-400 text-sm font-bold transition-colors" style={{ WebkitTapHighlightColor: 'transparent' }}>
                            {label}
                          </button>
                        );

                        const renderPanel = (key) => {
                          let title = '', body = null, resetEl = null;
                          if (key === 'preCall') {
                            title = 'Pre-call';
                            body = (
                              <div>
                                <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Pre-call time</div>
                                <input type="time" value={dayRecord.preCallTime || ''} onChange={(e) => updateField('preCallTime', e.target.value)} className="w-full min-h-[44px] bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500" style={{ WebkitAppearance: 'none' }}/>
                                <div className="text-[10px] text-neutral-500 mt-1.5 leading-relaxed">Early arrival paid at BHR. Clear the time to deactivate.</div>
                                {(() => { const pc = parseHHMM(dayRecord.preCallTime || dayRecord.truckCallTime); return pc != null && pc < 5; })() && (
                                  <div className="mt-2"><StatusMsg kind="warn"><span className="whitespace-pre-line">{PRE_CALL_PRE5_DISCLAIMER}</span></StatusMsg></div>
                                )}
                                {(dayRecord.preCallTime || dayRecord.truckCallTime) && (
                                  <button
                                    type="button"
                                    onClick={() => setProduction(p => ({ ...p, days: p.days.map(d => d.id === dayRecord.id ? { ...d, preCallTime: '', truckCallTime: '' } : d) }))}
                                    className="w-full mt-3 px-4 py-2.5 rounded-xl bg-tm-warn/10 hover:bg-tm-warn/15 border border-tm-warn/30 text-tm-warn text-sm font-bold transition-colors"
                                    style={{ WebkitTapHighlightColor: 'transparent' }}
                                  >
                                    Remove pre-call
                                  </button>
                                )}
                              </div>
                            );
                            if (preCallOverridden) resetEl = resetButton('Reset to default', () => resetFields('preCall', 'preCallTime'));
                          } else if (key === 'kit') {
                            title = 'Kit money';
                            body = (
                              <div>
                                <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Amount (£)</div>
                                {numInput(dayRecord.kitMoneyAmount, (e) => updateField('kitMoneyAmount', Number(e.target.value) || 0))}
                                <div className="text-[10px] text-neutral-500 mt-1.5 leading-relaxed">Set 0 to deactivate. Crew-level default applies when day amount is 0.</div>
                              </div>
                            );
                          } else if (key === 'perDiem') {
                            title = 'Per diem';
                            body = (
                              <div>
                                <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Amount (£)</div>
                                {numInput(dayRecord.perDiemAmount, (e) => updateField('perDiemAmount', Number(e.target.value) || 0))}
                                <div className="text-[10px] text-neutral-500 mt-1.5 leading-relaxed">Set 0 to deactivate.</div>
                              </div>
                            );
                            if (perDiemOverridden) resetEl = resetButton('Reset to default', () => resetFields('perDiem', 'perDiemAmount'));
                          } else if (key === 'mileage') {
                            const updateMulti = (patch) => setProduction(p => ({
                              ...p,
                              days: p.days.map(d => d.id === dayRecord.id ? { ...d, ...patch } : d),
                            }));
                            title = 'Mileage';
                            body = (
                              <MileageInput day={dayRecord} updateDay={updateMulti} days={production.days || []}/>
                            );
                            if (mileageOverridden) resetEl = resetButton('Reset to default', () => resetFields('mileage', 'miles', 'mileagePostcode', 'mileageMethod', 'mileageRoundTrip'));
                          } else if (key === 'travel') {
                            title = 'Travel time';
                            body = (
                              <>
                                <div className="grid grid-cols-2 gap-3">
                                  <div>
                                    <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Out (mins)</div>
                                    {numInput(dayRecord.travelOutMins, (e) => updateField('travelOutMins', Number(e.target.value) || 0), { step: '1', inputMode: 'numeric' })}
                                  </div>
                                  <div>
                                    <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Back (mins)</div>
                                    {numInput(dayRecord.travelBackMins, (e) => updateField('travelBackMins', Number(e.target.value) || 0), { step: '1', inputMode: 'numeric' })}
                                  </div>
                                </div>
                                <div className="text-[10px] text-neutral-500 mt-1.5 leading-relaxed">Set both to 0 to deactivate.</div>
                              </>
                            );
                            if (travelOverridden) resetEl = resetButton('Reset to default', () => resetFields('travel', 'travelOutMins', 'travelBackMins'));
                          } else if (key === 'stepUp') {
                            title = 'Step-up';
                            body = (
                              <div className="space-y-3">
                                <div>
                                  <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Role</div>
                                  <select
                                    value={dayRecord.stepUpRole || ''}
                                    onChange={(e) => {
                                      const role = e.target.value;
                                      const d = ROLE_DEFAULTS[role] || {};
                                      setProduction(p => ({
                                        ...p,
                                        days: p.days.map(rec => rec.id === dayRecord.id ? {
                                          ...rec,
                                          stepUpRole: role,
                                          stepUpBDR: role ? (d.bdr ?? rec.stepUpBDR) : 0,
                                          stepUpOTCoef: role ? (d.otCoef ?? rec.stepUpOTCoef) : 1,
                                          stepUpOTRate: role ? (d.otRate ?? null) : null,
                                        } : rec)
                                      }));
                                    }}
                                    className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base text-neutral-100 focus:outline-none focus:border-sky-500"
                                  >
                                    <option value="">— None (not stepped up) —</option>
                                    {Object.entries(DEPARTMENTS).map(([dept, roles]) => (
                                      <optgroup key={dept} label={dept}>
                                        {Object.keys(roles).map(r => <option key={r} value={r}>{r}</option>)}
                                      </optgroup>
                                    ))}
                                  </select>
                                </div>
                                {dayRecord.stepUpRole && (
                                  <div className="grid grid-cols-2 gap-3">
                                    <div>
                                      <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Step-up BDR (£)</div>
                                      {numInput(dayRecord.stepUpBDR, (e) => updateField('stepUpBDR', Number(e.target.value) || 0))}
                                    </div>
                                    <div>
                                      <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Step-up OT</div>
                                      <select
                                        value={String(dayRecord.stepUpOTCoef ?? 1)}
                                        onChange={(e) => updateField('stepUpOTCoef', Number(e.target.value))}
                                        className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500"
                                      >
                                        <option value="1">1×</option>
                                        <option value="1.25">1.25×</option>
                                        <option value="1.5">1.5×</option>
                                      </select>
                                    </div>
                                  </div>
                                )}
                                {dayRecord.stepUpRole && (
                                  <button
                                    type="button"
                                    onClick={() => setProduction(p => ({ ...p, days: p.days.map(d => d.id === dayRecord.id ? { ...d, stepUpRole: '', stepUpBDR: 0, stepUpOTCoef: 1, stepUpOTRate: null } : d) }))}
                                    className="w-full px-4 py-2.5 rounded-xl bg-tm-warn/10 hover:bg-tm-warn/15 border border-tm-warn/30 text-tm-warn text-sm font-bold transition-colors"
                                    style={{ WebkitTapHighlightColor: 'transparent' }}
                                  >
                                    Remove step-up
                                  </button>
                                )}
                              </div>
                            );
                          } else if (key === 'expenses') {
                            const expenses = dayRecord.expenses || [];
                            const addExpense = () => setProduction(p => ({
                              ...p,
                              days: p.days.map(d => d.id === dayRecord.id ? {
                                ...d,
                                expenses: [...(d.expenses || []), { id: uid(), amount: 0, category: 'Other', description: '' }],
                              } : d),
                            }));
                            const updateExp = (expId, patch) => setProduction(p => ({
                              ...p,
                              days: p.days.map(d => d.id === dayRecord.id ? { ...d, expenses: (d.expenses || []).map(x => x.id === expId ? { ...x, ...patch } : x) } : d),
                            }));
                            const removeExp = (expId) => setProduction(p => ({
                              ...p,
                              days: p.days.map(d => d.id === dayRecord.id ? { ...d, expenses: (d.expenses || []).filter(x => x.id !== expId) } : d),
                            }));
                            title = 'Expenses';
                            body = (
                              <>
                                <button type="button" onClick={addExpense} className="text-[10px] uppercase tracking-wide text-sky-500 hover:text-sky-300 font-bold flex items-center gap-1 mb-3" style={{ WebkitTapHighlightColor: 'transparent' }}>
                                  <IPlus size={11}/>Add expense
                                </button>
                                {expenses.length === 0 ? (
                                  <div className="text-[11px] text-neutral-500 italic">No expenses yet — tap Add expense.</div>
                                ) : (
                                  <div className="space-y-2">
                                    {expenses.map(exp => (
                                      <div key={exp.id} className="flex flex-wrap items-center gap-2">
                                        <select value={exp.category} onChange={(e) => updateExp(exp.id, { category: e.target.value })} className="bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-2 text-sm text-neutral-100 focus:outline-none focus:border-sky-500" style={{ width: 116 }}>
                                          {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <input type="number" min="0" step="0.01" inputMode="decimal" value={exp.amount} onChange={(e) => updateExp(exp.id, { amount: Number(e.target.value) || 0 })} placeholder="0.00" className="bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-2 text-sm font-mono text-neutral-100 focus:outline-none focus:border-sky-500" style={{ width: 84 }}/>
                                        <input type="text" value={exp.description} onChange={(e) => updateExp(exp.id, { description: e.target.value })} placeholder="Description" className="flex-1 min-w-[80px] bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-2 text-sm text-neutral-100 focus:outline-none focus:border-sky-500"/>
                                        <button type="button" onClick={() => removeExp(exp.id)} className="text-neutral-600 hover:text-tm-pen transition-colors p-1" aria-label="Remove expense" style={{ WebkitTapHighlightColor: 'transparent' }}><IX size={14}/></button>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </>
                            );
                            if (expensesOverridden) resetEl = resetButton('Reset to default', () => resetFields('expenses', 'expenses'));
                          } else if (key === 'secondBreak') {
                            title = '2nd break';
                            body = (
                              <div className="space-y-3">
                                <div>
                                  <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Start</div>
                                  <input type="time" value={dayRecord.secondBreakStartTime || ''} onChange={(e) => updateField('secondBreakStartTime', e.target.value)} disabled={Number(dayRecord.secondBreakDurationMins) === 0} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500 disabled:opacity-50" style={{ WebkitAppearance: 'none' }}/>
                                </div>
                                <div>
                                  <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Duration</div>
                                  <select value={Number(dayRecord.secondBreakDurationMins ?? 30)} onChange={(e) => updateField('secondBreakDurationMins', Number(e.target.value))} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base text-neutral-100 focus:outline-none focus:border-sky-500">
                                    {SECOND_BREAK_DURATIONS.map(s => <option key={s.v} value={s.v}>{s.label}</option>)}
                                  </select>
                                </div>
                              </div>
                            );
                          } else if (key === 'cwdBreaks') {
                            const cwd2Req = !!calc?.meta?.cwd2Required;
                            title = 'CWD breaks';
                            body = (
                              <div className="space-y-3">
                                <div className="text-[11px] text-neutral-400 leading-tight">
                                  APA §6.4: CWD requires a 30m break by {toHHMM(calc.meta.cwd1Deadline)} (9h after call){cwd2Req ? `, and another by ${toHHMM(calc.meta.cwd2Deadline)} (12.5h after call)` : ''}. Missed = 30m × BHR penalty.
                                </div>
                                <ToggleRow label={`Break 1 — by ${toHHMM(calc.meta.cwd1Deadline)}`} value={dayRecord.cwdBreak1Given !== false} onChange={(val) => updateField('cwdBreak1Given', val)} ariaLabel="CWD break 1 given"/>
                                {cwd2Req && (
                                  <ToggleRow label={`Break 2 — by ${toHHMM(calc.meta.cwd2Deadline)}`} value={dayRecord.cwdBreak2Given !== false} onChange={(val) => updateField('cwdBreak2Given', val)} ariaLabel="CWD break 2 given"/>
                                )}
                              </div>
                            );
                          }
                          return (
                            <div ref={setRef(key)}>
                              <SectionCard title={title} variant="condition" onClose={() => close(key)}>
                                {body}
                                {resetEl}
                              </SectionCard>
                            </div>
                          );
                        };

                        return Array.from(expandedExtras).map(key => <React.Fragment key={key}>{renderPanel(key)}</React.Fragment>);
                      })()}
                    </>
                  );
                })()}

                <div className="flex items-center gap-2 mt-6 mb-3">
                  <span className="text-[10px] uppercase tracking-[0.22em] text-sky-500 font-bold">CONDITIONS</span>
                  <span className="flex-1 h-px bg-neutral-800/60"/>
                </div>
                <ConditionsDisplay dayRecord={dayRecord} calc={calc} />

                <div className="flex items-center gap-2 mt-6 mb-3">
                  <span className="text-[10px] uppercase tracking-[0.22em] text-sky-500 font-bold">NOTES</span>
                  <span className="flex-1 h-px bg-neutral-800/60"/>
                  {!(dayRecord.note && dayRecord.note.trim()) && (
                    <button
                      type="button"
                      onClick={() => setEditingNote(true)}
                      className="text-[10px] uppercase tracking-wider font-bold text-sky-500"
                      style={{ WebkitTapHighlightColor: 'transparent' }}
                    >
                      ADD
                    </button>
                  )}
                </div>
                <button
                  type="button"
                  onClick={() => setEditingNote(true)}
                  className="w-full text-left bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-3 text-sm leading-relaxed hover:border-neutral-700 transition-colors"
                  style={{ WebkitTapHighlightColor: 'transparent' }}
                >
                  {dayRecord.note && dayRecord.note.trim()
                    ? <span className="text-neutral-300 italic">{dayRecord.note}</span>
                    : <span className="text-neutral-500">Tap to add notes</span>}
                </button>
              </>
            )}
          </div>

          {showLunchEdit && dayRecord && (
            <div
              className="fixed inset-0 z-50 flex items-end"
              onClick={() => setShowLunchEdit(false)}
              style={{ background: 'rgba(0,0,0,0.5)' }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full bg-neutral-900 border-t border-neutral-800 rounded-t-2xl px-5 pt-5"
                style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 16px)' }}
              >
                <div className="w-9 h-1 bg-neutral-700 rounded-full mx-auto mt-0 mb-3"/>
                <div className="text-sm font-bold text-neutral-100 mb-3">{crewMember.name || 'Crew'}'s lunch</div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Start</div>
                    <input
                      type="time"
                      value={resolvedDay?.lunchStartTime ?? ''}
                      onChange={(e) => updateTimeField('lunchStartTime', e.target.value)}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500"
                      style={{ WebkitAppearance: 'none' }}
                    />
                  </div>
                  <div>
                    <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold mb-1.5">Duration (mins)</div>
                    <input
                      type="number"
                      min="0"
                      step="15"
                      value={resolvedDay?.lunchDurationMins ?? 0}
                      onChange={(e) => updateTimeField('lunchDurationMins', Number(e.target.value) || 0)}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-base font-mono text-neutral-100 focus:outline-none focus:border-sky-500"
                    />
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => setShowLunchEdit(false)}
                  className="w-full mt-4 px-4 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-black text-sm font-bold transition-colors"
                  style={{ WebkitTapHighlightColor: 'transparent', boxShadow: '0 4px 16px rgba(14,165,233,0.25)' }}
                >
                  Done
                </button>
              </div>
            </div>
          )}

          {showCrewActions && (
            <CrewActionSheet
              crewMember={crewMember}
              mode="drilldown"
              canRemove={!!dayRecord && dayRecord.dayType !== 'Rest Day'}
              onClose={() => setShowCrewActions(false)}
              onSavePDF={() => onTriggerCrewTimesheet?.(crewMember)}
              onSendText={async () => {
                const memberDays = (production.days || []).filter(d => d.crewId === crewMember.id);
                const text = generateCrewText(crewMember, memberDays, production);
                const r = await shareTextOrCopy(text, `${crewMember.name || 'Crew'} Timesheet`);
                if ((r === 'copied' || r === 'prompted') && typeof showToast === 'function') showToast('Copied to clipboard');
              }}
              onSetEmail={(email) => setProduction(p => ({
                ...p,
                crew: (p.crew || []).map(c => c.id === crewMember.id ? { ...c, email } : c)
              }))}
              onEditCrew={() => setShowEditCrew(true)}
              onRemoveFromDay={() => {
                if (!dayRecord) return;
                setProduction(p => ({
                  ...p,
                  days: p.days.map(d => d.id === dayRecord.id ? { ...d, dayType: 'Rest Day' } : d)
                }));
              }}
            />
          )}

          {showEditCrew && (
            <QuickAddCrewSheet
              crewMember={crewMember}
              onClose={() => setShowEditCrew(false)}
              onSubmit={(updated) => {
                setProduction(p => ({
                  ...p,
                  crew: (p.crew || []).map(c => c.id === updated.id ? updated : c)
                }));
                setShowEditCrew(false);
              }}
            />
          )}

          {editingNote && dayRecord && (
            <div
              className="fixed inset-0 z-50 flex items-end"
              onClick={() => setEditingNote(false)}
              style={{ background: 'rgba(0,0,0,0.5)' }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full bg-neutral-900 border-t border-neutral-800 rounded-t-2xl px-5 pt-5"
                style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 16px)' }}
              >
                <div className="w-9 h-1 bg-neutral-700 rounded-full mx-auto mt-0 mb-3"/>
                <div className="text-base font-bold text-neutral-100 mb-3">{crewMember.name || 'Crew'}'s notes</div>
                <textarea
                  autoFocus
                  value={dayRecord.note || ''}
                  onChange={(e) => updateField('note', e.target.value)}
                  placeholder="Anything worth recording for this day…"
                  rows={4}
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2.5 text-sm text-neutral-100 placeholder-neutral-500 leading-relaxed focus:outline-none focus:border-sky-500 resize-none font-mono"
                />
                <button
                  type="button"
                  onClick={() => setEditingNote(false)}
                  className="w-full mt-4 px-4 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-black text-sm font-bold transition-colors"
                  style={{ WebkitTapHighlightColor: 'transparent', boxShadow: '0 4px 16px rgba(14,165,233,0.25)' }}
                >
                  Done
                </button>
              </div>
            </div>
          )}
        </div>
      );
