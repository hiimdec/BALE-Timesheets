            </SectionCard>

            <SectionCard title="My Setup">
              <Field label="Display name" hint="Appears on exported PDFs">
                <Input
                  type="text"
                  placeholder="Your name"
                  value={userPrefs.displayName}
                  onChange={(e) => set({ displayName: e.target.value })}
                />
              </Field>
              <Field label="Default department">
                <Select value={userPrefs.defaultDepartment} onChange={(e) => onDeptChange(e.target.value)}>
                  <option value="">— none —</option>
                  {Object.keys(DEPARTMENTS).map(d => <option key={d} value={d}>{d}</option>)}
                </Select>
              </Field>
              {userPrefs.defaultDepartment && deptRoles.length > 0 && (
                <Field label="Default role">
                  <Select value={userPrefs.defaultRole} onChange={(e) => onRoleChange(e.target.value)}>
                    {deptRoles.map(r => <option key={r} value={r}>{r}</option>)}
                  </Select>
                </Field>
              )}
              {userPrefs.defaultRole && (
                <Field label="Default BDR (£)" hint="Auto-filled from role; adjust if needed">
                  <Input
                    type="number"
                    min="0"
                    step="0.01"
                    value={userPrefs.defaultBDR}
                    onChange={(e) => set({ defaultBDR: Number(e.target.value) })}
                  />
                </Field>
              )}
            </SectionCard>

            <Disclosure label="Tax & Invoicing" summary={vatSummary}>
              <div className="flex items-center justify-between gap-3">
                <span className="text-[10px] uppercase tracking-wide text-sky-500 font-bold">VAT registered?</span>
                <Toggle value={userPrefs.vatRegistered} onChange={(v) => set({ vatRegistered: v })} ariaLabel="VAT registered" />
              </div>
              {userPrefs.vatRegistered && (
                <Field label="VAT rate (%)" hint="Usually 20%">
                  <Input
                    type="number"
                    min="0"
                    max="100"
                    step="1"
                    inputMode="numeric"
                    value={userPrefs.vatRate}

              {userPrefs.vatRegistered && (

            <Disclosure label="Invoicing — Your details" summary={yourDetailsSummary}>

              <Field label="Your address">
                <textarea

                  onChange={(e) => set({ fromAddress: e.target.value })}

                  placeholder={"e.g.\n12 Crew Lane\nLondon NW1 8AB"}
                  className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-2.5 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/40 resize-none font-mono"

                  placeholder="00-00-00" />
              </Field>
              <Field label="IBAN" hint="Optional — for international payments">
                <Input type="text" value={userPrefs.bankIBAN} onChange={(e) => set({ bankIBAN: e.target.value })} placeholder="GB00 BARC 0000 0000 0000 00" />

    /* ═══════════════════════════ STATS SCREEN ═══════════════════════════ */

    function StatsScreen({ productions, userPrefs, onClose, onOpenSettings }) {
      const [filter, setFilter] = useState('all');
      const [expandedStat, setExpandedStat] = useState(null);
      const [showAllMonths, setShowAllMonths] = useState(false);

      const displayName = (userPrefs?.displayName || "").trim();

      const toggleExpand = (key) => { setExpandedStat(prev => prev === key ? null : key); setShowAllMonths(false); };
      const fmtMonth = (yyyymm) => new Date(yyyymm + '-01T12:00:00').toLocaleString('en-GB', { month: 'long', year: 'numeric' });

      const { enrichedDays, excludedCount } = useMemo(() => {
        const now = new Date();
        const today = now.toISOString().slice(0, 10);
        let startISO, endISO;
        if (filter === 'taxyear') {
          const yr = (now.getMonth() < 3 || (now.getMonth() === 3 && now.getDate() < 6)) ? now.getFullYear() - 1 : now.getFullYear();
          startISO = `${yr}-04-06`; endISO = `${yr + 1}-04-05`;
        } else if (filter === 'ytd') {
          startISO = `${now.getFullYear()}-01-01`; endISO = today;
        }
        const days = [];
        let excluded = 0;
        for (const p of productions) {
          const userCrewIds = userCrewIdsInProduction(p, userPrefs);
          if (userCrewIds.length === 0) {
            const hasDaysInRange = filter === 'all'
              ? (p.days || []).length > 0
              : (p.days || []).some(d => d.date >= startISO && d.date <= endISO);
            if (hasDaysInRange) excluded++;
            continue;
          }
          const pDays = filter === 'all'
            ? (p.days || []).filter(d => userCrewIds.includes(d.crewId))
            : (p.days || []).filter(d => d.date >= startISO && d.date <= endISO && userCrewIds.includes(d.crewId));
          for (const day of pDays) {
            const crew = (p.crew || []).find(c => c.id === day.crewId);
            if (!crew) continue;
            try {
              const resolved = resolveDay(p, day, crew);
              const calc = calcForDisplay(p, day, crew, findPrevDay(p.days || [], day));
              days.push({ day, resolved, production: p, crew, calc });
            } catch {}
          }
        }
        return { enrichedDays: days, excludedCount: excluded };
      }, [productions, filter, userPrefs]);

      const stats = useMemo(() => {
        if (enrichedDays.length === 0) return null;
        const totalEarnings = enrichedDays.reduce((s, e) => s + e.calc.total, 0);
        // Use RESOLVED times (call/wrap can cascade from dayDefaults — the raw
        // day record may have them undefined), so cascade-inheriting days still
        // count as worked and avgDayEarnings isn't divided by too few days.
        const workingDaysSet = new Set(enrichedDays.filter(e => e.resolved.callTime || e.resolved.wrapTime).map(e => `${e.production.id}:${e.day.date}`));
        const shootDaysSet = new Set(enrichedDays.filter(e => e.calc.meta.dayType === 'Shoot').map(e => `${e.production.id}:${e.day.date}`));
        const totalHours = enrichedDays.reduce((s, e) => s + (e.calc.meta.workedHrs || 0), 0);
        const productionsWorkedCount = new Set(enrichedDays.map(e => e.production.id)).size;

        const workingDates = [...new Set(
          enrichedDays.filter(e => e.calc.meta.dayType !== 'Rest Day' && (e.resolved.callTime || e.resolved.wrapTime)).map(e => e.day.date)
        )].sort();
        let longestStreak = workingDates.length > 0 ? 1 : 0, curStreak = longestStreak;
        for (let i = 1; i < workingDates.length; i++) {
          const diff = (new Date(workingDates[i]) - new Date(workingDates[i - 1])) / 86400000;
          if (diff === 1) { curStreak++; longestStreak = Math.max(longestStreak, curStreak); } else curStreak = 1;
        }

        const wdc = workingDaysSet.size, sdc = shootDaysSet.size;
        const avgDayEarnings = wdc > 0 ? totalEarnings / wdc : 0;
        const avgPerShoot = productionsWorkedCount > 0 ? totalEarnings / productionsWorkedCount : 0;
        const shootHours = enrichedDays.filter(e => e.calc.meta.dayType === 'Shoot').reduce((s, e) => s + (e.calc.meta.workedHrs || 0), 0);
        const avgShootLen = sdc > 0 ? shootHours / sdc : 0;

        const earningsByDay = {}, earningsByMonth = {}, uniqueDaysByMonth = {}, earningsByProdCo = {}, dayTypeMap = {};
        const lateLunchSet = new Set(), tocBreachSet = new Set(), nightShootSet = new Set();
        let otEarnings = 0, lateLunchEarnings = 0;

        for (const e of enrichedDays) {
          const pKey = `${e.production.id}:${e.day.date}`;
          const mo = e.day.date.slice(0, 7);
          const co = e.production.prodCo?.trim() || '(Unknown)';
          const type = e.calc.meta.dayType || 'Unknown';
          const dayEntry = earningsByDay[pKey] || { date: e.day.date, amount: 0, buckets: { basic: 0, ot: 0, pen: 0, kit: 0, extras: 0 } };
          dayEntry.amount += e.calc.total;
          earningsByDay[pKey] = dayEntry;
          earningsByMonth[mo] = (earningsByMonth[mo] || 0) + e.calc.total;
          if (!uniqueDaysByMonth[mo]) uniqueDaysByMonth[mo] = new Set();
          uniqueDaysByMonth[mo].add(pKey);
          earningsByProdCo[co] = (earningsByProdCo[co] || 0) + e.calc.total;
          if (!dayTypeMap[type]) dayTypeMap[type] = new Set();
          dayTypeMap[type].add(pKey);
          for (const l of e.calc.lines) {
            // Sum OT with the same categorizer the day breakdown uses (\bOT\b,
            // overtime, triple/double time, etc.) — the old `includes(' OT')`
            // needed a leading space and silently missed the primary "OT" /
            // "OT (2× BHR)" / "OT Triple Time" / "Early Call (OT rate)" labels,
            // zeroing Overtime Earned for every shoot with weekday OT.
            if (categorizeBreakdownLine(l.label || '') === 'ot') otEarnings += l.amount;
            if ((l.label || '').toLowerCase().startsWith('late')) lateLunchEarnings += l.amount;
            dayEntry.buckets[categorizeBreakdownLine(l.label || '')] += Number(l.amount) || 0;
          }
          const flags = penaltyFlags(e.calc);
          if (flags.hasL1) lateLunchSet.add(pKey);
          if (e.calc.lines.some(l => l.isTOC && l.isBreach)) tocBreachSet.add(pKey);
          if ((e.calc.meta.dayLabel || '').includes('Night Shoot')) nightShootSet.add(pKey);
        }

        const highestDay = Object.values(earningsByDay).reduce((best, d) => d.amount > (best?.amount || 0) ? d : best, null);
        const busiestMonthEntry = Object.entries(earningsByMonth).reduce((best, [m, a]) => a > (best?.[1] || 0) ? [m, a] : best, null);
        const topProdCoEntry = Object.entries(earningsByProdCo).reduce((best, [co, a]) => a > (best?.[1] || 0) ? [co, a] : best, null);
        const daysByType = Object.entries(dayTypeMap).map(([type, set]) => ({ type, count: set.size })).sort((a, b) => b.count - a.count);

        const now2 = new Date();
        let allMonthsInRange;
        if (filter === 'taxyear') {
          const yr = (now2.getMonth() < 3 || (now2.getMonth() === 3 && now2.getDate() < 6)) ? now2.getFullYear() - 1 : now2.getFullYear();
          allMonthsInRange = Array.from({ length: 12 }, (_, i) => new Date(yr, 3 + i, 1).toISOString().slice(0, 7)).reverse();
        } else if (filter === 'ytd') {
          allMonthsInRange = Array.from({ length: now2.getMonth() + 1 }, (_, i) => `${now2.getFullYear()}-${String(i + 1).padStart(2, '0')}`).reverse();
        } else {
          const moKeys = Object.keys(earningsByMonth).sort();
          if (moKeys.length > 0) {
            const months = [];
            let cur = new Date(moKeys[0] + '-01T12:00:00');
            const end = new Date(moKeys[moKeys.length - 1] + '-01T12:00:00');
            while (cur <= end) { months.push(cur.toISOString().slice(0, 7)); cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); }
            allMonthsInRange = months.reverse();
          } else { allMonthsInRange = []; }
        }
        const monthBreakdown = allMonthsInRange.map(mo => ({ month: mo, amount: earningsByMonth[mo] || 0, days: uniqueDaysByMonth[mo]?.size || 0 }));

        return {
          totalEarnings, workingDaysCount: wdc, shootDaysCount: sdc, totalHours, productionsWorkedCount, longestStreak,
          avgDayEarnings, avgPerShoot, avgShootLen, highestDay, daysByType, monthBreakdown, otEarnings,
          lateLunchEarnings, lateLunchCount: lateLunchSet.size, tocBreachCount: tocBreachSet.size, nightShootCount: nightShootSet.size,
          busiestMonth: busiestMonthEntry ? { key: busiestMonthEntry[0], amount: busiestMonthEntry[1] } : null,
          topProdCo: topProdCoEntry ? { name: topProdCoEntry[0], amount: topProdCoEntry[1] } : null,
        };
      }, [enrichedDays, filter]);

      const heroLabel = filter === 'all' ? 'All-time earnings' : filter === 'taxyear' ? 'Tax year earnings' : 'Year to date';

      // Highest-earning-day bucket breakdown — same colours as the Shoot Total
      // meter. Only renders non-zero buckets.
      const HighestDayBreakdown = ({ buckets }) => {
        if (!buckets) return null;
        const rows = [
          { key: 'basic',  label: 'Basic',     dot: 'bg-sky-500', text: 'text-sky-400' },
          { key: 'ot',     label: 'OT',        dot: 'bg-tm-warn', text: 'text-tm-warn' },
          { key: 'pen',    label: 'Penalties', dot: 'bg-tm-pen',  text: 'text-tm-pen' },
          { key: 'kit',    label: 'Kit',       dot: 'bg-tm-kit',  text: 'text-tm-kit' },
          { key: 'extras', label: 'Extras',    dot: 'bg-tm-good', text: 'text-tm-good' },
        ].filter(r => (buckets[r.key] || 0) > 0.005);
        if (rows.length === 0) return null;
        return (
          <div className="mt-3 pt-3 border-t border-neutral-800">
            <div className="text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-bold mb-2.5">Breakdown</div>
            <div className="space-y-1.5">
              {rows.map(r => (
                <div key={r.key} className="flex items-center gap-2 text-sm">
                  <span className={`w-2 h-2 rounded-sm flex-shrink-0 ${r.dot}`} />
                  <span className="text-neutral-300 flex-1">{r.label}</span>
                  <span className={`font-mono font-semibold tabular-nums ${r.text}`}>{fmtGBP(buckets[r.key])}</span>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const ComparisonContent = ({ amount }) => (
        <div className="mt-4 pt-3 border-t border-neutral-800">
          <div className="text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-bold mb-2.5">That's roughly…</div>
          <div className="space-y-1">
            {COMPARISON_ITEMS.map(item => {
              const qty = amount / item.price;
              if (qty < 0.1) return null;
              const displayQty = item.price >= 1000 ? qty.toFixed(1) : Math.round(qty).toLocaleString('en-GB');
              return (
                <div key={item.label} className="flex items-baseline gap-3">
                  <span className="flex-shrink-0 text-base" style={{ width: 22 }}>{item.emoji}</span>

          </div>
          <div className="text-[10px] text-neutral-600 mt-3 flex items-center gap-1.5 flex-wrap">
            <span>at typical London prices</span>
            <span className="text-neutral-700">·</span>
            <button
              type="button"
              onClick={e => { e.stopPropagation(); if (onOpenSettings) onOpenSettings(); }}

              edit
            </button>

        </div>
      );

      const MonthTableContent = () => {
        const visible = showAllMonths ? stats.monthBreakdown : stats.monthBreakdown.slice(0, 24);
        return (
          <div className="mt-3 pt-3 border-t border-neutral-800">
            <table className="w-full">
              <thead>
                <tr>
                  <th className="text-left text-[10px] uppercase tracking-wider text-neutral-500 pb-2 font-normal">Month</th>
                  <th className="text-right text-[10px] uppercase tracking-wider text-neutral-500 pb-2 font-normal">Earnings</th>
                  <th className="text-right text-[10px] uppercase tracking-wider text-neutral-500 pb-2 font-normal">Days</th>
                </tr>
              </thead>
              <tbody>
                {visible.map(({ month, amount, days }) => (
                  <tr key={month}>
                    <td className="py-1.5 text-sm text-neutral-300">{fmtMonth(month)}</td>
                    <td className="py-1.5 text-sm font-mono text-right text-neutral-200">{amount > 0 ? fmtGBP(amount) : '—'}</td>

      const SectionHdr = ({ children }) => (
        <div className="text-[10px] uppercase tracking-[0.22em] text-sky-500 font-bold mt-8 mb-3 flex items-center gap-2">

      const StatCard = ({ label, value, sub, icon }) => (

          <div className="text-2xl font-bold font-mono text-neutral-100 tabular-nums">{value}</div>
          {sub && <div className="text-xs text-neutral-500 mt-1">{sub}</div>}

      const TappableCard = ({ label, value, sub, statKey, children }) => {
        const expanded = expandedStat === statKey;
        return (
          <div onClick={() => toggleExpand(statKey)}
            className="bg-neutral-900 border border-neutral-800 rounded-xl p-4 cursor-pointer select-none transition-colors hover:border-neutral-700"
            style={{ WebkitTapHighlightColor: 'transparent' }}>
            <div className="flex items-start justify-between gap-2">
              <div className="text-[10px] uppercase tracking-[0.15em] text-neutral-500 mb-2">{label}</div>
              <IDown size={13} className="text-neutral-600 flex-shrink-0 mt-0.5"

      };

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <div className="border-b border-sky-500 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
              <button onClick={onClose} className="text-neutral-400 hover:text-sky-500 transition-colors p-1 -ml-1" aria-label="Back">
                <IArrowLeft size={16}/>
              </button>
              <h1 className="font-bold text-sm uppercase tracking-wide">Stats</h1>
            </div>
            <div className="max-w-2xl mx-auto px-4 pb-3">
              <div className="flex gap-1.5 overflow-x-auto pb-1" style={{ scrollbarWidth: 'none' }}>
                {[['all', 'All time'], ['taxyear', 'Tax year'], ['ytd', 'Year to date']].map(([k, l]) => {
                  const active = filter === k;
                  return (
                    <button key={k} onClick={() => { setFilter(k); setExpandedStat(null); setShowAllMonths(false); }}
                      className={`inline-flex items-baseline gap-1 px-3 py-1.5 rounded-full text-[11px] font-bold tracking-wider whitespace-nowrap border transition-colors ${active ? 'bg-sky-500/10 border-sky-500/30 text-sky-400' : 'bg-tm-card-2 border-neutral-700 text-neutral-400'}`}
                      style={{ WebkitTapHighlightColor: 'transparent' }}>
                      {l}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="max-w-2xl mx-auto px-4 pt-4 pb-32">
            {!displayName ? (
              <div className="py-20 text-center">
                <div className="flex justify-center mb-4 text-neutral-700"><IStats size={48}/></div>
                <h3 className="text-xl font-semibold mb-2">Set your name to see your stats</h3>
                <p className="text-sm text-neutral-400 max-w-xs mx-auto mb-6">Stats track your own work by matching crew member names. Add your name in Settings to get started.</p>
                {onOpenSettings && (
                  <button onClick={onOpenSettings} className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-sm font-semibold text-neutral-200 transition-colors">
                    <IGear size={14}/>Settings
                  </button>
                )}
              </div>
            ) : enrichedDays.length === 0 ? (
              <div className="py-20 text-center">
                <div className="flex justify-center mb-4 text-neutral-700"><IStats size={48}/></div>
                <h3 className="text-xl font-semibold mb-2">No data yet for '{displayName}'</h3>
                <p className="text-sm text-neutral-400 max-w-xs mx-auto">Make sure crew members in your productions have your name to be counted in stats.</p>
              </div>
            ) : (
              <>
                <div className="mt-2">
                  <div
                    onClick={() => toggleExpand('hero')}
                    className="bg-neutral-900 border border-neutral-800 rounded-xl px-5 py-5 cursor-pointer select-none transition-colors hover:border-neutral-700"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <div className="flex items-start justify-between gap-2 mb-2">
                      <div className="text-[10px] uppercase tracking-[0.18em] text-sky-500 font-bold">{heroLabel}</div>
                      <IDown size={14} className="text-neutral-600 flex-shrink-0 mt-0.5"
                        style={{ transform: expandedStat === 'hero' ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s ease' }}/>
                    </div>
                    <div className="text-[40px] leading-none font-bold font-mono text-neutral-100 tabular-nums tracking-tight">
                      {fmtGBP(stats.totalEarnings)}
                    </div>
                    <div style={{ overflow: 'hidden', maxHeight: expandedStat === 'hero' ? 1600 : 0, transition: 'max-height 0.3s ease' }}>
                      {filter === 'all' ? <MonthTableContent /> : <ComparisonContent amount={stats.totalEarnings} />}
                    </div>
                  </div>
                </div>

                <SectionHdr>Activity</SectionHdr>
                <div className="grid grid-cols-2 gap-3">
                  <StatCard label="Working days" value={stats.workingDaysCount}/>
                  <StatCard label="Shoot days" value={stats.shootDaysCount}/>
                  <StatCard label="Total hours" value={stats.totalHours.toFixed(1) + 'h'}/>
                  <StatCard label="Productions" value={stats.productionsWorkedCount}/>
                  <StatCard icon="🔥" label="Longest streak" value={`${stats.longestStreak} day${stats.longestStreak !== 1 ? 's' : ''}`} sub="consecutive working days"/>
                </div>

                <SectionHdr>Averages</SectionHdr>
                <div className="grid grid-cols-2 gap-3">
                  <StatCard label="Avg day earnings" value={fmtGBP(stats.avgDayEarnings)}/>
                  <StatCard label="Avg per shoot" value={fmtGBP(stats.avgPerShoot)}/>
                  <StatCard label="Avg shoot day" value={`${stats.avgShootLen.toFixed(1)}h`} sub="worked hours"/>
                </div>

                <SectionHdr>Highlights</SectionHdr>
                <div className="space-y-3">
                  {stats.highestDay && (
                    <TappableCard label="Highest earning day" value={fmtGBP(stats.highestDay.amount)} sub={stats.highestDay.date} statKey="highest">
                      <HighestDayBreakdown buckets={stats.highestDay.buckets}/>
                      <ComparisonContent amount={stats.highestDay.amount}/>
                    </TappableCard>
                  )}
                  {stats.busiestMonth && (
                    <StatCard label="Busiest month" value={fmtGBP(stats.busiestMonth.amount)} sub={fmtMonth(stats.busiestMonth.key)}/>
                  )}
                  {stats.topProdCo && (
                    <StatCard label="Top production co." value={fmtGBP(stats.topProdCo.amount)} sub={stats.topProdCo.name}/>
                  )}
                </div>

                <SectionHdr>Earnings breakdown</SectionHdr>
                <div className="grid grid-cols-2 gap-3">
                  <StatCard label="Overtime earned" value={fmtGBP(stats.otEarnings)}/>
                  <StatCard label="Late lunch earned" value={fmtGBP(stats.lateLunchEarnings)}/>
                  <StatCard label="Late lunches" value={stats.lateLunchCount}/>
                  <StatCard label="TOC breaches" value={stats.tocBreachCount}/>
                  <StatCard label="Night shoots" value={stats.nightShootCount}/>
                </div>

                {stats.daysByType.length > 0 && (
                  <>
                    <SectionHdr>Days by type</SectionHdr>
                    <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-4">
                      {(() => {
                        const maxCount = stats.daysByType[0]?.count || 1;
                        return stats.daysByType.map(({ type, count }) => (
                          <div key={type} className="flex items-center gap-3 py-1.5">
                            <div className="text-xs text-neutral-400 flex-shrink-0" style={{ minWidth: 72 }}>{type}</div>
                            <div className="flex-1">
                              <div className="bg-sky-500/25 rounded-full h-2" style={{ width: `${Math.max(2, (count / maxCount) * 100)}%` }}/>
                            </div>
                            <div className="text-xs font-mono text-neutral-300 flex-shrink-0 text-right" style={{ minWidth: 28 }}>{count}</div>
                          </div>
                        ));
                      })()}
                    </div>
                  </>
                )}

                {excludedCount > 0 && (
                  <div className="mt-8 bg-sky-500/[0.04] border border-sky-500/25 rounded-xl p-4">
                    <div className="text-xs font-semibold text-sky-400 mb-1">
                      {excludedCount} production{excludedCount !== 1 ? 's' : ''} excluded
                    </div>
                    <p className="text-xs text-neutral-400 leading-relaxed">
                      {excludedCount} production{excludedCount !== 1 ? 's don\'t' : ' doesn\'t'} include a crew member matching '{displayName}'. {excludedCount !== 1 ? 'They are' : 'It is'} excluded from stats.
                      Check for typos in crew names.
                    </p>
                    <button onClick={onClose} className="mt-3 text-xs text-sky-400 hover:text-sky-300 transition-colors underline underline-offset-2">
                      Back to productions
                    </button>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ INVOICE COMPONENTS ═══════════════════════════ */

    function getLineTotal(item) {
      if (item.discountedQty !== null) {
        if (item.rate !== null) return item.discountedQty * item.rate;
        return 0; // null-rate line with any discountedQty = fully waived
      }
      // item.amount carries the line's total honouring the shoot's rounding
      // mode: per-day summed for auto-generated lines (buildInvoiceLineItems),
      // and qty×rate for manually-edited lines (kept in sync by LineEditModal).
      // Recomputing qty×rate here would drop favourable rounding and split the
      // total from the notes/day totals, so use the stored amount.
      return item.amount;
    }

    function invoiceSubtotal(lineItems) {
      return (lineItems || []).reduce((sum, item) => sum + getLineTotal(item), 0);
    }

    // Single VAT definition for every invoice surface (PDF, screen, email, list
    // cards). Number() normalises a stringy vatRate; numerically identical to the
    // inline `subtotal * (vatRate || 20) / 100` forms it replaces.
    function invoiceVAT(invoice, subtotal) {
      const vatAmount = invoice?.vatRegistered ? subtotal * (Number(invoice.vatRate) || 20) / 100 : 0;
      return { vatAmount, total: subtotal + vatAmount };
    }

    function getDisplayStatus(invoice) {
      if (invoice.status === "paid") return { label: "PAID", variant: "paid" };
      if (invoice.status === "sent") {
        if (invoice.dueDate) {
          const todayMs = new Date(todayISO() + "T12:00:00").getTime();
          const dueMs  = new Date(invoice.dueDate + "T12:00:00").getTime();
          const daysOver = Math.floor((todayMs - dueMs) / 86400000);
          if (daysOver > 0) return { label: `OVERDUE ${daysOver}d`, variant: "overdue" };
        }
        return { label: "SENT", variant: "sent" };
      }
      return { label: "DRAFT", variant: "draft" };
    }

    function getProductionInvoiceStatus(production) {
      const invoices = production.invoices || [];
      if (invoices.length === 0) return null;
      const todayMs = new Date(todayISO() + 'T12:00:00').getTime();
      let mostOverdueDays = 0, sentCount = 0, draftCount = 0, paidCount = 0;
      for (const inv of invoices) {
        if (inv.status === 'paid') { paidCount++; }
        else if (inv.status === 'sent') {
          sentCount++;
          if (inv.dueDate) {
            const overdueDays = Math.floor((todayMs - new Date(inv.dueDate + 'T12:00:00').getTime()) / 86400000);
            if (overdueDays > mostOverdueDays) mostOverdueDays = overdueDays;
          }
        } else { draftCount++; }
      }
      if (mostOverdueDays > 0) return { label: `OVERDUE ${mostOverdueDays}d`, variant: 'overdue' };
      if (sentCount > 0)       return { label: sentCount > 1 ? `${sentCount} SENT` : 'SENT', variant: 'sent' };
      if (draftCount > 0)      return { label: draftCount > 1 ? `${draftCount} DRAFT` : 'DRAFT', variant: 'draft' };
      if (paidCount > 0)       return { label: paidCount > 1 ? `${paidCount} PAID` : 'PAID', variant: 'paid' };
      return null;
    }

    function DiscountModal({ item, onSave, onClose }) {
      useEscape(onClose);
      const isFixed = item.rate === null; // fixed-amount line (penalty, expense, kit money, etc.)
      const [dqty, setDqty] = React.useState(
        !isFixed && item.discountedQty !== null ? String(item.discountedQty) : String(item.qty)
      );
      const parsedQty = parseFloat(dqty) || 0;
      // Use the stored line amount (what the invoice actually bills, incl.
      // Favourable rounding) so "Full amt"/"saving" match the invoiced line.
      // Recomputing qty×rate here would disagree with the line's Amount column.
      const originalAmount = Number(item.amount) || 0;
      const discountedAmount = isFixed ? 0 : parsedQty * item.rate;
      const saving = originalAmount - discountedAmount;
      const isAlreadyWaived = isFixed && item.discountedQty !== null;
      return (
        <div className="fixed inset-0 flex items-center justify-center" style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 80 }} onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-xl shadow-2xl border border-neutral-700 mx-4 overflow-hidden" style={{ maxWidth: 400 }} onClick={e => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-3 flex items-center justify-between">
              <div className="text-sm font-bold text-neutral-100">{isFixed ? "Waive line" : "Waive portion"}</div>
              <button onClick={onClose} className="text-neutral-400 hover:text-neutral-200 flex items-center justify-center rounded" style={{ minWidth: 44, minHeight: 44 }}><IX size={16}/></button>
            </div>
            <div className="px-5 pb-5 space-y-4">
              <div>
                <div className="text-[11px] text-neutral-400 font-semibold">{item.label}</div>
                {item.detail && <div className="text-[10px] text-neutral-600">{item.detail}</div>}
              </div>
              {isFixed ? (
                <div className="bg-neutral-800 rounded-xl p-3 text-sm text-neutral-300 leading-relaxed">
                  This will remove the <span className="font-mono text-neutral-100">{fmtGBP(item.amount)}</span> charge from the invoice total. The line stays visible with a <span className="text-tm-warn font-semibold">Waived</span> badge.
                </div>
              ) : (
                <>
                  <div className="flex items-center gap-3 text-sm text-neutral-400 flex-wrap">
                    <div>Full qty: <span className="text-neutral-200 font-mono">{item.qty}</span></div>
                    <div>Rate: <span className="text-neutral-200 font-mono">{fmtGBP(item.rate)}</span></div>
                    <div>Full amt: <span className="text-neutral-200 font-mono">{fmtGBP(originalAmount)}</span></div>
                  </div>
                  <Field label="Units to bill" hint="Remaining units will be shown with strikethrough but won't be charged.">
                    <Input type="number" min="0" step="0.5" value={dqty} onChange={(e) => setDqty(e.target.value)} autoFocus />
                  </Field>
                  <div className="flex items-center justify-between text-sm">
                    <span className="text-neutral-400">Billed amount</span>
                    <span className="font-mono font-bold text-neutral-100">{fmtGBP(discountedAmount)}</span>
                  </div>
                  {saving > 0.005 && (
                    <div className="flex items-center justify-between text-sm">
                      <span className="text-neutral-500">Waived</span>
                      <span className="font-mono text-tm-warn">-{fmtGBP(saving)}</span>
                    </div>
                  )}
                </>
              )}
              <div className="flex gap-3 pt-1">
                <Btn variant="ghost" className="flex-1 justify-center" onClick={onClose}>Cancel</Btn>
                <Btn variant="primary" className="flex-1 justify-center"
                  onClick={() => onSave(isFixed ? 0 : parsedQty)}>
                  {isFixed ? (isAlreadyWaived ? "Re-waive" : "Waive") : "Apply"}
                </Btn>
              </div>
              {item.discountedQty !== null && (
                <button className="w-full text-center text-[11px] text-neutral-500 hover:text-neutral-300 transition-colors pt-1" onClick={() => onSave(null)}>Remove waiver</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function LineEditModal({ item, onSave, onClose }) {
      useEscape(onClose);
      const [label, setLabel] = React.useState(item.label);
      const [detail, setDetail] = React.useState(item.detail);
      const [qty, setQty] = React.useState(String(item.qty));
      const [rate, setRate] = React.useState(item.rate !== null ? String(item.rate) : "");
      const [amount, setAmount] = React.useState(String(item.amount));
      const parsedQty = parseFloat(qty) || 0;
      const parsedRate = parseFloat(rate);
      const hasRate = rate !== "" && !isNaN(parsedRate);
      const computedAmount = hasRate ? parsedQty * parsedRate : parseFloat(amount) || 0;
      const handleSave = () => onSave({
        ...item,
        label: label.trim() || item.label,
        detail: detail.trim(),
        qty: parsedQty,
        rate: hasRate ? parsedRate : null,
        amount: computedAmount,
      });
      return (
        <div className="fixed inset-0 flex items-center justify-center" style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 80 }} onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-xl shadow-2xl border border-neutral-700 mx-4 overflow-hidden" style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-3 flex items-center justify-between">
              <div className="text-sm font-bold text-neutral-100">Edit line item</div>
              <button onClick={onClose} className="text-neutral-400 hover:text-neutral-200 flex items-center justify-center rounded" style={{ minWidth: 44, minHeight: 44 }}><IX size={16}/></button>
            </div>
            <div className="px-5 pb-5 space-y-3">
              <Field label="Label">
                <Input type="text" value={label} onChange={(e) => setLabel(e.target.value)} autoFocus />
              </Field>
              <Field label="Detail" hint="e.g. date, time range">
                <Input type="text" value={detail} onChange={(e) => setDetail(e.target.value)} />
              </Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Qty">
                  <Input type="number" min="0" step="0.5" value={qty} onChange={(e) => setQty(e.target.value)} />
                </Field>
                <Field label="Rate (£)" hint="Blank = fixed amount">
                  <Input type="number" min="0" step="0.01" value={rate} onChange={(e) => setRate(e.target.value)} placeholder="—" />
                </Field>
              </div>
              <Field label="Amount (£)" hint={hasRate ? "Computed: qty × rate" : "Fixed amount"}>
                <Input
                  type="number" min="0" step="0.01"
                  value={hasRate ? computedAmount.toFixed(2) : amount}
                  onChange={(e) => { if (!hasRate) setAmount(e.target.value); }}
                  disabled={hasRate}
                  style={hasRate ? { opacity: 0.5 } : {}}
                />
              </Field>
              <div className="flex items-center justify-between text-sm border-t border-neutral-800 pt-2">
                <span className="text-neutral-400">Line total</span>
                <span className="font-mono font-bold text-neutral-100">{fmtGBP(computedAmount)}</span>
              </div>
              <div className="flex gap-3 pt-1">
                <Btn variant="ghost" className="flex-1 justify-center" onClick={onClose}>Cancel</Btn>
                <Btn variant="primary" className="flex-1 justify-center" onClick={handleSave}>Save</Btn>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function LineItemActionSheet({ item, onEdit, onDiscount, onDelete, onClose }) {
      useEscape(onClose);
      return (
        <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4" style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 80 }} onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden" style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-3">
              <div className="text-sm font-bold text-neutral-100 truncate">{item.label}</div>
              {item.detail && <div className="text-[11px] text-neutral-500 mt-0.5 truncate">{item.detail}</div>}
            </div>
            <div className="px-4 pb-4 flex flex-col gap-2">
              <button type="button" onClick={onEdit}
                className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                style={{ WebkitTapHighlightColor: 'transparent' }}>
                <IPencil size={15}/>Edit
              </button>
              <button type="button" onClick={onDiscount}
                className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                style={{ WebkitTapHighlightColor: 'transparent' }}>
                <ICalc size={15}/>{item.rate === null ? "Waive line" : "Waive portion"}
                {item.discountedQty !== null && <span className="ml-auto text-[10px] text-tm-warn font-bold uppercase tracking-wide">Active</span>}
              </button>
              <button type="button" onClick={onDelete}
                className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-tm-pen flex items-center gap-2"
                style={{ WebkitTapHighlightColor: 'transparent' }}>
                <ITrash size={15}/>Delete line
              </button>
            </div>
            <div className="px-4 pb-5 pt-1 border-t border-neutral-800">
              <button type="button" onClick={onClose}
                className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    function InvoiceEditorView({ invoiceId, production, setProduction, userPrefs, setUserPrefs, userCrewId, onBack }) {
      const invoice = (production.invoices || []).find(inv => inv.id === invoiceId);
      const [actionSheetItem, setActionSheetItem] = React.useState(null);
      const [editingItem, setEditingItem] = React.useState(null);
      const [discountingItem, setDiscountingItem] = React.useState(null);
      const [confirmDel, setConfirmDel] = React.useState(false);
      const [confirmRefresh, setConfirmRefresh] = React.useState(false);
      const [editingSentFields, setEditingSentFields] = React.useState(false);
      const [confirmEditSent, setConfirmEditSent] = React.useState(false);
      const [printTarget, setPrintTarget] = React.useState(null);
      // Native-only: tells the post-mount effect which delivery to run.
      //   'share'  → render PDF + iOS share sheet (existing print/share button)
      //   'email'  → render PDF + EmailComposer (new Send-on-native flow)
      // Captured at click time and cleared on cleanup. Web is unaffected (the
      // effect's IS_NATIVE branch never runs there).
      const printIntentRef = React.useRef('share');
      const emailCcRef = React.useRef('');
      const [showHeaderMenu, setShowHeaderMenu] = React.useState(false);
      const [notesOpen, setNotesOpen] = React.useState(!!invoice?.notes);
      // CC is persisted on the invoice (invoice.ccEmail). emailCcRef just carries
      // it into the async native print/email effect after setPrintTarget.
      const [bankOpen, setBankOpen] = React.useState(false);
      const [fromOpen, setFromOpen] = React.useState(false);
      const [toastMsg, setToastMsg] = React.useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };

      // Trigger print after InvoicePrintView mounts
      React.useEffect(() => {
        if (!printTarget) return;
        const originalTitle = document.title;
        document.title = printTarget.invoiceNumber || "Invoice";
        const timer = setTimeout(() => {
          const cleanup = () => {
            setPrintTarget(null);
            document.title = originalTitle;
          };
          if (IS_NATIVE) {
            const filename = `Invoice ${printTarget.invoiceNumber || ''}.pdf`;
            const intent = printIntentRef.current;
            if (intent === 'email') {
              const inv = printTarget;
              const subjectBase = `Invoice ${inv.invoiceNumber}`;
              const subject = inv.jobTitle ? `${subjectBase} — ${inv.jobTitle}` : subjectBase;
              const subtotal = invoiceSubtotal(inv.lineItems);
              const { vatAmount } = invoiceVAT(inv, subtotal);
              const totalStr = fmtGBP(subtotal + vatAmount);
              const fromName = inv.fromName || inv.fromCompanyName || '';
              const jobBit = inv.jobTitle ? ` for ${inv.jobTitle}` : '';
              const body = `Hi,\n\nPlease find attached invoice ${inv.invoiceNumber}${jobBit}, total ${totalStr}.\n\nPlease quote ${inv.invoiceNumber} when making payment.\n\nMany thanks,\n${fromName}`;
              const wasDraft = inv.status === 'draft';
              nativeRenderPrintViewPdfBase64Vector('invoice-print-view', INVOICE_PRINT_STYLES, { top: 10, right: 15, bottom: 10, left: 15 })
                .then((base64) => nativeSendInvoiceEmail({
                  to: inv.toEmail || '', cc: emailCcRef.current || '',
                  subject, body, base64, filename,
                }))
                .then((mode) => {
                  if (wasDraft) {
                    updateInvoice(freezeOnSend(production, inv, { status: 'sent', dateSent: todayISO() }));
                    showToast(mode === 'composer' ? 'Email composer opened — marked as sent' : 'Share sheet opened — marked as sent');
                  } else {
                    // Re-sending an already-issued invoice: re-lock so the edit-sent
                    // UX ends in the same locked state as the web path. The setter is
                    // stable (no stale-read), and it's a no-op when not in edit mode.
                    setEditingSentFields(false);
                  }
                })
                .catch((e) => { try { console.error('Invoice email failed', e); } catch (_) {} })
                .finally(() => { printIntentRef.current = 'share'; emailCcRef.current = ''; cleanup(); });
            } else {
              nativeExportPrintViewPdfVector('invoice-print-view', INVOICE_PRINT_STYLES, { top: 10, right: 15, bottom: 10, left: 15 }, filename)
                .catch((e) => { try { console.error('PDF export failed', e); } catch (_) {} })
                .finally(cleanup);
            }
          } else {
            window.addEventListener('afterprint', cleanup, { once: true });
            window.print();
            const fallback = setTimeout(cleanup, 30000);
            return () => clearTimeout(fallback);
          }
        }, 300);
        return () => clearTimeout(timer);
      }, [printTarget]);

      // Re-sync a DRAFT from the production (the single source) whenever it is
      // opened. The shared client/job fields sync UNCONDITIONALLY — editing them
      // writes through to the production (see editClientField), so there is nothing
      // to protect. Line items and notes keep their own edited-guards. Sent/paid
      // invoices early-return → frozen (their snapshot is never re-synced).
      React.useEffect(() => {
        const inv = (production.invoices || []).find(i => i.id === invoiceId);
        if (!inv || inv.status !== "draft") return;
        const userCrew = (production.crew || []).find(c => c.id === userCrewId);
        const relevantDays = userCrewId
          ? (production.days || []).filter(d => d.crewId === userCrewId)
          : (production.days || []);
        const sortedDates = relevantDays.map(d => d.date).filter(Boolean).sort();
        const updates = {
          ...clientFieldsFromProduction(production),
          // The rounding DISPLAY flag must track the re-derived line items: otherwise a
          // draft whose shoot rounding changed after creation shows favourable-rounded
          // amounts under the full Qty×Rate layout (the clean 2-column display never fires).
          roundingMode: roundingModeOf(production),
          favourableRounding: roundingFav(production),
          jobRole: userCrew?.role || inv.jobRole || "",
          shootDateStart: sortedDates[0] || "",
          shootDateEnd: sortedDates[sortedDates.length - 1] || "",
        };
        if (userCrewId && !inv.linesEdited) updates.lineItems = buildInvoiceLineItems(production, userPrefs, userCrewId);
        // Regenerate the notes snapshot so it tracks current figures and this
        // shoot's rounding mode — but only if the user hasn't hand-edited them
        // (notesEdited guards manual edits from being clobbered).
        if (userCrewId && !inv.notesEdited) updates.notes = buildDefaultNotes(production, userPrefs, userCrewId);
        setProduction(p => ({
          ...p,
          invoices: (p.invoices || []).map(i => i.id === invoiceId ? { ...i, ...updates } : i),
        }));
      }, [invoiceId]); // eslint-disable-line react-hooks/exhaustive-deps

      // Edit-sent flow: a sent/paid invoice's client/job details are LOCKED until
      // the user explicitly unlocks them. Re-lock whenever a different invoice is
      // opened, so issued records can't be changed by accident.
      React.useEffect(() => { setEditingSentFields(false); }, [invoiceId]);
      const fieldsLocked = !!invoice && invoice.status !== "draft" && !editingSentFields;

      if (!invoice) {
        return (
          <div className="min-h-screen bg-neutral-950 flex items-center justify-center text-neutral-500 text-sm">
            Invoice not found
          </div>
        );
      }

      const updateInvoice = (updates) =>
        setProduction(p => ({
          ...p,
          invoices: (p.invoices || []).map(inv => inv.id === invoiceId ? { ...inv, ...updates } : inv),
        }));

      // Edit a shared client/job field. On a DRAFT, write THROUGH to the production
      // (the single source) so project setup + sibling drafts stay in sync, and
      // also update this invoice's snapshot for immediate display. On a sent/paid
      // invoice (edit-sent mode), write ONLY to this invoice — edits stay isolated.
      const editClientField = (invKey, value) => {
        updateInvoice({ [invKey]: value });
        if (invoice && invoice.status === "draft") {
          const prodKey = INVOICE_TO_PRODUCTION_FIELD[invKey];
          if (prodKey) setProduction(p => ({ ...p, [prodKey]: value }));
        }
      };

      const updateLineItem = (itemId, updates) =>
        updateInvoice({ lineItems: invoice.lineItems.map(item => item.id === itemId ? { ...item, ...updates } : item), linesEdited: true });

      const deleteLineItem = (itemId) =>
        updateInvoice({ lineItems: invoice.lineItems.filter(item => item.id !== itemId), linesEdited: true });

      const addLineItem = () =>
        updateInvoice({ lineItems: [...invoice.lineItems, { id: uid(), label: "New item", detail: "", qty: 1, rate: null, amount: 0, discountedQty: null, isExpense: false }], linesEdited: true });

      const deleteInvoice = () => {
        setProduction(p => ({ ...p, invoices: (p.invoices || []).filter(inv => inv.id !== invoiceId) }));
        onBack();
      };

      const handleEmail = () => {
        if (IS_NATIVE) {
          // Mount the hidden invoice print view; the post-mount effect reads
          // printIntentRef === 'email' and routes to nativeSendInvoiceEmail
          // (renders PDF + opens iOS Mail composer with the PDF attached, or
          // falls back to the share sheet). Auto-mark-as-sent fires there.
          printIntentRef.current = 'email';
          emailCcRef.current = invoice.ccEmail || '';
          setPrintTarget(invoice);
          return;
        }
        const wasDraft = invoice.status === 'draft';
        openInvoiceMailto(invoice, invoice.ccEmail || '');
        if (wasDraft) {
          // Auto-mark sent. The mailto opens the user's mail client; we optimistically
          // assume they'll send. If they cancel, the header kebab has "Revert to draft".
          updateInvoice(freezeOnSend(production, invoice, { status: 'sent', dateSent: todayISO() }));
          showToast('Email opened — marked as sent');
        } else if (editingSentFields) {
          // Re-sending an edited issued invoice: re-lock — its details are re-frozen.
          setEditingSentFields(false);
          showToast('Email opened — updated details re-saved');
        }
      };

      const subtotal = invoiceSubtotal(invoice.lineItems);
      const { vatAmount, total } = invoiceVAT(invoice, subtotal);

      // Due-in-days: derived from invoiceDate + dueDate
      const issueMs = invoice.invoiceDate ? new Date(invoice.invoiceDate + "T12:00:00").getTime() : null;
      const dueMs   = invoice.dueDate     ? new Date(invoice.dueDate     + "T12:00:00").getTime() : null;
      const daysFromIssue = (issueMs && dueMs) ? Math.max(0, Math.round((dueMs - issueMs) / 86400000)) : 30;

      // Expense split helpers
      const isExpenseLine = (item) => item.isExpense || (item.label || "").startsWith("Expense:");
      const normalLines   = invoice.lineItems.filter(l => !isExpenseLine(l));
      const expenseLines  = invoice.lineItems.filter(l =>  isExpenseLine(l));
      const showIndExp    = invoice.showIndividualExpenses ?? false;

      const renderLineRow = (item, labelOverride) => {
        const lineTotal  = getLineTotal(item);
        const isWaived   = item.discountedQty !== null && item.rate === null;
        const isDisc     = item.discountedQty !== null && item.rate !== null;
        const label      = labelOverride ?? item.label;
        return (
          <div key={item.id} className="flex items-start gap-2 py-2 border-b border-neutral-800 last:border-0">
            <div className="flex-1 min-w-0">
              <div className={`text-sm font-semibold ${isWaived ? "line-through text-neutral-500" : "text-neutral-100"}`}>{label}</div>
              {item.detail && <div className="text-[11px] text-neutral-500 truncate">{item.detail}</div>}
              {!roundingFav(invoice) && item.rate !== null && (
                <div className="text-[10px] text-neutral-600 mt-0.5">
                  {isDisc
                    ? <><span className="text-tm-warn">{item.discountedQty}</span>/{item.qty} × {fmtGBP(item.rate)}</>
                    : <>{item.qty} × {fmtGBP(item.rate)}</>}
                </div>
              )}
              {isWaived && <span className="text-[10px] font-bold uppercase tracking-wide text-tm-warn">Waived</span>}
            </div>
            <div className={`text-sm font-mono font-bold flex-shrink-0 pt-0.5 ${isWaived ? "line-through text-neutral-600" : "text-neutral-100"}`}>
              {isWaived ? fmtGBP(item.amount) : fmtGBP(lineTotal)}
            </div>
            <button onClick={() => setActionSheetItem(item)}
              className="rounded-full flex items-center justify-center flex-shrink-0 transition-all active:scale-90 active:bg-neutral-500/30"
              aria-label="Line options" style={{ width: 36, height: 36, background: 'rgba(115,115,115,0.15)', color: '#a3a3a3', WebkitTapHighlightColor: 'transparent' }}>
              <IKebab size={16}/>
            </button>
          </div>
        );
      };

      const ds = getDisplayStatus(invoice);

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <Toast show={!!toastMsg}>{toastMsg}</Toast>
          <div className="border-b border-neutral-800 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
              <button onClick={onBack} className="text-neutral-400 hover:text-sky-500 transition-colors p-2 rounded-full hover:bg-neutral-800" aria-label="Back">
                <IArrowLeft size={18}/>
              </button>
              <div className="flex-1 min-w-0 font-mono text-[10px] tracking-[0.18em] uppercase text-neutral-500 font-bold truncate">
                Invoices
              </div>
              <button
                type="button"
                onClick={() => setShowHeaderMenu(true)}
                className="text-neutral-400 hover:text-neutral-200 hover:bg-neutral-800 p-2 rounded-full transition-colors"
                aria-label="More options"
                style={{ WebkitTapHighlightColor: 'transparent' }}
              >
                <IKebab size={16}/>
              </button>
            </div>
          </div>

          <div className="max-w-3xl mx-auto px-4 py-6 pb-24 space-y-3">
            <div className="flex items-center justify-between gap-3 mb-1 pt-1">
              <span className="font-mono text-[20px] font-bold tracking-wide text-neutral-100">{invoice.invoiceNumber}</span>
              <Badge variant={ds.variant}>{ds.label}</Badge>
            </div>

            <div className="bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-1 mb-1">
              <div className="flex items-baseline gap-3 py-2 border-b border-neutral-800/60">
                <span className="text-[10px] uppercase tracking-[0.16em] text-neutral-500 font-bold w-14 flex-shrink-0">Issued</span>
                <div className="relative flex-1">
                  <span className="text-sm font-mono font-semibold text-neutral-100 block">
                    {invoice.invoiceDate ? fmtDateMed(invoice.invoiceDate) : '—'}
                  </span>
                  <input
                    type="date"
                    value={invoice.invoiceDate}
                    onChange={(e) => { const d = e.target.value; updateInvoice({ invoiceDate: d, dueDate: d ? addDays(d, daysFromIssue) : invoice.dueDate }); }}
                    className="tm-picker-overlay absolute inset-0 opacity-0 cursor-pointer"
                    style={{ WebkitAppearance: 'none' }}
                    aria-label="Invoice issue date"
                  />
                </div>
              </div>
              <div className="flex items-baseline gap-3 py-2 border-b border-neutral-800/60">
                <span className="text-[10px] uppercase tracking-[0.16em] text-neutral-500 font-bold w-14 flex-shrink-0">Due</span>
                <span className="flex-1 text-sm font-mono font-semibold text-neutral-100 truncate">
                  {invoice.dueDate ? fmtDateMed(invoice.dueDate) : '—'}{' '}
                  <span className="text-neutral-500 font-medium">· {daysFromIssue} days</span>
                </span>
                <input
                  type="number"
                  min="0"
                  step="1"
                  inputMode="numeric"
                  value={daysFromIssue}
                  onChange={(e) => { const days = Math.max(0, Number(e.target.value) || 0); updateInvoice({ dueDate: addDays(invoice.invoiceDate || todayISO(), days) }); }}
                  className="w-14 bg-neutral-950 border border-neutral-800 rounded-lg px-2 py-1 text-sm font-mono text-neutral-100 text-center focus:outline-none focus:border-sky-500"
                  aria-label="Due in days"
                />
              </div>
              {(invoice.shootDateStart || invoice.shootDateEnd) && (
                <div className="flex items-baseline gap-3 py-2">
                  <span className="text-[10px] uppercase tracking-[0.16em] text-neutral-500 font-bold w-14 flex-shrink-0">Shoot</span>
                  <span className="flex-1 text-sm font-mono font-semibold text-neutral-100">
                    {invoice.shootDateStart ? fmtDateMed(invoice.shootDateStart) : '—'}
                    <span className="text-neutral-500 mx-1.5">—</span>
                    {invoice.shootDateEnd ? fmtDateMed(invoice.shootDateEnd) : '—'}
                  </span>
                </div>
              )}
            </div>

            {invoice.status !== 'draft' && (fieldsLocked ? (
              <div className="flex items-center justify-between gap-3 bg-amber-500/10 border border-amber-500/30 rounded-xl px-4 py-2.5 mb-1">
                <div className="text-[11px] text-amber-200/90 leading-snug">
                  <span className="font-bold">{invoice.status === 'paid' ? 'Paid' : 'Sent'}{invoice.dateSent ? ` ${fmtDateMed(invoice.dateSent)}` : ''}.</span> These details are locked.
                </div>
                <button type="button" onClick={() => setConfirmEditSent(true)}
                  className="flex-shrink-0 text-[10px] uppercase tracking-[0.14em] font-bold text-amber-300 hover:text-amber-200 transition-colors"
                  style={{ WebkitTapHighlightColor: 'transparent' }}>
                  Edit details
                </button>
              </div>
            ) : (
              <div className="bg-sky-500/10 border border-sky-500/30 rounded-xl px-4 py-2.5 mb-1 text-[11px] text-sky-200/90 leading-snug">
                <span className="font-bold">Editing a sent invoice.</span> Changes affect only this invoice — not the project or your other invoices.
              </div>
            ))}

            <div className="bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-1 mb-1">
              <div className="flex items-baseline gap-3 py-2 border-b border-neutral-800/60">
                <span className="text-[10px] uppercase tracking-[0.16em] text-neutral-500 font-bold w-14 flex-shrink-0">Job</span>
                <input
                  type="text"
                  value={invoice.jobTitle || ''}
                  onChange={(e) => editClientField('jobTitle', e.target.value)}
                  readOnly={fieldsLocked}
                  placeholder="Production title"
                  className="flex-1 bg-transparent text-sm font-mono font-semibold text-neutral-100 placeholder-neutral-600 focus:outline-none"
                />
              </div>
              <div className="flex items-baseline gap-3 py-2 border-b border-neutral-800/60">
                <span className="text-[10px] uppercase tracking-[0.16em] text-neutral-500 font-bold w-14 flex-shrink-0">Ref</span>
                <input
                  type="text"
                  value={invoice.jobReference || ''}
                  onChange={(e) => editClientField('jobReference', e.target.value)}
                  readOnly={fieldsLocked}
                  placeholder="e.g. Vodafone Q3, PO#1234"
                  className="flex-1 bg-transparent text-sm font-mono font-semibold text-neutral-100 placeholder-neutral-600 focus:outline-none"
                />
              </div>
              <div className="flex items-baseline gap-3 py-2">
                <span className="text-[10px] uppercase tracking-[0.16em] text-neutral-500 font-bold w-14 flex-shrink-0">Role</span>
                <input
                  type="text"
                  value={invoice.jobRole || ''}
                  onChange={(e) => updateInvoice({ jobRole: e.target.value })}
                  readOnly={fieldsLocked}
                  placeholder="e.g. Gaffer, Spark"
                  className="flex-1 bg-transparent text-sm font-mono font-semibold text-neutral-100 placeholder-neutral-600 focus:outline-none"
                />
              </div>
            </div>

            <div className="bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3">
              <div className="text-[10px] uppercase tracking-[0.22em] text-neutral-500 font-bold mb-1.5">To</div>
              <input
                type="text"
                value={invoice.toName || ''}
                onChange={(e) => editClientField('toName', e.target.value)}
                readOnly={fieldsLocked}
                placeholder="Client / company name"
                className="w-full bg-transparent text-[14px] font-bold text-neutral-100 placeholder-neutral-600 focus:outline-none"
              />
              <input
                type="email"
                value={invoice.toEmail || ''}
                onChange={(e) => editClientField('toEmail', e.target.value)}
                readOnly={fieldsLocked}
                placeholder="billing@example.com"
                className="w-full bg-transparent text-[12px] text-neutral-400 placeholder-neutral-600 focus:outline-none mt-0.5"
              />
              <input
                type="email"
                value={invoice.ccEmail || ''}
                onChange={(e) => editClientField('ccEmail', e.target.value)}
                readOnly={fieldsLocked}
                placeholder="CC (optional) — accounts@example.com"
                className="w-full bg-transparent text-[12px] text-neutral-400 placeholder-neutral-600 focus:outline-none mt-0.5"
                aria-label="CC recipients for this send"
              />
              {invoice.toAddress !== '' && invoice.toAddress != null ? (
                <textarea
                  value={invoice.toAddress}
                  onChange={(e) => editClientField('toAddress', e.target.value)}
                  readOnly={fieldsLocked}
                  rows={3}
                  placeholder={"Address line 1\nLine 2\nPostcode"}
                  className="w-full bg-transparent text-[11px] text-neutral-500 placeholder-neutral-700 focus:outline-none resize-none mt-1.5 font-mono leading-snug"
                  style={{ fontFamily: 'inherit' }}
                />
              ) : !fieldsLocked ? (
                <button
                  type="button"
                  onClick={() => editClientField('toAddress', ' ')}
                  className="inline-flex items-center gap-1 mt-2 text-[9px] uppercase tracking-[0.16em] font-bold text-sky-500 hover:text-sky-400 transition-colors"
                  style={{ WebkitTapHighlightColor: 'transparent' }}
                >
                  <IPlus size={9}/> Add billing address
                </button>
              ) : null}
            </div>

            <div className="bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3">
              <div className="flex items-baseline justify-between mb-1.5">
                <span className="text-[10px] uppercase tracking-[0.22em] text-sky-500 font-bold">
                  Line items
                  <span className="text-neutral-600 font-mono font-medium ml-1.5">
                    {normalLines.length + (expenseLines.length > 0 ? (showIndExp ? expenseLines.length : 1) : 0)}
                  </span>
                </span>
                {!invoice.linesEdited ? (
                  <span className="text-[8px] tracking-[0.14em] uppercase font-bold text-tm-good bg-tm-good/10 border border-tm-good/25 px-1.5 py-[3px] rounded">
                    Auto
                  </span>
                ) : (
                  <span className="text-[8px] tracking-[0.14em] uppercase font-bold text-tm-warn bg-tm-warn/10 border border-tm-warn/25 px-1.5 py-[3px] rounded">
                    Edited
                  </span>
                )}
              </div>

              <div className="space-y-1">
                {normalLines.length === 0 && expenseLines.length === 0 && (
                  <div className="text-[11px] text-neutral-500 italic py-2">No line items — tap Add line below.</div>
                )}
                {normalLines.map(item => renderLineRow(item))}

                {expenseLines.length > 0 && !showIndExp && (
                  <div className="flex items-start gap-2 py-2">
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-semibold text-neutral-100">Expenses</div>
                      <div className="text-[11px] text-neutral-500">{expenseLines.length} item{expenseLines.length !== 1 ? "s" : ""}</div>
                    </div>
                    <div className="text-sm font-mono font-bold text-neutral-100 flex-shrink-0 pt-0.5">
                      {fmtGBP(expenseLines.reduce((s, l) => s + getLineTotal(l), 0))}
                    </div>
                    <div style={{ width: 26 }}/>
                  </div>
                )}
                {expenseLines.length > 0 && showIndExp && expenseLines.map(item => {
                  const expLabel = item.isExpense
                    ? item.label
                    : (item.label || "").replace(/^Expense:\s*/i, "").trim() || item.label;
                  return renderLineRow(item, expLabel);
                })}
              </div>

              {expenseLines.length > 0 && (
                <div className="mt-2 pt-2 border-t border-neutral-800 flex items-center justify-between gap-3">
                  <span className="text-[10px] uppercase tracking-wide text-sky-500 font-bold">Show individual expenses</span>
                  <Toggle value={showIndExp} onChange={(v) => updateInvoice({ showIndividualExpenses: v })} ariaLabel="Show individual expenses" />
                </div>

    function InvoiceListView({ production, setProduction, userPrefs, setUserPrefs, userCrewId, onOpenInvoice, onClose }) {
      const [toastMsg, setToastMsg] = React.useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };
      const invoices = production.invoices || [];
      const sortedInvoices = [...invoices].sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));

      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'draft' | 'sent' | 'paid'

      const todayMs = useMemo(() => new Date(todayISO() + 'T12:00:00').getTime(), []);

      const counts = useMemo(() => {
        let draft = 0, sent = 0, paid = 0, overdue = 0, outstanding = 0;
        for (const inv of invoices) {
          const sub = invoiceSubtotal(inv.lineItems);
          const { vatAmount: vat, total: tot } = invoiceVAT(inv, sub);
          if (inv.status === 'paid') paid++;
          else if (inv.status === 'sent') {
            sent++;
            outstanding += tot;
            if (inv.dueDate && new Date(inv.dueDate + 'T12:00:00').getTime() < todayMs) overdue++;
          } else { draft++; outstanding += tot; }
        }
        return { draft, sent, paid, overdue, outstanding, all: invoices.length };
      }, [invoices, todayMs]);

      const filteredInvoices = useMemo(() => {
        if (filterStatus === 'all') return sortedInvoices;
        return sortedInvoices.filter(i => i.status === filterStatus);
      }, [sortedInvoices, filterStatus]);

      const handleNewInvoice = () => {
        if (!userCrewId) { showToast("No crew member — check Settings → My Setup"); return; }
        const newId = createNewInvoice(production, setProduction, userPrefs, setUserPrefs, userCrewId);
        onOpenInvoice(newId);
      };

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <Toast show={!!toastMsg}>{toastMsg}</Toast>
          <div className="border-b border-sky-500 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
              <button onClick={onClose} className="text-neutral-400 hover:text-sky-500 transition-colors p-2 rounded-full hover:bg-neutral-800" aria-label="Back">
                <IArrowLeft size={18}/>
              </button>
              <div className="flex-1 text-sm font-bold">Invoices</div>
              <Btn variant="primary" size="sm" onClick={handleNewInvoice}><IPlus size={13}/>New Invoice</Btn>
            </div>
          </div>
          <div className="max-w-3xl mx-auto px-4 py-6">
            {sortedInvoices.length === 0 ? (
              <div className="text-center py-16">
                <div className="flex justify-center mb-3 text-neutral-700"><IReceipt size={40}/></div>
                <div className="text-sm font-semibold text-neutral-400 mb-1">No invoices yet</div>
                <div className="text-[11px] text-neutral-600 mb-6">Tap New Invoice to generate one from your timesheet</div>
                <Btn variant="primary" onClick={handleNewInvoice}><IPlus size={13}/>New Invoice</Btn>
              </div>
            ) : (
              <>
                {(counts.outstanding > 0 || counts.overdue > 0) && (
                  <div className="flex items-baseline gap-1.5 mb-3 text-[11px] text-neutral-500 font-mono flex-wrap">
                    <span className="text-neutral-100 font-bold text-[13px]">{fmtGBP(counts.outstanding)}</span>
                    <span className="text-neutral-600">outstanding</span>
                    {counts.overdue > 0 && (
                      <>
                        <span className="text-neutral-700">·</span>
                        <span className="text-tm-pen font-bold">{counts.overdue} OVERDUE</span>
                      </>
                    )}
                  </div>
                )}

                <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1" style={{ scrollbarWidth: 'none' }}>
                  {[
                    { k: 'all', label: 'All', n: counts.all },
                    ...(counts.draft > 0 ? [{ k: 'draft', label: 'Draft', n: counts.draft }] : []),
                    ...(counts.sent > 0 ? [{ k: 'sent', label: 'Sent', n: counts.sent }] : []),
                    ...(counts.paid > 0 ? [{ k: 'paid', label: 'Paid', n: counts.paid }] : []),
                  ].map(({ k, label, n }) => {
                    const active = filterStatus === k;
                    return (
                      <button key={k} onClick={() => setFilterStatus(k)}
                        className={`inline-flex items-baseline gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider whitespace-nowrap border transition-colors ${active ? 'bg-sky-500/10 border-sky-500/30 text-sky-400' : 'bg-tm-card-2 border-neutral-700 text-neutral-400'}`}
                        style={{ WebkitTapHighlightColor: 'transparent' }}>
                        {label} <span className="font-mono font-medium opacity-70">{n}</span>
                      </button>
                    );
                  })}
                </div>

                <div className="space-y-2">
                  {filteredInvoices.map((inv) => {
                    const subtotal = invoiceSubtotal(inv.lineItems);
                    const { vatAmount, total } = invoiceVAT(inv, subtotal);
                    const dueMs = inv.dueDate ? new Date(inv.dueDate + 'T12:00:00').getTime() : null;
                    const isOverdue = inv.status === 'sent' && dueMs && dueMs < todayMs;
                    const daysOverdue = isOverdue ? Math.floor((todayMs - dueMs) / 86400000) : 0;
                    const daysToDue = (inv.status === 'sent' && dueMs && !isOverdue) ? Math.ceil((dueMs - todayMs) / 86400000) : 0;
                    const s = getDisplayStatus(inv);

                    return (
                      <button key={inv.id} onClick={() => onOpenInvoice(inv.id)}
                        className={`w-full text-left rounded-xl p-3.5 border transition-colors active:bg-neutral-800 ${isOverdue ? 'bg-neutral-900 border-tm-pen/25 hover:border-tm-pen/40' : 'bg-neutral-900 border-neutral-800 hover:border-neutral-700'}`}
                        style={{
                          WebkitTapHighlightColor: 'transparent',
                          ...(isOverdue ? { backgroundImage: 'radial-gradient(80% 60% at 100% 0%, rgba(244,63,94,0.06) 0%, transparent 60%)' } : {})
                        }}>
                        <div className="flex items-baseline justify-between mb-1">
                          <span className="text-[10px] font-mono tracking-wider text-neutral-500 font-semibold">{inv.invoiceNumber}</span>
                          <Badge variant={s.variant}>{s.label}</Badge>
                        </div>
                        {inv.toName && <div className="text-[15px] font-bold text-neutral-100 mb-2 truncate">{inv.toName}</div>}
                        <div className="font-mono font-bold text-[17px] text-neutral-100">{fmtGBP(total)}</div>
                        {(() => {
                          if (inv.status === 'paid') {
                            return (
                              <div className="text-[11px] text-neutral-500 mt-2 font-mono">
                                Paid {fmtDateShort(inv.datePaid || inv.dateSent || inv.invoiceDate)}{' '}
                                <span className="text-tm-good">✓</span>
                              </div>
                            );
                          }
                          if (isOverdue) {
                            return (
                              <div className="text-[11px] text-tm-pen mt-2 font-mono font-bold">
                                ⚠ {daysOverdue} DAY{daysOverdue !== 1 ? 'S' : ''} OVERDUE{' '}
                                <span className="text-neutral-600 font-medium">· due {fmtDateShort(inv.dueDate)}</span>
                              </div>
                            );
                          }
                          if (inv.status === 'sent') {
                            return (
                              <div className="text-[11px] text-neutral-400 mt-2 font-mono">
                                Due {fmtDateShort(inv.dueDate)}{' '}
                                <span className="text-neutral-600">· in {daysToDue} day{daysToDue !== 1 ? 's' : ''}</span>
                              </div>
                            );
                          }
                          return (
                            <div className="text-[11px] text-neutral-500 mt-2 font-mono">
                              Created {fmtDateShort(inv.createdAt ? inv.createdAt.slice(0,10) : inv.invoiceDate)}{' '}
                              <span className="text-neutral-600">· not sent</span>
                            </div>
                          );
                        })()}
                      </button>
                    );
                  })}
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function InvoiceRowActionSheet({ invoice, onClose, onUpdate, onDelete, showToast }) {
      useEscape(onClose);
      const [confirmDelete, setConfirmDelete] = useState(false);
      const markSent = () => { onUpdate({ status: 'sent', dateSent: todayISO() }); showToast('Marked as sent'); onClose(); };
      const markPaid = () => { onUpdate({ status: 'paid', datePaid: todayISO() }); showToast('Marked as paid'); fireCelebration(); onClose(); };
      const revertToDraft = () => { onUpdate({ status: 'draft', dateSent: null }); showToast('Marked as draft'); onClose(); };
      const revertToSent = () => { onUpdate({ status: 'sent', datePaid: null }); showToast('Marked as unpaid'); onClose(); };
      const doDelete = () => { onDelete(); showToast('Invoice deleted'); onClose(); };
      if (confirmDelete) {
        return (
          <ConfirmDialog open title="Delete invoice?" message={`Delete ${invoice.invoiceNumber}? This cannot be undone.`}
            confirmLabel="Delete" confirmTone="danger" onConfirm={doDelete} onCancel={() => setConfirmDelete(false)} />
        );
      }
      return (
        <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 80 }} onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
