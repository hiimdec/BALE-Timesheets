                        <Input type="number" min="0" step="0.01" value={dateEdit.perDiemAmount ?? 0} onChange={e => setDateEdit(p => ({...p, perDiemAmount: Number(e.target.value)}))} />
                      </Field>
                    </div>
                    <div className="space-y-3">
                      <Field label="Kit Money Amount (£)" hint="Set 0 to deactivate. Added to day total.">
                        <Input type="number" min="0" step="0.01" value={dateEdit.kitMoneyAmount ?? 0} onChange={e => setDateEdit(p => ({...p, kitMoneyAmount: Number(e.target.value)}))} />
                      </Field>
                    </div>
                    <div className="space-y-3">
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-[10px] uppercase tracking-wide text-sky-500 font-bold">Expenses</span>
                        <button
                          type="button"
                          onClick={() => setDateEdit(p => ({ ...p, expenses: [...(p.expenses || []), { id: uid(), amount: 0, category: "Other", description: "" }] }))}
                          className="text-[10px] uppercase tracking-wide text-sky-500 hover:text-sky-300 font-bold flex items-center gap-1"
                        ><IPlus size={11}/>Add expense</button>
                      </div>
                      {(dateEdit.expenses || []).length > 0 && (
                        <div className="space-y-2">
                          {(dateEdit.expenses || []).map((exp) => (
                            <div key={exp.id} className="flex flex-wrap items-center gap-2">
                              <Select
                                value={exp.category}
                                onChange={(e) => setDateEdit(p => ({ ...p, expenses: p.expenses.map(x => x.id === exp.id ? { ...x, category: e.target.value } : x) }))}
                                className="flex-shrink-0" style={{ width: 116 }}
                              >
                                {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                              </Select>
                              <Input
                                type="number" min="0" step="0.01"
                                value={exp.amount}
                                onChange={(e) => setDateEdit(p => ({ ...p, expenses: p.expenses.map(x => x.id === exp.id ? { ...x, amount: Number(e.target.value) || 0 } : x) }))}
                                placeholder="0.00" className="flex-shrink-0" style={{ width: 84 }}
                              />
                              <Input
                                type="text"
                                value={exp.description}
                                onChange={(e) => setDateEdit(p => ({ ...p, expenses: p.expenses.map(x => x.id === exp.id ? { ...x, description: e.target.value } : x) }))}
                                placeholder="Description" className="flex-1 min-w-[80px]"
                              />
                              <button
                                type="button"
                                onClick={() => setDateEdit(p => ({ ...p, expenses: p.expenses.filter(x => x.id !== exp.id) }))}
                                className="text-neutral-600 hover:text-tm-pen transition-colors flex-shrink-0 p-1"
                                aria-label="Remove expense"
                              ><IX size={14}/></button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    <div className="space-y-3">
                      <Field label="Step-Up Role for all crew" hint="Select — None — to disable.">
                        <Select value={dateEdit.stepUpRole || ""} onChange={e => {
                          const role = e.target.value;
                          const d = ROLE_DEFAULTS[role] || {};
                          setDateEdit(p => ({
                            ...p,
                            stepUpRole: role,
                            stepUpBDR: role ? (d.bdr ?? p.stepUpBDR) : 0,
                            stepUpOTCoef: role ? (d.otCoef ?? 1) : 1,
                            stepUpOTRate: role ? (d.otRate ?? null) : null,
                          }));
                        }}>
                          <option value="">— None (not stepped up) —</option>
                          {Object.entries(DEPARTMENTS).map(([dept, roles]) => <optgroup key={dept} label={dept}>{Object.keys(roles).map(r => <option key={r} value={r}>{r}</option>)}</optgroup>)}
                        </Select>
                      </Field>
                      {dateEdit.stepUpRole && (
                        <div className="grid grid-cols-2 gap-3">
                          <Field label="Step-Up BDR (£)" hint="Override for this day only">
                            <Input type="number" min="0" step="0.01" value={dateEdit.stepUpBDR ?? 0} onChange={e => setDateEdit(p => ({...p, stepUpBDR: Number(e.target.value)}))} />
                          </Field>
                          <Field label="Step-Up OT Coef">
                            <Select value={String(dateEdit.stepUpOTCoef ?? 1)} onChange={e => setDateEdit(p => ({...p, stepUpOTCoef: Number(e.target.value)}))}>
                              <option value="1">1×</option>
                              <option value="1.25">1.25×</option>
                              <option value="1.5">1.5×</option>
                            </Select>
                          </Field>
                        </div>
                      )}
                    </div>
                  </Disclosure>
                </div>

                {/* ── Fixed footer ── */}
                <div className="flex-shrink-0 border-t border-neutral-700 px-5 pt-3 flex gap-2" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>
                  <Btn variant="success" onClick={() => { onBulkEditDate(editingDate, dateEdit); setEditingDate(null); }}>
                    <ICheck/>Save all
                  </Btn>
                  <Btn variant="ghost" onClick={() => setEditingDate(null)}><IX/>Cancel</Btn>
                  <div className="flex-1" />
                  <Btn variant="danger" onClick={() => { setEditingDate(null); onRemoveDate(editingDate); }}>
                    <ITrash size={14}/>Delete
                  </Btn>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ═══════════════════════════ DAYS MANAGER ═══════════════════════════ */

    function dayTypeDefaults(dayType) {
      return {
        callTime: "08:00",
        wrapTime: toHHMM(8 + (DEFAULT_HOURS[dayType] ?? 11)),
        ...(dayType === "Travel Day" || dayType === "Rest Day" ? { lunchDurationMins: 0 } : {}),
      };
    }

    function makeBlankDay(crewId = "") {
      return {
        id: uid(), crewId, date: todayISO(),
        wrapNextDay: false,
        wrapped: false,
        preCallTime: "",
        noMealProvided: false, secondBreakDurationMins: 0, secondBreakLogged: false,
        cwdBreak1Given: true, cwdBreak2Given: true,
        travelOutMins: 0, travelBackMins: 0, miles: 0,
        perDiemAmount: 0,
        kitMoneyAmount: 0,
        expenses: [],
        stepUpRole: "", stepUpBDR: 0, stepUpOTCoef: 1,
        note: "",
      };
    }

    function WrapNowBtn({ days, setDays, showToast, className = "", variant }) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayEntries = days.filter(d => d.date === todayStr);
      const alreadyWrapped = todayEntries.some(d => d.wrapTime && d.wrapTime.length > 0);
      const [confirming, setConfirming] = useState(false);

      const doWrap = () => {
        const now = new Date();
        const totalMins = now.getHours() * 60 + now.getMinutes();
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const m = rounded % 60;
        const wrapStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        setDays(prev => prev.map(d => d.date === todayStr ? { ...d, wrapTime: wrapStr, wrapped: true } : d));
        showToast(`Wrapped ${todayEntries.length} entr${todayEntries.length === 1 ? 'y' : 'ies'} at ${wrapStr}`);
        setConfirming(false);
      };

      const handleClick = () => {
        if (todayEntries.length === 0) { showToast("No work days found for today"); return; }
        if (alreadyWrapped && !confirming) {
          setConfirming(true);
          setTimeout(() => setConfirming(false), 4000);
          return;
        }
        doWrap();
      };

      if (variant === "hero") {
        const heroCls = `inline-flex items-center justify-center gap-2 text-[10px] uppercase tracking-[0.14em] font-bold rounded-[10px] py-2.5 px-3 transition-colors border ${confirming
          ? "bg-sky-500/20 border-sky-500 text-sky-100"
          : "bg-sky-500 border-sky-500 text-black hover:bg-sky-400"} ${className}`;
        return (
          <button onClick={handleClick} className={heroCls}
            title={confirming ? "Tap again to overwrite" : "Set today's wrap time to now"}>
            <ICheck size={11}/>{confirming ? "Confirm?" : "Wrap now"}
          </button>
        );
      }

      const cls = `inline-flex items-center justify-center text-[10px] uppercase tracking-wider font-bold rounded-lg px-3 transition-colors ${confirming ? "border border-sky-500 text-sky-100 bg-sky-500/20" : "bg-sky-500 text-black hover:bg-sky-400"} ${className}`;

      return (
        <button onClick={handleClick} className={cls}
          style={{ minWidth: 96, height: 36 }}
          title={confirming ? "Tap again to overwrite" : "Set today's wrap time to now"}>
          {confirming ? "Confirm?" : "WrapNow"}
        </button>
      );
    }

    function LunchNowBtn({ days, setDays, showToast, className = "", variant }) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayEntries = days.filter(d => d.date === todayStr);
      const alreadyLunched = todayEntries.some(d => d.lunchStartTime && d.lunchStartTime.length > 0);
      const [confirming, setConfirming] = useState(false);

      const doLunch = () => {
        const now = new Date();
        const totalMins = now.getHours() * 60 + now.getMinutes();
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const m = rounded % 60;
        const lunchStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        setDays(prev => prev.map(d => d.date === todayStr ? { ...d, lunchStartTime: lunchStr } : d));
        showToast(`Lunch logged at ${lunchStr}`);
        setConfirming(false);
      };

      const handleClick = () => {
        if (todayEntries.length === 0) { showToast("No work days found for today"); return; }
        if (alreadyLunched && !confirming) {
          setConfirming(true);
          setTimeout(() => setConfirming(false), 4000);
          return;
        }
        doLunch();
      };

      if (variant === "hero") {
        const heroCls = `inline-flex items-center justify-center gap-2 text-[10px] uppercase tracking-[0.14em] font-bold rounded-[10px] py-2.5 px-3 transition-colors border ${confirming
          ? "bg-tm-warn/10 border-tm-warn text-tm-warn"
          : "bg-neutral-800 border-neutral-700 text-neutral-100 hover:bg-neutral-700"} ${className}`;
        return (
          <button onClick={handleClick} className={heroCls}
            title={confirming ? "Tap again to overwrite" : "Log today's lunch start time"}>
            <ICheck size={11}/>{confirming ? "Confirm?" : "Lunch now"}
          </button>
        );
      }

      const cls = `inline-flex items-center justify-center text-[10px] uppercase tracking-wider font-bold rounded-lg px-3 transition-colors ${confirming ? "border border-tm-warn text-tm-warn bg-tm-warn/10" : "border border-sky-500/50 text-sky-300 hover:border-sky-500"} ${className}`;

      return (
        <button onClick={handleClick} className={cls}
          style={{ minWidth: 96, height: 36 }}
          title={confirming ? "Tap again to overwrite" : "Log today's lunch start time"}>
          {confirming ? "Confirm?" : "LunchNow"}
        </button>
      );
    }

    function DaysManager({ days, setDays, crew, production, showToast, onAddDate, onAddWeek, onAddCrew, onPushUndo, onRemoveWeek }) {
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState(() => makeBlankDay());
      const [confirmRemove, setConfirmRemove] = useState(null);
      const [confirmOpts, setConfirmOpts] = useState(null);
      const [dupDateDialog, setDupDateDialog] = useState(null);
      const [gridView, setGridView] = useState(production.bestBoyMode);
      const [fixedCrewId, setFixedCrewId] = useState(null);
      const [fixedDate, setFixedDate] = useState(null);

      const startNew = () => {
        if (crew.length === 0) return;
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(crew[0].id), secondBreakStartTime: toHHMM(callH + 11) });
        setEditing("new");
        setFixedCrewId(!production.bestBoyMode ? crew[0].id : null);
        setFixedDate(null);
      };
      const startNewAll = () => {
        if (crew.length === 0) return;
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(""), secondBreakStartTime: toHHMM(callH + 11) });
        setEditing("new-all");
        setFixedCrewId(null);
        setFixedDate(null);
      };
      const startEdit = (d) => {
        setForm(migrateDay(d));
        setEditing(d.id);
        setFixedCrewId(d.crewId);
        setFixedDate(d.date);
      };
      const cancel = () => {
        setEditing(null);
        setFixedCrewId(null);
        setFixedDate(null);
      };
      const handleEditDayFromGrid = (id) => { const d = days.find(day => day.id === id); if (d) startEdit(d); };
      const handleAddDayFromGrid = (crewId, date, dayType = "Shoot") => {
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(crewId), date, dayType, ...dayTypeDefaults(dayType), secondBreakStartTime: toHHMM(callH + 11), wrapped: !!(date && date < todayISO()) });
        setEditing("new");
        setFixedCrewId(crewId);
        setFixedDate(date);
      };
      const handleAddAllFromGrid = (date, dayType = "Shoot") => {
        if (crew.length === 0) return;
        const d = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}) };
        const callH = parseHHMM(d.callTime) ?? 8;
        setForm({ ...d, ...makeBlankDay(""), date, dayType, ...dayTypeDefaults(dayType), secondBreakStartTime: toHHMM(callH + 11), wrapped: !!(date && date < todayISO()) });
        setEditing("new-all");
        setFixedCrewId(null);
        setFixedDate(date);
      };
      const handleBulkEditDate = (date, overrides) => {
        const {
          dayType, callTime, wrapTime, lunchStartTime, lunchDurationMins,
          secondBreakStartTime, secondBreakDurationMins,
          preCallTime,
          miles, travelOutMins, travelBackMins,
          perDiemAmount,
          kitMoneyAmount,
          stepUpRole, stepUpBDR, stepUpOTCoef, stepUpOTRate,
          mileageMethod, mileagePostcode, mileageRoundTrip,
        } = overrides;
        setDays(prev => prev.map(d =>
          d.date !== date ? d : {
            ...d,
            dayType, callTime, wrapTime, lunchStartTime, lunchDurationMins,
            secondBreakStartTime, secondBreakDurationMins,
            preCallTime,
            miles, travelOutMins, travelBackMins,
            perDiemAmount,
            kitMoneyAmount,
            stepUpRole, stepUpBDR, stepUpOTCoef, stepUpOTRate,
            mileageMethod, mileagePostcode, mileageRoundTrip,
          }
        ));
      };
      const handleAssignAllOnDate = (date, dayType = "Shoot") => {
        const toAdd = crew.filter(m => !days.find(d => d.date === date && d.crewId === m.id));
        if (toAdd.length > 0) setDays(prev => [...prev, ...toAdd.map(m => ({ ...makeBlankDay(m.id), date, dayType, ...dayTypeDefaults(dayType), wrapped: !!(date && date < todayISO()) }))]);
      };
      const handleRemoveAllOnDate = (date) => {
        const count = days.filter(d => d.date === date).length;
        if (count === 0) return;
        setConfirmOpts({
          title: "Remove all entries?",
          message: `Remove all ${count} entr${count === 1 ? 'y' : 'ies'} on ${fmtDate(date)}? This cannot be undone.`,
          confirmLabel: "Remove",
          confirmTone: "danger",
          onConfirm: () => setDays(prev => prev.filter(d => d.date !== date)),
        });
      };

      const handleDuplicateDate = (sourceDate) => {
        const source = days.filter(d => d.date === sourceDate);
        if (source.length === 0) return;
        const next = new Date(sourceDate + "T12:00:00");
        next.setDate(next.getDate() + 1);
        setDupDateDialog({ sourceDate, targetDate: next.toISOString().slice(0, 10), count: source.length });
      };

      const confirmDuplicateDate = (targetDate) => {
        const { sourceDate } = dupDateDialog;
        setDupDateDialog(null);
        const source = days.filter(d => d.date === sourceDate);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDate)) { showToast("Invalid date"); return; }
        if (targetDate === sourceDate) { showToast("Target date is the same as source"); return; }
        const existing = days.filter(d => d.date === targetDate);
        const copies = source.map(d => ({ ...d, id: uid(), date: targetDate }));
        if (existing.length > 0) {
          setConfirmOpts({
            title: "Replace existing entries?",
            message: `${fmtDateShort(targetDate)} already has ${existing.length} entr${existing.length === 1 ? 'y' : 'ies'}. Replace them?`,
            confirmLabel: "Replace",
            confirmTone: "danger",
            onConfirm: () => setDays(prev => [...prev.filter(d => d.date !== targetDate), ...copies]),
          });
        } else {
          setDays(prev => [...prev, ...copies]);
        }
      };

      const save = () => {
        if (!form.date || !form.callTime || !form.wrapTime) return;
        if (editing === "new-all") {
          const newDays = crew.map((c) => ({ ...form, id: uid(), crewId: c.id }));
          setDays((prev) => [...prev, ...newDays]);
          cancel();
        } else {
          if (!form.crewId) return;
          if (editing === "new") {
            const existing = days.filter(d => d.crewId === form.crewId && d.date === form.date);
            if (existing.length > 0) {
              const crewMember = crew.find(c => c.id === form.crewId);
              setConfirmOpts({
                title: "Duplicate date",
                message: `${crewMember?.name || "This crew member"} already has ${existing.length === 1 ? "a day" : `${existing.length} days`} on ${fmtDateShort(form.date)}. Create another anyway?`,
                confirmLabel: "Create both",
                confirmTone: "primary",
                onConfirm: () => { setDays(prev => [...prev, form]); cancel(); },
              });
              return;
            }
          }
          if (editing !== "new") onPushUndo('Day entry saved');
          setDays((prev) => {
            const exists = prev.find((d) => d.id === form.id);
            return exists ? prev.map((d) => (d.id === form.id ? form : d)) : [...prev, form];
          });
          cancel();
        }
      };

      const remove = (id) => { onPushUndo('Day entry deleted'); setDays((prev) => prev.filter((d) => d.id !== id)); setConfirmRemove(null); };
      const duplicate = (d) => setDays((prev) => [...prev, { ...d, id: uid() }]);

      const handleDayText = async (d, c) => {
        const text = generateDayText(d, c, production, days);
        const r = await shareTextOrCopy(text, `${c.name} ${fmtDateShort(d.date)}`);
        if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
      };
      const grouped = useMemo(() => {
        const by = {};
        days.forEach((d) => { (by[d.date] = by[d.date] || []).push(d); });
        Object.values(by).forEach((arr) => arr.sort((a, b) => {
          const ia = crew.findIndex((c) => c.id === a.crewId);
          const ib = crew.findIndex((c) => c.id === b.crewId);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        }));
        return Object.entries(by).sort(([a], [b]) => a.localeCompare(b));
      }, [days, crew]);

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><ICal size={16}/>Timesheet Entries</h2>
            <div className="flex items-center gap-2 flex-wrap">
              {production.bestBoyMode && (
                <div className="inline-flex rounded-lg bg-neutral-800 p-0.5">
                  <button onClick={() => setGridView(false)} className={`px-3 py-1 rounded-md text-[10px] uppercase tracking-wider font-bold transition-colors duration-150 ${!gridView ? "bg-sky-500 text-black" : "text-neutral-400"}`}>List</button>
                  <button onClick={() => setGridView(true)} className={`px-3 py-1 rounded-md text-[10px] uppercase tracking-wider font-bold transition-colors duration-150 ${gridView ? "bg-sky-500 text-black" : "text-neutral-400"}`}>Grid</button>
                </div>
              )}
              {!editing && crew.length > 0 && (
                <>
                  {production.bestBoyMode && <Btn variant="subtle" onClick={startNewAll}><IUsers2/>Add Day (All Crew)</Btn>}
                  <Btn variant="primary" onClick={startNew}><IPlus/>Add Day</Btn>
                </>
              )}
            </div>
          </div>

          {crew.length === 0 && <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-xl">Add crew members first.</div>}

          {editing && (
            <DayEditModal
              editing={editing}
              form={form}
              setForm={setForm}
              crew={crew}
              production={production}
              days={days}
              onSave={save}
              onCancel={cancel}
              onRemove={(id) => { remove(id); cancel(); }}
              fixedCrewId={fixedCrewId}
              fixedDate={fixedDate}
            />
          )}

          {!gridView && days.length === 0 && !editing && crew.length > 0 && (
            <div className="border-2 border-dashed border-neutral-700 rounded-xl p-8 text-center">
              <div className="flex justify-center mb-3 text-neutral-700"><ICal size={36}/></div>
              <p className="text-sm text-neutral-400 mb-4">No days yet — log today to get started.</p>
              <Btn variant="primary" onClick={startNew}><IPlus/>Add Day</Btn>
            </div>
          )}

          {gridView ? (
            <TimesheetGrid production={production} crew={crew} days={days} onEditDay={handleEditDayFromGrid} onAddDay={handleAddDayFromGrid} onAddAllOnDate={handleAddAllFromGrid} onAddWeek={onAddWeek} onAddCrew={onAddCrew} onAssignAll={handleAssignAllOnDate} onDuplicateDate={handleDuplicateDate} onBulkEditDate={handleBulkEditDate} onRemoveWeek={onRemoveWeek} onRemoveDate={handleRemoveAllOnDate} />
          ) : (
          <div className="space-y-4">
            {grouped.map(([date, entries]) => {
              const dayTotal = entries.reduce((s, e) => { const c = crew.find((cc) => cc.id === e.crewId); return c ? s + calcForDisplay(production, e, c, findPrevDay(days, e)).total : s; }, 0);
              return (
                <div key={date}>
                  <div className="flex items-baseline justify-between mb-2 border-b border-neutral-800 pb-1">
                    <div className="text-[11px] font-bold uppercase tracking-[0.15em] text-sky-500">{fmtDate(date)}</div>
                    <div className="text-sm font-mono text-neutral-300">{fmtGBP(dayTotal)}</div>
                  </div>
                  <div className="space-y-1">
                    {entries.map((d) => {
                      const c = crew.find((cc) => cc.id === d.crewId);
                      if (!c) return (
                        <div key={d.id} className="bg-tm-pen/[0.04] border border-tm-pen/25 p-3 text-sm text-tm-pen flex items-center justify-between rounded-xl">
                          <span>Unassigned crew (deleted)</span>
                          <Btn size="sm" variant="ghost" onClick={() => remove(d.id)}><ITrash/></Btn>
                        </div>
                      );
                      const calc = calcForDisplay(production, d, c, findPrevDay(days, d));
                      const resolved = resolveDay(production, d, c);
                      const hasPenalty = calc.lines.some(l => l.rate === null);
                      const hasTocBreach = calc.lines.some(l => l.isTOC && l.isBreach);
                      // In-app priority stripe: tm-pen = penalty/TOC breach, tm-warn = OT/CWD/TOC, tm-good = clean
                      const stripeClass = (hasPenalty || hasTocBreach) ? 'border-tm-pen'
                        : (calc.meta.otHrs > 0 || calc.meta.continuousDay || calc.lines.some(l => l.isTOC)) ? 'border-tm-warn'
                        : 'border-tm-good';
                      return (
                        <div key={d.id}
                          className={`bg-neutral-900 border border-neutral-800 active:bg-neutral-800 transition-colors border-l-4 rounded-xl overflow-hidden cursor-pointer select-none touch-manipulation ${stripeClass}`}
                          style={{ WebkitTapHighlightColor: 'transparent' }}
                          onClick={() => startEdit(d)}
                        >
                          <div className="flex items-center justify-between p-3 gap-3 flex-wrap">
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2 flex-wrap">
                                <div className="font-semibold text-neutral-100">{c.name}</div>
                                <span className="text-[10px] uppercase tracking-wider bg-neutral-800 text-neutral-400 px-1.5 py-0.5">{c.role}</span>
                                <span className="text-[10px] uppercase tracking-wider bg-sky-500 text-black px-1.5 py-0.5 font-bold">{calc.meta.dayType}</span>
                                {calc.meta.continuousDay && <span className="text-[10px] uppercase tracking-wider bg-tm-pen/10 text-tm-pen border border-tm-pen/25 px-1.5 py-0.5 font-bold rounded">CWD</span>}
                              </div>
                              <div className="text-[11px] text-neutral-400 font-mono mt-1">
                                {resolved.callTime}–{resolved.wrapTime}{(parseHHMM(resolved.wrapTime) !== null && parseHHMM(resolved.callTime) !== null && parseHHMM(resolved.wrapTime) <= parseHHMM(resolved.callTime)) ? " (+1)" : ""} · {calc.meta.workedHrs.toFixed(1)}h · {calc.meta.dayLabel}
                              </div>
                              {d.note?.trim() && <div className="flex items-center gap-1 mt-1"><INote size={11} className="text-neutral-600 flex-shrink-0"/><span className="text-[10px] text-neutral-600">Note</span></div>}
                            </div>
                            <div className="flex items-center gap-2 flex-shrink-0" onClick={e => e.stopPropagation()}>
                              <div className="font-mono font-bold text-neutral-100 text-sm">{fmtGBP(calc.total)}</div>
                              <div className="flex gap-1">
                                <Btn size="sm" variant="ghost" onClick={() => handleDayText(d, c)} title="Send as text" aria-label="Send as text"><IMessage/></Btn>
                                <Btn size="sm" variant="ghost" onClick={() => startEdit(d)} aria-label="Edit day"><IPencil/></Btn>
                                <Btn size="sm" variant="ghost" onClick={() => duplicate(d)} title="Duplicate" aria-label="Duplicate day"><IPlus/></Btn>
                                {confirmRemove === d.id ? (
                                  <>
                                    <Btn size="sm" variant="danger" onClick={() => remove(d.id)}>Del</Btn>
                                    <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(null)} aria-label="Cancel delete"><IX/></Btn>
                                  </>
                                ) : (
                                  <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(d.id)} aria-label="Delete day"><ITrash/></Btn>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
          )}
          <ConfirmDialog
            open={!!confirmOpts}
            title={confirmOpts?.title}
            message={confirmOpts?.message}
            confirmLabel={confirmOpts?.confirmLabel || "Confirm"}
            confirmTone={confirmOpts?.confirmTone || "danger"}
            cancelLabel="Cancel"
            onConfirm={() => { const f = confirmOpts?.onConfirm; setConfirmOpts(null); if (f) f(); }}
            onCancel={() => setConfirmOpts(null)}
          />
          <DuplicateDateDialog
            opts={dupDateDialog}
            onConfirm={confirmDuplicateDate}
            onCancel={() => setDupDateDialog(null)}
          />
        </div>
      );
    }

    function computeInitialDate(production) {
      const today = todayISO();
      const datesWithData = new Set((production.days || []).map(d => d.date));
      if (datesWithData.has(today)) return today;
      if (datesWithData.size > 0) return [...datesWithData].sort().reverse()[0];
      return production.startDate || today;
    }

    function BestBoyMobileDayView({ production, setProduction, userPrefs, onPushUndo, currentDate, setCurrentDate, onCrewTap, showToast }) {
      const crew = production.crew || [];
      const days = production.days || [];
      const [showLunchSheet, setShowLunchSheet] = useState(false);
      const [showAddCrew, setShowAddCrew] = useState(false);
      const [expandedVarianceCrewIds, setExpandedVarianceCrewIds] = useState(() => new Set());
      const [expandedDeptExtras, setExpandedDeptExtras] = useState(() => new Set());
      const deptExtraRefs = useRef({});
      const toggleDeptExtra = (key) => {
        setExpandedDeptExtras(prev => {
          const next = new Set(prev);
          if (next.has(key)) next.delete(key);
          else {
            next.add(key);
            requestAnimationFrame(() => {
              deptExtraRefs.current[key]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
          }
          return next;
        });
      };

      const updateDeptDefault = (field, value) => {
        setProduction(p => setDayDefault(p, currentDate, field, value));
      };

      const toggleVarianceExpanded = (crewId) => {
        setExpandedVarianceCrewIds(prev => {
          const next = new Set(prev);
          if (next.has(crewId)) next.delete(crewId); else next.add(crewId);
          return next;
        });
      };

      const handleAddNewCrew = (form) => {
        setProduction(p => {
          const newCrewId = uid();
          const newCrewMember = {
            id: newCrewId,
            name: form.name,
            role: form.role,
            bdr: form.bdr,
            otCoef: form.otCoef,
            otRate: form.otRate,
            vatRegistered: false,
            vatRate: 20,
            kitMoneyEnabled: false,
            kitMoneyAmount: 0,
            isDriver: false,
            email: form.email,
          };
          // V4-5h-14 (F4.3): omit time fields so resolveDay cascades from dayDefaults.
          const newDay = {
            ...makeBlankDay(newCrewId),
            date: currentDate,
          };
          return {
            ...p,
            crew: [...(p.crew || []), newCrewMember],
            days: [...(p.days || []), newDay],
          };
        });
        setShowAddCrew(false);
      };

      const sortedDates = useMemo(
        () => [...new Set(days.map(d => d.date))].sort(),
        [days]
      );

      const meCrewId = resolveUserCrewId(production, userPrefs);

      const crewWithCalcs = useMemo(() => {
        const idx = sortedDates.indexOf(currentDate);
        const prevDate = idx > 0 ? sortedDates[idx - 1] : null;

        return crew.map(member => {
          const isMe = member.id === meCrewId;
          const dayRecord = days.find(d => d.date === currentDate && d.crewId === member.id);

          if (!dayRecord) {
            return { member, isMe, isOff: true, dayTotal: 0, calc: null, chips: [], offReason: 'Not on this day', dayRecord: null };
          }

          // V4-5h-11: respect cascade — explicit override wins, else inherit dept
          // default. Use the full resolveDay cascade (dayDefaults ← defaultDay ←
          // DEFAULT_PRODUCTION_DAY) so an inherited Rest Day is recognised too.
          const effectiveDayType = resolveDay(production, dayRecord, member).dayType;
          if (effectiveDayType === 'Rest Day') {
            return { member, isMe, isOff: true, dayTotal: 0, calc: null, chips: [], offReason: 'Rest Day', dayRecord };
          }

          const prevDayRecord = prevDate
            ? days.find(d => d.date === prevDate && d.crewId === member.id)
            : null;

          const calc = calcForDisplay(production, dayRecord, member, prevDayRecord);

          const chips = [];
          const otHrs = calc.lines
            .filter(l => categorizeBreakdownLine(l.label) === 'ot')
            .reduce((s, l) => s + (Number(l.qty) || 0), 0);
          if (otHrs > 0) {
            chips.push({
              label: `OT ${otHrs % 1 ? otHrs.toFixed(1) : otHrs}h`,
              className: 'text-[8px] tracking-wider font-bold uppercase border rounded px-1 py-0.5 bg-tm-warn/10 text-tm-warn border-tm-warn/25'
            });
          }
          if (calc.lines.some(l => /late 1st|l1/i.test(l.label))) {
            chips.push({
              label: 'L1',
              className: 'text-[8px] tracking-wider font-bold uppercase border rounded px-1 py-0.5 bg-tm-pen/10 text-tm-pen border-tm-pen/25'
            });
          }
          if (calc.lines.some(l => /missed|cwd|breach|penalty|curtailed/i.test(l.label))) {
            chips.push({
              label: 'PEN',
              className: 'text-[8px] tracking-wider font-bold uppercase border rounded px-1 py-0.5 bg-tm-pen/10 text-tm-pen border-tm-pen/25'
            });
          }

          return { member, isMe, isOff: false, dayTotal: calc.total, calc, chips, offReason: null, dayRecord };
        });
      }, [production, currentDate, sortedDates]);

      const crewWithVariances = useMemo(() => {
        const defaults = production.dayDefaults?.[currentDate];
        return crewWithCalcs.map(entry => {
          if (entry.isOff) return { ...entry, variances: [] };
          const variances = getCrewVariances({ dayRecord: entry.dayRecord, defaults, crewMember: entry.member });
          return { ...entry, variances };
        });
      }, [crewWithCalcs, production.dayDefaults, currentDate]);

      const dayBuckets = useMemo(() => {
        const totals = { basic: 0, ot: 0, pen: 0 };
        for (const c of crewWithCalcs) {
          if (c.isOff || !c.calc) continue;
          const b = bucketCalcTotals(c.calc);
          totals.basic += b.basic;
          totals.ot += b.ot;
          totals.pen += b.pen;
        }
        return totals;
      }, [crewWithCalcs]);

      const anyCrewInOT = crewWithCalcs.some(c => !c.isOff && (c.calc?.meta?.otHrs || 0) > 0);
      const anyCrewLunchLate = crewWithCalcs.some(c =>
        !c.isOff && c.calc?.lines?.some(l => /late 1st|l1\b/i.test(l.label))
      );
      const anyCrewLunchCurtailed = crewWithCalcs.some(c =>
        !c.isOff && c.calc?.lines?.some(l => /curtailed 1st/i.test(l.label))
      );

      const dayConditions = useMemo(() => {
        // V4-5h-14 (F6.2): split warn vs penalty. Penalty = money owed (tm-pen).
        // Warn = informational state (tm-warn). Neither = neutral.
        const map = new Map(); // label → { count, warn, penalty }
        const bump = (label, warn, penalty = false) => {
          const cur = map.get(label) || { count: 0, warn, penalty };
          cur.count += 1;
          cur.warn = cur.warn || warn;
          cur.penalty = cur.penalty || penalty;
          map.set(label, cur);
        };
        for (const c of crewWithCalcs) {
          if (c.isOff || !c.calc) continue;
          const calc = c.calc;
          const rec = c.member && (production.days || []).find(d => d.date === currentDate && d.crewId === c.member.id);
          if (calc.meta?.continuousDay) bump('CWD', true);
          if (calc.meta?.isElevenHourDay) bump('11h day', false);
          const otHrs = (calc.lines || [])
            .filter(l => categorizeBreakdownLine(l.label) === 'ot')
            .reduce((s, l) => s + (Number(l.qty) || 0), 0);
          if (otHrs > 0) bump('OT', true);
          if ((calc.lines || []).some(l => /late 1st|l1\b/i.test(l.label))) bump('L1', true, true);
          if ((calc.lines || []).some(l => /missed 2nd|late 2nd/i.test(l.label))) bump('2nd brk', true, true);
          if ((calc.lines || []).some(l => /curtailed/i.test(l.label))) bump('Curtailed', true, true);
          if ((calc.lines || []).some(l => /missed cwd|missed meal/i.test(l.label))) bump('Missed', true, true);
          if (rec?.stepUpRole) bump('Step-up', false);
          if ((Number(rec?.perDiemAmount) || 0) > 0) bump('Per diem', false);
          if ((Number(rec?.kitMoneyAmount) || 0) > 0) bump('Kit', false);
          if (Number(rec?.miles) > 0) bump('Mileage', false);
          if (Number(rec?.travelOutMins) > 0 || Number(rec?.travelBackMins) > 0) bump('Travel', false);
          if ((calc.lines || []).some(l => l.isTOC)) bump('TOC tight', true, true);
        }
        return [...map.entries()].map(([label, v]) => ({ label, count: v.count, warn: v.warn, penalty: v.penalty }));
      }, [crewWithCalcs, production.days, currentDate]);

      const sortedCrew = useMemo(() => {
        const me = crewWithVariances.filter(c => c.isMe);
        const active = crewWithVariances.filter(c => !c.isMe && !c.isOff);
        const off = crewWithVariances.filter(c => !c.isMe && c.isOff);
        return [...me, ...active, ...off];
      }, [crewWithVariances]);

      const activeCrew = crewWithCalcs.filter(c => !c.isOff);
      const grandTotal = activeCrew.reduce((s, c) => s + c.dayTotal, 0);
      const activeCrewCount = activeCrew.length;

      const dayDefaults = getDayDefaults(production, currentDate);
      const firstActiveDay = activeCrew[0]
        ? days.find(d => d.date === currentDate && d.crewId === activeCrew[0].member.id)
        : null;
      // Resolve through the full cascade (DEFAULT_PRODUCTION_DAY ← production.defaultDay
      // ← dayDefaults[date]) so the dept card shows the effective call/wrap/lunch the
      // crew are calc'd with, not just the date-level override (which blanks otherwise).
      const deptBase = { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay ?? {}), ...(dayDefaults ?? {}) };
      const deptCall = deptBase.callTime ?? firstActiveDay?.callTime ?? '';
      const deptWrap = deptBase.wrapTime ?? firstActiveDay?.wrapTime ?? '';
      const deptLunchStart = deptBase.lunchStartTime ?? firstActiveDay?.lunchStartTime ?? '';
      const deptLunchMins = deptBase.lunchDurationMins ?? firstActiveDay?.lunchDurationMins ?? null;
      const deptLunchEnd = deptLunchStart && deptLunchMins != null
        ? addMinutesToTime(deptLunchStart, deptLunchMins)
        : '';

      // Multi-crew WRAP card displays dept defaults; tint reflects what those displayed
      // times imply, not the crew records that may not yet have the defaults applied.
      const defaultsWrapImpliesOT = (() => {
        const callH = parseHHMM(deptCall);
        const wrapH = parseHHMM(deptWrap);
        if (callH === null || wrapH === null) return false;
        const wrapAbs = wrapH <= callH ? wrapH + 24 : wrapH;
        const dayLenHrs = wrapAbs - callH;
        const lunchHrs = (deptLunchMins ?? 60) / 60;
        const workHrs = dayLenHrs - lunchHrs;
        const otThreshold = production.isElevenHourDay ? 11 : 10;
        return workHrs > otThreshold;
      })();

      const currentIdx = sortedDates.indexOf(currentDate);
      const dayNumber = currentIdx >= 0 ? currentIdx + 1 : null;
      const totalDays = sortedDates.length;
      const hasPrev = currentIdx > 0;
      const isAtLastDate = sortedDates.length === 0 || currentIdx >= sortedDates.length - 1;

      const addDenseDay = (date, dayType) => {
        const type = dayType || production.defaultDay?.dayType || 'Shoot';
        const existing = new Set(days.filter(d => d.date === date).map(d => d.crewId));
        const toAdd = crew.filter(m => !existing.has(m.id));
        if (toAdd.length === 0) return;
        setProduction(p => ({
          ...p,
          days: [
            ...(p.days || []),
            ...toAdd.map(m => ({
              ...makeBlankDay(m.id),
              date,
              dayType: type,
              wrapped: !!(date && date < todayISO()),
            })),
          ],
        }));
      };

      const onNextDay = () => {
        if (!isAtLastDate) {
          setCurrentDate(sortedDates[currentIdx + 1]);
          return;
        }
        if (crew.length === 0) {
          showToast?.('Add crew members first');
          return;
        }
        const baseDate = sortedDates.length > 0
          ? sortedDates[sortedDates.length - 1]
          : (production.startDate || todayISO());
        const nextDate = sortedDates.length > 0 ? addDays(baseDate, 1) : baseDate;
        if (sortedDates.includes(nextDate)) return;
        addDenseDay(nextDate);
        setCurrentDate(nextDate);
      };

      const handleReassignDate = (newDate) => {
        if (!newDate || newDate === currentDate) return;
        if (days.some(d => d.date === newDate)) {
          showToast?.('Date already exists in this production');
          return;
        }
        setProduction(p => {
          const newDays = (p.days || []).map(d => d.date === currentDate ? { ...d, date: newDate } : d);
          const newDayDefaults = { ...(p.dayDefaults || {}) };
          if (newDayDefaults[currentDate]) {
            newDayDefaults[newDate] = newDayDefaults[currentDate];
            delete newDayDefaults[currentDate];
          }
          return { ...p, days: newDays, dayDefaults: newDayDefaults };
        });
        setCurrentDate(newDate);
      };

      const recordsForDate = days.filter(d => d.date === currentDate);
      const dayType = getDayDefaults(production, currentDate)?.dayType
                   ?? recordsForDate[0]?.dayType
                   ?? 'Shoot';
      const setDayTypeForDate = (newType) => {
        setProduction(p => setDayDefault(p, currentDate, 'dayType', newType));
      };

      const formattedDate = currentDate
        ? new Date(currentDate + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).toUpperCase()
        : '';
      const dateDow = currentDate ? new Date(currentDate + 'T12:00:00').getDay() : -1;
      const isSat = dateDow === 6;
      const isSun = dateDow === 0;
      const isBH = isBankHoliday(currentDate);
      const dateColorCls = (isSun || isBH) ? 'text-tm-pen' : isSat ? 'text-tm-warn' : 'text-neutral-200';

      const gbp = fmtGBP(grandTotal);
      const dotIdx = gbp.lastIndexOf('.');
      const gbpMain = dotIdx >= 0 ? gbp.slice(0, dotIdx) : gbp;
      const gbpPence = dotIdx >= 0 ? gbp.slice(dotIdx) : '';

      return (
        <div style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
          <div className="px-3 py-3 flex items-center gap-2">
            <button
              onClick={() => hasPrev && setCurrentDate(sortedDates[currentIdx - 1])}
              disabled={!hasPrev}
              className="w-7 h-7 flex items-center justify-center text-neutral-500 disabled:text-neutral-800 hover:text-neutral-200 transition-colors"
              aria-label="Previous day"
              style={{ WebkitTapHighlightColor: 'transparent' }}>
              ‹
            </button>
            <div className="flex-1 flex items-center justify-center gap-2 text-[11px] font-mono uppercase tracking-[0.08em] text-neutral-400">
              {dayNumber !== null ? (
                <span>DAY <b className="text-neutral-200">{dayNumber}</b> / {totalDays}</span>
              ) : (
                <span className="text-neutral-600">NO DAYS YET</span>
              )}
              {recordsForDate.length > 0 && (
                <>
                  <span className="text-neutral-700">·</span>
                  <select
                    value={dayType}
                    onChange={(e) => setDayTypeForDate(e.target.value)}
                    className="bg-tm-card-2 border border-neutral-700 rounded-md px-1.5 py-0.5 text-[11px] font-mono uppercase tracking-wider text-neutral-300 outline-none focus:border-sky-500"
                    style={{ WebkitAppearance: 'none' }}
                  >
                    {DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </>
              )}
              {currentDate && (
                <>
                  <span className="text-neutral-700">·</span>
                  <span className={`relative inline-flex items-center gap-1 ${dateColorCls}`}>
                    <ICal size={11} />
                    <span className="underline decoration-dotted decoration-neutral-700 underline-offset-2">{formattedDate}</span>
                    <input
                      type="date"
                      value={currentDate}
                      onChange={(e) => handleReassignDate(e.target.value)}
                      className="tm-picker-overlay absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                      aria-label="Change date"
                      style={{ WebkitAppearance: 'none' }}
                    />
                  </span>
                  {isBH && (
                    <span className="text-[8px] font-bold uppercase tracking-wider bg-tm-pen/10 text-tm-pen border border-tm-pen/25 rounded px-1 py-0.5" title={getBankHolidayName(currentDate) || 'Bank Holiday'}>BH</span>
                  )}
                </>
              )}
            </div>
            <button
              onClick={onNextDay}
              className="w-7 h-7 flex items-center justify-center text-neutral-500 hover:text-neutral-200 transition-colors"
              aria-label={isAtLastDate ? 'Add new day' : 'Next day'}
              title={isAtLastDate ? 'Add new day' : 'Next day'}
              style={{ WebkitTapHighlightColor: 'transparent' }}>
              {isAtLastDate ? '+' : '›'}
            </button>
          </div>

          <div className="mx-4 mt-2 mb-4 bg-neutral-900 border border-neutral-800 rounded-2xl px-4 pt-4 pb-3.5">
            <div className="text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-bold mb-1.5">
              TODAY · ALL CREW <span className="text-sky-500 ml-1.5">{activeCrewCount} ACTIVE</span>
            </div>
            <div className="font-mono text-[36px] font-bold leading-none text-neutral-100 tabular-nums tracking-tight">
              {gbpMain}<span className="text-[18px] text-neutral-400 font-medium">{gbpPence}</span>
            </div>
            <HeroBreakdownRow basic={dayBuckets.basic} ot={dayBuckets.ot} pen={dayBuckets.pen}/>
          </div>

          <div className="px-4 mb-2.5 flex items-center gap-2">
            <span className="text-[10px] uppercase tracking-[0.22em] text-sky-500 font-bold">DEPT DEFAULTS</span>
            <span className="flex-1 h-px bg-neutral-800/60"/>
          </div>

          <div className="px-4 grid grid-cols-2 gap-2 mb-2">
            <div className="relative bg-neutral-900 border border-neutral-800 rounded-xl px-3.5 py-3">
              <div className="text-[10px] uppercase tracking-wider text-neutral-500 font-bold">CALL</div>
              <div className="font-mono text-[26px] font-bold text-neutral-100 tabular-nums leading-none mt-1.5">
                {deptCall || <span className="text-neutral-500 text-base font-sans font-medium">Tap to set</span>}
              </div>
              <input
                type="time"
                value={deptCall || ''}
                onChange={(e) => setProduction(p => setDayDefault(p, currentDate, 'callTime', e.target.value))}
                onClick={(e) => { try { e.currentTarget.showPicker?.(); } catch {} }}
                className="tm-picker-overlay absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                aria-label="Edit call time"
                style={{ WebkitAppearance: 'none' }}
              />
            </div>
            <div className={`relative border rounded-xl px-3.5 py-3 ${defaultsWrapImpliesOT ? 'bg-tm-warn/[0.08] border-tm-warn/45' : 'bg-neutral-900 border-neutral-800'}`}>
              <div className={`text-[10px] uppercase tracking-wider font-bold ${defaultsWrapImpliesOT ? 'text-tm-warn' : 'text-neutral-500'}`}>WRAP{defaultsWrapImpliesOT ? ' · OT' : ''}</div>
              <div className="font-mono text-[26px] font-bold text-neutral-100 tabular-nums leading-none mt-1.5">
                {deptWrap || <span className="text-neutral-500 text-base font-sans font-medium">Tap to set</span>}
              </div>
              <input
                type="time"
                value={deptWrap || ''}
                onChange={(e) => setProduction(p => setDayDefault(p, currentDate, 'wrapTime', e.target.value))}
                onClick={(e) => { try { e.currentTarget.showPicker?.(); } catch {} }}
                className="tm-picker-overlay absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                aria-label="Edit wrap time"
                style={{ WebkitAppearance: 'none' }}
              />
            </div>
          </div>

          <div className="px-4 mb-2">
            <button
              type="button"
              onClick={() => setShowLunchSheet(true)}
              className={`w-full border rounded-xl px-3.5 py-3 flex items-center gap-3 text-left transition-colors flex-wrap ${(anyCrewLunchLate || anyCrewLunchCurtailed) ? 'bg-tm-pen/[0.04] border-tm-pen/30 hover:border-tm-pen/50' : 'bg-neutral-900 border-neutral-800 hover:border-neutral-700'}`}
              style={{ WebkitTapHighlightColor: 'transparent' }}
            >
              <div className={`text-[10px] uppercase tracking-wider font-bold ${(anyCrewLunchLate || anyCrewLunchCurtailed) ? 'text-tm-pen' : 'text-neutral-500'}`}>LUNCH</div>
              {deptLunchStart ? (
                <>
                  <div className="font-mono text-sm text-neutral-100 tabular-nums">{deptLunchStart} → {deptLunchEnd || '—'}</div>
                  {anyCrewLunchLate && (
                    <span className="text-[9px] font-bold uppercase tracking-wider text-tm-pen bg-tm-pen/10 border border-tm-pen/25 rounded px-1.5 py-0.5">LUNCH LATE</span>
                  )}
                  {anyCrewLunchCurtailed && (
                    <span className="text-[9px] font-bold uppercase tracking-wider text-tm-pen bg-tm-pen/10 border border-tm-pen/25 rounded px-1.5 py-0.5">CURTAILED</span>
                  )}
                  {deptLunchMins !== null && <div className="text-[11px] text-neutral-500 font-mono ml-auto">{deptLunchMins} mins</div>}
                </>
              ) : (
                <span className="text-neutral-500 text-sm">Tap to set</span>
              )}
            </button>
          </div>

          <div className="px-4 mb-3 flex gap-2">
            {(() => {
              const nowHHMM = () => {
                const d = new Date();
                const mins = d.getHours() * 60 + d.getMinutes();
                const rounded = Math.round(mins / 5) * 5;
                const h = Math.floor(rounded / 60) % 24;
                const m = rounded % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
              };
              const handleLunchNow = () => {
                const t = nowHHMM();
                setProduction(p => setDayDefault(p, currentDate, 'lunchStartTime', t));
                showToast?.(`Lunch set to ${t}`);
              };
              const handleWrapNow = () => {
                const t = nowHHMM();
                setProduction(p => setDayDefault(p, currentDate, 'wrapTime', t));
                showToast?.(`Wrap set to ${t}`);
              };
              const btnCls = "flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-sky-500/10 border border-sky-500/30 text-sky-400 text-[10px] font-bold uppercase tracking-[0.14em] hover:bg-sky-500/15 transition-colors";
              return (
                <>
                  <button type="button" onClick={handleLunchNow} className={btnCls} style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <ICheck size={11}/>Lunch now
                  </button>
                  <button type="button" onClick={handleWrapNow} className={btnCls} style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <ICheck size={11}/>Wrap now
                  </button>
                </>
              );
            })()}
          </div>

          {(() => {
            const dd = production.dayDefaults?.[currentDate] || {};
            const preCallSet = !!dd.preCallTime;
            const mileageSet = (Number(dd.miles) || 0) > 0 || !!(dd.mileagePostcode || '').trim();
            const travelSet = (Number(dd.travelOutMins) || 0) > 0 || (Number(dd.travelBackMins) || 0) > 0;
            const perDiemSet = (Number(dd.perDiemAmount) || 0) > 0;
            const expensesSet = (dd.expenses?.length ?? 0) > 0;
            const expensesTotalDD = (dd.expenses || []).reduce((s, e) => s + (Number(e.amount) || 0), 0);
            return (
              <>
                <div className="flex items-center gap-2 mt-2 mb-3 px-4">
                  <span className="text-[10px] uppercase tracking-[0.22em] text-sky-500 font-bold">EXTRAS</span>
                  <span className="flex-1 h-px bg-neutral-800/60"/>
                </div>
                <div className="flex flex-wrap gap-2 mb-4 px-4">
                  <ExtraChip label="Pre-call" isSet={preCallSet} summary={preCallSet ? (dd.preCallTime || 'on') : null} onTap={() => toggleDeptExtra('preCall')}/>
                  <ExtraChip label="Mileage" isSet={mileageSet} summary={mileageSet ? `${Number(dd.miles) || 0} mi` : null} onTap={() => toggleDeptExtra('mileage')}/>
                  <ExtraChip label="Travel" isSet={travelSet} summary={travelSet ? `${Number(dd.travelOutMins) || 0}+${Number(dd.travelBackMins) || 0}m` : null} onTap={() => toggleDeptExtra('travel')}/>
                  <ExtraChip label="Per diem" isSet={perDiemSet} summary={perDiemSet ? fmtGBP(Number(dd.perDiemAmount) || 0) : null} onTap={() => toggleDeptExtra('perDiem')}/>
                  <ExtraChip label="Expenses" isSet={expensesSet} summary={expensesSet ? fmtGBP(expensesTotalDD) : null} onTap={() => toggleDeptExtra('expenses')}/>
                </div>

                {(() => {
                  if (expandedDeptExtras.size === 0) return null;
                  const close = (key) => setExpandedDeptExtras(prev => { const n = new Set(prev); n.delete(key); return n; });
                  const setRef = (key) => (el) => { deptExtraRefs.current[key] = el; };
                  const DToggleRow = ({ label, value, onChange, ariaLabel }) => (
                    <div className="flex items-center justify-between mb-3 px-1">
                      <span className="text-sm text-neutral-300">{label}</span>
                      <Toggle value={value} onChange={onChange} ariaLabel={ariaLabel}/>
