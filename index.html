    function ProductionsScreen({ productions, onOpen, onNewProduction, onDelete, onDuplicate, onUpdateDays, onOpenSettings, onOpenStats, userPrefs, onUpdateInvoice, onDeleteInvoice, homeTab, setHomeTab }) {
      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };
      const [confirmOpts, setConfirmOpts] = useState(null);
      const [actionSheet, setActionSheet] = useState(null);
      const [showCancellationCalc, setShowCancellationCalc] = useState(false);
      const [calcProd, setCalcProd] = useState(() => ({ title: "", startDate: new Date().toISOString().slice(0, 10), cancellationData: null }));
      const [calcCrew, setCalcCrew] = useState(() => {
        const name = userPrefs?.displayName?.trim() || "";
        if (!name) return [];
        return [{ id: uid(), name, role: userPrefs?.defaultRole || "Crew", bdr: Number(userPrefs?.defaultBDR) || 0, isDefaultUser: true }];
      });
      const [searchOpen, setSearchOpen] = useState(false);
      const [query, setQuery] = useState("");
      const searchInputRef = useRef(null);
const confirmDelete = (p) => setConfirmOpts({
        title: "Delete production?",
        message: `Delete "${p.title || 'Untitled Production'}"? This cannot be undone.`,
        confirmLabel: "Delete",
        confirmTone: "danger",
        onConfirm: () => onDelete(p.id),
      });
      const todayStr = new Date().toISOString().slice(0, 10);
      const displayName = userPrefs?.displayName?.trim() || "";

      // Per-production totals
      const productionTotals = useMemo(() => {
        const totals = {};
        for (const p of productions) {
          const crew = p.crew ?? [];
          const days = p.days ?? [];
          totals[p.id] = days.reduce((sum, d) => {
            const c = crew.find(cc => cc.id === d.crewId);
            if (!c) return sum;
            return sum + calcForDisplay(p, d, c, findPrevDay(days, d)).total;
          }, 0);
        }
        return totals;
      }, [productions]);

      const sortKey = (p) => {
        if (p.startDate) return p.startDate;
        const dates = (p.days ?? []).map(d => d.date).filter(Boolean).sort();
        return dates.length > 0 ? dates[0] : null;
      };
      const monthLabel = (key) => {
        if (!key) return "No Date";
        return new Date(key + "T12:00:00").toLocaleString("default", { month: "long", year: "numeric" });
      };

      const sorted = [...productions].sort((a, b) => {
        const ka = sortKey(a), kb = sortKey(b);
        if (ka === kb) return 0; if (!ka) return 1; if (!kb) return -1;
        return ka < kb ? 1 : -1;
      });

      const currentShoot = sorted.find(p => (p.days ?? []).some(d => d.date === todayStr)) || null;

      const groups = [];
      for (const p of sorted) {
        const label = monthLabel(sortKey(p));
        const last = groups[groups.length - 1];
        if (last && last.label === label) last.items.push(p);
        else groups.push({ label, items: [p] });
      }

      // Month totals include current shoot even though it's pinned above groups
      const groupsDisplay = groups.map(g => ({
        label: g.label,
        monthTotal: g.items.reduce((sum, p) => sum + (productionTotals[p.id] || 0), 0),
        items: g.items.filter(p => p.id !== currentShoot?.id),
      })).filter(g => g.items.length > 0);

      useEffect(() => {
        if (searchOpen && searchInputRef.current) searchInputRef.current.focus();
      }, [searchOpen]);

      const trimmedQuery = query.trim().toLowerCase();
      const matchesProduction = (p, q) => {
        if (!q) return true;
        if ((p.title || "").toLowerCase().includes(q)) return true;
        if ((p.prodCo || "").toLowerCase().includes(q)) return true;
        if ((p.jobReference || "").toLowerCase().includes(q)) return true;
        if ((p.crew ?? []).some(c => (c.name || "").toLowerCase().includes(q))) return true;
        if ((p.days ?? []).some(d => (d.note || "").toLowerCase().includes(q))) return true;
        return false;
      };
      const filteredSorted = trimmedQuery ? sorted.filter(p => matchesProduction(p, trimmedQuery)) : [];

      const renderCard = (p, opts = {}) => {
        const isCurrent = opts.isCurrent || false;
        const cardSetDays = (updater) => onUpdateDays(p.id, updater);
        const hasToday = (p.days ?? []).some(d => d.date === todayStr);
        const bestBoyBadge = p.bestBoyMode ? <span className="flex-shrink-0 inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-medium text-sky-400 bg-sky-400/10 border border-sky-400/30">Best Boy</span> : null;
        const invStatus = getProductionInvoiceStatus(p);
        const invChip = invStatus ? <span className={`flex-shrink-0 inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-bold border ${toneClasses(invStatus.tone)}`}>{invStatus.label}</span> : null;
        const metaText = p.prodCo || `${(p.days ?? []).length} day${(p.days ?? []).length !== 1 ? 's' : ''}`;
        const wrapperClass = "bg-neutral-900 border border-neutral-800 rounded-[12px] overflow-hidden active:bg-neutral-800 transition-colors cursor-pointer select-none touch-manipulation";

        if (isCurrent) {
          return (
            <div key={p.id} onClick={() => onOpen(p.id)} style={{ WebkitTapHighlightColor: 'transparent' }} className={wrapperClass}>
              <div className="p-4">
                <div className="mb-3">
                  <div className="flex items-center gap-2 mb-1">
                    <h3 className="truncate text-base font-semibold">{p.title || <span className="text-neutral-500 italic">Untitled</span>}</h3>
                    {bestBoyBadge}
                    {invChip}
                  </div>
                  <div className="text-sm text-neutral-400 truncate">{metaText}</div>
                  <div className="text-lg font-bold font-mono text-neutral-100 mt-2">{fmtGBP(productionTotals[p.id] || 0)}</div>
                </div>
                <div className="border-t border-neutral-800 -mx-4" />
                <div className="flex items-center justify-center gap-2 pt-3" onClick={e => e.stopPropagation()}>
                  {hasToday && <LunchNowBtn days={p.days ?? []} setDays={cardSetDays} showToast={showToast} />}
                  {hasToday && <WrapNowBtn days={p.days ?? []} setDays={cardSetDays} showToast={showToast} />}
                  <button
                    onClick={(e) => { e.stopPropagation(); setActionSheet(p); }}
                    className="text-neutral-600 hover:text-neutral-400 transition-colors rounded-lg hover:bg-neutral-800 ml-auto flex items-center justify-center"
                    style={{ minWidth: 44, minHeight: 44 }}
                    aria-label="Production options"
                    title="Production options"
                  ><IKebab size={16}/></button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div key={p.id} onClick={() => onOpen(p.id)} style={{ WebkitTapHighlightColor: 'transparent' }} className={wrapperClass}>
            <div className="flex items-center gap-3 p-4">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-1">
                  <h3 className="truncate text-base font-semibold">{p.title || <span className="text-neutral-500 italic">Untitled</span>}</h3>
                  {bestBoyBadge}
                  {invChip}
                </div>
                <div className="text-sm text-neutral-400 truncate">{metaText}</div>
                <div className="text-base font-bold font-mono text-neutral-100 mt-2">{fmtGBP(productionTotals[p.id] || 0)}</div>
              </div>
              <div className="flex-shrink-0 flex items-center gap-2" onClick={e => e.stopPropagation()}>
                {hasToday && (
                  <>
                    <LunchNowBtn days={p.days ?? []} setDays={cardSetDays} showToast={showToast} />
                    <WrapNowBtn days={p.days ?? []} setDays={cardSetDays} showToast={showToast} />
                  </>
                )}
                <button
                  onClick={(e) => { e.stopPropagation(); setActionSheet(p); }}
                  className="text-neutral-600 hover:text-neutral-400 transition-colors rounded-lg hover:bg-neutral-800 flex items-center justify-center"
                  style={{ minWidth: 44, minHeight: 44 }}
                  aria-label="Production options"
                  title="Production options"
                ><IKebab size={16}/></button>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100 pb-32">
          {/* Inline (non-sticky) header */}
          <div style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-6xl mx-auto px-4 pt-6 pb-2 flex items-start justify-between">
              <div>
                {displayName && <div className="text-[11px] uppercase tracking-[0.2em] text-neutral-500 font-bold mb-1">{displayName}'s</div>}
                <h1 className="text-2xl sm:text-3xl font-black uppercase tracking-tight leading-none text-sky-400">TIMEMACHINE</h1>
              </div>
              <div className="flex items-center gap-1 mt-1">
                <button onClick={onOpenStats} className="text-neutral-400 hover:text-neutral-200 transition-colors p-2 sm:p-3 rounded-full hover:bg-neutral-800" title="Stats" aria-label="Stats">
                  <IStats size={20}/>
                </button>
                <button onClick={() => { if (searchOpen) { setSearchOpen(false); setQuery(""); } else { setSearchOpen(true); } }} className={`transition-colors p-2 sm:p-3 rounded-full hover:bg-neutral-800 ${searchOpen ? "text-sky-400" : "text-neutral-400 hover:text-neutral-200"}`} title="Search" aria-label="Search">
                  <ISearch size={20}/>
                </button>
                <button onClick={() => setShowCancellationCalc(true)} className="text-neutral-400 hover:text-neutral-200 transition-colors p-2 sm:p-3 rounded-full hover:bg-neutral-800" title="Cancellation Calculator" aria-label="Cancellation Calculator">
                  <ICalc size={20}/>
                </button>
                <button onClick={onOpenSettings} className="text-neutral-400 hover:text-neutral-200 transition-colors p-2 sm:p-3 rounded-full hover:bg-neutral-800" title="Settings" aria-label="Settings">
                  <IGear size={20}/>
                </button>
              </div>
            </div>
            {/* Home tab strip */}
            <div className="max-w-6xl mx-auto px-4 pt-1 pb-3">
              <div className="inline-flex rounded-lg bg-neutral-800 p-0.5">
                {[{ k: "productions", label: "Productions", I: IBriefcase }, { k: "invoices", label: "Invoices", I: IReceipt }].map(({ k, label, I }) => (
                  <button key={k} onClick={() => setHomeTab(k)}
                    className={`inline-flex items-center gap-1.5 px-4 py-1.5 rounded-md text-[11px] uppercase tracking-[0.15em] font-bold whitespace-nowrap transition-colors duration-150 ${homeTab === k ? "bg-sky-400 text-black" : "text-neutral-400 hover:text-neutral-200"}`}>
                    <I size={11}/>{label}
                  </button>
                ))}
              </div>
            </div>

            {searchOpen && homeTab === "productions" && (
              <div className="max-w-6xl mx-auto px-4 pb-3">
                <div className="flex items-center gap-2 bg-neutral-900 border border-neutral-700 rounded-xl px-3 py-2.5">
                  <ISearch size={15} className="text-neutral-500 flex-shrink-0"/>
                  <input
                    ref={searchInputRef}
                    type="text"
                    value={query}
                    onChange={e => setQuery(e.target.value)}
                    placeholder="Search shoots, crew, notes…"
                    className="flex-1 bg-transparent text-sm text-neutral-100 placeholder-neutral-600 focus:outline-none"
                  />
                  {query && (
                    <button type="button" onClick={() => setQuery("")} className="text-neutral-500 hover:text-neutral-300 flex-shrink-0 transition-colors" aria-label="Clear search">
                      <IX size={15}/>
                    </button>
                  )}
                </div>
              </div>
            )}
          </div>

          {homeTab === "invoices" ? (
            <AllInvoicesView productions={productions} onOpenInvoice={(productionId, invoiceId) => onOpen(productionId, { invoiceId })} onUpdateInvoice={onUpdateInvoice} onDeleteInvoice={onDeleteInvoice} showToast={showToast} />
          ) : (
          <div className="max-w-6xl mx-auto px-4">
            <h2 className="text-2xl font-bold tracking-tight mb-6 mt-2">Shoots</h2>

            {trimmedQuery ? (
              /* Search results */
              filteredSorted.length === 0 ? (
                <div className="py-12 text-center">
                  <div className="flex justify-center mb-4 text-neutral-700"><ISearch size={48}/></div>
                  <h3 className="text-xl font-semibold mb-2">No matches</h3>
                  <p className="text-sm text-neutral-400">Try a different search term</p>
                </div>
              ) : (
                <div className="space-y-2">
                  {filteredSorted.map(renderCard)}
                </div>
              )
            ) : (
              <>
                {/* Empty state */}
                {productions.length === 0 && (
                  <div className="py-12 text-center">
                    <div className="flex justify-center mb-4 text-neutral-700"><ICal size={48}/></div>
                    <h3 className="text-xl font-semibold mb-2">No shoots yet</h3>
                    <p className="text-sm text-neutral-400 mb-6">Create your first production to get started</p>
                    <Btn variant="primary" onClick={onNewProduction}><IPlus/>New Production</Btn>
                  </div>
                )}

                {/* Current shoot pinned at top */}
                {currentShoot && (
                  <div className="mb-6">
                    <div className="text-[11px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-2">Current Shoot</div>
                    {renderCard(currentShoot, { isCurrent: true })}
                  </div>
                )}

                {/* Month groups */}
                <div className="space-y-8">
                  {groupsDisplay.map(({ label, items, monthTotal }) => (
                    <div key={label}>
                      <div className="flex items-baseline justify-between mb-3">
                        <div className="text-sm uppercase tracking-[0.15em] font-bold text-sky-400">{label}</div>
                        <div className="text-base font-bold font-mono text-sky-400">{fmtGBP(monthTotal)}</div>
                      </div>
                      <div className="space-y-2">
                        {items.map(renderCard)}
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
          )} {/* end homeTab === "productions" */}

          {/* Floating action button — only on Productions tab */}
          {homeTab === "productions" && (
            <button
              onClick={onNewProduction}
              className="fixed z-30 bg-sky-400 text-black rounded-full shadow-lg hover:bg-sky-300 active:bg-sky-500 transition-colors flex items-center justify-center"
              style={{ width: 56, height: 56, bottom: 'calc(env(safe-area-inset-bottom) + 24px)', right: 24 }}
              title="New Production"
              aria-label="New Production"
            >
              <IPlus size={24}/>
            </button>
          )}

          <Toast show={!!toastMsg}>{toastMsg}</Toast>

          {/* Production action sheet (kebab menu) */}
          {actionSheet && (
            <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
                 style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
                 onClick={() => setActionSheet(null)}>
              <div className="bg-neutral-900 w-full rounded-t-[16px] sm:rounded-[16px] shadow-2xl border border-neutral-700 overflow-hidden"
                   style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
                <div className="px-5 pt-5 pb-3">
                  <div className="text-sm font-bold text-neutral-100 truncate">{actionSheet.title || 'Untitled Production'}</div>
                </div>
                <div className="px-4 pb-4 flex flex-col gap-2">
                  <button type="button"
                    onClick={() => { const p = actionSheet; setActionSheet(null); onDuplicate(p); showToast("Duplicated — edit the copy"); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <ICopy size={15}/>Duplicate
                  </button>
                  <button type="button"
                    onClick={async () => {
                      const p = actionSheet;
                      setActionSheet(null);
                      const pCrew = p.crew ?? [];
                      const pDays = p.days ?? [];
                      let text;
                      if (p.bestBoyMode) {
                        const parts = pCrew.map(c => generateCrewText(c, pDays.filter(d => d.crewId === c.id), p));
                        text = parts.join('\n\n—\n\n');
                      } else {
                        const c = pCrew[0];
                        if (!c) { showToast("No crew member"); return; }
                        text = generateCrewText(c, pDays, p);
                      }
                      const r = await shareTextOrCopy(text, p.title || 'Timesheet');
                      if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
                    }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IShare size={15}/>Share Times
                  </button>
                  <button type="button"
                    onClick={() => { const p = actionSheet; setActionSheet(null); confirmDelete(p); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-red-400 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <ITrash size={15}/>Delete
                  </button>
                </div>
                <div className="px-4 pb-5 pt-1 border-t border-neutral-800">
                  <button type="button" onClick={() => setActionSheet(null)}
                    className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          {showCancellationCalc && (
            <CancellationCalcModal
              production={calcProd}
              setProduction={setCalcProd}
              crew={calcCrew}
              setCrew={setCalcCrew}
              userPrefs={userPrefs}
              onClose={() => setShowCancellationCalc(false)}
            />
          )}

          <ConfirmDialog
            open={!!confirmOpts}
            title={confirmOpts?.title}
            message={confirmOpts?.message}
            confirmLabel={confirmOpts?.confirmLabel || "Confirm"}
            confirmTone={confirmOpts?.confirmTone || "danger"}
            cancelLabel="Cancel"
            onConfirm={() => { const f = confirmOpts?.onConfirm; setConfirmOpts(null); if (f) f(); }}
            onCancel={() => setConfirmOpts(null)}
          />
        </div>
      );
    }

    /* ═══════════════════════════ ROOT ═══════════════════════════ */

    function Root() {
      const [productions, setProductions] = useStoredState("bigals_productions", [], migrateProduction);
      const [userPrefs, setUserPrefs] = useStoredState("bigals_user_prefs", DEFAULT_USER_PREFS);
      const [openId, setOpenId] = useState(null);
      const [showSettings, setShowSettings] = useState(false);
      const [showStats, setShowStats] = useState(false);
      const [showNewProduction, setShowNewProduction] = useState(false);

      // Treat existing users (stored prefs without onboardingComplete) as already onboarded
      useEffect(() => {
        setUserPrefs(p => p.onboardingComplete === undefined ? { ...p, onboardingComplete: true } : p);
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      // One-time migration: absorb all old localStorage keys into the productions array
      useEffect(() => {
        try {
          if (productions.length > 0) return;
          const oldProd = localStorage.getItem("bigals_production");
          const oldCrew = localStorage.getItem("bigals_crew");
          const oldDays = localStorage.getItem("bigals_days");
          if (oldProd || oldCrew || oldDays) {
            let p = oldProd ? JSON.parse(oldProd) : { title: "", prodCo: "", crew: [], days: [] };
            if (!p.crew?.length && oldCrew) p.crew = JSON.parse(oldCrew).map(migrateCrew);
            if (!p.days?.length && oldDays) p.days = JSON.parse(oldDays).map(migrateDay);
            if (!p.defaultDay) p.defaultDay = DEFAULT_PRODUCTION_DAY;
            setProductions([{ id: uid(), ...p }]);
            localStorage.removeItem("bigals_production");
            localStorage.removeItem("bigals_crew");
            localStorage.removeItem("bigals_days");
          }
        } catch {}
      }, []); // runs once on mount only

      const [openInvoiceId, setOpenInvoiceId] = useState(null);
      const [homeTab, setHomeTab] = useState("productions");
      const openProduction = (id, options = {}) => { setOpenId(id); setOpenInvoiceId(options.invoiceId || null); };
      const closeProduction = () => { setOpenId(null); setOpenInvoiceId(null); };
      const handleUpdateInvoice = (productionId, invoiceId, patch) => {
        setProductions(prev => prev.map(p => p.id !== productionId ? p : {
          ...p, invoices: (p.invoices || []).map(inv => inv.id === invoiceId ? { ...inv, ...patch } : inv),
        }));
      };
      const handleDeleteInvoice = (productionId, invoiceId) => {
        setProductions(prev => prev.map(p => p.id !== productionId ? p : {
          ...p, invoices: (p.invoices || []).filter(inv => inv.id !== invoiceId),
        }));
      };
      const deleteProduction = (id) => {
        setProductions((prev) => prev.filter((p) => p.id !== id));
        if (openId === id) setOpenId(null);
      };
      const duplicateProduction = (p) => {
        const newId = uid();
        const copy = { ...p, id: newId, title: `${p.title || 'Untitled Production'} (copy)`, days: [], weekStarts: [], gridDates: [] };
        setProductions(prev => [...prev, copy]);
        setOpenId(newId);
      };
      const handleNewProduction = ({ title, bestBoyMode }) => {
        const role = userPrefs.defaultRole || "Lighting Technician";
        const roleDefaults = ROLE_DEFAULTS[role] || {};
        const bdr = userPrefs.defaultBDR || roleDefaults.bdr || 0;
        const otCoef = userPrefs.defaultOTCoef ?? roleDefaults.otCoef ?? 1.5;
        const soloCrew = bestBoyMode ? [] : [{
          id: uid(),
          name: userPrefs.displayName || "You",
          role,
          bdr,
          otCoef,
          otRate: roleDefaults.otRate ?? null,
          vatRegistered: userPrefs.vatRegistered ?? false,
          vatRate: userPrefs.vatRate ?? 20,
          kitMoneyEnabled: userPrefs.defaultKitMoneyEnabled ?? false,
          kitMoneyAmount: userPrefs.defaultKitMoneyAmount ?? 0,
          isDriver: false,
        }];
        const p = {
          id: uid(),
          title,
          prodCo: "",
          jobReference: "",
          invoicingEmail: "",
          crew: soloCrew,
          days: [],
          defaultDay: DEFAULT_PRODUCTION_DAY,
          bestBoyMode,
          isElevenHourDay: false,
          favourableRounding: userPrefs.favourableRounding ?? false,
          apaRounding: userPrefs.apaRounding ?? false,
          startDate: todayISO(),
          isNew: true,
        };
        setProductions((prev) => [...prev, p]);
        setOpenId(p.id);
        setShowNewProduction(false);
      };
      const setProduction = (updater) =>
        setProductions((prev) => prev.map((p) =>
          p.id === openId ? (typeof updater === "function" ? updater(p) : updater) : p
        ));

      const handleExport = () => {
        const date = new Date().toISOString().slice(0, 10);
        const payload = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), productions }, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `derricks-timemachine-backup-${date}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const handleImport = (parsed) => {
        setProductions(parsed);
      };

      const handleUpdateDays = (id, updater) => {
        setProductions(prev => prev.map(p =>
          p.id === id
            ? { ...p, days: typeof updater === 'function' ? updater(p.days ?? []) : updater }
            : p
        ));
      };

      const handleResetAll = () => {
        localStorage.removeItem("bigals_productions");
        localStorage.removeItem("bigals_user_prefs");
        window.location.reload();
      };

      const currentProduction = productions.find((p) => p.id === openId);

      if (!userPrefs.onboardingComplete) {
        return (
          <OnboardingScreen
            userPrefs={userPrefs}
            set={(updates) => setUserPrefs(prev => ({ ...prev, ...updates }))}
            onComplete={() => {}}
          />
        );
      }

      if (showSettings) {
        return (
          <SettingsScreen
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            onClose={() => setShowSettings(false)}
            onExport={handleExport}
            onImport={handleImport}
            onResetAll={handleResetAll}
            productionCount={productions.length}
          />
        );
      }
      if (showStats) {
        return <StatsScreen productions={productions} userPrefs={userPrefs} onClose={() => setShowStats(false)} onOpenSettings={() => { setShowStats(false); setShowSettings(true); }} />;
      }
      if (showNewProduction) {
        return (
          <NewProductionScreen
            userPrefs={userPrefs}
            onCreate={handleNewProduction}
            onCancel={() => setShowNewProduction(false)}
          />
        );
      }
      if (!openId || !currentProduction) {
        return <ProductionsScreen productions={productions} onOpen={openProduction} onNewProduction={() => setShowNewProduction(true)} onDelete={deleteProduction} onDuplicate={duplicateProduction} onUpdateDays={handleUpdateDays} onOpenSettings={() => setShowSettings(true)} onOpenStats={() => setShowStats(true)} userPrefs={userPrefs} onUpdateInvoice={handleUpdateInvoice} onDeleteInvoice={handleDeleteInvoice} homeTab={homeTab} setHomeTab={setHomeTab} />;
      }
      if (!currentProduction.bestBoyMode) {
        return <SoloDayPage
          production={currentProduction}
          setProduction={setProduction}
          onBack={closeProduction}
          onDeleteProduction={() => {
            setProductions(prev => prev.filter(p => p.id !== currentProduction.id));
            setOpenId(null);
          }}
          userPrefs={userPrefs}
          setUserPrefs={setUserPrefs}
          initialInvoiceId={openInvoiceId}
        />;
      }
      return <ProductionApp production={currentProduction} setProduction={setProduction} onBack={closeProduction} userPrefs={userPrefs} setUserPrefs={setUserPrefs} initialInvoiceId={openInvoiceId} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>
</html>
