                <Input value={production.invoicingEmail || ""} onChange={set("invoicingEmail")} placeholder="e.g. accounts@minds-eye.tv" />
              </Field>
            </SectionCard>

            <SectionCard title="Mode">
              <div>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Best Boy mode</span>
                  <Toggle value={production.bestBoyMode} onChange={(v) => setProduction(p => ({ ...p, bestBoyMode: v }))} ariaLabel="Best Boy mode" />
                </div>
                <p className="text-[11px] text-neutral-500 mt-1">Manage a crew with the grid view. Turn off for solo use.</p>
                <p className="text-[10px] text-neutral-600 mt-0.5 leading-tight">"Best Boy" is the industry term for the assistant to a department head (e.g., Gaffer's Best Boy in lighting, Key Grip's Best Boy in the grip department).</p>
                {production.bestBoyMode && crew.length <= 1 && (
                  <StatusMsg kind="info">You'll need to add additional crew members in Crew Manager.</StatusMsg>
                )}
                {!production.bestBoyMode && crew.length > 1 && (
                  <StatusMsg kind="warn">You have {crew.length} crew members. Disabling Best Boy mode hides the grid but keeps your crew data — you can re-enable any time.</StatusMsg>
                )}
              </div>
              <div>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">11-Hour Day</span>
                  <Toggle value={production.isElevenHourDay} onChange={(v) => setProduction(p => ({ ...p, isElevenHourDay: v }))} ariaLabel="11-Hour Day" />
                </div>
                <p className="text-[11px] text-neutral-500 mt-1">1h of overtime included in the day rate. OT applies after 11h worked instead of 10h.</p>

            <SectionCard title="Weekend rate overrides">
              <p className="text-[11px] text-neutral-500 -mt-1">App applies APA standard rates by default. Toggle on to override.</p>
              <div>
                <div className="flex items-center justify-between gap-3">

                    <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Saturday rate</span>

                  </div>
                  <Toggle
                    value={(production.satRateMode || "apa") === "custom"}
                    onChange={(v) => setProduction(p => ({ ...p, satRateMode: v ? "custom" : "apa", satRateCustom: p.satRateCustom ?? 1.5 }))}
                    ariaLabel="Custom Saturday rate"

                </div>

            {!production.bestBoyMode && (production.crew ?? []).length > 0 && (() => {
              const m = production.crew[0];
              const setSoloField = (k) => (e) => setProduction(p => ({ ...p, crew: p.crew.map((c, i) => i === 0 ? { ...c, [k]: e.target.value } : c) }));

                  {m.kitMoneyEnabled && (
                    <Field label="Kit Money Amount (£)" hint="Added to each working day">

          </div>

    /* ═══════════════════════════ CALC BREAKDOWN VIEW ═══════════════════════════ */

    function CalcBreakdownView({ production, days, crew, total, onClose, onExportPDF, onExportText, onPickDay, onGenerateInvoice }) {
      const sorted = useMemo(() => [...days].sort((a, b) => {
        const dc = a.date.localeCompare(b.date);
        return dc !== 0 ? dc : (a.crewId > b.crewId ? 1 : -1);
      }), [days]);

      return (
        <div style={{ position: 'fixed', inset: 0, zIndex: 60, background: '#0a0a0a', display: 'flex', flexDirection: 'column' }}>
          <div style={{ borderBottom: '1px solid #262626', padding: '12px 16px', paddingTop: 'calc(env(safe-area-inset-top) + 12px)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
            <div>
              <div style={{ fontSize: 13, fontWeight: 700, color: '#f5f5f5', textTransform: 'uppercase', letterSpacing: '0.12em' }}>Breakdown</div>
              {production.title && <div style={{ fontSize: 11, color: '#737373', marginTop: 2 }}>{production.title}</div>}
            </div>
            <button onClick={onClose} style={{ color: '#a3a3a3', padding: 8, borderRadius: 8, WebkitTapHighlightColor: 'transparent' }} aria-label="Close"><IX size={18}/></button>
          </div>

                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                      <span style={{ fontWeight: 700, fontSize: 13, color: '#f5f5f5' }}>{fmtDateShort(d.date)}</span>
                      <span style={{ color: '#737373', fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.1em' }}>{weekday(d.date)}</span>
                      {production.bestBoyMode && <span style={{ color: '#a3a3a3', fontSize: 11 }}>{c.name}</span>}
                    </div>
                    <span style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: 13, color: '#f5f5f5' }}>{fmtGBP(calc.total)}</span>

                  {lineItems}

            <div style={{ padding: '14px 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontSize: 11, color: '#737373', textTransform: 'uppercase', letterSpacing: '0.12em' }}>Shoot Total</span>
              <span style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: 20, color: '#f5f5f5' }}>{fmtGBP(total)}</span>
            </div>
            {(onGenerateInvoice || onExportPDF || onExportText) && (
              <div style={{ borderTop: '1px solid #1a1a1a', padding: '12px 16px', display: 'flex', gap: 8 }}>
                {onGenerateInvoice && (
                  <button type="button" onClick={onGenerateInvoice}
                    className="flex-1 flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-sky-900/40 hover:bg-sky-900/60 border border-sky-700/40 transition-colors text-sm font-semibold text-sky-300"
                    style={{ minHeight: 44, WebkitTapHighlightColor: 'transparent' }}>
                    <IReceipt size={15}/>Invoice
                  </button>
                )}
                {onExportPDF && (
                  <button type="button" onClick={onExportPDF}
                    className="flex-1 flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-sky-900/40 hover:bg-sky-900/60 border border-sky-700/40 transition-colors text-sm font-semibold text-sky-300"
                    style={{ minHeight: 44, WebkitTapHighlightColor: 'transparent' }}>
                    <IDownload size={15}/>Export PDF

                    className="flex-1 flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300"
                    style={{ minHeight: 44, WebkitTapHighlightColor: 'transparent' }}>
                    <IMessage size={15}/>Export Text
                  </button>

      );
    }

          <div

            <div className="flex flex-col-reverse gap-2 px-4 pb-5 sm:flex-row sm:justify-end">
              <button
                type="button"

                className="w-full sm:w-auto px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}

                {cancelLabel}
              </button>
              <button
                type="button"
                onClick={onConfirm}
                className={`w-full sm:w-auto px-4 py-2.5 text-sm font-semibold rounded-xl transition-colors ${confirmColors[confirmTone] || confirmColors.primary}`}

    function DayJumpSheet({ open, days, currentDayId, production, crew, onPick, onClose }) {

        if (!open) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [open]);
      useEscape(open ? onClose : null);

      if (!open) return null;

      const sorted = [...days].sort((a, b) => (a.date || "").localeCompare(b.date || ""));

      return (
        <div
          role="dialog" aria-modal="true" aria-labelledby="jump-sheet-title"
          className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.78)", zIndex: 50 }}
          onClick={onClose}
        >
          <div
            className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 flex flex-col"
            style={{ maxWidth: 480, maxHeight: "calc(80dvh - env(safe-area-inset-bottom))" }}
            onClick={e => e.stopPropagation()}
          >
            <div className="flex-shrink-0 px-5 py-4 border-b border-neutral-700 flex items-center justify-between">
              <div id="jump-sheet-title" className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold">Jump to Day</div>
              <button onClick={onClose} className="text-neutral-500 hover:text-neutral-200 transition-colors flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} aria-label="Close"><IX size={16}/></button>
            </div>
            <div className="flex-1 overflow-y-auto min-h-0" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
              {sorted.map((day, idx) => {
                const c = crew.find(cc => cc.id === day.crewId);
                const calc = c ? calcForDisplay(production, day, c, findPrevDay(days, day)) : null;
                const isCurrent = day.id === currentDayId;
                const dateStr = day.date ? new Date(day.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "—";
                const times = (day.callTime && day.wrapTime) ? `${day.callTime} – ${day.wrapTime}` : "";

                  <button
                    key={day.id}
                    type="button"
                    onClick={() => { onPick(day.id); onClose(); }}

                    style={isCurrent ? { borderLeft: '3px solid #38bdf8' } : { borderLeft: '3px solid transparent' }}
                  >

                    <div className="flex-1 min-w-0">
                      <div className={`text-sm font-semibold truncate ${isCurrent ? "text-sky-400" : "text-neutral-200"}`}>{dateStr}</div>
                      {(times || day.dayType) && <div className="text-[11px] text-neutral-500">{[times, day.dayType || "Shoot Day"].filter(Boolean).join(" · ")}</div>}
                    </div>
                    {day.note?.trim() && <INote size={13} className="text-neutral-600 flex-shrink-0"/>}
                    {calc && <div className="text-sm font-mono font-bold text-neutral-300 flex-shrink-0">{fmtGBP(calc.total)}</div>}
                  </button>

              })}
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ SOLO DAY PAGE (full-page editor for solo mode) ═══════════════════════════ */

    function SoloDayPage({ production, setProduction, onBack, onDeleteProduction, userPrefs, setUserPrefs, initialInvoiceId }) {
      const crew = production.crew ?? [];
      const days = production.days ?? [];

      const setDays = (updater) =>
        setProduction(prev => {
          const next = typeof updater === "function" ? updater(prev.days ?? []) : updater;
          return { ...prev, days: next.map(migrateDay) };
        });

      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };

      const sortedDays = useMemo(() => {
        return [...days].sort((a, b) => {
          const dateA = a.date || "";
          const dateB = b.date || "";
          if (dateA !== dateB) return dateA.localeCompare(dateB);
          return (a.id || "").localeCompare(b.id || "");
        });
      }, [days]);

      // Ensure at least one day exists when entering solo page
      useEffect(() => {
        if (days.length === 0 && crew.length > 0) {
          const blank = makeBlankDay(crew[0].id);
          const defaults = production.defaultDay ?? DEFAULT_PRODUCTION_DAY;
          const initialDay = {
            ...defaults, ...blank, id: uid(), date: todayISO(),
            kitMoneyEnabled: userPrefs.defaultKitMoneyEnabled ?? false,
            kitMoneyAmount: userPrefs.defaultKitMoneyAmount ?? 0,
          };
          const callH = parseHHMM(initialDay.callTime) ?? 8;
          initialDay.secondBreakStartTime = toHHMM(callH + 11);
          setDays([initialDay]);
        }
      }, []); // mount-only; intentional — auto-create runs once per page entry

      const [currentDayId, setCurrentDayId] = useState(null);

      // Anchor to today's day (or last day) on first load and re-anchor if current id becomes invalid
      useEffect(() => {
        if (sortedDays.length === 0) return;
        const stillValid = currentDayId && sortedDays.some(d => d.id === currentDayId);
        if (stillValid) return;
        const todayStr = todayISO();
        const todayDay = sortedDays.find(d => d.date === todayStr);
        setCurrentDayId(todayDay?.id ?? sortedDays[sortedDays.length - 1].id);
      }, [sortedDays, currentDayId]);

      const currentDay = sortedDays.find(d => d.id === currentDayId) || sortedDays[0];
      const currentIdx = currentDay ? sortedDays.findIndex(d => d.id === currentDay.id) : -1;
      const isFirst = currentIdx <= 0;
      const isLast = currentIdx === sortedDays.length - 1;

      const goPrev = () => { if (!isFirst) setCurrentDayId(sortedDays[currentIdx - 1].id); };
      const goNext = () => { if (!isLast) setCurrentDayId(sortedDays[currentIdx + 1].id); };

      // addDay computes from currentDay's date + 1 calendar day, not today's date
      const addDay = () => {
        const baseDate = currentDay?.date || todayISO();
        const d = new Date(baseDate + "T12:00:00");
        d.setDate(d.getDate() + 1);
        const newDate = d.toISOString().slice(0, 10);
        const blank = makeBlankDay(crew[0]?.id);
        const defaults = production.defaultDay ?? DEFAULT_PRODUCTION_DAY;
        const newDay = {
          ...defaults, ...blank, id: uid(), date: newDate,
          kitMoneyEnabled: userPrefs.defaultKitMoneyEnabled ?? false,
          kitMoneyAmount: userPrefs.defaultKitMoneyAmount ?? 0,
        };
        const callH = parseHHMM(newDay.callTime) ?? 8;
        newDay.secondBreakStartTime = toHHMM(callH + 11);
        setDays(prev => [...prev, newDay]);
        setCurrentDayId(newDay.id);
      };

      const handleDayChange = (updatedDay) => {
        if (!currentDay) return;
        setDays(prev => prev.map(d => d.id === currentDay.id ? updatedDay : d));
      };

      const [confirmDelete, setConfirmDelete] = useState(false);

      const requestDeleteCurrentDay = () => { if (currentDay) setConfirmDelete(true); };

      const performDelete = () => {
        setConfirmDelete(false);
        if (!currentDay) return;
        if (sortedDays.length === 1) {
          onDeleteProduction();
          return;
        }
        const remainingDays = days.filter(d => d.id !== currentDay.id);
        setDays(remainingDays);
        const remainingSorted = [...remainingDays].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
        const nextAnchor = remainingSorted[currentIdx]?.id
                        ?? remainingSorted[currentIdx - 1]?.id
                        ?? remainingSorted[0]?.id
                        ?? null;
        setCurrentDayId(nextAnchor);
        showToast("Day deleted");
      };

      const [showCalc, setShowCalc] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [showJumpSheet, setShowJumpSheet] = useState(false);
      const [showExportSheet, setShowExportSheet] = useState(false);
      const [pendingDeepLink] = useState(() => initialInvoiceId || null);
      const [invoiceNav, setInvoiceNav] = useState(null); // null | "list" | invoiceId
      const [soloExportState, setSoloExportState] = useState(null);

      // Deep-link: open specific invoice on mount when launched from AllInvoicesView
      useEffect(() => {
        if (pendingDeepLink) setInvoiceNav(pendingDeepLink);
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      const handleEditorClose = () => {
        if (pendingDeepLink && invoiceNav === pendingDeepLink) {
          onBack(); // arrived via deep-link — close all the way home
        } else {
          setInvoiceNav("list");
        }
      };

      const soloWeeks = useMemo(() => computeWeeks(production, days), [production, days]);
      const soloCrew = crew[0] || null;

      useEffect(() => {
        if (!soloExportState) return;
        const timer = setTimeout(() => {
          const cleanup = () => setSoloExportState(null);
          window.addEventListener('afterprint', cleanup, { once: true });
          window.print();
          const fallback = setTimeout(cleanup, 30000);
          return () => clearTimeout(fallback);
        }, 300);
        return () => clearTimeout(timer);
      }, [soloExportState]);

      const handleExportPDF = () => {
        if (soloCrew) setSoloExportState({ mode: "timesheet" });
      };
      const handleExportText = async () => {
        if (!soloCrew) return;
        const sortedE = [...days].sort((a, b) => a.date.localeCompare(b.date));
        const text = generateCrewText(soloCrew, sortedE, production);
        const r = await shareTextOrCopy(text, `${soloCrew.name} Timesheet`);
        if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
      };

      const openInvoiceFromButton = () => {
        const invoices = production.invoices || [];
        const latestDraft = [...invoices].reverse().find(inv => inv.status === "draft");
        const target = latestDraft || invoices[invoices.length - 1];
        if (target) {
          setInvoiceNav(target.id);
        } else {
          const newId = createNewInvoice(production, setProduction, userPrefs, setUserPrefs, soloCrew?.id);
          setInvoiceNav(newId);
        }
      };

      const totalShoot = useMemo(() => {
        return days.reduce((sum, d) => {
          const c = crew.find(cc => cc.id === d.crewId);
          if (!c) return sum;
          return sum + calcForDisplay(production, d, c, findPrevDay(days, d)).total;
        }, 0);
      }, [days, crew, production]);

      if (showSettings) {
        return (
          <ProductionSettingsSheet
            production={production}
            setProduction={setProduction}
            crew={crew}
            onClose={() => setShowSettings(false)}
          />
        );
      }

      if (invoiceNav && invoiceNav !== "list") {
        return (
          <InvoiceEditorView
            invoiceId={invoiceNav}
            production={production}
            setProduction={setProduction}
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            userCrewId={soloCrew?.id}
            onBack={handleEditorClose}
          />
        );
      }
      if (invoiceNav === "list") {
        return (
          <InvoiceListView
            production={production}
            setProduction={setProduction}
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            userCrewId={soloCrew?.id}
            onOpenInvoice={(id) => setInvoiceNav(id)}
            onClose={() => setInvoiceNav(null)}
          />
        );
      }

      if (!currentDay) {
        return (
          <div className="min-h-screen bg-neutral-950 flex items-center justify-center text-neutral-500 text-sm">
            Loading…
          </div>
        );
      }

      const isLastDay = sortedDays.length === 1;
      const deleteDateLabel = currentDay.date
        ? new Date(currentDay.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })
        : "this day";
      const deleteConfirmMessage = isLastDay
        ? `"${production.title || 'This production'}" has only this day. Deleting it will also delete the entire production.`
        : `Delete ${deleteDateLabel} (Day ${currentIdx + 1} of ${sortedDays.length})?`;

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 80px)' }}>
          <Toast show={!!toastMsg}>{toastMsg}</Toast>

          {/* Page header */}
          <div className="border-b border-sky-400 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
              <button onClick={onBack} aria-label="Back to productions"
                className="text-neutral-400 hover:text-sky-400 transition-colors p-2 rounded-full hover:bg-neutral-800"
                style={{ WebkitTapHighlightColor: 'transparent' }}>
                <IArrowLeft size={18}/>
              </button>
              <h1 className="flex-1 text-center text-sm font-bold uppercase tracking-tight truncate">
                {production.title || <span className="text-neutral-500">Untitled</span>}
              </h1>
              <button onClick={() => setShowExportSheet(true)} aria-label="Export"
                className="text-neutral-400 hover:text-neutral-200 transition-colors p-2 rounded-full hover:bg-neutral-800"
                style={{ WebkitTapHighlightColor: 'transparent' }}>
                <IShare size={16}/>
              </button>
              <button onClick={() => setShowSettings(true)} aria-label="Production settings"
                className="text-neutral-400 hover:text-neutral-200 transition-colors p-2 rounded-full hover:bg-neutral-800"
                style={{ WebkitTapHighlightColor: 'transparent' }}>
                <IGear size={16}/>
              </button>
            </div>
          </div>

          {/* Sub-header — Day X of N (tappable → jump sheet) + Delete. Reduced weight since pill now shows day count. */}
          <div className="max-w-3xl mx-auto px-4 pt-4 pb-2 flex items-center justify-between gap-3">
            <button
              type="button"
              onClick={() => setShowJumpSheet(true)}
              className="flex items-baseline gap-1.5 hover:opacity-70 transition-opacity"
              style={{ WebkitTapHighlightColor: 'transparent' }}
            >
              <span className="text-sm font-semibold tracking-tight text-neutral-400">Day {currentIdx + 1}</span>

            onNext={goNext}

              onExportPDF={() => { setShowCalc(false); handleExportPDF(); }}

            days={days}
            currentDayId={currentDayId}
            production={production}
            crew={crew}
            onPick={(id) => setCurrentDayId(id)}
            onClose={() => setShowJumpSheet(false)}
          />

          <ConfirmDialog
            open={confirmDelete}
            title={isLastDay ? "Delete last day?" : "Delete this day?"}
            message={deleteConfirmMessage}
            confirmLabel={isLastDay ? "Delete Production" : "Delete Day"}
            confirmTone="danger"
            cancelLabel="Cancel"
            onConfirm={performDelete}
            onCancel={() => setConfirmDelete(false)}
          />

          {/* Solo export bottom sheet */}
          {showExportSheet && (
            <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
                 style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
                 onClick={() => setShowExportSheet(false)}>
              <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
                   style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
                <div className="px-5 pt-5 pb-2">
                  <div className="text-sm font-bold text-neutral-100 flex items-center gap-2"><IShare size={14}/>Export</div>
                </div>
                <div className="px-4 pb-4 flex flex-col gap-2">
                  <button type="button"
                    onClick={() => { setShowExportSheet(false); handleExportPDF(); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-sky-900/40 hover:bg-sky-900/60 border border-sky-700/40 transition-colors text-sm font-semibold text-sky-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IDownload size={15}/>Export Timesheet (PDF)
                  </button>
                  <button type="button"
                    onClick={async () => { setShowExportSheet(false); await handleExportText(); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IMessage size={15}/>Export Timesheet (Text)

                  <button type="button"
                    onClick={() => { setShowExportSheet(false); openInvoiceFromButton(); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IReceipt size={15}/>Generate Invoice

                <div className="px-4 pb-4 pt-1 border-t border-neutral-800">
                  <button type="button" onClick={() => setShowExportSheet(false)}
                    className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>

    /* ═══════════════════════════ PRODUCTION APP ═══════════════════════════ */

    function ProductionApp({ production, setProduction, onBack, userPrefs, setUserPrefs, initialInvoiceId }) {

// Convenience aliases — child components keep receiving crew/days as before
const crew = production.crew ?? [];
const days = production.days ?? [];

// Derived setters — wrap setProduction so child components work unchanged
const setCrew = (updater) =>
  setProduction((prev) => ({
    ...prev,
    crew: typeof updater === "function" ? updater(prev.crew ?? []) : updater,
  }));

const setDays = (updater) =>
  setProduction((prev) => {
    const next = typeof updater === "function" ? updater(prev.days ?? []) : updater;
    return { ...prev, days: next.map(migrateDay) };
  });
      const [tab, setTab] = useState(production.bestBoyMode ? (production.isNew ? "setup" : "days") : "days");
      const [pendingDeepLink] = useState(() => initialInvoiceId || null);
      const [invoiceNav, setInvoiceNav] = useState(null); // null | "list" | invoiceId

      // Deep-link: open specific invoice on mount when launched from AllInvoicesView
      useEffect(() => {
        if (pendingDeepLink) setInvoiceNav(pendingDeepLink);
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      const handleEditorClose = () => {
        if (pendingDeepLink && invoiceNav === pendingDeepLink) {
          onBack(); // arrived via deep-link — close all the way home
        } else {
          setInvoiceNav("list");
        }
      };
      const userCrewId = userCrewIdsInProduction(production, userPrefs)[0] ?? null;
      const [showProdSettings, setShowProdSettings] = useState(false);
      const [showCalcView, setShowCalcView] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [confirmOpts, setConfirmOpts] = useState(null);
      const [openCrewForm, setOpenCrewForm] = useState(false);
      const [showCancelModal, setShowCancelModal] = useState(false);
      const undoRef = useRef(null);
      const undoTimerRef = useRef(null);
      const [undoVisible, setUndoVisible] = useState(false);
      const [undoLabel, setUndoLabel] = useState('');

      const pushUndo = (label, extra = {}) => {
        undoRef.current = { crew: production.crew ?? [], days: production.days ?? [], ...extra };
        setUndoLabel(label);
        setUndoVisible(true);
        if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
        undoTimerRef.current = setTimeout(() => setUndoVisible(false), 5000);
      };
      const handleUndo = () => {
        if (!undoRef.current) return;
        const { crew: c, days: d, weekStarts, gridDates } = undoRef.current;
        setProduction(prev => ({
          ...prev,
          crew: c,
          days: d,
          ...(weekStarts !== undefined ? { weekStarts } : {}),
          ...(gridDates !== undefined ? { gridDates } : {}),
        }));
        undoRef.current = null;
        setUndoVisible(false);
        if (undoTimerRef.current) { clearTimeout(undoTimerRef.current); undoTimerRef.current = null; }
      };

      const handleRemoveWeek = (monday) => {
        pushUndo('Week removed', { weekStarts: production.weekStarts ?? [], gridDates: production.gridDates ?? [] });
        const weekDates = new Set(Array.from({ length: 7 }, (_, i) => {
          const d = new Date(monday + "T12:00:00"); d.setDate(d.getDate() + i);
          return d.toISOString().slice(0, 10);
        }));
        setProduction(p => ({
          ...p,
          weekStarts: (p.weekStarts || []).filter(w => w !== monday),
          gridDates: (p.gridDates || []).filter(d => !weekDates.has(d)),
          days: (p.days || []).filter(d => !weekDates.has(d.date)),
        }));
      };

      useEffect(() => {
        if (production.isNew) setProduction(p => ({ ...p, isNew: false }));
      }, []);

      const handleGridAddDate = (date) => setProduction(p => ({ ...p, gridDates: [...(p.gridDates || []), date] }));
      const handleGridAddWeek = (monday) => setProduction(p => ({ ...p, weekStarts: [...(p.weekStarts || []), monday] }));
      const handleGridAddCrew = () => { setOpenCrewForm(true); setTab("setup"); };

      useEffect(() => {
        if (!production.bestBoyMode && tab === "setup") setTab("days");
      }, [production.bestBoyMode]);

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };

      const clearAll = () => {
        setProduction((prev) => ({ id: prev.id, title: "", prodCo: "", crew: [], days: [], defaultDay: DEFAULT_PRODUCTION_DAY, gridDates: [], weekStarts: [], cancellationData: null }));
      };

      const totalShoot = days.reduce((s, d) => { const c = crew.find((cc) => cc.id === d.crewId); return c ? s + calcForDisplay(production, d, c, findPrevDay(days, d)).total : s; }, 0);

      if (showProdSettings) {
        return (
          <ProductionSettingsSheet
            production={production}
            setProduction={setProduction}
            crew={crew}
            onClose={() => setShowProdSettings(false)}
          />
        );
      }

      if (invoiceNav && invoiceNav !== "list") {
        return (
          <InvoiceEditorView
            invoiceId={invoiceNav}
            production={production}
            setProduction={setProduction}
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            userCrewId={userCrewId}
            onBack={handleEditorClose}
          />
        );
      }
      if (invoiceNav === "list") {
        return (
          <InvoiceListView
            production={production}
            setProduction={setProduction}
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            userCrewId={userCrewId}
            onOpenInvoice={(id) => setInvoiceNav(id)}
            onClose={() => setInvoiceNav(null)}
          />
        );
      }

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <Toast show={!!toastMsg}>{toastMsg}</Toast>
          {undoVisible && (
            <div className="fixed bottom-[8rem] left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-neutral-800 border border-neutral-600 shadow-lg px-4 py-2.5 rounded-full whitespace-nowrap">
              <span className="text-[11px] text-neutral-300 uppercase tracking-wide font-bold">{undoLabel}</span>
              <button onClick={handleUndo} className="text-[11px] text-sky-400 hover:text-sky-300 uppercase tracking-wide font-bold transition-colors">Undo</button>
            </div>
          )}

          {showCalcView && (
            <CalcBreakdownView
              production={production}
              days={days}
              crew={crew}
              total={totalShoot}
              onClose={() => setShowCalcView(false)}
            />
          )}

          <div className="sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="border-b border-sky-400 bg-black">
              <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
                <div>
                  <button onClick={onBack} className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 hover:text-sky-400 transition-colors font-bold mb-1 flex items-center gap-1" aria-label="Back to productions list">← {(() => { const n = userPrefs?.displayName?.trim() || ""; return n ? `${n}'s TIMEMACHINE` : "TIMEMACHINE"; })()}</button>
                  <div className="font-bold uppercase tracking-tight leading-none text-sm">{production.title || <span className="text-neutral-500">Untitled Production</span>}</div>
                </div>
                <div className="flex items-center gap-3">
                  <Btn size="sm" variant="ghost" onClick={() => setConfirmOpts({
                    title: "Reset production data?",
                    message: `Remove all crew, days, and settings from "${production.title || 'this production'}". The production itself stays. This cannot be undone.`,
                    confirmLabel: "Reset",
                    confirmTone: "danger",
                    onConfirm: clearAll,
                  })}><IReset/>Reset</Btn>
                  <button onClick={() => setShowProdSettings(true)} className="text-neutral-400 hover:text-neutral-200 transition-colors p-2 rounded-lg hover:bg-neutral-800" aria-label="Production settings" title="Production settings"><IGear size={16}/></button>
                </div>
              </div>
            </div>
            <div className="bg-neutral-950 border-b border-neutral-800">
              <div className="max-w-6xl mx-auto px-4 py-2 flex justify-start overflow-x-auto">
                <div className="inline-flex rounded-lg bg-neutral-800 p-0.5">
                  {(production.bestBoyMode
                    ? [{ k: "setup", label: "Setup", I: IBriefcase }, { k: "days", label: "Timesheets", I: ICal }, { k: "export", label: "Export", I: IShare }, { k: "invoices", label: "Invoices", I: IReceipt }]
                    : [{ k: "days", label: "Timesheets", I: ICal }, { k: "export", label: "Export", I: IShare }]
                  ).map(({ k, label, I }) => (
                    <button key={k} onClick={() => { if (k === "invoices") { setInvoiceNav("list"); } else { setTab(k); } }}
                      className={`inline-flex items-center gap-1.5 px-4 py-1.5 rounded-md text-[11px] uppercase tracking-[0.15em] font-bold whitespace-nowrap transition-colors duration-150 ${tab === k ? "bg-sky-400 text-black" : "text-neutral-400"}`}>
                      <I/>{label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>

          <div className="max-w-6xl mx-auto px-4 py-6 pb-32">
            {tab === "setup" && production.bestBoyMode && (
              <div className="space-y-8">
                <ProductionForm production={production} setProduction={setProduction} onOpenSettings={() => setShowProdSettings(true)} />
                <CrewManager crew={crew} setCrew={setCrew} autoStart={openCrewForm} onAutoStartConsumed={() => setOpenCrewForm(false)} onPushUndo={pushUndo} />
                <div>
                  <Btn variant="ghost" size="sm" onClick={() => setShowCancelModal(true)}>Cancellation fees</Btn>
                </div>
              </div>
            )}
            {showCancelModal && (
              <CancellationCalcModal
                production={production}
                setProduction={setProduction}
                crew={crew}
                onClose={() => setShowCancelModal(false)}
              />
            )}
            {tab === "days"   && <DaysManager days={days} setDays={setDays} crew={crew} production={production} showToast={showToast} onAddDate={handleGridAddDate} onAddWeek={handleGridAddWeek} onAddCrew={handleGridAddCrew} onPushUndo={pushUndo} onRemoveWeek={handleRemoveWeek} />}
            {tab === "export" && <ExportTab production={production} crew={crew} days={days} showToast={showToast} userPrefs={userPrefs} />}
          </div>

          <div className="text-center text-[10px] text-neutral-600 py-6 pb-32 uppercase tracking-widest">
            Rates per APA Sept 2025
          </div>

          <BottomMoneyPill total={totalShoot} onBack={onBack} onViewCalc={() => setShowCalcView(true)} />
          <ConfirmDialog
            open={!!confirmOpts}
            title={confirmOpts?.title}
            message={confirmOpts?.message}
            confirmLabel={confirmOpts?.confirmLabel || "Confirm"}
            confirmTone={confirmOpts?.confirmTone || "danger"}
            cancelLabel="Cancel"
            onConfirm={() => { const f = confirmOpts?.onConfirm; setConfirmOpts(null); if (f) f(); }}
            onCancel={() => setConfirmOpts(null)}
          />
        </div>
      );
    }

    /* ═══════════════════════════ NEW PRODUCTION SCREEN ═══════════════════════════ */

    function NewProductionScreen({ userPrefs, onCreate, onCancel }) {
      const [title, setTitle] = useState("");
      const [bestBoyMode, setBestBoyMode] = useState(false);
      const inputRef = useRef(null);

      useEffect(() => { inputRef.current?.focus(); }, []);

      const canCreate = title.trim().length > 0;
      const handleCreate = () => { if (canCreate) onCreate({ title: title.trim(), bestBoyMode }); };

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <div className="border-b border-neutral-800 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-2xl mx-auto px-4 py-3 flex items-center">
              <button onClick={onCancel} className="text-neutral-400 hover:text-neutral-200 transition-colors p-1 -ml-1" title="Cancel" aria-label="Cancel">
                <IX size={18}/>
              </button>
            </div>
          </div>

          <div className="max-w-2xl mx-auto px-4 py-10">
            <h1 className="text-2xl font-bold tracking-tight mb-8">New Production</h1>

            <div className="mb-2">
              <Field label="Production name">
                <input
                  ref={inputRef}
                  type="text"
                  placeholder={`e.g. Acme Brand Film ${new Date().getFullYear()}`}
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey || true) && canCreate) handleCreate(); }}
                  className="w-full bg-neutral-800 border border-neutral-700 focus:border-sky-400 focus:ring-1 focus:ring-sky-400/40 text-neutral-100 placeholder:text-neutral-500 px-3 py-3 text-base font-mono outline-none rounded-lg"
                />
              </Field>
            </div>
            <p className="text-[11px] text-neutral-500 mb-8">You can change this later</p>

            <div className="bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-4 mb-8">
              <div className="flex items-center justify-between gap-4">
                <div>
                  <div className="text-sm font-semibold text-neutral-100">Best Boy mode</div>
                  <div className="text-[11px] text-neutral-400 mt-0.5">Manage a crew with the grid view</div>
                </div>
                <Toggle value={bestBoyMode} onChange={setBestBoyMode} ariaLabel="Best Boy mode" />
              </div>
            </div>

            <Btn variant="primary" onClick={handleCreate} disabled={!canCreate} className="w-full justify-center py-3 text-sm">
              Create
            </Btn>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ SETTINGS SCREEN ═══════════════════════════ */

    function makeDeptRoleHandlers(set, userPrefs) {
      return {
        onDeptChange: (dept) => {
          const firstRole = dept && DEPARTMENTS[dept] ? Object.keys(DEPARTMENTS[dept])[0] : "";
          const roleDefaults = firstRole ? (ROLE_DEFAULTS[firstRole] || {}) : {};
          set({ defaultDepartment: dept, defaultRole: firstRole,
                defaultBDR: roleDefaults.bdr ?? 0, defaultOTCoef: roleDefaults.otCoef ?? 1.5 });
        },
        onRoleChange: (role) => {
          const d = ROLE_DEFAULTS[role] || {};
          set({ defaultRole: role, defaultBDR: d.bdr ?? userPrefs.defaultBDR, defaultOTCoef: d.otCoef ?? 1.5 });
        },
      };
    }

    /* ═══════════════════════════ ONBOARDING ═══════════════════════════ */

    function OnboardingScreen({ userPrefs, set, onComplete }) {
      const [step, setStep] = useState(1);

      const completeOnboarding = () => {
        set({ onboardingComplete: true });
        onComplete();
      };

      const deptRoles = userPrefs.defaultDepartment && DEPARTMENTS[userPrefs.defaultDepartment]
        ? Object.keys(DEPARTMENTS[userPrefs.defaultDepartment])
        : [];

      const { onDeptChange, onRoleChange } = makeDeptRoleHandlers(set, userPrefs);

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100 flex flex-col items-center justify-center px-6 py-12" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
          <div className="w-full max-w-sm">

            {step === 1 && (
              <div className="space-y-6">
                <div>
                  <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-3">Step 1 of 3</div>
                  <h1 className="text-2xl font-bold tracking-tight text-neutral-100 mb-2">Welcome to<br/>TimeMachine</h1>
                  <p className="text-sm text-neutral-400 leading-relaxed">The APA timesheet calculator for UK commercial crew.</p>
                </div>

                <Field label="Your name" hint="Appears on your exported timesheets">
                  <Input
                    type="text"
                    placeholder="e.g. Jane Smith"
                    value={userPrefs.displayName}
                    onChange={(e) => set({ displayName: e.target.value })}
                  />
                </Field>

                <div className="rounded-xl bg-neutral-900 border border-neutral-800 p-4 text-sm text-neutral-400 leading-relaxed">
                  <div className="text-[10px] uppercase tracking-[0.18em] font-bold text-sky-400 mb-2">Beta · Local only</div>
                  Your data stays on this device. No cloud sync yet — use <span className="text-neutral-300 font-medium">Settings → Export Backup</span> to keep a copy.
                </div>

                <Btn variant="primary" size="lg" className="w-full justify-center" onClick={() => setStep(2)}>Continue</Btn>
                <button className="w-full text-center text-[11px] text-neutral-500 hover:text-neutral-300 transition-colors pt-1" onClick={completeOnboarding}>Skip setup</button>
              </div>
            )}

            {step === 2 && (
              <div className="space-y-6">
                <div>
                  <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-3">Step 2 of 3</div>
                  <h1 className="text-2xl font-bold tracking-tight text-neutral-100 mb-2">Default role<br/>and rate</h1>
                  <p className="text-sm text-neutral-400">You can override these per-job at any time.</p>
                </div>

                <div className="space-y-4">
                  <Field label="Department">
                    <Select value={userPrefs.defaultDepartment} onChange={(e) => onDeptChange(e.target.value)}>
                      <option value="">— pick a department —</option>
                      {Object.keys(DEPARTMENTS).map(d => <option key={d} value={d}>{d}</option>)}
                    </Select>
                  </Field>

                  {userPrefs.defaultDepartment && deptRoles.length > 0 && (
                    <Field label="Role">
                      <Select value={userPrefs.defaultRole} onChange={(e) => onRoleChange(e.target.value)}>
                        {deptRoles.map(r => <option key={r} value={r}>{r}</option>)}
                      </Select>
                    </Field>
                  )}

                  {userPrefs.defaultRole && (
                    <Field label="BDR (£)" hint="Auto-filled from the APA rate card — edit if negotiated differently">
                      <Input
                        type="number"
                        min="0"
                        step="1"
                        value={userPrefs.defaultBDR}
                        onChange={(e) => set({ defaultBDR: Number(e.target.value) })}
                      />
                    </Field>
                  )}

                  <Field label="VAT registered?">
                    <Toggle value={userPrefs.vatRegistered} onChange={(v) => set({ vatRegistered: v })} ariaLabel="VAT registered" />
                  </Field>

                  {userPrefs.vatRegistered && (
                    <>
                      <Field label="VAT number">
                        <Input
                          type="text"
                          placeholder="GB 123 4567 89"
                          value={userPrefs.vatNumber}
                          onChange={(e) => set({ vatNumber: e.target.value })}
                        />
                      </Field>
                      <Field label="VAT rate (%)">
                        <Input
                          type="number"
                          min="0"
                          max="100"
                          step="1"
                          inputMode="numeric"
                          value={userPrefs.vatRate}
                          onChange={(e) => set({ vatRate: Number(e.target.value) })}
                        />
                      </Field>
                    </>
                  )}
