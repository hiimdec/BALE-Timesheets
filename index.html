    /* ── Chip Legend (shared) ── */
    function ChipLegend() {
      return (
        <div className="legend">
          <span className="item"><span className="chip-ot">OT</span> Overtime</span>
          <span className="item"><span className="chip-msb">L1</span> Late 1st break</span>
          <span className="item"><span className="chip-msb">L2</span> Late 2nd break</span>
          <span className="item"><span className="chip-msb">MSB</span> Missed 2nd break</span>
          <span className="item"><span className="chip-cwd">CWD</span> Cont. Working Day</span>
          <span className="item"><span className="chip-toc">TOC</span> Turnaround</span>
          <span className="item"><span className="chip-ns">NS</span> Night Shoot</span>
        </div>
      );
    }

    /* ── Penalty chip row (shared helper) ── */
    function PenChips({ flags }) {
      const chips = [];
      if (flags.hasOT)        chips.push(<span key="ot"  className="chip-ot">OT</span>);
      if (flags.hasL1)        chips.push(<span key="l1"  className="chip-msb">L1</span>);
      if (flags.hasL2)        chips.push(<span key="l2"  className="chip-msb">L2</span>);
      if (flags.hasMSB)       chips.push(<span key="msb" className="chip-msb">MSB</span>);
      if (flags.hasCWD)       chips.push(<span key="cwd" className="chip-cwd">CWD</span>);
      if (flags.hasTOC)       chips.push(<span key="toc" className="chip-toc">TOC</span>);
      if (flags.isNightShoot) chips.push(<span key="ns"  className="chip-ns">NS</span>);
      return chips.length ? <React.Fragment>{chips}</React.Fragment> : null;
    }

    /* ── Single timesheet page ── */
    function TimesheetPage({ crewMember, weekDates, allDaysForCrew, production, pageNum, totalPages, weekIndex, totalWeeks, grandTotal, grandHrs, grandOTHrs, isFirstPage, userPrefs }) {
      // Build per-day calc for this week
      const dayMap = {};
      (allDaysForCrew || []).forEach(d => { dayMap[d.date] = d; });

      // Format week range label
      const rangeStart = new Date(weekDates[0] + "T12:00:00");
      const rangeEnd   = new Date(weekDates[6] + "T12:00:00");
      const fmtRange = (d) => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const rangeLabel = `${fmtRange(rangeStart)} – ${fmtRange(rangeEnd)}`;

      // Header meta line
      const metaParts = [
        production.title || 'Untitled Production',
        production.prodCo,
        rangeLabel,
        production.jobReference,
      ].filter(Boolean);

      // BDR / OT rate display
      const bdr = Number(crewMember.bdr) || 0;
      const bhr = computeAPArate(bdr, 1, production.apaRounding);
      const otRate = (crewMember.otRate != null && crewMember.otRate > 0)
        ? Number(crewMember.otRate)
        : computeAPArate(bdr, Number(crewMember.otCoef) || 1.5, production.apaRounding);

      return (
        <div className="page ts-page">
          {/* Header */}
          <div className="doc-header">
            <div>
              <div className="label">{isFirstPage ? 'Crew Timesheet' : `Crew Timesheet · continued`}</div>
              <div className="name-role">
                {crewMember.name || 'Unnamed'}
                {crewMember.role ? <span className="role"> · {crewMember.role}</span> : null}
              </div>
              <div className="meta">
                <strong>{production.title || 'Untitled Production'}</strong>
                {production.prodCo ? ` · ${production.prodCo}` : ''}
                <br/>
                {rangeLabel}
                {production.jobReference ? ` · ${production.jobReference}` : ''}
              </div>
              {isFirstPage && bdr > 0 && (
                <div className="rate-row">
                  <span className="num">{fmtGBP(bdr)}</span><span>BDR</span>
                  <span style={{color:'#d4d4d4'}}>·</span>
                  <span className="num">{fmtGBP(otRate)}</span><span>OT/h</span>
                  <span style={{color:'#d4d4d4'}}>·</span>
                  <span>{(Number(crewMember.otCoef)||1.5)}×</span>
                </div>
              )}
            </div>
            <div className="right">
              {isFirstPage ? (
                <>
                  <div className="label">Total · {allDaysForCrew.length} day{allDaysForCrew.length !== 1 ? 's' : ''}</div>
                  <div className="total tnum">{fmtGBP(grandTotal)}</div>
                  <div className="breakdown tnum">
                    {grandHrs.toFixed(1)}h worked
                    {grandOTHrs > 0 ? ` · ${grandOTHrs.toFixed(1)}h OT` : ''}
                  </div>
                </>
              ) : (
                <>
                  <div className="label">{`Week ${weekIndex + 1} of ${totalWeeks}`}</div>
                  <div className="breakdown tnum">{rangeLabel}</div>
                </>
              )}
            </div>
          </div>

          {isFirstPage && <ChipLegend />}

          {/* Day rows */}
          <div className="day-list">
            {weekDates.map(dateISO => {
              const day = dayMap[dateISO];
              const d = new Date(dateISO + "T12:00:00");
              const dow = d.toLocaleDateString('en-GB', { weekday: 'short' });
              const dayNum = d.getDay(); // 0=Sun,6=Sat
              const isSat = dayNum === 6;
              const isSun = dayNum === 0;
              const mo = d.toLocaleDateString('en-GB', { month: 'short' });
              const dateNum = d.getDate();
              const tintClass = isSat ? 'sat' : isSun ? 'sun' : '';

              if (!day) {
                // Rest day
                return (
                  <div key={dateISO} className={`day rest${tintClass ? ' ' + tintClass : ''}`}>
                    <div className="date">
                      <div className="dow">{dow}</div>
                      <div className="num tnum">{dateNum}</div>
                      <div className="mo tnum">{mo}</div>
                    </div>
                    <div className="body"><span className="label">Rest</span></div>
                    <div className="total"><div className="lbl">—</div></div>
                  </div>
                );
              }

              // Day with data — but check if it's a Rest Day type
              if (day.dayType === "Rest Day") {
                return (
                  <div key={dateISO} className={`day rest${tintClass ? ' ' + tintClass : ''}`}>
                    <div className="date">
                      <div className="dow">{dow}</div>
                      <div className="num tnum">{dateNum}</div>
                      <div className="mo tnum">{mo}</div>
                    </div>
                    <div className="body"><span className="label">Rest</span></div>
                    <div className="total"><div className="lbl">—</div></div>
                  </div>
                );
              }

              const prevDay = allDaysForCrew
                .filter(x => x.date < dateISO)
                .sort((a, b) => b.date.localeCompare(a.date))[0] || null;
              const calc = calcForDisplay(production, day, crewMember, prevDay);
              const flags = penaltyFlags(calc);
              const isBH = flags.isBankHoliday;
              const rowTint = isBH || isSun ? 'sun' : isSat ? 'sat' : '';

              const callTime = day.callTime || '';
              const wrapTime = day.wrapTime || '';
              const workedHrs = calc.meta?.workedHrs || 0;
              const otHrs = calc.meta?.otHrs || 0;
              const chipClass = dayTypeChipClass(day.dayType);

              return (
                <div key={dateISO} className={`day${rowTint ? ' ' + rowTint : ''}`}>
                  <div className="date">
                    <div className="dow">{dow}</div>
                    <div className="num tnum">{dateNum}</div>
                    <div className="mo tnum">{mo}</div>
                  </div>
                  <div className="body">
                    <div className="head-line">
                      <span className={`chip-day ${chipClass}`}>{day.dayType}</span>
                      <PenChips flags={flags} />
                      {callTime && wrapTime && (
                        <span className="times tnum">{callTime} → {wrapTime} <span className="hrs">{workedHrs.toFixed(1)}h</span></span>
                      )}
                    </div>
                    <div className="lines">
                      {calc.lines.map((line, i) => {
                        const isOT = /\bot\b|\bovertime\b/i.test(line.label || '');
                        const isPen = line.rate === null && !line.isTOC;
                        return (
                          <React.Fragment key={i}>
                            <span className="ll">
                              {isOT
                                ? <>{line.detail ? <>{line.detail}<span className="sep">—</span></> : null}<span className="ot">{formatOTDuration(line.qty)}h {line.label}</span></>
                                : isPen
                                ? <><span className="penalty">{line.label}</span>{line.detail ? <><span className="sep">·</span>{line.detail}</> : null}</>
                                : <><strong>{line.label}</strong>{line.detail ? <><span className="sep">·</span>{line.detail}</> : null}</>
                              }
                            </span>
                            <span className="lr tnum">{fmtGBP(line.amount)}</span>
                          </React.Fragment>
                        );
                      })}
                    </div>
                    {day.note && day.note.trim() && <div className="day-note">{day.note}</div>}
                  </div>
                  <div className="total">
                    <div className="lbl">Day Total</div>
                    <div className="val tnum">{fmtGBP(calc.total)}</div>
                    {otHrs > 0 && <div className="sub tnum">{otHrs.toFixed(1)}h OT</div>}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Footer */}
          <div className="doc-footer">
            <div className="pay-info">
              {isFirstPage && userPrefs?.vatRegistered && userPrefs?.vatNumber
                ? <span><span className="lbl">VAT No.</span> <span className="val tnum">{userPrefs.vatNumber}</span></span>
                : null}
            </div>
            <div className="brand">
              <div className="name">TIMEMACHINE</div>
              <div className="tnum">Page {pageNum} of {totalPages}</div>
            </div>
          </div>
        </div>
      );
    }

    /* ── Grid page ── */
    function GridPage({ crew, weekDates, allDays, production, weekIndex, totalWeeks, pageNum, totalPages, isFirstPage, userPrefs }) {
      const week = { start: weekDates[0], end: weekDates[6] };
      const rangeStart = new Date(weekDates[0] + "T12:00:00");
      const rangeEnd   = new Date(weekDates[6] + "T12:00:00");
      const fmtShort = (d) => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const rangeLabel = `${fmtShort(rangeStart)} – ${fmtShort(rangeEnd)}`;

      // Build lookup: daysByCrewAndDate[crewId][date] = day object
      const byCA = {};
      (allDays || []).forEach(d => {
        if (d.date >= week.start && d.date <= week.end) {
          if (!byCA[d.crewId]) byCA[d.crewId] = {};
          byCA[d.crewId][d.date] = d;
        }
      });

      // Grand totals
      let weekTotal = 0, weekHrs = 0, weekOTHrs = 0;
      const crewTotals = crew.map(c => {
        const crewDays = Object.values(byCA[c.id] || {});
        const sorted = [...(allDays || [])].filter(d => d.crewId === c.id).sort((a, b) => a.date.localeCompare(b.date));
        let tot = 0, hrs = 0;
        crewDays.forEach(day => {
          const prev = sorted.filter(x => x.date < day.date).pop() || null;
          const calc = calcForDisplay(production, day, c, prev);
          tot += calc.total;
          hrs += calc.meta?.workedHrs || 0;
        });
        weekTotal += tot;
        weekHrs += hrs;
        return { tot, hrs };
      });

      // Column day totals
      const colTotals = weekDates.map(dateISO => {
        let tot = 0, hrs = 0;
        crew.forEach((c, ci) => {
          const day = (byCA[c.id] || {})[dateISO];
          if (!day || day.dayType === "Rest Day") return;
          const allCrewDays = (allDays || []).filter(d => d.crewId === c.id).sort((a, b) => a.date.localeCompare(b.date));
          const prev = allCrewDays.filter(x => x.date < dateISO).pop() || null;
          const calc = calcForDisplay(production, day, c, prev);
          tot += calc.total;
          hrs += calc.meta?.workedHrs || 0;
        });
        return { tot, hrs };
      });

      const now = new Date();
      const genLabel = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        + ' · ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

      return (
        <div className="page grid-page">
          {/* Header */}
          <div className="doc-header">
            <div>
              <div className="label">Production Grid</div>
              <div className="title">{production.title || 'Untitled Production'}</div>
              <div className="meta" style={{fontSize:'10.5px',color:'#525252',marginTop:6}}>
                {[production.prodCo, `Week ${weekIndex + 1} of ${totalWeeks}`, `${crew.length} crew`, rangeLabel].filter(Boolean).join(' · ')}
              </div>
            </div>
            <div className="right">
              <div className="label">Week Total</div>
              <div className="total tnum">{fmtGBP(weekTotal)}</div>
              <div className="breakdown tnum">{weekHrs.toFixed(0)}h{weekOTHrs > 0 ? ` · ${weekOTHrs.toFixed(0)}h OT` : ''}</div>
            </div>
          </div>

          {isFirstPage && <ChipLegend />}

          {/* Grid */}
          <div className="grid-wrap">
            <div className="grid-table">
              <div className="grid-row grid-head">
                <div className="grid-cell crew-col"></div>
                {weekDates.map(dateISO => {
                  const d = new Date(dateISO + "T12:00:00");
                  const dn = d.getDay();
                  const cls = dn === 6 ? 'sat' : dn === 0 ? 'sun' : '';
                  return (
                    <div key={dateISO} className={`grid-cell${cls ? ' ' + cls : ''}`}>
                      <div className="dow">{d.toLocaleDateString('en-GB',{weekday:'short'})}</div>
                      <div className="num">{d.getDate()}</div>
                      <div className="mo tnum">{d.toLocaleDateString('en-GB',{month:'short'})}</div>
                    </div>
                  );
                })}
                <div className="grid-cell total-col"><div className="dow">Total</div></div>
              </div>

              {crew.map((c, ci) => {
                const allCrewDays = (allDays || []).filter(d => d.crewId === c.id).sort((a, b) => a.date.localeCompare(b.date));
                return (
                  <div key={c.id} className="grid-row grid-body">
                    <div className="grid-cell crew">
                      <div className="name">{c.name}</div>
                      <div className="role">{c.role} · {fmtGBP(c.bdr)}</div>
                    </div>
                    {weekDates.map(dateISO => {
                      const dn = new Date(dateISO + "T12:00:00").getDay();
                      const colCls = dn === 6 ? 'sat' : dn === 0 ? 'sun' : '';
                      const day = (byCA[c.id] || {})[dateISO];
                      if (!day || day.dayType === "Rest Day") {
                        return (
                          <div key={dateISO} className={`grid-cell${colCls ? ' ' + colCls : ''}`}>
                            <span className="rest-label">Rest</span>
                          </div>
                        );
                      }
                      const prev = allCrewDays.filter(x => x.date < dateISO).pop() || null;
                      const calc = calcForDisplay(production, day, c, prev);
                      const flags = penaltyFlags(calc);
                      const isBH = flags.isBankHoliday;
                      const cellCls = (isBH || dn === 0) ? 'sun' : dn === 6 ? 'sat' : '';
                      const hrs = calc.meta?.workedHrs || 0;
                      const chipCls = dayTypeChipClass(day.dayType);
                      const penNodes = [];
                      if (flags.hasOT)        penNodes.push(<span key="ot"  className="chip-ot">OT</span>);
                      if (flags.hasL1)        penNodes.push(<span key="l1"  className="chip-msb">L1</span>);
                      if (flags.hasL2)        penNodes.push(<span key="l2"  className="chip-msb">L2</span>);
                      if (flags.hasMSB)       penNodes.push(<span key="msb" className="chip-msb">MSB</span>);
                      if (flags.hasCWD)       penNodes.push(<span key="cwd" className="chip-cwd">CWD</span>);
                      if (flags.hasTOC)       penNodes.push(<span key="toc" className="chip-toc">TOC</span>);
                      if (flags.isNightShoot) penNodes.push(<span key="ns"  className="chip-ns">NS</span>);
                      return (
                        <div key={dateISO} className={`grid-cell${cellCls ? ' ' + cellCls : ''}`}>
                          <div className="cell-stack">
                            <div className="top">
                              <span className={`chip-day ${chipCls}`}>{day.dayType}</span>
                              <span className="hrs-line tnum">{hrs.toFixed(1)}h</span>
                              {penNodes.length > 0 && <div className="pens">{penNodes}</div>}
                            </div>
                            <span className="total-val tnum">{fmtGBP(calc.total)}</span>
                          </div>
                        </div>
                      );
                    })}
                    <div className="grid-cell row-total">
                      <div className="total-val tnum">{fmtGBP(crewTotals[ci].tot)}</div>
                      <div className="total-hrs tnum">{crewTotals[ci].hrs.toFixed(1)}h</div>
                    </div>
                  </div>
                );
              })}

              <div className="grid-row grid-foot">
                <div className="grid-cell crew">Day Totals</div>
                {weekDates.map((dateISO, i) => {
                  const dn = new Date(dateISO + "T12:00:00").getDay();
                  const cls = dn === 6 ? 'sat' : dn === 0 ? 'sun' : '';
                  const ct = colTotals[i];
                  return (
                    <div key={dateISO} className={`grid-cell${cls ? ' ' + cls : ''}`}>
                      {ct.tot > 0
                        ? <><div className="day-total-val tnum">{fmtGBP(ct.tot)}</div><div className="day-total-hrs tnum">{ct.hrs.toFixed(1)}h</div></>
                        : <span style={{color:'#d4d4d4'}}>—</span>}
                    </div>
                  );
                })}
                <div className="grid-cell row-total">
                  <div className="week-total tnum">{fmtGBP(weekTotal)}</div>
                  <div className="day-total-hrs tnum">{weekHrs.toFixed(0)}h</div>
                </div>
              </div>
            </div>
          </div>

          {/* Footer */}
          <div className="doc-footer">
            <div className="pay-info">
              {production.prodCo && <span><span className="lbl">Production:</span> <span className="val">{production.prodCo}</span></span>}
              {production.invoicingEmail && <span><span className="lbl">Email:</span> <span className="val">{production.invoicingEmail}</span></span>}
              <span><span className="lbl">Generated:</span> <span className="val tnum">{genLabel}</span></span>
            </div>
            <div className="brand">
              <div className="name">TIMEMACHINE</div>
              <div className="tnum">Page {pageNum} of {totalPages} · Week {weekIndex + 1}</div>
            </div>
          </div>
        </div>
      );
    }

    /* ── PrintView portal ── */
    function PrintView({ mode, production, crewMember, crewList, days, weeks, exportWeekIndex, userPrefs }) {
      // mode: "timesheet" | "grid"
      // For timesheet: crewMember (single), days (all for that crew)
      // For grid: crewList (all crew), days (all days for selected weeks)

      const pages = [];

      if (mode === "timesheet" && crewMember) {
        const crewDays = (days || [])
          .filter(d => d.crewId === crewMember.id)
          .sort((a, b) => a.date.localeCompare(b.date));

        // Compute grand totals
        let grandTotal = 0, grandHrs = 0, grandOTHrs = 0;
        crewDays.forEach((day, i) => {
          const prev = crewDays[i - 1] || null;
          const calc = calcForDisplay(production, day, crewMember, prev);
          grandTotal  += calc.total;
          grandHrs    += calc.meta?.workedHrs || 0;
          grandOTHrs  += calc.meta?.otHrs     || 0;
        });

        // Determine which weeks to render
        const weeksToRender = exportWeekIndex !== null && exportWeekIndex !== undefined
          ? [weeks[exportWeekIndex]].filter(Boolean)
          : weeks;

        const totalPages = weeksToRender.length;

        weeksToRender.forEach((wk, pi) => {
          const weekDates = weekDateRange(wk.start);
          pages.push(
            <TimesheetPage
              key={wk.start}
              crewMember={crewMember}
              weekDates={weekDates}
              allDaysForCrew={crewDays}
              production={production}
              pageNum={pi + 1}
              totalPages={totalPages}
              weekIndex={wk.index}
              totalWeeks={weeks.length}
              grandTotal={grandTotal}
              grandHrs={grandHrs}
              grandOTHrs={grandOTHrs}
              isFirstPage={pi === 0}
              userPrefs={userPrefs}
            />
          );
        });
      }

      if (mode === "grid" && crewList) {
        const weeksToRender = exportWeekIndex !== null && exportWeekIndex !== undefined
          ? [weeks[exportWeekIndex]].filter(Boolean)
          : weeks;

        const totalPages = weeksToRender.length;

        weeksToRender.forEach((wk, pi) => {
          const weekDates = weekDateRange(wk.start);
          pages.push(
            <GridPage
              key={wk.start}
              crew={crewList}
              weekDates={weekDates}
              allDays={days}
              production={production}
              weekIndex={wk.index}
              totalWeeks={weeks.length}
              pageNum={pi + 1}
              totalPages={totalPages}
              isFirstPage={pi === 0}
              userPrefs={userPrefs}
            />
          );
        });
      }

      return ReactDOM.createPortal(
        <div id="print-view">
          <style dangerouslySetInnerHTML={{ __html: PRINT_STYLES }} />
          {pages}
        </div>,
        document.body
      );
    }

    /* ── Invoice PDF document (shared by print + email blob paths) ── */
    function InvoiceDocument({ invoice, userPrefs }) {
      const fmtInvDate = (iso) => {
        if (!iso) return "";
        return new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
      };

      const isExpenseLine = (item) => item.isExpense || (item.label || "").startsWith("Expense:");
      const cleanExpenseLabel = (item) => {
        if (item.isExpense) return item.label || "";
        return (item.label || "").replace(/^Expense:\s*/i, "").trim() || (item.label || "");
      };

      const allLines = invoice.lineItems || [];
      const normalLines = allLines.filter(l => !isExpenseLine(l));
      const expenseLines = allLines.filter(l => isExpenseLine(l));
      const showInd = invoice.showIndividualExpenses === true;

      const subtotal = allLines.reduce((s, l) => s + getLineTotal(l), 0);
      const vatAmount = invoice.vatRegistered ? subtotal * (invoice.vatRate || 20) / 100 : 0;
      const total = subtotal + vatAmount;

      const renderLineRows = (item, labelOverride) => {
        const label = labelOverride ?? item.label ?? "";
        const isFixed = item.rate === null;
        const hasDisc = item.discountedQty !== null;
        const billedQty = hasDisc ? item.discountedQty : item.qty;
        const fullyWaived = hasDisc && (isFixed || billedQty === 0);
        const partiallyWaived = hasDisc && !fullyWaived && billedQty < item.qty;
        const waivedQty = partiallyWaived ? (item.qty - billedQty) : 0;
        const rows = [];

        if (fullyWaived) {
          // Single strikethrough row — no kept portion
          rows.push(
            <tr key={`${item.id}-w`} className="waived">
              <td>
                <div>
                  {label}
                  <span className="waived-badge">Waived</span>
                </div>
                {item.detail && <div className="line-detail">{item.detail}</div>}
              </td>
              <td className="num">{isFixed ? "" : item.qty}</td>
              <td className="num">{isFixed ? "" : fmtGBP(item.rate)}</td>
              <td className="num">{isFixed ? fmtGBP(item.amount) : fmtGBP(item.qty * item.rate)}</td>
            </tr>
          );
        } else {
          // Kept portion row (always rendered)
          rows.push(
            <tr key={`${item.id}-k`}>
              <td>
                <div>{label}</div>
                {item.detail && <div className="line-detail">{item.detail}</div>}
              </td>
              <td className="num">{isFixed ? "" : (partiallyWaived ? billedQty : item.qty)}</td>
              <td className="num">{isFixed ? "" : fmtGBP(item.rate)}</td>
              <td className="num">
                {isFixed
                  ? fmtGBP(item.amount)
                  : fmtGBP((partiallyWaived ? billedQty : item.qty) * item.rate)}
              </td>
            </tr>
          );
          // Waived portion row (only if partial)
          if (partiallyWaived) {
            rows.push(
              <tr key={`${item.id}-w`} className="waived">
                <td>
                  <div>
                    {label}
                    <span className="waived-badge">Waived</span>
                  </div>
                </td>
                <td className="num">{waivedQty}</td>
                <td className="num">{fmtGBP(item.rate)}</td>
                <td className="num">{fmtGBP(waivedQty * item.rate)}</td>
              </tr>
            );
          }
        }
        return rows;
      };

      const bankFields = [
        { key: "Bank",         val: invoice.bankName },
        { key: "Account name", val: invoice.bankAccountName },
        { key: "Sort code",    val: invoice.bankSortCode },
        { key: "Account no.",  val: invoice.bankAccountNumber },
        { key: "IBAN",         val: invoice.bankIBAN },
        { key: "SWIFT/BIC",    val: invoice.bankSWIFT },
      ].filter(f => f.val && String(f.val).trim());

      return (
        <div id="invoice-print-view" className="invoice-print-root">
          <style dangerouslySetInnerHTML={{ __html: INVOICE_PRINT_STYLES }} />
          <div className="invoice-page">

            {/* Header */}
            <div className="invoice-header">
              <div className="brand-block">
                {userPrefs.logoBase64 ? (
                  <img src={userPrefs.logoBase64} alt="" className="brand-logo"/>
                ) : (
                  <>
                    <div className="brand-name">{invoice.fromName || ""}</div>
                    {invoice.fromCompanyName && <div className="brand-meta">{invoice.fromCompanyName}</div>}
                  </>
                )}
              </div>
              <div className="right">
                <div className="invoice-label">Invoice</div>
                <div className="invoice-number">{invoice.invoiceNumber}</div>
                <div className="dates">
                  <div>Issued <strong>{fmtInvDate(invoice.invoiceDate)}</strong></div>
                  <div>Due <strong>{fmtInvDate(invoice.dueDate)}</strong></div>
                </div>
              </div>
            </div>

            {/* Parties */}
            <div className="invoice-parties">
              <div>
                <div className="invoice-section-label">From</div>
                <div className="party-name">{invoice.fromName || ""}</div>
                {invoice.fromCompanyName && <div className="party-line">{invoice.fromCompanyName}</div>}
                {invoice.fromAddress && <div className="party-line">{invoice.fromAddress}</div>}
                {invoice.fromEmail && <div className="party-line">{invoice.fromEmail}</div>}
                {invoice.vatRegistered && invoice.vatNumber && (
                  <div className="party-line">VAT: {invoice.vatNumber}</div>
                )}
              </div>
              {(invoice.toName || invoice.toAddress || invoice.toEmail) && (
                <div>
                  <div className="invoice-section-label">Bill To</div>
                  {invoice.toName && <div className="party-name">{invoice.toName}</div>}
                  {invoice.toAddress && <div className="party-line">{invoice.toAddress}</div>}
                  {invoice.toEmail && <div className="party-line">{invoice.toEmail}</div>}
                </div>
              )}
            </div>

            {/* Job strip — 2×2 grid: Job | Ref / Role | Shoot dates */}
            {(invoice.jobTitle || invoice.jobRole || invoice.jobReference || invoice.shootDateStart) && (
              <div className="invoice-job-strip">
                <div className="job-row">
                  {invoice.jobTitle
                    ? <><span className="job-key">Job</span><span className="job-val">{invoice.jobTitle}</span></>
                    : null}
                </div>
                <div className="job-row">
                  {invoice.jobReference
                    ? <><span className="job-key">Ref</span><span className="job-val">{invoice.jobReference}</span></>
                    : null}
                </div>
                <div className="job-row">
                  {invoice.jobRole
                    ? <><span className="job-key">Role</span><span className="job-val">{invoice.jobRole}</span></>
                    : null}
                </div>
                <div className="job-row">
                  {invoice.shootDateStart
                    ? <><span className="job-key">Dates</span><span className="job-val">
                        {invoice.shootDateStart === invoice.shootDateEnd || !invoice.shootDateEnd
                          ? fmtInvDate(invoice.shootDateStart)
                          : `${fmtInvDate(invoice.shootDateStart)} – ${fmtInvDate(invoice.shootDateEnd)}`}
                      </span></>
                    : null}
                </div>
              </div>
            )}

            {/* Lines */}
            <div className="invoice-lines-wrap">
              <div className="invoice-section-label">Line Items</div>
              <table className="invoice-lines">
                <thead>
                  <tr>
                    <th style={{ width: '52%' }}>Description</th>
                    <th style={{ width: '10%' }}>Qty</th>
                    <th style={{ width: '18%' }}>Rate</th>
                    <th style={{ width: '20%' }}>Amount</th>
                  </tr>
                </thead>
                <tbody>
                  {normalLines.map(item => renderLineRows(item))}
                  {!showInd && expenseLines.length > 0 && (() => {
                    const sum = expenseLines.reduce((s, l) => s + getLineTotal(l), 0);
                    return (
                      <tr key="expenses-rollup">
                        <td>
                          <div>Expenses</div>
                          <div className="line-detail">{expenseLines.length} item{expenseLines.length !== 1 ? "s" : ""}</div>
                        </td>
                        <td className="num"></td>
                        <td className="num"></td>
                        <td className="num">{fmtGBP(sum)}</td>
                      </tr>
                    );
                  })()}
                  {showInd && expenseLines.map(item => renderLineRows(item, cleanExpenseLabel(item)))}
                </tbody>
              </table>
            </div>

            {/* Totals */}
            <div className="invoice-totals">
              <div className="totals-stack">
                {invoice.vatRegistered ? (
                  <>
                    <div className="row">
                      <span className="label">Subtotal</span>
                      <span className="value">{fmtGBP(subtotal)}</span>
                    </div>
                    <div className="row">
                      <span className="label">VAT ({invoice.vatRate || 20}%)</span>
                      <span className="value">{fmtGBP(vatAmount)}</span>
                    </div>
                    <div className="row grand">
                      <span className="label">Total due</span>
                      <span className="value">{fmtGBP(total)}</span>
                    </div>
                  </>
                ) : (
                  <div className="row grand">
                    <span className="label">Total due</span>
                    <span className="value">{fmtGBP(total)}</span>
                  </div>
                )}
              </div>
            </div>

            {/* Notes — split into per-day blocks so page-break-inside: avoid keeps each day together */}
            {invoice.notes && invoice.notes.trim() && (
              <div className="invoice-notes">
                <div className="invoice-section-label">Notes</div>
                <div className="invoice-notes-body">
                  {invoice.notes.split(/\n\n+/).map((block, i) => (
                    <div key={i} className="notes-day">{block}</div>
                  ))}
                </div>
              </div>
            )}

            {/* Bank */}
            {bankFields.length > 0 && (
              <div className="invoice-bank">
                <div className="invoice-section-label">Payment Details</div>
                <div className="invoice-bank-grid">
                  {bankFields.map(f => (
                    <div key={f.key} className="invoice-bank-field">
                      <div className="key">{f.key}</div>
                      <div className="val">{f.val}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Footer */}
            <div className="invoice-footer">
              Generated with <strong>TIMEMACHINE</strong> · timemachineapp.co.uk
            </div>
          </div>

    /* ── Portal wrapper for window.print() flow ── */

        document.body

    /* ── mailto: email opener ── */
    function openInvoiceMailto(invoice) {
      const recipient = (invoice.toEmail || '').trim();
      const subjectBase = `Invoice ${invoice.invoiceNumber}`;
      const subject = invoice.jobTitle ? `${subjectBase} — ${invoice.jobTitle}` : subjectBase;

      const subtotal = invoiceSubtotal(invoice.lineItems);
      const vatAmount = invoice.vatRegistered ? subtotal * (Number(invoice.vatRate) || 20) / 100 : 0;
      const totalStr = fmtGBP(subtotal + vatAmount);
      const fromName = invoice.fromName || invoice.fromCompanyName || '';
      const jobBit = invoice.jobTitle ? ` for ${invoice.jobTitle}` : '';
      const body = `Hi,\n\nPlease find attached invoice ${invoice.invoiceNumber}${jobBit}, total ${totalStr}.\n\nPlease quote ${invoice.invoiceNumber} when making payment.\n\nMany thanks,\n${fromName}`;

      const params = new URLSearchParams();
      if (subject) params.set('subject', subject);
      if (body) params.set('body', body);
      const queryString = params.toString().replace(/\+/g, '%20');
      window.location.href = `mailto:${encodeURIComponent(recipient)}?${queryString}`;
    }

    const IArrowLeft = (p) => <Icon {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></Icon>;
    const IArrowRight = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Icon>;
    const IHome = (p) => <Icon {...p}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>;
    const ISearch = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;

    const IReceipt = (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16l3-2 2 2 2-2 2 2 2-2 3 2V4a2 2 0 0 0-2-2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></Icon>;

    /* ═══════════════════════════ UI PRIMITIVES ═══════════════════════════ */

    const Btn = ({ children, variant = "primary", size = "md", className = "", ...p }) => {
      const base = "inline-flex items-center gap-2 font-semibold uppercase tracking-wide transition-all border active:scale-95 disabled:opacity-40 disabled:pointer-events-none";
      const variants = {
        primary: "bg-sky-400 border-sky-500 text-black hover:bg-sky-300",
        ghost:   "bg-transparent border-neutral-700 text-neutral-200 hover:bg-neutral-800 hover:border-neutral-600",
        danger:  "bg-red-600 border-red-700 text-white hover:bg-red-500",
        success: "bg-green-500 border-green-600 text-black hover:bg-green-400",
        subtle:  "bg-neutral-800 border-neutral-700 text-neutral-200 hover:bg-neutral-700",
      };
      const sizes = { sm: "px-2 py-1.5 text-[10px] rounded-[20px]", md: "px-3 py-2.5 text-xs rounded-lg", lg: "px-5 py-3 text-sm rounded-lg" };
      return <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...p}>{children}</button>;
    };

    const Field = ({ label, children, hint, disabled }) => (
      <label className={`block ${disabled ? "opacity-40" : ""}`}>
        <div className="text-[10px] uppercase tracking-wide text-sky-400 font-bold mb-1">{label}</div>
        {children}
        {hint && <div className="text-[10px] text-neutral-500 mt-1 leading-tight">{hint}</div>}
      </label>
    );

    const Input = ({ type, style, className, onFocus: onFocusProp, ...p }) => {
      const isDate = type === "date";
      const handleFocus = (e) => {
        if (type === 'number') e.target.select();
        if (onFocusProp) onFocusProp(e);
      };
      return <input type={type} onFocus={handleFocus} {...p}
        style={isDate ? { WebkitAppearance: 'none', fontSize: 14, ...style } : style}
        className={`w-full min-w-0 bg-neutral-800 border border-neutral-700 focus:border-sky-400 focus:ring-1 focus:ring-sky-400/40 text-neutral-100 placeholder:text-neutral-500 px-2.5 py-2 font-mono outline-none rounded-lg ${className || ""}`}
      />;
    };
    const TimeInput = ({ onChange, value, className, style, ...p }) => {
      const roundTo5 = (timeStr) => {
        if (!timeStr || typeof timeStr !== 'string') return timeStr;
        const m = timeStr.match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return timeStr;
        const totalMins = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const min = rounded % 60;
        return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
      };
      const handleBlur = (e) => {
        const newVal = roundTo5(e.target.value);
        if (newVal !== e.target.value && onChange) {
          onChange({ target: { value: newVal } });
        }
        if (p.onBlur) p.onBlur(e);
      };
      return <Input type="time" step="300" value={value} onChange={onChange} onBlur={handleBlur}
        className={`min-w-0 ${className || ""}`}
        style={{ WebkitAppearance: 'none', ...style }}
        {...p} />;
    };
    const Select = ({ children, ...p }) => <select {...p} className={`w-full bg-neutral-800 border border-neutral-700 focus:border-sky-400 focus:ring-1 focus:ring-sky-400/40 text-neutral-100 px-2.5 py-2 outline-none rounded-lg ${p.className || ""}`}>{children}</select>;

    const StatusMsg = ({ kind = "info", children }) => {
      const colors = { ok: "text-green-400", info: "text-neutral-400", warn: "text-amber-400", bad: "text-red-400" };
      const bgs    = { ok: "bg-green-900/20", info: "bg-neutral-800/40", warn: "bg-amber-900/20", bad: "bg-red-900/20" };
      const icons = { ok: <ICheck/>, info: <IInfo/>, warn: <IAlert/>, bad: <IWarn/> };
      return (
        <div className={`text-[11px] ${colors[kind]} ${bgs[kind]} flex items-start gap-1.5 leading-tight mt-1 px-2.5 py-1.5 rounded-[6px]`}>
          <span className="mt-0.5">{icons[kind]}</span>
          <span>{children}</span>
        </div>
      );
    };

    const Toggle = ({ value, onChange, disabled, ariaLabel }) => (
      <button
        type="button"
        role="switch"
        aria-checked={!!value}
        aria-label={ariaLabel || ""}
        disabled={!!disabled}
        onClick={() => !disabled && onChange(!value)}
        className={`relative inline-flex shrink-0 rounded-full transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-sky-400/40 focus:ring-offset-1 focus:ring-offset-neutral-900 ${value ? "bg-sky-400" : "bg-neutral-700"} ${disabled ? "opacity-50 cursor-not-allowed" : "cursor-pointer"}`}
        style={{ width: 56, height: 30, padding: 0 }}
      >
        <span
          className="pointer-events-none absolute rounded-full bg-white shadow-sm transition-transform duration-150 ease-out"
          style={{ width: 26, height: 24, top: 3, left: 3, transform: value ? "translateX(26px)" : "translateX(0)" }}
        />
      </button>
    );

    const Toast = ({ show, children }) => (
      <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-green-500 text-black px-5 py-2 text-xs uppercase tracking-wide font-bold border border-green-600 rounded-full shadow-lg transition-all ${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>

    function NowBtn({ tone = "sky", onClick, label }) {
      const colors = {
        sky: "bg-sky-600 hover:bg-sky-500 text-white",
        orange: "bg-orange-600 hover:bg-orange-500 text-white",
        green: "bg-green-600 hover:bg-green-500 text-white",

      return (
        <button
          type="button"
          onClick={onClick}
          className={`flex-shrink-0 text-[10px] uppercase tracking-wider font-bold px-2 py-1 rounded-md transition-colors ${colors[tone] || colors.sky}`}

    /* ═══════════════════════════ PRODUCTION FORM ═══════════════════════════ */

    function ProductionForm({ production, setProduction, onOpenSettings }) {
      const isUntitled = production.title === "Untitled Production" || !production.title;
      const hasCustomWeekend = (production.satRateMode && production.satRateMode !== "apa") || (production.sunRateMode && production.sunRateMode !== "apa");
      return (
        <div className="space-y-4">
          <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><IBriefcase size={16}/>Production Setup</h2>

          {isUntitled && (
            <div className="bg-sky-950/40 border border-sky-800 px-4 py-3 text-sm text-sky-300 flex items-center gap-2 rounded-[10px]">
              <IInfo size={14}/> Give this production a name to get started.
            </div>
          )}

          <div className="bg-neutral-900 border border-neutral-800 rounded-[10px] p-4 flex items-center justify-between gap-3">
            <div className="min-w-0">
              <div className="font-semibold text-neutral-100 truncate">{production.title || <span className="text-neutral-500 italic">Untitled Production</span>}</div>
              {production.prodCo && <div className="text-sm text-neutral-400 truncate">{production.prodCo}</div>}
              <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                {production.startDate && <span className="text-[11px] text-neutral-500 font-mono">{fmtDateShort(production.startDate)}</span>}

          </div>

    /* ═══════════════════════════ CREW MANAGER ═══════════════════════════ */

    function CrewManager({ crew, setCrew, autoStart = false, onAutoStartConsumed, onPushUndo }) {
      const [editing, setEditing] = useState(null);
      const blank = { id: "", name: "", role: "Lighting Technician", bdr: ROLE_DEFAULTS["Lighting Technician"].bdr, otCoef: ROLE_DEFAULTS["Lighting Technician"].otCoef, otRate: ROLE_DEFAULTS["Lighting Technician"].otRate ?? null, vatRegistered: false, vatRate: 20, kitMoneyEnabled: false, kitMoneyAmount: 0, isDriver: false };
      const [form, setForm] = useState(blank);
      const [confirmRemove, setConfirmRemove] = useState(null);
      const dragIdx = useRef(null);
      const [overIdx, setOverIdx] = useState(null);

      useEffect(() => {
        if (autoStart) {
          setForm({ ...blank, id: uid() });
          setEditing("new");
          onAutoStartConsumed?.();
        }
      }, []);

      const startNew = () => { setForm({ ...blank, id: uid() }); setEditing("new"); };
      const startEdit = (c) => { setForm({ ...c }); setEditing(c.id); };
      const cancel = () => { setEditing(null); setForm(blank); };
      const save = () => {
        if (!form.name.trim()) return;
        setCrew((prev) => {
          const exists = prev.find((c) => c.id === form.id);
          return exists ? prev.map((c) => (c.id === form.id ? form : c)) : [...prev, form];
        });
        cancel();
      };
      const remove = (id) => { onPushUndo('Crew member removed'); setCrew((prev) => prev.filter((c) => c.id !== id)); setConfirmRemove(null); };
      const onRoleChange = (role) => { const d = ROLE_DEFAULTS[role] || {}; setForm((f) => ({ ...f, role, bdr: d.bdr ?? f.bdr, otCoef: d.otCoef ?? autoOtCoef(d.bdr ?? f.bdr), otRate: d.otRate ?? null })); };
      const sortByRole = () => {
        setCrew((prev) => [...prev].sort((a, b) => {
          const r = roleRank(a.role) - roleRank(b.role);
          return r !== 0 ? r : a.name.localeCompare(b.name);
        }));
      };
      const moveUp = (i) => { if (i === 0) return; setCrew((prev) => { const n = [...prev]; [n[i-1], n[i]] = [n[i], n[i-1]]; return n; }); };
      const moveDown = (i) => { setCrew((prev) => { if (i >= prev.length - 1) return prev; const n = [...prev]; [n[i+1], n[i]] = [n[i], n[i+1]]; return n; }); };

      const onDragStart = (i) => (e) => { dragIdx.current = i; e.dataTransfer.effectAllowed = "move"; };
      const onDragOver  = (i) => (e) => { e.preventDefault(); setOverIdx(i); };
      const onDragLeave = () => setOverIdx(null);
      const onDrop = (i) => (e) => {
        e.preventDefault();
        const from = dragIdx.current;
        if (from === null || from === i) { dragIdx.current = null; setOverIdx(null); return; }
        setCrew((prev) => {
          const next = [...prev];
          const [moved] = next.splice(from, 1);
          next.splice(i, 0, moved);
          return next;
        });
        dragIdx.current = null; setOverIdx(null);
      };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><IUsers size={16}/>Crew Roster</h2>
            <div className="flex gap-2">
              {crew.length > 1 && <Btn variant="ghost" onClick={sortByRole}><ISort/>Sort by Role</Btn>}
              <Btn variant="primary" onClick={startNew}><IPlus/>Add Crew</Btn>
            </div>
          </div>

          {crew.length === 0 && (
            <div className="bg-neutral-900 border border-dashed border-neutral-700 p-8 text-center rounded-[10px]">
              <div className="flex justify-center mb-2 text-neutral-700"><IUsers size={32}/></div>
              <div className="text-neutral-500 text-sm">No crew yet. Hit <span className="text-sky-400 font-bold">ADD CREW</span> to start.</div>
            </div>
          )}

          <div className="space-y-1">
            {crew.map((c, i) => (
              <div
                key={c.id}
                draggable
                onDragStart={onDragStart(i)}
                onDragOver={onDragOver(i)}
                onDragLeave={onDragLeave}
                onDrop={onDrop(i)}
                className={`bg-neutral-900 border transition-all flex items-center justify-between p-3 gap-2 rounded-[10px] ${overIdx === i ? "border-sky-400 border-t-4" : "border-neutral-800 hover:border-neutral-700"}`}
              >
                <div className="flex items-center gap-2 flex-1 min-w-0">
                  <div className="flex flex-col gap-0.5">
                    <button onClick={() => moveUp(i)} className="p-1 text-neutral-600 hover:text-sky-400 disabled:opacity-20" disabled={i === 0}><IUp/></button>
                    <button onClick={() => moveDown(i)} className="p-1 text-neutral-600 hover:text-sky-400 disabled:opacity-20" disabled={i === crew.length - 1}><IDown/></button>
                  </div>
                  <div className="text-neutral-600 hidden sm:block"><IGrip/></div>
                  <div className="min-w-0">
                    <div className="font-semibold text-neutral-100 truncate">{c.name}</div>
                    <div className="text-[11px] text-neutral-400 font-mono truncate">{c.role} · BDR {fmtGBP(c.bdr)} · BHR {fmtGBP(c.bdr / 10)} · OT {c.otCoef}×{c.vatRegistered ? ` · VAT ${c.vatRate ?? 20}%` : ''}{c.kitMoneyEnabled ? ` · Kit ${fmtGBP(c.kitMoneyAmount ?? 0)}/day` : ''}{c.isDriver ? ' · Driver' : ''}</div>
                  </div>
                </div>
                <div className="flex gap-1 flex-shrink-0">
                  {confirmRemove === c.id ? (
                    <>
                      <Btn size="sm" variant="danger" onClick={() => remove(c.id)}>Confirm</Btn>
                      <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(null)}>Cancel</Btn>
                    </>
                  ) : (
                    <>
                      <Btn size="sm" variant="ghost" onClick={() => startEdit(c)} aria-label="Edit crew member"><IPencil/></Btn>
                      <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(c.id)} aria-label="Delete crew member"><ITrash/></Btn>
                    </>
                  )}
                </div>
              </div>
            ))}
          </div>

          {editing && (
            <CrewEditModal
              editing={editing}
              form={form}
              setForm={setForm}
              onSave={save}
              onCancel={cancel}
              onRoleChange={onRoleChange}
            />
          )}
        </div>
      );
    }

    /* ═══════════════════════════ CREW EDIT MODAL ═══════════════════════════ */

    function CrewEditModal({ editing, form, setForm, onSave, onCancel, onRoleChange }) {
      const [selectedDept, setSelectedDept] = useState(() => ROLE_TO_DEPT[form.role] || "All");

      useEffect(() => {
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = ""; };
      }, []);

      const onDeptChange = (dept) => {
        setSelectedDept(dept);
        if (dept !== "All") {
          const firstRole = Object.keys(DEPARTMENTS[dept])[0];
          onRoleChange(firstRole);
        }
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.78)" }}
          onClick={onCancel}
        >
          <div
            className="bg-neutral-900 w-full rounded-[10px] shadow-2xl border border-neutral-700 flex flex-col"
            style={{ maxWidth: 640, maxHeight: "calc(100dvh - env(safe-area-inset-top) - 1rem)" }}
            onClick={e => e.stopPropagation()}
          >
            {/* ── Fixed header ── */}
            <div className="flex-shrink-0 px-5 pb-3 border-b border-neutral-700" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 1rem)' }}>
              <div className="flex items-start justify-between gap-3">
                <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold">
                  {editing === "new" ? "Add crew member" : "Edit crew member"}
                </div>
                <button onClick={onCancel} className="text-neutral-500 hover:text-neutral-200 transition-colors flex-shrink-0 mt-0.5 p-0.5" aria-label="Close"><IX size={16}/></button>
              </div>
            </div>

            {/* ── Scrollable body ── */}
            <div className="flex-1 overflow-y-auto px-5 py-4 min-h-0">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <Field label="Name"><Input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="e.g. Declan Duffy" /></Field>
                <Field label="Department">
                  <Select value={selectedDept} onChange={(e) => onDeptChange(e.target.value)}>
                    <option value="All">All departments</option>
                    {Object.keys(DEPARTMENTS).map((d) => <option key={d} value={d}>{d}</option>)}
                  </Select>
                </Field>
                <Field label="Role">
                  <Select key={selectedDept} value={form.role} onChange={(e) => onRoleChange(e.target.value)}>
                    {selectedDept === "All"
                      ? Object.entries(DEPARTMENTS).map(([dept, roles]) =>
                          <optgroup key={dept} label={dept}>
                            {Object.keys(roles).map((r) => <option key={r} value={r}>{r}</option>)}
                          </optgroup>
                        )
                      : Object.keys(DEPARTMENTS[selectedDept]).map((r) => <option key={r} value={r}>{r}</option>)
                    }
                  </Select>
                </Field>
                <Field label="Basic Day Rate (£)" hint="Editable — default is APA max for role">
                  <Input type="number" step="0.01" value={form.bdr} onChange={(e) => { const bdr = Number(e.target.value); setForm({ ...form, bdr, otCoef: autoOtCoef(bdr) }); }} />
                </Field>
                <Field label="OT Coefficient" hint="Grade I=1.5× · II=1.25× · III=1.0×">
                  <Select value={form.otCoef} onChange={(e) => setForm({ ...form, otCoef: Number(e.target.value) })}>
                    <option value={1.5}>Grade I — 1.5×</option>
                    <option value={1.25}>Grade II — 1.25×</option>
                    <option value={1}>Grade III — 1.0×</option>
                  </Select>
                </Field>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">VAT Registered</span>
                  <Toggle value={form.vatRegistered} onChange={(v) => setForm({ ...form, vatRegistered: v })} ariaLabel="VAT registered" />
                </div>
                {form.vatRegistered && (
                  <Field label="VAT Rate (%)" hint="Usually 20%">
                    <Input type="number" min="0" max="100" step="1" value={form.vatRate ?? 20} onChange={(e) => setForm({ ...form, vatRate: Number(e.target.value) })} />
                  </Field>
                )}
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Kit Money</span>
                  <Toggle value={form.kitMoneyEnabled} onChange={(v) => setForm({ ...form, kitMoneyEnabled: v })} ariaLabel="Kit money" />
                </div>
                {form.kitMoneyEnabled && (
                  <Field label="Kit Money Amount (£)" hint="Added to each working day">
                    <Input type="number" min="0" step="0.01" value={form.kitMoneyAmount ?? 0} onChange={(e) => setForm({ ...form, kitMoneyAmount: Number(e.target.value) })} />
                  </Field>
                )}
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Driver</div>
                    <div className="text-[10px] text-neutral-500 mt-0.5">Shows truck call time on day entries</div>
                  </div>
                  <Toggle value={form.isDriver} onChange={(v) => setForm({ ...form, isDriver: v })} ariaLabel="Driver" />
                </div>
              </div>
            </div>

            {/* ── Fixed footer ── */}
            <div className="flex-shrink-0 border-t border-neutral-700 px-5 pt-3 flex gap-2" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>
              <Btn onClick={onSave} variant="success"><ICheck/>Save</Btn>
              <Btn onClick={onCancel} variant="ghost"><IX/>Cancel</Btn>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ CANCELLATION CALC MODAL ═══════════════════════════ */

    const CANCEL_DAY_TYPES = ["Shoot", "Recce", "Pre-light", "Build", "Strike"];

    function cancellationPercent(noticeDate, shootDate) {
      if (!noticeDate || !shootDate) return 0;
      const a = new Date(noticeDate + "T12:00:00");
      const b = new Date(shootDate + "T12:00:00");
      const days = Math.round((b - a) / 86400000);
      if (days < 0) return 0;
      if (days <= 1) return 1;
      if (days <= 3) return 0.75;
      if (days <= 6) return 0.5;
      return 0;
    }

    function CancellationCalcModal({ production, setProduction, crew, setCrew, onClose, userPrefs }) {
      useEffect(() => {
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = ""; };
      }, []);

      // Standalone crew-entry state (used when setCrew is provided)
      const [newName, setNewName] = useState("");
      const [newBDR, setNewBDR] = useState("");
      const [unlockedRowIds, setUnlockedRowIds] = useState(new Set());
      const [showAddPerson, setShowAddPerson] = useState(false);

      const data = production.cancellationData;

      const defaultColumns = useMemo(() => {
        const start = production.startDate || todayISO();
        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(start + "T12:00:00");
          d.setDate(d.getDate() + i);
          return { id: `default-${i}`, date: d.toISOString().slice(0, 10), dayType: "Shoot" };
        });
      }, [production.startDate]);

      const noticeDate = data?.noticeDate || "";
      const columns = data ? (data.columns || []) : defaultColumns;
      const agreedFees = data?.agreedFees || {};

      const commit = (patch) => setProduction(p => {
        const current = p.cancellationData || { noticeDate: "", columns: defaultColumns, agreedFees: {} };
        return { ...p, cancellationData: { ...current, ...patch } };
      });

      const setNotice = (d) => commit({ noticeDate: d });
      const setColumns = (cols) => commit({ columns: cols });
      const setAgreedFee = (crewId, columnId, value) => {
        const next = { ...agreedFees, [crewId]: { ...(agreedFees[crewId] || {}), [columnId]: value } };
        commit({ agreedFees: next });
      };

      const updateColumn = (id, patch) => setColumns(columns.map(c => c.id === id ? { ...c, ...patch } : c));
      const removeColumn = (id) => setColumns(columns.filter(c => c.id !== id));
      const addColumn = () => {
        const last = columns[columns.length - 1];
        let nextDate;
        if (last) {
          const d = new Date(last.date + "T12:00:00"); d.setDate(d.getDate() + 1);
          nextDate = d.toISOString().slice(0, 10);
        } else {
          nextDate = production.startDate || todayISO();
        }
        setColumns([...columns, { id: uid(), date: nextDate, dayType: "Shoot" }]);
      };

      const getAgreedFee = (member, col) => {
        const stored = agreedFees[member.id]?.[col.id];
        return stored !== undefined && stored !== "" ? Number(stored) || 0 : Number(member.bdr) || 0;
      };

      const crewCalcs = useMemo(() => crew.map(member => {
        const dayInfo = columns.map(col => ({
          col,
          agreedFee: getAgreedFee(member, col),
          pct: cancellationPercent(noticeDate, col.date),
        }));
        const planned = dayInfo.filter(d => d.agreedFee > 0);
        const isBlock = planned.length > 0 && planned.length <= 3;
        let cells;
        if (isBlock && noticeDate) {
          const earliest = [...planned].sort((a, b) => a.col.date.localeCompare(b.col.date))[0];
          const blockPct = cancellationPercent(noticeDate, earliest.col.date);
          cells = dayInfo.map(d => d.agreedFee > 0 ? d.agreedFee * blockPct : 0);
        } else {
          cells = dayInfo.map(d => d.agreedFee * d.pct);
        }
        return { member, dayInfo, cells, isBlock };
      }), [crew, columns, agreedFees, noticeDate]);

      const colTotals = columns.map((_, i) => crewCalcs.reduce((s, c) => s + (c.cells[i] || 0), 0));
      const grandTotal = colTotals.reduce((s, n) => s + n, 0);
      const rowTotals = crewCalcs.map(c => c.cells.reduce((s, n) => s + n, 0));

      const [copied, setCopied] = useState(false);
      const copyBreakdown = async () => {
        const lines = [];
        lines.push(production.title || "Production");
        lines.push(`Cancellation notice: ${noticeDate ? fmtDateShort(noticeDate) : "—"}`);
        crewCalcs.forEach(({ member, dayInfo, cells, isBlock }, ci) => {
          lines.push("");
          lines.push(`${member.name} — ${member.role}${isBlock ? " (block)" : ""}`);
          dayInfo.forEach((d, i) => {
            if (d.agreedFee <= 0) return;
            const pctUsed = isBlock
              ? cancellationPercent(noticeDate, [...dayInfo].filter(x => x.agreedFee > 0).sort((a, b) => a.col.date.localeCompare(b.col.date))[0].col.date)
              : d.pct;
            lines.push(`  ${fmtDateShort(d.col.date)} · ${d.col.dayType} · ${Math.round(pctUsed * 100)}% · ${fmtGBP(cells[i])}`);
          });
          lines.push(`  Individual total: ${fmtGBP(rowTotals[ci])}`);
        });
        lines.push("");
        lines.push(`Grand total: ${fmtGBP(grandTotal)}`);
        lines.push("");
        lines.push("—");
        lines.push("Generated with TimeMachine · timemachineapp.co.uk");
        await shareTextOrCopy(lines.join("\n"), production.title || "Cancellation fees");
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.78)" }}
          onClick={onClose}
        >
          <div
            className="bg-neutral-900 w-full rounded-[10px] shadow-2xl border border-neutral-700 flex flex-col"
            style={{ maxWidth: 1200, maxHeight: "calc(100dvh - env(safe-area-inset-top) - 1rem)" }}
            onClick={e => e.stopPropagation()}
          >
            {/* ── Fixed header ── */}
            <div className="flex-shrink-0 px-5 pb-3 border-b border-neutral-700 flex items-start justify-between gap-3" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 1rem)' }}>
              <div>
                <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-1">Cancellation Fees</div>
                <div className="text-[11px] text-neutral-500">APA §7 — fees calculated relative to notice date</div>
              </div>
              <button onClick={onClose} className="text-neutral-500 hover:text-neutral-200 transition-colors p-0.5" aria-label="Close"><IX size={16}/></button>
            </div>

            {/* ── Scrollable body ── */}
            <div className="flex-1 overflow-auto px-5 py-4 min-h-0">
              <div className="mb-4 max-w-xs">
                <Field label="Notice given on">
                  <Input type="date" value={noticeDate} onChange={(e) => setNotice(e.target.value)} />
                </Field>
              </div>

              {crew.length === 0 && !setCrew ? (
                <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-[10px]">
                  Add crew first to calculate cancellation fees.
                </div>
              ) : crew.length === 0 && setCrew ? (
                <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-[10px]">
                  Add a crew member below to begin.
                </div>
              ) : (
                <div className="overflow-x-auto border border-neutral-800 rounded-[10px]">
                  <table className="border-collapse text-[11px] w-full">
                    <thead>
                      <tr>
                        <th className="text-left px-3 py-2 text-[10px] uppercase tracking-wider text-neutral-500 font-bold border-r border-b border-neutral-700 bg-neutral-950 whitespace-nowrap" style={{ minWidth: 160 }}>Crew</th>
                        {setCrew && <th className="px-3 py-2 text-[10px] uppercase tracking-wider text-neutral-500 font-bold border-r border-b border-neutral-700 bg-neutral-950 whitespace-nowrap" style={{ minWidth: 140 }}>Day rate</th>}
                        {columns.map((col, i) => (
                          <th key={col.id} className="px-2 py-1.5 border-r border-b border-neutral-700 bg-neutral-950 align-top" style={{ minWidth: 130 }}>
                            <div className="flex items-center justify-between mb-1">
                              <span className="text-[9px] text-neutral-500 uppercase tracking-wider font-bold">Day {i+1}</span>
                              <button onClick={() => removeColumn(col.id)} className="text-neutral-700 hover:text-red-400 text-[11px] leading-none px-0.5" title="Remove column" aria-label="Remove column">✕</button>
                            </div>
                            <Input type="date" value={col.date} onChange={(e) => updateColumn(col.id, { date: e.target.value })} className="text-[10px] px-1.5 py-1 mb-1" />
                            <Select value={col.dayType} onChange={(e) => updateColumn(col.id, { dayType: e.target.value })} className="text-[10px] px-1.5 py-1">
                              {CANCEL_DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                            </Select>
                          </th>
                        ))}
                        <th className="px-3 py-2 border-r border-b border-l border-neutral-700 bg-neutral-950 text-right text-[10px] uppercase tracking-wider text-neutral-500 font-bold whitespace-nowrap">Total</th>
                        <th className="px-2 py-1.5 border-b border-neutral-700 bg-neutral-950 align-middle">
                          <button onClick={addColumn} className="px-2 py-1 text-[10px] uppercase tracking-wider text-sky-400 hover:text-sky-300 font-bold whitespace-nowrap" title="Add a day column" aria-label="Add a day column">+ Day</button>
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      {crewCalcs.map(({ member, dayInfo, cells, isBlock }, ci) => (
                        <tr key={member.id} className="border-b border-neutral-800">
                          <td className="px-3 py-2 border-r border-neutral-700 bg-neutral-950 whitespace-nowrap align-top">
                            <div className="flex items-start justify-between gap-1">
                              <div>
                                <div className="text-[11px] font-semibold text-neutral-200">
                                  {member.name}
                                  {member.isDefaultUser && <span className="text-[9px] text-neutral-500 font-normal ml-1">(you)</span>}
                                </div>
                                <div className="text-[9px] text-neutral-500 uppercase tracking-wider">{member.role}{isBlock ? " · Block" : ""}</div>
                              </div>
                              {setCrew && !member.isDefaultUser && (
                                <button onClick={() => setCrew(prev => prev.filter(c => c.id !== member.id))}
                                  className="text-neutral-700 hover:text-red-400 text-[11px] leading-none px-0.5 mt-0.5 flex-shrink-0"
                                  title="Remove" aria-label="Remove crew member">✕</button>
                              )}
                            </div>
                          </td>
                          {setCrew && (
                            <td className="px-3 py-2 border-r border-neutral-700 bg-neutral-950 align-middle">
                              {member.isDefaultUser ? (
                                unlockedRowIds.has(member.id) ? (
                                  <div className="flex items-center gap-1.5">
                                    <Input
                                      type="number" min="0" step="0.01"
                                      value={member.bdr}
                                      onChange={(e) => setCrew(prev => prev.map(c => c.id === member.id ? { ...c, bdr: Number(e.target.value) || 0 } : c))}
                                      className="text-[10px] px-1.5 py-1 w-20"
                                    />
                                    <Btn variant="ghost" size="sm"
                                      onClick={() => {
                                        setCrew(prev => prev.map(c => c.id === member.id ? { ...c, bdr: Number(userPrefs?.defaultBDR) || 0 } : c));
                                        setUnlockedRowIds(s => { const n = new Set(s); n.delete(member.id); return n; });
                                      }}
                                    >Reset</Btn>
                                  </div>
                                ) : (
                                  <div className="flex items-center gap-1.5">
                                    <span className="text-[11px] font-mono text-neutral-200 whitespace-nowrap">{fmtGBP(member.bdr)}</span>
                                    <Btn variant="ghost" size="sm"
                                      onClick={() => setUnlockedRowIds(s => new Set(s).add(member.id))}
                                    >Custom</Btn>
                                  </div>
                                )
                              ) : (
                                <Input
                                  type="number" min="0" step="0.01"
                                  value={member.bdr}
                                  onChange={(e) => setCrew(prev => prev.map(c => c.id === member.id ? { ...c, bdr: Number(e.target.value) || 0 } : c))}
                                  className="text-[10px] px-1.5 py-1"
                                />
                              )}
                            </td>
                          )}
                          {dayInfo.map((d, i) => (
                            <td key={d.col.id} className="px-2 py-1.5 border-r border-neutral-700 bg-neutral-900 align-top">
                              <Input
                                type="number"
                                min="0"
                                step="0.01"
                                value={d.agreedFee}
                                onChange={(e) => setAgreedFee(member.id, d.col.id, e.target.value)}
                                className="text-[10px] px-1.5 py-1"
                              />
                              {cells[i] > 0 && (
                                <div className="text-[10px] text-amber-400 font-mono mt-1">{fmtGBP(cells[i])}</div>
                              )}
                            </td>
                          ))}
                          <td className="px-3 py-2 border-r border-l border-neutral-700 bg-neutral-950 text-right align-middle whitespace-nowrap">
                            <span className="text-[11px] font-mono text-amber-400 font-bold">{fmtGBP(rowTotals[ci])}</span>
                          </td>
                          <td className="bg-neutral-950" />
                        </tr>
                      ))}
                      <tr className="border-t-2 border-neutral-700 bg-neutral-950">
                        <td className="px-3 py-2 text-[10px] uppercase tracking-wider text-neutral-400 font-bold border-r border-neutral-700">Total</td>
                        {setCrew && <td className="border-r border-neutral-700 bg-neutral-950" />}
                        {colTotals.map((t, i) => (
                          <td key={i} className="px-2 py-2 text-right text-[11px] font-mono text-neutral-200 border-r border-neutral-700 font-bold">{t > 0 ? fmtGBP(t) : "—"}</td>
                        ))}
                        <td className="px-3 py-2 text-right text-[12px] font-mono text-amber-400 font-bold whitespace-nowrap border-l border-neutral-700">{fmtGBP(grandTotal)}</td>
                        <td className="bg-neutral-950" />
                      </tr>
                    </tbody>
                  </table>
                </div>
              )}

              {setCrew && (
                <div className="mt-3">
                  {(showAddPerson || crew.length === 0) ? (
                    <div className="flex items-end gap-2 flex-wrap">
                      <div className="flex-1 min-w-[140px]">
                        <Field label="Name">
                          <Input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Crew member name" />
                        </Field>
                      </div>
                      <div style={{ width: 110 }}>
                        <Field label="Day rate (£)">
                          <Input type="number" min="0" step="0.01" value={newBDR} onChange={e => setNewBDR(e.target.value)} placeholder="0.00" />
                        </Field>
                      </div>
                      <Btn variant="primary" size="sm"
                        onClick={() => {
                          const name = newName.trim();
                          if (!name) return;
                          setCrew(prev => [...prev, { id: uid(), name, role: "Crew", bdr: Number(newBDR) || 0 }]);
                          setNewName(""); setNewBDR("");
                          setShowAddPerson(false);
                        }}
                        disabled={!newName.trim()}
                      ><IPlus size={14}/>Add</Btn>
                      {crew.length > 0 && (
                        <Btn variant="ghost" size="sm" onClick={() => { setShowAddPerson(false); setNewName(""); setNewBDR(""); }}>Cancel</Btn>
                      )}
                    </div>
                  ) : (
                    <Btn variant="ghost" size="sm" onClick={() => setShowAddPerson(true)}><IPlus size={14}/>Add person</Btn>
                  )}
                </div>
              )}

              <div className="mt-4 text-[10px] text-neutral-500 leading-relaxed">
                APA §7: 7+ days = 0% · 6–4 days = 50% · 3–2 days = 75% · 1 day or less = 100%. Days counted include the notice date and exclude the shoot date. Crew members with 3 or fewer planned days are calculated as a single block at the earliest day's percentage.
              </div>
            </div>

            {/* ── Fixed footer ── */}
            <div className="flex-shrink-0 border-t border-neutral-700 px-5 pt-3 flex justify-end gap-2" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>
              <Btn onClick={copyBreakdown} variant="ghost">{copied ? "Copied!" : "Copy breakdown"}</Btn>
              <Btn onClick={onClose} variant="ghost"><IX/>Close</Btn>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ DAY ENTRY FORM ═══════════════════════════ */

    function DayEntryForm({ value, onChange, crew, allCrewMode, fixedCrewId = null, fixedDate = null, isToday = false, showToast }) {
      const v = value;
      const set = (patch) => onChange({ ...v, ...patch });
      const bs = deriveBreakState(v);
      const [showTravelInfo, setShowTravelInfo] = useState(false);

      const computeNowHHMM = () => {
        const now = new Date();
        const totalMins = now.getHours() * 60 + now.getMinutes();
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const m = rounded % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      };

      const onDayTypeChange = (dayType) => {
        const callH = parseHHMM(v.callTime);
        const patch = { dayType };
        if (callH !== null) patch.wrapTime = toHHMM(callH + DEFAULT_HOURS[dayType]);
        set(patch);
      };
      const onCallChange = (callTime) => {
        const callH = parseHHMM(callTime);
        const patch = { callTime };
        if (callH !== null) {
          patch.wrapTime = toHHMM(callH + DEFAULT_HOURS[v.dayType]);
          patch.lunchStartTime = toHHMM(callH + 5);
          patch.secondBreakStartTime = toHHMM(callH + 11);
        }
        set(patch);
      };

      const callH = parseHHMM(v.callTime);
      const wrapH = parseHHMM(v.wrapTime);
      const autoNextDay = callH !== null && wrapH !== null && wrapH <= callH;
      const dow = dayOfWeek(v.date);
      const dayLabel = v.date ? weekday(v.date) : "";
      const isWeekend = dow === 0 || dow === 6;
      const bhName = getBankHolidayName(v.date);
      const isBH = !!bhName;
      const isTravelDay = v.dayType === "Travel Day";
      const activeCrew = fixedCrewId ? crew.find(c => c.id === fixedCrewId) : crew.find(c => c.id === v.crewId);
      // Step-up role wins over base role for both BWD-override and PMPA classification.
      const effectiveRole = (v.stepUpEnabled && v.stepUpRole) ? v.stepUpRole : (activeCrew?.role || "");
      const isPmpa = ROLE_DEFAULTS[effectiveRole]?.pmpa === true;
      const isDriverDay = activeCrew?.isDriver === true && !isTravelDay && !isPmpa;
      const role = effectiveRole;
      const bwdOverrideApplies = !isPmpa && ROLES_WITH_BWD_OVERRIDE.includes(role) &&
        ["Pre-light", ...DISCRETIONARY_LUNCH_DAY_TYPES].includes(v.dayType);

      const show2ndBreakSection = !isPmpa && !isTravelDay && bs && !bs.continuousDay && bs.secondBreakRequired;

      return (
        <div className="space-y-4">

          {/* ── Section: Day ── */}
          <SectionCard title="Day">
            <div className="space-y-3">
              {!fixedCrewId && !allCrewMode && (
                <Field label="Crew Member">
                  <Select value={v.crewId} onChange={(e) => set({ crewId: e.target.value })}>
                    <option value="">— Select —</option>
                    {crew.map((c) => <option key={c.id} value={c.id}>{c.name} ({c.role})</option>)}
                  </Select>
                </Field>
              )}
              {!fixedCrewId && allCrewMode && (
                <div className="bg-sky-950/30 border border-sky-800 p-2 rounded-[10px]">
                  <div className="text-[10px] uppercase tracking-[0.15em] text-sky-400 font-bold">All Crew Mode</div>
