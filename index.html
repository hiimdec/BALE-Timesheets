      const lateThreshold = callH + 5.5;
      const cwdThreshold  = callH + 6.5;
      // APA §2.3: lunch is only required on Shoot and Pre-light days. Other
      // non-shoot day types have no meal obligation, so CWD, late-lunch
      // penalties, and 2nd-break obligations do not apply.
      const cwdApplies = (effectiveDayType === "Shoot" || effectiveDayType === "Pre-light");
      const lunchLate = cwdApplies && !lunchMissed && lunchStartAbs > lateThreshold && lunchStartAbs <= cwdThreshold;
      const lunchVeryLate = cwdApplies && !lunchMissed && lunchStartAbs > cwdThreshold;
      const continuousDay = cwdApplies && (lunchMissed || lunchVeryLate);
      const sbDeadline = lunchEndAbs !== null ? lunchEndAbs + 5.5 : null;
      const secondBreakRequired = cwdApplies && !continuousDay && sbDeadline !== null && wrapAbs > sbDeadline;
      const cwd1Deadline = callH + 9;
      const cwd2Deadline = callH + 12.5;
      const cwd2Required = continuousDay && wrapAbs > cwd2Deadline;
      const sbStartH = parseHHMM(day.secondBreakStartTime);
      const sbStartAbs = absTime(sbStartH, callH);
      const sbDuration = Number(day.secondBreakDurationMins ?? 30);
      let sbState = "given";
      if (!secondBreakRequired) sbState = "na";
      else if (sbDuration === 0 || sbStartH === null) sbState = "missed";
      else if (sbStartAbs > sbDeadline + 0.001) sbState = "late";
      else if (sbDuration < 30) sbState = "curtailed";
      return {
        callH, wrapAbs, wrapNextDay, workedHrs,
        lunchStartAbs, lunchEndAbs, lunchDuration, lunchMissed,
        lateThreshold, cwdThreshold, lunchLate, lunchVeryLate,
        continuousDay, cwdApplies, sbDeadline, secondBreakRequired,
        sbStartAbs, sbDuration, sbState,
        cwd1Deadline, cwd2Deadline, cwd2Required,
      };
    }

    /* ═══════════════════════════ CALC ENGINE ═══════════════════════════ */

    function resolveDay(production, day, crew) {
      const defaultDay = production.defaultDay ?? {};
      const dayOverride = day.defaultDayOverride ?? {};
      return { ...DEFAULT_PRODUCTION_DAY, ...defaultDay, ...dayOverride, ...day };
    }

    const isPmpaRole = (crew) => ROLE_DEFAULTS[crew?.role]?.pmpa === true;

    function calculateDay(day, crew, weekendOpts = {}) {
      const bdr = Number(crew.bdr) || 0;
      const bhr = computeAPArate(bdr, 1, weekendOpts.apaRounding);
      const otCoef = crew.noOT ? 0 : (Number(crew.otCoef) || 1);
      const otRate = (crew.otRate != null && crew.otRate > 0) ? Number(crew.otRate) : computeAPArate(bdr, otCoef, weekendOpts.apaRounding);
      const bectuOtRate = (crew.otRate != null && crew.otRate > 0) ? Number(crew.otRate) : null;

      // APA §2.3: DoP, Art Director, Location Manager always work to BWD rules,
      // even on Prep / Recce / Build / De-rig / Pre-light days.
      const role = (crew && crew.role) || "";
      const bwdOverrideApplies = ROLES_WITH_BWD_OVERRIDE.includes(role) &&
        ["Pre-light", ...DISCRETIONARY_LUNCH_DAY_TYPES].includes(day.dayType);
      const effectiveDayType = bwdOverrideApplies ? "Shoot" : day.dayType;

      // Rest Day: flat BDR, no breaks, no OT, no penalties.
      if (effectiveDayType === "Rest Day") {
        return {
          meta: { workedHrs: 0, otHrs: 0, bhr, otRate, dayLabel: "Rest Day", notes: [], secondBreakRequired: false, continuousDay: false },
          lines: [{ label: "Rest Day (flat BDR)", detail: "", rate: null, qty: 1, amount: bdr }],
          total: bdr,
        };
      }

      // APA Appendix 1 §(a): Production Manager/Assistant/Runner use a
      // simpler framework — flat BDR with shoot-day multipliers and OT
      // beyond BWD only. Exempt from §2 (working-day rules), §3 (travel),
      // §4 (OT grade tables), §5 (TOC), §6 (break penalties).
      if (isPmpaRole(crew)) {
        return calculatePmpaDay(day, crew, weekendOpts);
      }

      const lines = [];
      const notes = [];
      const bs = deriveBreakState(day, effectiveDayType);
      if (bs === null) {
        return { meta: { workedHrs: 0, otHrs: 0, bhr, otRate, dayLabel: "—", notes: ["Missing or invalid call/wrap time"], secondBreakRequired: false, continuousDay: false }, lines: [], total: 0 };
      }
      const { callH, wrapAbs, wrapNextDay, workedHrs, lunchDuration, lunchMissed, continuousDay, secondBreakRequired, sbState, cwd2Required } = bs;
      const preCallTime = day.preCallTime || day.truckCallTime; // back-compat with legacy truckCallTime
      const preCallH = preCallTime ? parseHHMM(preCallTime) : null;
      const preUnitHrs = (() => {
        if (preCallH === null) return 0;
        if (preCallH < callH) return callH - preCallH;           // same day: pre-call → main call
        if (preCallH > callH) return (24 - preCallH) + callH;   // pre-call before midnight, main call after
        return 0;
      })();
      if (preUnitHrs > 0) {
        lines.push({ label: "Pre-call", detail: `${preCallTime} – ${day.callTime}`, rate: bhr, qty: preUnitHrs, amount: preUnitHrs * bhr });
      }
      const dow = dayOfWeek(day.date);
      const isSunday = dow === 0;
      const isSaturday = dow === 6;
      const isBH = isBankHoliday(day.date);
      const isNightPre5  = callH < 5;
      const isNightPost5 = callH >= 17;
      const isNightShoot = isNightPre5 || isNightPost5;
      const isEarly = !isNightShoot && callH >= 5 && callH < 7;
      const isLate  = !isNightShoot && callH >= 11 && callH < 17;
      const callWrapLabel = `${day.callTime} – ${day.wrapTime}${wrapNextDay ? " (+1)" : ""}`;

      const satMode = weekendOpts.satRateMode ?? "apa";
      const sunMode = weekendOpts.sunRateMode ?? "apa";
      const satMult = satMode === "custom" ? (Number(weekendOpts.satRateCustom) || 1.5) : 1.5;
      const sunMult = sunMode === "custom" ? (Number(weekendOpts.sunRateCustom) || 2.0) : 2.0;
      const isElevenHourDay = !!(weekendOpts.isElevenHourDay);
      const treatAsSat = isSaturday && satMode !== "weekday";
      // APA §2.4: bank holidays are paid at Sunday rate. Honour the production's
      // sunMode toggle for consistency — if the producer has explicitly set
      // Sunday to "weekday", bank holidays follow suit.
      const treatAsSun = (isSunday || isBH) && sunMode !== "weekday";
      // When it's a bank holiday but NOT a Sunday, swap "Sunday" for "Bank Holiday"
      // in line labels. If the BH falls on a Sunday, keep the existing "Sunday" wording.
      const sunBranchPrefix = (isBH && !isSunday) ? "Bank Holiday" : "Sunday";

      if (effectiveDayType === "Travel Day") {
        const paidHrs = Math.max(workedHrs, 5);
        lines.push({ label: "Travel Day (BHR)", detail: `${callWrapLabel} · min 5h`, rate: bhr, qty: paidHrs, amount: paidHrs * bhr });
        if (workedHrs < 5) notes.push("Min 5h applied");
        const miles = Number(day.miles) || 0;
        if (miles > 0) lines.push({ label: "Mileage", detail: `${miles} mi outside M25`, rate: 0.5, qty: miles, amount: miles * 0.5 });
        const total = lines.reduce((s, l) => s + l.amount, 0);
        return { meta: { workedHrs, otHrs: 0, bhr, otRate, dayLabel: "Travel Day", notes, secondBreakRequired: false, continuousDay: false }, lines, total };
      }

      let basicHrs;
      if (continuousDay) basicHrs = 9;
      else if (effectiveDayType === "Shoot") { basicHrs = isElevenHourDay ? 12 : 11; if (lunchDuration < 60 && !lunchMissed) basicHrs -= (60 - lunchDuration) / 60; }
      else if (effectiveDayType === "Pre-light") { basicHrs = 9; if (lunchDuration < 60 && !lunchMissed) basicHrs = 9 - (60 - lunchDuration) / 60; }
      else if (DISCRETIONARY_LUNCH_DAY_TYPES.includes(effectiveDayType)) {
        // APA §2.3: 8h base, no lunch obligation. OT after 8h normally.
        // If a 1st break is given, basic shifts up by lunch duration (capped at 1h → 9h base).
        basicHrs = 8;
        if (!lunchMissed && lunchDuration >= 60) basicHrs = 9;
        else if (!lunchMissed && lunchDuration > 0) basicHrs = 8 + (lunchDuration / 60);
      }
      else {
        throw new Error('Unhandled day type in calculateDay: ' + effectiveDayType);
      }

      const effectiveStart = isLate ? 11 : callH;
      const effectiveHrs = wrapAbs - effectiveStart;

      if (isNightShoot) {
        const lunchDeduct = lunchMissed ? 0 : lunchDuration / 60;
        const paidHrs = Math.max(workedHrs - lunchDeduct, 10);
        const nightRate = bectuOtRate ?? computeAPArate(bdr, 2, weekendOpts.apaRounding);
        lines.push({
          label: "Night Shoot (2× BHR)",
          detail: `${callWrapLabel}${lunchDeduct ? ` · ${Math.round(lunchDeduct * 60)}m lunch` : ""}`,
          rate: nightRate, qty: paidHrs, amount: paidHrs * nightRate,
        });
        if (workedHrs - lunchDeduct < 10) notes.push("Min call 10h applied");
      } else if (treatAsSat) {
        const satRate = computeAPArate(bdr, satMult, weekendOpts.apaRounding);
        const satOtRate = bectuOtRate ?? satRate;
        if (effectiveDayType === "Shoot") {
          lines.push({ label: `Saturday Day (${satMult}× BDR)`, detail: callWrapLabel + (isElevenHourDay ? " · 11-hour day" : ""), rate: bdr * satMult, qty: 1, amount: bdr * satMult });
          const otHrs = ceilHalf(Math.max(0, effectiveHrs - basicHrs));
          if (otHrs > 0) { lines.push({ label: `Saturday OT (${satMult}× BHR)`, detail: "After basic", rate: satOtRate, qty: otHrs, amount: otHrs * satOtRate }); }
        } else {
          const baseHrs = Math.max(Math.min(workedHrs, basicHrs), 8);
          const satMinApplied = baseHrs > workedHrs;
          lines.push({ label: `Saturday ${effectiveDayType} (${satMult}× BHR)`, detail: satMinApplied ? `${callWrapLabel} · min 8h applied` : callWrapLabel, rate: satRate, qty: baseHrs, amount: baseHrs * satRate });
          const otHrs = ceilHalf(Math.max(0, workedHrs - basicHrs));
          if (otHrs > 0) { lines.push({ label: `Saturday OT (${satMult}× BHR)`, detail: "After basic", rate: satOtRate, qty: otHrs, amount: otHrs * satOtRate }); }
        }
      } else if (treatAsSun) {
        const sunRate = computeAPArate(bdr, sunMult, weekendOpts.apaRounding);
        if (effectiveDayType === "Shoot") {
          const lunchDeduct = lunchMissed ? 0 : lunchDuration / 60;
          const paidHrs = Math.max(workedHrs - lunchDeduct, 10);
          lines.push({
            label: `${sunBranchPrefix} Shoot (${sunMult}× BHR, flat)`,
            detail: `${callWrapLabel}${lunchDeduct ? ` · ${Math.round(lunchDeduct * 60)}m lunch` : ""}`,
            rate: sunRate, qty: paidHrs, amount: paidHrs * sunRate,
          });
          if (workedHrs - lunchDeduct < 10) notes.push("Min call 10h applied");
        } else {
          const sunPaidHrs = Math.max(workedHrs, 8);
          const sunMinApplied = sunPaidHrs > workedHrs;
          lines.push({ label: `${sunBranchPrefix} ${effectiveDayType} (${sunMult}× BHR, flat)`, detail: sunMinApplied ? `${callWrapLabel} · min 8h applied` : callWrapLabel, rate: sunRate, qty: sunPaidHrs, amount: sunPaidHrs * sunRate });
        }
      } else {
        if (effectiveDayType === "Shoot") {
          lines.push({ label: continuousDay ? "BDR (Continuous Working Day)" : "BDR", detail: callWrapLabel + (isElevenHourDay ? " · 11-hour day" : ""), rate: bdr, qty: 1, amount: bdr });
        } else if (effectiveDayType === "Pre-light") {
          const baseHrs = continuousDay ? 9 : 8;
          lines.push({ label: continuousDay ? "Pre-light Day (CWD 9h × BHR)" : "Pre-light Day (8h × BHR + 1h lunch)", detail: callWrapLabel, rate: bhr, qty: baseHrs, amount: baseHrs * bhr });
        } else if (DISCRETIONARY_LUNCH_DAY_TYPES.includes(effectiveDayType)) {
          const lunchPart = (lunchMissed || lunchDuration === 0) ? "no lunch" : (lunchDuration >= 60 ? "+ 1h lunch" : `+ ${lunchDuration}m lunch`);
          lines.push({ label: `${effectiveDayType} (${basicHrs}h × BHR, ${lunchPart})`, detail: callWrapLabel, rate: bhr, qty: basicHrs, amount: basicHrs * bhr });
        } else {
          throw new Error('Unhandled day type in calculateDay: ' + effectiveDayType);
        }

        if (!crew.noOT) {
          if (isEarly) {
            const earlyHrs = ceilHalf(7 - callH);
            lines.push({ label: "Early Call (OT rate)", detail: `${day.callTime} – 07:00`, rate: otRate, qty: earlyHrs, amount: earlyHrs * otRate });
          }

          const otTotalRaw = Math.max(0, effectiveHrs - basicHrs);
          const otTotal = ceilHalf(otTotalRaw);
          if (otTotal > 0) {
            const otStartAbs = effectiveStart + basicHrs;
            const otEndAbs = wrapAbs;
            const tripleStart = Math.max(otStartAbs, 24);
            const tripleEnd = Math.min(otEndAbs, 29);
            const tripleRaw = Math.max(0, tripleEnd - tripleStart);
            const tripleHrs = ceilHalf(tripleRaw);
            const standardOtHrs = Math.max(0, otTotal - tripleHrs);
            if (standardOtHrs > 0) {
              lines.push({
                label: "OT",
                detail: tripleHrs > 0 ? `${toHHMM(otStartAbs)} – 00:00` : `${toHHMM(otStartAbs)} – ${toHHMM(otEndAbs)}`,
                rate: otRate, qty: standardOtHrs, amount: standardOtHrs * otRate,
              });
            }
            if (tripleHrs > 0) {
              const tripleRate = bectuOtRate ?? computeAPArate(bdr, 3, weekendOpts.apaRounding);
              lines.push({ label: "OT Triple Time (00:00–05:00)", detail: "After midnight", rate: tripleRate, qty: tripleHrs, amount: tripleHrs * tripleRate });
            }
          }
        }
      }

      if (!isNightShoot) {
        // Late 1st Break (£10) — bs.lunchLate is already gated to cwdApplies
        // at source in deriveBreakState, so this only fires on Shoot/Pre-light.
        if (bs.lunchLate) lines.push({ label: "Late 1st Break", detail: "", rate: null, qty: 1, amount: 10 });
        // Missed Meal (£7.50) — lunchMissed is the raw flag; gate to
        // cwdApplies so the allowance only applies on Shoot/Pre-light.
        if (bs.cwdApplies && (lunchMissed || bs.lunchVeryLate) && day.noMealProvided) {
          lines.push({ label: "Missed Meal Allowance", detail: "", rate: null, qty: 1, amount: 7.5 });
        }
        if (secondBreakRequired) {
          if (sbState === "missed" || sbState === "late") {
            lines.push({ label: sbState === "late" ? "Late 2nd Break (treated as missed)" : "Missed 2nd Break", detail: "30m × BHR", rate: null, qty: 1, amount: bhr * 0.5 });
          } else if (sbState === "curtailed") {
            const curtailedBy = 30 - bs.sbDuration;
            lines.push({ label: "Curtailed 2nd Break", detail: `${curtailedBy}m × BHR`, rate: null, qty: 1, amount: (curtailedBy / 60) * bhr });
          }
        }
        if (continuousDay) {
          if (day.cwdBreak1Given === false) lines.push({ label: "Missed CWD Break (9h)", detail: "30m × BHR", rate: null, qty: 1, amount: bhr * 0.5 });
          if (cwd2Required && day.cwdBreak2Given === false) lines.push({ label: "Missed CWD Break (12.5h)", detail: "30m × BHR", rate: null, qty: 1, amount: bhr * 0.5 });
        }
      }

      const travelOutRaw = Math.max(0, (Number(day.travelOutMins) || 0) - 60) / 60;
      const travelBackRaw = Math.max(0, (Number(day.travelBackMins) || 0) - 60) / 60;
      const travelHrs = travelOutRaw + travelBackRaw;
      if (travelHrs > 0) {
        const travelGap = Math.max(0, basicHrs - (workedHrs + preUnitHrs));
        const chargeableTravel = Math.max(0, travelHrs - travelGap);
        if (chargeableTravel > 0) {
          lines.push({ label: "Travel Time", detail: "1hr each way deducted", rate: bhr, qty: chargeableTravel, amount: chargeableTravel * bhr });
        } else {
          notes.push(`Travel not paid (work ${workedHrs.toFixed(1)}h + travel ${travelHrs.toFixed(1)}h ≤ ${basicHrs}h threshold)`);
        }
      }
      const miles = Number(day.miles) || 0;
      if (miles > 0) lines.push({ label: "Mileage", detail: `${miles} mi outside M25`, rate: 0.5, qty: miles, amount: miles * 0.5 });

      const total = lines.reduce((s, l) => s + l.amount, 0);
      const otHrsForMeta = lines.filter((l) => /ot|triple/i.test(l.label)).reduce((s, l) => s + (Number(l.qty) || 0), 0);

      return {
        meta: {
          workedHrs, otHrs: otHrsForMeta, bhr, otRate,
          notes, secondBreakRequired, continuousDay,
          isBankHoliday: isBH, bankHolidayName: getBankHolidayName(day.date),
          dayLabel: isNightShoot ? (isNightPre5 ? "Night Shoot (pre-5am)" : "Night Shoot (post-5pm)")
                  : treatAsSat ? "Saturday"
                  : treatAsSun ? (isBH && !isSunday ? "Bank Holiday" : "Sunday")
                  : isEarly ? "Early Call" : isLate ? "Late Call" : "Standard",
        },
        lines, total,
      };
    }

    /* ─────────────── PM / PA / Runner — APA Appendix 1 §(a) ─────────────── */

    function calculatePmpaDay(day, crew, weekendOpts = {}) {
      const bdr = Number(crew.bdr) || 0;
      const bhr = computeAPArate(bdr, 1, weekendOpts.apaRounding);

      // Non-shoot day: flat BDR. Travel Day, Pre-light, Prep, Recce, Build,
      // De-rig — all the same. (Rest Day is handled by the early return in
      // calculateDay before this branch.)
      if (day.dayType !== "Shoot") {
        return {
          meta: {
            workedHrs: 0, otHrs: 0, bhr, otRate: bhr,
            dayLabel: day.dayType || "—", notes: [],
            secondBreakRequired: false, continuousDay: false, isPmpa: true,
            isBankHoliday: isBankHoliday(day.date),
            bankHolidayName: getBankHolidayName(day.date),
          },
          lines: [{ label: `${day.dayType} (flat BDR)`, detail: "", rate: null, qty: 1, amount: bdr }],
          total: bdr,
        };
      }

      // Shoot day. Compute hours, day-of-week, multiplier, OT.
      const callH = parseHHMM(day.callTime);
      const wrapH = parseHHMM(day.wrapTime);
      if (callH === null || wrapH === null) {
        return {
          meta: { workedHrs: 0, otHrs: 0, bhr, otRate: bhr, dayLabel: "—", notes: ["Missing or invalid call/wrap time"], secondBreakRequired: false, continuousDay: false, isPmpa: true },
          lines: [], total: 0,
        };
      }
      const wrapNextDay = day.wrapNextDay || wrapH <= callH;
      const wrapAbs = wrapNextDay ? wrapH + 24 : wrapH;
      const workedHrs = wrapAbs - callH;
      const callWrapLabel = `${day.callTime} – ${day.wrapTime}${wrapNextDay ? " (+1)" : ""}`;

      const dow = dayOfWeek(day.date);
      const isSaturday = dow === 6;
      const isSunday = dow === 0;
      const isBH = isBankHoliday(day.date);
      const isNightPre5 = callH < 5;
      const isNightPost5 = callH >= 17;
      const isNightShoot = isNightPre5 || isNightPost5;

      // Honour production-level weekend toggles (same as main engine):
      // weekday → no boost, custom → user multiplier, otherwise APA defaults.
      const satMode = weekendOpts.satRateMode ?? "apa";
      const sunMode = weekendOpts.sunRateMode ?? "apa";
      const satMult = satMode === "custom" ? (Number(weekendOpts.satRateCustom) || 1.5) : 1.5;
      const sunMult = sunMode === "custom" ? (Number(weekendOpts.sunRateCustom) || 2.0) : 2.0;
      const treatAsSat = isSaturday && satMode !== "weekday";
      // APA §2.4: bank holidays paid at Sunday rate.
      const treatAsSun = (isSunday || isBH) && sunMode !== "weekday";
      const sunBranchPrefix = (isBH && !isSunday) ? "Bank Holiday" : "Sunday";
      const isElevenHourDay = !!(weekendOpts.isElevenHourDay);

      // Multiplier per Appendix 1 §(a):
      //   Night shoot (any dow) → 2×
      //   Sun/BankHol → 2×
      //   Sat → 1.5×
      //   Mon-Fri → 1×
      // (Night shoot wins over Sat — Sat night is 2×, not 1.5×.)
      let mult = 1;
      let dayLineLabel = "BDR";
      if (isNightShoot) {
        mult = 2;
        dayLineLabel = `Night Shoot (2× BDR)`;
      } else if (treatAsSun) {
        mult = sunMult;
        dayLineLabel = `${sunBranchPrefix} Shoot (${sunMult}× BDR)`;
      } else if (treatAsSat) {
        mult = satMult;
        dayLineLabel = `Saturday Shoot (${satMult}× BDR)`;
      }

      // BWD: 11h call-to-tail-lights (12h if production runs 11-hour days).
      const basicHrs = isElevenHourDay ? 12 : 11;
      const otHrs = ceilHalf(Math.max(0, workedHrs - basicHrs));
      const otRate = computeAPArate(bdr, mult, weekendOpts.apaRounding);

      const lines = [];
      lines.push({
        label: dayLineLabel,
        detail: callWrapLabel + (isElevenHourDay ? " · 11-hour day" : ""),
        rate: bdr * mult, qty: 1, amount: bdr * mult,
      });
      if (otHrs > 0) {
        const otStartAbs = callH + basicHrs;
        lines.push({
          label: mult === 1 ? "OT" : `OT (${mult}× BHR)`,
          detail: `${toHHMM(otStartAbs)} – ${toHHMM(wrapAbs)}`,
          rate: otRate, qty: otHrs, amount: otHrs * otRate,
        });
      }

      // Mileage stays functional even though §3 doesn't apply — defaults to 0.
      const miles = Number(day.miles) || 0;
      if (miles > 0) lines.push({ label: "Mileage", detail: `${miles} mi outside M25`, rate: 0.5, qty: miles, amount: miles * 0.5 });

      const total = lines.reduce((s, l) => s + l.amount, 0);

      let dayLabel;
      if (isNightShoot) dayLabel = isNightPre5 ? "Night Shoot (pre-5am)" : "Night Shoot (post-5pm)";
      else if (treatAsSat) dayLabel = "Saturday";
      else if (treatAsSun) dayLabel = isBH && !isSunday ? "Bank Holiday" : "Sunday";
      else dayLabel = "Standard";

      return {
        meta: {
          workedHrs, otHrs, bhr, otRate, dayLabel,
          notes: [], secondBreakRequired: false, continuousDay: false, isPmpa: true,
          isBankHoliday: isBH, bankHolidayName: getBankHolidayName(day.date),
        },
        lines, total,
      };
    }

    /* ═══════════════════════════ MIGRATION + STORAGE ═══════════════════════════ */

    function migrateDay(d) {
      d = { note: "", expenses: [], ...d };
      // Migrate legacy truckCallTime → preCallTime (keep truckCallTime for safe rollback)
      if (d.truckCallTime && !d.preCallTime) d = { ...d, preCallTime: d.truckCallTime };
      if (d.lunchStartTime !== undefined) return d;
      if (!d.callTime) return d;
      const callH = parseHHMM(d.callTime) || 8;
      let lunchStartTime, lunchDurationMins;
      if (d.lunchState === "missed") { lunchStartTime = null; lunchDurationMins = 0; }
      else if (d.lunchState === "late") { lunchStartTime = toHHMM(callH + 6); lunchDurationMins = 60; }
      else if (d.lunchState === "curtailed") { lunchStartTime = toHHMM(callH + 5); lunchDurationMins = 60 - (Number(d.lunchCurtailMins) || 30); if (lunchDurationMins <= 0) lunchDurationMins = 30; }
      else { lunchStartTime = toHHMM(callH + 5); lunchDurationMins = 60; }
      const lunchEnd = lunchStartTime ? parseHHMM(lunchStartTime) + (lunchDurationMins || 60) / 60 : callH + 6;
      const sbStart = toHHMM(lunchEnd + 5);
      let sbDuration;
      if (d.secondBreakState === "missed") sbDuration = 0;
      else if (d.secondBreakState === "curtailed") sbDuration = 30 - (Number(d.secondBreakCurtailMins) || 15);
      else sbDuration = 30;
      if (sbDuration < 0) sbDuration = 0;
      return {
        ...d, lunchStartTime, lunchDurationMins,
        secondBreakStartTime: sbStart, secondBreakDurationMins: sbDuration,
        cwdBreak1Given: true, cwdBreak2Given: true,
      };
    }

    function migrateCrew(c) {
      if (c.role === "Spark") c = { ...c, role: "Lighting Technician" };
      return { isDriver: false, ...c };
    }

    function userCrewIdsInProduction(production, userPrefs) {
      if (!production.bestBoyMode) {
        return (production.crew || []).map(c => c.id);
      }
      const targetName = (userPrefs?.displayName || "").toLowerCase().trim();
      if (!targetName) return [];
      return (production.crew || [])
        .filter(c => (c.name || "").toLowerCase().trim() === targetName)
        .map(c => c.id);
    }

    function migrateInvoice(inv, p) {
      if (!inv) return inv;
      const allDates = (p.days || []).map(d => d.date).filter(Boolean).sort();
      const migrated = {
        ...inv,
        linesEdited: inv.linesEdited ?? false,
        jobTitle: inv.jobTitle ?? p.title ?? "",
        jobReference: inv.jobReference ?? p.jobReference ?? "",
        jobRole: inv.jobRole ?? "",
        shootDateStart: inv.shootDateStart ?? p.startDate ?? allDates[0] ?? "",
        shootDateEnd: inv.shootDateEnd ?? allDates[allDates.length - 1] ?? "",
      };
      // Strip any legacy logoBase64 that was snapshotted per-invoice; logo is now read
      // from userPrefs at render time to avoid duplicating ~500KB per invoice.
      delete migrated.logoBase64;
      return migrated;
    }

    const migrateProduction = (p) => ({
      ...p,
      crew: (p.crew || []).map(migrateCrew),
      bestBoyMode: p.bestBoyMode ?? ((p.crew?.length ?? 0) > 1),
      isElevenHourDay: p.isElevenHourDay ?? false,
      jobReference: p.jobReference ?? "",
      invoicingEmail: p.invoicingEmail ?? "",
      favourableRounding: p.favourableRounding ?? false,
      apaRounding: p.apaRounding ?? false,
      startDate: p.startDate ?? todayISO(),
      weekStarts: p.weekStarts ?? [],
      gridDates: p.gridDates ?? [],
      cancellationData: p.cancellationData ?? null,
      toAddress: p.toAddress ?? "",
      invoices: (p.invoices || []).map(inv => migrateInvoice(inv, p)),
      days: (p.days || []).map(day => {
        if (day.kitMoneyEnabled !== undefined) return day;
        const crewMember = (p.crew || []).find(c => c.id === day.crewId);
        return { ...day, kitMoneyEnabled: crewMember?.kitMoneyEnabled ?? false, kitMoneyAmount: crewMember?.kitMoneyAmount ?? 0 };
      }),
    });

    function useStoredState(key, initial, migrate) {
      const [value, setValue] = useState(() => {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            let v = JSON.parse(raw);
            if (migrate && Array.isArray(v)) v = v.map(migrate);
            // For plain-object stores, merge initial so new keys added to the
            // default object get safe values for existing users.
            if (v !== null && typeof v === 'object' && !Array.isArray(v) &&
                initial !== null && typeof initial === 'object' && !Array.isArray(initial)) {
              v = { ...initial, ...v };
            }
            return v;
          }
        } catch {}
        return initial;
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }, [key, value]);
      return [value, setValue];
    }

    /* ═══════════════════════════ SHARE / DOWNLOAD HELPERS ═══════════════════════════ */

    async function shareTextOrCopy(text, title) {
      if (navigator.share) {
        try { await navigator.share({ text, title }); return 'shared'; } catch (e) {
          if (e.name === 'AbortError') return 'cancelled';
        }
      }
      // Fallback: clipboard
      try {
        await navigator.clipboard.writeText(text);
        return 'copied';
      } catch {
        // Last-resort fallback: prompt
        prompt('Copy this text:', text);
        return 'prompted';
      }
    }

    /* ═══════════════════════════ TEXT FORMATTER ═══════════════════════════ */

    const formatOTDuration = (qty) => {
      const n = Number(qty) || 0;
      return n % 1 === 0 ? `${n}` : n.toFixed(1);
    };

    function formatLineText(line) {
      const label = line.label;
      const qty = line.qty;
      const timeMatch = line.detail?.match(/^(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})(\s*\(\+1\))?/);
      const timePart = timeMatch ? `${timeMatch[1]}-${timeMatch[2]}${timeMatch[3] || ''}` : '';
      if (/mileage/i.test(label)) return `Mileage: ${qty} mi — ${fmtGBP(line.amount)}`;
      const isOTLine = /\bot\b|\bovertime\b/i.test(label);
      if (isOTLine) {
        const prefix = timePart || line.detail || '';
        const amountHint = line.amount != null ? ` — ${fmtGBP(line.amount)}` : '';
        return `${prefix ? prefix + ' — ' : ''}${formatOTDuration(qty)}h ${label}${amountHint}`;
      }
      const isHoursLine = typeof qty === 'number' && /triple|travel time|early|travel day/i.test(label) && qty !== 1;
      const hoursHint = isHoursLine ? ` (${qty % 1 === 0 ? qty : qty.toFixed(2)} HR${qty !== 1 ? 'S' : ''})` : '';
      const amountHint = (!isHoursLine || /travel time/i.test(label)) && line.amount != null ? ` — ${fmtGBP(line.amount)}` : '';
      return `${timePart ? timePart + ' ' : ''}${label}${hoursHint}${amountHint}`;
    }

    function augmentCalc(calc, resolvedDay, crewMember) {
      const extra = [];
      const kmEnabled = resolvedDay?.kitMoneyEnabled ?? crewMember?.kitMoneyEnabled;
      const kmAmount  = resolvedDay?.kitMoneyAmount  ?? crewMember?.kitMoneyAmount;
      if (kmEnabled && Number(kmAmount) > 0)
        extra.push({ label: "Kit Money", detail: "", rate: null, qty: 1, amount: Number(kmAmount) });
      if (resolvedDay?.perDiemEnabled && Number(resolvedDay.perDiemAmount) > 0)
        extra.push({ label: "Per Diem", detail: "", rate: null, qty: 1, amount: Number(resolvedDay.perDiemAmount) });
      (resolvedDay?.expenses || []).forEach(exp => {
        const amt = Number(exp.amount) || 0;
        if (amt <= 0) return;
        extra.push({ label: `Expense: ${exp.category || "Other"}`, detail: exp.description || "", rate: null, qty: 1, amount: amt });
      });
      if (!extra.length) return calc;
      const lines = [...calc.lines, ...extra];
      return { ...calc, lines, total: calc.total + extra.reduce((s, l) => s + l.amount, 0) };
    }

    function buildInvoiceLineItems(production, userPrefs, userCrewId) {
      const crewMember = (production.crew || []).find(c => c.id === userCrewId);
      if (!crewMember) return [];
      const myDays = (production.days || [])
        .filter(d => d.crewId === userCrewId)
        .sort((a, b) => a.date.localeCompare(b.date));

      // ordered map: aggregation key → { label, dates[], qty, rate, amount, isExpense }
      const map = new Map();
      let prevDay = null;

      for (const day of myDays) {
        const calc = calcForDisplay(production, day, crewMember, prevDay);
        for (const line of calc.lines) {
          const isExpense = (line.label || "").startsWith("Expense:");
          let key, displayLabel;
          if (isExpense) {
            const category = (line.label || "").replace(/^Expense:\s*/i, "").trim();
            const desc = (line.detail || "").trim();
            key = `exp|${category}|${desc}`;
            displayLabel = desc || category;
          } else {
            const prefix = (line.label || "").split(" (")[0].trim();
            key = `${prefix}|${line.rate ?? "null"}`;
            displayLabel = prefix;
          }
          if (map.has(key)) {
            const e = map.get(key);
            e.qty += typeof line.qty === "number" ? line.qty : 1;
            e.amount += Number(line.amount) || 0;
            if (day.date && !e.dates.includes(day.date)) e.dates.push(day.date);
          } else {
            map.set(key, {
              label: displayLabel,
              dates: day.date ? [day.date] : [],
              qty: typeof line.qty === "number" ? line.qty : 1,
              rate: typeof line.rate === "number" ? line.rate : null,
              amount: Number(line.amount) || 0,
              isExpense,
            });
          }
        }
        prevDay = day;
      }

      return [...map.values()].map(e => {
        const n = e.dates.length;
        const detail = n === 1 ? fmtDateShort(e.dates[0])
          : n === 2 ? `${fmtDateShort(e.dates[0])} – ${fmtDateShort(e.dates[n - 1])}`
          : n > 2 ? `${n} days` : "";
        const amount = e.rate !== null ? e.qty * e.rate : e.amount;
        return { id: uid(), label: e.label, detail, qty: e.qty, rate: e.rate, amount, discountedQty: null, isExpense: e.isExpense };
      });
    }

    function buildDefaultNotes(production, userPrefs, userCrewId) {
      const crewMember = (production.crew || []).find(c => c.id === userCrewId);
      if (!crewMember) return "";
      const myDays = (production.days || []).filter(d => d.crewId === userCrewId);
      return generateCrewText(crewMember, myDays, production);
    }

    function createNewInvoice(production, setProduction, userPrefs, setUserPrefs, userCrewId) {
      const crewMember = (production.crew || []).find(c => c.id === userCrewId);
      const prefix = userPrefs.invoicePrefix || "INV-";
      const num = userPrefs.invoiceNextNumber || 1;
      const invoiceNumber = `${prefix}${String(num).padStart(3, '0')}`;
      const today = todayISO();
      const dueDate = addDays(today, Number(userPrefs.paymentTermsDays) || 30);
      const lineItems = buildInvoiceLineItems(production, userPrefs, userCrewId);
      const notes = buildDefaultNotes(production, userPrefs, userCrewId);
      const newId = uid();
      const invoice = {
        id: newId,
        invoiceNumber,
        invoiceDate: today,
        dueDate,
        toName: production.toName ?? "",
        toAddress: production.toAddress ?? "",
        toEmail: production.invoicingEmail ?? "",
        jobReference: production.jobReference ?? "",
        jobTitle: production.title ?? "",
        jobRole: crewMember?.role ?? "",
        shootDateStart: production.startDate ?? "",
        shootDateEnd: (() => {
          const dates = (production.days || []).map(d => d.date).filter(Boolean).sort();
          return dates[dates.length - 1] ?? "";
        })(),
        fromName: userPrefs.displayName || "",
        fromCompanyName: userPrefs.fromCompanyName || "",
        fromAddress: userPrefs.fromAddress || "",
        fromEmail: userPrefs.fromEmail || "",
        bankName: userPrefs.bankName || "",
        bankAccountName: userPrefs.bankAccountName || "",
        bankAccountNumber: userPrefs.bankAccountNumber || "",
        bankSortCode: userPrefs.bankSortCode || "",
        bankIBAN: userPrefs.bankIBAN || "",
        bankSWIFT: userPrefs.bankSWIFT || "",
        vatRegistered: crewMember?.vatRegistered ?? userPrefs.vatRegistered ?? false,
        vatRate: crewMember?.vatRate ?? userPrefs.vatRate ?? 20,
        vatNumber: userPrefs.vatNumber || "",
        // Logo is NOT snapshotted per-invoice — read from userPrefs at render time to avoid
        // duplicating ~500KB of base64 data into every invoice (iOS Safari 5MB localStorage cap).
        lineItems,
        notes,
        showIndividualExpenses: false,
        linesEdited: false,
        status: "draft",
        createdAt: new Date().toISOString(),
      };
      setProduction(p => ({ ...p, invoices: [...(p.invoices || []), invoice] }));
      setUserPrefs(prev => ({ ...prev, invoiceNextNumber: num + 1 }));
      return newId;
    }

    function resolveCrewForDay(resolvedDay, crewMember) {
      if (!resolvedDay?.stepUpEnabled) return crewMember;
      return {
        ...crewMember,
        role: resolvedDay.stepUpRole || crewMember.role,
        bdr: Number(resolvedDay.stepUpBDR) || crewMember.bdr,
        otCoef: Number(resolvedDay.stepUpOTCoef) || crewMember.otCoef,
        otRate: resolvedDay.stepUpOTRate ?? null,
      };
    }

    function applyRateRounding(calc) {
      if (calc.meta?.isPmpa) return calc;
      const lines = calc.lines.map(l => {
        if (l.rate == null) return l;
        return { ...l, amount: Math.ceil(l.amount) };
      });
      const total = lines.reduce((s, l) => s + l.amount, 0);
      return { ...calc, lines, total };
    }


    function restHoursBetween(prevDay, currDay) {
      const prevCallH = parseHHMM(prevDay.callTime);
      const prevWrapH = parseHHMM(prevDay.wrapTime);
      const currCallH = parseHHMM(currDay.callTime);
      if (prevCallH === null || prevWrapH === null || currCallH === null) return null;
      const wrapNextDay = prevDay.wrapNextDay || prevWrapH <= prevCallH;
      const prevWrapAbs = wrapNextDay ? prevWrapH + 24 : prevWrapH;
      const daysDiff = Math.round(
        (new Date(currDay.date + "T12:00:00") - new Date(prevDay.date + "T12:00:00"))
        / (24 * 60 * 60 * 1000)
      );
      return daysDiff * 24 + currCallH - prevWrapAbs;
    }

    function findPrevDay(allDays, currDay) {
      return allDays
        .filter(d => d.crewId === currDay.crewId && d.date < currDay.date)
        .sort((a, b) => b.date.localeCompare(a.date))[0] || null;
    }

    function calcTOC(prevResolvedDay, currResolvedDay, effectiveCrew, apaRounding = false) {
      if (isPmpaRole(effectiveCrew)) return null;
      const rest = restHoursBetween(prevResolvedDay, currResolvedDay);
      if (rest === null || rest >= 11) return null;
      const bhr = computeAPArate(effectiveCrew.bdr, 1, apaRounding);
      const otRate = (effectiveCrew.otRate != null && effectiveCrew.otRate > 0) ? Number(effectiveCrew.otRate) : computeAPArate(effectiveCrew.bdr, Number(effectiveCrew.otCoef) || 1, apaRounding);
      const tocHours = 11 - rest;
      return { restHours: rest, tocHours, isBreach: rest < 10, otRate, amount: tocHours * otRate };
    }

    function calcForDisplay(production, day, crewMember, prevDay = null) {
      const resolved = resolveDay(production, day, crewMember);
      const effectiveCrew = resolveCrewForDay(resolved, crewMember);
      let calc = augmentCalc(calculateDay(resolved, effectiveCrew, production), resolved, crewMember);
      if (prevDay) {
        const prevResolved = resolveDay(production, prevDay, crewMember);
        const toc = calcTOC(prevResolved, resolved, effectiveCrew, production?.apaRounding ?? false);
        if (toc) {
          const isBreach = toc.isBreach;
          const tocLine = {
            label: isBreach ? "Time Off The Clock (BREACH)" : "Time Off The Clock",
            detail: `${isBreach ? 'BREACH: ' : ''}${toc.restHours.toFixed(1)}h rest · ${toc.tocHours.toFixed(1)}h TOC`,
            rate: toc.otRate, qty: toc.tocHours, amount: toc.amount,
            isTOC: true, isBreach,
          };
          calc = { ...calc, lines: [...calc.lines, tocLine], total: calc.total + toc.amount };
        }
      }
      const useFavourableRounding = production?.favourableRounding ?? false;
      return useFavourableRounding ? applyRateRounding(calc) : calc;
    }

    function generateCrewText(crewMember, entries, production) {
      const lines = [];
      lines.push(`${crewMember.name.toUpperCase()} — ${crewMember.role}`);
      if (production.title) lines.push(production.title);
      if (production.prodCo) lines.push(production.prodCo);
      lines.push('');
      const sorted = [...entries].sort((a, b) => a.date.localeCompare(b.date));
      let grandTotal = 0;
      let prevEntry = null;
      sorted.forEach((d) => {
        const calc = calcForDisplay(production, d, crewMember, prevEntry);
        grandTotal += calc.total;
        const stepUpNote = d.stepUpEnabled && d.stepUpRole ? ` — Stepped up: ${d.stepUpRole}` : '';
        lines.push(`${fmtDateShort(d.date)} (${weekday(d.date)})${calc.meta.continuousDay ? ' — CWD' : ''}${stepUpNote}`);
        calc.lines.forEach((l) => lines.push(formatLineText(l)));
        lines.push(`Day total: ${fmtGBP(calc.total)}`);
        lines.push('');
        prevEntry = d;
      });
      lines.push(`TOTAL: ${fmtGBP(grandTotal)}`);
      lines.push('');
      lines.push('—');
      lines.push('Generated with TimeMachine · timemachineapp.co.uk');
      return lines.join('\n');
    }

    function crewVAT(crewMember, subtotal) {
      if (!crewMember?.vatRegistered) return { vatAmount: 0, totalIncVAT: subtotal };
      const rate = Number(crewMember.vatRate) || 20;
      const vatAmount = subtotal * rate / 100;
      return { vatAmount, totalIncVAT: subtotal + vatAmount };
    }

    function generateDayText(day, crewMember, production, allDays = null) {
      const prevDay = allDays ? findPrevDay(allDays, day) : null;
      const calc = calcForDisplay(production, day, crewMember, prevDay);
      const lines = [];
      lines.push(`${crewMember.name} — ${crewMember.role}`);
      const stepUpNote = day.stepUpEnabled && day.stepUpRole ? ` — Stepped up: ${day.stepUpRole}` : '';
      lines.push(`${fmtDateShort(day.date)} (${weekday(day.date)})${calc.meta.continuousDay ? ' — CWD' : ''}${stepUpNote}`);
      lines.push('');
      calc.lines.forEach((l) => lines.push(formatLineText(l)));
      lines.push('');
      const { vatAmount, totalIncVAT } = crewVAT(crewMember, calc.total);
      if (crewMember.vatRegistered) {
        const rate = Number(crewMember.vatRate) || 20;
        lines.push(`SUBTOTAL: ${fmtGBP(calc.total)}`);
        lines.push(`VAT (${rate}%): ${fmtGBP(vatAmount)}`);
        lines.push(`TOTAL INC. VAT: ${fmtGBP(totalIncVAT)}`);
      } else {
        lines.push(`TOTAL: ${fmtGBP(calc.total)}`);
      }
      lines.push('');
      lines.push('—');
      lines.push('Generated with TimeMachine · timemachineapp.co.uk');
      return lines.join('\n');
    }

    /* ═══════════════════════════ PRINT EXPORT HELPERS ═══════════════════════════ */

    function dayTypeChipClass(dayType) {
      const map = {
        "Shoot": "shoot", "Pre-light": "prelight", "Recce": "recce",
        "Prep Day": "prep", "Build Day": "prep",
        "De-rig": "derig", "Travel Day": "travel", "Rest Day": "rest",
      };
      return map[dayType] || "shoot";
    }

    function penaltyFlags(calc) {
      if (!calc) return {};
      const lines = calc.lines || [];
      const lbls = lines.map(l => (l.label || '').toLowerCase());
      return {
        hasOT:         (calc.meta?.otHrs || 0) > 0,
        hasL1:         lbls.some(l => l === "late 1st break"),
        hasL2:         lbls.some(l => l.startsWith("late 2nd break")),
        hasMSB:        lbls.some(l => l === "missed 2nd break"),
        hasCWD:        !!calc.meta?.continuousDay,
        hasTOC:        lines.some(l => l.isTOC === true),
        isNightShoot:  (calc.meta?.dayLabel || "").includes("Night Shoot"),
        isBankHoliday: !!calc.meta?.isBankHoliday,
      };
    }

    function getMonday(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const dow = d.getDay();
      d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
      return d.toISOString().slice(0, 10);
    }

    // Returns string[][] — each inner array is 7 ISO date strings Mon–Sun.
    // Used by DaysManager grid headers.
    function deriveWeeks(production, days) {
      const mondays = new Set(production.weekStarts || []);
      const allDayDates = [...days.map(d => d.date), ...(production.gridDates || [])];
      for (const date of allDayDates) mondays.add(getMonday(date));
      if (mondays.size === 0) return [];
      return [...mondays].sort().map(mon => {
        const d = new Date(mon + "T12:00:00");
        return Array.from({ length: 7 }, (_, i) => {
          const day = new Date(d);
          day.setDate(d.getDate() + i);
          return day.toISOString().slice(0, 10);
        });
      });
    }

    // Returns {index, start, end, label}[] — used by ExportTab and TimesheetPage.
    function computeWeeks(production, days) {
      if (production.weekStarts?.length > 0) {
        return [...production.weekStarts].sort().map((mondayISO, idx) => {
          const sun = new Date(mondayISO + "T12:00:00");
          sun.setDate(sun.getDate() + 6);
          return { index: idx, start: mondayISO, end: sun.toISOString().slice(0, 10),
                   label: `Week ${String(idx + 1).padStart(2, '0')}` };
        });
      }
      if (!days || days.length === 0) return [];
      const sorted = days.map(d => d.date).filter(Boolean).sort();
      const firstMon = getMonday(sorted[0]);
      const latest = sorted[sorted.length - 1];
      const weeks = [];
      let cursor = firstMon, idx = 0;
      while (cursor <= latest) {
        const sun = new Date(cursor + "T12:00:00");
        sun.setDate(sun.getDate() + 6);
        weeks.push({ index: idx, start: cursor, end: sun.toISOString().slice(0, 10),
                     label: `Week ${String(idx + 1).padStart(2, '0')}` });
        const next = new Date(cursor + "T12:00:00");
        next.setDate(next.getDate() + 7);
        cursor = next.toISOString().slice(0, 10);
        idx++;
      }
      return weeks;
    }

    // Returns array of 7 ISO date strings Mon–Sun for the week containing mondayISO
    function weekDateRange(mondayISO) {
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(mondayISO + "T12:00:00");
        d.setDate(d.getDate() + i);
        return d.toISOString().slice(0, 10);
      });
    }

      @media print {

    /* ── Penalty chip row (shared helper) ── */
    function PenChips({ flags }) {
      const chips = [];
      if (flags.hasOT)        chips.push(<span key="ot"  className="chip-ot">OT</span>);
      if (flags.hasL1)        chips.push(<span key="l1"  className="chip-msb">L1</span>);
      if (flags.hasL2)        chips.push(<span key="l2"  className="chip-msb">L2</span>);
      if (flags.hasMSB)       chips.push(<span key="msb" className="chip-msb">MSB</span>);
      if (flags.hasCWD)       chips.push(<span key="cwd" className="chip-cwd">CWD</span>);
      if (flags.hasTOC)       chips.push(<span key="toc" className="chip-toc">TOC</span>);
      if (flags.isNightShoot) chips.push(<span key="ns"  className="chip-ns">NS</span>);
      return chips.length ? <React.Fragment>{chips}</React.Fragment> : null;
    }

    /* ── Single timesheet page ── */
    function TimesheetPage({ crewMember, weekDates, allDaysForCrew, production, pageNum, totalPages, weekIndex, totalWeeks, grandTotal, grandHrs, grandOTHrs, isFirstPage, userPrefs }) {
      // Build per-day calc for this week
      const dayMap = {};
      (allDaysForCrew || []).forEach(d => { dayMap[d.date] = d; });

      // Format week range label
      const rangeStart = new Date(weekDates[0] + "T12:00:00");
      const rangeEnd   = new Date(weekDates[6] + "T12:00:00");
      const fmtRange = (d) => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const rangeLabel = `${fmtRange(rangeStart)} – ${fmtRange(rangeEnd)}`;

      // Header meta line
      const metaParts = [
        production.title || 'Untitled Production',
        production.prodCo,
        rangeLabel,
        production.jobReference,
      ].filter(Boolean);

      // BDR / OT rate display
      const bdr = Number(crewMember.bdr) || 0;
      const bhr = computeAPArate(bdr, 1, production.apaRounding);
      const otRate = (crewMember.otRate != null && crewMember.otRate > 0)
        ? Number(crewMember.otRate)
        : computeAPArate(bdr, Number(crewMember.otCoef) || 1.5, production.apaRounding);

      return (
        <div className="page ts-page">
          {/* Header */}
          <div className="doc-header">
            <div>
              <div className="label">{isFirstPage ? 'Crew Timesheet' : `Crew Timesheet · continued`}</div>
              <div className="name-role">
                {crewMember.name || 'Unnamed'}
                {crewMember.role ? <span className="role"> · {crewMember.role}</span> : null}
              </div>
              <div className="meta">
                <strong>{production.title || 'Untitled Production'}</strong>
                {production.prodCo ? ` · ${production.prodCo}` : ''}
                <br/>
                {rangeLabel}
                {production.jobReference ? ` · ${production.jobReference}` : ''}
              </div>
              {isFirstPage && bdr > 0 && (
                <div className="rate-row">
                  <span className="num">{fmtGBP(bdr)}</span><span>BDR</span>
                  <span style={{color:'#d4d4d4'}}>·</span>
                  <span className="num">{fmtGBP(otRate)}</span><span>OT/h</span>
                  <span style={{color:'#d4d4d4'}}>·</span>
                  <span>{(Number(crewMember.otCoef)||1.5)}×</span>
                </div>
              )}
            </div>
            <div className="right">
              {isFirstPage ? (
                <>
                  <div className="label">Total · {allDaysForCrew.length} day{allDaysForCrew.length !== 1 ? 's' : ''}</div>
                  <div className="total tnum">{fmtGBP(grandTotal)}</div>
                  <div className="breakdown tnum">
                    {grandHrs.toFixed(1)}h worked
                    {grandOTHrs > 0 ? ` · ${grandOTHrs.toFixed(1)}h OT` : ''}
                  </div>
                </>
              ) : (
                <>
                  <div className="label">{`Week ${weekIndex + 1} of ${totalWeeks}`}</div>
                  <div className="breakdown tnum">{rangeLabel}</div>
                </>
              )}
            </div>
          </div>

          {isFirstPage && <ChipLegend />}

          {/* Day rows */}
          <div className="day-list">
            {weekDates.map(dateISO => {
              const day = dayMap[dateISO];
              const d = new Date(dateISO + "T12:00:00");
              const dow = d.toLocaleDateString('en-GB', { weekday: 'short' });
              const dayNum = d.getDay(); // 0=Sun,6=Sat
              const isSat = dayNum === 6;
              const isSun = dayNum === 0;
              const mo = d.toLocaleDateString('en-GB', { month: 'short' });
              const dateNum = d.getDate();
              const tintClass = isSat ? 'sat' : isSun ? 'sun' : '';

              if (!day) {
                // Rest day
                return (
                  <div key={dateISO} className={`day rest${tintClass ? ' ' + tintClass : ''}`}>
                    <div className="date">
                      <div className="dow">{dow}</div>
                      <div className="num tnum">{dateNum}</div>
                      <div className="mo tnum">{mo}</div>
                    </div>
                    <div className="body"><span className="label">Rest</span></div>
                    <div className="total"><div className="lbl">—</div></div>
                  </div>
                );
              }

              // Day with data — but check if it's a Rest Day type
              if (day.dayType === "Rest Day") {
                return (
                  <div key={dateISO} className={`day rest${tintClass ? ' ' + tintClass : ''}`}>
                    <div className="date">
                      <div className="dow">{dow}</div>
                      <div className="num tnum">{dateNum}</div>
                      <div className="mo tnum">{mo}</div>
                    </div>
                    <div className="body"><span className="label">Rest</span></div>
                    <div className="total"><div className="lbl">—</div></div>
                  </div>
                );
              }

              const prevDay = allDaysForCrew
                .filter(x => x.date < dateISO)
                .sort((a, b) => b.date.localeCompare(a.date))[0] || null;
              const calc = calcForDisplay(production, day, crewMember, prevDay);
              const flags = penaltyFlags(calc);
              const isBH = flags.isBankHoliday;
              const rowTint = isBH || isSun ? 'sun' : isSat ? 'sat' : '';

              const callTime = day.callTime || '';
              const wrapTime = day.wrapTime || '';
              const workedHrs = calc.meta?.workedHrs || 0;
              const otHrs = calc.meta?.otHrs || 0;
              const chipClass = dayTypeChipClass(day.dayType);

              return (
                <div key={dateISO} className={`day${rowTint ? ' ' + rowTint : ''}`}>
                  <div className="date">
                    <div className="dow">{dow}</div>
                    <div className="num tnum">{dateNum}</div>
                    <div className="mo tnum">{mo}</div>
                  </div>
                  <div className="body">
                    <div className="head-line">
                      <span className={`chip-day ${chipClass}`}>{day.dayType}</span>
                      <PenChips flags={flags} />
                      {callTime && wrapTime && (
                        <span className="times tnum">{callTime} → {wrapTime} <span className="hrs">{workedHrs.toFixed(1)}h</span></span>
                      )}
                    </div>
                    <div className="lines">
                      {calc.lines.map((line, i) => {
                        const isOT = /\bot\b|\bovertime\b/i.test(line.label || '');
                        const isPen = line.rate === null && !line.isTOC;
                        return (
                          <React.Fragment key={i}>
                            <span className="ll">
                              {isOT
                                ? <>{line.detail ? <>{line.detail}<span className="sep">—</span></> : null}<span className="ot">{formatOTDuration(line.qty)}h {line.label}</span></>
                                : isPen
                                ? <><span className="penalty">{line.label}</span>{line.detail ? <><span className="sep">·</span>{line.detail}</> : null}</>
                                : <><strong>{line.label}</strong>{line.detail ? <><span className="sep">·</span>{line.detail}</> : null}</>
                              }
                            </span>
                            <span className="lr tnum">{fmtGBP(line.amount)}</span>
                          </React.Fragment>
                        );
                      })}
                    </div>
                    {day.note && day.note.trim() && <div className="day-note">{day.note}</div>}
                  </div>
                  <div className="total">
                    <div className="lbl">Day Total</div>
                    <div className="val tnum">{fmtGBP(calc.total)}</div>
                    {otHrs > 0 && <div className="sub tnum">{otHrs.toFixed(1)}h OT</div>}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Footer */}
          <div className="doc-footer">
            <div className="pay-info">
              {isFirstPage && userPrefs?.vatRegistered && userPrefs?.vatNumber
                ? <span><span className="lbl">VAT No.</span> <span className="val tnum">{userPrefs.vatNumber}</span></span>
                : null}
            </div>
            <div className="brand">
              <div className="name">TIMEMACHINE</div>
              <div className="tnum">Page {pageNum} of {totalPages}</div>
            </div>
          </div>
        </div>
      );
    }

    /* ── Grid page ── */
    function GridPage({ crew, weekDates, allDays, production, weekIndex, totalWeeks, pageNum, totalPages, isFirstPage, userPrefs }) {
      const week = { start: weekDates[0], end: weekDates[6] };
      const rangeStart = new Date(weekDates[0] + "T12:00:00");
      const rangeEnd   = new Date(weekDates[6] + "T12:00:00");
      const fmtShort = (d) => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const rangeLabel = `${fmtShort(rangeStart)} – ${fmtShort(rangeEnd)}`;

      // Build lookup: daysByCrewAndDate[crewId][date] = day object
      const byCA = {};
      (allDays || []).forEach(d => {
        if (d.date >= week.start && d.date <= week.end) {
          if (!byCA[d.crewId]) byCA[d.crewId] = {};
          byCA[d.crewId][d.date] = d;
        }
      });

      // Grand totals
      let weekTotal = 0, weekHrs = 0, weekOTHrs = 0;
      const crewTotals = crew.map(c => {
        const crewDays = Object.values(byCA[c.id] || {});
        const sorted = [...(allDays || [])].filter(d => d.crewId === c.id).sort((a, b) => a.date.localeCompare(b.date));
        let tot = 0, hrs = 0, otHrs = 0;
        crewDays.forEach(day => {
          const prev = sorted.filter(x => x.date < day.date).pop() || null;
          const calc = calcForDisplay(production, day, c, prev);
          tot += calc.total;
          hrs += calc.meta?.workedHrs || 0;
          otHrs += calc.meta?.otHrs || 0;
        });
        weekTotal += tot;
        weekHrs += hrs;
        weekOTHrs += otHrs;
        return { tot, hrs };
      });

      // Column day totals
      const colTotals = weekDates.map(dateISO => {
        let tot = 0, hrs = 0;
        crew.forEach((c, ci) => {
          const day = (byCA[c.id] || {})[dateISO];
          if (!day || day.dayType === "Rest Day") return;
          const allCrewDays = (allDays || []).filter(d => d.crewId === c.id).sort((a, b) => a.date.localeCompare(b.date));
          const prev = allCrewDays.filter(x => x.date < dateISO).pop() || null;
          const calc = calcForDisplay(production, day, c, prev);
          tot += calc.total;
          hrs += calc.meta?.workedHrs || 0;
        });
        return { tot, hrs };
      });

      const now = new Date();
      const genLabel = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        + ' · ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

      return (
        <div className="page grid-page">
          {/* Header */}
          <div className="doc-header">
            <div>
              <div className="label">Production Grid</div>
              <div className="title">{production.title || 'Untitled Production'}</div>
              <div className="meta" style={{fontSize:'10.5px',color:'#525252',marginTop:6}}>
                {[production.prodCo, `Week ${weekIndex + 1} of ${totalWeeks}`, `${crew.length} crew`, rangeLabel].filter(Boolean).join(' · ')}
              </div>
            </div>
            <div className="right">
              <div className="label">Week Total</div>
              <div className="total tnum">{fmtGBP(weekTotal)}</div>
              <div className="breakdown tnum">{weekHrs.toFixed(0)}h{weekOTHrs > 0 ? ` · ${weekOTHrs.toFixed(0)}h OT` : ''}</div>
            </div>
          </div>

          {isFirstPage && <ChipLegend />}

          {/* Grid */}
          <div className="grid-wrap">
            <div className="grid-table">
              <div className="grid-row grid-head">
                <div className="grid-cell crew-col"></div>
                {weekDates.map(dateISO => {
                  const d = new Date(dateISO + "T12:00:00");
                  const dn = d.getDay();
                  const cls = dn === 6 ? 'sat' : dn === 0 ? 'sun' : '';
                  return (
                    <div key={dateISO} className={`grid-cell${cls ? ' ' + cls : ''}`}>
                      <div className="dow">{d.toLocaleDateString('en-GB',{weekday:'short'})}</div>
                      <div className="num">{d.getDate()}</div>
                      <div className="mo tnum">{d.toLocaleDateString('en-GB',{month:'short'})}</div>
                    </div>
                  );
                })}
                <div className="grid-cell total-col"><div className="dow">Total</div></div>
              </div>

              {crew.map((c, ci) => {
                const allCrewDays = (allDays || []).filter(d => d.crewId === c.id).sort((a, b) => a.date.localeCompare(b.date));
                return (
                  <div key={c.id} className="grid-row grid-body">
                    <div className="grid-cell crew">
                      <div className="name">{c.name}</div>
                      <div className="role">{c.role} · {fmtGBP(c.bdr)}</div>
                    </div>
                    {weekDates.map(dateISO => {
                      const dn = new Date(dateISO + "T12:00:00").getDay();
                      const colCls = dn === 6 ? 'sat' : dn === 0 ? 'sun' : '';
                      const day = (byCA[c.id] || {})[dateISO];
                      if (!day || day.dayType === "Rest Day") {
                        return (
                          <div key={dateISO} className={`grid-cell${colCls ? ' ' + colCls : ''}`}>
                            <span className="rest-label">Rest</span>
                          </div>
                        );
                      }
                      const prev = allCrewDays.filter(x => x.date < dateISO).pop() || null;
                      const calc = calcForDisplay(production, day, c, prev);
                      const flags = penaltyFlags(calc);
                      const isBH = flags.isBankHoliday;
                      const cellCls = (isBH || dn === 0) ? 'sun' : dn === 6 ? 'sat' : '';
                      const hrs = calc.meta?.workedHrs || 0;
                      const chipCls = dayTypeChipClass(day.dayType);
                      const penNodes = [];
                      if (flags.hasOT)        penNodes.push(<span key="ot"  className="chip-ot">OT</span>);
                      if (flags.hasL1)        penNodes.push(<span key="l1"  className="chip-msb">L1</span>);
                      if (flags.hasL2)        penNodes.push(<span key="l2"  className="chip-msb">L2</span>);
                      if (flags.hasMSB)       penNodes.push(<span key="msb" className="chip-msb">MSB</span>);
                      if (flags.hasCWD)       penNodes.push(<span key="cwd" className="chip-cwd">CWD</span>);
                      if (flags.hasTOC)       penNodes.push(<span key="toc" className="chip-toc">TOC</span>);
                      if (flags.isNightShoot) penNodes.push(<span key="ns"  className="chip-ns">NS</span>);
                      return (
                        <div key={dateISO} className={`grid-cell${cellCls ? ' ' + cellCls : ''}`}>
                          <div className="cell-stack">
                            <div className="top">
                              <span className={`chip-day ${chipCls}`}>{day.dayType}</span>
                              <span className="hrs-line tnum">{hrs.toFixed(1)}h</span>
                              {penNodes.length > 0 && <div className="pens">{penNodes}</div>}
                            </div>
                            <span className="total-val tnum">{fmtGBP(calc.total)}</span>
                          </div>
                        </div>
                      );
                    })}
                    <div className="grid-cell row-total">
                      <div className="total-val tnum">{fmtGBP(crewTotals[ci].tot)}</div>
                      <div className="total-hrs tnum">{crewTotals[ci].hrs.toFixed(1)}h</div>
                    </div>
                  </div>
                );
              })}

              <div className="grid-row grid-foot">
                <div className="grid-cell crew">Day Totals</div>
                {weekDates.map((dateISO, i) => {
                  const dn = new Date(dateISO + "T12:00:00").getDay();
                  const cls = dn === 6 ? 'sat' : dn === 0 ? 'sun' : '';
                  const ct = colTotals[i];
                  return (
                    <div key={dateISO} className={`grid-cell${cls ? ' ' + cls : ''}`}>
                      {ct.tot > 0
                        ? <><div className="day-total-val tnum">{fmtGBP(ct.tot)}</div><div className="day-total-hrs tnum">{ct.hrs.toFixed(1)}h</div></>
                        : <span style={{color:'#d4d4d4'}}>—</span>}
                    </div>
                  );
                })}
                <div className="grid-cell row-total">
                  <div className="week-total tnum">{fmtGBP(weekTotal)}</div>
                  <div className="day-total-hrs tnum">{weekHrs.toFixed(0)}h</div>
                </div>
              </div>
            </div>
          </div>

          {/* Footer */}
          <div className="doc-footer">
            <div className="pay-info">
              {production.prodCo && <span><span className="lbl">Production:</span> <span className="val">{production.prodCo}</span></span>}
              {production.invoicingEmail && <span><span className="lbl">Email:</span> <span className="val">{production.invoicingEmail}</span></span>}
              <span><span className="lbl">Generated:</span> <span className="val tnum">{genLabel}</span></span>
            </div>
            <div className="brand">
              <div className="name">TIMEMACHINE</div>
              <div className="tnum">Page {pageNum} of {totalPages} · Week {weekIndex + 1}</div>
            </div>
          </div>
        </div>
      );
    }

    /* ── PrintView portal ── */
    function PrintView({ mode, production, crewMember, crewList, days, weeks, exportWeekIndex, userPrefs }) {
      // mode: "timesheet" | "grid"
      // For timesheet: crewMember (single), days (all for that crew)
      // For grid: crewList (all crew), days (all days for selected weeks)

      const pages = [];

      if (mode === "timesheet" && crewMember) {
        const crewDays = (days || [])
          .filter(d => d.crewId === crewMember.id)
          .sort((a, b) => a.date.localeCompare(b.date));

        // Compute grand totals
        let grandTotal = 0, grandHrs = 0, grandOTHrs = 0;
        crewDays.forEach((day, i) => {
          const prev = crewDays[i - 1] || null;
          const calc = calcForDisplay(production, day, crewMember, prev);
          grandTotal  += calc.total;
          grandHrs    += calc.meta?.workedHrs || 0;
          grandOTHrs  += calc.meta?.otHrs     || 0;
        });

        // Determine which weeks to render
        const weeksToRender = exportWeekIndex !== null && exportWeekIndex !== undefined
          ? [weeks[exportWeekIndex]].filter(Boolean)
          : weeks;

        const totalPages = weeksToRender.length;

        weeksToRender.forEach((wk, pi) => {
          const weekDates = weekDateRange(wk.start);
          pages.push(
            <TimesheetPage
              key={wk.start}
              crewMember={crewMember}
              weekDates={weekDates}
              allDaysForCrew={crewDays}
              production={production}
              pageNum={pi + 1}
              totalPages={totalPages}
              weekIndex={wk.index}
              totalWeeks={weeks.length}
              grandTotal={grandTotal}
              grandHrs={grandHrs}
              grandOTHrs={grandOTHrs}
              isFirstPage={pi === 0}
              userPrefs={userPrefs}
            />
          );
        });
      }

      if (mode === "grid" && crewList) {
        const weeksToRender = exportWeekIndex !== null && exportWeekIndex !== undefined
          ? [weeks[exportWeekIndex]].filter(Boolean)
          : weeks;

        const totalPages = weeksToRender.length;

        weeksToRender.forEach((wk, pi) => {
          const weekDates = weekDateRange(wk.start);
          pages.push(
            <GridPage
              key={wk.start}
              crew={crewList}
              weekDates={weekDates}
              allDays={days}
              production={production}
              weekIndex={wk.index}
              totalWeeks={weeks.length}
              pageNum={pi + 1}
              totalPages={totalPages}
              isFirstPage={pi === 0}
              userPrefs={userPrefs}
            />
          );
        });
      }

      return ReactDOM.createPortal(
        <div id="print-view">
          <style dangerouslySetInnerHTML={{ __html: PRINT_STYLES }} />
          {pages}
        </div>,
        document.body
      );
    }

    /* ── Invoice PDF document (shared by print + email blob paths) ── */
    function InvoiceDocument({ invoice, userPrefs }) {
      const fmtInvDate = (iso) => {
        if (!iso) return "";
        return new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
      };

      const isExpenseLine = (item) => item.isExpense || (item.label || "").startsWith("Expense:");
      const cleanExpenseLabel = (item) => {
        if (item.isExpense) return item.label || "";
        return (item.label || "").replace(/^Expense:\s*/i, "").trim() || (item.label || "");
      };

      const allLines = invoice.lineItems || [];
      const normalLines = allLines.filter(l => !isExpenseLine(l));
      const expenseLines = allLines.filter(l => isExpenseLine(l));
      const showInd = invoice.showIndividualExpenses === true;

      const subtotal = allLines.reduce((s, l) => s + getLineTotal(l), 0);
      const vatAmount = invoice.vatRegistered ? subtotal * (invoice.vatRate || 20) / 100 : 0;
      const total = subtotal + vatAmount;

      const renderLineRows = (item, labelOverride) => {
        const label = labelOverride ?? item.label ?? "";
        const isFixed = item.rate === null;
        const hasDisc = item.discountedQty !== null;
        const billedQty = hasDisc ? item.discountedQty : item.qty;
        const fullyWaived = hasDisc && (isFixed || billedQty === 0);
        const partiallyWaived = hasDisc && !fullyWaived && billedQty < item.qty;
        const waivedQty = partiallyWaived ? (item.qty - billedQty) : 0;
        const rows = [];

        if (fullyWaived) {
          // Single strikethrough row — no kept portion
          rows.push(
            <tr key={`${item.id}-w`} className="waived">
              <td>
                <div>
                  {label}
                  <span className="waived-badge">Waived</span>
                </div>
                {item.detail && <div className="line-detail">{item.detail}</div>}
              </td>
              <td className="num">{isFixed ? "" : item.qty}</td>
              <td className="num">{isFixed ? "" : fmtGBP(item.rate)}</td>
              <td className="num">{isFixed ? fmtGBP(item.amount) : fmtGBP(item.qty * item.rate)}</td>
            </tr>
          );
        } else {
          // Kept portion row (always rendered)
          rows.push(
            <tr key={`${item.id}-k`}>
              <td>
                <div>{label}</div>
                {item.detail && <div className="line-detail">{item.detail}</div>}
              </td>
              <td className="num">{isFixed ? "" : (partiallyWaived ? billedQty : item.qty)}</td>
              <td className="num">{isFixed ? "" : fmtGBP(item.rate)}</td>
              <td className="num">
                {isFixed
                  ? fmtGBP(item.amount)
                  : fmtGBP((partiallyWaived ? billedQty : item.qty) * item.rate)}
              </td>
            </tr>
          );
          // Waived portion row (only if partial)
          if (partiallyWaived) {
            rows.push(
              <tr key={`${item.id}-w`} className="waived">
                <td>
                  <div>
                    {label}
                    <span className="waived-badge">Waived</span>
                  </div>
                </td>
                <td className="num">{waivedQty}</td>
                <td className="num">{fmtGBP(item.rate)}</td>
                <td className="num">{fmtGBP(waivedQty * item.rate)}</td>
              </tr>
            );
          }
        }
        return rows;
      };

      const bankFields = [
        { key: "Bank",         val: invoice.bankName },
        { key: "Account name", val: invoice.bankAccountName },
        { key: "Sort code",    val: invoice.bankSortCode },
        { key: "Account no.",  val: invoice.bankAccountNumber },
        { key: "IBAN",         val: invoice.bankIBAN },
        { key: "SWIFT/BIC",    val: invoice.bankSWIFT },
      ].filter(f => f.val && String(f.val).trim());

      return (
        <div id="invoice-print-view" className="invoice-print-root">

      const recipient = (invoice.toEmail || '').trim();
      const subjectBase = `Invoice ${invoice.invoiceNumber}`;
      const subject = invoice.jobTitle ? `${subjectBase} — ${invoice.jobTitle}` : subjectBase;

      const subtotal = invoiceSubtotal(invoice.lineItems);
      const vatAmount = invoice.vatRegistered ? subtotal * (Number(invoice.vatRate) || 20) / 100 : 0;
      const totalStr = fmtGBP(subtotal + vatAmount);
      const fromName = invoice.fromName || invoice.fromCompanyName || '';
      const jobBit = invoice.jobTitle ? ` for ${invoice.jobTitle}` : '';
      const body = `Hi,\n\nPlease find attached invoice ${invoice.invoiceNumber}${jobBit}, total ${totalStr}.\n\nPlease quote ${invoice.invoiceNumber} when making payment.\n\nMany thanks,\n${fromName}`;

      const params = new URLSearchParams();
      if (subject) params.set('subject', subject);
      if (body) params.set('body', body);
      const queryString = params.toString().replace(/\+/g, '%20');
      window.location.href = `mailto:${encodeURIComponent(recipient)}?${queryString}`;

    /* ═══════════════════════════ UI PRIMITIVES ═══════════════════════════ */

    const Btn = ({ children, variant = "primary", size = "md", className = "", ...p }) => {
      const base = "inline-flex items-center gap-2 font-semibold uppercase tracking-wide transition-all border active:scale-95 disabled:opacity-40 disabled:pointer-events-none";
      const variants = {
        primary: "bg-sky-400 border-sky-500 text-black hover:bg-sky-300",
        ghost:   "bg-transparent border-neutral-700 text-neutral-200 hover:bg-neutral-800 hover:border-neutral-600",
        danger:  "bg-red-600 border-red-700 text-white hover:bg-red-500",
        success: "bg-green-500 border-green-600 text-black hover:bg-green-400",
        subtle:  "bg-neutral-800 border-neutral-700 text-neutral-200 hover:bg-neutral-700",
      };
      const sizes = { sm: "px-2 py-1.5 text-[10px] rounded-md", md: "px-3 py-2.5 text-xs rounded-lg", lg: "px-5 py-3 text-sm rounded-lg" };
      return <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...p}>{children}</button>;
    };

    const Field = ({ label, children, hint, disabled }) => (
      <label className={`block ${disabled ? "opacity-40" : ""}`}>
        <div className="text-[10px] uppercase tracking-wide text-sky-400 font-bold mb-1">{label}</div>
        {children}
        {hint && <div className="text-[10px] text-neutral-500 mt-1 leading-tight">{hint}</div>}
      </label>
    );

    const Input = ({ type, style, className, onFocus: onFocusProp, inputMode: inputModeProp, ...p }) => {
      const isDate = type === "date";
      const resolvedInputMode = inputModeProp ?? (type === "number" ? "decimal" : undefined);
      const handleFocus = (e) => {
        if (type === 'number') e.target.select();
        if (onFocusProp) onFocusProp(e);
      };
      return <input type={type} inputMode={resolvedInputMode} onFocus={handleFocus} {...p}
        style={isDate ? { WebkitAppearance: 'none', ...style } : style}
        className={`w-full min-w-0 bg-neutral-800 border border-neutral-700 focus:border-sky-400 focus:ring-1 focus:ring-sky-400/40 text-neutral-100 placeholder:text-neutral-500 px-2.5 py-2 font-mono outline-none rounded-lg ${className || ""}`}
      />;
    };
    const TimeInput = ({ onChange, value, className, style, ...p }) => {
      const roundTo5 = (timeStr) => {
        if (!timeStr || typeof timeStr !== 'string') return timeStr;
        const m = timeStr.match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return timeStr;
        const totalMins = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const min = rounded % 60;
        return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
      };
      const handleBlur = (e) => {
        const newVal = roundTo5(e.target.value);
        if (newVal !== e.target.value && onChange) {
          onChange({ target: { value: newVal } });
        }
        if (p.onBlur) p.onBlur(e);
      };
      return <Input type="time" step="300" value={value} onChange={onChange} onBlur={handleBlur}
        className={`min-w-0 ${className || ""}`}
        style={{ WebkitAppearance: 'none', ...style }}
        {...p} />;
    };
    const Select = ({ children, ...p }) => <select {...p} className={`w-full bg-neutral-800 border border-neutral-700 focus:border-sky-400 focus:ring-1 focus:ring-sky-400/40 text-neutral-100 px-2.5 py-2 outline-none rounded-lg ${p.className || ""}`}>{children}</select>;

      return (
        <div className={`text-[11px] ${colors[kind]} ${bgs[kind]} flex items-start gap-1.5 leading-tight mt-1 px-2.5 py-1.5 rounded-md`}>
          <span className="mt-0.5">{icons[kind]}</span>
          <span>{children}</span>

    };

    const Toggle = ({ value, onChange, disabled, ariaLabel }) => (

        disabled={!!disabled}
        onClick={() => !disabled && onChange(!value)}
        className={`relative inline-flex shrink-0 rounded-full transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-sky-400/40 focus:ring-offset-1 focus:ring-offset-neutral-900 ${value ? "bg-sky-400" : "bg-neutral-700"} ${disabled ? "opacity-50 cursor-not-allowed" : "cursor-pointer"}`}

        <span
          className="pointer-events-none absolute rounded-full bg-white shadow-sm transition-transform duration-150 ease-out"

    const Toast = ({ show, children }) => (
      <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-green-500 text-black px-5 py-2 text-xs uppercase tracking-wide font-bold border border-green-600 rounded-full shadow-lg transition-all ${show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>

    function NowBtn({ tone = "sky", onClick, label }) {
      const colors = {
        sky: "bg-sky-600 hover:bg-sky-500 text-white",

    /* ═══════════════════════════ PRODUCTION FORM ═══════════════════════════ */

    function ProductionForm({ production, setProduction, onOpenSettings }) {
      const isUntitled = production.title === "Untitled Production" || !production.title;
      const hasCustomWeekend = (production.satRateMode && production.satRateMode !== "apa") || (production.sunRateMode && production.sunRateMode !== "apa");
      return (
        <div className="space-y-4">
          <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><IBriefcase size={16}/>Production Setup</h2>

          {isUntitled && (
            <div className="bg-sky-950/40 border border-sky-800 px-4 py-3 text-sm text-sky-300 flex items-center gap-2 rounded-xl">
              <IInfo size={14}/> Give this production a name to get started.
            </div>
          )}

          <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-4 flex items-center justify-between gap-3">
            <div className="min-w-0">
              <div className="font-semibold text-neutral-100 truncate">{production.title || <span className="text-neutral-500 italic">Untitled Production</span>}</div>
              {production.prodCo && <div className="text-sm text-neutral-400 truncate">{production.prodCo}</div>}
              <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                {production.startDate && <span className="text-[11px] text-neutral-500 font-mono">{fmtDateShort(production.startDate)}</span>}
                {hasCustomWeekend && <span className="px-1.5 py-0.5 rounded-full bg-amber-900/40 text-amber-400 text-[10px] font-semibold">custom weekend</span>}
                {production.isElevenHourDay && <span className="px-1.5 py-0.5 rounded-full bg-sky-900/40 text-sky-400 text-[10px] font-semibold">11h day</span>}

            <Btn size="sm" variant="ghost" onClick={onOpenSettings}><IGear size={12}/>Settings</Btn>
          </div>
        </div>
      );
