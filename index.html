                  checked={day.mileageRoundTrip !== false}
                  onChange={(e) => {
                    const rt = e.target.checked;
                    const result = lookupPostcodeMiles(day.mileagePostcode, rt);
                    updateDay({ mileageRoundTrip: rt, miles: result ? result.miles : (day.miles || 0) });
                  }}
                  className="accent-sky-500" />
                <span className="text-sm text-neutral-300">Round trip</span>
              </label>
              {(() => {
                const result = lookupPostcodeMiles(day.mileagePostcode, day.mileageRoundTrip !== false);
                if (!day.mileagePostcode) return null;
                if (!result) return (
                  <div className="text-xs text-tm-warn mt-1">
                    Couldn't find that postcode — try the first part only, like NW1.
                  </div>
                );
                return (
                  <div className="space-y-0.5 mt-1">
                    <div className="text-sm text-sky-300">→ {result.miles} mile{result.miles === 1 ? '' : 's'}</div>
                    <div className="text-[10px] text-neutral-500">Approximate — adjust manually if your route differs.</div>
                    {result.insideM25 && (
                      <div className="text-xs text-tm-warn">
                        ⚠ {result.outcode} is inside the M25 — APA mileage usually isn't charged for inside-M25 shoots, so you can clear this. Only keep it if your job pays mileage anyway.
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>
          )}

          {hasPrevMileage && (
            <button type="button" onClick={copyPrevMileage}
              className="mt-3 inline-flex items-center gap-1.5 text-xs text-sky-500 hover:text-sky-300 transition-colors"
              style={{ WebkitTapHighlightColor: 'transparent' }}>
              <IReset size={12}/>Same as previous day
            </button>
          )}
        </Field>
      );
    }

    /* ═══════════════════════════ DAY ENTRY FORM ═══════════════════════════ */

    function DayEntryForm({ value, onChange, crew, allCrewMode, fixedCrewId = null, fixedDate = null, isToday = false, showToast, days = [], hideDayCard = false, isElevenHourDay = false, production = null }) {
      const v = value;
      // DISPLAY-ONLY resolved view: call/wrap/lunch/dayType can cascade from
      // dayDefaults, so the raw `v` may leave those fields undefined. Resolve
      // them for display + break-state derivation (matching the calc engine).
      // Edits still write to the raw `v` via set()/onChange — the resolved value
      // is never persisted on render; only an actual edit creates an override.
      const vr = production ? resolveDay(production, v, (crew || []).find(c => c.id === v.crewId)) : v;
      const set = (patch) => onChange({ ...v, ...patch });
      const [showTravelInfo, setShowTravelInfo] = useState(false);
      const [showPreCallInfo, setShowPreCallInfo] = useState(false);

      const computeNowHHMM = () => {
        const now = new Date();
        const totalMins = now.getHours() * 60 + now.getMinutes();
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const m = rounded % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      };

      const onDayTypeChange = (dayType) => {
        const callH = parseHHMM(v.callTime);
        const patch = { dayType };
        if (callH !== null) patch.wrapTime = toHHMM(callH + (DEFAULT_HOURS[dayType] ?? 11));
        set(patch);
      };
      const onCallChange = (callTime) => {
        const newCallH = parseHHMM(callTime);
        const patch = { callTime };
        if (newCallH !== null) {
          // Default hours come from the RESOLVED day type — cascaded days leave
          // v.dayType undefined, which is what produced a NaN wrap. ?? 11 is a hard
          // floor so the wrap can never be NaN even for an unknown type.
          const hrs = DEFAULT_HOURS[vr.dayType] ?? 11;
          const oldCallH = parseHHMM(vr.callTime);
          // Re-derive the wrap only when it's missing/invalid (recovers a corrupt
          // "NaN:NaN") or was tracking the old call. A valid, explicitly-different
          // wrap is preserved.
          const wrapAuto = parseHHMM(vr.wrapTime) === null ||
            (oldCallH !== null && vr.wrapTime === toHHMM(oldCallH + hrs));
          if (wrapAuto) patch.wrapTime = toHHMM(newCallH + hrs);
          patch.lunchStartTime = toHHMM(newCallH + 5);
          patch.secondBreakStartTime = toHHMM(newCallH + 11);
        }
        set(patch);
      };

      const callH = parseHHMM(vr.callTime);
      const wrapH = parseHHMM(vr.wrapTime);
      const autoNextDay = callH !== null && wrapH !== null && wrapH <= callH;
      const dow = dayOfWeek(v.date);
      const dayLabel = v.date ? weekday(v.date) : "";
      const isWeekend = dow === 0 || dow === 6;
      const bhName = getBankHolidayName(v.date);
      const isBH = !!bhName;
      const isTravelDay = vr.dayType === "Travel Day";
      const activeCrew = fixedCrewId ? crew.find(c => c.id === fixedCrewId) : crew.find(c => c.id === v.crewId);
      // Step-up role wins over base role for both BWD-override and PMPA classification.
      const effectiveRole = v.stepUpRole ? v.stepUpRole : (activeCrew?.role || "");
      const isPmpa = ROLE_DEFAULTS[effectiveRole]?.pmpa === true;
      const role = effectiveRole;
      const bwdOverrideApplies = !isPmpa && ROLES_WITH_BWD_OVERRIDE.includes(role) &&
        ["Pre-light", ...DISCRETIONARY_LUNCH_DAY_TYPES].includes(vr.dayType);
      // Mirror calculateDay's BWD override (APA §2.3): a DoP / AD / LM on a
      // Pre-light / Prep / Recce / Build / De-rig is paid as a Basic Working
      // Day, which means the break-state UI (lunch chip, status messages,
      // meal-provided toggle, 2nd-break section) must use the effective type
      // too — otherwise the form would contradict the calc.
      const effDayType = bwdOverrideApplies ? "Shoot" : vr.dayType;
      const bs = deriveBreakState(vr, effDayType);

      const show2ndBreakSection = !isPmpa && !isTravelDay && bs && !bs.continuousDay && bs.secondBreakRequired;
      const showCwdBreaksChip   = !isPmpa && !isTravelDay && bs && bs.continuousDay;

      // Notes chip local state — spec keeps notes-active derived from text presence
      // (no schema flag), with a transient open state so tapping an empty-notes
      // chip can reveal the textarea before the user types. Reset on day switch.
      const [notesOpen, setNotesOpen] = useState(false);
      const [secondBreakExpanded, setSecondBreakExpanded] = useState(false);
      const [cwdBreaksExpanded, setCwdBreaksExpanded] = useState(false);
      useEffect(() => {
        setNotesOpen(false);
        setSecondBreakExpanded(false);
        setCwdBreaksExpanded(false);
      }, [v.id]);
      const noteHasText = !!(v.note && v.note.trim());
      // V4-5h-10b: tap toggles expansion only — never clears note text.
      const toggleNotes = () => setNotesOpen(o => !o);

      // 2nd-break chip status suffix — drives the chip's trailing " — STATE" text.
      const sbSuffix = !bs ? ""
        : bs.sbState === "missed"    ? " — MISSED"
        : bs.sbState === "late"      ? " — LATE"
        : bs.sbState === "curtailed" ? " — CURTAILED"
        : bs.sbState === "given"     ? " — ✓"
        : "";

      // V4-5h-10b: Value presence drives activation. Chip tap toggles panel
      // expansion only — never clears values. To deactivate, clear values in
      // the panel (0, empty, or "— None —"). Visual treatment mirrors BB's
      // ExtraChip: solid border, sky tint when set, value summary inline.
      const stepUpSet     = !!v.stepUpRole;
      const kitMoneySet   = (Number(v.kitMoneyAmount) || 0) > 0;
      const perDiemSet    = (Number(v.perDiemAmount) || 0) > 0;
      const preCallSet    = !!(v.preCallTime || v.truckCallTime);
      const mileageSet    = Number(v.miles) > 0 || !!v.mileagePostcode;
      const travelTimeSet = Number(v.travelOutMins) > 0 || Number(v.travelBackMins) > 0;
      const expensesSet   = (v.expenses || []).length > 0;
      const [expandedChips, setExpandedChips] = useState(() => new Set());
      // V4-5h-10b: panel visibility is pure expansion state (matches BB).
      // Chip tint reflects value-presence (*Set); panel open/closed is independent.
      const stepUpActive     = expandedChips.has("stepUp");
      const kitMoneyActive   = expandedChips.has("kitMoney");
      const perDiemActive    = expandedChips.has("perDiem");
      const preCallActive    = expandedChips.has("preCall");
      const mileageActive    = expandedChips.has("mileage");
      const travelTimeActive = expandedChips.has("travelTime");
      const expensesActive   = expandedChips.has("expenses");

      const toggleChip = (key) => {
        // Single-open: tapping a chip closes any other open chip.
        // Chip state is pure UI; inputs write through to the day record on change,
        // so collapsing never discards in-progress input.
        setExpandedChips(prev => prev.has(key) ? new Set() : new Set([key]));
      };

      const renderChip = (key, label, isSet, summary) => (
        <button
          type="button"
          onClick={() => toggleChip(key)}
          className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] font-semibold transition-colors ${
            isSet
              ? 'bg-sky-500/[0.06] border-sky-500/30 text-sky-400 hover:bg-sky-500/[0.1]'
              : 'bg-tm-card-2 border-neutral-800 text-neutral-500 hover:border-neutral-700 hover:text-neutral-400'
          }`}
          style={{ WebkitTapHighlightColor: 'transparent' }}
        >
          <span className="uppercase tracking-wider">{label}</span>
          {isSet && summary && (
            <span className="font-mono text-[10px] text-neutral-300 tabular-nums">{summary}</span>
          )}
        </button>
      );

      return (
        <div className="space-y-4">

          {/* ── Section: Day (modal flow only — SoloDayPage hoists Date/DayType into the form-top) ── */}
          {!hideDayCard && (
            <SectionCard title="Day">
              <div className="space-y-3">
                {!fixedCrewId && !allCrewMode && (
                  <Field label="Crew Member">
                    <Select value={v.crewId} onChange={(e) => set({ crewId: e.target.value })}>
                      <option value="">— Select —</option>
                      {crew.map((c) => <option key={c.id} value={c.id}>{c.name} ({c.role})</option>)}
                    </Select>
                  </Field>
                )}
                {!fixedCrewId && allCrewMode && (
                  <div className="bg-sky-950/30 border border-sky-800 p-2 rounded-xl">
                    <div className="text-[10px] uppercase tracking-[0.15em] text-sky-500 font-bold">All Crew Mode</div>
                    <div className="text-xs text-neutral-300">Creates a day for each of {crew.length} crew members. Travel & mileage apply to all.</div>
                  </div>
                )}
                <div className="grid grid-cols-2 gap-3">
                  {!fixedDate && (
                    <Field label="Date" hint={v.date ? `${dayLabel}${isWeekend ? " — weekend rate applies" : ""}${isBH ? " — bank holiday rate applies" : ""}` : ""}>
                      <Input type="date" value={v.date} onChange={(e) => set({ date: e.target.value })} />
                    </Field>
                  )}
                  <Field label="Day Type">
                    <Select value={vr.dayType ?? ''} onChange={(e) => onDayTypeChange(e.target.value)}>{DAY_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}</Select>
                  </Field>
                </div>
              </div>
            </SectionCard>
          )}

          {/* Contextual APA-rule notices — render whether or not the DAY card is shown. */}
          {bwdOverrideApplies && (
            <StatusMsg kind="info">
              APA §2.3: {role} always works to Basic Working Day rules, even on non-shoot days. This {vr.dayType} is calculated as a Shoot Day (10+1, OT after 11h).
            </StatusMsg>
          )}
          {isPmpa && (
            <StatusMsg kind="info">
              APA Appendix 1 §(a): {role}s use a simpler framework — flat BDR plus OT for hours beyond BWD on shoot days only. No break penalties, no travel time, no triple time.
            </StatusMsg>
          )}
          {isBH && (
            <StatusMsg kind="info">
              Bank Holiday — {bhName}. APA §2.4: paid as Sunday rate (2× BDR for shoot day, 2× BHR all hours).
            </StatusMsg>
          )}

          {/* ── Section: Times + Lunch (primary block) ── */}
          <SectionCard title="Times">
            <div className="space-y-3">
              {(() => {
                const callHint = callH !== null && callH < 5 ? "→ Night shoot (pre-5am)"
                  : callH !== null && callH >= 17 ? "→ Night shoot (post-5pm)"
                  : callH !== null && callH >= 5 && callH < 7 && !isTravelDay ? "→ Early call"
                  : callH !== null && callH >= 11 && callH < 17 && !isTravelDay ? "→ Late call (calc from 11:00)"
                  : "";
                const wrapHint = autoNextDay ? "Wrap is next day (auto-detected)" : "";
                const tileInputCls = "!text-2xl !bg-transparent !border-0 !p-0 !rounded-none !outline-none !ring-0 w-full";
                // V4-5h-13: WRAP tint when day crosses OT threshold. Mirrors
                // BB dept-default's defaultsWrapImpliesOT predicate.
                // V4-5h-14: isElevenHourDay now plumbed through — 11h productions use
                // 11h threshold; standard productions stay at 10h.
                const wrapInOT = (() => {
                  if (!bs || isTravelDay || isPmpa) return false;
                  const lunchHrs = bs.lunchMissed ? 0 : (bs.lunchDuration / 60);
                  const workHrs = bs.workedHrs - lunchHrs;
                  const otThreshold = isElevenHourDay ? 11 : 10;
                  return workHrs > otThreshold;
                })();
                return (
                  <div className="grid grid-cols-2 gap-3">
                    {/* CALL tile */}
                    <div>
                      <div className="bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5">
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-[10px] uppercase tracking-[0.16em] text-sky-500 font-bold">CALL</span>
                          {isToday && (
                            <button
                              type="button"
                              onClick={() => { const t = computeNowHHMM(); onCallChange(t); showToast?.(`Call ${t}`); }}
                              className="text-[9px] tracking-[0.1em] font-bold uppercase bg-sky-500/15 text-sky-500 px-1.5 py-0.5 rounded"
                            >NOW</button>
                          )}
                        </div>
                        <TimeInput
                          value={vr.callTime ?? ''}
                          onChange={(e) => onCallChange(e.target.value)}
                          className={tileInputCls}
                        />
                      </div>
                      {callHint && <div className="text-[10px] text-neutral-500 leading-tight mt-1 px-1">{callHint}</div>}
                    </div>
                    {/* WRAP tile */}
                    <div>
                      <div className={`border rounded-xl px-3 py-2.5 ${wrapInOT ? 'bg-tm-warn/[0.08] border-tm-warn/45' : 'bg-neutral-950 border-neutral-800'}`}>
                        <div className="flex items-center justify-between mb-1.5">
                          <span className={`text-[10px] uppercase tracking-[0.16em] font-bold ${wrapInOT ? 'text-tm-warn' : 'text-sky-500'}`}>WRAP{wrapInOT ? ' · OT' : ''}</span>
                          {isToday && (
                            <button
                              type="button"
                              onClick={() => { const t = computeNowHHMM(); set({ wrapTime: t }); showToast?.(`Wrap ${t}`); }}
                              className="text-[9px] tracking-[0.1em] font-bold uppercase bg-tm-warn/15 text-tm-warn px-1.5 py-0.5 rounded"
                            >NOW</button>
                          )}
                        </div>
                        <TimeInput
                          value={vr.wrapTime ?? ''}
                          onChange={(e) => set({ wrapTime: e.target.value })}
                          className={tileInputCls}
                        />
                      </div>
                      {wrapHint && <div className="text-[10px] text-neutral-500 leading-tight mt-1 px-1">{wrapHint}</div>}
                    </div>
                  </div>
                );
              })()}

              {!isPmpa && !isTravelDay && (
                <div className="border-t border-neutral-800 pt-3 mt-1 space-y-3">
                  {(() => {
                    const isDiscretionary = !bwdOverrideApplies && DISCRETIONARY_LUNCH_DAY_TYPES.includes(vr.dayType);
                    const dur = Number(vr.lunchDurationMins ?? 60);
                    // Status chip surfaces the scheduled lunch state: CWD,
                    // LATE, CURTAILED, or ON TIME. Discretionary days get no
                    // chip (lunch optional). The green ON TIME chip is a
                    // visual anchor only — the green banner stays suppressed.
                    const chipKind = !bs || isDiscretionary ? null
                      : ((bs.lunchMissed && bs.cwdApplies) || bs.lunchVeryLate)
                        ? { label: 'CWD', cls: 'bg-tm-pen/10 text-tm-pen border-tm-pen/35' }
                      : bs.lunchLate
                        ? { label: 'LATE', cls: 'bg-tm-warn/10 text-tm-warn border-tm-warn/35' }
                      : (bs.lunchDuration > 0 && bs.lunchDuration < 60)
                        ? { label: 'CURTAILED', cls: 'bg-tm-warn/10 text-tm-warn border-tm-warn/35' }
                      : (!bs.lunchMissed && bs.lunchDuration === 60 && bs.lunchEndAbs != null)
                        ? { label: 'ON TIME', cls: 'bg-tm-good/10 text-tm-good border-tm-good/35' }
                      : null;
                    const showBody = !isDiscretionary && dur > 0;
                    const endText = (bs?.lunchEndAbs != null && dur > 0) ? toHHMM(bs.lunchEndAbs) : '—';
                    return (
                      <div className="bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2.5">
                        {/* Row 1 — header: LUNCH label TL, conditional chip TR */}
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-[10px] uppercase tracking-[0.16em] text-sky-500 font-bold">LUNCH</span>
                          {chipKind && (
                            <span className={`text-[9px] tracking-[0.12em] font-bold uppercase px-1.5 py-0.5 rounded border ${chipKind.cls}`}>
                              {chipKind.label}
                            </span>
                          )}
                        </div>
                        {/* Row 2 — body: centred start → end pair (only when there's a lunch to show) */}
                        {showBody && (
                          <div className="flex items-center justify-center gap-3.5 pt-1 pb-3">
                            <TimeInput
                              value={vr.lunchStartTime ?? ""}
                              onChange={(e) => set({ lunchStartTime: e.target.value })}
                              className="!text-[26px] !leading-none !bg-transparent !border-0 !p-0 !rounded-none !outline-none !ring-0 font-mono font-bold text-center"
                              style={{ width: '92px' }}
                            />
                            <span className="text-neutral-500" style={{ fontSize: '18px', lineHeight: 1 }}>→</span>
                            <span className="text-[26px] leading-none font-mono font-bold text-neutral-100" style={{ width: '92px', textAlign: 'center' }}>{endText}</span>
                          </div>
                        )}
                        {/* Row 3 — footer: NOW left, duration select right */}
                        <div className="flex items-center justify-between gap-2 pt-2 border-t border-neutral-900">
                          {isToday && dur !== 0 ? (
                            <button
                              type="button"
                              onClick={() => { const t = computeNowHHMM(); set({ lunchStartTime: t }); showToast?.(`Lunch ${t}`); }}
                              className="text-[9px] tracking-[0.1em] font-bold uppercase bg-sky-500/15 text-sky-500 px-1.5 py-0.5 rounded"
                            >NOW</button>
                          ) : <span />}
                          <select
                            value={dur}
                            onChange={(e) => set({ lunchDurationMins: Number(e.target.value) })}
                            className="bg-transparent border-0 text-[13px] font-mono text-neutral-300 outline-none p-0 pr-7 text-right"
                          >
                            {LUNCH_DURATIONS.map((s) => <option key={s.v} value={s.v} className="bg-neutral-900">{s.label}</option>)}
                          </select>
                        </div>
                      </div>
                    );
                  })()}

                  {bs && (
                    <>
                      {bs.lunchMissed && bs.cwdApplies && <StatusMsg kind="bad">Lunch missed — Continuous Working Day. OT now starts at {toHHMM(bs.callH + 9)} (9h after call) instead of {isElevenHourDay ? 12 : 11}h.</StatusMsg>}
                      {bs.lunchMissed && !bs.cwdApplies && <StatusMsg kind="info">APA §2.3 — no lunch obligation on {vr.dayType} days. Paid as 8h × BHR.</StatusMsg>}
                      {bs.lunchVeryLate && bs.cwdApplies && <StatusMsg kind="bad">Lunch started after {toHHMM(bs.cwdThreshold)} (6.5h from call) — CWD triggered. OT now starts at {toHHMM(bs.callH + 9)}.</StatusMsg>}
                      {bs.lunchLate && <StatusMsg kind="warn">Late — should have started by {toHHMM(bs.lateThreshold)} (5.5h from call). £10 penalty applied.</StatusMsg>}
                      {!bs.lunchMissed && !bs.lunchLate && !bs.lunchVeryLate && bs.lunchDuration < 60 && bs.cwdApplies && bs.lunchEndAbs != null && <StatusMsg kind="warn">Curtailed by {60 - bs.lunchDuration}m. Ends {toHHMM(bs.lunchEndAbs)}. OT starts {60 - bs.lunchDuration}m earlier.</StatusMsg>}
                    </>
                  )}

                  {bs && bs.cwdApplies && (bs.lunchMissed || bs.lunchVeryLate) && (
                    <div className="flex items-center justify-between gap-3">
                      <div>
                        <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold">Meal Provided?</div>
                        <div className="text-[10px] text-neutral-500 mt-0.5">£7.50 allowance if no meal given</div>
                      </div>
                      <Toggle value={!v.noMealProvided} onChange={(val) => set({ noMealProvided: !val })} ariaLabel="Meal provided" />
                    </div>
                  )}
                </div>
              )}
            </div>
          </SectionCard>

          {/* 2nd-Break SectionCard removed — now lives as a chip in the Conditions row. */}

          {/* CWD Breaks SectionCard removed — now lives as a chip in the Conditions row. */}

          {/* ── Conditions chips ── */}
          <div className="space-y-2 mb-4">
            <div className="text-[10px] uppercase tracking-[0.22em] text-neutral-500 font-bold px-1">Conditions</div>
            <div className="flex flex-wrap gap-2">
              {show2ndBreakSection && (() => {
                // V4-5h-14 (F5.1): normalize to ExtraChip pattern — rounded-lg + state-driven palette.
                // Given on time → sky; curtailed/late → tm-warn; missed → tm-pen.
                const sbState = bs?.sbState;
                const sbCls = sbState === 'missed'
                  ? 'bg-tm-pen/[0.08] border-tm-pen/40 text-tm-pen hover:bg-tm-pen/[0.12]'
                  : (sbState === 'late' || sbState === 'curtailed')
                    ? 'bg-tm-warn/[0.08] border-tm-warn/40 text-tm-warn hover:bg-tm-warn/[0.12]'
                    : 'bg-sky-500/[0.06] border-sky-500/30 text-sky-400 hover:bg-sky-500/[0.1]';
                return (
                  <button
                    type="button"
                    onClick={() => setSecondBreakExpanded(v2 => !v2)}
                    className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] font-semibold transition-colors ${sbCls}`}
                    style={{ WebkitTapHighlightColor: 'transparent' }}
                    aria-expanded={secondBreakExpanded}
                  >
                    <span>2nd break</span>
                    {sbSuffix && <span className="font-mono text-[10px] text-neutral-300 tabular-nums">{sbSuffix.replace(/^ — /, '')}</span>}
                    <IChevronDown size={11} strokeWidth={2.5} className={`opacity-60 transition-transform ${secondBreakExpanded ? 'rotate-180' : ''}`} />
                  </button>
                );
              })()}
              {showCwdBreaksChip && (() => {
                const b1Missed = v.cwdBreak1Given === false;
                const cwd2Req = !!bs.cwd2Required;
                const b2Missed = cwd2Req && v.cwdBreak2Given === false;
                const missedCount = (b1Missed ? 1 : 0) + (b2Missed ? 1 : 0);
                const anyMissed = missedCount > 0;
                const summary = anyMissed
                  ? (cwd2Req ? `${missedCount}/2 missed` : 'Missed')
                  : (cwd2Req ? 'Both given' : 'Given');
                return (
                  <button
                    type="button"
                    onClick={() => setCwdBreaksExpanded(v2 => !v2)}
                    className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] font-semibold transition-colors ${
                      anyMissed
                        ? 'bg-tm-pen/[0.08] border-tm-pen/40 text-tm-pen hover:bg-tm-pen/[0.12]'
                        : 'bg-sky-500/[0.06] border-sky-500/30 text-sky-400 hover:bg-sky-500/[0.1]'
                    }`}
                    style={{ WebkitTapHighlightColor: 'transparent' }}
                    aria-expanded={cwdBreaksExpanded}
                  >
                    <span>CWD breaks</span>
                    <span className="font-mono text-[10px] text-neutral-300 tabular-nums">{summary}</span>
                  </button>
                );
              })()}
              {(() => {
                const travelTotalMins = (Number(v.travelOutMins) || 0) + (Number(v.travelBackMins) || 0);
                const fmtMins = (m) => {
                  const h = Math.floor(m / 60), mm = m % 60;
                  return h > 0 ? (mm > 0 ? `${h}h ${mm}m` : `${h}h`) : `${mm}m`;
                };
                const stepUpSummary     = stepUpSet     ? v.stepUpRole : null;
                const preCallSummary    = preCallSet    ? (v.preCallTime || v.truckCallTime) : null;
                const mileageSummary    = mileageSet    ? (Number(v.miles) > 0 ? `${Number(v.miles)} mi` : v.mileagePostcode) : null;
                const kitMoneySummary   = kitMoneySet   ? fmtGBP(v.kitMoneyAmount) : null;
                const travelTimeSummary = travelTimeSet ? fmtMins(travelTotalMins) : null;
                const perDiemSummary    = perDiemSet    ? fmtGBP(v.perDiemAmount) : null;
                const expensesSummary   = expensesSet   ? `${(v.expenses || []).length}` : null;
                return (<>
                  {renderChip("stepUp",     "Step-up",     stepUpSet,     stepUpSummary)}
                  {!isTravelDay && renderChip("preCall", "Pre-call", preCallSet, preCallSummary)}
                  {renderChip("mileage",    "Mileage",     mileageSet,    mileageSummary)}
                  {renderChip("kitMoney",   "Kit money",   kitMoneySet,   kitMoneySummary)}
                  {!isTravelDay && renderChip("travelTime", "Travel time", travelTimeSet, travelTimeSummary)}
                  {renderChip("perDiem",    "Per diem",    perDiemSet,    perDiemSummary)}
                  {renderChip("expenses",   "Expenses",    expensesSet,   expensesSummary)}
                </>);
              })()}
              <button
                type="button"
                onClick={toggleNotes}
                className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-[11px] font-semibold transition-colors ${
                  noteHasText
                    ? 'bg-sky-500/[0.06] border-sky-500/30 text-sky-400 hover:bg-sky-500/[0.1]'
                    : 'bg-tm-card-2 border-neutral-800 text-neutral-500 hover:border-neutral-700 hover:text-neutral-400'
                }`}
                style={{ WebkitTapHighlightColor: 'transparent' }}
              >
                <span className="uppercase tracking-wider">Notes</span>
              </button>
            </div>
          </div>

          {/* ── 2nd Break (chip-gated, warn variant) ── */}
          {show2ndBreakSection && secondBreakExpanded && (
            <SectionCard variant="condition-warn" title="2nd Break" onClose={() => setSecondBreakExpanded(false)}>
              <div className="space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  <Field label="2nd Break Start" hint={`Deadline: ${toHHMM(bs.sbDeadline)} (5.5h after lunch end)`}>
                    <TimeInput value={v.secondBreakStartTime || ""} onChange={(e) => set({ secondBreakStartTime: e.target.value })} disabled={Number(v.secondBreakDurationMins) === 0} />
                  </Field>
                  <Field label="2nd Break Duration">
                    <Select value={Number(v.secondBreakDurationMins ?? 30)} onChange={(e) => set({ secondBreakDurationMins: Number(e.target.value) })}>
                      {SECOND_BREAK_DURATIONS.map((s) => <option key={s.v} value={s.v}>{s.label}</option>)}
                    </Select>
                  </Field>
                </div>
                {bs.sbState === "missed" && <StatusMsg kind="bad">Missed — 30m × BHR penalty applied.</StatusMsg>}
                {bs.sbState === "late" && <StatusMsg kind="bad">Late (started after {toHHMM(bs.sbDeadline)}). APA: 2nd break can't be delayed — treated as missed. 30m × BHR penalty.</StatusMsg>}
                {bs.sbState === "curtailed" && <StatusMsg kind="warn">Curtailed by {30 - bs.sbDuration}m. {30 - bs.sbDuration}m × BHR penalty.</StatusMsg>}
                {bs.sbState === "given" && <StatusMsg kind="ok">Given on time.</StatusMsg>}
              </div>
            </SectionCard>
          )}

          {/* ── CWD Breaks (chip-gated) ── */}
          {showCwdBreaksChip && cwdBreaksExpanded && (
            <SectionCard title="CWD Breaks" variant="condition" onClose={() => setCwdBreaksExpanded(false)}>
              <div className="space-y-3">
                <div className="text-[11px] text-neutral-400 leading-tight">APA §6.4: CWD requires a 30m break by {toHHMM(bs.cwd1Deadline)} (9h after call){bs.cwd2Required ? `, and another by ${toHHMM(bs.cwd2Deadline)} (12.5h after call)` : ""}. Missed breaks = 30m × BHR penalty.</div>
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold">Break 1 — by {toHHMM(bs.cwd1Deadline)}</div>
                    <div className="text-[10px] text-neutral-500 mt-0.5">{v.cwdBreak1Given === false ? "Missed — +30m × BHR" : "Given"}</div>
                  </div>
                  <Toggle value={v.cwdBreak1Given !== false} onChange={(val) => set({ cwdBreak1Given: val })} ariaLabel="CWD break 1 given" />
                </div>
                {bs.cwd2Required && (
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <div className="text-[10px] uppercase tracking-wide text-sky-500 font-bold">Break 2 — by {toHHMM(bs.cwd2Deadline)}</div>
                      <div className="text-[10px] text-neutral-500 mt-0.5">{v.cwdBreak2Given === false ? "Missed — +30m × BHR" : "Given"}</div>
                    </div>
                    <Toggle value={v.cwdBreak2Given !== false} onChange={(val) => set({ cwdBreak2Given: val })} ariaLabel="CWD break 2 given" />
                  </div>
                )}
              </div>
            </SectionCard>
          )}

          {/* ── Step-up Role (chip-gated) ── */}
          {stepUpActive && (
            <SectionCard title="Step-up Role" variant="condition" onClose={() => toggleChip("stepUp")}>
              <div className="space-y-3">
                <Field label="Step-Up Role">
                  <Select value={v.stepUpRole || ""} onChange={(e) => {
                    const role = e.target.value;
                    const d = ROLE_DEFAULTS[role] || {};
                    set({ stepUpRole: role, stepUpBDR: d.bdr ?? v.stepUpBDR, stepUpOTCoef: d.otCoef ?? v.stepUpOTCoef, stepUpOTRate: d.otRate ?? null });
                  }}>
                    <option value="">— Select Role —</option>
                    {Object.entries(DEPARTMENTS).map(([dept, roles]) => <optgroup key={dept} label={dept}>{Object.keys(roles).map((r) => <option key={r} value={r}>{r}</option>)}</optgroup>)}
                  </Select>
                </Field>
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Step-Up BDR (£)" hint="Override for this day only">
                    <Input type="number" min="0" step="0.01" value={v.stepUpBDR ?? 0} onChange={(e) => set({ stepUpBDR: Number(e.target.value) })} />
                  </Field>
                  <Field label="Step-Up OT Coef">
                    <Select value={String(v.stepUpOTCoef ?? 1)} onChange={(e) => set({ stepUpOTCoef: Number(e.target.value) })}>
                      <option value="1">1×</option>
                      <option value="1.25">1.25×</option>
                      <option value="1.5">1.5×</option>
                    </Select>
                  </Field>
                </div>
                {v.stepUpRole && (
                  <button
                    type="button"
                    onClick={() => set({ stepUpRole: '', stepUpBDR: 0, stepUpOTCoef: 1, stepUpOTRate: null })}
                    className="text-[10px] uppercase tracking-[0.14em] font-bold text-neutral-500 hover:text-neutral-300 transition-colors self-start"
                    style={{ WebkitTapHighlightColor: 'transparent' }}
                  >
                    Remove step-up
                  </button>
                )}
              </div>
            </SectionCard>
          )}

          {/* ── Pre-call (chip-gated) ── */}
          {!isTravelDay && preCallActive && (
            <SectionCard title="Pre-call" variant="condition" onClose={() => toggleChip("preCall")}>
              <div className="space-y-3">
                <div className="flex items-center gap-1.5">
                  <button type="button" onClick={() => setShowPreCallInfo(s => !s)}
                    className="rounded-full flex items-center justify-center flex-shrink-0 transition-all active:scale-90 active:bg-sky-500/30"
                    style={{ width: 24, height: 24, background: 'rgba(56,189,248,0.15)', color: '#7dd3fc', WebkitTapHighlightColor: 'transparent' }}
                    aria-label="Pre-call info">
                    <IInfo size={12}/>
                  </button>
                  <span className="text-[10px] text-neutral-500">What counts as pre-call?</span>
                </div>
                {showPreCallInfo && <StatusMsg kind="info"><span className="whitespace-pre-line">{PRE_CALL_EXPLAINER}</span></StatusMsg>}
                <Field label="Pre-call time" hint="Early arrival — paid at BHR. Lunch and CWD still measured from main call time.">
                  <TimeInput value={v.preCallTime || v.truckCallTime || ''} onChange={(e) => set({ preCallTime: e.target.value })} />
                </Field>
                {(() => { const pc = parseHHMM(v.preCallTime || v.truckCallTime); return pc != null && pc < 5; })() && (
                  <StatusMsg kind="warn"><span className="whitespace-pre-line">{PRE_CALL_PRE5_DISCLAIMER}</span></StatusMsg>
                )}
                {(v.preCallTime || v.truckCallTime) && (
                  <button
                    type="button"
                    onClick={() => set({ preCallTime: '', truckCallTime: '' })}
                    className="text-[10px] uppercase tracking-[0.14em] font-bold text-neutral-500 hover:text-neutral-300 transition-colors self-start"
                    style={{ WebkitTapHighlightColor: 'transparent' }}
                  >
                    Remove pre-call
                  </button>
                )}
              </div>
            </SectionCard>
          )}

          {/* ── Mileage (chip-gated) ── */}
          {mileageActive && (
            <SectionCard title="Mileage" variant="condition" onClose={() => toggleChip("mileage")}>
              <MileageInput day={v} updateDay={set} days={days} />
            </SectionCard>
          )}

          {/* ── Kit money (chip-gated) ── */}
          {kitMoneyActive && (
            <SectionCard title="Kit money" variant="condition" onClose={() => toggleChip("kitMoney")}>
              <Field label="Kit Money Amount (£)" hint="Added to day total">
                <Input type="number" min="0" step="0.01" value={v.kitMoneyAmount ?? 0} onChange={(e) => set({ kitMoneyAmount: Number(e.target.value) })} />
              </Field>
            </SectionCard>
          )}

          {/* ── Travel time (chip-gated) ── */}
          {!isTravelDay && travelTimeActive && (
            <SectionCard title="Travel time" variant="condition" onClose={() => toggleChip("travelTime")}>
              <div className="space-y-3">
                <div className="flex items-center gap-1.5">
                  <button type="button" onClick={() => setShowTravelInfo(s => !s)}
                    className="rounded-full flex items-center justify-center flex-shrink-0 transition-all active:scale-90 active:bg-sky-500/30"
                    style={{ width: 24, height: 24, background: 'rgba(56,189,248,0.15)', color: '#7dd3fc', WebkitTapHighlightColor: 'transparent' }}
                    aria-label="Travel time calculation info">
                    <IInfo size={12}/>
                  </button>
                  <span className="text-[10px] text-neutral-500 leading-snug">{TRAVEL_TIME_CAPTION}</span>
                </div>
                {showTravelInfo && <StatusMsg kind="info"><span className="whitespace-pre-line">{TRAVEL_TIME_EXPLAINER}</span></StatusMsg>}
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Travel Out (mins)"><Input type="number" min="0" inputMode="numeric" value={v.travelOutMins || 0} onChange={(e) => set({ travelOutMins: Number(e.target.value) })} /></Field>
                  <Field label="Travel Back (mins)"><Input type="number" min="0" inputMode="numeric" value={v.travelBackMins || 0} onChange={(e) => set({ travelBackMins: Number(e.target.value) })} /></Field>
                </div>
              </div>
            </SectionCard>
          )}

          {/* ── Per diem (chip-gated) ── */}
          {perDiemActive && (
            <SectionCard title="Per diem" variant="condition" onClose={() => toggleChip("perDiem")}>
              <Field label="Per Diem Amount (£)" hint="Added to day total">
                <Input type="number" min="0" step="0.01" value={v.perDiemAmount ?? 0} onChange={(e) => set({ perDiemAmount: Number(e.target.value) })} />
              </Field>
            </SectionCard>
          )}

          {/* ── Expenses (chip-gated) ── */}
          {expensesActive && (
            <SectionCard title="Expenses" variant="condition" onClose={() => toggleChip("expenses")}>
              <div className="space-y-3">
                <button
                  type="button"
                  onClick={() => set({ expenses: [...(v.expenses || []), { id: uid(), amount: 0, category: "Other", description: "" }] })}
                  className="text-[10px] uppercase tracking-wide text-sky-500 hover:text-sky-300 font-bold flex items-center gap-1"
                ><IPlus size={11}/>Add expense</button>
                {(v.expenses || []).length > 0 && (
                  <div className="space-y-2">
                    {(v.expenses || []).map((exp) => (
                      <div key={exp.id} className="flex flex-wrap items-center gap-2">
                        <Select
                          value={exp.category}
                          onChange={(e) => set({ expenses: v.expenses.map(x => x.id === exp.id ? { ...x, category: e.target.value } : x) })}
                          className="flex-shrink-0" style={{ width: 116 }}
                        >
                          {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                        </Select>
                        <Input
                          type="number" min="0" step="0.01"
                          value={exp.amount}
                          onChange={(e) => set({ expenses: v.expenses.map(x => x.id === exp.id ? { ...x, amount: Number(e.target.value) || 0 } : x) })}
                          placeholder="0.00" className="flex-shrink-0" style={{ width: 84 }}
                        />
                        <Input
                          type="text"
                          value={exp.description}
                          onChange={(e) => set({ expenses: v.expenses.map(x => x.id === exp.id ? { ...x, description: e.target.value } : x) })}
                          placeholder="Description" className="flex-1 min-w-[80px]"
                        />
                        <button
                          type="button"
                          onClick={() => set({ expenses: v.expenses.filter(x => x.id !== exp.id) })}
                          className="text-neutral-600 hover:text-tm-pen transition-colors flex-shrink-0 p-1"
                          aria-label="Remove expense"
                        ><IX size={14}/></button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </SectionCard>
          )}

          {/* ── Notes (chip-gated) ── */}
          {notesOpen && (
            <SectionCard variant="condition" title="Notes" onClose={() => setNotesOpen(false)}>
              <textarea
                value={v.note || ""}
                onChange={(e) => set({ note: e.target.value })}
                placeholder="Anything worth remembering about this day…"
                rows={4}
                className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-[13px] text-neutral-100 placeholder:text-neutral-600 leading-snug resize-y outline-none focus:border-sky-500 transition-colors"
                style={{ fontFamily: 'inherit' }}
              />
              <div className={`text-xs mt-1 text-right ${(v.note || "").length > 1000 ? "text-tm-pen" : (v.note || "").length > 500 ? "text-tm-warn" : "text-neutral-600"}`}>
                {(v.note || "").length} / 500
              </div>
            </SectionCard>
          )}

        </div>
      );
    }

    /* ═══════════════════════════ DAY EDIT MODAL ═══════════════════════════ */

    function DayEditModal({ editing, form, setForm, crew, production, days, onSave, onCancel, onRemove, fixedCrewId = null, fixedDate = null }) {
      const isNewAll = editing === "new-all";
      const isNew    = editing === "new";
      const isKnown  = !isNew && !isNewAll;

      const activeCrew = !isNewAll ? crew.find(c => c.id === (fixedCrewId || form.crewId)) : null;
      const activeCalc = activeCrew
        ? calcForDisplay(production, form, activeCrew, findPrevDay(days, form))
        : null;
      const penaltyLines = activeCalc ? activeCalc.lines.filter(l => l.rate === null || l.isTOC) : [];

      const lineColor = (l) => {
        if (l.isTOC) return l.isBreach ? 'red' : 'amber';
        if (l.rate === null) return 'red';
        const lbl = l.label || '';
        if (/^OT|triple time/i.test(lbl)) return 'amber';
        if (/^Early Call/i.test(lbl)) return 'amber';
        if (/^(Saturday|Sunday|Bank Holiday|Night Shoot)/i.test(lbl)) return 'amber';
        return 'neutral';
      };
      const lineCls = (c) => ({
        label: c === 'red' ? 'text-tm-pen' : c === 'amber' ? 'text-tm-warn' : 'text-neutral-300',
        amt:   c === 'red' ? 'text-tm-pen font-semibold' : c === 'amber' ? 'text-tm-warn font-semibold' : 'text-neutral-100 font-semibold',
      });

      const resolvedDate = fixedDate || form.date;
      const dateStr = resolvedDate
        ? new Date(resolvedDate + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })
        : "";

      useEffect(() => {
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, []);
      useEscape(onCancel);

      const modalTitle = isNew ? "New Day Entry" : isNewAll ? "New Day — All Crew" : "Edit Day Entry";

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.78)" }}
          onClick={onCancel}
        >
          <div
            className="bg-neutral-900 w-full rounded-xl shadow-2xl border border-neutral-700 flex flex-col"
            style={{ maxWidth: 640, maxHeight: "calc(100dvh - env(safe-area-inset-top) - 1rem)", height: "auto" }}
            onClick={e => e.stopPropagation()}
          >
            {/* ── Fixed header ── */}
            <div className="flex-shrink-0 px-5 pb-3 border-b border-neutral-700" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 1rem)' }}>
              <button onClick={onCancel} className="text-[11px] uppercase tracking-[0.2em] text-neutral-400 hover:text-sky-500 transition-colors flex items-center gap-1 mb-2">
                <IArrowLeft size={12}/> All Days
              </button>
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-[10px] uppercase tracking-[0.2em] text-sky-500 font-bold mb-1.5">{modalTitle}</div>
                  {fixedCrewId && activeCrew && (
                    <div className="flex items-baseline gap-2 flex-wrap">
                      <span className="text-sm font-semibold text-neutral-100 truncate">{activeCrew.name}</span>
                      <span className="text-[10px] uppercase tracking-wider bg-neutral-800 text-neutral-400 px-1.5 py-px rounded-sm flex-shrink-0">{activeCrew.role}</span>
                      <span className="text-[10px] text-neutral-500 font-mono flex-shrink-0">BDR {fmtGBP(Number(activeCrew.bdr) || 0)}</span>
                      {dateStr && <span className="text-[11px] text-neutral-200 font-semibold flex-shrink-0">{dateStr}</span>}
                    </div>
                  )}
                  {!fixedCrewId && (isNew || isNewAll) && (
                    <div className="text-xs text-neutral-500">
                      {isNewAll
                        ? `${crew.length} crew member${crew.length !== 1 ? "s" : ""}${dateStr ? ` — ${dateStr}` : " — select date below"}`
                        : "Select crew member and date below"}
                    </div>
                  )}
                </div>
                <button onClick={onCancel} className="text-neutral-500 hover:text-neutral-200 transition-colors flex-shrink-0 flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} aria-label="Close"><IX size={16}/></button>
              </div>
            </div>

            {/* ── Scrollable body ── */}
            <div className="flex-1 overflow-y-auto px-5 py-4 min-h-0">
              <DayEntryForm
                value={form}
                onChange={setForm}
                crew={crew}
                allCrewMode={isNewAll}
                fixedCrewId={fixedCrewId}
                fixedDate={fixedDate}
                days={days}
                isElevenHourDay={!!production?.isElevenHourDay}
                production={production}
              />
              {isNewAll && (
                <div className="mt-3 bg-black border border-sky-500 p-3 text-xs text-neutral-300 rounded-xl">
                  <span className="text-sky-500 font-bold uppercase tracking-wider">Will create: </span>{crew.length} day entries — one per crew member
                </div>
              )}
              {activeCalc && activeCalc.lines.length > 0 && (
                <div className="mt-4 border border-neutral-800 rounded-lg p-3">
                  <div className="text-[10px] uppercase tracking-[0.2em] text-sky-500 font-bold mb-2">Cost Breakdown</div>
                  <table className="w-full border-collapse text-[11px]">
                    <tbody>
                      {activeCalc.lines.map((l, i) => {
                        const c = lineColor(l);
                        const cls = lineCls(c);
                        const qtyFmt = typeof l.qty === 'number' ? (Number.isInteger(l.qty) ? l.qty : l.qty.toFixed(2).replace(/\.?0+$/, '')) : l.qty;
                        return (
                          <tr key={i} className="border-b border-neutral-800/50">
                            <td className={`py-1 pr-2 font-semibold leading-tight ${cls.label}`}>{l.label}</td>
                            <td className="py-1 pr-2 text-neutral-500 leading-tight text-[10px] hidden sm:table-cell">{l.detail}</td>
                            <td className={`py-1 pr-2 font-mono text-right whitespace-nowrap ${cls.label}`}>{l.rate != null ? fmtGBP(l.rate) : ''}</td>
                            <td className={`py-1 pr-2 font-mono text-right whitespace-nowrap ${cls.label}`}>{l.rate != null && l.qty != null ? `×${qtyFmt}` : ''}</td>
                            <td className={`py-1 font-mono text-right whitespace-nowrap ${cls.amt}`}>{fmtGBP(l.amount)}</td>
                          </tr>
                        );
                      })}
                      <tr className="border-t-2 border-neutral-600">
                        <td colSpan={3} className="pt-2 pb-1 text-[10px] uppercase tracking-wider text-neutral-500 font-bold">Day Total</td>
                        <td colSpan={2} className="pt-2 pb-1 text-right font-mono font-bold text-white text-sm">{fmtGBP(activeCalc.total)}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            {/* ── Fixed footer ── */}
            <div className="flex-shrink-0 border-t border-neutral-700 px-5 pt-3 space-y-2.5" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>
              {activeCalc && (
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-[9px] text-neutral-600 uppercase tracking-wider mr-0.5">Calc</span>
                  <span className="text-[10px] bg-neutral-800 text-neutral-300 px-2 py-0.5 rounded-full font-mono whitespace-nowrap">
                    BDR {fmtGBP(Number(activeCrew.bdr) || 0)}
                  </span>
                  {activeCalc.meta.otHrs > 0 && (
                    <span className="text-[10px] bg-tm-warn/10 text-tm-warn border border-tm-warn/25 px-2 py-0.5 rounded-full font-mono whitespace-nowrap">
                      OT {Number.isInteger(activeCalc.meta.otHrs) ? activeCalc.meta.otHrs : activeCalc.meta.otHrs.toFixed(1)}h
                    </span>
                  )}
                  {penaltyLines.length > 0 && (
                    <span className="text-[10px] bg-tm-pen/10 text-tm-pen border border-tm-pen/25 px-2 py-0.5 rounded-full font-mono whitespace-nowrap">
                      {penaltyLines.length} {penaltyLines.length === 1 ? "penalty" : "penalties"}
                    </span>
                  )}
                  <span className="ml-auto text-sm font-bold text-white font-mono">{fmtGBP(activeCalc.total)}</span>
                </div>
              )}
              <div className="flex gap-2 flex-wrap">
                <Btn onClick={onSave} variant="success"><ICheck/>Save</Btn>
                <Btn onClick={onCancel} variant="ghost"><IX/>Cancel</Btn>
                {isKnown && (
                  <Btn onClick={() => onRemove(editing)} variant="danger"><ITrash/>Remove day</Btn>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ TIMESHEET GRID ═══════════════════════════ */

    function gridDisplayHours(resolvedDay) {
      const bs = deriveBreakState(resolvedDay);
      if (!bs) return 0;
      return bs.workedHrs - (bs.lunchMissed ? 0 : bs.lunchDuration / 60);
    }

    function GridCell({ day, date, production, member, onEditDay, onAddDay, isWeekend, prevDay = null, hasTOC = false, isTOCBreach = false }) {
      const borderR = "border-r border-neutral-800";
      const bgBase  = isWeekend ? "bg-neutral-900/30" : "";

      if (!day) {
        return (
          <td onClick={() => onAddDay(member.id, date)}
            className={`px-2 py-2 text-center cursor-pointer hover:bg-sky-950/40 transition-colors ${borderR} ${bgBase}`}
            style={{ minWidth: 80 }}>
            <span className="text-[9px] text-neutral-700 uppercase tracking-wider leading-none">Rest</span>
          </td>
        );
      }

      const resolved = resolveDay(production, day, member);
      const { meta, lines } = calcForDisplay(production, day, member, prevDay);

      const hasOT    = meta.otHrs > 0;
      const hasCWD   = meta.continuousDay;
      const hasLate1 = lines.some(l => l.label === "Late 1st Break");
      const hasMSB   = lines.some(l => /missed.*2nd|late.*2nd/i.test(l.label));
      const anyPenalty = hasOT || hasCWD || hasLate1 || hasMSB || hasTOC;

      const ct = resolved.callTime || "—";
      const wt = resolved.wrapTime || "—";
      const hrs = gridDisplayHours(resolved);
      const hrsLabel = Number.isInteger(hrs) ? `${hrs}h` : `${hrs.toFixed(1)}h`;

      return (
        <td onClick={() => onEditDay(day.id)}
          className={`px-2 py-1.5 cursor-pointer hover:bg-neutral-800 transition-colors ${borderR} ${bgBase}`}
          style={{ minWidth: 80 }}>
          <div className="text-[9px] text-neutral-500 font-mono whitespace-nowrap leading-tight">{ct}–{wt}</div>
          <div className="text-[11px] font-bold text-neutral-100 leading-tight">{hrsLabel}</div>
          {anyPenalty && (
            <div className="flex flex-wrap gap-0.5 mt-0.5">
              {hasOT    && <span className="text-[8px] bg-tm-warn/10 text-tm-warn border border-tm-warn/25 px-1 font-bold uppercase leading-tight py-px rounded-sm">OT</span>}
              {hasCWD   && <span className="text-[8px] bg-tm-pen/10 text-tm-pen border border-tm-pen/25 px-1 font-bold uppercase leading-tight py-px rounded-sm">CWD</span>}
              {hasLate1 && <span className="text-[8px] bg-tm-pen/10 text-tm-pen border border-tm-pen/25 px-1 font-bold uppercase leading-tight py-px rounded-sm">L1</span>}
              {hasMSB   && <span className="text-[8px] bg-tm-pen/10 text-tm-pen border border-tm-pen/25 px-1 font-bold uppercase leading-tight py-px rounded-sm">MSB</span>}
              {hasTOC   && <span className={`text-[8px] px-1 font-bold uppercase leading-tight py-px rounded-sm border ${isTOCBreach ? 'bg-tm-pen/10 text-tm-pen border-tm-pen/25' : 'bg-tm-warn/10 text-tm-warn border-tm-warn/25'}`}>{isTOCBreach ? 'TOC!' : 'TOC'}</span>}
            </div>
          )}
        </td>
      );
    }

    function TimesheetGrid({ production, crew, days, onEditDay, onAddDay, onAddAllOnDate, onAddWeek, onAddCrew, onAssignAll, onDuplicateDate, onBulkEditDate, onRemoveWeek, onRemoveDate }) {
      const [addDayType, setAddDayType] = useState("Shoot");
      const [editingDate, setEditingDate] = useState(null);
      const [dateEdit, setDateEdit] = useState({});
      const [showTravelInfo, setShowTravelInfo] = useState(false);

      useEffect(() => {
        if (!editingDate) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [editingDate]);
      useEscape(editingDate ? () => setEditingDate(null) : null);

      const DOW_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      const openDateEdit = (date) => {
        const firstEntry = days.find(d => d.date === date);
        const firstMember = firstEntry ? crew.find(c => c.id === firstEntry.crewId) : null;
        const resolved = firstEntry && firstMember
          ? resolveDay(production, firstEntry, firstMember)
          : { ...DEFAULT_PRODUCTION_DAY, ...(production.defaultDay || {}) };
        const callH = parseHHMM(resolved.callTime || "08:00") ?? 8;
        setDateEdit({
          dayType: resolved.dayType || "Shoot",
          callTime: resolved.callTime || "08:00",
          wrapTime: resolved.wrapTime || "19:00",
          lunchStartTime: resolved.lunchStartTime || "13:30",
          lunchDurationMins: resolved.lunchDurationMins ?? 60,
          secondBreakStartTime: firstEntry?.secondBreakStartTime || toHHMM(callH + 11),
          secondBreakDurationMins: firstEntry?.secondBreakDurationMins ?? 0,
          preCallTime: firstEntry?.preCallTime || firstEntry?.truckCallTime || "",
          miles: firstEntry?.miles ?? 0,
          travelOutMins: firstEntry?.travelOutMins ?? 0,
          travelBackMins: firstEntry?.travelBackMins ?? 0,
          perDiemAmount: firstEntry?.perDiemAmount ?? 0,
          kitMoneyAmount: firstEntry?.kitMoneyAmount ?? 0,
          expenses: firstEntry?.expenses ?? [],
          stepUpRole: firstEntry?.stepUpRole ?? "",
          stepUpBDR: firstEntry?.stepUpBDR ?? 0,
          stepUpOTCoef: firstEntry?.stepUpOTCoef ?? 1,
          stepUpOTRate: firstEntry?.stepUpOTRate ?? null,
          mileageMethod: firstEntry?.mileageMethod ?? 'manual',
          mileagePostcode: firstEntry?.mileagePostcode ?? '',
          mileageRoundTrip: firstEntry?.mileageRoundTrip !== false,
        });
        setEditingDate(date);
      };

      const weeks = useMemo(() => deriveWeeks(production, days),
        [days, production.gridDates, production.weekStarts, production.startDate]);

      const tocMap = useMemo(() => {
        const map = {};
        for (const member of crew) {
          const memberDays = days.filter(d => d.crewId === member.id)
            .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
          for (let i = 0; i < memberDays.length; i++) {
            const entry = map[memberDays[i].id] || {};
            entry.prevDay = i > 0 ? memberDays[i - 1] : null;
            if (i > 0) {
              const prevR = resolveDay(production, memberDays[i - 1], member);
              const currR = resolveDay(production, memberDays[i], member);
              const toc = calcTOC(prevR, currR, member, roundingApa(production));
              if (toc) { entry.hasTOC = true; entry.isTOCBreach = toc.isBreach; }
            }
            map[memberDays[i].id] = entry;
          }
        }
        return map;
      }, [days, crew, production]);

      const handleAddWeek = () => {
        let nextMon;
        if (weeks.length > 0) {
          const d = new Date(weeks[weeks.length - 1][6] + "T12:00:00");
          d.setDate(d.getDate() + 1);
          nextMon = d.toISOString().slice(0, 10);
        } else {
          nextMon = getMonday(todayISO());
        }
        onAddWeek(nextMon);
      };

      const index = useMemo(() => {
        const idx = {};
        for (const d of days) {
          if (!idx[d.date]) idx[d.date] = {};
          idx[d.date][d.crewId] = d;
        }
        return idx;
      }, [days]);

      if (crew.length === 0) {
        return <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-xl">Add crew members first.</div>;
      }

      return (
        <div className="space-y-3">
          <div className="flex items-center gap-3 flex-wrap">
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-neutral-500 uppercase tracking-wider whitespace-nowrap">Add as:</span>
              <Select value={addDayType} onChange={e => setAddDayType(e.target.value)}>{DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}</Select>
            </div>
            <div className="text-[10px] text-neutral-500 uppercase tracking-wider">Tap empty cell to add · Tap date to add all or bulk edit</div>
          </div>

          <div className="overflow-x-auto border border-neutral-800 rounded-xl overflow-hidden">
            <table className="border-collapse text-xs w-full" style={{ minWidth: 560 }}>
              <thead>
                <tr className="border-b border-neutral-700">
                  <th className="text-left px-3 py-2 text-[10px] uppercase tracking-wider text-neutral-500 font-bold whitespace-nowrap border-r border-neutral-700 bg-neutral-950"
                    style={{ position: "sticky", left: 0, zIndex: 20, minWidth: 120 }}>Crew</th>
                  {DOW_LABELS.map((label, i) => {
                    const isSat = i === 5;
                    const isSun = i === 6;
                    const headerBg  = isSun ? "bg-tm-pen/10"  : isSat ? "bg-tm-warn/10" : "bg-neutral-950";
                    const textColor = isSun ? "text-tm-pen"   : isSat ? "text-tm-warn"  : "text-neutral-500";
                    return (
                      <th key={label} className={`px-2 py-2 text-center font-bold text-[10px] uppercase tracking-wider border-r border-neutral-700 ${headerBg} ${textColor}`}
                        style={{ minWidth: 80 }}>{label}</th>
                    );
                  })}
                </tr>
              </thead>

              {weeks.length === 0 ? (
                <tbody>
                  <tr>
                    <td colSpan={8} className="py-12 text-center">
                      <button
                        onClick={handleAddWeek}
                        className="inline-flex items-center gap-2 px-6 py-3 rounded-lg border border-sky-500/40 text-sky-500 hover:bg-sky-500/10 hover:border-sky-500 transition-colors text-sm font-bold uppercase tracking-wider"
                      >
                        <span className="text-lg leading-none">+</span> Add Week
                      </button>
                    </td>
                  </tr>
                </tbody>
              ) : weeks.map((weekDates, weekIdx) => (
                <tbody key={weekDates[0]}>
                  <tr className={`border-b border-neutral-800 ${weekIdx > 0 ? "border-t-2 border-t-neutral-700" : "border-t border-t-neutral-700"}`}>
                    <td className="px-3 py-1.5 bg-neutral-900 border-r border-neutral-700 whitespace-nowrap"
                      style={{ position: "sticky", left: 0, zIndex: 10 }}>
                      <div className="flex items-center justify-between gap-2">
                        <div>
                          <div className="text-[8px] text-neutral-600 uppercase tracking-wider leading-none">Week of</div>
                          <div className="text-[10px] text-neutral-400 font-semibold leading-tight mt-0.5">
                            {new Date(weekDates[0] + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
                          </div>
                        </div>
                        <button
                          onClick={() => onRemoveWeek(weekDates[0])}
                          className="text-[9px] text-tm-pen/40 hover:text-tm-pen transition-colors font-bold leading-none px-0.5"
                          title="Remove this week"
                          aria-label="Remove this week">✕</button>
                      </div>
                    </td>
                    {weekDates.map(date => {
                      const dow = dayOfWeek(date);
                      const isSat = dow === 6;
                      const isSun = dow === 0;
                      const isBH = isBankHoliday(date);
                      const treatAsSunCol = isSun || isBH;
                      const isEditingThis = editingDate === date;
                      // Bank holidays reuse the Sunday red tint per APA §2.4.
                      const cellBg    = treatAsSunCol ? "bg-tm-pen/[0.04]" : isSat ? "bg-tm-warn/[0.04]" : "bg-neutral-900";
                      const numColor  = treatAsSunCol ? "text-tm-pen"      : isSat ? "text-tm-warn"      : "text-neutral-300";
                      const hasEntries = days.some(d => d.date === date);
                      return (
                        <td key={date}
                          onClick={() => {
                            if (isEditingThis) { setEditingDate(null); return; }
                            if (hasEntries) { openDateEdit(date); } else { onAddAllOnDate(date, addDayType); }
                          }}
                          className={`px-2 py-1.5 text-center cursor-pointer border-r border-neutral-700 transition-colors hover:bg-neutral-800/60 ${cellBg}${isEditingThis ? " ring-2 ring-inset ring-sky-500" : ""}`}
                          title={isBH ? `Bank Holiday — ${getBankHolidayName(date)}` : undefined}>
                          <div className={`text-[11px] font-bold leading-none ${numColor}`}>
                            {new Date(date + "T12:00:00").getDate()}
                          </div>
                          <div className="text-[8px] text-neutral-600 leading-none mt-0.5">
                            {new Date(date + "T12:00:00").toLocaleDateString("en-GB", { month: "short" })}
                          </div>
                          {isBH && (
                            <div className="text-[7px] font-bold text-tm-pen leading-none mt-0.5 uppercase tracking-wider">BH</div>
                          )}
                          <div className="flex items-center justify-center gap-1.5 mt-0.5">
                            <button onClick={e => { e.stopPropagation(); onAssignAll(date, addDayType); }}
                              className="text-[8px] text-neutral-600 hover:text-sky-500 transition-colors font-bold uppercase tracking-wider"
                              title="Add all crew for this date"
                              aria-label="Assign all crew for this date">+all</button>
                            {days.some(d => d.date === date) && (
                              <button onClick={e => { e.stopPropagation(); onDuplicateDate(date); }}
                                className="text-neutral-600 hover:text-sky-500 transition-colors"
                                title="Duplicate this date"
                                aria-label="Duplicate this date"><ICopy size={10}/></button>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                  {crew.map(member => (
                    <tr key={member.id} className="border-b border-neutral-800">
                      <td className="px-3 py-2 whitespace-nowrap border-r border-neutral-700 bg-neutral-950"
                        style={{ position: "sticky", left: 0, zIndex: 10 }}>
                        <div className="text-[11px] font-semibold text-neutral-200">{member.name}</div>
                        <div className="text-[9px] text-neutral-500 uppercase tracking-wider">{member.role}</div>
                      </td>
                      {weekDates.map(date => {
                        const dow = dayOfWeek(date);
                        const isSat = dow === 6;
                        const isSun = dow === 0;
                        return (
                          <GridCell
                            key={date}
                            day={index[date]?.[member.id]}
                            date={date}
                            production={production}
                            member={member}
                            onEditDay={onEditDay}
                            onAddDay={(crewId, d) => onAddDay(crewId, d, addDayType)}
                            isWeekend={isSat || isSun}
                            prevDay={index[date]?.[member.id] ? (tocMap[index[date][member.id].id]?.prevDay ?? null) : null}
                            hasTOC={!!(index[date]?.[member.id] && tocMap[index[date][member.id].id]?.hasTOC)}
                            isTOCBreach={!!(index[date]?.[member.id] && tocMap[index[date][member.id].id]?.isTOCBreach)}
                          />
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              ))}

              <tbody>
                <tr className="border-t border-neutral-700">
                  <td className="px-3 py-2 bg-neutral-950 border-r border-neutral-700" style={{ position: "sticky", left: 0, zIndex: 10 }}>
                    <button onClick={onAddCrew} className="text-[10px] uppercase tracking-wider font-bold text-neutral-500 hover:text-sky-500 transition-colors flex items-center gap-1">
                      <span className="text-base leading-none">+</span> Crew
                    </button>
                  </td>
                  <td colSpan={7} className="bg-neutral-950" />
                </tr>
              </tbody>
            </table>
          </div>

          <div className="flex justify-center pt-1">
            <button onClick={handleAddWeek}
              className="text-[10px] uppercase tracking-wider font-bold text-neutral-500 hover:text-sky-500 border border-neutral-700 hover:border-sky-500 transition-colors px-4 py-1.5 rounded-sm flex items-center gap-1.5">
              <span className="text-sm leading-none font-bold">+</span> Add Week
            </button>
          </div>

          {editingDate && (
            <div
              role="dialog" aria-modal="true" aria-labelledby="date-edit-title"
              className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
              style={{ backgroundColor: "rgba(0,0,0,0.78)" }}
              onClick={() => setEditingDate(null)}
            >
              <div
                className="bg-neutral-900 w-full rounded-xl shadow-2xl border border-neutral-700 flex flex-col"
                style={{ maxWidth: 640, maxHeight: "calc(100dvh - env(safe-area-inset-top) - 1rem)" }}
                onClick={e => e.stopPropagation()}
              >
                {/* ── Fixed header ── */}
                <div className="flex-shrink-0 px-5 pb-3 border-b border-neutral-700" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 1rem)' }}>
                  <div className="flex items-start justify-between gap-3">
                    <div className="min-w-0">
                      <div id="date-edit-title" className="text-[10px] uppercase tracking-[0.2em] text-sky-500 font-bold mb-1.5">All Crew</div>
                      <div className="flex items-baseline gap-2 flex-wrap">
                        <span className="text-sm font-semibold text-neutral-100">
                          {weekday(editingDate)} {new Date(editingDate + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })}
                        </span>
                        <span className="text-[11px] text-neutral-500">Updates all existing entries on this date</span>
                      </div>
                    </div>
                    <button onClick={() => setEditingDate(null)} className="text-neutral-500 hover:text-neutral-200 transition-colors flex-shrink-0 flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} aria-label="Close"><IX size={16}/></button>
                  </div>
                </div>

                {/* ── Scrollable body ── */}
                <div className="flex-1 overflow-y-auto px-5 py-4 min-h-0 space-y-4">
                  {(production.invoices || []).some(inv => inv.status === "sent" || inv.status === "paid") && (() => {
                    const count = (production.invoices || []).filter(inv => inv.status === "sent" || inv.status === "paid").length;
                    return (
                      <div className="bg-sky-900/20 border border-sky-700/40 rounded-xl px-3 py-2 text-[11px] text-sky-300">
                        This production has {count} sent invoice{count !== 1 ? "s" : ""}. Changes here won't update them.
                      </div>
                    );
                  })()}
                  {/* Core: day type, times, lunch */}
                  <div className="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden">
                    <div className="px-4 py-3 border-b border-neutral-800">
                      <div className="text-[10px] uppercase tracking-[0.2em] text-sky-500 font-bold">Day</div>
                    </div>
                    <div className="px-4 py-4 space-y-3">
                      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <Field label="Day Type">
                          <Select value={dateEdit.dayType || "Shoot"} onChange={e => setDateEdit(p => ({...p, dayType: e.target.value}))}>
                            {DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                          </Select>
                        </Field>
                        <Field label="Call Time"><TimeInput value={dateEdit.callTime || ""} onChange={e => setDateEdit(p => ({...p, callTime: e.target.value}))} /></Field>
                        <Field label="Wrap Time"><TimeInput value={dateEdit.wrapTime || ""} onChange={e => setDateEdit(p => ({...p, wrapTime: e.target.value}))} /></Field>
                        {dateEdit.dayType !== "Travel Day" && dateEdit.dayType !== "Rest Day" && (
                          <Field label="Pre-call Time" hint="Early arrival — paid at BHR. Lunch and CWD from main call.">
                            <TimeInput value={dateEdit.preCallTime || ""} onChange={e => setDateEdit(p => ({...p, preCallTime: e.target.value}))} />
                          </Field>
                        )}
                        {dateEdit.dayType !== "Travel Day" && dateEdit.dayType !== "Rest Day" && <>
                          <Field label="Lunch Start"><TimeInput value={dateEdit.lunchStartTime || ""} onChange={e => setDateEdit(p => ({...p, lunchStartTime: e.target.value}))} /></Field>
                          <Field label="Lunch Duration">
                            <Select value={dateEdit.lunchDurationMins ?? 60} onChange={e => setDateEdit(p => ({...p, lunchDurationMins: Number(e.target.value)}))}>
                              {LUNCH_DURATIONS.map(d => <option key={d.v} value={d.v}>{d.label}</option>)}
                            </Select>
                          </Field>
                        </>}
                      </div>
                    </div>
                  </div>

                  {/* Core: 2nd break */}
                  {dateEdit.dayType !== "Travel Day" && dateEdit.dayType !== "Rest Day" && (
                    <div className="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden">
                      <div className="px-4 py-3 border-b border-neutral-800">
                        <div className="text-[10px] uppercase tracking-[0.2em] text-sky-500 font-bold">2nd Break</div>
                      </div>
                      <div className="px-4 py-4">
                        <div className="grid grid-cols-2 gap-3">
                          <Field label="2nd Break Start">
                            <TimeInput value={dateEdit.secondBreakStartTime || ""} onChange={e => setDateEdit(p => ({...p, secondBreakStartTime: e.target.value}))} disabled={Number(dateEdit.secondBreakDurationMins) === 0} />
                          </Field>
                          <Field label="2nd Break Duration">
                            <Select value={Number(dateEdit.secondBreakDurationMins ?? 0)} onChange={e => setDateEdit(p => ({...p, secondBreakDurationMins: Number(e.target.value)}))}>
                              {SECOND_BREAK_DURATIONS.map(s => <option key={s.v} value={s.v}>{s.label}</option>)}
                            </Select>
                          </Field>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Core: mileage */}
                  <Disclosure
                    label="Mileage"
                    summary={dateEdit.miles > 0 ? `${dateEdit.miles} mi` : 'Not set'}
                    defaultOpen={dateEdit.miles > 0 || !!dateEdit.mileagePostcode}
                  >
                    <MileageInput
                      day={dateEdit}
                      updateDay={patch => setDateEdit(p => ({...p, ...patch}))}
                      days={[]}
                    />
                  </Disclosure>

                  {/* Extras: travel time, per diem, step-up */}
                  <Disclosure label="Extras">
                    {dateEdit.dayType !== "Travel Day" && (
                      <div className="space-y-3">
                        <div className="flex items-center gap-1.5">
                          <span className="text-[10px] uppercase tracking-wide text-sky-500 font-bold">Travel Time</span>
                          <button type="button" onClick={() => setShowTravelInfo(s => !s)}
                            className="rounded-full flex items-center justify-center flex-shrink-0 transition-all active:scale-90 active:bg-sky-500/30"
                            style={{ width: 24, height: 24, background: 'rgba(56,189,248,0.15)', color: '#7dd3fc', WebkitTapHighlightColor: 'transparent' }}
                            aria-label="Travel time calculation info">
                            <IInfo size={12}/>
                          </button>
                        </div>
                        <div className="text-[10px] text-neutral-500 leading-snug">{TRAVEL_TIME_CAPTION}</div>
                        {showTravelInfo && <StatusMsg kind="info"><span className="whitespace-pre-line">{TRAVEL_TIME_EXPLAINER}</span></StatusMsg>}
                        <div className="grid grid-cols-2 gap-3">
                          <Field label="Travel Out (mins)"><Input type="number" min="0" inputMode="numeric" value={dateEdit.travelOutMins ?? 0} onChange={e => setDateEdit(p => ({...p, travelOutMins: Number(e.target.value)}))} /></Field>
                          <Field label="Travel Back (mins)"><Input type="number" min="0" inputMode="numeric" value={dateEdit.travelBackMins ?? 0} onChange={e => setDateEdit(p => ({...p, travelBackMins: Number(e.target.value)}))} /></Field>
                        </div>
                      </div>
                    )}
                    <div className="space-y-3">
                      <Field label="Per Diem Amount (£)" hint="Set 0 to deactivate. Added to day total.">
