    /* ═══════════════════════════ EXPORT TAB (BB mode) ═══════════════════════════ */

    // Week picker bottom sheet — lists weeks and lets user pick one
    function WeekPickerSheet({ open, weeks, onPick, onClose, title }) {
      useEffect(() => {
        if (!open) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [open]);
      useEscape(open ? onClose : null);
      if (!open) return null;
      const fmtWeekRange = (wk) => {
        const s = new Date(wk.start + "T12:00:00");
        const e = new Date(wk.end   + "T12:00:00");
        const opt = { day: 'numeric', month: 'short' };
        return `${s.toLocaleDateString('en-GB', opt)} – ${e.toLocaleDateString('en-GB', { ...opt, year: 'numeric' })}`;
      };
      return (
        <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
             style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
             onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
               style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-2">
              <div className="text-sm font-bold text-neutral-100">{title || "Select week"}</div>
            </div>
            <div className="px-4 pb-4 flex flex-col gap-1 max-h-80 overflow-y-auto">
              {weeks.map(wk => (
                <button key={wk.start} type="button"
                  onClick={() => { onPick(wk.index); onClose(); }}
                  className="w-full text-left px-3 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm text-neutral-100 flex items-center justify-between"
                  style={{ WebkitTapHighlightColor: 'transparent' }}>
                  <span className="font-semibold">{wk.label}</span>
                  <span className="text-neutral-400 text-[11px]">{fmtWeekRange(wk)}</span>
                </button>
              ))}
            </div>
            <div className="px-4 pb-4 pt-1 border-t border-neutral-800">
              <button type="button" onClick={onClose}
                className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    // Crew picker bottom sheet — lists crew and lets user pick one
    function CrewPickerSheet({ open, crew, days, production, onPick, onClose, title }) {
      useEffect(() => {
        if (!open) return;
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, [open]);
      useEscape(open ? onClose : null);
      if (!open) return null;
      return (
        <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
             style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
             onClick={onClose}>
          <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
               style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="px-5 pt-5 pb-2">
              <div className="text-sm font-bold text-neutral-100">{title || "Select crew member"}</div>
            </div>
            <div className="px-4 pb-4 flex flex-col gap-1 max-h-80 overflow-y-auto">
              {crew.map(c => {
                const cDays = (days || []).filter(d => d.crewId === c.id);
                const sorted = [...cDays].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
                const total = sorted.reduce((s, d, i) => s + calcForDisplay(production, d, c, sorted[i-1]||null).total, 0);
                return (
                  <button key={c.id} type="button"
                    onClick={() => { onPick(c.id); onClose(); }}
                    className="w-full text-left px-3 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors flex items-center justify-between gap-3"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <div>
                      <div className="text-sm font-semibold text-neutral-100">{c.name}</div>
                      <div className="text-[10px] text-neutral-400 uppercase tracking-wide mt-0.5">{c.role} · {cDays.length} day{cDays.length !== 1 ? 's' : ''}</div>
                    </div>
                    <div className="text-sm font-bold text-neutral-200 font-mono flex-shrink-0">{fmtGBP(total)}</div>
                  </button>
                );
              })}
            </div>
            <div className="px-4 pb-4 pt-1 border-t border-neutral-800">
              <button type="button" onClick={onClose}
                className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    function ExportTab({ production, crew, days, showToast, userPrefs }) {
      // exportState: null | { mode: "timesheet"|"grid", crewId: string|null, weekIdx: number|null }
      const [exportState, setExportState]   = useState(null);
      const [showWeekPicker, setShowWeekPicker] = useState(false);
      const [showCrewPicker, setShowCrewPicker] = useState(false);
      // pendingExport: partially-built export awaiting week or crew selection
      const [pendingExport, setPendingExport] = useState(null);

      const weeks = useMemo(() => computeWeeks(production, days), [production, days]);

      const byCrew = useMemo(() => {
        const m = new Map();
        days.forEach((d) => {
          const c = crew.find((cc) => cc.id === d.crewId); if (!c) return;
          if (!m.has(c.id)) m.set(c.id, { crew: c, entries: [] });
          m.get(c.id).entries.push(d);
        });
        return crew.map((c) => m.get(c.id)).filter(Boolean);
      }, [crew, days]);

      const grandTotal = byCrew.reduce((s, { crew: c, entries }) => {
        const sortedG = [...entries].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        return s + sortedG.reduce((t, e, i) => t + calcForDisplay(production, e, c, sortedG[i - 1] || null).total, 0);
      }, 0);

      // Trigger print after PrintView mounts
      useEffect(() => {
        if (!exportState) return;
        const timer = setTimeout(() => {
          const cleanup = () => setExportState(null);
          if (IS_NATIVE) {
            nativeExportPrintViewPdf('print-view', '.page', 'TimeMachine timesheet.pdf')
              .catch((e) => { try { console.error('PDF export failed', e); } catch (_) {} })
              .finally(cleanup);
          } else {
            window.addEventListener('afterprint', cleanup, { once: true });
            window.print();
            // Fallback clear after 30s if afterprint doesn't fire
            const fallback = setTimeout(cleanup, 30000);
            return () => clearTimeout(fallback);
          }
        }, 300);
        return () => clearTimeout(timer);
      }, [exportState]);

      const triggerExport = (mode, crewId, weekIdx) => {
        setExportState({ mode, crewId: crewId || null, weekIdx: weekIdx !== undefined ? weekIdx : null });
      };

      // Handlers for the two-step flows (need crew OR week first)
      const handleGridAll = () => {
        if (days.length === 0) return;
        triggerExport("grid", null, null);
      };
      const handleGridWeek = () => {
        if (weeks.length === 1) { triggerExport("grid", null, 0); return; }
        setPendingExport({ mode: "grid", crewId: null });
        setShowWeekPicker(true);
      };
      const handleCrewTS = () => {
        if (byCrew.length === 1) { triggerExport("timesheet", byCrew[0].crew.id, null); return; }
        setPendingExport({ mode: "timesheet", weekIdx: null });
        setShowCrewPicker(true);
      };
      const handleCrewTSWeek = () => {
        if (byCrew.length === 1) {
          if (weeks.length === 1) { triggerExport("timesheet", byCrew[0].crew.id, 0); return; }
          setPendingExport({ mode: "timesheet", crewId: byCrew[0].crew.id });
          setShowWeekPicker(true);
          return;
        }
        setPendingExport({ mode: "timesheet", needsWeek: true });
        setShowCrewPicker(true);
      };

      const onWeekPicked = (weekIdx) => {
        if (pendingExport) {
          triggerExport(pendingExport.mode, pendingExport.crewId || null, weekIdx);
          setPendingExport(null);
        }
      };
      const onCrewPicked = (crewId) => {
        if (!pendingExport) return;
        if (pendingExport.needsWeek) {
          if (weeks.length === 1) { triggerExport("timesheet", crewId, 0); setPendingExport(null); return; }
          setPendingExport({ ...pendingExport, crewId, needsWeek: false });
          setShowWeekPicker(true);
        } else {
          triggerExport(pendingExport.mode, crewId, pendingExport.weekIdx !== undefined ? pendingExport.weekIdx : null);
          setPendingExport(null);
        }
      };

      const handleCrewText = async (c, entries) => {
        try {
          const text = generateCrewText(c, entries, production);
          const r = await shareTextOrCopy(text, `${c.name} Timesheet`);
          if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
        } catch {}
      };

      // Build PrintView props from exportState
      const exportCrewMember = exportState?.crewId
        ? crew.find(c => c.id === exportState.crewId)
        : null;

      if (byCrew.length === 0) {
        return (
          <div className="bg-neutral-900 border border-dashed border-neutral-700 p-8 text-center rounded-xl">
            <div className="flex justify-center mb-2 text-neutral-700"><IFile size={32}/></div>
            <div className="text-neutral-500 text-sm">Add crew and day entries first.</div>
          </div>
        );
      }

      const noDays = days.length === 0;

      return (
        <div className="space-y-6">
          <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><IShare size={16}/>Export</h2>

          {/* Grand total summary */}
          <div className="bg-neutral-900 border-l-4 border-sky-500 p-4 rounded-r-[10px] flex items-baseline justify-between">
            <div>
              <div className="text-[10px] uppercase tracking-[0.2em] text-sky-500 font-bold">{byCrew.length} crew · {days.length} day entries</div>
              <div className="text-[11px] text-neutral-500 mt-0.5">{weeks.length} week{weeks.length !== 1 ? 's' : ''}</div>
            </div>
            <div className="font-mono font-bold text-neutral-100 text-lg">{fmtGBP(grandTotal)}</div>
          </div>

          {/* Group 1 — Production Grid */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Production Grid</div>
            <Btn variant="primary" onClick={handleGridAll} disabled={noDays}>
              <IDownload/>Export Full Production Grid (PDF)
            </Btn>
            {weeks.length > 1 && (
              <Btn variant="subtle" onClick={handleGridWeek} disabled={noDays}>
                <IDownload/>Export Single Week (PDF)
              </Btn>
            )}
          </div>

          {/* Group 2 — Individual Timesheets */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Individual Timesheets</div>
            <Btn variant="subtle" onClick={handleCrewTS} disabled={noDays}>
              <IDownload/>Export Crew Timesheet (PDF)
            </Btn>
            {weeks.length > 1 && (
              <Btn variant="subtle" onClick={handleCrewTSWeek} disabled={noDays}>
                <IDownload/>Export Crew Timesheet, Single Week (PDF)
              </Btn>
            )}
          </div>

          {/* Text export per crew member */}
          <div className="space-y-2">
            <div className="text-[10px] uppercase tracking-[0.2em] text-neutral-400 font-bold">Text / Clipboard</div>
            {byCrew.map(({ crew: c, entries }) => (
              <Btn key={c.id} variant="ghost" onClick={() => handleCrewText(c, entries)}>
                <IMessage/>{c.name} — Text
              </Btn>
            ))}
          </div>

          {/* PrintView portal — renders when exportState is set */}
          {exportState && (
            <PrintView
              mode={exportState.mode}
              production={production}
              crewMember={exportCrewMember}
              crewList={crew}
              days={days}
              weeks={weeks}
              exportWeekIndex={exportState.weekIdx}
              userPrefs={userPrefs}
            />
          )}

          {/* Pickers */}
          <WeekPickerSheet
            open={showWeekPicker}
            weeks={weeks}
            title="Select week"
            onPick={onWeekPicked}
            onClose={() => { setShowWeekPicker(false); setPendingExport(null); }}
          />
          <CrewPickerSheet
            open={showCrewPicker}
            crew={crew}
            days={days}
            production={production}
            title="Select crew member"
            onPick={onCrewPicked}
            onClose={() => { setShowCrewPicker(false); setPendingExport(null); }}
          />
        </div>
      );
    }

    /* ═══════════════════════════ PRODUCTION SETTINGS SHEET ═══════════════════════════ */

    function ProductionSettingsSheet({ production, setProduction, crew, onClose, userPrefs }) {
      const set = (k) => (e) => setProduction(p => ({ ...p, [k]: e.target.value }));
      const setNum = (k) => (e) => setProduction(p => ({ ...p, [k]: Number(e.target.value) }));

      const handleStartDateChange = (e) => {
        const newDate = e.target.value;
        if (/^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
          const monday = getMonday(newDate);
          setProduction(prev => ({
            ...prev,
            startDate: newDate,
            weekStarts: [...new Set([...(prev.weekStarts || []), monday])],
          }));
        } else {
          setProduction(prev => ({ ...prev, startDate: newDate }));
        }
      };

      const displayTitle = production.title || "Production";
      const headerLabel = displayTitle.length > 28 ? displayTitle.slice(0, 28) + "…" : displayTitle;

      const invoicingDetailsSummary =
        (production.toAddress || '').split('\n')[0].trim() ||
        (production.invoicingEmail || '').trim() ||
        (production.jobReference || '').trim() ||
        '—';

      const modeSummary = (() => {
        const parts = [];
        parts.push(production.bestBoyMode ? 'Best Boy' : 'Solo');
        if (production.bestBoyMode) {
          parts.push(production.viewMode === 'mobile' ? 'Mobile' : 'Grid');
        }
        parts.push(production.isElevenHourDay ? '11h' : '10h');
        return parts.join(' · ');
      })();

      const weekendSummary = (() => {
        const satCustom = (production.satRateMode || 'apa') === 'custom';
        const sunCustom = (production.sunRateMode || 'apa') === 'custom';
        if (!satCustom && !sunCustom) return 'APA standard';
        const bits = [];
        if (satCustom) bits.push(`Sat ${production.satRateCustom ?? 1.5}×`);
        if (sunCustom) bits.push(`Sun ${production.sunRateCustom ?? 2}×`);
        return bits.join(' · ');
      })();

      const soloMember = (!production.bestBoyMode && (production.crew ?? []).length > 0) ? production.crew[0] : null;
      const roleSummary = soloMember ? `${soloMember.role || '—'} · £${soloMember.bdr ?? 0}` : '—';

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100">
          <div className="border-b border-sky-500 bg-black sticky top-0 z-40" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
              <button onClick={onClose} className="text-neutral-400 hover:text-sky-500 transition-colors p-1 -ml-1" aria-label="Back">
                <IArrowLeft size={16}/>
              </button>
              <div className="flex-1 text-center font-bold uppercase tracking-tight text-sm">{headerLabel} settings</div>
              <div style={{ width: 24 }} />
            </div>
          </div>

          <div className="max-w-2xl mx-auto px-4 py-6">

            <SectionCard title="Basics">
              <Field label="Production title">
                <Input value={production.title || ""} onChange={set("title")} placeholder="e.g. Walkers / Lays — Minds Eye" />
              </Field>
              <Field label="Production company">
                <Input value={production.prodCo || ""} onChange={set("prodCo")} placeholder="Production company" />
              </Field>
              <Field label="Start date">
                <div className="relative w-full">
                  <div className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-2.5 py-2 text-sm font-mono text-neutral-100 min-h-[36px] flex items-center">

    function SoloDayPill({ total, dayIndex, dayCount, hasPrev, hasNext, onPrev, onNext, onAdd, onViewCalc, isToday, comparisonUnit }) {
      // Compare line follows the user's pill-comparison preference. 'off' hides
      // the line entirely; any other value looks up the matching item by label,
      // falling back to the first surface entry if the saved label is stale.
      const unit = comparisonUnit ?? COMPARISON_SURFACE[0];
      const compareLabel = unit === 'off' ? null
        : (COMPARISON_SURFACE.includes(unit) ? unit : COMPARISON_SURFACE[0]);
      const compareItem = compareLabel ? COMPARISON_ITEMS.find(c => c.label === compareLabel) : null;
      const compareQty = compareItem ? fmtComparisonQty(total / compareItem.price) : null;
      const swap = { animation: 'tm-pill-swap 140ms ease' };
      return (
        <div style={{ position: 'fixed', bottom: 'calc(env(safe-area-inset-bottom) + 12px)', left: 12, right: 12, zIndex: 30, pointerEvents: 'none' }}>
          <div style={{ pointerEvents: 'auto' }}>
            <Pill
              leftBtn={{
                icon: <IChevronLeft size={16} strokeWidth={2.5} />,
                onClick: onPrev,
                disabled: !hasPrev,
                ariaLabel: 'Previous day',
              }}
              rightBtn={hasNext
                ? {
                    icon: <IChevronRight size={16} strokeWidth={2.5} />,
                    onClick: onNext,
                    ariaLabel: 'Next day',
                  }
                : {
                    icon: <IPlus size={16} strokeWidth={2.5} />,
                    onClick: onAdd,
                    variant: 'add',
                    ariaLabel: 'Add day',
                  }
              }
              onCenterClick={onViewCalc}
            >
              <div className="tm-pill-topline pill-counter" key={`topline-${dayIndex}`} style={swap}>
                <span>DAY {dayIndex + 1} OF {dayCount}</span>
                {isToday && (
                  <>
                    <span className="tm-pill-dot" />
                    <span>TODAY</span>
                  </>
                )}
              </div>
              <div className="tm-pill-amount pill-amount" key={`amount-${dayIndex}`} style={swap}>{fmtGBP(total)}</div>
              {compareItem && (
                <div className="tm-pill-compare pill-compare" key={`compare-${dayIndex}`} style={swap}>
                  ≈ {compareQty} {compareLabel}
                </div>
              )}
            </Pill>
          </div>
        </div>
      );
    }

    function MultiCrewOverviewView({ production, days, crew, total, onClose, onOpenSave, setProduction, onTriggerCrewTimesheet, showToast, userPrefs, onOpenCrewBreakdown, onOpenDayBreakdown }) {
      const [activeCrewSheet, setActiveCrewSheet] = useState(null);
      const [editingCrew, setEditingCrew] = useState(null);
      const sortedDates = useMemo(
        () => [...new Set((days || []).map(d => d.date))].sort(),
        [days]
      );

      const meCrewId = resolveUserCrewId(production, userPrefs);

      const crewWithTotals = useMemo(() => {
        return (crew || []).map(member => {
          let t = 0;
          let daysWorked = 0;
          for (const day of days) {
            if (day.crewId !== member.id) continue;
            daysWorked += 1;
            const prev = findPrevDay(days, day);
            t += calcForDisplay(production, day, member, prev).total;
          }
          return { member, total: t, daysWorked, isMe: member.id === meCrewId };
        });
      }, [production, days, crew, meCrewId]);

      const productionBuckets = useMemo(() => {
        const totals = { basic: 0, ot: 0, pen: 0 };
        for (const member of (crew || [])) {
          for (const day of days) {
            if (day.crewId !== member.id) continue;
            const calc = calcForDisplay(production, day, member, findPrevDay(days, day));
            const b = bucketCalcTotals(calc);
            totals.basic += b.basic;
            totals.ot += b.ot;
            totals.pen += b.pen;
          }
        }
        return totals;
      }, [production, days, crew]);

      const sortedCrew = useMemo(() => {
        const me = crewWithTotals.filter(c => c.isMe);
        const rest = crewWithTotals.filter(c => !c.isMe).sort((a, b) => b.total - a.total);
        return [...me, ...rest];
      }, [crewWithTotals]);

      const daysWithTotals = useMemo(() => {
        return sortedDates.map((date, idx) => {
          let t = 0;
          for (const day of days.filter(d => d.date === date)) {
            const member = crew.find(c => c.id === day.crewId);
            if (!member) continue;
            const prev = findPrevDay(days, day);
            t += calcForDisplay(production, day, member, prev).total;
          }
          return { date, dayNumber: idx + 1, total: t };
        });
      }, [production, days, crew, sortedDates]);

      return (
        <div className="fixed inset-0 z-50 bg-neutral-950 overflow-y-auto" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 96px)' }}>
          <div className="sticky top-0 z-10 bg-black border-b border-sky-500" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-6xl mx-auto px-4 pt-3 pb-3.5">
              <button onClick={onClose} className="text-[10px] uppercase tracking-[0.18em] text-neutral-500 hover:text-sky-500 transition-colors font-bold mb-1 flex items-center gap-1" aria-label="Close production overview">
                <span className="text-neutral-600">‹</span>{(production.title || 'PRODUCTION').toUpperCase()}
              </button>
              <div className="text-[20px] font-extrabold tracking-tight text-neutral-100">PRODUCTION TOTAL</div>
            </div>
          </div>

          <div className="max-w-6xl mx-auto px-4 py-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl px-4 pt-4 pb-3.5 mb-4">
              <div className="text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-bold mb-1.5">
                {sortedDates.length}-DAY SHOOT · GROSS
              </div>
              <div className="font-mono text-[42px] font-bold leading-none text-neutral-100 tabular-nums tracking-tight">
                {fmtGBP(total)}
              </div>
              {(() => {
                const sum = productionBuckets.basic + productionBuckets.ot + productionBuckets.pen;
                if (sum <= 0) return null;
                const pctBasic = (productionBuckets.basic / sum) * 100;
                const pctOt = (productionBuckets.ot / sum) * 100;
                const pctPen = (productionBuckets.pen / sum) * 100;
                return (
                  <div className="h-1.5 bg-neutral-950 rounded-full overflow-hidden flex mt-3 mb-1">
                    <div className="bg-sky-500" style={{ width: `${pctBasic}%` }}/>

            <div className="px-5 pt-3 pb-2">

    function CalcBreakdownView({ production, days, crew, total, onClose, onExportPDF, onExportText, onPickDay, onGenerateInvoice }) {
      const sorted = useMemo(() => [...days].sort((a, b) => {
        const dc = (a.date || '').localeCompare(b.date || '');
        return dc !== 0 ? dc : (a.crewId > b.crewId ? 1 : -1);
      }), [days]);

      const buckets = useMemo(() => {
        const b = { basic: 0, ot: 0, pen: 0, kit: 0, extras: 0 };
        sorted.forEach(d => {
          const c = crew.find(cc => cc.id === d.crewId);
          if (!c) return;
          const calc = calcForDisplay(production, d, c, findPrevDay(days, d));
          calc.lines.forEach(line => {
            b[categorizeBreakdownLine(line.label || '')] += Number(line.amount) || 0;
          });
        });
        const sum = b.basic + b.ot + b.pen + b.kit + b.extras;
        const want = Number(total) || 0;
        if (Math.abs(sum - want) > 0.01) {
          console.warn(`[earnings meter] bucket sum ${sum.toFixed(2)} does not match total ${want.toFixed(2)} — unmapped line?`);
        }
        return b;
      }, [sorted, crew, production, days, total]);

      const wholeP = Math.floor(Number(total) || 0);
      const penceP = Math.round(((Number(total) || 0) - wholeP) * 100);
      const wholeStr = `£${wholeP.toLocaleString("en-GB")}`;
      const penceStr = `.${String(penceP).padStart(2, "0")}`;
      const uniqueDayCount = Array.from(new Set((days || []).map(d => d.date).filter(Boolean))).length;

      const [realMoneyExpanded, setRealMoneyExpanded] = useState(true);
      const [showShareMenu, setShowShareMenu] = useState(false);
      const [expandedDays, setExpandedDays] = useState(() => new Set());
      const toggleDay = (dayId) => setExpandedDays(s => {
        const next = new Set(s);
        if (next.has(dayId)) next.delete(dayId); else next.add(dayId);
        return next;
      });

      return (
        <div style={{ position: 'fixed', inset: 0, zIndex: 60, background: '#0a0a0a', display: 'flex', flexDirection: 'column' }}>
          {/* Header — back, centered title, SHARE link */}
          <div style={{ paddingTop: 'calc(env(safe-area-inset-top) + 4px)', flexShrink: 0 }}>
            <div className="flex items-center justify-between px-4 py-3 mb-3.5 border-b border-neutral-800">
              <button
                type="button"
                onClick={onClose}
                className="w-8 h-8 rounded-lg bg-neutral-900 border border-neutral-800 flex items-center justify-center text-neutral-400 hover:text-neutral-100 transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}
                aria-label="Back"
              >
                <IChevronLeft size={14} strokeWidth={2.2} />
              </button>
              <h3 className="text-[14px] uppercase tracking-[0.1em] font-extrabold text-neutral-100 m-0">
                Shoot Total
              </h3>
              <button
                type="button"
                onClick={() => setShowShareMenu(true)}
                className="text-[10px] uppercase tracking-[0.14em] font-bold text-sky-500 hover:text-sky-400 px-2 py-1 transition-colors"
                style={{ WebkitTapHighlightColor: 'transparent' }}
                aria-label="Share / export"
              >
                SHARE
              </button>
            </div>
          </div>

          <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 16 }}>
            {/* Big total — production subtitle, split amount, meter, legend, all in one gross-tinted card */}
            <div className="tm-big-total">
              <div className="text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-bold mb-2">
                {(production.title || 'Untitled').toUpperCase()} · {uniqueDayCount} {uniqueDayCount === 1 ? 'DAY' : 'DAYS'}
              </div>
              <div className="font-mono font-extrabold tracking-[-0.02em] flex items-baseline gap-0.5 mb-3.5 text-neutral-100">
                <span className="text-[42px] leading-none">{wholeStr}</span>
                <span className="text-[22px] leading-none text-neutral-400 font-bold">{penceStr}</span>
              </div>
              {total > 0 && (
                <div className="flex h-1.5 rounded-full overflow-hidden bg-neutral-900 mb-2.5">
                  {buckets.basic  > 0 && <div className="bg-sky-500" style={{ width: `${(buckets.basic  / total) * 100}%` }} />}
                  {buckets.ot     > 0 && <div className="bg-tm-warn" style={{ width: `${(buckets.ot     / total) * 100}%` }} />}
                  {buckets.pen    > 0 && <div className="bg-tm-pen"  style={{ width: `${(buckets.pen    / total) * 100}%` }} />}
                  {buckets.kit    > 0 && <div className="bg-tm-kit"  style={{ width: `${(buckets.kit    / total) * 100}%` }} />}
                  {buckets.extras > 0 && <div className="bg-tm-good" style={{ width: `${(buckets.extras / total) * 100}%` }} />}
                </div>
              )}
              {total > 0 && (
                <div className="flex flex-wrap gap-x-4 gap-y-1 font-mono text-[11px] text-neutral-400">
                  {buckets.basic > 0 && (
                    <div className="flex items-center gap-1.5">
                      <div className="w-2 h-2 rounded-sm bg-sky-500" />
                      <span>BASIC</span>
                      <span className="text-neutral-100">{fmtGBP(buckets.basic)}</span>
                    </div>
                  )}
                  {buckets.ot > 0 && (
                    <div className="flex items-center gap-1.5">
                      <div className="w-2 h-2 rounded-sm bg-tm-warn" />
                      <span>OT</span>
                      <span className="text-neutral-100">{fmtGBP(buckets.ot)}</span>
                    </div>
                  )}
                  {buckets.pen > 0 && (
                    <div className="flex items-center gap-1.5">
                      <div className="w-2 h-2 rounded-sm bg-tm-pen" />
                      <span>PEN</span>
                      <span className="text-neutral-100">{fmtGBP(buckets.pen)}</span>
                    </div>
                  )}
                  {buckets.kit > 0 && (
                    <div className="flex items-center gap-1.5">
                      <div className="w-2 h-2 rounded-sm bg-tm-kit" />
                      <span>KIT</span>
                      <span className="text-neutral-100">{fmtGBP(buckets.kit)}</span>
                    </div>
                  )}
                  {buckets.extras > 0 && (
                    <div className="flex items-center gap-1.5">
                      <div className="w-2 h-2 rounded-sm bg-tm-good" />
                      <span>EXTRAS</span>
                      <span className="text-neutral-100">{fmtGBP(buckets.extras)}</span>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* "In real money" — collapsible */}
            {total > 0 && (
              <div className="mx-4 mb-4 bg-neutral-800/40 border border-dashed border-neutral-700 rounded-xl">
                <button
                  type="button"
                  onClick={() => setRealMoneyExpanded(v => !v)}
                  className="w-full flex items-center justify-between px-3.5 py-3 text-[10px] uppercase tracking-[0.22em] font-bold text-sky-500 hover:bg-neutral-800/20 transition-colors rounded-xl"
                  style={{ WebkitTapHighlightColor: 'transparent' }}
                  aria-expanded={realMoneyExpanded}
                >
                  <span className="flex items-center gap-1.5">
                    <span aria-hidden="true">◇</span>
                    In real money
                  </span>
                  <IChevronDown size={12} strokeWidth={2.5} className={`opacity-60 transition-transform ${realMoneyExpanded ? 'rotate-180' : ''}`} />
                </button>
                {realMoneyExpanded && (
                  <div className="px-3.5 pb-3.5">
                    <ul className="m-0 p-0 list-none">
                      {COMPARISON_SURFACE.map((label, idx) => {
                        const item = COMPARISON_ITEMS.find(c => c.label === label);
                        if (!item) return null;
                        const qty = total / item.price;
                        return (
                          <li
                            key={label}
                            className={`flex items-baseline gap-2.5 py-1.5 text-xs ${idx > 0 ? 'border-t border-dashed border-neutral-800' : ''}`}
                          >
                            <span className="flex-shrink-0 text-base">{item.emoji}</span>
                            <span className="font-mono font-bold text-neutral-100 flex-shrink-0 min-w-[3.5rem]">
                              {fmtComparisonQty(qty)}

                            <span className="flex-1 text-neutral-400">{item.label}</span>
                          </li>

                  </div>

            {/* By-day list */}
            {sorted.length === 0 ? (
              <div style={{ textAlign: 'center', color: '#525252', paddingTop: 24, fontSize: 13 }}>No days entered yet</div>

                <h4 className="text-[10px] uppercase tracking-[0.18em] text-neutral-500 font-bold mb-2 mx-4">BY DAY</h4>
