    function AllInvoicesView({ productions, onOpenInvoice, onUpdateInvoice, onDeleteInvoice, showToast, userPrefs, setShowProductionPicker, setShowWizard }) {
      const allInvoices = React.useMemo(() => {
        const items = [];
        for (const p of productions) {
          for (const inv of (p.invoices || [])) {
            items.push({ invoice: inv, production: p });
          }
        }
        return items;
      }, [productions]);

      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'draft' | 'sent' | 'paid'
      const [actionSheetTarget, setActionSheetTarget] = useState(null);

      const todayMs = React.useMemo(() => new Date(todayISO() + 'T12:00:00').getTime(), []);

      const counts = React.useMemo(() => {
        let draft = 0, sent = 0, paid = 0, overdue = 0, outstanding = 0;
        for (const { invoice: inv } of allInvoices) {
          const sub = invoiceSubtotal(inv.lineItems);
          const { vatAmount: vat, total: tot } = invoiceVAT(inv, sub);
          if (inv.status === 'paid') paid++;
          else if (inv.status === 'sent') {
            sent++;
            outstanding += tot;
            if (inv.dueDate && new Date(inv.dueDate + 'T12:00:00').getTime() < todayMs) overdue++;
          } else { draft++; outstanding += tot; }
        }
        return { draft, sent, paid, overdue, outstanding, all: allInvoices.length };
      }, [allInvoices, todayMs]);

      const visible = React.useMemo(() => {
        const filtered = filterStatus === 'all'
          ? allInvoices
          : allInvoices.filter(({ invoice }) => invoice.status === filterStatus);
        const priorityOf = ({ invoice }) => {
          const s = getDisplayStatus(invoice);
          if (s.label.startsWith('OVERDUE')) return 0;
          if (invoice.status === 'sent') return 1;
          if (invoice.status === 'draft') return 2;
          return 3;
        };
        return [...filtered].sort((a, b) => {
          const pa = priorityOf(a), pb = priorityOf(b);
          if (pa !== pb) return pa - pb;
          return (b.invoice.invoiceDate || '').localeCompare(a.invoice.invoiceDate || '');
        });
      }, [allInvoices, filterStatus]);

      const hasInvoicingSetup = !!(userPrefs?.displayName?.trim());

      if (allInvoices.length === 0) {
        if (!hasInvoicingSetup) {
          return (
            <div className="max-w-6xl mx-auto px-4 py-12 text-center">
              <div className="flex justify-center mb-4 text-neutral-700"><IReceipt size={40}/></div>
              <div className="text-neutral-200 text-sm font-semibold mb-2">Set up invoicing</div>
              <div className="text-neutral-500 text-xs mb-6">Add your name and bank details once — they'll appear on every invoice you generate.</div>
              <Btn variant="primary" onClick={() => setShowWizard(true)}><IFilePlus size={14}/>Set up invoicing</Btn>
            </div>
          );
        }
        return (
          <div className="max-w-6xl mx-auto px-4 py-12 text-center">
            <div className="flex justify-center mb-4 text-neutral-700"><IReceipt size={40}/></div>
            <div className="text-neutral-400 text-sm font-semibold">No invoices yet.</div>
            <div className="text-neutral-500 text-xs mt-2">Tap <strong className="text-neutral-300">+ New invoice</strong> below to create your first invoice.</div>
          </div>
        );
      }

      return (
        <div className="max-w-6xl mx-auto px-4 py-3">
          <div className="flex items-baseline gap-1.5 mb-3 text-[11px] text-neutral-500 font-mono flex-wrap">
            <span className="text-neutral-100 font-bold text-[13px]">{fmtGBP(counts.outstanding)}</span>
            <span className="text-neutral-600">outstanding</span>
            {counts.overdue > 0 && (
              <>
                <span className="text-neutral-700">·</span>
                <span className="text-tm-pen font-bold">{counts.overdue} OVERDUE</span>
              </>
            )}
            {counts.outstanding === 0 && counts.overdue === 0 && (
              <span className="text-neutral-500">All invoices paid <span className="text-tm-good">✓</span></span>
            )}
          </div>

          <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1" style={{ scrollbarWidth: 'none' }}>
            {[
              { k: 'all', label: 'All', n: counts.all },
              ...(counts.draft > 0 ? [{ k: 'draft', label: 'Draft', n: counts.draft }] : []),
              ...(counts.sent > 0 ? [{ k: 'sent', label: 'Sent', n: counts.sent }] : []),
              ...(counts.paid > 0 ? [{ k: 'paid', label: 'Paid', n: counts.paid }] : []),
            ].map(({ k, label, n }) => {
              const active = filterStatus === k;
              return (
                <button key={k} onClick={() => setFilterStatus(k)}
                  className={`inline-flex items-baseline gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider whitespace-nowrap border transition-colors ${active ? 'bg-sky-500/10 border-sky-500/30 text-sky-400' : 'bg-tm-card-2 border-neutral-700 text-neutral-400'}`}
                  style={{ WebkitTapHighlightColor: 'transparent' }}>
                  {label} <span className="font-mono font-medium opacity-70">{n}</span>
                </button>
              );
            })}
          </div>
          <button
            type="button"
            onClick={() => setShowProductionPicker(true)}
            className="w-full mb-3 px-4 py-3.5 rounded-xl border border-dashed border-neutral-700 hover:border-sky-500 hover:bg-sky-500/[0.03] hover:text-sky-400 text-neutral-500 text-[11px] font-bold uppercase tracking-[0.18em] transition-colors flex items-center justify-center gap-2"
            style={{ WebkitTapHighlightColor: 'transparent' }}
          >
            <IPlus size={13}/>New invoice
          </button>
          <div className="space-y-2">
            {visible.map(({ invoice, production }) => {
              const s = getDisplayStatus(invoice);
              const subtotal = invoiceSubtotal(invoice.lineItems);
              const { vatAmount, total } = invoiceVAT(invoice, subtotal);
              const dueMs = invoice.dueDate ? new Date(invoice.dueDate + 'T12:00:00').getTime() : null;
              const isOverdue = invoice.status === 'sent' && dueMs && dueMs < todayMs;
              const daysOverdue = isOverdue ? Math.floor((todayMs - dueMs) / 86400000) : 0;
              const daysToDue = (invoice.status === 'sent' && dueMs && !isOverdue) ? Math.ceil((dueMs - todayMs) / 86400000) : 0;

              return (
                <button
                  key={invoice.id}
                  onClick={() => onOpenInvoice(production.id, invoice.id)}
                  className={`w-full text-left rounded-xl p-3 border transition-colors active:bg-neutral-800 ${isOverdue ? 'bg-neutral-900 border-tm-pen/25 hover:border-tm-pen/40' : 'bg-neutral-900 border-neutral-800 hover:border-neutral-700'}`}
                  style={{
                    WebkitTapHighlightColor: 'transparent',
                    ...(isOverdue ? { backgroundImage: 'radial-gradient(80% 60% at 100% 0%, rgba(244,63,94,0.06) 0%, transparent 60%)' } : {})
                  }}>
                  <div className="flex items-baseline justify-between gap-2 mb-1">
                    <span className="text-[10px] font-mono tracking-wider text-neutral-500 font-semibold truncate">{invoice.invoiceNumber}</span>
                    <Badge variant={s.variant}>{s.label}</Badge>
                  </div>
                  <div className="text-[15px] font-bold text-neutral-100 mb-1 truncate">
                    {production.title || <span className="italic text-neutral-500 font-medium">Untitled production</span>}
                  </div>
                  <div className="font-mono font-bold text-[17px] text-neutral-100 mb-1.5">{fmtGBP(total)}</div>
                  <div className="flex items-baseline justify-between gap-2">
                    <div className="text-[11px] font-mono min-w-0 flex-1">
                      {invoice.status === 'paid' && invoice.datePaid && (
                        <span className="text-neutral-500">Paid {fmtDateShort(invoice.datePaid)} <span className="text-tm-good">✓</span></span>
                      )}
                      {isOverdue && (
                        <span className="text-tm-pen font-bold">⚠ {daysOverdue} DAY{daysOverdue !== 1 ? 'S' : ''} OVERDUE <span className="text-neutral-600 font-medium">· due {fmtDateShort(invoice.dueDate)}</span></span>
                      )}
                      {invoice.status === 'sent' && !isOverdue && invoice.dueDate && (
                        <span className="text-neutral-400">Due {fmtDateShort(invoice.dueDate)} <span className="text-neutral-600">· in {daysToDue} day{daysToDue !== 1 ? 's' : ''}</span></span>
                      )}
                      {invoice.status === 'draft' && (
                        <span className="text-neutral-500">Created {fmtDateShort(invoice.invoiceDate || (invoice.createdAt ? invoice.createdAt.slice(0,10) : todayISO()))} <span className="text-neutral-600">· not sent</span></span>
                      )}
                    </div>
                    <button
                      onClick={e => { e.stopPropagation(); setActionSheetTarget({ invoice, production }); }}
                      className="text-neutral-600 hover:text-neutral-400 transition-colors rounded-lg hover:bg-neutral-800 flex items-center justify-center flex-shrink-0 -mr-1 -mb-1"
                      style={{ minWidth: 28, minHeight: 28, WebkitTapHighlightColor: 'transparent' }}
                      aria-label="Invoice options">
                      <IKebab size={12}/>
                    </button>
                  </div>
                </button>
              );
            })}
          </div>
          {actionSheetTarget && (
            <InvoiceRowActionSheet
              invoice={actionSheetTarget.invoice}
              onClose={() => setActionSheetTarget(null)}
              onUpdate={patch => onUpdateInvoice(actionSheetTarget.production.id, actionSheetTarget.invoice.id, patch)}
              onDelete={() => onDeleteInvoice(actionSheetTarget.production.id, actionSheetTarget.invoice.id)}
              showToast={showToast}
            />
          )}
        </div>
      );
    }

    function ProductionsScreen({ productions, onOpen, onNewProduction, onDelete, onDuplicate, onUpdateDays, onOpenSettings, onOpenStats, userPrefs, setUserPrefs, onUpdateInvoice, onDeleteInvoice, onCreateInvoice, homeTab, setHomeTab }) {
      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };
      const [confirmOpts, setConfirmOpts] = useState(null);
      const [actionSheet, setActionSheet] = useState(null);
      const [showProductionPicker, setShowProductionPicker] = useState(false);
      const [showWizard, setShowWizard] = useState(false);
      const [searchOpen, setSearchOpen] = useState(false);
      const [query, setQuery] = useState("");
      const searchInputRef = useRef(null);
      // Live clock for the hero card's CLOCKED stat — ticks every 30s so the
      // "Xh Ym since call" value advances while ON CALL. Static state (WRAPPED
      // / no call yet) is unaffected by the tick.
      const [tickNow, setTickNow] = useState(() => new Date());
      useEffect(() => {
        const id = setInterval(() => setTickNow(new Date()), 30000);
        return () => clearInterval(id);
      }, []);
const confirmDelete = (p) => setConfirmOpts({
        title: "Delete production?",
        message: `Delete "${p.title || 'Untitled Production'}"? This cannot be undone.`,
        confirmLabel: "Delete",
        confirmTone: "danger",
        onConfirm: () => onDelete(p.id),
      });
      const todayStr = new Date().toISOString().slice(0, 10);
      const displayName = userPrefs?.displayName?.trim() || "";

      // Per-production totals
      const productionTotals = useMemo(() => {
        const totals = {};
        for (const p of productions) {
          const crew = p.crew ?? [];
          const days = p.days ?? [];
          totals[p.id] = days.reduce((sum, d) => {
            const c = crew.find(cc => cc.id === d.crewId);
            if (!c) return sum;
            return sum + calcForDisplay(p, d, c, findPrevDay(days, d)).total;
          }, 0);
        }
        return totals;
      }, [productions]);

      // Per-production worked-hours total (for the month-group head's hour figure).
      const productionHours = useMemo(() => {
        const hrs = {};
        for (const p of productions) {
          const crew = p.crew ?? [];
          const days = p.days ?? [];
          hrs[p.id] = days.reduce((sum, d) => {
            const c = crew.find(cc => cc.id === d.crewId);
            if (!c) return sum;
            return sum + (calcForDisplay(p, d, c, findPrevDay(days, d)).meta?.workedHrs || 0);
          }, 0);
        }
        return hrs;
      }, [productions]);

      // Per-production OT hours total (for the full prod-card meta line).
      const productionOTHours = useMemo(() => {
        const hrs = {};
        for (const p of productions) {
          const crew = p.crew ?? [];
          const days = p.days ?? [];
          hrs[p.id] = days.reduce((sum, d) => {
            const c = crew.find(cc => cc.id === d.crewId);
            if (!c) return sum;
            return sum + (calcForDisplay(p, d, c, findPrevDay(days, d)).meta?.otHrs || 0);
          }, 0);
        }
        return hrs;
      }, [productions]);

      const invoicesCount = useMemo(
        () => productions.reduce((s, p) => s + ((p.invoices || []).length), 0),
        [productions]
      );

      // Sort/group by the production's actual shoot date — earliest day record
      // wins so a March shoot added in May groups under March. Falls back to
      // startDate, then createdAt (truncated to YYYY-MM-DD) for productions
      // with no days yet.
      const sortKey = (p) => {
        const dates = (p.days ?? []).map(d => d.date).filter(Boolean).sort();
        if (dates.length > 0) return dates[0];
        if (p.startDate) return p.startDate;
        if (p.createdAt) return p.createdAt.slice(0, 10);
        return null;
      };
      const monthKey = (iso) => (iso ? iso.slice(0, 7) : null);
      const todayMonthKey = todayStr.slice(0, 7);
      const isCurrentMonth = (p) => monthKey(sortKey(p)) === todayMonthKey;
      const monthLabel = (key) => {
        if (!key) return "No Date";
        const d = new Date(key + "T12:00:00");
        return `${d.toLocaleString("default", { month: "long" })} · ${d.getFullYear()}`;
      };

      const sorted = [...productions].sort((a, b) => {
        const ka = sortKey(a), kb = sortKey(b);
        if (ka === kb) return 0; if (!ka) return 1; if (!kb) return -1;
        return ka < kb ? 1 : -1;
      });

      const currentShoot = sorted.find(p => (p.days ?? []).some(d => d.date === todayStr)) || null;

      const groups = [];
      for (const p of sorted) {
        const label = monthLabel(sortKey(p));
        const last = groups[groups.length - 1];
        if (last && last.label === label) last.items.push(p);
        else groups.push({ label, items: [p] });
      }

      // Month totals include current shoot even though it's pinned above groups
      const groupsDisplay = groups.map(g => ({
        label: g.label,
        monthTotal: g.items.reduce((sum, p) => sum + (productionTotals[p.id] || 0), 0),
        monthHours: g.items.reduce((sum, p) => sum + (productionHours[p.id] || 0), 0),
        items: g.items.filter(p => p.id !== currentShoot?.id),
      })).filter(g => g.items.length > 0);

      useEffect(() => {
        if (searchOpen && searchInputRef.current) searchInputRef.current.focus();
      }, [searchOpen]);

      const trimmedQuery = query.trim().toLowerCase();
      const matchesProduction = (p, q) => {
        if (!q) return true;
        if ((p.title || "").toLowerCase().includes(q)) return true;
        if ((p.prodCo || "").toLowerCase().includes(q)) return true;
        if ((p.jobReference || "").toLowerCase().includes(q)) return true;
        if ((p.crew ?? []).some(c => (c.name || "").toLowerCase().includes(q))) return true;
        if ((p.days ?? []).some(d => (d.note || "").toLowerCase().includes(q))) return true;
        return false;
      };
      const filteredSorted = trimmedQuery ? sorted.filter(p => matchesProduction(p, trimmedQuery)) : [];

      const renderCard = (p, opts = {}) => {
        const isCurrent = opts.isCurrent || false;
        const compact = opts.compact !== false; // default to compact unless explicitly false
        const cardSetDays = (updater) => onUpdateDays(p.id, updater);
        const hasToday = (p.days ?? []).some(d => d.date === todayStr);
        const bestBoyBadge = p.bestBoyMode ? <Badge variant="bestboy">BEST BOY</Badge> : null;
        const invStatus = getProductionInvoiceStatus(p);
        const invChip = invStatus ? <Badge variant={invStatus.variant}>{invStatus.label}</Badge> : null;
        const metaText = p.prodCo || `${(p.days ?? []).length} day${(p.days ?? []).length !== 1 ? 's' : ''}`;
        const wrapperClass = "bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden active:bg-neutral-800 transition-colors cursor-pointer select-none touch-manipulation";

        if (isCurrent) {
          const todayRecords = (p.days ?? []).filter(d => d.date === todayStr);
          const uniqueDates = Array.from(new Set((p.days ?? []).map(d => d.date))).sort();
          const dayCount = uniqueDates.length;
          const dayIndex = uniqueDates.indexOf(todayStr) + 1;

          // State now derives from the explicit `wrapped` flag, not wrapTime
          // presence — wrapTime is auto-filled on day creation and is no
          // longer a reliable WRAPPED signal.
          // Resolve each record's call/wrap through the cascade (matching the
          // engine) so cascade-inherited days still register as on-call/wrapped
          // and feed the live timers — raw d.callTime is undefined when a day
          // inherits its time fields from dept/production defaults.
          const resolvedToday = todayRecords.map(d => {
            const cr = (p.crew ?? []).find(cc => cc.id === d.crewId);
            const r = cr ? resolveDay(p, d, cr) : d;
            return { d, callTime: r.callTime, wrapTime: r.wrapTime };
          });
          const someOnCall = resolvedToday.some(({ d, callTime }) => callTime && d.wrapped !== true);
          const allWrapped = resolvedToday.length > 0 && resolvedToday.every(({ d, callTime }) => callTime && d.wrapped === true);

          // ON CALL drops its text prefix — the pulsing green dot is the live signal.
          // WRAPPED and CURRENT SHOOT keep their prefixes (no dot accompanying).
          let stateLabel, stateClass, showDot;
          if (someOnCall)      { stateLabel = `DAY ${dayIndex} OF ${dayCount}`;                 stateClass = "text-tm-good";     showDot = true; }
          else if (allWrapped) { stateLabel = `WRAPPED · DAY ${dayIndex} OF ${dayCount}`;       stateClass = "text-neutral-400"; showDot = false; }
          else                 { stateLabel = `CURRENT SHOOT · DAY ${dayIndex} OF ${dayCount}`; stateClass = "text-sky-500";     showDot = false; }

          const callMinsList = resolvedToday.map(({ callTime }) => parseHHMM(callTime)).filter(v => v != null).map(h => Math.round(h * 60));
          const earliestCallMins = callMinsList.length ? Math.min(...callMinsList) : null;
          const earliestCallStr = earliestCallMins != null ? toHHMM(earliestCallMins / 60) : null;

          let clockedValue = "—";
          let clockedSub = "";
          if (allWrapped) {
            let totalMins = 0;
            resolvedToday.forEach(({ callTime, wrapTime }) => {
              const c = parseHHMM(callTime);
              const w = parseHHMM(wrapTime);
              if (c != null && w != null) {
                let diff = (w - c) * 60;
                if (diff < 0) diff += 24 * 60;
                totalMins += diff;
              }
            });
            clockedValue = formatElapsed(Math.round(totalMins));
            if (earliestCallStr) clockedSub = `since ${earliestCallStr}`;
          } else if (earliestCallMins != null) {
            const nowMinsTick = tickNow.getHours() * 60 + tickNow.getMinutes();
            if (nowMinsTick < earliestCallMins) {
              clockedValue = "0m";
              clockedSub = `call at ${earliestCallStr}`;
            } else {
              const liveMins = timeSinceCall(earliestCallStr, tickNow);
              // Planned day length = latest resolved wrap measured from the
              // earliest call (cross-midnight aware, multi-crew aware). The
              // live timer ticks past the planned wrap (OT is real) but freezes
              // once it exceeds planned + 4h buffer — so forgetting to hit Wrap
              // Now doesn't show absurd 30h+ figures.
              let plannedElapsedMins = null;
              todayRecords.forEach(d => {
                const crew = (p.crew ?? []).find(cc => cc.id === d.crewId);
                const resolved = crew ? resolveDay(p, d, crew) : d;
                const c = parseHHMM(resolved.callTime);
                const w = parseHHMM(resolved.wrapTime);
                if (c == null || w == null) return;
                let dayLen = (w - c) * 60;
                if (dayLen < 0) dayLen += 24 * 60;
                const wrapFromEarliest = Math.round(c * 60) - earliestCallMins + dayLen;
                if (plannedElapsedMins == null || wrapFromEarliest > plannedElapsedMins) plannedElapsedMins = wrapFromEarliest;
              });
              const BUFFER = 240;
              if (plannedElapsedMins != null && liveMins > plannedElapsedMins + BUFFER) {
                clockedValue = formatElapsed(plannedElapsedMins + BUFFER);
                clockedSub = "Still on the clock? Wrap now";
              } else {
                clockedValue = formatElapsed(liveMins);
                clockedSub = `since ${earliestCallStr}`;
              }
            }
          }

          const todayTotal = todayRecords.reduce((sum, d) => {
            const c = (p.crew ?? []).find(cc => cc.id === d.crewId);
            if (!c) return sum;
            return sum + calcForDisplay(p, d, c, findPrevDay(p.days ?? [], d)).total;
          }, 0);

          // Sum of today's non-basic line items — OT, penalties, kit, per diem,
          // travel time, expenses, mileage. Only surfaced on the TODAY stat when
          // > 0, so a pure-basic day shows just the total.
          const todayExtras = todayRecords.reduce((sum, d) => {
            const c = (p.crew ?? []).find(cc => cc.id === d.crewId);
            if (!c) return sum;
            const calc = calcForDisplay(p, d, c, findPrevDay(p.days ?? [], d));
            return sum + (calc.lines || []).reduce((s, line) => {
              return categorizeBreakdownLine(line.label) === 'basic' ? s : s + (Number(line.amount) || 0);
            }, 0);
          }, 0);

          const showActions = someOnCall && todayRecords.length > 0;

          return (
            <div key={p.id} onClick={() => onOpen(p.id)} style={{ WebkitTapHighlightColor: 'transparent' }} className="tm-hero-card border border-neutral-800 rounded-xl transition-colors cursor-pointer select-none touch-manipulation">
              <div className="p-4">
                <div className={`flex items-center gap-1.5 text-[11px] tracking-[0.18em] font-bold mb-2 ${stateClass}`}>
                  {showDot && <span className="tm-pulse inline-block rounded-full bg-tm-good" style={{ width: 6, height: 6 }} />}
                  <span>{stateLabel}</span>
                </div>
                <div className="flex items-center gap-2 mb-1">
                  <h3 className="truncate text-base font-semibold">{p.title || <span className="text-neutral-500 italic">Untitled</span>}</h3>
                  {bestBoyBadge}
                  {invChip}
                </div>
                <div className="text-sm text-neutral-400 truncate mb-3">{metaText}</div>
                <div className="border-t border-neutral-800 -mx-4 px-4 pt-3 grid grid-cols-3 gap-3">
                  <div>
                    <div className="uppercase text-[9px] tracking-[0.15em] text-neutral-500 font-bold">Clocked</div>
                    <div className="font-mono text-[17px] font-bold text-neutral-100">{clockedValue}</div>
                    {clockedSub && <div className="text-[10px] text-neutral-500 font-mono">{clockedSub}</div>}
                  </div>
                  <div>
                    <div className="uppercase text-[9px] tracking-[0.15em] text-neutral-500 font-bold">Today</div>
                    <div className="font-mono text-[17px] font-bold text-sky-500">{fmtGBP(todayTotal)}</div>
                    {todayExtras > 0 && (
                      <div className="font-mono text-[10px] text-neutral-500 mt-0.5 leading-none">
                        +{fmtGBP(todayExtras)} extras
                      </div>
                    )}
                  </div>
                  <div>
                    <div className="uppercase text-[9px] tracking-[0.15em] text-neutral-500 font-bold">Shoot</div>
                    <div className="font-mono text-[17px] font-bold text-neutral-100">{fmtGBP(productionTotals[p.id] || 0)}</div>
                    <div className="text-[10px] text-neutral-500 font-mono">{dayCount} day{dayCount !== 1 ? 's' : ''}</div>
                  </div>
                </div>
                {showActions ? (
                  <div className="flex items-center gap-2 mt-3" onClick={e => e.stopPropagation()}>
                    <LunchNowBtn days={p.days ?? []} setDays={cardSetDays} showToast={showToast} variant="hero" className="flex-1" />
                    <WrapNowBtn days={p.days ?? []} setDays={cardSetDays} showToast={showToast} variant="hero" className="flex-1" />
                    <button
                      onClick={(e) => { e.stopPropagation(); setActionSheet(p); }}
                      className="text-neutral-600 hover:text-neutral-400 transition-colors rounded-lg hover:bg-neutral-800 flex items-center justify-center flex-shrink-0"
                      style={{ minWidth: 44, minHeight: 44 }}
                      aria-label="Production options"
                      title="Production options"
                    ><IKebab size={16}/></button>
                  </div>
                ) : (
                  <div className="flex justify-end mt-2" onClick={e => e.stopPropagation()}>
                    <button
                      onClick={(e) => { e.stopPropagation(); setActionSheet(p); }}
                      className="text-neutral-600 hover:text-neutral-400 transition-colors rounded-lg hover:bg-neutral-800 flex items-center justify-center"
                      style={{ minWidth: 44, minHeight: 44 }}
                      aria-label="Production options"
                      title="Production options"
                    ><IKebab size={16}/></button>
                  </div>
                )}
              </div>
            </div>
          );
        }

        if (!compact) {
          // Full variant — current-month non-hero shoots. Title + meta stack on
          // the left; badges + amount + kebab vertically centered on the right.
          const uniqueDates = Array.from(new Set((p.days ?? []).map(d => d.date).filter(Boolean)));
          const dayCount = uniqueDates.length;
          const otHrs = Math.round(productionOTHours[p.id] || 0);
          const segments = [];
          if (p.prodCo) segments.push(<span key="co">{p.prodCo}</span>);
          segments.push(<span key="days">{dayCount} {dayCount === 1 ? 'day' : 'days'}</span>);
          if (otHrs > 0) segments.push(<span key="ot" className="text-neutral-600">{otHrs}h OT</span>);
          const metaContent = segments.reduce((acc, seg, i) => {
            if (i > 0) acc.push(<span key={`sep-${i}`} className="text-neutral-700"> · </span>);
            acc.push(seg);
            return acc;
          }, []);
          return (
            <div key={p.id} onClick={() => onOpen(p.id)} style={{ WebkitTapHighlightColor: 'transparent' }}
                 className="flex items-center gap-3 px-3.5 py-3 bg-neutral-900 border border-neutral-800 rounded-2xl mb-2 cursor-pointer hover:bg-neutral-800/40 transition-colors select-none touch-manipulation">
              <div className="flex-1 min-w-0">
                <div className="text-[14px] font-semibold text-neutral-100 truncate">{p.title || <span className="text-neutral-500 italic">Untitled</span>}</div>
                <div className="text-[11px] font-mono text-neutral-500 truncate mt-0.5">{metaContent}</div>
              </div>
              {(bestBoyBadge || invChip) && (
                <div className="flex items-center gap-1.5 flex-shrink-0">
                  {bestBoyBadge}
                  {invChip}
                </div>
              )}
              <span className="text-[15px] font-mono font-bold text-neutral-100 flex-shrink-0">{fmtGBP(productionTotals[p.id] || 0)}</span>
              <button
                onClick={(e) => { e.stopPropagation(); setActionSheet(p); }}
                className="w-8 h-8 rounded-lg flex items-center justify-center text-neutral-600 hover:text-neutral-300 hover:bg-neutral-800 flex-shrink-0 transition-colors"
                aria-label="Production options"
                title="Production options"
              ><IKebab size={16}/></button>
            </div>
          );
        }

        // Compact variant — single-row dim card for older-month non-current shoots.
        return (
          <div key={p.id} onClick={() => onOpen(p.id)} style={{ WebkitTapHighlightColor: 'transparent' }} className={wrapperClass}>
            <div className="flex items-center gap-3 px-3.5 py-2.5">
              <h3 className="flex-1 min-w-0 truncate text-[13px] text-neutral-400">{p.title || <span className="text-neutral-500 italic">Untitled</span>}</h3>
              {bestBoyBadge}
              {invChip}
              <span className="text-[13px] font-mono text-neutral-500 flex-shrink-0">{fmtGBP(productionTotals[p.id] || 0)}</span>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100 pb-32">
          {/* Inline (non-sticky) header */}
          <div style={{ paddingTop: 'env(safe-area-inset-top)' }}>
            <div className="max-w-6xl mx-auto px-4 pt-6 pb-2 flex items-start justify-between">
              <div>
                {displayName && <div className="text-[11px] uppercase tracking-[0.2em] text-neutral-500 font-bold mb-1">{displayName}'s</div>}
                <h1 className="text-2xl sm:text-3xl font-black uppercase tracking-tight leading-none text-sky-500">TIMEMACHINE</h1>
              </div>
              <div className="flex items-center gap-1 mt-1">
                <button onClick={onOpenStats} className="w-[34px] h-[34px] rounded-full text-neutral-500 hover:bg-neutral-900 hover:text-neutral-100 flex items-center justify-center transition-colors" title="Stats" aria-label="Stats">
                  <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 3v18h18"/>
                    <path d="M7 14l4-4 4 4 5-7"/>
                  </svg>
                </button>
                <button onClick={() => { if (searchOpen) { setSearchOpen(false); setQuery(""); } else { setSearchOpen(true); } }} className={`w-[34px] h-[34px] rounded-full flex items-center justify-center transition-colors ${searchOpen ? "text-sky-500 hover:bg-neutral-900" : "text-neutral-500 hover:bg-neutral-900 hover:text-neutral-100"}`} title="Search" aria-label="Search">
                  <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="M21 21l-4.3-4.3"/>
                  </svg>
                </button>
                <button onClick={onOpenSettings} className="w-[34px] h-[34px] rounded-full text-neutral-500 hover:bg-neutral-900 hover:text-neutral-100 flex items-center justify-center transition-colors" title="Settings" aria-label="Settings">
                  <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                  </svg>
                </button>
              </div>
            </div>
            {/* Home tabs — underline style */}
            <div className="max-w-6xl mx-auto px-4 pt-1 pb-1">
              <div className="flex gap-4 border-b border-neutral-800 mb-4">
                <button
                  onClick={() => setHomeTab('productions')}
                  className={`text-[11px] uppercase tracking-[0.16em] font-bold py-2 pb-2.5 border-b-2 -mb-px transition-colors ${
                    homeTab === 'productions'
                      ? 'text-neutral-100 border-sky-500'
                      : 'text-neutral-500 border-transparent'
                  }`}
                >
                  Shoots <span className="font-mono text-neutral-600 ml-1 font-medium">{productions.length}</span>
                </button>
                <button
                  onClick={() => setHomeTab('invoices')}
                  className={`text-[11px] uppercase tracking-[0.16em] font-bold py-2 pb-2.5 border-b-2 -mb-px transition-colors ${
                    homeTab === 'invoices'
                      ? 'text-neutral-100 border-sky-500'
                      : 'text-neutral-500 border-transparent'
                  }`}
                >
                  Invoices <span className="font-mono text-neutral-600 ml-1 font-medium">{invoicesCount}</span>
                </button>
              </div>
            </div>

            {searchOpen && homeTab === "productions" && (
              <div className="max-w-6xl mx-auto px-4 pb-3">
                <div className="flex items-center gap-2 bg-neutral-900 border border-neutral-700 rounded-xl px-3 py-2.5">
                  <ISearch size={15} className="text-neutral-500 flex-shrink-0"/>
                  <input
                    ref={searchInputRef}
                    type="text"
                    value={query}
                    onChange={e => setQuery(e.target.value)}
                    placeholder="Search shoots, crew, notes…"
                    className="flex-1 bg-transparent text-sm text-neutral-100 placeholder-neutral-600 focus:outline-none"
                  />
                  {query && (
                    <button type="button" onClick={() => setQuery("")} className="text-neutral-500 hover:text-neutral-300 flex-shrink-0 transition-colors" aria-label="Clear search">
                      <IX size={15}/>
                    </button>
                  )}
                </div>
              </div>
            )}
          </div>

          {homeTab === "invoices" ? (
            <AllInvoicesView
              productions={productions}
              onOpenInvoice={(productionId, invoiceId) => onOpen(productionId, { invoiceId })}
              onUpdateInvoice={onUpdateInvoice}
              onDeleteInvoice={onDeleteInvoice}
              showToast={showToast}
              userPrefs={userPrefs}
              setShowProductionPicker={setShowProductionPicker}
              setShowWizard={setShowWizard}
            />
          ) : (
          <div className="max-w-6xl mx-auto px-4">
            {trimmedQuery ? (
              /* Search results */
              filteredSorted.length === 0 ? (
                <div className="py-12 text-center">
                  <div className="flex justify-center mb-4 text-neutral-700"><ISearch size={48}/></div>
                  <h3 className="text-xl font-semibold mb-2">No matches</h3>
                  <p className="text-sm text-neutral-400">Try a different search term</p>
                </div>
              ) : (
                <div className="space-y-2">
                  {filteredSorted.map(p => renderCard(p, { compact: !isCurrentMonth(p) }))}
                </div>
              )
            ) : (
              <>
                {/* Empty state */}
                {productions.length === 0 && (
                  <div className="py-12 text-center">
                    <div className="flex justify-center mb-4 text-neutral-700"><ICal size={48}/></div>
                    <h3 className="text-xl font-semibold mb-2">No shoots yet</h3>
                    <p className="text-sm text-neutral-400 mb-6">Create your first production to get started</p>
                    <Btn variant="primary" onClick={onNewProduction}><IPlus/>New Production</Btn>
                  </div>
                )}

                {/* Current shoot pinned at top */}
                {currentShoot && (
                  <div className="mb-6">
                    {renderCard(currentShoot, { isCurrent: true })}
                  </div>
                )}

                {/* + New production inline (only when there are productions) */}
                {productions.length > 0 && (
                  <button
                    type="button"
                    onClick={onNewProduction}
                    className="w-full mb-6 px-4 py-3.5 rounded-xl border border-dashed border-neutral-700 hover:border-sky-500 hover:bg-sky-500/[0.03] hover:text-sky-400 text-neutral-500 text-[11px] font-bold uppercase tracking-[0.18em] transition-colors flex items-center justify-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}
                  >
                    <IPlus size={13}/>New production
                  </button>
                )}

                {/* Month groups */}
                <div className="space-y-8">
                  {groupsDisplay.map(({ label, items, monthTotal, monthHours }) => (
                    <div key={label}>
                      <div className="flex items-baseline justify-between border-b border-dashed border-neutral-800 mb-2.5" style={{ padding: '0 2px 10px' }}>
                        <div className="text-[11px] uppercase tracking-[0.2em] text-sky-500 font-bold">{label}</div>
                        <div className="flex items-baseline gap-2.5">
                          <span className="font-mono text-[12px] text-neutral-600">{Math.round(monthHours)}h</span>
                          <span className="font-mono text-[12px] font-bold text-neutral-100">{fmtGBP(monthTotal)}</span>
                        </div>
                      </div>
                      <div className="space-y-2">
                        {items.map(p => renderCard(p, { compact: !isCurrentMonth(p) }))}
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
          )} {/* end homeTab === "productions" */}

          {showProductionPicker && (
            <ProductionPickerSheet
              productions={productions}
              onClose={() => setShowProductionPicker(false)}
              onCreateInvoice={onCreateInvoice}
              onOpenInvoice={(productionId, invoiceId) => onOpen(productionId, { invoiceId })}
            />
          )}

          {showWizard && (
            <InvoiceSetupWizard
              userPrefs={userPrefs}
              setUserPrefs={setUserPrefs}
              onClose={() => setShowWizard(false)}
            />
          )}

          <Toast show={!!toastMsg}>{toastMsg}</Toast>

          {/* Production action sheet (kebab menu) */}
          {actionSheet && (
            <div className="fixed inset-0 flex items-end sm:items-center justify-center sm:p-4"
                 style={{ backgroundColor: "rgba(0,0,0,0.82)", zIndex: 60 }}
                 onClick={() => setActionSheet(null)}>
              <div className="bg-neutral-900 w-full rounded-t-xl sm:rounded-xl shadow-2xl border border-neutral-700 overflow-hidden"
                   style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
                <div className="px-5 pt-5 pb-3">
                  <div className="text-sm font-bold text-neutral-100 truncate">{actionSheet.title || 'Untitled Production'}</div>
                </div>
                <div className="px-4 pb-4 flex flex-col gap-2">
                  {(() => {
                    const t = todayISO();
                    const todayRecords = (actionSheet.days || []).filter(d => d.date === t);
                    const hasWrappedToday = todayRecords.length > 0 && todayRecords.every(d => d.wrapped === true);
                    if (!hasWrappedToday) return null;
                    return (
                      <button type="button"
                        onClick={() => {
                          const p = actionSheet;
                          setActionSheet(null);
                          setConfirmOpts({
                            title: "Mark today as still on call?",
                            message: "Clears the wrap on today's day(s) so the live state returns to ON CALL. The wrap time itself stays saved.",
                            confirmLabel: "Un-wrap",
                            confirmTone: "primary",
                            onConfirm: () => {
                              onUpdateDays(p.id, days => days.map(d => d.date === t ? { ...d, wrapped: false } : d));
                              showToast("Day un-wrapped — back on call");
                            },
                          });
                        }}
                        className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                        style={{ WebkitTapHighlightColor: 'transparent' }}>
                        <IReset size={15}/>Un-wrap day
                      </button>
                    );
                  })()}
                  <button type="button"
                    onClick={() => { const p = actionSheet; setActionSheet(null); onDuplicate(p); showToast("Duplicated — edit the copy"); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <ICopy size={15}/>Duplicate
                  </button>
                  <button type="button"
                    onClick={async () => {
                      const p = actionSheet;
                      setActionSheet(null);
                      const pCrew = p.crew ?? [];
                      const pDays = p.days ?? [];
                      let text;
                      if (p.bestBoyMode) {
                        const parts = pCrew.map(c => generateCrewText(c, pDays.filter(d => d.crewId === c.id), p));
                        text = parts.join('\n\n—\n\n');
                      } else {
                        const c = pCrew[0];
                        if (!c) { showToast("No crew member"); return; }
                        text = generateCrewText(c, pDays, p);
                      }
                      const r = await shareTextOrCopy(text, p.title || 'Timesheet');
                      if (r === 'copied' || r === 'prompted') showToast('Copied to clipboard');
                    }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-neutral-300 flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <IShare size={15}/>Share Times
                  </button>
                  <button type="button"
                    onClick={() => { const p = actionSheet; setActionSheet(null); confirmDelete(p); }}
                    className="w-full text-left px-4 py-3 rounded-xl bg-neutral-800 hover:bg-neutral-700 transition-colors text-sm font-semibold text-tm-pen flex items-center gap-2"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>
                    <ITrash size={15}/>Delete
                  </button>
                </div>
                <div className="px-4 pb-5 pt-1 border-t border-neutral-800">
                  <button type="button" onClick={() => setActionSheet(null)}
                    className="w-full px-4 py-2.5 text-sm font-semibold text-neutral-400 hover:text-neutral-200 bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-colors"
                    style={{ WebkitTapHighlightColor: 'transparent' }}>Cancel</button>
                </div>
              </div>
            </div>
          )}

          <ConfirmDialog
            open={!!confirmOpts}
            title={confirmOpts?.title}
            message={confirmOpts?.message}
            confirmLabel={confirmOpts?.confirmLabel || "Confirm"}
            confirmTone={confirmOpts?.confirmTone || "danger"}
            cancelLabel="Cancel"
            onConfirm={() => { const f = confirmOpts?.onConfirm; setConfirmOpts(null); if (f) f(); }}
            onCancel={() => setConfirmOpts(null)}
          />
        </div>
      );
    }

    /* ═══════════════════════════ ROOT ═══════════════════════════ */

    function Root() {
      const [productions, setProductions, prodError] = useStoredState("bigals_productions", [], migrateProduction);
      const [userPrefs, setUserPrefs, prefsError] = useStoredState("bigals_user_prefs", DEFAULT_USER_PREFS);
      const storageError = prodError || prefsError || null;
      const [openId, setOpenId] = useState(null);
      const [showSettings, setShowSettings] = useState(false);
      const [showStats, setShowStats] = useState(false);
      const [showNewProduction, setShowNewProduction] = useState(false);
      const [showMigrationBanner, setShowMigrationBanner] = useState(migrationResult.ran === true);
      const [versionToast, setVersionToast] = useState(false);

      // Treat existing users (stored prefs without onboardingComplete) as already onboarded.
      // Guard with early-return so the state setter is a no-op when already set, avoiding a
      // spurious re-render on every mount.
      useEffect(() => {
        setUserPrefs(p => {
          let next = p;
          if (next.onboardingComplete === undefined) next = { ...next, onboardingComplete: true };
          // Consolidate legacy favourableRounding/apaRounding into the single
          // roundingMode (both-on → favourable, per the approved migration).
          if (next.roundingMode === undefined) next = { ...next, roundingMode: roundingModeOf(next) };
          return next;
        });
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      // One-time migration: absorb all old localStorage keys into the productions array
      useEffect(() => {
        try {
          if (productions.length > 0) return;
          const oldProd = storage.get("bigals_production");
          const oldCrew = storage.get("bigals_crew");
          const oldDays = storage.get("bigals_days");
          if (oldProd || oldCrew || oldDays) {
            let p = oldProd ? JSON.parse(oldProd) : { title: "", prodCo: "", crew: [], days: [] };
            if (!p.crew?.length && oldCrew) p.crew = JSON.parse(oldCrew).map(migrateCrew);
            if (!p.days?.length && oldDays) p.days = JSON.parse(oldDays).map(migrateDay);
            if (!p.defaultDay) p.defaultDay = DEFAULT_PRODUCTION_DAY;
            setProductions([{ id: uid(), ...p }]);
            storage.remove("bigals_production");
            storage.remove("bigals_crew");
            storage.remove("bigals_days");
          }
        } catch {}
      }, []); // runs once on mount only

      // Show version-update toast if the user has seen a previous version.
      useEffect(() => {
        if (userPrefs.lastSeenAppVersion && userPrefs.lastSeenAppVersion !== APP_VERSION) {
          setVersionToast(true);
          setTimeout(() => setVersionToast(false), 3000);
        }
        if (userPrefs.lastSeenAppVersion !== APP_VERSION) {
          setUserPrefs(p => ({ ...p, lastSeenAppVersion: APP_VERSION }));
        }
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      const [openInvoiceId, setOpenInvoiceId] = useState(null);
      const [homeTab, setHomeTab] = useState("productions");
      const openProduction = (id, options = {}) => { setOpenId(id); setOpenInvoiceId(options.invoiceId || null); };
      const closeProduction = () => { setOpenId(null); setOpenInvoiceId(null); };
      const handleUpdateInvoice = (productionId, invoiceId, patch) => {
        setProductions(prev => prev.map(p => p.id !== productionId ? p : {
          ...p, invoices: (p.invoices || []).map(inv => inv.id === invoiceId ? { ...inv, ...freezeOnSend(p, inv, patch) } : inv),
        }));
      };
      const handleDeleteInvoice = (productionId, invoiceId) => {
        setProductions(prev => prev.map(p => p.id !== productionId ? p : {
          ...p, invoices: (p.invoices || []).filter(inv => inv.id !== invoiceId),
        }));
      };
      const handleCreateInvoice = (productionId) => {
        const production = productions.find(p => p.id === productionId);
        if (!production) return;
        const setProduction = updater =>
          setProductions(prev => prev.map(p => p.id === productionId ? (typeof updater === 'function' ? updater(p) : updater) : p));
        // Resolve the crew to invoice the same way the in-production path does
        // (best-boy included, via userCrewIdsInProduction) — falling back to the
        // first crew member — so the global picker never emits an empty invoice;
        // bail if the shoot has no crew at all.
        const userCrewId = userCrewIdsInProduction(production, userPrefs)[0] ?? production.crew?.[0]?.id ?? null;
        if (!userCrewId) return;
        const newInvoiceId = createNewInvoice(production, setProduction, userPrefs, setUserPrefs, userCrewId);
        openProduction(productionId, { invoiceId: newInvoiceId });
      };
      const deleteProduction = (id) => {
        setProductions((prev) => prev.filter((p) => p.id !== id));
        if (openId === id) setOpenId(null);
      };
      const duplicateProduction = (p) => {
        const newId = uid();
        // Fresh crew objects with new ids so the two productions don't share crew
        // references (safe: the copy starts with no days, so nothing points at these ids yet).
        const crewIdMap = {};
        const newCrew = (p.crew || []).map(c => {
          const nid = uid();
          if (c?.id) crewIdMap[c.id] = nid;
          return { ...c, id: nid };
        });
        const copy = {
          ...p,
          id: newId,
          title: `${p.title || 'Untitled Production'} (copy)`,
          days: [],
          weekStarts: [],
          gridDates: [],
          invoices: [],      // invoices belong to the source shoot, not the copy
          dayDefaults: {},   // no days yet -> no date-keyed defaults to carry
          crew: newCrew,
          iAmCrewId: (p.iAmCrewId && crewIdMap[p.iAmCrewId]) || null,
        };
        setProductions(prev => [...prev, copy]);
        setOpenId(newId);
      };
      const handleNewProduction = ({ title, bestBoyMode }) => {
        const role = userPrefs.defaultRole || "Lighting Technician";
        const roleDefaults = ROLE_DEFAULTS[role] || {};
        const bdr = userPrefs.defaultBDR || roleDefaults.bdr || 0;
        const otCoef = userPrefs.defaultOTCoef ?? roleDefaults.otCoef ?? 1.5;
        const soloCrew = bestBoyMode ? [] : [{
          id: uid(),
          name: userPrefs.displayName || "You",
          role,
          bdr,
          otCoef,
          otRate: roleDefaults.otRate ?? null,
          vatRegistered: userPrefs.vatRegistered ?? false,
          vatRate: userPrefs.vatRate ?? 20,
          kitMoneyEnabled: userPrefs.defaultKitMoneyEnabled ?? false,
          kitMoneyAmount: userPrefs.defaultKitMoneyAmount ?? 0,
          isDriver: false,
          email: '',
        }];
        const p = {
          id: uid(),
          title,
          prodCo: "",
          jobReference: "",
          invoicingEmail: "",
          ccEmail: "",
          crew: soloCrew,
          days: [],
          defaultDay: DEFAULT_PRODUCTION_DAY,
          bestBoyMode,
          viewMode: 'mobile',
          iAmCrewId: null,
          dayDefaults: {},
          isElevenHourDay: false,
          roundingMode: roundingModeOf(userPrefs),
          startDate: todayISO(),
          isNew: true,
        };
        setProductions((prev) => [...prev, p]);
        setOpenId(p.id);
        setShowNewProduction(false);
      };
      const setProduction = (updater) =>
        setProductions((prev) => prev.map((p) =>
          p.id === openId ? (typeof updater === "function" ? updater(p) : updater) : p
        ));

      const handleExport = () => {
        const now = new Date();
        const date = now.toISOString().slice(0, 10);
        const payload = JSON.stringify({
          version: 1,
          appVersion: APP_VERSION,
          schemaVersion: SCHEMA_VERSION,
          exportDate: now.toISOString(),
          exportedAt: now.toISOString(),
          productions,
          userPrefs,
        }, null, 2);
        const filename = `timemachine-backup-${date}.json`;
        if (IS_NATIVE) {
          // Write the JSON to the app's Cache dir and open the iOS share sheet
          // (Save to Files, AirDrop, Mail, etc.) — same pattern as the PDFs.
          nativeSaveAndShare(filename, payload, { encoding: 'utf8', title: filename })
            .catch((e) => { try { console.error('Backup export failed', e); } catch (_) {} });
        } else {
          const blob = new Blob([payload], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
      };

      const handleUpdateDays = (id, updater) => {
        setProductions(prev => prev.map(p =>
          p.id === id
            ? { ...p, days: typeof updater === 'function' ? updater(p.days ?? []) : updater }
            : p
        ));
      };

      const handleResetAll = async () => {
        try {
          storage.remove("bigals_productions");
          storage.remove("bigals_user_prefs");
          storage.remove(SCHEMA_VERSION_KEY);
          storage.remove(PRE_MIGRATION_BACKUP_KEY);
          // Native: ensure the deletes hit durable storage before the WebView
          // reloads (fire-and-forget writes would otherwise race the reload).
          // Web: storage.isNative is false, so no await runs — reload is
          // synchronous exactly as before.
          if (storage.isNative) await storage.flush();
          window.location.reload();
        } catch (err) {
          alert("Couldn't reset data — try closing and reopening the app, or clearing your browser storage manually.");
        }
      };

      const currentProduction = productions.find((p) => p.id === openId);

      let screen;
      if (!userPrefs.onboardingComplete) {
        screen = (
          <OnboardingScreen
            userPrefs={userPrefs}
            set={(updates) => setUserPrefs(prev => ({ ...prev, ...updates }))}
            onComplete={() => {}}
          />
        );
      } else if (showSettings) {
        screen = (
          <SettingsScreen
            userPrefs={userPrefs}
            setUserPrefs={setUserPrefs}
            onClose={() => setShowSettings(false)}
            onExport={handleExport}
            onResetAll={handleResetAll}
            productionCount={productions.length}
          />
        );
      } else if (showStats) {
        screen = <StatsScreen productions={productions} userPrefs={userPrefs} onClose={() => setShowStats(false)} onOpenSettings={() => { setShowStats(false); setShowSettings(true); }} />;
      } else if (showNewProduction) {
        screen = (
          <NewProductionScreen
            userPrefs={userPrefs}
            onCreate={handleNewProduction}
            onCancel={() => setShowNewProduction(false)}
          />
        );
      } else if (!openId || !currentProduction) {
        screen = <ProductionsScreen productions={productions} onOpen={openProduction} onNewProduction={() => setShowNewProduction(true)} onDelete={deleteProduction} onDuplicate={duplicateProduction} onUpdateDays={handleUpdateDays} onOpenSettings={() => setShowSettings(true)} onOpenStats={() => setShowStats(true)} userPrefs={userPrefs} setUserPrefs={setUserPrefs} onUpdateInvoice={handleUpdateInvoice} onDeleteInvoice={handleDeleteInvoice} onCreateInvoice={handleCreateInvoice} homeTab={homeTab} setHomeTab={setHomeTab} />;
      } else if (!currentProduction.bestBoyMode) {
        screen = <SoloDayPage
          production={currentProduction}
          setProduction={setProduction}
          onBack={closeProduction}
          onDeleteProduction={() => {
            setProductions(prev => prev.filter(p => p.id !== currentProduction.id));
            setOpenId(null);
          }}
          userPrefs={userPrefs}
          setUserPrefs={setUserPrefs}
          initialInvoiceId={openInvoiceId}
        />;
      } else {
        screen = <ProductionApp production={currentProduction} setProduction={setProduction} onBack={closeProduction} userPrefs={userPrefs} setUserPrefs={setUserPrefs} initialInvoiceId={openInvoiceId} />;
      }

      return (
        <>
          {screen}
          {storageError && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 9999, background: '#7f1d1d', color: '#fca5a5', padding: '8px 16px', fontSize: 12, fontFamily: 'ui-sans-serif, system-ui', textAlign: 'center' }}>
              ⚠ Storage error — data may not be saved: {storageError}
            </div>
          )}
          {showMigrationBanner && (
            <div style={{ position: 'fixed', bottom: 'calc(env(safe-area-inset-bottom) + 80px)', left: 12, right: 12, zIndex: 9998, background: '#0c1e33', border: '1px solid #0ea5e9', borderRadius: 12, color: '#e0f2fe', padding: '10px 14px', fontSize: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, boxShadow: '0 4px 16px rgba(0,0,0,0.5)' }}>
              <span>Your data was updated to the latest format — everything is fine.</span>
              <button onClick={() => setShowMigrationBanner(false)} style={{ color: '#7dd3fc', background: 'none', border: 'none', cursor: 'pointer', fontSize: 18, lineHeight: 1, padding: '0 2px', flexShrink: 0, WebkitTapHighlightColor: 'transparent' }} aria-label="Dismiss">×</button>
            </div>
          )}
          {versionToast && (
            <div style={{ position: 'fixed', bottom: 'calc(env(safe-area-inset-bottom) + 80px)', left: 12, right: 12, zIndex: 9997, background: '#052e16', border: '1px solid #4ade80', borderRadius: 12, color: '#bbf7d0', padding: '10px 14px', fontSize: 12, textAlign: 'center', boxShadow: '0 4px 16px rgba(0,0,0,0.5)' }}>
              Updated to TimeMachine v{APP_VERSION} ✓
            </div>
          )}
          <CelebrationLayer prefs={userPrefs} />
        </>
      );
    }

    // migrationResult is read by Root() at render time (Root closes over it),
    // so a module-level `let` assigned before render works for both boot paths.
    let migrationResult = { ran: false };

    function startRender() {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Root />);
    }

    if (storage.isNative) {
      nativeSetupStatusBar();
      // NATIVE: load durable Preferences into the in-memory cache (and run the
      // one-time localStorage→Preferences copy) BEFORE migrations and the first
      // render, so the synchronous code below sees warm data. Then wire up the
      // flush-on-background safety net.
      storage.preload()
        .then(() => {
          migrationResult = runMigrations();
          storage.installBackgroundFlush();
          startRender();
        })
        .catch((err) => {
          try { console.error('Storage preload failed; starting with empty/best-effort data', err); } catch (_) {}
          migrationResult = runMigrations();
          storage.installBackgroundFlush();
          startRender();
        });
    } else {
      // WEB: unchanged synchronous path — migrations then render, exactly as
      // before this adapter existed (storage.* are localStorage pass-throughs).
      migrationResult = runMigrations();
      startRender();
    }
  </script>
</body>
</html>
