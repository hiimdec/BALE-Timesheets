    /* ═══════════════════════════ CREW MANAGER ═══════════════════════════ */

    function CrewManager({ crew, setCrew, autoStart = false, onAutoStartConsumed, onPushUndo }) {
      const [editing, setEditing] = useState(null);
      const blank = { id: "", name: "", role: "Lighting Technician", bdr: ROLE_DEFAULTS["Lighting Technician"].bdr, otCoef: ROLE_DEFAULTS["Lighting Technician"].otCoef, otRate: ROLE_DEFAULTS["Lighting Technician"].otRate ?? null, vatRegistered: false, vatRate: 20, kitMoneyEnabled: false, kitMoneyAmount: 0, isDriver: false };
      const [form, setForm] = useState(blank);
      const [confirmRemove, setConfirmRemove] = useState(null);
      const dragIdx = useRef(null);
      const [overIdx, setOverIdx] = useState(null);

      useEffect(() => {
        if (autoStart) {
          setForm({ ...blank, id: uid() });
          setEditing("new");
          onAutoStartConsumed?.();
        }
      }, []);

      const startNew = () => { setForm({ ...blank, id: uid() }); setEditing("new"); };
      const startEdit = (c) => { setForm({ ...c }); setEditing(c.id); };
      const cancel = () => { setEditing(null); setForm(blank); };
      const save = () => {
        if (!form.name.trim()) return;
        setCrew((prev) => {
          const exists = prev.find((c) => c.id === form.id);
          return exists ? prev.map((c) => (c.id === form.id ? form : c)) : [...prev, form];
        });
        cancel();
      };
      const remove = (id) => { onPushUndo('Crew member removed'); setCrew((prev) => prev.filter((c) => c.id !== id)); setConfirmRemove(null); };
      const onRoleChange = (role) => { const d = ROLE_DEFAULTS[role] || {}; setForm((f) => ({ ...f, role, bdr: d.bdr ?? f.bdr, otCoef: d.otCoef ?? autoOtCoef(d.bdr ?? f.bdr), otRate: d.otRate ?? null })); };
      const sortByRole = () => {
        setCrew((prev) => [...prev].sort((a, b) => {
          const r = roleRank(a.role) - roleRank(b.role);
          return r !== 0 ? r : a.name.localeCompare(b.name);
        }));
      };
      const moveUp = (i) => { if (i === 0) return; setCrew((prev) => { const n = [...prev]; [n[i-1], n[i]] = [n[i], n[i-1]]; return n; }); };
      const moveDown = (i) => { setCrew((prev) => { if (i >= prev.length - 1) return prev; const n = [...prev]; [n[i+1], n[i]] = [n[i], n[i+1]]; return n; }); };

      const onDragStart = (i) => (e) => { dragIdx.current = i; e.dataTransfer.effectAllowed = "move"; };
      const onDragOver  = (i) => (e) => { e.preventDefault(); setOverIdx(i); };
      const onDragLeave = () => setOverIdx(null);
      const onDrop = (i) => (e) => {
        e.preventDefault();
        const from = dragIdx.current;
        if (from === null || from === i) { dragIdx.current = null; setOverIdx(null); return; }
        setCrew((prev) => {
          const next = [...prev];
          const [moved] = next.splice(from, 1);
          next.splice(i, 0, moved);
          return next;
        });
        dragIdx.current = null; setOverIdx(null);
      };

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h2 className="text-lg font-semibold tracking-tight flex items-center gap-2"><IUsers size={16}/>Crew Roster</h2>
            <div className="flex gap-2">
              {crew.length > 1 && <Btn variant="ghost" onClick={sortByRole}><ISort/>Sort by Role</Btn>}
              <Btn variant="primary" onClick={startNew}><IPlus/>Add Crew</Btn>
            </div>
          </div>

          {crew.length === 0 && (
            <div className="bg-neutral-900 border border-dashed border-neutral-700 p-8 text-center rounded-xl">
              <div className="flex justify-center mb-2 text-neutral-700"><IUsers size={32}/></div>
              <div className="text-neutral-500 text-sm">No crew yet. Hit <span className="text-sky-400 font-bold">ADD CREW</span> to start.</div>
            </div>
          )}

          <div className="space-y-1">
            {crew.map((c, i) => (
              <div
                key={c.id}
                draggable
                onDragStart={onDragStart(i)}
                onDragOver={onDragOver(i)}
                onDragLeave={onDragLeave}
                onDrop={onDrop(i)}
                className={`bg-neutral-900 border transition-all flex items-center justify-between p-3 gap-2 rounded-xl ${overIdx === i ? "border-sky-400 border-t-4" : "border-neutral-800 hover:border-neutral-700"}`}
              >
                <div className="flex items-center gap-2 flex-1 min-w-0">
                  <div className="flex flex-col gap-0.5">
                    <button onClick={() => moveUp(i)} className="text-neutral-600 hover:text-sky-400 disabled:opacity-20 flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} disabled={i === 0}><IUp/></button>
                    <button onClick={() => moveDown(i)} className="text-neutral-600 hover:text-sky-400 disabled:opacity-20 flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} disabled={i === crew.length - 1}><IDown/></button>
                  </div>
                  <div className="text-neutral-600 hidden sm:block"><IGrip/></div>
                  <div className="min-w-0">
                    <div className="font-semibold text-neutral-100 truncate">{c.name}</div>
                    <div className="text-[11px] text-neutral-400 font-mono truncate">{c.role} · BDR {fmtGBP(c.bdr)} · BHR {fmtGBP(c.bdr / 10)} · OT {c.otCoef}×{c.vatRegistered ? ` · VAT ${c.vatRate ?? 20}%` : ''}{c.kitMoneyEnabled ? ` · Kit ${fmtGBP(c.kitMoneyAmount ?? 0)}/day` : ''}{c.isDriver ? ' · Driver' : ''}</div>
                  </div>
                </div>
                <div className="flex gap-1 flex-shrink-0">
                  {confirmRemove === c.id ? (
                    <>
                      <Btn size="sm" variant="danger" onClick={() => remove(c.id)}>Confirm</Btn>
                      <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(null)}>Cancel</Btn>
                    </>
                  ) : (
                    <>
                      <Btn size="sm" variant="ghost" onClick={() => startEdit(c)} aria-label="Edit crew member"><IPencil/></Btn>
                      <Btn size="sm" variant="ghost" onClick={() => setConfirmRemove(c.id)} aria-label="Delete crew member"><ITrash/></Btn>
                    </>
                  )}
                </div>
              </div>
            ))}
          </div>

          {editing && (
            <CrewEditModal
              editing={editing}
              form={form}
              setForm={setForm}
              onSave={save}
              onCancel={cancel}
              onRoleChange={onRoleChange}
            />
          )}
        </div>
      );
    }

    /* ═══════════════════════════ CREW EDIT MODAL ═══════════════════════════ */

    function CrewEditModal({ editing, form, setForm, onSave, onCancel, onRoleChange }) {
      const [selectedDept, setSelectedDept] = useState(() => ROLE_TO_DEPT[form.role] || "All");

      useEffect(() => {
        lockBodyScroll();
        return () => { unlockBodyScroll(); };

      const onDeptChange = (dept) => {

        if (dept !== "All") {
          const firstRole = Object.keys(DEPARTMENTS[dept])[0];

        }
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.78)" }}
          onClick={onCancel}
        >
          <div
            className="bg-neutral-900 w-full rounded-xl shadow-2xl border border-neutral-700 flex flex-col"
            style={{ maxWidth: 640, maxHeight: "calc(100dvh - env(safe-area-inset-top) - 1rem)" }}
            onClick={e => e.stopPropagation()}
          >
            {/* ── Fixed header ── */}
            <div className="flex-shrink-0 px-5 pb-3 border-b border-neutral-700" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 1rem)' }}>
              <div className="flex items-start justify-between gap-3">
                <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold">
                  {editing === "new" ? "Add crew member" : "Edit crew member"}
                </div>
                <button onClick={onCancel} className="text-neutral-500 hover:text-neutral-200 transition-colors flex-shrink-0 flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} aria-label="Close"><IX size={16}/></button>
              </div>
            </div>

            {/* ── Scrollable body ── */}
            <div className="flex-1 overflow-y-auto px-5 py-4 min-h-0">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <Field label="Name"><Input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="e.g. Declan Duffy" /></Field>
                <Field label="Department">
                  <Select value={selectedDept} onChange={(e) => onDeptChange(e.target.value)}>
                    <option value="All">All departments</option>
                    {Object.keys(DEPARTMENTS).map((d) => <option key={d} value={d}>{d}</option>)}
                  </Select>
                </Field>
                <Field label="Role">
                  <Select key={selectedDept} value={form.role} onChange={(e) => onRoleChange(e.target.value)}>
                    {selectedDept === "All"
                      ? Object.entries(DEPARTMENTS).map(([dept, roles]) =>
                          <optgroup key={dept} label={dept}>
                            {Object.keys(roles).map((r) => <option key={r} value={r}>{r}</option>)}
                          </optgroup>
                        )
                      : Object.keys(DEPARTMENTS[selectedDept]).map((r) => <option key={r} value={r}>{r}</option>)
                    }
                  </Select>
                </Field>
                <Field label="Basic Day Rate (£)" hint="Editable — default is APA max for role">
                  <Input type="number" step="0.01" value={form.bdr} onChange={(e) => { const bdr = Number(e.target.value); setForm({ ...form, bdr, otCoef: autoOtCoef(bdr) }); }} />
                </Field>
                <Field label="OT Coefficient" hint="Grade I=1.5× · II=1.25× · III=1.0×">
                  <Select value={form.otCoef} onChange={(e) => setForm({ ...form, otCoef: Number(e.target.value) })}>
                    <option value={1.5}>Grade I — 1.5×</option>
                    <option value={1.25}>Grade II — 1.25×</option>
                    <option value={1}>Grade III — 1.0×</option>
                  </Select>
                </Field>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">VAT Registered</span>
                  <Toggle value={form.vatRegistered} onChange={(v) => setForm({ ...form, vatRegistered: v })} ariaLabel="VAT registered" />
                </div>
                {form.vatRegistered && (
                  <Field label="VAT Rate (%)" hint="Usually 20%">
                    <Input type="number" min="0" max="100" step="1" inputMode="numeric" value={form.vatRate ?? 20} onChange={(e) => setForm({ ...form, vatRate: Number(e.target.value) })} />
                  </Field>
                )}
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Kit Money</span>
                  <Toggle value={form.kitMoneyEnabled} onChange={(v) => setForm({ ...form, kitMoneyEnabled: v })} ariaLabel="Kit money" />
                </div>
                {form.kitMoneyEnabled && (
                  <Field label="Kit Money Amount (£)" hint="Added to each working day">
                    <Input type="number" min="0" step="0.01" value={form.kitMoneyAmount ?? 0} onChange={(e) => setForm({ ...form, kitMoneyAmount: Number(e.target.value) })} />
                  </Field>
                )}
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Driver</div>
                    <div className="text-[10px] text-neutral-500 mt-0.5">Shows pre-call time on day entries</div>
                  </div>
                  <Toggle value={form.isDriver} onChange={(v) => setForm({ ...form, isDriver: v })} ariaLabel="Driver" />

            {/* ── Fixed footer ── */}
            <div className="flex-shrink-0 border-t border-neutral-700 px-5 pt-3 flex gap-2" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>

              <Btn onClick={onCancel} variant="ghost"><IX/>Cancel</Btn>

    /* ═══════════════════════════ CANCELLATION CALC MODAL ═══════════════════════════ */

    const CANCEL_DAY_TYPES = ["Shoot", "Recce", "Pre-light", "Build", "Strike"];

    function cancellationPercent(noticeDate, shootDate) {
      if (!noticeDate || !shootDate) return 0;
      const a = new Date(noticeDate + "T12:00:00");
      const b = new Date(shootDate + "T12:00:00");
      const days = Math.round((b - a) / 86400000);
      if (days < 0) return 0;
      if (days <= 1) return 1;
      if (days <= 3) return 0.75;
      if (days <= 6) return 0.5;
      return 0;
    }

    function CancellationCalcModal({ production, setProduction, crew, setCrew, onClose, userPrefs }) {
      useEffect(() => {
        lockBodyScroll();
        return () => { unlockBodyScroll(); };
      }, []);
      useEscape(onClose);

      // Standalone crew-entry state (used when setCrew is provided)
      const [newName, setNewName] = useState("");
      const [newBDR, setNewBDR] = useState("");
      const [unlockedRowIds, setUnlockedRowIds] = useState(new Set());
      const [showAddPerson, setShowAddPerson] = useState(false);

      const data = production.cancellationData;

      const defaultColumns = useMemo(() => {
        const start = production.startDate || todayISO();
        return Array.from({ length: 7 }, (_, i) => {
          const d = new Date(start + "T12:00:00");
          d.setDate(d.getDate() + i);
          return { id: `default-${i}`, date: d.toISOString().slice(0, 10), dayType: "Shoot" };
        });
      }, [production.startDate]);

      const noticeDate = data?.noticeDate || "";
      const columns = data ? (data.columns || []) : defaultColumns;
      const agreedFees = data?.agreedFees || {};

      const commit = (patch) => setProduction(p => {
        const current = p.cancellationData || { noticeDate: "", columns: defaultColumns, agreedFees: {} };
        return { ...p, cancellationData: { ...current, ...patch } };
      });

      const setNotice = (d) => commit({ noticeDate: d });
      const setColumns = (cols) => commit({ columns: cols });
      const setAgreedFee = (crewId, columnId, value) => {
        const next = { ...agreedFees, [crewId]: { ...(agreedFees[crewId] || {}), [columnId]: value } };
        commit({ agreedFees: next });
      };

      const updateColumn = (id, patch) => setColumns(columns.map(c => c.id === id ? { ...c, ...patch } : c));
      const removeColumn = (id) => setColumns(columns.filter(c => c.id !== id));
      const addColumn = () => {
        const last = columns[columns.length - 1];
        let nextDate;
        if (last) {
          const d = new Date(last.date + "T12:00:00"); d.setDate(d.getDate() + 1);
          nextDate = d.toISOString().slice(0, 10);
        } else {
          nextDate = production.startDate || todayISO();
        }
        setColumns([...columns, { id: uid(), date: nextDate, dayType: "Shoot" }]);
      };

      const getAgreedFee = (member, col) => {
        const stored = agreedFees[member.id]?.[col.id];
        return stored !== undefined && stored !== "" ? Number(stored) || 0 : Number(member.bdr) || 0;
      };

      const crewCalcs = useMemo(() => crew.map(member => {
        const dayInfo = columns.map(col => ({
          col,
          agreedFee: getAgreedFee(member, col),
          pct: cancellationPercent(noticeDate, col.date),
        }));
        const planned = dayInfo.filter(d => d.agreedFee > 0);
        const isBlock = planned.length > 0 && planned.length <= 3;
        let cells;
        if (isBlock && noticeDate) {
          const earliest = [...planned].sort((a, b) => a.col.date.localeCompare(b.col.date))[0];
          const blockPct = cancellationPercent(noticeDate, earliest.col.date);
          cells = dayInfo.map(d => d.agreedFee > 0 ? d.agreedFee * blockPct : 0);
        } else {
          cells = dayInfo.map(d => d.agreedFee * d.pct);
        }
        return { member, dayInfo, cells, isBlock };
      }), [crew, columns, agreedFees, noticeDate]);

      const colTotals = columns.map((_, i) => crewCalcs.reduce((s, c) => s + (c.cells[i] || 0), 0));
      const grandTotal = colTotals.reduce((s, n) => s + n, 0);
      const rowTotals = crewCalcs.map(c => c.cells.reduce((s, n) => s + n, 0));

      const [copied, setCopied] = useState(false);
      const copyBreakdown = async () => {
        const lines = [];
        lines.push(production.title || "Production");
        lines.push(`Cancellation notice: ${noticeDate ? fmtDateShort(noticeDate) : "—"}`);
        crewCalcs.forEach(({ member, dayInfo, cells, isBlock }, ci) => {
          lines.push("");
          lines.push(`${member.name} — ${member.role}${isBlock ? " (block)" : ""}`);
          dayInfo.forEach((d, i) => {
            if (d.agreedFee <= 0) return;
            const pctUsed = isBlock
              ? cancellationPercent(noticeDate, [...dayInfo].filter(x => x.agreedFee > 0).sort((a, b) => a.col.date.localeCompare(b.col.date))[0].col.date)
              : d.pct;
            lines.push(`  ${fmtDateShort(d.col.date)} · ${d.col.dayType} · ${Math.round(pctUsed * 100)}% · ${fmtGBP(cells[i])}`);
          });
          lines.push(`  Individual total: ${fmtGBP(rowTotals[ci])}`);
        });
        lines.push("");
        lines.push(`Grand total: ${fmtGBP(grandTotal)}`);
        lines.push("");
        lines.push("—");
        lines.push("Generated with TimeMachine · timemachineapp.co.uk");
        await shareTextOrCopy(lines.join("\n"), production.title || "Cancellation fees");
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
          style={{ backgroundColor: "rgba(0,0,0,0.78)" }}
          onClick={onClose}
        >
          <div
            className="bg-neutral-900 w-full rounded-xl shadow-2xl border border-neutral-700 flex flex-col"
            style={{ maxWidth: 1200, maxHeight: "calc(100dvh - env(safe-area-inset-top) - 1rem)" }}
            onClick={e => e.stopPropagation()}
          >
            {/* ── Fixed header ── */}
            <div className="flex-shrink-0 px-5 pb-3 border-b border-neutral-700 flex items-start justify-between gap-3" style={{ paddingTop: 'calc(env(safe-area-inset-top) + 1rem)' }}>
              <div>
                <div className="text-[10px] uppercase tracking-[0.2em] text-sky-400 font-bold mb-1">Cancellation Fees</div>
                <div className="text-[11px] text-neutral-500">APA §7 — fees calculated relative to notice date</div>
              </div>
              <button onClick={onClose} className="text-neutral-500 hover:text-neutral-200 transition-colors flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} aria-label="Close"><IX size={16}/></button>
            </div>

            {/* ── Scrollable body ── */}
            <div className="flex-1 overflow-auto px-5 py-4 min-h-0">
              <div className="mb-4 max-w-xs">
                <Field label="Notice given on">
                  <Input type="date" value={noticeDate} onChange={(e) => setNotice(e.target.value)} />
                </Field>
              </div>

              {crew.length === 0 && !setCrew ? (
                <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-xl">
                  Add crew first to calculate cancellation fees.
                </div>
              ) : crew.length === 0 && setCrew ? (
                <div className="bg-neutral-900 border border-dashed border-neutral-700 p-6 text-center text-sm text-neutral-500 rounded-xl">
                  Add a crew member below to begin.
                </div>
              ) : (
                <div className="overflow-x-auto border border-neutral-800 rounded-xl">
                  <table className="border-collapse text-[11px] w-full">
                    <thead>
                      <tr>
                        <th className="text-left px-3 py-2 text-[10px] uppercase tracking-wider text-neutral-500 font-bold border-r border-b border-neutral-700 bg-neutral-950 whitespace-nowrap" style={{ minWidth: 160 }}>Crew</th>
                        {setCrew && <th className="px-3 py-2 text-[10px] uppercase tracking-wider text-neutral-500 font-bold border-r border-b border-neutral-700 bg-neutral-950 whitespace-nowrap" style={{ minWidth: 140 }}>Day rate</th>}
                        {columns.map((col, i) => (
                          <th key={col.id} className="px-2 py-1.5 border-r border-b border-neutral-700 bg-neutral-950 align-top" style={{ minWidth: 130 }}>
                            <div className="flex items-center justify-between mb-1">
                              <span className="text-[9px] text-neutral-500 uppercase tracking-wider font-bold">Day {i+1}</span>
                              <button onClick={() => removeColumn(col.id)} className="text-neutral-700 hover:text-red-400 text-[11px] flex items-center justify-center" style={{ minWidth: 44, minHeight: 44 }} title="Remove column" aria-label="Remove column">✕</button>
                            </div>
                            <Input type="date" value={col.date} onChange={(e) => updateColumn(col.id, { date: e.target.value })} className="text-[10px] px-1.5 py-1 mb-1" />
                            <Select value={col.dayType} onChange={(e) => updateColumn(col.id, { dayType: e.target.value })} className="text-[10px] px-1.5 py-1">
                              {CANCEL_DAY_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                            </Select>
                          </th>
                        ))}
                        <th className="px-3 py-2 border-r border-b border-l border-neutral-700 bg-neutral-950 text-right text-[10px] uppercase tracking-wider text-neutral-500 font-bold whitespace-nowrap">Total</th>
                        <th className="px-2 py-1.5 border-b border-neutral-700 bg-neutral-950 align-middle">
                          <button onClick={addColumn} className="px-2 py-1 text-[10px] uppercase tracking-wider text-sky-400 hover:text-sky-300 font-bold whitespace-nowrap" title="Add a day column" aria-label="Add a day column">+ Day</button>
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      {crewCalcs.map(({ member, dayInfo, cells, isBlock }, ci) => (
                        <tr key={member.id} className="border-b border-neutral-800">
                          <td className="px-3 py-2 border-r border-neutral-700 bg-neutral-950 whitespace-nowrap align-top">
                            <div className="flex items-start justify-between gap-1">
                              <div>
                                <div className="text-[11px] font-semibold text-neutral-200">
                                  {member.name}
                                  {member.isDefaultUser && <span className="text-[9px] text-neutral-500 font-normal ml-1">(you)</span>}
                                </div>
                                <div className="text-[9px] text-neutral-500 uppercase tracking-wider">{member.role}{isBlock ? " · Block" : ""}</div>
                              </div>
                              {setCrew && !member.isDefaultUser && (
                                <button onClick={() => setCrew(prev => prev.filter(c => c.id !== member.id))}
                                  className="text-neutral-700 hover:text-red-400 text-[11px] flex items-center justify-center flex-shrink-0"
                                  style={{ minWidth: 44, minHeight: 44 }}
                                  title="Remove" aria-label="Remove crew member">✕</button>
                              )}
                            </div>
                          </td>
                          {setCrew && (
                            <td className="px-3 py-2 border-r border-neutral-700 bg-neutral-950 align-middle">
                              {member.isDefaultUser ? (
                                unlockedRowIds.has(member.id) ? (
                                  <div className="flex items-center gap-1.5">
                                    <Input
                                      type="number" min="0" step="0.01"
                                      value={member.bdr}
                                      onChange={(e) => setCrew(prev => prev.map(c => c.id === member.id ? { ...c, bdr: Number(e.target.value) || 0 } : c))}
                                      className="text-[10px] px-1.5 py-1 w-20"
                                    />
                                    <Btn variant="ghost" size="sm"
                                      onClick={() => {
                                        setCrew(prev => prev.map(c => c.id === member.id ? { ...c, bdr: Number(userPrefs?.defaultBDR) || 0 } : c));
                                        setUnlockedRowIds(s => { const n = new Set(s); n.delete(member.id); return n; });
                                      }}
                                    >Reset</Btn>
                                  </div>
                                ) : (
                                  <div className="flex items-center gap-1.5">
                                    <span className="text-[11px] font-mono text-neutral-200 whitespace-nowrap">{fmtGBP(member.bdr)}</span>
                                    <Btn variant="ghost" size="sm"
                                      onClick={() => setUnlockedRowIds(s => new Set(s).add(member.id))}
                                    >Custom</Btn>
                                  </div>
                                )
                              ) : (
                                <Input
                                  type="number" min="0" step="0.01"
                                  value={member.bdr}
                                  onChange={(e) => setCrew(prev => prev.map(c => c.id === member.id ? { ...c, bdr: Number(e.target.value) || 0 } : c))}
                                  className="text-[10px] px-1.5 py-1"
                                />
                              )}
                            </td>
                          )}
                          {dayInfo.map((d, i) => (
                            <td key={d.col.id} className="px-2 py-1.5 border-r border-neutral-700 bg-neutral-900 align-top">
                              <Input
                                type="number"
                                min="0"
                                step="0.01"
                                value={d.agreedFee}
                                onChange={(e) => setAgreedFee(member.id, d.col.id, e.target.value)}
                                className="text-[10px] px-1.5 py-1"
                              />
                              {cells[i] > 0 && (
                                <div className="text-[10px] text-amber-400 font-mono mt-1">{fmtGBP(cells[i])}</div>
                              )}
                            </td>
                          ))}
                          <td className="px-3 py-2 border-r border-l border-neutral-700 bg-neutral-950 text-right align-middle whitespace-nowrap">
                            <span className="text-[11px] font-mono text-amber-400 font-bold">{fmtGBP(rowTotals[ci])}</span>
                          </td>
                          <td className="bg-neutral-950" />
                        </tr>
                      ))}
                      <tr className="border-t-2 border-neutral-700 bg-neutral-950">
                        <td className="px-3 py-2 text-[10px] uppercase tracking-wider text-neutral-400 font-bold border-r border-neutral-700">Total</td>
                        {setCrew && <td className="border-r border-neutral-700 bg-neutral-950" />}
                        {colTotals.map((t, i) => (
                          <td key={i} className="px-2 py-2 text-right text-[11px] font-mono text-neutral-200 border-r border-neutral-700 font-bold">{t > 0 ? fmtGBP(t) : "—"}</td>
                        ))}
                        <td className="px-3 py-2 text-right text-[12px] font-mono text-amber-400 font-bold whitespace-nowrap border-l border-neutral-700">{fmtGBP(grandTotal)}</td>
                        <td className="bg-neutral-950" />
                      </tr>
                    </tbody>
                  </table>
                </div>
              )}

              {setCrew && (
                <div className="mt-3">
                  {(showAddPerson || crew.length === 0) ? (
                    <div className="flex items-end gap-2 flex-wrap">
                      <div className="flex-1 min-w-[140px]">
                        <Field label="Name">
                          <Input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Crew member name" />
                        </Field>
                      </div>
                      <div style={{ width: 110 }}>
                        <Field label="Day rate (£)">
                          <Input type="number" min="0" step="0.01" value={newBDR} onChange={e => setNewBDR(e.target.value)} placeholder="0.00" />
                        </Field>
                      </div>
                      <Btn variant="primary" size="sm"
                        onClick={() => {
                          const name = newName.trim();
                          if (!name) return;
                          setCrew(prev => [...prev, { id: uid(), name, role: Object.keys(ROLE_DEFAULTS)[0], bdr: Number(newBDR) || 0 }]);
                          setNewName(""); setNewBDR("");
                          setShowAddPerson(false);
                        }}
                        disabled={!newName.trim()}
                      ><IPlus size={14}/>Add</Btn>
                      {crew.length > 0 && (
                        <Btn variant="ghost" size="sm" onClick={() => { setShowAddPerson(false); setNewName(""); setNewBDR(""); }}>Cancel</Btn>
                      )}
                    </div>
                  ) : (
                    <Btn variant="ghost" size="sm" onClick={() => setShowAddPerson(true)}><IPlus size={14}/>Add person</Btn>
                  )}
                </div>
              )}

              <div className="mt-4 text-[10px] text-neutral-500 leading-relaxed">
                APA §7: 7+ days = 0% · 6–4 days = 50% · 3–2 days = 75% · 1 day or less = 100%. Days counted include the notice date and exclude the shoot date. Crew members with 3 or fewer planned days are calculated as a single block at the earliest day's percentage.
              </div>
            </div>

            {/* ── Fixed footer ── */}
            <div className="flex-shrink-0 border-t border-neutral-700 px-5 pt-3 flex justify-end gap-2" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 12px)' }}>
              <Btn onClick={copyBreakdown} variant="ghost">{copied ? "Copied!" : "Copy breakdown"}</Btn>
              <Btn onClick={onClose} variant="ghost"><IX/>Close</Btn>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════ MILEAGE INPUT ════════════════════════════ */

    function MileageInput({ day, updateDay, days }) {
      const method = day.mileageMethod || 'manual';

      const onMilesBlur = (e) => {
        const raw = parseFloat(e.target.value);
        if (Number.isFinite(raw) && raw > 0) {
          const rounded = Math.ceil(raw);
          if (rounded !== raw) updateDay({ miles: rounded });
        }
      };

      const previousDay = React.useMemo(() => {
        if (!days || !day.date) return null;
        const relevant = days.filter(d =>
          d.date && d.date < day.date &&
          (d.crewId === day.crewId || (!d.crewId && !day.crewId))
        );
        if (relevant.length === 0) return null;
        return [...relevant].sort((a, b) => a.date.localeCompare(b.date)).slice(-1)[0];
      }, [days, day.date, day.crewId]);

      const hasPrevMileage = previousDay && (previousDay.miles > 0 || previousDay.mileagePostcode);

      const copyPrevMileage = () => {
        if (!previousDay) return;
        updateDay({
          miles: previousDay.miles || 0,
          mileageMethod: previousDay.mileageMethod || 'manual',
          mileagePostcode: previousDay.mileagePostcode || '',
          mileageRoundTrip: previousDay.mileageRoundTrip !== false,
        });
      };

      return (
        <Field label="Mileage" hint="£0.50/mi from W1F 9SE">
          {/* Method toggle */}
          <div className="inline-flex rounded-lg bg-neutral-800 p-0.5 mb-3">
            {[{ k: 'manual', label: 'Manual' }, { k: 'postcode', label: 'Postcode' }].map(({ k, label }) => (
              <button key={k} type="button" onClick={() => updateDay({ mileageMethod: k })}
                className={`px-3 py-1 rounded-md text-[11px] uppercase tracking-wide font-bold transition-colors ${
                  method === k ? 'bg-sky-400 text-black' : 'text-neutral-400 hover:text-neutral-200'
                }`}
                style={{ WebkitTapHighlightColor: 'transparent' }}>
                {label}
              </button>
            ))}
          </div>

          {method === 'manual' ? (
            <div>
              <Input type="number" min="0" step="1" inputMode="numeric"
                value={day.miles || ''}
                onChange={(e) => updateDay({ miles: e.target.value ? Number(e.target.value) : 0 })}
                onBlur={onMilesBlur} />
              <div className="text-[10px] text-neutral-500 mt-1">Rounds up to next whole mile.</div>
            </div>
          ) : (
            <div className="space-y-2">
              <Input type="text" placeholder="e.g. NW1 8AB"
                value={day.mileagePostcode || ''}
                onChange={(e) => {
                  const postcode = e.target.value;
                  const result = lookupPostcodeMiles(postcode, day.mileageRoundTrip !== false);
                  updateDay({ mileagePostcode: postcode, miles: result ? result.miles : 0 });
                }} />
              <label className="flex items-center gap-2 cursor-pointer">
                <input type="checkbox"
                  checked={day.mileageRoundTrip !== false}
                  onChange={(e) => {
                    const rt = e.target.checked;
                    const result = lookupPostcodeMiles(day.mileagePostcode, rt);
                    updateDay({ mileageRoundTrip: rt, miles: result ? result.miles : (day.miles || 0) });
                  }}
                  className="accent-sky-400" />
                <span className="text-sm text-neutral-300">Round trip</span>
              </label>
              {(() => {
                const result = lookupPostcodeMiles(day.mileagePostcode, day.mileageRoundTrip !== false);
                if (!day.mileagePostcode) return null;
                if (!result) return (
                  <div className="text-xs text-amber-400 mt-1">
                    Couldn't find that postcode — try the first part only, like NW1.
                  </div>
                );
                return (
                  <div className="space-y-0.5 mt-1">
                    <div className="text-sm text-sky-300">→ {result.miles} mile{result.miles === 1 ? '' : 's'}</div>
                    <div className="text-[10px] text-neutral-500">Approximate — adjust manually if your route differs.</div>
                    {result.insideM25 && (
                      <div className="text-xs text-amber-400">
                        ⚠ {result.outcode} is inside the M25 — APA mileage typically not paid for inside-M25 shoots. You can keep the value if your job pays anyway.
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>
          )}

          {hasPrevMileage && (
            <button type="button" onClick={copyPrevMileage}
              className="mt-3 inline-flex items-center gap-1.5 text-xs text-sky-400 hover:text-sky-300 transition-colors"
              style={{ WebkitTapHighlightColor: 'transparent' }}>
              <IReset size={12}/>Same as previous day
            </button>
          )}
        </Field>
      );
    }

    /* ═══════════════════════════ DAY ENTRY FORM ═══════════════════════════ */

    function DayEntryForm({ value, onChange, crew, allCrewMode, fixedCrewId = null, fixedDate = null, isToday = false, showToast, days = [] }) {
      const v = value;
      const set = (patch) => onChange({ ...v, ...patch });
      const bs = deriveBreakState(v);
      const [showTravelInfo, setShowTravelInfo] = useState(false);
      const [showPreCallInfo, setShowPreCallInfo] = useState(false);

      const computeNowHHMM = () => {
        const now = new Date();
        const totalMins = now.getHours() * 60 + now.getMinutes();
        const rounded = Math.round(totalMins / 5) * 5;
        const h = Math.floor(rounded / 60) % 24;
        const m = rounded % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      };

      const onDayTypeChange = (dayType) => {
        const callH = parseHHMM(v.callTime);
        const patch = { dayType };
        if (callH !== null) patch.wrapTime = toHHMM(callH + DEFAULT_HOURS[dayType]);
        set(patch);
      };
      const onCallChange = (callTime) => {
        const callH = parseHHMM(callTime);
        const patch = { callTime };
        if (callH !== null) {
          patch.wrapTime = toHHMM(callH + DEFAULT_HOURS[v.dayType]);
          patch.lunchStartTime = toHHMM(callH + 5);
          patch.secondBreakStartTime = toHHMM(callH + 11);
        }
        set(patch);
      };

      const callH = parseHHMM(v.callTime);
      const wrapH = parseHHMM(v.wrapTime);
      const autoNextDay = callH !== null && wrapH !== null && wrapH <= callH;
      const dow = dayOfWeek(v.date);
      const dayLabel = v.date ? weekday(v.date) : "";
      const isWeekend = dow === 0 || dow === 6;
      const bhName = getBankHolidayName(v.date);
      const isBH = !!bhName;
      const isTravelDay = v.dayType === "Travel Day";
      const activeCrew = fixedCrewId ? crew.find(c => c.id === fixedCrewId) : crew.find(c => c.id === v.crewId);
      // Step-up role wins over base role for both BWD-override and PMPA classification.
      const effectiveRole = (v.stepUpEnabled && v.stepUpRole) ? v.stepUpRole : (activeCrew?.role || "");
      const isPmpa = ROLE_DEFAULTS[effectiveRole]?.pmpa === true;
      const role = effectiveRole;
      const bwdOverrideApplies = !isPmpa && ROLES_WITH_BWD_OVERRIDE.includes(role) &&
        ["Pre-light", ...DISCRETIONARY_LUNCH_DAY_TYPES].includes(v.dayType);

      const show2ndBreakSection = !isPmpa && !isTravelDay && bs && !bs.continuousDay && bs.secondBreakRequired;

      return (
        <div className="space-y-4">

          {/* ── Section: Day ── */}
          <SectionCard title="Day">
            <div className="space-y-3">
              {!fixedCrewId && !allCrewMode && (
                <Field label="Crew Member">
                  <Select value={v.crewId} onChange={(e) => set({ crewId: e.target.value })}>
                    <option value="">— Select —</option>
                    {crew.map((c) => <option key={c.id} value={c.id}>{c.name} ({c.role})</option>)}
                  </Select>
                </Field>
              )}
              {!fixedCrewId && allCrewMode && (
                <div className="bg-sky-950/30 border border-sky-800 p-2 rounded-xl">
                  <div className="text-[10px] uppercase tracking-[0.15em] text-sky-400 font-bold">All Crew Mode</div>
                  <div className="text-xs text-neutral-300">Creates a day for each of {crew.length} crew members. Travel & mileage apply to all.</div>
                </div>
              )}
              <div className="grid grid-cols-2 gap-3">
                {!fixedDate && (
                  <Field label="Date" hint={v.date ? `${dayLabel}${isWeekend ? " — weekend rate applies" : ""}${isBH ? " — bank holiday rate applies" : ""}` : ""}>
                    <Input type="date" value={v.date} onChange={(e) => set({ date: e.target.value })} />
                  </Field>
                )}
                <Field label="Day Type">
                  <Select value={v.dayType} onChange={(e) => onDayTypeChange(e.target.value)}>{DAY_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}</Select>
                </Field>
              </div>
              {bwdOverrideApplies && (
                <StatusMsg kind="info">
                  APA §2.3: {role} always works to Basic Working Day rules, even on non-shoot days. This {v.dayType} is calculated as a Shoot Day (10+1, OT after 11h).
                </StatusMsg>
              )}
              {isPmpa && (
                <StatusMsg kind="info">
                  APA Appendix 1 §(a): {role}s use a simpler framework — flat BDR plus OT for hours beyond BWD on shoot days only. No break penalties, no travel time, no triple time.
                </StatusMsg>
              )}
              {isBH && (
                <StatusMsg kind="info">
                  Bank Holiday — {bhName}. APA §2.4: paid as Sunday rate (2× BDR for shoot day, 2× BHR all hours).
                </StatusMsg>
              )}
            </div>
          </SectionCard>

          {/* ── Section: Times ── */}
          <SectionCard title="Times">
            <div className="space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <Field label="Call Time" hint={callH !== null && callH < 5 ? "→ Night shoot (pre-5am)" : callH !== null && callH >= 17 ? "→ Night shoot (post-5pm)" : callH !== null && callH >= 5 && callH < 7 && !isTravelDay ? "→ Early call" : callH !== null && callH >= 11 && callH < 17 && !isTravelDay ? "→ Late call (calc from 11:00)" : ""}>
                  <div className="flex items-center gap-1.5">
                    <div className="flex-1 min-w-0"><TimeInput value={v.callTime} onChange={(e) => onCallChange(e.target.value)} /></div>
                    {isToday && <NowBtn tone="sky" onClick={() => { const t = computeNowHHMM(); onCallChange(t); showToast?.(`Call ${t}`); }} />}
                  </div>
                </Field>
                <Field label="Wrap Time" hint={autoNextDay ? "Wrap is next day (auto-detected)" : ""}>
                  <div className="flex items-center gap-1.5">
                    <div className="flex-1 min-w-0"><TimeInput value={v.wrapTime} onChange={(e) => set({ wrapTime: e.target.value })} /></div>
                    {isToday && <NowBtn tone="orange" onClick={() => { const t = computeNowHHMM(); set({ wrapTime: t }); showToast?.(`Wrap ${t}`); }} />}
                  </div>
                </Field>
              </div>
            </div>
          </SectionCard>

          {/* ── Section: Lunch (1st Break) ── */}
          {!isPmpa && !isTravelDay && (
            <SectionCard title="Lunch (1st Break)">
              <div className="space-y-3">
                {DISCRETIONARY_LUNCH_DAY_TYPES.includes(v.dayType) ? (
                  <Field label="Lunch Duration">
                    <Select value={Number(v.lunchDurationMins ?? 60)} onChange={(e) => set({ lunchDurationMins: Number(e.target.value) })}>
                      {LUNCH_DURATIONS.map((s) => <option key={s.v} value={s.v}>{s.label}</option>)}
                    </Select>
                  </Field>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    <Field label="Lunch Start Time" hint={bs ? `Deadline: ${toHHMM(bs.lateThreshold)} · CWD threshold: ${toHHMM(bs.cwdThreshold)}` : ""}>
                      <div className="flex items-center gap-1.5">
                        <div className="flex-1 min-w-0"><TimeInput value={v.lunchStartTime || ""} onChange={(e) => set({ lunchStartTime: e.target.value })} disabled={Number(v.lunchDurationMins) === 0} /></div>
                        {isToday && Number(v.lunchDurationMins) !== 0 && <NowBtn tone="sky" onClick={() => { const t = computeNowHHMM(); set({ lunchStartTime: t }); showToast?.(`Lunch ${t}`); }} />}
                      </div>
                    </Field>
                    <Field label="Lunch Duration">
                      <Select value={Number(v.lunchDurationMins ?? 60)} onChange={(e) => set({ lunchDurationMins: Number(e.target.value) })}>
                        {LUNCH_DURATIONS.map((s) => <option key={s.v} value={s.v}>{s.label}</option>)}
                      </Select>
                    </Field>
                  </div>
                )}

                {bs && (
                  <>
                    {bs.lunchMissed && bs.cwdApplies && <StatusMsg kind="bad">Lunch missed — Continuous Working Day. OT now starts at {toHHMM(bs.callH + 9)} (9h after call) instead of 11h.</StatusMsg>}
                    {bs.lunchMissed && !bs.cwdApplies && <StatusMsg kind="info">APA §2.3 — no lunch obligation on {v.dayType} days. Paid as 8h × BHR.</StatusMsg>}
                    {bs.lunchVeryLate && bs.cwdApplies && <StatusMsg kind="bad">Lunch started after {toHHMM(bs.cwdThreshold)} (6.5h from call) — CWD triggered. OT now starts at {toHHMM(bs.callH + 9)}.</StatusMsg>}
                    {bs.lunchLate && <StatusMsg kind="warn">Late — should have started by {toHHMM(bs.lateThreshold)} (5.5h from call). £10 penalty applied.</StatusMsg>}
                    {!bs.lunchMissed && !bs.lunchLate && !bs.lunchVeryLate && bs.lunchDuration < 60 && bs.cwdApplies && <StatusMsg kind="warn">Curtailed by {60 - bs.lunchDuration}m. Ends {toHHMM(bs.lunchEndAbs)}. OT starts {60 - bs.lunchDuration}m earlier.</StatusMsg>}
                    {!bs.lunchMissed && !bs.lunchLate && !bs.lunchVeryLate && bs.lunchDuration < 60 && !bs.cwdApplies && <StatusMsg kind="info">Partial lunch ({bs.lunchDuration}m). Counts toward basic: {(8 + bs.lunchDuration / 60).toFixed(1)}h × BHR.</StatusMsg>}
                    {!bs.lunchMissed && !bs.lunchLate && !bs.lunchVeryLate && bs.lunchDuration === 60 && bs.lunchEndAbs && bs.cwdApplies && <StatusMsg kind="ok">On time. Lunch ends {toHHMM(bs.lunchEndAbs)}.</StatusMsg>}
                    {!bs.lunchMissed && !bs.lunchLate && !bs.lunchVeryLate && bs.lunchDuration === 60 && bs.lunchEndAbs && !bs.cwdApplies && <StatusMsg kind="ok">Lunch given (1h). Counts toward basic: 9h × BHR.</StatusMsg>}
                  </>
                )}

                {bs && bs.cwdApplies && (bs.lunchMissed || bs.lunchVeryLate) && (
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <div className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Meal Provided?</div>
                      <div className="text-[10px] text-neutral-500 mt-0.5">£7.50 allowance if no meal given</div>
                    </div>
                    <Toggle value={!v.noMealProvided} onChange={(val) => set({ noMealProvided: !val })} ariaLabel="Meal provided" />
                  </div>
                )}
              </div>
            </SectionCard>
          )}

          {/* ── Section: 2nd Break ── */}
          {show2ndBreakSection && (
            <SectionCard title="2nd Break">
              <div className="space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  <Field label="2nd Break Start" hint={`Deadline: ${toHHMM(bs.sbDeadline)} (5.5h after lunch end)`}>
                    <TimeInput value={v.secondBreakStartTime || ""} onChange={(e) => set({ secondBreakStartTime: e.target.value })} disabled={Number(v.secondBreakDurationMins) === 0} />
                  </Field>
                  <Field label="2nd Break Duration">
                    <Select value={Number(v.secondBreakDurationMins ?? 30)} onChange={(e) => set({ secondBreakDurationMins: Number(e.target.value) })}>
                      {SECOND_BREAK_DURATIONS.map((s) => <option key={s.v} value={s.v}>{s.label}</option>)}
                    </Select>
                  </Field>
                </div>
                {bs.sbState === "missed" && <StatusMsg kind="bad">Missed — 30m × BHR penalty applied.</StatusMsg>}
                {bs.sbState === "late" && <StatusMsg kind="bad">Late (started after {toHHMM(bs.sbDeadline)}). APA: 2nd break can't be delayed — treated as missed. 30m × BHR penalty.</StatusMsg>}
                {bs.sbState === "curtailed" && <StatusMsg kind="warn">Curtailed by {30 - bs.sbDuration}m. {30 - bs.sbDuration}m × BHR penalty.</StatusMsg>}
                {bs.sbState === "given" && <StatusMsg kind="ok">Given on time.</StatusMsg>}
              </div>
            </SectionCard>
          )}

          {/* ── Section: CWD Breaks ── */}
          {!isPmpa && !isTravelDay && bs && bs.continuousDay && (
            <SectionCard title="CWD Breaks" accent="red">
              <div className="space-y-3">
                <div className="text-[11px] text-neutral-400 leading-tight">APA §6.4: CWD requires a 30m break by {toHHMM(bs.cwd1Deadline)} (9h after call){bs.cwd2Required ? `, and another by ${toHHMM(bs.cwd2Deadline)} (12.5h after call)` : ""}. Missed breaks = 30m × BHR penalty.</div>
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Break 1 — by {toHHMM(bs.cwd1Deadline)}</div>
                    <div className="text-[10px] text-neutral-500 mt-0.5">{v.cwdBreak1Given === false ? "Missed — +30m × BHR" : "Given"}</div>
                  </div>
                  <Toggle value={v.cwdBreak1Given !== false} onChange={(val) => set({ cwdBreak1Given: val })} ariaLabel="CWD break 1 given" />
                </div>
                {bs.cwd2Required && (
                  <div className="flex items-center justify-between gap-3">
                    <div>
                      <div className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Break 2 — by {toHHMM(bs.cwd2Deadline)}</div>
                      <div className="text-[10px] text-neutral-500 mt-0.5">{v.cwdBreak2Given === false ? "Missed — +30m × BHR" : "Given"}</div>
                    </div>
                    <Toggle value={v.cwdBreak2Given !== false} onChange={(val) => set({ cwdBreak2Given: val })} ariaLabel="CWD break 2 given" />
                  </div>
                )}
              </div>
            </SectionCard>
          )}

          {/* ── Extras disclosure: mileage, pre-call, travel time, per diem, step-up ── */}
          <Disclosure label="Extras">
            {/* ── Nested: Mileage ── */}
            <Disclosure
              label="Mileage"
              summary={v.miles > 0 ? `${v.miles} mi` : 'Not set'}
              defaultOpen={v.miles > 0 || !!v.mileagePostcode}
            >
              <MileageInput day={v} updateDay={set} days={days} />
            </Disclosure>
            {!isTravelDay && (
              <div className="space-y-3">
                <div className="flex items-center gap-1.5">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Travel Time</span>
                  <button type="button" onClick={() => setShowTravelInfo(s => !s)}
                    className="rounded-full flex items-center justify-center flex-shrink-0"
                    style={{ width: 24, height: 24, background: 'rgba(56,189,248,0.15)', color: '#7dd3fc', WebkitTapHighlightColor: 'transparent' }}
                    aria-label="Travel time calculation info">
                    <IInfo size={12}/>
                  </button>
                </div>
                <div className="text-[10px] text-neutral-500 leading-snug">{TRAVEL_TIME_CAPTION}</div>
                {showTravelInfo && <StatusMsg kind="info"><span className="whitespace-pre-line">{TRAVEL_TIME_EXPLAINER}</span></StatusMsg>}
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Travel Out (mins)"><Input type="number" min="0" inputMode="numeric" value={v.travelOutMins || 0} onChange={(e) => set({ travelOutMins: Number(e.target.value) })} /></Field>
                  <Field label="Travel Back (mins)"><Input type="number" min="0" inputMode="numeric" value={v.travelBackMins || 0} onChange={(e) => set({ travelBackMins: Number(e.target.value) })} /></Field>
                </div>
              </div>
            )}
            {!isTravelDay && (
              <div className="space-y-3">
                <div className="flex items-center gap-1.5">
                  <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Pre-call</span>
                  <button type="button" onClick={() => setShowPreCallInfo(s => !s)}
                    className="rounded-full flex items-center justify-center flex-shrink-0"
                    style={{ width: 24, height: 24, background: 'rgba(56,189,248,0.15)', color: '#7dd3fc', WebkitTapHighlightColor: 'transparent' }}
                    aria-label="Pre-call info">
                    <IInfo size={12}/>
                  </button>
                </div>
                {showPreCallInfo && <StatusMsg kind="info"><span className="whitespace-pre-line">{PRE_CALL_EXPLAINER}</span></StatusMsg>}
                <Field label="Pre-call time" hint="Early arrival — paid at BHR. Lunch and CWD still measured from main call time.">
                  <TimeInput value={v.preCallTime || v.truckCallTime || ''} onChange={(e) => set({ preCallTime: e.target.value })} />
                </Field>
              </div>
            )}
            <div className="space-y-3">
              <div className="flex items-center justify-between gap-3">
                <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Per Diem</span>
                <Toggle value={!!v.perDiemEnabled} onChange={(val) => set({ perDiemEnabled: val })} ariaLabel="Per diem" />
              </div>
              {v.perDiemEnabled && (
                <Field label="Per Diem Amount (£)" hint="Added to day total">
                  <Input type="number" min="0" step="0.01" value={v.perDiemAmount ?? 0} onChange={(e) => set({ perDiemAmount: Number(e.target.value) })} />
                </Field>
              )}
            </div>
            <div className="space-y-3">
              <div className="flex items-center justify-between gap-3">
                <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Kit Money</span>
                <Toggle value={!!v.kitMoneyEnabled} onChange={(val) => set({ kitMoneyEnabled: val })} ariaLabel="Kit money" />
              </div>
              {v.kitMoneyEnabled && (
                <Field label="Kit Money Amount (£)" hint="Added to day total">
                  <Input type="number" min="0" step="0.01" value={v.kitMoneyAmount ?? 0} onChange={(e) => set({ kitMoneyAmount: Number(e.target.value) })} />
                </Field>
              )}
            </div>
            <div className="space-y-3">
              <div className="flex items-center justify-between gap-3">
                <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Expenses</span>
                <button
                  type="button"
                  onClick={() => set({ expenses: [...(v.expenses || []), { id: uid(), amount: 0, category: "Other", description: "" }] })}
                  className="text-[10px] uppercase tracking-wide text-sky-400 hover:text-sky-300 font-bold flex items-center gap-1"
                ><IPlus size={11}/>Add expense</button>
              </div>
              {(v.expenses || []).length > 0 && (
                <div className="space-y-2">
                  {(v.expenses || []).map((exp) => (
                    <div key={exp.id} className="flex flex-wrap items-center gap-2">
                      <Select
                        value={exp.category}
                        onChange={(e) => set({ expenses: v.expenses.map(x => x.id === exp.id ? { ...x, category: e.target.value } : x) })}
                        className="flex-shrink-0" style={{ width: 116 }}
                      >
                        {EXPENSE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                      </Select>
                      <Input
                        type="number" min="0" step="0.01"
                        value={exp.amount}
                        onChange={(e) => set({ expenses: v.expenses.map(x => x.id === exp.id ? { ...x, amount: Number(e.target.value) || 0 } : x) })}

                      />
                      <Input
                        type="text"
                        value={exp.description}
                        onChange={(e) => set({ expenses: v.expenses.map(x => x.id === exp.id ? { ...x, description: e.target.value } : x) })}
                        placeholder="Description" className="flex-1 min-w-[80px]"
                      />
                      <button
                        type="button"
                        onClick={() => set({ expenses: v.expenses.filter(x => x.id !== exp.id) })}
                        className="text-neutral-600 hover:text-red-400 transition-colors flex-shrink-0 p-1"
                        aria-label="Remove expense"
                      ><IX size={14}/></button>
                    </div>

              )}

            <div className="space-y-3">
              <div className="flex items-center justify-between gap-3">
                <span className="text-[10px] uppercase tracking-wide text-sky-400 font-bold">Step-Up for this day</span>
                <Toggle value={!!v.stepUpEnabled} onChange={(val) => set({ stepUpEnabled: val })} ariaLabel="Step-up" />
              </div>
              {v.stepUpEnabled && (
                <>
                  <Field label="Step-Up Role">
                    <Select value={v.stepUpRole || ""} onChange={(e) => {
                      const role = e.target.value;
                      const d = ROLE_DEFAULTS[role] || {};
                      set({ stepUpRole: role, stepUpBDR: d.bdr ?? v.stepUpBDR, stepUpOTCoef: d.otCoef ?? v.stepUpOTCoef, stepUpOTRate: d.otRate ?? null });
                    }}>
                      <option value="">— Select Role —</option>
                      {Object.entries(DEPARTMENTS).map(([dept, roles]) => <optgroup key={dept} label={dept}>{Object.keys(roles).map((r) => <option key={r} value={r}>{r}</option>)}</optgroup>)}

                  </Field>
                  <div className="grid grid-cols-2 gap-3">
                    <Field label="Step-Up BDR (£)" hint="Override for this day only">
                      <Input type="number" min="0" step="0.01" value={v.stepUpBDR ?? 0} onChange={(e) => set({ stepUpBDR: Number(e.target.value) })} />
                    </Field>
                    <Field label="Step-Up OT Coef">
                      <Select value={String(v.stepUpOTCoef ?? 1)} onChange={(e) => set({ stepUpOTCoef: Number(e.target.value) })}>
                        <option value="1">1×</option>
                        <option value="1.25">1.25×</option>
                        <option value="1.5">1.5×</option>

            <div className="space-y-1">
              <Field label="Notes" hint="e.g. rain delay, client overtime requested">
                <textarea
                  value={v.note || ""}
                  onChange={(e) => set({ note: e.target.value })}
                  placeholder="Add a note about this day…"
                  rows={3}
                  className="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-3 py-2.5 text-sm text-neutral-100 placeholder-neutral-600 focus:outline-none focus:border-sky-500 resize-none"
                  style={{ fontFamily: 'inherit' }}
                />
                <div className={`text-xs mt-1 text-right ${(v.note || "").length > 1000 ? "text-red-400" : (v.note || "").length > 500 ? "text-amber-400" : "text-neutral-600"}`}>
                  {(v.note || "").length} / 500

              </Field>
            </div>
          </Disclosure>

        </div>
      );
