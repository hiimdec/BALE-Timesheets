          const nightPreCallHrs = ceilHalf(preCallSplit.total);
          const nightRate = bectuOtRate ?? computeAPArate(bdr, 2, weekendOpts.apaRounding);
          lines.push({ label: "Pre-call", detail: `${preCallTime} – ${day.callTime} · 2× BHR (night)`, rate: nightRate, qty: nightPreCallHrs, amount: nightPreCallHrs * nightRate });
        } else {
          if (preCallTripleChargeable > 0) {
            const tripleRate = bectuOtRate ?? computeAPArate(bdr, 3, weekendOpts.apaRounding);
            lines.push({ label: "Pre-call", detail: "before 05:00 · 3× BHR", rate: tripleRate, qty: preCallTripleChargeable, amount: preCallTripleChargeable * tripleRate });
          }
          if (preCallOtChargeable > 0) {
            lines.push({ label: "Pre-call", detail: `05:00 – ${day.callTime} · OT rate`, rate: otRate, qty: preCallOtChargeable, amount: preCallOtChargeable * otRate });
          }
        }
      }

      // When lunch is curtailed AND OT is crossed AND the day has a real OT
      // line (weekday or Sat Shoot/Pre-light — not Sun/BH, not night shoot,
      // not noOT crew), the curtailment minutes already shifted basicHrs
      // earlier and surface in the OT pay. Append "incl. Nm curtailed lunch"
      // to the OT line's detail and skip the separate Curtailed 1st Break
      // line entirely.
      const curtailedMinsAbsorbedInOT = (bs.cwdApplies && !lunchMissed && lunchDuration > 0 && lunchDuration < 60 &&
        !isNightShoot && !treatAsSun && !crew.noOT && (effectiveHrs - basicHrs) > 0)
        ? (60 - lunchDuration)
        : 0;
      const otCurtailedSuffix = curtailedMinsAbsorbedInOT > 0 ? ` · incl. ${curtailedMinsAbsorbedInOT}m curtailed lunch` : '';

      if (isNightShoot) {
        const lunchDeduct = lunchMissed ? 0 : lunchDuration / 60;
        const paidHrs = ceilHalf(Math.max(workedHrs - lunchDeduct, 10));
        const nightRate = bectuOtRate ?? computeAPArate(bdr, 2, weekendOpts.apaRounding);
        lines.push({
          label: "Night Shoot (2× BHR)",
          detail: `${callWrapLabel}${lunchDeduct ? ` · ${Math.round(lunchDeduct * 60)}m lunch` : ""}`,
          rate: nightRate, qty: paidHrs, amount: paidHrs * nightRate,
        });
        if (workedHrs - lunchDeduct < 10) notes.push("Min call 10h applied");
      } else if (treatAsSat) {
        const satRate = computeAPArate(bdr, satMult, weekendOpts.apaRounding);
        const satOtRate = bectuOtRate ?? satRate;
        if (effectiveDayType === "Shoot") {
          lines.push({ label: `Saturday Day (${satMult}× BDR)`, detail: callWrapLabel + (isElevenHourDay ? " · 11-hour day" : ""), rate: bdr * satMult, qty: 1, amount: bdr * satMult });
          // APA §4.6: Saturday OT is 1.5× BHR, but OT after 00:00 is 3× BHR and
          // continues at triple to wrap.
          const otTotal = ceilHalf(Math.max(0, effectiveHrs - basicHrs));
          if (otTotal > 0) {
            const otStartAbs = effectiveStart + basicHrs;
            const tripleHrs = ceilHalf(Math.max(0, wrapAbs - Math.max(otStartAbs, 24)));
            const satOtHrs = Math.max(0, otTotal - tripleHrs);
            if (satOtHrs > 0) lines.push({ label: `Saturday OT (${satMult}× BHR)`, detail: (tripleHrs > 0 ? `${toHHMM(otStartAbs)} – 00:00` : "After basic") + otCurtailedSuffix, rate: satOtRate, qty: satOtHrs, amount: satOtHrs * satOtRate });
            if (tripleHrs > 0) {
              const tripleRate = bectuOtRate ?? computeAPArate(bdr, 3, weekendOpts.apaRounding);
              lines.push({ label: "OT Triple Time (after 00:00)", detail: `00:00 – ${toHHMM(wrapAbs)}`, rate: tripleRate, qty: tripleHrs, amount: tripleHrs * tripleRate });
            }
          }
        } else {
          // APA §2.3 / §2.4(ix): flat 8h × satRate for both Pre-light and
          // discretionary days. Lunch is unpaid filler — it only shifts the
          // OT threshold (basicHrs computed upstream), never the paid qty.
          // 9h when continuousDay (Pre-light CWD: full continuous block
          // worked and paid). Mirrors the weekday Pre-light branch below.
          const baseHrs = continuousDay ? 9 : 8;
          const satMinApplied = baseHrs > workedHrs;
          lines.push({ label: `Saturday ${effectiveDayType} (${satMult}× BHR)`, detail: satMinApplied ? `${callWrapLabel} · min 8h applied` : callWrapLabel, rate: satRate, qty: baseHrs, amount: baseHrs * satRate });
          const otHrs = ceilHalf(Math.max(0, workedHrs - basicHrs));
          if (otHrs > 0) { lines.push({ label: `Saturday OT (${satMult}× BHR)`, detail: "After basic" + otCurtailedSuffix, rate: satOtRate, qty: otHrs, amount: otHrs * satOtRate }); }
        }
      } else if (treatAsSun) {
        const sunRate = computeAPArate(bdr, sunMult, weekendOpts.apaRounding);
        if (effectiveDayType === "Shoot") {
          const lunchDeduct = lunchMissed ? 0 : lunchDuration / 60;
          const paidHrs = Math.max(workedHrs - lunchDeduct, 10);
          // APA §4.7: Sun/BH is 2× BHR for all hours, but hours after 00:00 are
          // 3× BHR and continue at triple to wrap. Split the flat day at
          // midnight; the min-10h floor tops up the pre-midnight (2× BHR) part.
          const tripleHrs = ceilHalf(Math.max(0, wrapAbs - 24));
          const flatHrs = Math.max(0, paidHrs - tripleHrs);
          lines.push({
            label: `${sunBranchPrefix} Shoot (${sunMult}× BHR, flat)`,
            detail: `${callWrapLabel}${lunchDeduct ? ` · ${Math.round(lunchDeduct * 60)}m lunch` : ""}${tripleHrs > 0 ? " · to 00:00" : ""}`,
            rate: sunRate, qty: flatHrs, amount: flatHrs * sunRate,
          });
          if (tripleHrs > 0) {
            const tripleRate = bectuOtRate ?? computeAPArate(bdr, 3, weekendOpts.apaRounding);
            lines.push({ label: "OT Triple Time (after 00:00)", detail: `00:00 – ${toHHMM(wrapAbs)}`, rate: tripleRate, qty: tripleHrs, amount: tripleHrs * tripleRate });
          }
          if (workedHrs - lunchDeduct < 10) notes.push("Min call 10h applied");
        } else {
          // Sun/BH non-Shoot pays a single flat-rate line covering basic +
          // OT (rates are equal at 2× BHR on Sunday per APA §2.4(viii)/(x)).
          // Lunch is unpaid filler on both Pre-light and Discretionary days,
          // so deduct lunchDuration. Min 8h floor stays per the cheat sheet.
          const lunchDeduct = lunchMissed ? 0 : lunchDuration / 60;
          const sunPaidHrs = Math.max(workedHrs - lunchDeduct, 8);
          const sunMinApplied = sunPaidHrs > (workedHrs - lunchDeduct);
          lines.push({ label: `${sunBranchPrefix} ${effectiveDayType} (${sunMult}× BHR, flat)`, detail: sunMinApplied ? `${callWrapLabel} · min 8h applied` : callWrapLabel, rate: sunRate, qty: sunPaidHrs, amount: sunPaidHrs * sunRate });
        }
      } else {
        if (effectiveDayType === "Shoot") {
          lines.push({ label: continuousDay ? "BDR (Continuous Working Day)" : "BDR", detail: callWrapLabel + (isElevenHourDay ? " · 11-hour day" : ""), rate: bdr, qty: 1, amount: bdr });
        } else if (effectiveDayType === "Pre-light") {
          const baseHrs = continuousDay ? 9 : 8;
          lines.push({ label: continuousDay ? "Pre-light Day (CWD 9h × BHR)" : "Pre-light Day (8h × BHR + 1h lunch)", detail: callWrapLabel, rate: bhr, qty: baseHrs, amount: baseHrs * bhr });
        } else if (DISCRETIONARY_LUNCH_DAY_TYPES.includes(effectiveDayType)) {
          // APA §2.3: 8h × BHR. Lunch is at producer's discretion and unpaid.
          // basicHrs (above) is the OT threshold and shifts with lunch; the paid
          // qty stays a flat 8 regardless. Mirrors the Pre-light pattern.
          const baseHrs = 8;
          const lunchPart = (lunchMissed || lunchDuration === 0) ? "no lunch" : (lunchDuration >= 60 ? "+1h lunch" : `+${lunchDuration}m lunch`);
          lines.push({ label: `${effectiveDayType} (${baseHrs}h × BHR, ${lunchPart})`, detail: callWrapLabel, rate: bhr, qty: baseHrs, amount: baseHrs * bhr });
        } else {
          throw new Error('Unhandled day type in calculateDay: ' + effectiveDayType);
        }

        if (!crew.noOT) {
          if (isEarly) {
            const earlyHrs = ceilHalf(7 - callH);
            lines.push({ label: "Early Call (OT rate)", detail: `${day.callTime} – 07:00`, rate: otRate, qty: earlyHrs, amount: earlyHrs * otRate });
          }

          const otTotalRaw = Math.max(0, effectiveHrs - basicHrs);
          const otTotal = ceilHalf(otTotalRaw);
          if (otTotal > 0) {
            const otStartAbs = effectiveStart + basicHrs;
            const otEndAbs = wrapAbs;
            // APA §4.4: once OT crosses 00:00 it's 3× BHR and CONTINUES at
            // triple to wrap (not just to 05:00).
            const tripleStart = Math.max(otStartAbs, 24);
            const tripleRaw = Math.max(0, otEndAbs - tripleStart);
            const tripleHrs = ceilHalf(tripleRaw);
            const standardOtHrs = Math.max(0, otTotal - tripleHrs);
            if (standardOtHrs > 0) {
              lines.push({
                label: "OT",
                detail: (tripleHrs > 0 ? `${toHHMM(otStartAbs)} – 00:00` : `${toHHMM(otStartAbs)} – ${toHHMM(otEndAbs)}`) + otCurtailedSuffix,
                rate: otRate, qty: standardOtHrs, amount: standardOtHrs * otRate,
              });
            }
            if (tripleHrs > 0) {
              const tripleRate = bectuOtRate ?? computeAPArate(bdr, 3, weekendOpts.apaRounding);
              lines.push({ label: "OT Triple Time (after 00:00)", detail: `00:00 – ${toHHMM(otEndAbs)}`, rate: tripleRate, qty: tripleHrs, amount: tripleHrs * tripleRate });
            }
          }
        }
      }

      // Late 1st Break (£10) — bs.lunchLate is already gated to cwdApplies
      // at source in deriveBreakState, so this only fires on Shoot/Pre-light.
      // Flat £10 on all day types including night shoots (APA §6.2).
      if (bs.lunchLate) lines.push({ label: "Late 1st Break", detail: "", rate: null, qty: 1, amount: 10 });
      // Curtailed 1st Break (APA §6.2): basic hours are reduced by the curtailed minutes
      // (lines 998-999), which already shifts the OT threshold earlier. If wrap doesn't
      // cross the adjusted threshold (no OT worked), pay the curtailed minutes at the
      // applicable day rate. If OT was crossed, the curtailed time is absorbed into the
      // OT calc (informational line at £0).
      // V4-5h-14 (F8.1): Sun/BH pay at 2× BHR, Sat at Sat multiplier × BHR.
      // V4-7-1: night shoots have no OT (flat 2× BHR call-to-wrap), so the
      // "absorbed in OT" branch is suppressed and curtailment always pays
      // the curtailment minutes at 2× BHR.
      if (bs.cwdApplies && !lunchMissed && lunchDuration > 0 && lunchDuration < 60) {
        const shortMins = 60 - lunchDuration;
        const curtailedHrs = shortMins / 60;
        // When OT was crossed the curtailment is already absorbed into the
        // OT line (its detail string carries "incl. Nm curtailed lunch") —
        // emit nothing here. Otherwise pay the curtailment time at the
        // applicable day rate.
        const otCrossed = curtailedMinsAbsorbedInOT > 0;
        if (!otCrossed) {
          const penaltyRate = isNightShoot ? (bectuOtRate ?? computeAPArate(bdr, 2, weekendOpts.apaRounding))
                            : treatAsSun ? computeAPArate(bdr, sunMult, weekendOpts.apaRounding)
                            : treatAsSat ? computeAPArate(bdr, satMult, weekendOpts.apaRounding)
                            : bhr;
          const rateLabel = isNightShoot ? '2× BHR · night shoot'
                          : treatAsSun ? `${sunMult}× BHR`
                          : treatAsSat ? `${satMult}× BHR`
                          : 'BHR single time';
          lines.push({ label: "Curtailed 1st Break", detail: `${shortMins}m × ${rateLabel}`, rate: penaltyRate, qty: curtailedHrs, amount: curtailedHrs * penaltyRate });
        }
      }
      // Missed Meal (£7.50) — lunchMissed is the raw flag; gate to
      // cwdApplies so the allowance only applies on Shoot/Pre-light.
      // Flat £7.50 on all day types including night shoots.
      if (bs.cwdApplies && (lunchMissed || bs.lunchVeryLate) && day.noMealProvided) {
        lines.push({ label: "Missed Meal Allowance", detail: "", rate: null, qty: 1, amount: 7.5 });
      }
      // 2nd Break + CWD Break penalties: night shoots use 2× BHR (matching the
      // flat night-shoot rate per APA §2.1.5); all other day types stay at
      // single BHR per §6.3 / §6.4.
      const breakPenaltyRate = isNightShoot ? (bectuOtRate ?? computeAPArate(bdr, 2, weekendOpts.apaRounding)) : bhr;
      const breakPenaltyLabel = isNightShoot ? '2× BHR' : 'BHR';
      if (secondBreakRequired) {
        if (sbState === "missed" || sbState === "late") {
          lines.push({ label: sbState === "late" ? "Late 2nd Break (treated as missed)" : "Missed 2nd Break", detail: `30m × ${breakPenaltyLabel}`, rate: null, qty: 1, amount: breakPenaltyRate * 0.5 });
        } else if (sbState === "curtailed") {
          const curtailedBy = 30 - bs.sbDuration;
          lines.push({ label: "Curtailed 2nd Break", detail: `${curtailedBy}m × ${breakPenaltyLabel}`, rate: null, qty: 1, amount: (curtailedBy / 60) * breakPenaltyRate });
        }
      }
      if (continuousDay) {
        if (day.cwdBreak1Given === false) lines.push({ label: "Missed CWD Break (9h)", detail: `30m × ${breakPenaltyLabel}`, rate: null, qty: 1, amount: breakPenaltyRate * 0.5 });
        if (cwd2Required && day.cwdBreak2Given === false) lines.push({ label: "Missed CWD Break (12.5h)", detail: `30m × ${breakPenaltyLabel}`, rate: null, qty: 1, amount: breakPenaltyRate * 0.5 });
      }

      const finMins = (x) => { const n = Number(x); return Number.isFinite(n) ? n : 0; };
      const travelOutRaw = Math.max(0, finMins(day.travelOutMins) - 60) / 60;
      const travelBackRaw = Math.max(0, finMins(day.travelBackMins) - 60) / 60;
      const travelHrs = travelOutRaw + travelBackRaw;
      if (travelHrs > 0) {
        // APA §3.1: travel is payable only once travel + work exceeds 11h,
        // regardless of day type (a flat 11h threshold, not the day's basic hours).
        const travelGap = Math.max(0, 11 - (workedHrs + preUnitHrs));
        const chargeableTravel = ceilHalf(Math.max(0, travelHrs - travelGap));
        if (chargeableTravel > 0) {
          lines.push({ label: "Travel Time", detail: "1hr each way deducted", rate: bhr, qty: chargeableTravel, amount: chargeableTravel * bhr });
        } else {
          notes.push(`Travel not paid (work ${workedHrs.toFixed(1)}h + travel ${travelHrs.toFixed(1)}h ≤ 11h threshold)`);
        }
      }
      const miles = Number(day.miles) || 0;
      if (miles > 0) lines.push({ label: "Mileage", detail: buildMileageDetail(day), rate: 0.5, qty: miles, amount: miles * 0.5 });

      const total = lines.reduce((s, l) => s + l.amount, 0);
      const otHrsForMeta = lines.filter((l) => categorizeBreakdownLine(l.label) === 'ot').reduce((s, l) => s + (Number(l.qty) || 0), 0);

      return {
        meta: {
          workedHrs, otHrs: otHrsForMeta, bhr, otRate,
          notes, secondBreakRequired, continuousDay,
          isBankHoliday: isBH, bankHolidayName: getBankHolidayName(day.date),
          dayLabel: isNightShoot ? (isNightPre5 ? "Night Shoot (pre-5am)" : "Night Shoot (post-5pm)")
                  : treatAsSat ? "Saturday"
                  : treatAsSun ? (isBH && !isSunday ? "Bank Holiday" : "Sunday")
                  : isEarly ? "Early Call" : isLate ? "Late Call" : "Standard",
        },
        lines, total,
      };
    }

    /* ─────────────── PM / PA / Runner — APA Appendix 1 §(a) ─────────────── */

    function calculatePmpaDay(day, crew, weekendOpts = {}) {
      const rawBdr = Number(crew.bdr);
      const bdr = Number.isFinite(rawBdr) ? Math.max(0, rawBdr) : 0;
      const bhr = computeAPArate(bdr, 1, weekendOpts.apaRounding);

      // Non-shoot day: flat BDR. Travel Day, Pre-light, Prep, Recce, Build,
      // De-rig — all the same. (Rest Day is handled by the early return in
      // calculateDay before this branch.)
      if (day.dayType !== "Shoot") {
        return {
          meta: {
            workedHrs: 0, otHrs: 0, bhr, otRate: bhr,
            dayLabel: day.dayType || "—", notes: [],
            secondBreakRequired: false, continuousDay: false, isPmpa: true,
            isBankHoliday: isBankHoliday(day.date),
            bankHolidayName: getBankHolidayName(day.date),
          },
          lines: [{ label: `${day.dayType} (flat BDR)`, detail: "", rate: null, qty: 1, amount: bdr }],
          total: bdr,
        };
      }

      // Shoot day. Compute hours, day-of-week, multiplier, OT.
      const callH = parseHHMM(day.callTime);
      const wrapH = parseHHMM(day.wrapTime);
      if (callH === null || wrapH === null) {
        return {
          meta: { workedHrs: 0, otHrs: 0, bhr, otRate: bhr, dayLabel: "—", notes: ["Missing or invalid call/wrap time"], secondBreakRequired: false, continuousDay: false, isPmpa: true },
          lines: [], total: 0,
        };
      }
      // E1/E2 (mirrors deriveBreakState): wrap == call with no explicit wrapNextDay is a
      // 0h day (£0 + note, not a silent 24h); clamp an implausibly long day to 24h.
      const wrapNextDay = day.wrapNextDay || wrapH < callH;
      if (wrapH === callH && !day.wrapNextDay) {
        return { meta: { workedHrs: 0, otHrs: 0, bhr, otRate: bhr, dayLabel: "—", notes: ["Missing or invalid call/wrap time"], secondBreakRequired: false, continuousDay: false, isPmpa: true }, lines: [], total: 0 };
      }
      let wrapAbs = wrapNextDay ? wrapH + 24 : wrapH;
      let workedHrs = wrapAbs - callH;
      const dayClamped = workedHrs > 24;
      if (dayClamped) { workedHrs = 24; wrapAbs = callH + 24; }
      const callWrapLabel = `${day.callTime} – ${day.wrapTime}${wrapNextDay ? " (+1)" : ""}`;

      const dow = dayOfWeek(day.date);
      const isSaturday = dow === 6;
      const isSunday = dow === 0;
      const isBH = isBankHoliday(day.date);
      const isNightPre5 = callH < 5;
      const isNightPost5 = callH >= 17;
      const isNightShoot = isNightPre5 || isNightPost5;

      // Honour production-level weekend toggles (same as main engine):
      // weekday → no boost, custom → user multiplier, otherwise APA defaults.
      const satMode = weekendOpts.satRateMode ?? "apa";
      const sunMode = weekendOpts.sunRateMode ?? "apa";
      const satMult = satMode === "custom" ? (Number(weekendOpts.satRateCustom) || 1.5) : 1.5;
      const sunMult = sunMode === "custom" ? (Number(weekendOpts.sunRateCustom) || 2.0) : 2.0;
      const treatAsSat = isSaturday && satMode !== "weekday";
      // APA §2.4: bank holidays paid at Sunday rate.
      const treatAsSun = (isSunday || isBH) && sunMode !== "weekday";
      const sunBranchPrefix = (isBH && !isSunday) ? "Bank Holiday" : "Sunday";
      const isElevenHourDay = !!(weekendOpts.isElevenHourDay);

      // Multiplier per Appendix 1 §(a):
      //   Night shoot (any dow) → 2×
      //   Sun/BankHol → 2×
      //   Sat → 1.5×
      //   Mon-Fri → 1×
      // (Night shoot wins over Sat — Sat night is 2×, not 1.5×.)
      let mult = 1;
      let dayLineLabel = "BDR";
      if (isNightShoot) {
        mult = 2;
        dayLineLabel = `Night Shoot (2× BDR)`;
      } else if (treatAsSun) {
        mult = sunMult;
        dayLineLabel = `${sunBranchPrefix} Shoot (${sunMult}× BDR)`;
      } else if (treatAsSat) {
        mult = satMult;
        dayLineLabel = `Saturday Shoot (${satMult}× BDR)`;
      }

      // BWD: 11h call-to-tail-lights (12h if production runs 11-hour days).
      const basicHrs = isElevenHourDay ? 12 : 11;
      const otHrs = ceilHalf(Math.max(0, workedHrs - basicHrs));
      const otRate = computeAPArate(bdr, mult, weekendOpts.apaRounding);

      const lines = [];
      lines.push({
        label: dayLineLabel,
        detail: callWrapLabel + (isElevenHourDay ? " · 11-hour day" : ""),
        rate: bdr * mult, qty: 1, amount: bdr * mult,
      });
      if (otHrs > 0) {
        const otStartAbs = callH + basicHrs;
        lines.push({
          label: mult === 1 ? "OT" : `OT (${mult}× BHR)`,
          detail: `${toHHMM(otStartAbs)} – ${toHHMM(wrapAbs)}`,
          rate: otRate, qty: otHrs, amount: otHrs * otRate,
        });
      }

      // Mileage stays functional even though §3 doesn't apply — defaults to 0.
      const miles = Number(day.miles) || 0;
      if (miles > 0) lines.push({ label: "Mileage", detail: buildMileageDetail(day), rate: 0.5, qty: miles, amount: miles * 0.5 });

      const total = lines.reduce((s, l) => s + l.amount, 0);

      let dayLabel;
      if (isNightShoot) dayLabel = isNightPre5 ? "Night Shoot (pre-5am)" : "Night Shoot (post-5pm)";
      else if (treatAsSat) dayLabel = "Saturday";
      else if (treatAsSun) dayLabel = isBH && !isSunday ? "Bank Holiday" : "Sunday";
      else dayLabel = "Standard";

      return {
        meta: {
          workedHrs, otHrs, bhr, otRate, dayLabel,
          notes: dayClamped ? ["Day length exceeded 24h — clamped to 24h. Check the wrap time / +1 flag."] : [], secondBreakRequired: false, continuousDay: false, isPmpa: true,
          isBankHoliday: isBH, bankHolidayName: getBankHolidayName(day.date),
        },
        lines, total,
      };
    }

    /* ═══════════════════════════ MIGRATION + STORAGE ═══════════════════════════ */

    function migrateDay(d) {
      d = { note: "", expenses: [], ...d };
      // Normalise a corrupt/legacy dayType: a present-but-unknown value (or blank)
      // would otherwise throw in the calc engine. undefined is left for the cascade.
      if (d.dayType !== undefined && !DAY_TYPES.includes(d.dayType)) d = { ...d, dayType: "Shoot" };
      // Sanitise corrupt time fields (e.g. a "NaN:NaN" wrap persisted by the
      // pre-fix onCallChange bug): a non-empty string that doesn't parse as HH:MM
      // is dropped so the cascade/default re-supplies a valid time. null (lunch
      // "missed") and undefined (cascade) are left untouched.
      {
        const _tf = ["callTime", "wrapTime", "lunchStartTime", "secondBreakStartTime", "preCallTime", "truckCallTime"];
        if (_tf.some(f => typeof d[f] === "string" && d[f] !== "" && parseHHMM(d[f]) === null)) {
          d = { ...d };
          for (const f of _tf) if (typeof d[f] === "string" && d[f] !== "" && parseHHMM(d[f]) === null) delete d[f];
        }
      }
      // V4-5h-10: *Enabled flags dropped; value presence drives activation.
      // Existing records with the flags get them removed (idempotent). Values preserved —
      // records previously saved as enabled:false with a value will now show as ACTIVE.
      if (d.preCallEnabled !== undefined || d.kitMoneyEnabled !== undefined ||
          d.perDiemEnabled !== undefined || d.travelTimeEnabled !== undefined ||
          d.stepUpEnabled !== undefined || d.mileageEnabled !== undefined ||
          d.expensesEnabled !== undefined) {
        d = { ...d };
        delete d.preCallEnabled;
        delete d.kitMoneyEnabled;
        delete d.perDiemEnabled;
        delete d.travelTimeEnabled;
        delete d.stepUpEnabled;
        delete d.mileageEnabled;
        delete d.expensesEnabled;
      }
      // secondBreakLogged backfill: existing records with a duration > 0 are treated as
      // "logged"; records sitting at 0 are treated as "not yet logged" (friendlier UX —
      // chip reads as caps "2ND BREAK" prompting engagement, not "Missed").
      if (typeof d.secondBreakLogged !== 'boolean') {
        d = { ...d, secondBreakLogged: (Number(d.secondBreakDurationMins) || 0) > 0 };
      }
      // Safety net for the v2 `wrapped` flag: any day still missing it
      // (e.g. imported backup predating schema v2) gets the same date-based
      // backfill the migration uses — past = wrapped, today/future = not.
      if (typeof d.wrapped !== 'boolean') {
        d = { ...d, wrapped: !!(d.date && d.date < todayISO()) };
      }
      // Migrate legacy truckCallTime → preCallTime (keep truckCallTime for safe rollback)
      if (d.truckCallTime && !d.preCallTime) d = { ...d, preCallTime: d.truckCallTime };
      if (d.lunchStartTime !== undefined) return d;
      if (!d.callTime) return d;
      const callH = parseHHMM(d.callTime) || 8;
      let lunchStartTime, lunchDurationMins;
      if (d.lunchState === "missed") { lunchStartTime = null; lunchDurationMins = 0; }
      else if (d.lunchState === "late") { lunchStartTime = toHHMM(callH + 6); lunchDurationMins = 60; }
      else if (d.lunchState === "curtailed") { lunchStartTime = toHHMM(callH + 5); lunchDurationMins = 60 - (Number(d.lunchCurtailMins) || 30); if (lunchDurationMins <= 0) lunchDurationMins = 30; }
      else { lunchStartTime = toHHMM(callH + 5); lunchDurationMins = 60; }
      const lunchEnd = lunchStartTime ? parseHHMM(lunchStartTime) + (lunchDurationMins || 60) / 60 : callH + 6;
      const sbStart = toHHMM(lunchEnd + 5);
      let sbDuration;
      if (d.secondBreakState === "missed") sbDuration = 0;
      else if (d.secondBreakState === "curtailed") sbDuration = 30 - (Number(d.secondBreakCurtailMins) || 15);
      else sbDuration = 30;
      if (sbDuration < 0) sbDuration = 0;
      return {
        ...d, lunchStartTime, lunchDurationMins,
        secondBreakStartTime: sbStart, secondBreakDurationMins: sbDuration,
        cwdBreak1Given: true, cwdBreak2Given: true,
      };
    }

    function migrateCrew(c) {
      if (c.role === "Spark") c = { ...c, role: "Lighting Technician" };
      return { isDriver: false, ...c, email: c.email ?? '' };
    }

    function userCrewIdsInProduction(production, userPrefs) {
      if (!production.bestBoyMode) {
        return (production.crew || []).map(c => c.id);
      }
      const targetName = (userPrefs?.displayName || "").toLowerCase().trim();
      if (!targetName) return [];
      return (production.crew || [])
        .filter(c => (c.name || "").toLowerCase().trim() === targetName)
        .map(c => c.id);
    }

    // Resolve which crew member is "you" on a given production.
    // Manual override (production.iAmCrewId) wins; otherwise auto-match by userPrefs.displayName.
    // Returns crew id or null.
    function resolveUserCrewId(production, userPrefs) {
      if (!production) return null;
      const override = production.iAmCrewId;
      if (override && (production.crew || []).some(c => c.id === override)) return override;
      const target = (userPrefs?.displayName || '').toLowerCase().trim();
      if (!target) return null;
      const match = (production.crew || []).find(c => (c.name || '').toLowerCase().trim() === target);
      return match?.id ?? null;
    }

    function migrateInvoice(inv, p) {
      if (!inv) return inv;
      const allDates = (p.days || []).map(d => d.date).filter(Boolean).sort();
      const migrated = {
        ...inv,
        linesEdited: inv.linesEdited ?? false,
        ccEmail: inv.ccEmail ?? "",
        roundingMode: roundingModeOf(inv),
        jobTitle: inv.jobTitle ?? p.title ?? "",
        jobReference: inv.jobReference ?? p.jobReference ?? "",
        jobRole: inv.jobRole ?? "",
        shootDateStart: inv.shootDateStart ?? p.startDate ?? allDates[0] ?? "",
        shootDateEnd: inv.shootDateEnd ?? allDates[allDates.length - 1] ?? "",
      };
      // Strip any legacy logoBase64 that was snapshotted per-invoice; logo is now read
      // from userPrefs at render time to avoid duplicating ~500KB per invoice.
      delete migrated.logoBase64;
      return migrated;
    }

    const migrateProduction = (p) => {
      // V4-5h-10: legacy v1→v2 kitMoneyEnabled backfill removed. Day records that lack
      // kitMoneyAmount now silently inherit kit money via augmentCalc's crew fallback
      // (when crew.kitMoneyEnabled with crew.kitMoneyAmount > 0). No backfill needed.
      const days = p.days || [];

      // V4-5h-11: collapse explicit-matching time fields to undefined so cascade fires.
      // Idempotent — records already at undefined stay undefined; records with a value
      // differing from default keep that explicit value (variance).
      const TIME_CASCADE_FIELDS = ['callTime', 'wrapTime', 'lunchStartTime', 'lunchDurationMins', 'dayType'];
      for (const day of days) {
        const dd = p.dayDefaults?.[day.date];
        if (!dd) continue;
        for (const field of TIME_CASCADE_FIELDS) {
          if (day[field] !== undefined && day[field] === dd[field]) {
            delete day[field];
          }
        }
      }

      // dayDefaults backfill: derive from existing crew records per date. Idempotent.
      const backfilledDefaults = { ...(p.dayDefaults || {}) };
      const uniqueDates = [...new Set(days.map(d => d.date))];
      for (const date of uniqueDates) {
        if (backfilledDefaults[date]) continue;
        const recordsForDate = days.filter(d => d.date === date);
        if (recordsForDate.length === 0) continue;
        const mostCommon = (field) => {
          const counts = new Map();
          for (const r of recordsForDate) {
            const v = r[field];
            if (v == null || v === '') continue;
            counts.set(v, (counts.get(v) ?? 0) + 1);
          }
          if (counts.size === 0) return recordsForDate[0][field] ?? null;
          return [...counts.entries()].sort((a, b) => b[1] - a[1])[0][0];
        };
        backfilledDefaults[date] = {
          callTime:          mostCommon('callTime') ?? DEFAULT_PRODUCTION_DAY.callTime,
          wrapTime:          mostCommon('wrapTime') ?? DEFAULT_PRODUCTION_DAY.wrapTime,
          lunchStartTime:    mostCommon('lunchStartTime') ?? DEFAULT_PRODUCTION_DAY.lunchStartTime,
          lunchDurationMins: mostCommon('lunchDurationMins') ?? DEFAULT_PRODUCTION_DAY.lunchDurationMins,
          dayType:           mostCommon('dayType') ?? DEFAULT_PRODUCTION_DAY.dayType,
        };
      }
      // Round-5 extras backfill on dayDefaults — idempotent. Every dayDefaults entry
      // gets the 5 mobile-mode extras fields (defaulted to off/empty).
      // V4-5h-10: *Enabled flags dropped; value presence drives activation. Existing
      // entries with stale flag fields get them deleted here (idempotent).
      for (const dateKey of Object.keys(backfilledDefaults)) {
        const d = backfilledDefaults[dateKey];
        delete d.preCallEnabled;
        delete d.travelTimeEnabled;
        delete d.perDiemEnabled;
        delete d.kitMoneyEnabled;
        delete d.stepUpEnabled;
        d.preCallTime       = d.preCallTime       ?? '';
        d.miles             = d.miles             ?? 0;
        d.mileagePostcode   = d.mileagePostcode   ?? '';
        d.mileageMethod     = d.mileageMethod     ?? 'manual';
        d.mileageRoundTrip  = d.mileageRoundTrip  ?? true;
        d.travelOutMins     = d.travelOutMins     ?? 0;
        d.travelBackMins    = d.travelBackMins    ?? 0;
        d.perDiemAmount     = d.perDiemAmount     ?? 0;
        d.expenses          = d.expenses          ?? [];
      }

      // Promote client/job fields a user typed only on an invoice up to the
      // production (the single source) so the bidirectional draft sync doesn't
      // blank values entered before linking existed. Fills EMPTY production
      // fields ONLY (||=, latest non-empty invoice) — never overwrites a set
      // field, and never alters any invoice (sent snapshots stay byte-identical).
      const _invs = p.invoices || [];
      const _latestInv = (key) => { for (let i = _invs.length - 1; i >= 0; i--) { const v = _invs[i]?.[key]; if (v != null && v !== "") return v; } return ""; };
      const _client = {
        prodCo:         (p.prodCo ?? "") || (p.toName ?? "") || _latestInv("toName"),
        invoicingEmail: (p.invoicingEmail ?? "") || _latestInv("toEmail"),
        toAddress:      (p.toAddress ?? "") || _latestInv("toAddress"),
        jobReference:   (p.jobReference ?? "") || _latestInv("jobReference"),
        ccEmail:        p.ccEmail ?? "",
      };
      const _rmode = roundingModeOf(p);

      return {
        ...p,
        crew: (p.crew || []).map(migrateCrew),
        bestBoyMode: p.bestBoyMode ?? ((p.crew?.length ?? 0) > 1),
        viewMode: p.viewMode ?? 'grid',
        iAmCrewId: p.iAmCrewId ?? null,
        dayDefaults: backfilledDefaults,
        isElevenHourDay: p.isElevenHourDay ?? false,
        prodCo: _client.prodCo,
        jobReference: _client.jobReference,
        invoicingEmail: _client.invoicingEmail,
        ccEmail: _client.ccEmail,
        roundingMode: _rmode,
        favourableRounding: _rmode === 'favourable',
        apaRounding: _rmode === 'apa',
        startDate: p.startDate ?? todayISO(),
        weekStarts: p.weekStarts ?? [],
        gridDates: p.gridDates ?? [],
        cancellationData: p.cancellationData ?? null,
        toAddress: _client.toAddress,
        invoices: (p.invoices || []).map(inv => migrateInvoice(inv, p)),
        days,
      };
    };

    /* ─── Migration runner ─── */

    // MIGRATIONS[v] brings bigals_productions from schema v-1 → v (operates on raw stored data).
    const MIGRATIONS = {
      1: () => {
        const raw = storage.get('bigals_productions');
        if (!raw) return;
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return;
        storage.set('bigals_productions', JSON.stringify(arr.map(migrateProduction)));
      },
      // v2: introduce explicit `wrapped` flag on each day. Backfill from date:
      // strictly-past dates are treated as wrapped (already-completed work),
      // today + future as not-yet-wrapped. The auto-filled wrapTime no longer
      // implies WRAPPED state — the live ON CALL UI now becomes reachable.
      2: () => {
        const raw = storage.get('bigals_productions');
        if (!raw) return;
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return;
        const today = todayISO();
        const updated = arr.map(p => ({
          ...p,
          days: Array.isArray(p.days) ? p.days.map(d => ({
            ...d,
            wrapped: typeof d.wrapped === 'boolean' ? d.wrapped : !!(d.date && d.date < today),
          })) : p.days,
        }));
        storage.set('bigals_productions', JSON.stringify(updated));
      },
      // v3: riggers now compute OT/night/triple via APA from BHR (S5). Older
      // role defaults stamped a flat BECTU otRate onto rigger crew (Master £102,
      // Advanced/Standby £78). Clear it so the APA path applies — but only when
      // it still equals that default, preserving any genuine custom per-crew rate.
      3: () => {
        const raw = storage.get('bigals_productions');
        if (!raw) return;
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return;
        const RIGGER_OT = { "Master Rigger": 102, "Advanced Rigger": 78, "Standby Rigger": 78 };
        const updated = arr.map(p => {
          if (!p || !Array.isArray(p.crew)) return p;
          return {
            ...p,
            crew: p.crew.map(c => {
              if (c && RIGGER_OT[c.role] != null && Number(c.otRate) === RIGGER_OT[c.role]) {
                const { otRate, ...rest } = c;
                return rest;
              }
              return c;
            }),
          };
        });
        storage.set('bigals_productions', JSON.stringify(updated));
      },
    };

    function runMigrations() {
      const stored = getStoredSchemaVersion();
      if (stored >= SCHEMA_VERSION) return { ran: false };
      const hadData = !!storage.get('bigals_productions');
      takePreMigrationSnapshot();
      try {
        for (let v = stored + 1; v <= SCHEMA_VERSION; v++) {
          if (MIGRATIONS[v]) MIGRATIONS[v]();
        }
        setStoredSchemaVersion(SCHEMA_VERSION);
        return { ran: hadData, from: stored, to: SCHEMA_VERSION };
      } catch (err) {
        restoreFromPreMigrationSnapshot();
        return { ran: false, error: String(err) };
      }
    }

    // Validates, version-checks, writes to localStorage, runs migrations, returns { ok, error }.
    // Caller is responsible for calling window.location.reload() on ok.
    function importBackup(rawText) {
      let parsed;
      try { parsed = JSON.parse(rawText); } catch { return { ok: false, error: 'Could not parse JSON.' }; }
      const arr = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.productions) ? parsed.productions : null);
      if (!arr || !arr.every(p => p && typeof p.id === 'string')) {
        return { ok: false, error: 'Not a valid TimeMachine backup.' };
      }
      const fileSchemaVersion = parsed?.schemaVersion ?? 0;
      if (fileSchemaVersion > SCHEMA_VERSION) {
        return { ok: false, error: `This backup was made with a newer version of TimeMachine (schema v${fileSchemaVersion}). Update the app first.` };
      }
      // Snapshot the ORIGINAL user data before overwriting — runMigrations() takes its own snapshot
      // after the overwrite, so without this, a migration failure would restore the imported (bad)
      // data rather than the original.
      // Restore userPrefs only when the backup actually carries it. Older backups
      // predate the userPrefs export — those must leave the device's current prefs
      // untouched (never clobber bank details / settings with defaults).
      const importedPrefs = (parsed && typeof parsed === 'object' && parsed.userPrefs &&
        typeof parsed.userPrefs === 'object' && !Array.isArray(parsed.userPrefs)) ? parsed.userPrefs : null;
      const originalProductions = storage.get('bigals_productions');
      const originalSchemaVersion = storage.get(SCHEMA_VERSION_KEY);
      const originalUserPrefs = storage.get('bigals_user_prefs');
      try {
        storage.set('bigals_productions', JSON.stringify(arr));
        setStoredSchemaVersion(fileSchemaVersion);
        // Merge over DEFAULT_USER_PREFS so an older-schema prefs object gains any
        // newer keys (the same normalisation useStoredState applies on read).
        if (importedPrefs) storage.set('bigals_user_prefs', JSON.stringify({ ...DEFAULT_USER_PREFS, ...importedPrefs }));
        const result = runMigrations();
        if (result.error) {
          if (originalProductions != null) storage.set('bigals_productions', originalProductions);
          else storage.remove('bigals_productions');
          if (originalSchemaVersion != null) storage.set(SCHEMA_VERSION_KEY, originalSchemaVersion);
          else storage.remove(SCHEMA_VERSION_KEY);
          if (importedPrefs) {
            if (originalUserPrefs != null) storage.set('bigals_user_prefs', originalUserPrefs);
            else storage.remove('bigals_user_prefs');
          }
          return { ok: false, error: `Migration failed: ${result.error}` };
        }
        return { ok: true };
      } catch (err) {
        return { ok: false, error: `Import failed: ${err.message}` };
      }
    }

    function useStoredState(key, initial, migrate) {
      const [storageError, setStorageError] = useState(null);
      const [value, setValue] = useState(() => {
        try {
          const raw = storage.get(key);
          if (raw) {
            let v = JSON.parse(raw);
            if (migrate && Array.isArray(v)) v = v.map(migrate);
            // For plain-object stores, merge initial so new keys added to the
            // default object get safe values for existing users.
            if (v !== null && typeof v === 'object' && !Array.isArray(v) &&
                initial !== null && typeof initial === 'object' && !Array.isArray(initial)) {
              v = { ...initial, ...v };
            }
            return v;
          }
        } catch (err) {
          setTimeout(() => setStorageError(`Read error on "${key}": ${err.message}`), 0);
        }
        return initial;
      });
      useEffect(() => {
        try { storage.set(key, JSON.stringify(value)); } catch (err) {
          setStorageError(`Write error on "${key}": ${err.message}`);
        }
      }, [key, value]);
      return [value, setValue, storageError];
    }

    /* ═══════════════════════════ SHARE / DOWNLOAD HELPERS ═══════════════════════════ */

    async function shareTextOrCopy(text, title) {
      if (navigator.share) {
        try { await navigator.share({ text, title }); return 'shared'; } catch (e) {
          if (e.name === 'AbortError') return 'cancelled';
        }
      }
      // Fallback: clipboard
      try {
        await navigator.clipboard.writeText(text);
        return 'copied';
      } catch {
        // Last-resort fallback: prompt
        prompt('Copy this text:', text);
        return 'prompted';
      }
    }

    /* ═══════════════════════════ TEXT FORMATTER ═══════════════════════════ */

    const formatOTDuration = (qty) => {
      const n = Number(qty) || 0;
      return n % 1 === 0 ? `${n}` : n.toFixed(1);
    };

    function formatLineText(line) {
      const label = line.label;
      const qty = line.qty;
      const timeMatch = line.detail?.match(/^(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})(\s*\(\+1\))?/);
      const timePart = timeMatch ? `${timeMatch[1]}-${timeMatch[2]}${timeMatch[3] || ''}` : '';
      if (/mileage/i.test(label)) return `Mileage: ${qty} mi — ${fmtGBP(line.amount)}`;
      const isOTLine = /\bot\b|\bovertime\b/i.test(label);
      if (isOTLine) {
        const prefix = timePart || line.detail || '';
        const amountHint = line.amount != null ? ` — ${fmtGBP(line.amount)}` : '';
        return `${prefix ? prefix + ' — ' : ''}${formatOTDuration(qty)}h ${label}${amountHint}`;
      }
      const isHoursLine = typeof qty === 'number' && /triple|travel time|early|travel day/i.test(label) && qty !== 1;
      const hoursHint = isHoursLine ? ` (${qty % 1 === 0 ? qty : qty.toFixed(2)} HR${qty !== 1 ? 'S' : ''})` : '';
      const amountHint = (!isHoursLine || /travel time/i.test(label)) && line.amount != null ? ` — ${fmtGBP(line.amount)}` : '';
      return `${timePart ? timePart + ' ' : ''}${label}${hoursHint}${amountHint}`;
    }

    function augmentCalc(calc, resolvedDay, crewMember) {
      const extra = [];
      // Kit money: day's amount wins if set; otherwise fall back to crew's default amount
      // (crew.kitMoneyEnabled still gates the crew-level default; this is a per-crew UI
      // toggle, distinct from the day-level flag that was dropped in V4-5h-10).
      const dayKmAmount = Number(resolvedDay?.kitMoneyAmount) || 0;
      const crewKmAmount = (crewMember?.kitMoneyEnabled && Number(crewMember?.kitMoneyAmount) > 0)
        ? Number(crewMember.kitMoneyAmount) : 0;
      const kmAmount = dayKmAmount > 0 ? dayKmAmount : crewKmAmount;
      if (kmAmount > 0)
        extra.push({ label: "Kit Money", detail: "", rate: null, qty: 1, amount: kmAmount });
      if (Number(resolvedDay?.perDiemAmount) > 0)
        extra.push({ label: "Per Diem", detail: "", rate: null, qty: 1, amount: Number(resolvedDay.perDiemAmount) });
      (resolvedDay?.expenses || []).forEach(exp => {
        const amt = Number(exp.amount) || 0;
        if (amt <= 0) return;
        extra.push({ label: `Expense: ${exp.category || "Other"}`, detail: exp.description || "", rate: null, qty: 1, amount: amt });
      });
      if (!extra.length) return calc;
      const lines = [...calc.lines, ...extra];
      return { ...calc, lines, total: calc.total + extra.reduce((s, l) => s + l.amount, 0) };
    }

    function buildInvoiceLineItems(production, userPrefs, userCrewId) {
      const crewMember = (production.crew || []).find(c => c.id === userCrewId);
      if (!crewMember) return [];
      const myDays = (production.days || [])
        .filter(d => d.crewId === userCrewId)
        .sort((a, b) => (a.date || '').localeCompare(b.date || ''));

      // ordered map: aggregation key → { label, dates[], qty, rate, amount, isExpense }
      const map = new Map();
      let prevDay = null;

      for (const day of myDays) {
        const calc = calcForDisplay(production, day, crewMember, prevDay);
        for (const line of calc.lines) {
          const isExpense = (line.label || "").startsWith("Expense:");
          let key, displayLabel;
          if (isExpense) {
            const category = (line.label || "").replace(/^Expense:\s*/i, "").trim();
            const desc = (line.detail || "").trim();
            key = `exp|${JSON.stringify([category, desc])}`;
            displayLabel = desc || category;
          } else {
            const prefix = (line.label || "").split(" (")[0].trim();
            key = `${prefix}|${line.rate ?? "null"}`;
            displayLabel = prefix;
          }
          if (map.has(key)) {
            const e = map.get(key);
            e.qty += typeof line.qty === "number" ? line.qty : 1;
            e.amount += Number(line.amount) || 0;
            if (day.date && !e.dates.includes(day.date)) e.dates.push(day.date);
          } else {
            map.set(key, {
              label: displayLabel,
              dates: day.date ? [day.date] : [],
              qty: typeof line.qty === "number" ? line.qty : 1,
              rate: typeof line.rate === "number" ? line.rate : null,
              amount: Number(line.amount) || 0,
              isExpense,
            });
          }
        }
        prevDay = day;
      }

      return [...map.values()].map(e => {
        const n = e.dates.length;
        const detail = n === 1 ? fmtDateShort(e.dates[0])
          : n === 2 ? `${fmtDateShort(e.dates[0])} – ${fmtDateShort(e.dates[n - 1])}`
          : n > 2 ? `${n} days` : "";
        // Use the accumulated per-day amounts (e.amount), which already honour
        // this shoot's rounding mode via calcForDisplay (favourable = each line
        // ceil'd up per day). Recomputing qty×rate here would discard that
        // rounding, so the invoice total would disagree with the notes / day
        // totals. In Exact mode e.amount === qty×rate, so this is a no-op there.
        return { id: uid(), label: e.label, detail, qty: e.qty, rate: e.rate, amount: e.amount, discountedQty: null, isExpense: e.isExpense };
      });
    }

    function buildDefaultNotes(production, userPrefs, userCrewId) {
      const crewMember = (production.crew || []).find(c => c.id === userCrewId);
      if (!crewMember) return "";
      const myDays = (production.days || []).filter(d => d.crewId === userCrewId);
      // Strip the generateCrewText trailing "—\nGenerated with TimeMachine ..." tagline:
      // the invoice editor shows the notes verbatim, and the print/PDF view carries the
      // brand in its own footer — share-text callers of generateCrewText still keep theirs.
      return generateCrewText(crewMember, myDays, production)
        .replace(/\n+—\nGenerated with TimeMachine[^\n]*/g, '')
        .trimEnd();
    }

    // The client/job fields shared between a production (single source) and its
    // invoices. An invoice snapshots these — frozen on send, re-synced live for
    // drafts. Bill-To name comes from production.prodCo (production.toName is a
    // deprecated, back-compat-read-only fallback).
    function clientFieldsFromProduction(production) {
      return {
        jobTitle: production.title ?? "",
        toName: production.prodCo ?? production.toName ?? "",
        toAddress: production.toAddress ?? "",
        toEmail: production.invoicingEmail ?? "",
        ccEmail: production.ccEmail ?? "",
        jobReference: production.jobReference ?? "",
      };
    }

    // Inverse of clientFieldsFromProduction: invoice snapshot field -> production
    // field. Drives the draft write-through (editing a draft's client/job field
    // updates the production, the single source).
    const INVOICE_TO_PRODUCTION_FIELD = { jobTitle: "title", toName: "prodCo", toAddress: "toAddress", toEmail: "invoicingEmail", ccEmail: "ccEmail", jobReference: "jobReference" };

    // Freeze-on-send: when a DRAFT becomes sent/paid, snapshot the production's
    // current shared client/job fields onto the invoice. No-op for any other
    // transition (so re-sending an already-issued invoice keeps its edited snapshot).
    function freezeOnSend(production, currentInvoice, patch) {
      const becomingIssued = (patch.status === "sent" || patch.status === "paid") && currentInvoice?.status === "draft";
      return becomingIssued ? { ...patch, ...clientFieldsFromProduction(production) } : patch;
    }

    function createNewInvoice(production, setProduction, userPrefs, setUserPrefs, userCrewId) {
      const crewMember = (production.crew || []).find(c => c.id === userCrewId);
      const prefix = userPrefs.invoicePrefix || "INV-";
      const num = userPrefs.invoiceNextNumber || 1;
      const invoiceNumber = `${prefix}${String(num).padStart(3, '0')}`;
      const today = todayISO();
      const dueDate = addDays(today, Number(userPrefs.paymentTermsDays) || 30);
      const lineItems = buildInvoiceLineItems(production, userPrefs, userCrewId);
      const notes = buildDefaultNotes(production, userPrefs, userCrewId);
      const newId = uid();
      const invoice = {
        id: newId,
        userCrewId,
        invoiceNumber,
        invoiceDate: today,
        dueDate,
        ...clientFieldsFromProduction(production),
        jobRole: crewMember?.role ?? "",
        shootDateStart: production.startDate ?? "",
        shootDateEnd: (() => {
          const dates = (production.days || []).map(d => d.date).filter(Boolean).sort();
          return dates[dates.length - 1] ?? "";
        })(),
        fromName: userPrefs.legalName || userPrefs.displayName || "",
        fromCompanyName: userPrefs.fromCompanyName || "",
        fromAddress: userPrefs.fromAddress || "",
        fromEmail: userPrefs.fromEmail || "",
        bankName: userPrefs.bankName || "",
        bankAccountName: userPrefs.bankAccountName || "",
        bankAccountNumber: userPrefs.bankAccountNumber || "",
        bankSortCode: userPrefs.bankSortCode || "",
        bankIBAN: userPrefs.bankIBAN || "",
        bankSWIFT: userPrefs.bankSWIFT || "",
        vatRegistered: crewMember?.vatRegistered ?? userPrefs.vatRegistered ?? false,
        vatRate: crewMember?.vatRate ?? userPrefs.vatRate ?? 20,
        vatNumber: userPrefs.vatNumber || "",
        // Snapshot the shoot's rounding mode so the invoice's display matches the
        // amounts baked into its line items (Favourable = clean Description + Amount).
        roundingMode: roundingModeOf(production),
        favourableRounding: roundingFav(production),
        // Logo is NOT snapshotted per-invoice — read from userPrefs at render time to avoid
        // duplicating ~500KB of base64 data into every invoice (iOS Safari 5MB localStorage cap).
        lineItems,
        notes,
        showIndividualExpenses: false,
        linesEdited: false,
        status: "draft",
        createdAt: new Date().toISOString(),
      };
      setProduction(p => ({ ...p, invoices: [...(p.invoices || []), invoice] }));
      setUserPrefs(prev => ({ ...prev, invoiceNextNumber: num + 1 }));
      return newId;
    }

    function resolveCrewForDay(resolvedDay, crewMember) {
      if (!resolvedDay?.stepUpRole) return crewMember;
      return {
        ...crewMember,
        role: resolvedDay.stepUpRole || crewMember.role,
        bdr: Number(resolvedDay.stepUpBDR) || crewMember.bdr,
        otCoef: Number(resolvedDay.stepUpOTCoef) || crewMember.otCoef,
        otRate: resolvedDay.stepUpOTRate ?? null,
      };
    }

    function applyRateRounding(calc) {
      if (calc.meta?.isPmpa) return calc;
      // Favourable rounding: ceil EVERY contributing line to the whole pound — rate×qty
      // lines, flat fees and penalties (missed break, late, etc.) alike, not just the
      // rate×qty ones. Math.ceil rounds a negative line (a deduction) toward zero — the
      // favourable direction (a smaller deduction = more pay) — so it never worsens one.
      // Only the line amounts round; VAT is computed downstream on the resulting subtotal.
      const lines = calc.lines.map(l => ({ ...l, amount: Math.ceil(Number(l.amount) || 0) }));
      const total = lines.reduce((s, l) => s + l.amount, 0);
      return { ...calc, lines, total };
    }


    function restHoursBetween(prevDay, currDay) {
      const prevCallH = parseHHMM(prevDay.callTime);
      const prevWrapH = parseHHMM(prevDay.wrapTime);
      const currCallH = parseHHMM(currDay.callTime);
      if (prevCallH === null || prevWrapH === null || currCallH === null) return null;
      const wrapNextDay = prevDay.wrapNextDay || prevWrapH <= prevCallH;
      const prevWrapAbs = wrapNextDay ? prevWrapH + 24 : prevWrapH;
      const daysDiff = Math.round(
        (new Date(currDay.date + "T12:00:00") - new Date(prevDay.date + "T12:00:00"))
        / (24 * 60 * 60 * 1000)
      );
      return daysDiff * 24 + currCallH - prevWrapAbs;
    }

    function findPrevDay(allDays, currDay) {
      return allDays
        .filter(d => d.crewId === currDay.crewId && d.date < currDay.date)
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0] || null;
    }

    function calcTOC(prevResolvedDay, currResolvedDay, effectiveCrew, apaRounding = false) {
      if (isPmpaRole(effectiveCrew)) return null;
      const rest = restHoursBetween(prevResolvedDay, currResolvedDay);
      if (rest === null || rest >= 11) return null;
      const bhr = computeAPArate(effectiveCrew.bdr, 1, apaRounding);
      const otRate = (effectiveCrew.otRate != null && effectiveCrew.otRate > 0) ? Number(effectiveCrew.otRate) : computeAPArate(effectiveCrew.bdr, Number(effectiveCrew.otCoef) || 1, apaRounding);
      // APA §5: crew may be engaged for up to 1 hour of TOC per break. The
      // penalty pay is therefore capped at 1h × OT rate regardless of how
      // far below the 11h floor the rest dropped. isBreach (rest < 10h)
      // continues to surface as a separate contractual-floor warning.
      const tocHours = Math.min(1, ceilHalf(11 - rest));
      return { restHours: rest, tocHours, isBreach: rest < 10, otRate, amount: tocHours * otRate };
    }

    function getDayDefaults(production, date) {
      return production.dayDefaults?.[date] ?? null;
    }

    function addMinutesToTime(hhmm, mins) {
      const start = parseHHMM(hhmm);
      if (start === null) return '';
      const total = Math.round(start * 60) + Number(mins || 0);
      const h = Math.floor((total / 60) % 24);
      const m = ((total % 60) + 60) % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function setDayDefault(production, date, field, value) {
      const existingDefaults = production.dayDefaults?.[date] ?? {
        callTime: DEFAULT_PRODUCTION_DAY.callTime,
        wrapTime: DEFAULT_PRODUCTION_DAY.wrapTime,
        lunchStartTime: DEFAULT_PRODUCTION_DAY.lunchStartTime,
        lunchDurationMins: DEFAULT_PRODUCTION_DAY.lunchDurationMins,
        dayType: DEFAULT_PRODUCTION_DAY.dayType,
        preCallTime: '',
        miles: 0,
        travelOutMins: 0, travelBackMins: 0,
        perDiemAmount: 0,
        expenses: [],
      };
      const newDefaults = { ...existingDefaults, [field]: value };
      // If callTime is being set and no explicit wrapTime exists yet for this
      // date, derive wrap = call + 11h so future-dated days don't render with
      // an empty wrap. Writing wrapTime alone never touches callTime.
      if (field === 'callTime' && !production.dayDefaults?.[date]?.wrapTime) {
        const derivedWrap = addMinutesToTime(value, 660);
        if (derivedWrap) newDefaults.wrapTime = derivedWrap;
      }

      let newDays = production.days || [];
      const userCrewId = production.crew?.[0]?.id;
      if (userCrewId) {
        const hasUserRecord = newDays.some(d => d.date === date && d.crewId === userCrewId);
        if (!hasUserRecord) {
          // V4-5h-14 (F4.3): omit time fields so resolveDay cascades from dayDefaults.
          // Explicit copies here would freeze the new record against later dept-default edits.
          const seed = {
            ...makeBlankDay(userCrewId),
            date,
          };
          newDays = [...newDays, seed];
        }
      }

      return {
        ...production,
        dayDefaults: { ...(production.dayDefaults || {}), [date]: newDefaults },
        days: newDays,
      };
    }

    // V4-5h-11: applyDayDefaultsToAllCrew removed. Time-field cascade now happens
    // automatically via resolveDay when day record field is undefined. Editing a
    // dept-default time field flows through to non-overriding crew with no manual apply.

    function calcForDisplay(production, day, crewMember, prevDay = null) {
      const resolved = resolveDay(production, day, crewMember);
      const effectiveCrew = resolveCrewForDay(resolved, crewMember);
      let calc;
      try {
        calc = augmentCalc(calculateDay(resolved, effectiveCrew, { ...production, apaRounding: roundingApa(production) }), resolved, crewMember);
      } catch (err) {
        // Fail safe: a corrupt/legacy day (e.g. an unknown dayType) must not crash
        // the many render sites that call calcForDisplay. Return a zero day + note.
        calc = { meta: { workedHrs: 0, otHrs: 0, bhr: 0, otRate: 0, dayLabel: "—",
          notes: ["Couldn't calculate this day — check its details."],
          secondBreakRequired: false, continuousDay: false, isBankHoliday: false, bankHolidayName: null },
          lines: [], total: 0 };
      }
      if (prevDay) {
        const prevResolved = resolveDay(production, prevDay, crewMember);
        const toc = calcTOC(prevResolved, resolved, effectiveCrew, roundingApa(production));
        if (toc) {
          const isBreach = toc.isBreach;
          const tocLine = {
            label: isBreach ? "Time Off The Clock (BREACH)" : "Time Off The Clock",
            detail: `${isBreach ? 'BREACH: ' : ''}${toc.restHours.toFixed(1)}h rest · ${toc.tocHours.toFixed(1)}h TOC`,
            rate: toc.otRate, qty: toc.tocHours, amount: toc.amount,
            isTOC: true, isBreach,
          };
          calc = { ...calc, lines: [...calc.lines, tocLine], total: calc.total + toc.amount };
        }
      }
      const useFavourableRounding = roundingFav(production);
      const finalCalc = useFavourableRounding ? applyRateRounding(calc) : calc;
      return {
        ...finalCalc,
        // dayType is the BOOKED type (resolved via the cascade), NOT the
        // calc engine's effectiveDayType — a DoP's Prep day stays "Prep Day"
        // in stats even though it's paid as a Shoot under the BWD override.
        meta: { ...finalCalc.meta, isElevenHourDay: !!production?.isElevenHourDay, dayType: resolved.dayType },
      };
    }

    function generateCrewText(crewMember, entries, production) {
      const lines = [];
      lines.push(`${(crewMember.name || '').toUpperCase()} — ${crewMember.role}`);
      if (production.title) lines.push(production.title);
      if (production.prodCo) lines.push(production.prodCo);
      lines.push('');
      const sorted = [...entries].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      let grandTotal = 0;
      let prevEntry = null;
      sorted.forEach((d) => {
        const calc = calcForDisplay(production, d, crewMember, prevEntry);
        grandTotal += calc.total;
        const stepUpNote = d.stepUpRole ? ` — Stepped up: ${d.stepUpRole}` : '';
        lines.push(`${fmtDateShort(d.date)} (${weekday(d.date)})${calc.meta.continuousDay ? ' — CWD' : ''}${stepUpNote}`);
        calc.lines.forEach((l) => lines.push(formatLineText(l)));
        lines.push(`Day total: ${fmtGBP(calc.total)}`);
        lines.push('');
        prevEntry = d;
      });
      lines.push(`TOTAL: ${fmtGBP(grandTotal)}`);
      lines.push('');
      lines.push('—');
      lines.push('Generated with TimeMachine · timemachineapp.co.uk');
      return lines.join('\n');
    }

    // When an invoice has been created for this crew member, prefer its snapshot
    // VAT settings over the live crew record so day-text VAT matches the invoice
    // even after the crew's VAT settings are edited later. Returns null if there
    // is no matching invoice (new invoices link by userCrewId; older invoices —
    // created before the link existed — fall back to a jobRole match).
    function invoiceVATSnapshot(production, crewMember) {
      if (!crewMember) return null;
      const invs = production?.invoices || [];
      const match = [...invs].reverse().find(i => i.userCrewId === crewMember.id)
        || [...invs].reverse().find(i => i.userCrewId == null && i.jobRole === crewMember.role);
      return match ? { vatRegistered: match.vatRegistered, vatRate: match.vatRate } : null;
    }

    function crewVAT(crewMember, subtotal, vatSource) {
      const src = vatSource || crewMember;
      if (!src?.vatRegistered) return { vatAmount: 0, totalIncVAT: subtotal };
      const rate = Number(src.vatRate) || 20;
      const vatAmount = subtotal * rate / 100;
      return { vatAmount, totalIncVAT: subtotal + vatAmount };
    }

    function generateDayText(day, crewMember, production, allDays = null) {
      const prevDay = allDays ? findPrevDay(allDays, day) : null;
      const calc = calcForDisplay(production, day, crewMember, prevDay);
      const lines = [];
      lines.push(`${crewMember.name} — ${crewMember.role}`);
      const stepUpNote = day.stepUpRole ? ` — Stepped up: ${day.stepUpRole}` : '';
      lines.push(`${fmtDateShort(day.date)} (${weekday(day.date)})${calc.meta.continuousDay ? ' — CWD' : ''}${stepUpNote}`);
      lines.push('');
      calc.lines.forEach((l) => lines.push(formatLineText(l)));
      lines.push('');
      const vatSource = invoiceVATSnapshot(production, crewMember) || crewMember;
      const { vatAmount, totalIncVAT } = crewVAT(crewMember, calc.total, vatSource);
      if (vatSource.vatRegistered) {
        const rate = Number(vatSource.vatRate) || 20;
        lines.push(`SUBTOTAL: ${fmtGBP(calc.total)}`);
        lines.push(`VAT (${rate}%): ${fmtGBP(vatAmount)}`);
        lines.push(`TOTAL INC. VAT: ${fmtGBP(totalIncVAT)}`);
      } else {
        lines.push(`TOTAL: ${fmtGBP(calc.total)}`);
      }
      lines.push('');
      lines.push('—');
      lines.push('Generated with TimeMachine · timemachineapp.co.uk');
      return lines.join('\n');
    }

    /* ═══════════════════════════ PRINT EXPORT HELPERS ═══════════════════════════ */

    function dayTypeChipClass(dayType) {
      const map = {
        "Shoot": "shoot", "Pre-light": "prelight", "Recce": "recce",
        "Prep Day": "prep", "Build Day": "prep",
        "De-rig": "derig", "Travel Day": "travel", "Rest Day": "rest",
      };
      return map[dayType] || "shoot";
    }

    function penaltyFlags(calc) {
      if (!calc) return {};
      const lines = calc.lines || [];
      const lbls = lines.map(l => (l.label || '').toLowerCase());
      return {
        hasOT:         (calc.meta?.otHrs || 0) > 0,
        hasL1:         lbls.some(l => l === "late 1st break"),
        hasL2:         lbls.some(l => l.startsWith("late 2nd break")),
        hasMSB:        lbls.some(l => l === "missed 2nd break"),
        hasCWD:        !!calc.meta?.continuousDay,
        hasTOC:        lines.some(l => l.isTOC === true),
        isNightShoot:  (calc.meta?.dayLabel || "").includes("Night Shoot"),
        isBankHoliday: !!calc.meta?.isBankHoliday,
      };
    }

    function getMonday(dateStr) {
      const d = new Date(dateStr + "T12:00:00");
      const dow = d.getDay();
      d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
      return d.toISOString().slice(0, 10);
    }

    // Returns string[][] — each inner array is 7 ISO date strings Mon–Sun.
    // Used by DaysManager grid headers.
    function deriveWeeks(production, days) {
      const mondays = new Set(production.weekStarts || []);
      const allDayDates = [...days.map(d => d.date), ...(production.gridDates || [])];
      for (const date of allDayDates) mondays.add(getMonday(date));
      if (mondays.size === 0) return [];
      return [...mondays].sort().map(mon => {
        const d = new Date(mon + "T12:00:00");
        return Array.from({ length: 7 }, (_, i) => {
          const day = new Date(d);
          day.setDate(d.getDate() + i);
          return day.toISOString().slice(0, 10);
        });
      });
    }

    // Returns {index, start, end, label}[] — used by ExportTab and TimesheetPage.
    function computeWeeks(production, days) {
      if (production.weekStarts?.length > 0) {
        return [...production.weekStarts].sort().map((mondayISO, idx) => {
          const sun = new Date(mondayISO + "T12:00:00");
          sun.setDate(sun.getDate() + 6);
          return { index: idx, start: mondayISO, end: sun.toISOString().slice(0, 10),
                   label: `Week ${String(idx + 1).padStart(2, '0')}` };
        });
      }
      if (!days || days.length === 0) return [];
      const sorted = days.map(d => d.date).filter(Boolean).sort();
      const firstMon = getMonday(sorted[0]);
      const latest = sorted[sorted.length - 1];
      const weeks = [];
      let cursor = firstMon, idx = 0;
      while (cursor <= latest) {
        const sun = new Date(cursor + "T12:00:00");
        sun.setDate(sun.getDate() + 6);
        weeks.push({ index: idx, start: cursor, end: sun.toISOString().slice(0, 10),
                     label: `Week ${String(idx + 1).padStart(2, '0')}` });
        const next = new Date(cursor + "T12:00:00");
        next.setDate(next.getDate() + 7);
        cursor = next.toISOString().slice(0, 10);
        idx++;
      }
      return weeks;
    }

    // Returns array of 7 ISO date strings Mon–Sun for the week containing mondayISO
    function weekDateRange(mondayISO) {
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(mondayISO + "T12:00:00");
        d.setDate(d.getDate() + i);
        return d.toISOString().slice(0, 10);
      });
    }

      /* ══════════ GRID LAYOUT ══════════ */
